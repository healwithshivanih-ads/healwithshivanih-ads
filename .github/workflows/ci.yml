name: web-ci

# Gate for the coach/client web app (fm-database-web). Runs the checks that
# were previously only run by hand — and that the build used to skip
# (typescript.ignoreBuildErrors was `true`). type-check + tests + build +
# lint are all BLOCKING. The historical warning backlog was burned down to
# zero, so lint now runs with --max-warnings 0 to keep it there: any new
# warning fails the gate. Silence a genuine false positive at the source
# with `// eslint-disable-next-line <rule> -- reason`, not by relaxing this.

on:
  push:
    branches: [main]
    paths:
      - "fm-database-web/**"
      # 10+ web suites shell into the Python catalogue (somatic, menu-hygiene,
      # prospects-sweep, recipe-*). A catalogue-only change can therefore break
      # web-ci — so it MUST trigger this workflow, or the breakage lands
      # silently and gets blamed on the next unrelated web commit.
      - "fm-database/data/**"
      - "fm-database/fmdb/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "fm-database-web/**"
      - "fm-database/data/**"
      - "fm-database/fmdb/**"
      - ".github/workflows/ci.yml"

defaults:
  run:
    working-directory: fm-database-web

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: fm-database-web/package-lock.json

      # Several suites (menu-hygiene, recipe-generation-skip, prospects-sweep)
      # drive the real Python modules. Locally that is the repo venv, which is
      # untracked and so does not exist here — the tests fall back to python3 on
      # PATH, which CI must therefore provide along with the deps those modules
      # import: pyyaml (recipe + home-remedy catalogue) and pydantic
      # (fmdb.plan.models, pulled in transitively by prospects + storage).
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Python deps for the Python-backed tests
        run: pip install pyyaml pydantic

      # --include=dev is required: Tailwind v4's postcss plugin lives in
      # devDependencies and is needed even for a production build.
      - name: Install
        run: npm ci --include=dev

      - name: Type-check (blocking)
        run: npm run type-check

      - name: Tests (blocking)
        run: npm test

      - name: Build (blocking — type errors now fail here too)
        run: npm run build

      - name: Lint (blocking — warnings fail CI)
        run: npm run lint -- --max-warnings 0
