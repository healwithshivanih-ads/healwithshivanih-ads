name: web-ci

# Gate for the coach/client web app (fm-database-web). Runs the checks that
# were previously only run by hand — and that the build used to skip
# (typescript.ignoreBuildErrors was `true`). type-check + tests + build are
# BLOCKING; lint is advisory for now (no ESLint baseline existed historically,
# so it reports without failing the gate until the backlog is burned down).

on:
  push:
    branches: [main]
    paths:
      - "fm-database-web/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "fm-database-web/**"
      - ".github/workflows/ci.yml"

defaults:
  run:
    working-directory: fm-database-web

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: fm-database-web/package-lock.json

      # Several suites (menu-hygiene, recipe-generation-skip, prospects-sweep)
      # drive the real Python modules. Locally that is the repo venv, which is
      # untracked and so does not exist here — the tests fall back to python3 on
      # PATH, which CI must therefore provide along with the deps those modules
      # import: pyyaml (recipe + home-remedy catalogue) and pydantic
      # (fmdb.plan.models, pulled in transitively by prospects + storage).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python deps for the Python-backed tests
        run: pip install pyyaml pydantic

      # --include=dev is required: Tailwind v4's postcss plugin lives in
      # devDependencies and is needed even for a production build.
      - name: Install
        run: npm ci --include=dev

      - name: Type-check (blocking)
        run: npm run type-check

      - name: Tests (blocking)
        run: npm test

      - name: Build (blocking — type errors now fail here too)
        run: npm run build

      - name: Lint (advisory)
        run: npm run lint
        continue-on-error: true
