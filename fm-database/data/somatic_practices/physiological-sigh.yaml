slug: physiological-sigh
display_name: Physiological Sigh
category: breath
body_region: chest_diaphragm
position: any_position
summary: Inhale through the nose, pause, then add a second short top-up inhale to
  fully inflate the lungs, before releasing a slow, complete exhale through the mouth.
  Repeat five times.
why_it_works: The double inhale re-inflates collapsed alveoli, increasing oxygen-carbon
  dioxide exchange efficiency. The extended exhale then activates the parasympathetic
  brake via the baroreflex, rapidly reducing heart rate and clearing circulating stress
  chemistry.
steps:
- label: First inhale
  cue: Breathe in steadily through your nose until your lungs feel mostly full.
  action: expand
  secs: 3
- label: Second inhale
  cue: Without exhaling, take one more short, sharp sniff in through the nose to top
    the lungs all the way up.
  action: expand
  secs: 1
- label: Slow exhale
  cue: Release a long, slow exhale through your mouth until your lungs feel completely
    empty.
  action: release
  secs: 6
- label: Repeat
  cue: Pause briefly, then repeat for a total of five cycles.
  action: rest
  secs: 50
reps: 5
duration_seconds: 60
timed: true
bilateral: false
contraindications:
- Uncontrolled asthma or severe COPD — avoid forced inhalation techniques without
  clinician guidance
- Recent pneumothorax
linked_to_symptoms:
- anxiety
- stress
- breathing-irregularity
linked_to_topics:
- nervous-system-regulation
- breathwork-for-health
notes_for_coach: Well-studied in the Huberman Lab research context as a rapid autonomic
  downregulator. Simple enough to use mid-conversation with a client.
