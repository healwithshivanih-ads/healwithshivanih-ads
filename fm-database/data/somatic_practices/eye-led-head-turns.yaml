slug: eye-led-head-turns
display_name: Eye-Led Head Turns
category: movement
body_region: throat_neck
position: seated
summary: The eyes initiate movement first, drawing the head to follow gently, restoring
  range of motion without forcing or straining the neck.
why_it_works: Leading movement with the eyes activates the oculomotor reflex, which
  softens protective muscular bracing in the cervical spine, allowing the head to
  rotate without triggering the threat response that rigid, forced stretching can
  provoke.
steps:
- label: Eyes Left
  cue: Keep your head completely still. Move only your eyes as far to the left as
    is comfortable.
  action: observe
  secs: 5
- label: Head Follows
  cue: Allow your head to slowly follow your gaze to the left, stopping before any
    point of strain.
  action: circle
  secs: 5
- label: Return to Centre
  cue: Gently bring both your eyes and head back to facing forward.
  action: release
  secs: 4
- label: Eyes Right
  cue: Move only your eyes as far to the right as is comfortable, head still.
  action: observe
  secs: 5
- label: Head Follows Right
  cue: Let your head follow your gaze to the right, slowly and without forcing.
  action: circle
  secs: 5
- label: Return to Centre
  cue: Bring your eyes and head back to centre. That is one round. Repeat for a total
    of 4–5 rounds.
  action: release
  secs: 4
reps: 5
duration_seconds: 140
timed: true
bilateral: true
contraindications:
- Acute cervical injury or fracture — seek medical clearance first
- Severe vertigo or BPPV — modified only under physiotherapy guidance
linked_to_symptoms:
- muscle-tension
- morning-stiffness
linked_to_topics:
- thyroid-dysfunction
notes_for_coach: Instruct client to stay well within their comfortable range. The
  key principle is that the eyes lead, not the neck. No forcing.
aliases: []
equipment: []
motion_shape: ''
sensitivity: general
evidence_tier: fm_specific_thin
sources:
