slug: chest-stroking-with-breath
display_name: Chest Stroking with Breath
category: touch
body_region: chest_diaphragm
position: seated
summary: A slow, rhythmic self-touch practice stroking downward over the chest combined with measured
  breathing to stimulate vagal pathways involved in milk let-down.
why_it_works: Downward stroking over the sternum and pectorals activates cutaneous vagal afferents.
  The parasympathetic activation this promotes supports oxytocin release, which is a prerequisite
  for milk let-down. The rhythm and direction of the strokes also provide proprioceptive cues that
  orient the nervous system toward nurturance rather than threat.
steps:
- label: Settle in
  cue: Sit comfortably. If possible, have your baby nearby or resting against your skin.
  action: rest
  secs: 20
- label: Place fingertips
  cue: Rest the fingertips of both hands lightly at your collarbones, just below your neck.
  action: rest
  secs: 10
- label: Begin stroking
  cue: Draw one hand slowly downward over your chest toward your belly. As that hand nears the bottom,
    begin the same stroke with the other hand from the collarbone. Keep the movement continuous, like
    water flowing down a surface.
  action: massage
  secs: 15
- label: Synchronise breath
  cue: Breathe in slowly as one hand starts its journey, and breathe out as it completes it. Let your
    breathing and the stroking find a shared, unhurried rhythm.
  action: expand
  secs: 0
- label: Continue
  cue: Keep stroking and breathing this way for 3 to 5 minutes, staying soft and present.
  action: massage
  secs: 235
duration_seconds: 280
timed: true
