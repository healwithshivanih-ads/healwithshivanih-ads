bilateral: false
motion_shape: ''
sensitivity: general
evidence_tier: fm_specific_thin
sources:
- id: klein-body-remembers
  location: 82. Recurrent Miscarriage — SOMATIC RESET
  quote: Sit or lie down. Place both hands on your lower belly. Breathe in slowly.
    On the exhale, let a low sound come from deep in your body. Not from your throat;
    from your belly. It might sound like a moan, a hum, a cry. Don't shape it. Let
    it be whatever it is. Continue for 3-5 minutes.
