notes_for_coach: Sourced from entry 35 (Frozen Shoulder). This is Peter Levine's pendulation
  technique from Somatic Experiencing. Keep the pace client-led; never push through
  a frozen sensation. Ideal as a bridge before movement work.
aliases: []
motion_shape: ''
sensitivity: general
evidence_tier: fm_specific_thin
sources:
- id: klein-body-remembers
  location: Entry 35 — Frozen Shoulder, SOMATIC RESET
  quote: Sit comfortably and close your eyes. Notice where your shoulder feels stuck,
    tight, or frozen. Stay with that sensation for a few breaths. Then shift your
    attention to a part of your body that feels okay—neutral or even pleasant. Breathe
    there. Then, gently shift back to the shoulder. Move your attention back and forth
    between frozen and okay, 5-6 times.
