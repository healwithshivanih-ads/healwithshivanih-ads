slug: pendulation
display_name: Pendulation
category: imagery
body_region: whole_body
position: seated
summary: An internal attention practice in which awareness is gently moved back and
  forth between a site of discomfort and a neutral or pleasant area of the body, allowing
  the nervous system to titrate between constriction and ease.
why_it_works: Derived from Peter Levine's Somatic Experiencing work, pendulation works
  by preventing the nervous system from becoming overwhelmed by a single focal point
  of held tension. Alternating between a resource (comfort) and a challenge (constriction)
  gradually widens the window of tolerance and supports completion of interrupted
  stress responses.
steps:
- label: Settle in
  cue: Find a comfortable seated position and gently close your eyes.
  secs: 15
  action: rest
- label: Locate the restriction
  cue: Bring your attention to your shoulder — notice any area that feels stuck, tight,
    or frozen. Simply observe without trying to change it.
  secs: 30
  action: observe
- label: Find the resource
  cue: Now shift your attention to another area of your body that feels neutral or
    even comfortable — a hand, your feet on the floor, or anywhere that feels okay.
    Breathe gently into that area.
  secs: 30
  action: observe
- label: Pendulate
  cue: Slowly move your attention back to the shoulder, then back to the comfortable
    area. Continue shifting back and forth at your own pace, five to six times.
  secs: 120
  action: observe
- label: Rest and notice
  cue: Let your attention soften and return to your whole body. Sit quietly and notice
    anything that has shifted.
  secs: 30
  action: rest
reps: 6
duration_seconds: 225
timed: true
bilateral: false
equipment: []
contraindications:
- Active dissociative episodes — refer to trauma therapist before using
- Acute psychiatric crisis
