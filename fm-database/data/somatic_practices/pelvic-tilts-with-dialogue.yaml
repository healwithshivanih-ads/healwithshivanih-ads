sources:
- id: klein-body-remembers
  location: 84. Breech Baby — SOMATIC RESET
  quote: Come to hands and knees. Gently arch your back (cow pose), then round it (cat pose). Move
    slowly between the two. As you move, talk to your baby out loud. Tell them it's safe to turn.
    Tell them you're ready. Tell them what you're afraid of. Tell them the truth. Continue for 5-10
    minutes.
