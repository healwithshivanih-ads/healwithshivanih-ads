linked_to_symptoms:
- stress
- low-mood
notes_for_coach: For clients who cannot go outside easily, a large indoor plant, a window with a view,
  or a photograph of a vast landscape can substitute, though outdoor natural settings have stronger
  evidence for awe induction.
