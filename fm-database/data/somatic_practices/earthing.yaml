slug: earthing
display_name: Earthing
aliases: []
category: orientation
body_region: legs_feet
position: standing
summary: Five to ten minutes standing barefoot on natural ground.
why_it_works: Barefoot contact with cool ground provides steady, novel, non-threatening
  sensory input through the soles, and the outdoor setting itself reliably lowers
  arousal.
steps:
- label: Get outside
  cue: Go outside barefoot and stand on grass, soil or sand.
  secs: 40
  action: rest
- label: Feel the ground
  cue: Notice the temperature and texture under your feet. Let the coolness register.
  secs: 120
  action: observe
- label: Breathe slowly
  cue: Stay and breathe unhurriedly. Nothing else to do.
  secs: 240
  action: rest
reps: null
duration_seconds: 400
bilateral: false
timed: true
equipment: []
motion_shape: ''
contraindications:
- Diabetes or peripheral neuropathy — check the ground for sharps first and inspect
  the feet after; an insensate foot will not report an injury
- Open wounds on the feet
- Avoid where ground is contaminated
sensitivity: general
linked_to_symptoms: []
linked_to_topics:
- chronic-inflammation
notes_for_coach: The neuropathy caution matters. Diabetic clients should do this on
  a checked, clean surface only.
sources:
