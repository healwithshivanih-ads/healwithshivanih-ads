slug: lateral-jaw-tracking-small-range
display_name: Lateral Jaw Tracking (Small Range)
category: movement
body_region: jaw
position: any_position
summary: Tiny, controlled side-to-side jaw glides performed with lips closed to gently
  restore mobility and neurological safety to a guarded temporomandibular joint.
why_it_works: TMJ pain frequently involves protective neuromuscular guarding — the
  masseters and pterygoids brace against anticipated pain. Small-amplitude lateral
  glides are below the threshold that triggers the guarding reflex, gradually recalibrating
  the motor map without provoking defence, and restoring proprioceptive input to the
  joint.
steps:
- label: Set lips
  cue: Allow your lips to rest together lightly, teeth just apart — no biting or clenching.
  action: rest
  secs: 5
- label: Slide left
  cue: Very gently glide your lower jaw a few millimetres toward the left — think
    of it as a whisper of a movement, not a stretch.
  action: circle
  secs: 4
- label: Return to centre
  cue: Bring the jaw back to its neutral resting position.
  action: release
  secs: 3
- label: Slide right
  cue: Glide the jaw the same small distance toward the right.
  action: circle
  secs: 4
- label: Return to centre
  cue: Return to neutral and notice any change in sensation.
  action: release
  secs: 3
reps: 5
duration_seconds: 95
timed: true
bilateral: true
contraindications:
- Stop if movement reproduces sharp pain; rule out disc displacement before use
- Acute TMJ inflammation — consult a physiotherapist first
linked_to_symptoms:
- jaw-tension
- teeth-grinding
linked_to_topics: []
notes_for_coach: The movement should be barely visible from the outside. Emphasise
  to client that micro-movement is the goal, not range.
