slug: butterfly-hug
display_name: Butterfly Hug
aliases: []
category: touch
body_region: chest_diaphragm
position: seated
summary: Slow alternating chest tapping with crossed arms, for two to three minutes.
why_it_works: Slow alternating bilateral tapping is a well-established self-soothing technique from
  trauma practice; the rhythm and the crossing of the midline together reduce arousal.
steps:
- label: Cross your arms
  cue: Cross your arms over your chest, hands resting near your collarbones.
  secs: 20
  action: touch
- label: Begin tapping
  cue: Tap alternately — right, left, right, left — slow and even.
  secs: 60
  action: tap
- label: Find the rhythm
  cue: Keep it unhurried. Breathe slowly alongside the tapping.
  secs: 90
  action: tap
- label: Slow to stop
  cue: Let the tapping gradually slow and stop. Sit for a moment.
  secs: 30
  action: rest
reps: null
duration_seconds: 200
bilateral: true
timed: true
equipment: []
motion_shape: continuous_travel
contraindications:
- Stop if tapping raises distress rather than settling it — for some trauma histories bilateral work
  needs a therapist present
sensitivity: general
linked_to_symptoms: []
linked_to_topics:
- acne-vulgaris
notes_for_coach: Distinct from cross-lateral-hand-taps, which taps thigh to opposite hand; this is
  chest-based and self-holding.
