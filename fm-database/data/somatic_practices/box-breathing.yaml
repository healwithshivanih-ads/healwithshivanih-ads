notes_for_coach: This practice is widely validated for autonomic regulation and is very accessible.
  Clients prone to breath-holding anxiety may initially prefer a 3-count to ease in. Used regularly
  before meals, it can reduce stress-triggered gut hypermotility.
contraindications:
- Uncontrolled breath-holding may raise intrathoracic pressure — use with caution in uncontrolled
  hypertension
