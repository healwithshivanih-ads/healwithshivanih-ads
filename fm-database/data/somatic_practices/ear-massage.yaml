slug: ear-massage
display_name: Ear Massage
category: touch
body_region: head_face
position: any_position
summary: A bilateral auricular massage technique in which the entire outer ear is worked with thumb
  and forefinger pressure, stimulating vagus nerve endings distributed throughout the ear to shift
  the nervous system toward a parasympathetic, rest-and-digest state.
why_it_works: The outer ear is densely innervated by the auricular branch of the vagus nerve. Gentle
  mechanical stimulation of this surface activates afferent vagal signalling, increasing parasympathetic
  tone and lowering sympathetic drive — signalling to the gut that it is safe to receive nourishment.
steps:
- label: Begin at the earlobe
  cue: Using the pad of your thumb and the pad of your index finger, take your earlobe between them
    and apply firm but comfortable pressure. Gently roll and massage the lobe for a moment.
  action: massage
  secs: 30
- label: Work up the outer rim
  cue: Move slowly up along the outer rim (helix) of your ear, massaging in small circles as you go
    from the lobe all the way to the top of the ear.
  action: massage
  secs: 30
- label: Massage the inner curves
  cue: Use your fingertip to trace and press along the ridges and hollows of the inner ear — the antihelix,
    the concha. Apply gentle but firm pressure wherever you feel tension.
  action: massage
  secs: 30
- label: Breathe slowly throughout
  cue: Throughout the massage keep your breathing slow and even. Let each exhale be unhurried.
  action: rest
  secs: 30
- label: Switch to the other ear
  cue: Repeat the full sequence on your other ear — lobe, outer rim, inner curves — for the same amount
    of time.
  action: massage
  secs: 120
timed: true
duration_seconds: 240
bilateral: true
