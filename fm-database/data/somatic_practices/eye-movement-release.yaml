notes_for_coach: This practice is inspired by EMDR principles but is not a substitute for clinical
  EMDR therapy. Clients with diplopia, nystagmus, or recent eye surgery should omit. If a client reports
  dizziness, reduce the range of eye movement.
contraindications:
- Recent eye surgery
- Diplopia (double vision)
- Severe nystagmus
- Active vertigo
