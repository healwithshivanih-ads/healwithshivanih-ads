notes_for_coach: If a client struggles to find a safe-place image (history of trauma, no safe environment),
  offer 'a place in nature you find beautiful' or an imagined peaceful landscape. Do not push past
  resistance.
contraindications:
- Clients with severe dissociation or complex PTSD should only do this with a trained trauma therapist
  present
