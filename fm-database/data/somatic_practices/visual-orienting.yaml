slug: visual-orienting
display_name: Visual Orienting — Name Five Things
category: orientation
body_region: head_face
position: any_position
summary: Slowly rotate the head and deliberately name five visible objects in the surrounding environment,
  giving each one full visual attention before moving to the next.
why_it_works: Orienting activates the ventral vagal circuit by signalling that the present environment
  does not contain a threat. Naming objects aloud adds a prefrontal cortex engagement layer (word
  retrieval) that further interrupts fight-flight-freeze arousal and reduces the experiential experience
  of cognitive cloudiness.
steps:
- label: Begin scanning
  cue: Slowly turn your head and let your gaze fall on one object in the space around you.
  action: observe
  secs: 10
- label: Name it
  cue: Say the name of the object out loud — or in a quiet voice if that is easier. Take a breath.
  action: observe
  secs: 5
- label: Find four more
  cue: Continue rotating your head slowly and repeating — settle on something, name it, breathe —
    until you have named five things.
  action: observe
  secs: 75
duration_seconds: 90
timed: true
bilateral: true
contraindications:
- Acute cervical spine injury — limit head rotation
- Severe brain fog preventing speech — name objects internally instead
linked_to_symptoms:
- brain-fog
- dizziness-motion-sickness
- anxiety
- poor-concentration
linked_to_topics:
- nervous-system-regulation
- stress-management
notes_for_coach: This is distinct from the Auditory Orienting practice — it is vision-led. Both share
  the orienting mechanism but different sensory channels. Can be done mid-coaching call by asking
  client to try it with you.
aliases: []
equipment: []
motion_shape: still
sensitivity: general
evidence_tier: fm_specific_thin
