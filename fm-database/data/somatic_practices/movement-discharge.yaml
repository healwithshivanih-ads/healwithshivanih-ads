sources:
- id: klein-body-remembers
  location: 63. Liver Problems — SOMATIC RESET
  quote: 'Move your body vigorously for 5-10 minutes: walk fast, jog, dance, shake,
    whatever gets energy moving. Don''t be polite about it. Let yourself huff and
    puff. Afterward, stand still and notice the aliveness in your body.'
