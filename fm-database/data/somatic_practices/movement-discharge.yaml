slug: movement-discharge
display_name: Movement Discharge
category: discharge
body_region: whole_body
position: standing
summary: A brief bout of vigorous free movement — walking fast, jogging, dancing,
  shaking — intended to discharge accumulated anger or agitation from the body, followed
  by a period of stillness to register the resulting aliveness.
why_it_works: Sustained aerobic movement converts suppressed sympathetic arousal (fight
  energy) into metabolic output, lowering circulating adrenaline and cortisol. The
  active-to-still transition allows the nervous system to experience discharge completion
  — the hallmark of a complete stress cycle.
steps:
- label: Choose your movement
  cue: 'Pick a form of vigorous movement: fast walking, jogging, energetic dancing,
    or full-body shaking. There is no correct choice — whatever lets your body move
    forcefully.'
  action: rest
  secs: 10
- label: Move vigorously
  cue: Move your body with real effort for five to ten minutes. Do not be restrained
    about it. Let yourself breathe hard and build heat. If feelings arise, let the
    movement carry them.
  action: release
  secs: 420
- label: Stop and stand still
  cue: Come to a complete stop. Stand still with your feet shoulder-width apart. Allow
    your breathing to settle naturally.
  action: rest
  secs: 30
- label: Notice the aliveness
  cue: With your eyes open or closed, scan your whole body. Notice tingling, warmth,
    vibration, or any sense of energy moving. Stay with this for a minute or two.
  action: observe
  secs: 90
timed: true
duration_seconds: 550
bilateral: false
linked_to_topics:
- liver-detoxification
- chronic-stress
linked_to_symptoms:
- stress
- irritability
notes_for_coach: Clients with cardiovascular contraindications to vigorous exercise
  should use gentle shaking in place rather than running. Remind clients this is for
  emotional energy discharge, not fitness — the goal is to feel, not to perform.
contraindications:
- Unstable cardiovascular disease
- Acute musculoskeletal injury
- Severe osteoporosis
