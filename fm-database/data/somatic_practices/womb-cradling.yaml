category: touch
body_region: abdomen
position: lying
summary: A supine, eyes-closed practice of placing both hands over the lower abdomen with gentle warmth
  and slow breathing to communicate safety to the nervous system.
why_it_works: Slow, gentle hand contact on the body activates C-tactile afferents, which feed directly
  into the insular cortex to produce a sense of safety and reduce threat appraisal. The warmth from
  the palms also promotes local vasodilation and muscle relaxation in the lower abdominal wall.
steps:
- label: Lie down
  cue: Lie on your back on a comfortable surface with your knees bent and feet flat. Allow your whole
    body to settle.
  action: rest
  secs: 30
- label: Place hands
  cue: Bring both hands to your lower belly, just above the pubic bone. Cup them gently, as if holding
    something tender and precious.
  action: rest
  secs: 20
- label: Breathe and warm
  cue: Breathe slowly and notice warmth building beneath your palms. Let each exhale soften the tissue
    under your hands.
  action: observe
  secs: 0
duration_seconds: 350
timed: true
bilateral: false
