slug: qi-gong-lift
display_name: Qi Gong Lift
category: movement
body_region: whole_body
position: standing
summary: A slow, flowing bilateral arm-raise coordinated with breath to invite both
  sides of the body back into balanced dialogue.
why_it_works: Coordinated bilateral movement with conscious breath engages the motor
  cortex symmetrically, encourages interhemispheric integration, and shifts the nervous
  system out of habitual one-sided bracing patterns. The deliberate slow pace down-regulates
  the sympathetic nervous system.
steps:
- label: Set your stance
  cue: Stand with your feet shoulder-width apart and let a gentle bend soften your
    knees.
  action: rest
  secs: 10
- label: Inhale and lift
  cue: As you inhale, slowly raise both arms out to your sides and then up overhead,
    turning your palms to face the sky as they rise. Imagine drawing energy upward
    through your whole body.
  action: expand
  secs: 6
- label: Exhale and lower
  cue: As you exhale, slowly lower your arms back down to your sides, as though you
    are moving through water — unhurried and fluid.
  action: release
  secs: 6
reps: 10
duration_seconds: 130
timed: true
bilateral: true
contraindications:
- Shoulder impingement or recent shoulder surgery — reduce range of motion as needed
- Avoid with uncontrolled vertigo
linked_to_symptoms:
- muscle-tension
- joint-pain
linked_to_topics:
- nervous-system-regulation
notes_for_coach: Source states 10 repetitions. Total duration estimated at ~2 minutes
  including setup. Cue client to move as slowly as possible.
aliases: []
equipment: []
motion_shape: ''
sensitivity: general
evidence_tier: fm_specific_thin
