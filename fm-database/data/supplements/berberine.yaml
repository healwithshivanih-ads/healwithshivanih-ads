notes_for_coach: |-
  Berberine is an isoquinoline alkaloid from Berberis aristata, B. vulgaris,
  and goldenseal. Best-studied for blood glucose and gut antimicrobial
  effects; emerging evidence supports mast cell stabilization and
  anti-inflammatory cytokine modulation. Standardized to 97% berberine HCl.
  Typical antimicrobial/glycemic dose is 500 mg three times daily with
  meals. Short courses (8-12 weeks) preferred — long-term high-dose use may
  affect gut microbiome balance and B-vitamin absorption.

  Best used for: Good RCT and meta-analysis evidence for lowering blood sugar, insulin
  resistance and lipids (LDL and triglycerides), including in prediabetes, type 2
  diabetes and PCOS; also used short-term as a gut antimicrobial in SIBO and IBS-D
  protocols. Best for the insulin-resistant client with raised glucose, triglycerides or
  LDL; not needed when metabolic markers are normal. It adds to diabetes medicines (risk
  of low blood sugar) and changes how several drugs are metabolised, so check the
  medication list first. Avoid in pregnancy and breastfeeding, and use in cycles rather
  than indefinitely.
contraindications:
  conditions:
  - G6PD deficiency
  - jaundice in newborns
  - use with caution in high blood pressure, diabetes, glaucoma or cardiovascular disease
    (WHO Monographs Vol 4)
  medications:
  - cyclosporine — berberine raised blood levels by ~75% in renal-transplant patients (WHO
    Monographs Vol 4)
  - metformin (additive)
  - CYP3A4 substrates
  - P-glycoprotein-substrate chemotherapy such as paclitaxel — berberine upregulates the multidrug-resistance
    transporter and may reduce drug retention (WHO Monographs Vol 4)
  - Insulin and sulfonylureas (glimepiride, gliclazide) — additive glucose lowering; hypoglycaemia
    risk
  - Narrow-therapeutic-index CYP2D6/CYP2C9 substrates — berberine inhibits these enzymes in
    human studies; review co-medication
  life_stages:
  - pregnancy
  - lactation
