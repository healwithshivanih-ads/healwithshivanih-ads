contraindications:
  conditions:
  - Any oral/internal use — camphor is toxic when swallowed (seizures; ingestion of ~1 g can
    be fatal in children)
  - Seizure disorder/epilepsy — camphor lowers seizure threshold
  - Broken or damaged skin — increased absorption and toxicity
  medications: []
  life_stages:
  - infants and children under 2 — do not apply to or near the face/nose (airway irritation,
    toxicity)
  - pregnancy — avoid (crosses placenta; toxicity reports)
  - breastfeeding — do not apply to breast/chest area
