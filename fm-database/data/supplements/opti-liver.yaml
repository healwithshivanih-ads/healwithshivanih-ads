contraindications:
  conditions:
  - Ragweed / Asteraceae (daisy-family) allergy — milk thistle and dandelion are both Asteraceae;
    cross-reactive allergy reported
  - Bile-duct obstruction or acute gallstone colic — dandelion is a choleretic and is contraindicated
    in biliary obstruction (Commission E)
  medications:
  - Nitroglycerin / other nitrates — NAC potentiates nitrate vasodilation (hypotension, severe
    headache)
  life_stages:
  - Pregnancy — proprietary blend with unlabelled ingredient amounts; no safety data
  - Lactation — proprietary blend with unlabelled ingredient amounts; no safety data
