notes_for_coach: |-
  Lactoferrin is an iron-binding glycoprotein that may improve iron utilisation in
  inflammatory states where hepcidin blocks standard iron absorption. Considered a
  clinician-directed intervention.

  Best used for: Most useful for iron deficiency that does not respond to oral iron or
  where iron causes GI upset, and as an add-on to H. pylori eradication. Not needed for
  simple iron deficiency that is responding to standard iron.
notes_for_client: Lactoferrin is a protein found naturally in colostrum and milk that
  may help the body absorb iron, particularly when inflammation is present.
