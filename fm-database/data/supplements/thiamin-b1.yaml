notes_for_coach: |-
  Start with thiamin HCl for cost-effectiveness. If poor response, consider benfotiamine
  (fat-soluble, better absorbed) or TPP forms. Retention improves when spread throughout
  the day with meals.

  Best used for: Best evidence is for correcting deficiency: clients on long-term loop
  diuretics (furosemide), heavy alcohol use, bariatric surgery, or very high
  refined-carbohydrate diets. For diabetic neuropathy use the separate benfotiamine
  entry, which is the form with the trial data. Not worth adding as a general energy
  supplement in a client with an adequate diet.
notes_for_client: Thiamin helps your body use carbohydrates for energy. Best absorbed
  when spread across meals.
evidence_tier: strong
