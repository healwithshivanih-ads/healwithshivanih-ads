notes_for_coach: |-
  Commonly available OTC form. Associated with higher rates of GI side effects
  (constipation, diarrhoea) and potentially lower compliance compared to ferrous
  bisglycinate. Referenced as comparison agent in the source document.

  Best used for: Standard, inexpensive first-line oral iron for confirmed iron
  deficiency (low ferritin), including heavy-period and RLS-related deficiency. GI side
  effects are its main drawback — alternate-day dosing or a gentler form (bisglycinate)
  often improves tolerance. Not worth taking without lab-confirmed deficiency.
notes_for_client: This is the most common iron tablet prescribed, but it can cause
  constipation or stomach upset for some people. Ask your practitioner if a gentler
  form might suit you better.
evidence_tier: strong
