contraindications:
  conditions:
  - Haemochromatosis or any iron-overload state — supplemental iron is harmful
  - Thalassaemia trait or other non-iron-deficiency anaemia (common in India) — do not supplement
    iron without iron studies (ferritin, TSAT) confirming deficiency
  medications:
  - Levothyroxine — iron binds it in the gut; separate by at least 4 hours
  - Tetracycline and fluoroquinolone antibiotics — mutual absorption blockade; separate by
    2–4 hours
  - PPIs and H2 blockers — markedly reduce non-heme iron absorption; may explain non-response
  - Levodopa / carbidopa-levodopa — iron chelates levodopa and reduces its absorption; separate
    doses by at least 2 hours
  - Bisphosphonates (alendronate) and integrase-inhibitor antiretrovirals (dolutegravir) —
    polyvalent cations block absorption; separate per prescriber instructions
  life_stages: []
