notes_for_coach: Emphasize strain diversity; single-strain supplementation is often insufficient.
  Introduce after enzyme and HCL support are established. Typical duration 6 weeks minimum for SIBO/SIFO.
  Recommend after any antibiotic course for a minimum of 2 months. Pair with prebiotic fibre diversity
  (7+ varieties per meal) to feed the organisms. Source is an expert practitioner talk; verify specific
  strain and dose with a clinician.
notes_for_client: 'The two best-studied families of friendly gut bacteria.

  Take them consistently rather than now and then — the benefit comes from keeping it steady.'
