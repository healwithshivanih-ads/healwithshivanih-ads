notes_for_coach: |-
  Lynch notes melatonin works well for fast MAOA (depleted serotonin → depleted
  melatonin). However, it worsens slow MAOA — causes increased wakefulness and
  irritability. This is a clinically useful discriminator between the two MAOA
  phenotypes. Do not recommend routinely without assessing MAOA phenotype. Tryptophan,
  5-HTP, and melatonin all burden slow MAOA. Listed as an 'acid suppressing' agent in
  PPI tapering protocol and as a potential H2 blocker substitute during taper. Melatonin
  receptors exist in GI tract; emerging evidence for its role in GERD. Clinician
  direction required for dosing.

  Best used for: Best for circadian problems — jet lag, delayed sleep onset,
  shift-related or age-related low melatonin — at low doses (0.5-3 mg) an hour or two
  before bed; it is a timing signal, not a sedative, so it does little for
  anxiety-driven or sleep-maintenance insomnia. Useful adjunct for GERD/PPI tapering,
  IBS pain and migraine prevention.
notes_for_client: 'Helps your body clock know it''s night — it''s a signal, not a sedative.

  Take it about an hour before bed, with the lights already low. Bright screens undo it.'
