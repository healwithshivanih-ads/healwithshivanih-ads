contraindications:
  conditions:
  - paradoxical activation in a subset of clients — start with lowest dose available and pause
    if it produces wired/anxious state
  - autoimmune conditions and pregnancy — coordinate with clinician
  - children and adolescents — clinician guidance only
  medications:
  - Fluvoxamine (and other strong CYP1A2 inhibitors, e.g. ciprofloxacin) — markedly raises
    melatonin levels; excess sedation
  life_stages:
  - Pregnancy, breastfeeding and trying to conceive naturally — avoid unless directed by the
    client's doctor
