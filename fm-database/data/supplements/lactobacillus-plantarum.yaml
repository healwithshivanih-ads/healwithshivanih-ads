notes_for_coach: |-
  Recommended during the Elimination Phase of the low-FODMAP protocol. Has research
  support in IBS symptom reduction. Clinician should confirm strain and dosing.

  Best used for: Best studied (strain 299v) for IBS-related abdominal pain and as a
  helper for non-haem iron absorption in vegetarian women with low ferritin. It is not a
  substitute for iron repletion. IBS trials are mixed (one large negative trial), and
  probiotics are best avoided where SIBO is suspected.
notes_for_client: A well-studied beneficial bacteria that helps restore gut balance
  during your elimination phase.
