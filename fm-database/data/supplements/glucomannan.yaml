notes_for_coach: |-
  Highly viscous soluble fiber from konjac root. Take with large amounts of water. Can
  lower post-meal blood sugar as well as LDL. Separate from medications.

  Best used for: Best evidence is for lowering LDL cholesterol, with a smaller effect on
  fasting glucose, so it suits clients with raised LDL, prediabetes or type 2 diabetes.
  Weight-loss evidence is weak (meta-analyses largely null). It must always be taken
  with plenty of water (choking/obstruction risk if taken dry) and spaced away from
  medicines.
notes_for_client: Glucomannan is a natural fiber that helps lower cholesterol and
  triglycerides. Take it with a large glass of water before meals.
evidence_tier: plausible_emerging
