- tablet
- powder
evidence_tier: plausible_emerging
notes_for_coach: 'Bonito peptides (from dried bonito fish, Katsuobushi) are small peptides
  with emerging

  evidence as natural ACE inhibitors, supporting modest blood pressure reduction. Listed

  in beta blocker tapering protocol. Evidence base is early-stage.


  Best used for: A modest add-on for mild high blood pressure, based mainly on Japanese

  trials of bonito peptide products. Not a replacement for prescribed antihypertensives

  and not useful beyond blood pressure.


  Merged from Anti-ACE Peptides (Bonito / Sardine): Purified mixture of 9 small peptides from
  bonito fish muscle. Act as ACE decoys —

  transformed into even more potent ACE inhibitors in vivo (800% greater activity). Do

  not lower BP in normotensives. No ACE-inhibitor drug side effects.


  Best used for: Small trials suggest modest BP lowering in mild hypertension. A

  reasonable add-on for a high-normal or stage 1 BP client alongside lifestyle; not a

  substitute for prescribed medication.'
notes_for_client: Bonito peptides come from a type of fish and may help support healthy blood
  pressure naturally. Use as directed by your healthcare provider.
