notes_for_coach: |-
  Cited as a prebiotic supplement source. Feeds beneficial gut bacteria in the colon.
  Start low and slow to avoid gas/bloating in sensitive individuals.

  Best used for: A gentle bifidobacteria-feeding prebiotic for clients whose gut is
  already settled; start low and build slowly. Not worth using — and often
  counterproductive — in IBS, SIBO or clients with marked bloating.
notes_for_client: FOS is a prebiotic fiber that feeds the good bacteria in your gut.
  It's found in foods like garlic, onions, and chicory, and is also available as a
  supplement.
