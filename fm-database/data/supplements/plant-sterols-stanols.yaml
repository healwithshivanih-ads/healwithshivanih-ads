notes_for_coach: |-
  Effective at 2 g/day with food; additive to diet and statins. Higher doses may reduce
  carotenoid absorption — ensure adequate fruit/vegetable intake. Best for high
  cholesterol absorbers (vs. overproducers).

  Best used for: Raised LDL, especially in clients who absorb a lot of cholesterol, as
  an add-on taken with meals alongside diet or statins (LDL down roughly 6-12% at
  studied intakes). LDL lowering is well proven, but no reduction in heart attacks or
  strokes has been shown, so it complements rather than replaces proven therapy.
notes_for_client: Plant sterols block cholesterol absorption in the gut and can lower
  LDL by 10–20% when used consistently with meals.
evidence_tier: strong
