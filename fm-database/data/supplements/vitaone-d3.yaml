notes_for_coach: "VitaOne Vitamin D3 — two verified SKUs on file (both extracted 2026-07-04,\nboth\
  \ co-formulated with K2):\n\n1. Liquid Vitamin D3 + K2 (SKU ODOO-117) — vitamin D3 (cholecalciferol\n\
  \   from lichen, vegan-safe) 450 IU + vitamin K2 (MK-7) 9 IU per drop.\n   Label: adults 3-4 drops\
  \ daily (~1350-1800 IU); children 1 drop daily.\n2. Vitamin D3 + K2-7, 5000 IU tablet (SKU ODOO-12)\
  \ — vitamin D3 5000 IU +\n   vitamin K2 (VitaMK7) 100 mcg per tablet. Label: 1-2 tablets daily.\n\
  \nNeither SKU is a standalone D3-only capsule — no capsule-only product\nverified as of this writing,\
  \ so \"capsule\" was dropped from the forms list.\nThe K2 co-formulation is a bonus (supports arterial\
  \ calcium routing), not\na substitute for any separate calcium/vascular items already in a plan\
  \ —\nit complements rather than conflicts with the rest of a supplement stack.\n\nStandard FM target\
  \ serum 60–80 ng/mL. Vegan clients are already covered\nby both SKUs (lichen-derived D3, not lanolin).\n\
  \nProduct pages: https://vitaone.in/products/liquid-vitamin-d3-k2-117?ref=vita13720sh\nand https://vitaone.in/products/vitamin-d3-k2-7-12?ref=vita13720sh\n"
