contraindications:
  conditions:
  - hypercalcaemia or primary hyperparathyroidism — extra vitamin D worsens high calcium
  - sarcoidosis or other granulomatous disease — unregulated vitamin D activation causes hypercalcaemia
  medications:
  - warfarin / acenocoumarol (vitamin K antagonists) — vitamin K directly opposes the anticoagulant
    effect and shifts INR; only with the prescriber's knowledge and a stable daily dose (both
    SKUs contain K2)
