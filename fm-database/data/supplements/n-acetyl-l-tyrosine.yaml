contraindications:
  conditions:
  - Hyperthyroidism / Graves' disease — tyrosine is a thyroid hormone precursor; standard
    monograph caution
  medications:
  - MAO inhibitors (e.g., selegiline, phenelzine) — catecholamine precursor; risk of hypertensive
    reaction
