take_with_food: optional
notes_for_coach: |-
  More soluble form of L-Tyrosine; dopamine precursor useful for ADHD, fatigue, and
  mental performance.

  Best used for: Evidence supports L-tyrosine for acute, demanding situations (stress,
  sleep deprivation, heavy multitasking) rather than chronic daily use. Not shown to
  help age-related cognitive decline or hypothyroidism, and the N-acetyl form converts
  to tyrosine less efficiently than plain L-tyrosine.
