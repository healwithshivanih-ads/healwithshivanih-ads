notes_for_coach: |-
  Dose is 25–50 mg/kg/day (max 3 g/day) divided. Monitor liver enzymes every 3 months.
  Immediate-release preferred over timed-release for peak immune-blocking effect.
  Physician must direct. Children: 100–200 mg/day.

  Best used for: Oral nicotinamide's best human evidence is fewer new non-melanoma skin
  cancers in high-risk people (ONTRAC trial). Topical niacinamide, a skincare product
  rather than this tablet, helps inflammatory acne. Unlike niacin it does not improve
  cholesterol, and it is not worth using to prevent type 1 diabetes: the large ENDIT
  trial was negative. Gram-level dosing needs a physician.
notes_for_client: Niacinamide is a form of vitamin B3 that may protect insulin-producing
  cells. Only use under medical supervision at therapeutic doses.
