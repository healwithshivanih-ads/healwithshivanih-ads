notes_for_coach: |-
  Latin: Cassia acutifolia; Leguminosae. Sanskrit: Rajavriksha. Traditional indications:
  constipation, inflammatory skin conditions, hypertension, obesity. Precautions:
  hemorrhoids, inflammatory conditions of the g.i. tract, diarrhea, pregnancy; irritant
  to intestinal membrane; repeated use may weaken colon tone. Ayurvedic energetics from
  The Yoga of Herbs (Frawley & Lad).

  Best used for: A short-term rescue laxative for occasional constipation (bedtime dose,
  works overnight) when fibre, fluids, magnesium and movement have not done enough. Not
  a daily or long-term tool and never a 'detox' — chronic use risks dependence and low
  potassium.
