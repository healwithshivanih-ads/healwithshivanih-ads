contraindications:
  conditions:
  - intestinal obstruction, ileus or undiagnosed abdominal pain (stimulant laxative)
  - inflammatory bowel disease — Crohn's, ulcerative colitis — or appendicitis
  medications:
  - digoxin and antiarrhythmics (laxative-induced hypokalaemia potentiates toxicity)
  - thiazide/loop diuretics and corticosteroids (additive potassium loss)
  life_stages:
  - pregnancy (clinician-directed use only)
  - children under 12
  - lactation (not recommended - insufficient data on excretion of anthranoid metabolites
    into breast milk, per EMA monograph)
