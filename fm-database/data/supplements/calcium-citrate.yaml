contraindications:
  conditions:
  - Hypercalcaemia or primary hyperparathyroidism
  - History of calcium kidney stones — supplement only under clinician guidance (food calcium
    preferred)
  medications:
  - Digoxin — high-dose calcium can raise the risk of arrhythmia; supplement only with prescriber
    agreement
