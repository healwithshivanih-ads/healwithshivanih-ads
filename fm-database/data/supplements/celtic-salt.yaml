contraindications:
  conditions:
  - Hypertension — added salt raises blood pressure; trace minerals do not offset the sodium
  - Chronic kidney disease — impaired sodium handling; fluid and BP overload
  - Heart failure or fluid retention/oedema — sodium worsens fluid overload
  medications:
  - Lithium — changes in sodium intake alter lithium levels (low intake raises levels, sudden
    increases lower them)
  life_stages: []
