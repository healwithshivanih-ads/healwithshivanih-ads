notes_for_coach: |-
  Prioritize enzyme support early in gut healing protocols before introducing complex
  herbals or probiotics. Fecal elastase-1 on GI map indicates deficiency. Recommend
  broad-spectrum formulas containing lipase, protease, and amylase taken with main
  meals. Prescription pancreatic enzyme replacement (e.g., Creon) is out of coaching
  scope — refer to clinician for confirmed EPI. Source is expert consensus lecture;
  verify specific dosing with prescribing clinician.

  Best used for: Most useful for clients with signs of maldigestion (fullness after
  meals, undigested food or fatty stools, low faecal elastase) and as the 'Replace' step
  of gut-healing protocols. Confirmed pancreatic insufficiency needs prescription
  enzymes via a clinician. Not worth using routinely for general bloating without signs
  of maldigestion.
