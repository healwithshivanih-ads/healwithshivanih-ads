notes_for_coach: |-
  Plant sterol found in Serenoa repens, Pygeum, pumpkin seed, soy, avocados. Dose:
  60–130 mg daily. Can be combined with saw palmetto and Cernilton for synergistic BPH
  effect.

  Best used for: Best evidence is for urinary symptoms of benign prostate enlargement
  (better flow, less residual urine) at 60–130 mg/day. LDL-lowering needs about 2 g/day
  of plant sterols, far above this dose, so this entry is not a cholesterol supplement
  as dosed.
notes_for_client: Beta-sitosterol is a plant compound that may help ease urinary symptoms
  related to prostate health.
