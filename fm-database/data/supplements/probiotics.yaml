    probiotic bacteraemia/fungaemia
  - Acute severe pancreatitis — probiotic use associated with increased mortality (PROPATRIA
    trial)
  - Severe immunocompromise, central venous catheter, or critical illness — rare but documented
    probiotic bacteraemia
  medications:
  - Immunosuppressants (e.g. transplant drugs, high-dose steroids, biologics) — clinician
