notes_for_coach: Probiotic-rich foods and supplements help diversify gut microbiome, potentially reducing
  beta-glucuronidase activity and improving estrogen excretion. Diversity of strains matters more
  than single-strain supplementation. Used in the Re-inoculate step of 5R. Strain selection matters;
  multi-strain formulations are commonly recommended. Clients on immunosuppressants should consult
  clinician before use. Used in the Re-inoculate phase of the 5R protocol to restore beneficial gut
  flora disrupted by low acid, dysbiosis, or SIBO. Strain and dose selection should be guided by a
  clinician, especially if SIBO is suspected. Probiotics and prebiotics were intentionally deferred
  for 3 months (until gut inflammation settled) to avoid aggravating fermentation and bloating. VSL#3
  (high-potency multi-strain) and spore-forming probiotics were used in the re-inoculation phase.
  Introducing probiotics to an inflamed gut can worsen bloating and dysbiosis symptoms.
notes_for_client: 'Friendly bacteria to help settle and rebalance your gut.

  A little extra wind in the first week is normal and usually passes.'
