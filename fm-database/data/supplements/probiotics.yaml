notes_for_coach: 'Probiotic-rich foods and supplements help diversify gut microbiome, potentially

  reducing beta-glucuronidase activity and improving estrogen excretion. Diversity of

  strains matters more than single-strain supplementation. Used in the Re-inoculate step

  of 5R. Strain selection matters; multi-strain formulations are commonly recommended.

  Clients on immunosuppressants should consult clinician before use. Used in the

  Re-inoculate phase of the 5R protocol to restore beneficial gut flora disrupted by low

  acid, dysbiosis, or SIBO. Strain and dose selection should be guided by a clinician,

  especially if SIBO is suspected. Probiotics and prebiotics were intentionally deferred

  for 3 months (until gut inflammation settled) to avoid aggravating fermentation and

  bloating. VSL#3 (high-potency multi-strain) and spore-forming probiotics were used in

  the re-inoculation phase. Introducing probiotics to an inflamed gut can worsen

  bloating and dysbiosis symptoms.


  Best used for: Best evidence: antibiotic-associated diarrhoea, IBS symptoms

  (multi-strain products) and the re-inoculate phase of a 5R protocol; modest supportive

  data for HbA1c and mood. Effects are strain-specific; not worth adding into an

  inflamed or SIBO-dominant gut, where it can worsen bloating — calm the gut first.


  Dose note merged from Probiotics (Lactobacillus & Bifidobacterium strains): capsule 1–5000000000
  capsules (this entry keeps 10–50 g).


  Dose note merged from Probiotics (Lactobacillus & Bifidobacterium strains): powder 1–1 teaspoons
  (this entry keeps 1–2 scoops).


  Merged from Probiotics (Lactobacillus & Bifidobacterium strains): Emphasize strain diversity;
  single-strain supplementation is often insufficient.

  Introduce after enzyme and HCL support are established. Typical duration 6 weeks

  minimum for SIBO/SIFO. Recommend after any antibiotic course for a minimum of 2

  months. Pair with prebiotic fibre diversity (7+ varieties per meal) to feed the

  organisms. Source is an expert practitioner talk; verify specific strain and dose with

  a clinician.


  Best used for: Best evidence: preventing antibiotic-associated diarrhoea and easing

  IBS symptoms with multi-strain products, and as the re-inoculate step after the gut

  has calmed. Benefits are strain-specific and stop when the product stops; not worth

  starting into an inflamed or SIBO-dominant gut, where it can worsen bloating.'
notes_for_client: 'Friendly bacteria to help settle and rebalance your gut.

  A little extra wind in the first week is normal and usually passes.'
