notes_for_coach: |-
  L. gasseri is identified as part of both vaginal microbiome restoration (alongside L.
  crispatus) and the SIBO yogurt protocol (alongside L. reuteri and B. subtilis). It
  colonizes the small intestine and produces bacteriocins. Used in Dr. Davis's SIBO
  yogurt formulation.

  Best used for: Effects are strain-specific: SBT2055 for modest visceral-fat reduction
  in overweight adults, OLL2716 as an H. pylori adjunct, OLL2809 for endometriosis pain.
  A generic 'gasseri' product without a named strain is unlikely to reproduce these
  results.
notes_for_client: This probiotic strain supports both vaginal health and gut health.
  It is used in a special homemade yogurt that may help address small intestinal bacterial
  overgrowth (SIBO).
