notes_for_coach: |-
  Typically used in combination with myo-inositol (40:1 ratio). Specifically cited for
  PCOS-related insulin resistance.

  Best used for: Strongest evidence is for insulin-resistant PCOS, usually as the 40:1
  myo-inositol:D-chiro-inositol combination, to improve insulin sensitivity and cycle
  regularity. Myo-inositol alone is generally preferred for fertility; DCI on its own at
  high dose is not a good choice for women trying to conceive.
notes_for_client: D-chiro-inositol is a form of inositol with particular benefits
  for insulin regulation in PCOS.
