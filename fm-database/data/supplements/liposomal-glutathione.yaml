notes_for_coach: |-
  Liposomal delivery bypasses gut degradation of oral glutathione. Lynch recommends
  intermittent use (a few times per week initially, not daily) to avoid over-suppression
  of endogenous glutathione synthesis. Requires adequate selenium and riboflavin to
  regenerate spent glutathione. Also protects NOS3-derived nitric oxide from converting
  to superoxide.

  Best used for: An intermittent, FM-specific option (Lynch) where glutathione demand is
  thought to be high, such as heavy toxin exposure. Human evidence is limited to small
  pilot studies showing raised glutathione levels, not clinical outcomes. NAC is a
  cheaper precursor with more clinical data.
notes_for_client: Glutathione is your body's master antioxidant. The liposomal form
  delivers it directly into your cells. Take a few times a week to start — daily long-term
  is not usually necessary.
