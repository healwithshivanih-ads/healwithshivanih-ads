notes_for_coach: |-
  Dosing must be individualized by species: Shiitake (Lentinula edodes), Reishi
  (Ganoderma lucidum), Maitake (Grifola frondosa), Lion's Mane (Hericium erinaceus),
  Turkey Tail (Trametes versicolor). Each has a distinct evidence base and dosing range.
  Refer to species-specific research. Dual-extracted (hot water + alcohol) products
  maximize bioactive compounds.

  Best used for: Generic umbrella entry — only worth suggesting when the coach then
  picks a specific species (maitake, reishi, lion's mane, turkey tail, shiitake), each
  with its own evidence. Main use is immune support; not a targeted option for a
  specific condition.
notes_for_client: Different medicinal mushrooms have different health benefits. Shiitake,
  reishi, maitake, and lion's mane are among the most researched. Ask your practitioner
  which specific mushroom is right for your needs.
