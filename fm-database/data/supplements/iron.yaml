notes_for_coach: |-
  Iron is listed as a key nutrient for thyroid hormone production. Routine
  supplementation at 15–20 mg is noted specifically for menstruating women. Iron status
  should ideally be confirmed by ferritin/CBC before supplementation. Can interfere with
  levothyroxine absorption — space 4 hours from thyroid medication. Iron supplementation
  must be guided by lab results (serum iron, ferritin, TIBC). Low stomach acid impairs
  iron absorption. Constipating forms (ferrous sulfate) should be avoided; consider
  bisglycinate forms. Confirm with clinician before recommending.

  Best used for: Best for lab-confirmed iron deficiency (low ferritin), with or without
  anaemia, especially menstruating women, heavy periods, vegetarians and hypothyroid
  clients with ferritin below about 50-70. Not worth it, and potentially harmful,
  without labs or when ferritin is normal or high.
notes_for_client: 'Iron, to rebuild your stores — this takes months, not weeks, so keep going.

  Take it with something sharp like lemon or amla. Never with tea, coffee or milk.'
