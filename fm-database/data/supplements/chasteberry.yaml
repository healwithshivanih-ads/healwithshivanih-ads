contraindications:
  conditions:
  - Prolactinoma or other pituitary disorder — can mask/alter prolactin; needs medical management
  - Oestrogen- or hormone-sensitive cancer (breast, uterine, ovarian) — hormonal effects;
    avoid unless oncologist agrees (EMA monograph)
  medications:
  - IVF / ovulation-induction drugs (clomiphene, gonadotropins) — case reports of ovarian
    hyperstimulation
  life_stages:
  - Pregnancy — avoid
  - Breastfeeding — lowers prolactin and may reduce milk supply
  - Under 18 — not recommended (EMA monograph; HPO axis still maturing)
