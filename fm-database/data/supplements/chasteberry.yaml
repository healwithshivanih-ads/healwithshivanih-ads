notes_for_coach: |-
  Chasteberry (Vitex) acts on the pituitary to support LH secretion and may help
  normalize progesterone production in the luteal phase. Used in cycle syncing
  protocols. Effects are gradual (may take 3+ cycles). Suitable for long-term use.

  Best used for: Strongest evidence is for PMS — particularly breast tenderness,
  irritability and mood swings — and for cyclical breast pain, with some evidence for a
  short luteal phase linked to mildly raised prolactin. Effects build over about 3
  cycles. Not a general hormone balancer and not useful once periods have stopped; use
  cautiously in PCOS, where raising LH may not help.
notes_for_client: Chasteberry is an herb traditionally used to support hormonal balance. It may
  help boost your progesterone levels naturally over time, which can ease symptoms like spotting,
  PMS, and mood swings.
