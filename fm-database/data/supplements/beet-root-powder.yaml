notes_for_coach: |-
  Lynch prefers beet root, ornithine, and citrulline as indirect arginine donors over
  direct arginine supplementation (which can worsen herpetic infections and has other
  risks). Beet root provides dietary nitrates reduced to nitric oxide in the gut. Easy
  to add to smoothies.

  Best used for: Best evidence is a modest drop in blood pressure and improved exercise
  endurance from its natural nitrates, seen within hours to weeks. Benefit depends on
  oral bacteria — antiseptic mouthwash blunts it — and powders vary widely in nitrate
  content; whole beets or beet juice may be just as effective.
notes_for_client: Beet root is a natural source of nitrates that your body converts
  to nitric oxide, supporting healthy blood pressure and circulation.
