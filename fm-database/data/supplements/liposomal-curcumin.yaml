notes_for_coach: |-
  Lynch recommends for fast MAOA to reduce inflammation — specifically to slow down
  IDO1-mediated tryptophan steal, thereby conserving tryptophan for serotonin synthesis.
  Liposomal form preferred for absorption. 1–3 times daily.

  Best used for: Strongest evidence is knee osteoarthritis pain, NAFLD liver enzymes and
  lowering CRP. The 'protect tryptophan for serotonin' use is from Dirty Genes and is
  FM-specific. Most trials used other bioavailable forms (phytosome, BCM-95), not
  liposomal specifically.
notes_for_client: A potent anti-inflammatory from turmeric that helps protect your
  tryptophan supply so your body can make serotonin. The liposomal form is much better
  absorbed than standard curcumin.
