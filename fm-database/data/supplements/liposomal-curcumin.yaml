contraindications:
  conditions:
  - gallstones / bile-duct obstruction — curcumin stimulates gallbladder contraction
  - history of drug- or herb-induced liver injury — turmeric supplements are a recognised
    cause of hepatotoxicity (LiverTox)
  medications: []
  life_stages:
  - pregnancy — insufficient safety data for concentrated/supplemental curcumin doses (culinary
    turmeric is fine)
