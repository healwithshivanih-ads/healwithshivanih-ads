contraindications:
  conditions:
    - haemochromatosis or any iron-overload state (shilajit contributes iron and fulvic
      acid enhances mineral absorption)
    - active gout or hyperuricaemia (traditional caution; uric-acid effects not characterised)
    - chronic kidney disease (mineral and trace-element load, impaired clearance of
      any contaminant)
    - known lead, arsenic or mercury burden
  medications:
    - iron supplements (additive iron load; separate and monitor ferritin)
    - antihypertensives (unquantified additive effects reported traditionally)
  life_stages:
    - pregnancy
    - lactation
    - children and adolescents
pregnancy_safety: contraindicated
lactation_safety: contraindicated
pregnancy_safety_note: No human safety data in pregnancy or lactation, and a documented
  heavy-metal contamination risk in retail product. Lead and mercury cross the placenta
  and enter breast milk. Withhold — there is no benefit here worth that exposure.
