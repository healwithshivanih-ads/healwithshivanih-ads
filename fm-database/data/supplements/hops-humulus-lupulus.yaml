  - estrogen-positive-breast-cancer
  - endometrial-cancer
  - estrogen-sensitive-cancers
  medications:
  - benzodiazepines
  - sedative-hypnotics
  - Tamoxifen, aromatase inhibitors and other endocrine cancer therapy — 8-prenylnaringenin
    is a potent phytoestrogen that may oppose anti-oestrogen treatment; avoid unless the oncologist
    agrees
