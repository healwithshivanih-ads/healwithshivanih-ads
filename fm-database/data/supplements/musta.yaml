notes_for_coach: |-
  Latin: Cyperus rotundus; Cyperaceae. Sanskrit: Musta. Traditional indications:
  menstrual disorders, dysmenorrhea, menopause, diarrhea, malabsorption, indigestion,
  sluggish liver. Precautions: constipation, high Vata. Ayurvedic energetics from The
  Yoga of Herbs (Frawley & Lad).

  Best used for: An Ayurvedic digestive herb traditionally used for loose stools,
  indigestion and menstrual cramping. Human trial evidence is minimal, so treat it as a
  gentle traditional adjunct rather than a primary option; avoid in
  constipation-predominant clients.
