take_with_food: optional
notes_for_coach: |-
  Triterpenoids exert anxiolytic/sedative effects. May work via microbiome-mediated
  mechanisms and serotonin modulation. Standardised triterpenoid content preferred.
  Source: Coach Shivani clinical observations.

  Best used for: Small human trials support modest benefit for stress-related
  fatigue/neurasthenia and immune markers; sleep evidence in humans is weak. A gentle
  evening adjunct for stressed clients, not a primary sleep or stress intervention.
evidence_tier: plausible_emerging
