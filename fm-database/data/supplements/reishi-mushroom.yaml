contraindications:
  conditions:
  - Bleeding disorders or surgery within 2 weeks — reishi inhibits platelet aggregation
  - Organ transplant / autoimmune disease on immunosuppression — immunostimulating effect
    may oppose therapy
  medications:
  - Immunosuppressants (cyclosporine, tacrolimus) — may counteract
  life_stages:
  - Pregnancy and breastfeeding — insufficient safety data
