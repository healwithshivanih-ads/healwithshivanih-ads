notes_for_coach: "Sources: borage oil (highest GLA ~20-24%), evening primrose oil (~8-14% GLA, 60-80%\
  \ linoleic acid), black currant seed oil. 480 mg/day minimum for the neuropathy evidence. GLA bypasses\
  \ impaired delta-6-desaturase in diabetics — that is the mechanism the neuropathy data rests on\
  \ and it is the STRONGEST indication here.\n\nREAD THE INDICATIONS SEPARATELY — the evidence is\
  \ not uniform and 'EPO for women's health' flattens a real split:\n  strong-ish : diabetic neuropathy\
  \ (480 mg/day, 1 year, 16 parameters)\n  mixed      : mastalgia / cyclic breast pain; dry eye (better\
  \ in contact-lens dry eye than in Sjogren's)\n  WEAK       : menopausal hot flashes — frequency\
  \ AND intensity both non-significant; only DURATION and night sweats reached significance, on low-quality\
  \ evidence\n  NEGATIVE   : Sjogren's fatigue (n=90, 6 months, ineffective); atopic eczema (Cochrane)\n\
  \nDo not reach for this as a first-line perimenopause supplement. If a client is already on omega-3\
  \ EPA/DHA for dry eye or inflammation, omega-3 carries the better evidence and adding GLA stacks\
  \ weaker data on top of stronger. Night sweats are the one menopausal outcome with a real signal.\n\
  \nFILING NOTE (2026-08-05): this entry was previously reachable ONLY via linked_to_topics: [diabetic-neuropathy]\
  \ with no aliases at all, so 'evening primrose oil' matched nothing and the assess subgraph could\
  \ never surface it for a perimenopause or dry-eye client. Four of its five claims are about EPO.\
  \ Aliases and topic links added so it is findable under the name people actually use."
notes_for_client: GLA is a fatty acid found in evening primrose and borage oil. The clearest benefit
  is for nerve health in diabetes. For menopausal symptoms the research is genuinely mixed — it may
  help night sweats, but it has not reliably reduced how often or how strongly hot flashes come.
