pregnancy_safety: contraindicated
pregnancy_safety_note: Traditionally used to ripen the cervix at term and may affect labour; avoid
  in pregnancy unless a clinician directs otherwise.
contraindications:
  conditions:
  - Seizure disorder or epilepsy — case reports of a lowered seizure threshold with evening primrose
    oil; avoid unless a neurologist has cleared it
  - Scheduled surgery — stop at least 2 weeks beforehand
  medications:
  - Phenothiazines — reported to lower the seizure threshold in combination
  - Anticoagulants and antiplatelets including warfarin, clopidogrel and chronic aspirin — theoretical
    additive bleeding risk; review with the prescriber before starting
  life_stages:
  - pregnancy — traditionally used to ripen the cervix at term and may influence labour; avoid unless
    a clinician directs otherwise
