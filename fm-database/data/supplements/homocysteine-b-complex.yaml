notes_for_coach: 'One-capsule homocysteine formula (active methylfolate + methyl-B12 + P5P + R5P + TMG).
  Replaces standalone methylfolate + P5P + riboflavin + TMG. Maps to VitaOne ''Homocysteine Defence B
  Complex''. Prefer for elevated-homocysteine / methylation-block clients.


  Methylated forms (methylcobalamin, 5-MTHF) are preferred for methylation support, especially with a
  suspected MTHFR polymorphism. Also assists estrogen clearance via COMT-dependent Phase II methylation.


  SAFETY: verify B12 status before high-dose supplementation in CKD.


  Case evidence on file: homocysteine 18-19 umol/L fell to ~10 umol/L (gut-skin-hormone-axis case); homocysteine
  normalised in the cardiovascular-risk-assessment case.


  EVIDENCE TIER: kept at plausible_emerging, NOT upgraded to the merged-in entry''s ''strong''. Only one
  of the five linked claims (methylated-b12-folate-reduce-homocysteine-support-methylation) is strong,
  and it covers the narrow ''methyl-B12 + folate lower homocysteine'' statement — not TMG, P5P, R5P, or
  any cardiovascular-outcome claim. Re-tier only with a citation that covers the formula.


  Merged 2026-08-28 from homocysteine-defense-b-complex and homocysteine-support-b-complex - one formula,
  three entries. Both old slugs are kept as aliases. Distinct from methylated-b-complex, which carries
  no TMG.'
notes_for_client: An all-in-one capsule for supporting healthy homocysteine levels — it combines the active
  forms of folate, B12, B6 and B2 with TMG in a single pill, so you take one capsule instead of four.
evidence_tier: plausible_emerging
