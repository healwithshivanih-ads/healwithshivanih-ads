contraindications:
  conditions:
  - PCOS — raises ovarian androgens (catalogue claim dhea-contraindicated-in-pcos)
  - Hormone-sensitive cancers (breast, endometrial, ovarian, prostate) or history thereof
    — converts to oestrogen and testosterone
  - Estrogen dominance / elevated oestradiol — can worsen it
  medications:
  - Aromatase inhibitors, tamoxifen and other hormone-blocking cancer therapy — opposes their
    action
  life_stages:
  - pregnancy
  - lactation
