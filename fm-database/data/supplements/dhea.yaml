notes_for_coach: |-
  DHEA-S should be tested before supplementation. If DHEA-S is low, supplementing
  directly addresses the precursor deficiency. Dosing and form are clinician-prescribed
  only.

  Best used for: Clinician-led only, and only after a measured low DHEA-S. Evidence is
  clearest for replacing documented low DHEA-S (e.g. adrenal insufficiency). Use in IVF
  for diminished ovarian reserve is contested and fertility-specialist-led. Oral DHEA
  shows little benefit for general menopausal symptoms or libido. Avoid in PCOS,
  oestrogen dominance and hormone-sensitive conditions. Vaginal DHEA (prasterone) for
  vaginal dryness is a separate prescription product, not this supplement.
notes_for_client: DHEA is a natural precursor your body uses to make hormones like
  testosterone and estrogen. Low DHEA-S on a blood test may explain why other hormones
  are also low.
evidence_tier: confirm_with_clinician
