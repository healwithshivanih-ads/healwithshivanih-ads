  quote: DHEA is a precursor for testosterone. So, in all males and females, I always check
    for the DHEA sulfate because that is where it's a precursor, it's a precursor which means
    that it is formed prior to then. If the value of DHEA sulfate is not only low, then there
    is no point of replacing their testosterone
- id: coconote-fm-estrogen-dominance
  location: Causes of Estrogen Dominance / DHEA Caution
  quote: Do not give DHEA when the patient is having perimenopausal phase. We don't want estrogen
    to be on the higher side.
