notes_for_coach: 'DHEA-S should be tested before supplementation. If DHEA-S is low, supplementing

  directly addresses the precursor deficiency. Dosing and form are clinician-prescribed

  only.


  Best used for: Clinician-led only, and only after a measured low DHEA-S. Evidence is

  clearest for replacing documented low DHEA-S (e.g. adrenal insufficiency). Use in IVF

  for diminished ovarian reserve is contested and fertility-specialist-led. Oral DHEA

  shows little benefit for general menopausal symptoms or libido. Avoid in PCOS,

  oestrogen dominance and hormone-sensitive conditions. Vaginal DHEA (prasterone) for

  vaginal dryness is a separate prescription product, not this supplement.


  Merged from DHEA-S Supplement: DHEA is a precursor hormone — it can convert downstream to
  both testosterone and estrogen. Do NOT recommend in perimenopausal women with existing estrogen
  dominance or elevated estrogen, as it will worsen the condition. Requires clinician guidance
  and lab monitoring. Normal DHEA-S reference range cited as 150-390 µg/dL in the document.'
notes_for_client: DHEA is a natural precursor your body uses to make hormones like testosterone
  and estrogen. Low DHEA-S on a blood test may explain why other hormones are also low.
