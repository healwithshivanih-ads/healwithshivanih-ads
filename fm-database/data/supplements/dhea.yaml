sources:
- id: coconote-fm-sex-hormones
  location: Steroidogenesis Pathway
  quote: DHEA is a precursor for testosterone. So, in all males and females, I always
    check for the DHEA sulfate because that is where it's a precursor, it's a precursor
    which means that it is formed prior to then. If the value of DHEA sulfate is not
    only low, then there is no point of replacing their testosterone
