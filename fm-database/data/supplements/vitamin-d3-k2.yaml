notes_for_coach: Even when vitamin D levels appear 'normal' on standard ranges, higher-dose D3 has
  been researched for autoimmune/psoriatic conditions. K2 is co-administered to direct calcium appropriately.
  High-dose D3 (above 4000 IU) should be supervised by a clinician with monitoring of serum 25(OH)D.
  The preferred ratio cited is 5,000 IU D3 with 200 mcg K2. This combination is ideal for most supplementation
  protocols as it provides both calcium absorption support (D3) and calcium direction to bone (K2).
  Always recommend with fat-containing food. Clinician guidance needed for dose adjustment based on
  blood levels.
notes_for_client: 'Vitamin D for your bones, immunity and mood — the one most of us are short of.

  The K2 alongside steers calcium into your bones rather than your arteries. With your largest meal.'
