notes_for_coach: |-
  Highly bioavailable choline source for acetylcholine synthesis; supports cognition and
  neuroprotection; best taken in the morning.

  Best used for: Evidence is in established Alzheimer's/vascular dementia, mostly small
  older Italian trials at doses above the catalogue range. Reasonable only for an older
  client with documented cognitive decline, alongside lifestyle work and their doctor's
  care. Not worth it for everyday brain fog in a younger client. A large observational
  study linked long-term use with higher stroke risk, so avoid it in clients with
  cardiovascular or stroke risk unless their clinician agrees.
