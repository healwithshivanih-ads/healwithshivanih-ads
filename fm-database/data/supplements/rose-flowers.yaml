notes_for_coach: |-
  Latin: Rosa spp.; Rosaceae. Sanskrit: Shatapatri. Traditional indications: amenorrhea,
  dysmenorrhea, uterine hemorrhage, inflamed eyes, dizziness, headaches, sore throat,
  enlarged tonsils. Precautions: high Kapha. Ayurvedic energetics from The Yoga of Herbs
  (Frawley & Lad).

  Best used for: Gentle food-grade herb; the one human trial supports rose tea for
  period pain. Fine as a calming, cooling tea; not a treatment for heavy bleeding or
  menopause on current evidence.
