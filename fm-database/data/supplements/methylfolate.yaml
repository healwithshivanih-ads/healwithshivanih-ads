notes_for_coach: 'Source book recommends starting very low and increasing slowly. Some individuals

  experience significant mood or anxiety side effects (overmethylation) at higher doses.

  Start with a ''Soak and Scrub'' dietary approach before supplementing. Dose selection is

  clinician territory.


  Best used for: Best for raised homocysteine, confirmed low folate or MTHFR variants,

  and preconception folate cover; use in depression is an adjunct for the client''s

  doctor to lead. Start low, as some people feel anxious, irritable or sleep poorly at

  higher doses. Always check B12 first or pair with B12, because folate can mask B12

  deficiency.


  Dose note merged from Folate (Methylfolate): capsule 400–1000 mcg (this entry keeps 0.1–15
  mg).


  Merged from Folate (Methylfolate): Methylfolate is the active form; preferred over folic
  acid especially in MTHFR

  polymorphism. Critical for methylation, neurotransmitter synthesis, and myelin

  integrity. Clinician should assess MTHFR status and B12 levels.


  Best used for: Best when homocysteine is raised, in MTHFR variants or folate

  deficiency, and as a prescriber-guided adjunct in antidepressant-resistant depression

  (L-methylfolate). Not needed by clients with normal folate and homocysteine; always

  check or co-supplement B12.'
notes_for_client: This is the activated form of folate your body can actually use, especially
  if you have an MTHFR variant. Start low — even a very small dose can have a big effect.
  Leafy greens first, supplements second.
