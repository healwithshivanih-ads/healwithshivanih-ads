contraindications:
  conditions:
  - Untreated or unchecked B12 deficiency — folate can mask the anaemia while B12 neuropathy
    progresses; check B12 or give with B12 (claim murray-folate-masks-b12-deficiency)
  - Bipolar disorder — case reports of hypomania with high-dose methylfolate; clinician only
  - Untreated or unconfirmed B12 deficiency / pernicious anaemia — folate (especially >1 mg/day)
    can correct the anaemia and mask B12 deficiency while nerve damage progresses; check B12
    first or co-supplement
  medications:
  - Methotrexate (oncology doses) and 5-FU/capecitabine — folate can reduce efficacy or increase
    toxicity; clinician only
