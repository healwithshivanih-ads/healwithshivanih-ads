notes_for_coach: |-
  Latin: Caryophyllus aromaticus; Myrtaceae. Sanskrit: Lavanga. Traditional indications:
  colds, cough, asthma, indigestion, toothache, vomiting, hiccough, laryngitis,
  pharyngitis, low blood pressure, impotence. Precautions: inflammatory condition,
  hypertension, high Pitta. Ayurvedic energetics from The Yoga of Herbs (Frawley & Lad).

  Best used for: Culinary spice and topical dental pain remedy (clove oil on a painful
  tooth). There is no meaningful human evidence for asthma, colds or digestion as a
  supplement. Use in cooking, not as a therapeutic supplement.
