notes_for_coach: |-
  Single-capsule methylated B-complex; replaces separate methylfolate + methyl-B12 + P5P
  + riboflavin. Prefer over prescribing those individually, for adherence. Methylated B
  vitamins also support COMT enzyme activity, which is critical for Phase II methylation
  of catechol estrogens (4-OHE1 → 4-MeOE1) — particularly relevant for clients with COMT
  variants. Clinician to guide specific form and dose.

  Best used for: Best for clients with raised homocysteine, MTHFR variants,
  vegetarian/vegan diets, or on metformin/PPIs/OCPs — one pill covers B12, folate, B6
  and B2. Start low: some people feel anxious, wired or headachy (overmethylation); not
  needed if diet and labs are fine.
notes_for_client: 'The B vitamins in their active form, so your body can use them without converting
  first.

  Mornings — for some people they''re too energising at night. Bright yellow urine is normal.'
