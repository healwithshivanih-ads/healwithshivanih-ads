contraindications:
  conditions:
  - Unexplained macrocytic anaemia or neuropathy — test B12/MMA before starting; folate can
    mask the haematological signs of B12 deficiency while neurological damage progresses
  medications:
  - Methotrexate (oncology doses) and 5-FU/capecitabine — folate can reduce efficacy or increase
    toxicity; clinician only
