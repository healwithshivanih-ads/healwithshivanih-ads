contraindications:
  conditions:
  - high doses (>400 IU/day) may increase bleeding risk with anticoagulants or antiplatelet
    medications — coordinate with prescriber
  - 'men with or at high risk of prostate cancer — SELECT trial: 400 IU/day alpha-tocopherol
    raised prostate cancer incidence by ~17%'
  - history of haemorrhagic stroke or bleeding disorder — meta-analysis (Schürks 2010) found
    vitamin E raised haemorrhagic stroke risk
