contraindications:
  conditions:
  - Chronic kidney disease or reduced eGFR — impaired potassium/magnesium excretion, risk
    of hyperkalaemia/hypermagnesaemia
  - Heart failure or a prescribed fluid/salt restriction — added sodium and fluid can worsen
    fluid overload
  - Uncontrolled hypertension — sodium-containing electrolyte mixes can raise BP; use a low-sodium
    formula only with clinician input
  medications:
  - ACE inhibitors, ARBs, spironolactone/eplerenone and other potassium-sparing diuretics
    — additive hyperkalaemia risk from potassium-containing electrolyte products
  - Thiazide and loop diuretics, lithium — alter sodium/potassium handling; electrolyte supplementation
    should be clinician-directed
