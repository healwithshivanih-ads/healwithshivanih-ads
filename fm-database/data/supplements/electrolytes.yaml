notes_for_coach: 'Recommended during fasting days per practitioner guidance. Individual electrolyte

  needs vary. Flag for clinician to specify type and dose, especially for clients with

  hypertension, kidney disease, or on diuretics.


  Best used for: For fasting days and low-carb transitions to prevent dizziness,

  headache and fatigue. Not a general cardiometabolic supplement; kidney disease, heart

  failure and potassium-sparing/ACE/ARB drugs need clinician input.


  Merged from Electrolyte Supplement (with Taurine): Should contain at minimum: potassium,
  magnesium, chloride, sodium, and taurine. No

  sugar, artificial colors or sweeteners. Taurine aids electrolyte transport. Stop if

  not exercising or sauna-using and symptom-free. If constipation occurs, increase water

  or skip a day.


  Best used for: Useful for heavy sweating (sauna, exercise in Indian heat), fasting

  days, the first weeks of a low-carb diet, and low-BP/orthostatic dizziness. Not needed

  by sedentary, symptom-free clients, and sodium-containing mixes are a poor fit for

  hypertensive clients.'
notes_for_client: On fasting days, keeping your electrolytes balanced with a clinician-recommended
  supplement can help prevent dizziness and fatigue.
