contraindications:
  conditions:
  - Hyperthyroidism — guggulsterones may increase thyroid hormone output (catalogue claim
    guggul-thyroid-medication-interaction-caveat-levothyroxine)
  medications:
  - Levothyroxine / thyroid medication — guggul may change T4→T3 conversion and thyroid output;
    monitor TSH if combined (catalogue claim guggul-thyroid-medication-interaction-caveat-levothyroxine)
  - Propranolol and diltiazem — guggulsterones reduce their absorption in a human pharmacokinetic
    study (WHO monograph; catalogue claim who-guggul-drug-interactions-pregnancy-safety)
  - Anticoagulants / antiplatelets — guggul has antiplatelet activity; additive bleeding risk
  life_stages:
  - 'Pregnancy — contraindicated: uterine-stimulant activity (WHO monograph)'
