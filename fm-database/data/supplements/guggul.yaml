notes_for_coach: |-
  Latin: Commiphora mukul; Burseraceae. Sanskrit: Guggulu. Traditional indications:
  arthritis, rheumatism, gout, lumbago, nervous disorders, neurasthenia, debility,
  diabetes, obesity, bronchitis, whooping cough, dyspepsia, hemorrhoids, pyorrhea, skin
  diseases, sores and ulcers, cystitis, endometritis, leucorrhea, tumors. Precautions:
  acute kidney infections, acute stage of rashes; only mildly aggravates Pitta after
  long-term usage. Ayurvedic energetics from The Yoga of Herbs (Frawley & Lad).

  Best used for: Evidence for lowering cholesterol is conflicting: the best Western
  trial (JAMA 2003) found LDL went slightly UP, and a 2020 Indian RCT of guggulu
  combined with triphala did not beat placebo. Joint-pain use is traditional, with only
  small, weak trials. Not a first-line lipid option; keep it to traditional joint
  formulations under Ayurvedic guidance, and avoid it in thyroid clients, pregnancy and
  anyone on blood thinners or propranolol/diltiazem.
