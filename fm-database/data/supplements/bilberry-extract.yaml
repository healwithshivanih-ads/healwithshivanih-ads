notes_for_coach: |-
  Best flavonoid choice for retinopathy or cataracts. Inhibits aldose reductase and
  improves ocular microcirculation. 25% anthocyanidin standardisation required.

  Best used for: Modest evidence from small trials for screen-related eye fatigue and as
  an adjunct in early diabetic retinopathy, using an extract standardised for
  anthocyanins. Cataract and macular-degeneration claims rest on weak or
  combination-product data, and 'night vision' claims failed controlled trials. It is
  not a blood-sugar supplement. High-dose extract has antiplatelet activity, so check
  with the client's doctor if they take blood thinners or have a bleeding disorder.
notes_for_client: Bilberry is the top choice for protecting eyesight in diabetes —
  its anthocyanidins target the exact mechanism that damages retinal blood vessels.
evidence_tier: plausible_emerging
linked_to_mechanisms: []
contraindications:
  conditions:
  - bleeding disorders / haemorrhagic conditions — high-dose fruit extract (≥480 mg/day)
    has antiplatelet activity; use cautiously (WHO Monographs Vol 4)
  medications:
  - anticoagulants / antiplatelet drugs — additive bleeding risk at high dose (WHO
    Monographs Vol 4)
  life_stages: []
sources:
- id: pizzorno-cardiometabolic-diabetes
  location: Nutritional and Herbal Supplements / Flavonoids table
  quote: Bilberry extract (25% anthocyanidins) 160-320 mg — Best choice in diabetic
