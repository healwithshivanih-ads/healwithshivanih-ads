notes_for_coach: 'Must contain methylfolate and folinic acid — NOT folic acid. Ideally
  iron-free unless client is confirmed iron-deficient. Never within 5 hours of bedtime
  (B vitamins are stimulating). Use Pulse Method: take only if feeling fatigued or
  brain-fogged; stop when feeling well.'
notes_for_client: Look for 'methylfolate' or '5-MTHF' on the label, not 'folic acid'.
  Take with breakfast or lunch only — never at night. Start with a quarter of the
  suggested dose.
