notes_for_coach: |-
  Adaptogenic herb with cognitive-enhancing and stress-reducing properties; effects are
  best seen with consistent use over 4–6 weeks.

  Best used for: Evidence is for memory and learning speed in healthy and older adults
  after 8–12 weeks of daily use, with some reduction in anxiety in the same trials. It
  is not a quick fix for brain fog or acute focus, and GI upset (nausea, loose stools)
  is common — take with food.
