notes_for_coach: |-
  Dosed in fibrinolysis units (FU) not mg — 2000 FU per capsule standard. Take on empty
  stomach for fibrinolytic activity. Caution: do NOT combine with warfarin, aspirin, or
  antiplatelet drugs without clinician supervision. Natural alternative to antiplatelet
  therapy for eligible patients.

  Best used for: Best supported for lowering fibrinogen and modestly lowering blood
  pressure. The 3-year NAPS RCT found no slowing of subclinical atherosclerosis
  progression, so it is not worth using for 'plaque dissolving' claims. Never combine
  with blood thinners without the prescriber.
