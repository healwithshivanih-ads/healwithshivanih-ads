notes_for_coach: |-
  Latin: Artemesia vulgaris; Compositae. Sanskrit: Nagadamani. Traditional indications:
  dysmenorrhea, menorrhagia, infertility, preventive for miscarriage, sciatica,
  convulsions, hysteria, epilepsy, depression, mental exhaustion, insomnia, gout,
  rheumatism, fungal infections. Precautions: high Pitta, uterine infection or
  inflammation. Ayurvedic energetics from The Yoga of Herbs (Frawley & Lad).

  Best used for: Traditional herbal use only for painful or scanty periods; there are no
  meaningful human trials. Not worth choosing for PMS, infertility or arthritis when
  better-evidenced options exist, and never in pregnancy or for anyone trying to
  conceive.
