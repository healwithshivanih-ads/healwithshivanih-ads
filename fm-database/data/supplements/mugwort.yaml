contraindications:
  conditions:
  - Seizure disorders / epilepsy — Artemisia species contain thujone, a GABA-A antagonist
    that lowers seizure threshold
  - Asteraceae/Compositae allergy (ragweed, chrysanthemum, marigold) or known mugwort-pollen
    allergy — mugwort is a major allergen with celery–mugwort–spice cross-reactivity
  medications: []
  life_stages:
  - Pregnancy — emmenagogue/uterine stimulant traditionally used to bring on menses; risk
    of miscarriage
  - Lactation — no safety data; thujone content
