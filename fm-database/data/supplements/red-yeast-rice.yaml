notes_for_coach: |-
  2400mg/day cited as equivalent to 40mg simvastatin with fewer side effects. Requires 4
  capsules/day for therapeutic effect. Contains monacolin K (same mechanism as
  lovastatin) — clinician oversight recommended. Also referenced as potentially helpful
  for Lp(a).

  Best used for: Best for mildly raised LDL in clients who cannot or will not take a
  statin, under clinician oversight with lipid and liver monitoring. It is effectively a
  low-dose statin — not to be combined with one, and product quality varies (monacolin
  content, citrinin contamination).
notes_for_client: Red yeast rice is a natural supplement that works similarly to statin
  medications to lower LDL cholesterol. It should be used under clinician supervision,
  as it contains active statin-like compounds.
evidence_tier: plausible_emerging
