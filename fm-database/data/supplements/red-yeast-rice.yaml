contraindications:
  conditions:
  - Liver disease or raised liver enzymes — same hepatotoxicity profile as statins
  - Kidney disease — increased myopathy/rhabdomyolysis risk
  - History of statin-induced myopathy or rhabdomyolysis — monacolin K can reproduce it
  - Heavy alcohol use — additive liver injury risk with a statin-equivalent
  medications:
  - Statins — duplicate therapy (monacolin K = lovastatin); do not combine
  - Strong CYP3A4 inhibitors (clarithromycin, erythromycin, azole antifungals, HIV protease
    inhibitors, cyclosporine) and gemfibrozil — rhabdomyolysis risk
  life_stages:
  - Pregnancy — statins are contraindicated in pregnancy
  - Breastfeeding
interactions:
