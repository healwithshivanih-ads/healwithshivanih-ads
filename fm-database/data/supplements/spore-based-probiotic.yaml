notes_for_coach: Spore-based probiotics are more resistant to stomach acid and can survive
  transit to colonize the gut. Recommended for long-term use (6–9 months) to achieve lasting
  changes to gut flora. Not recommended for home fermentation due to low CFU counts. Suitable
  for most dysbiosis patterns except active overgrowth/SIBO. Spore-based strains (e.g. Bacillus
  coagulans) are heat-stable and survive stomach acid; useful for SIBO, IBS, and immune support.
notes_for_client: Spore-based probiotics are more resilient than regular probiotics — they
  survive your stomach acid and can help rebuild your gut lining over 6–9 months of consistent
  use.
