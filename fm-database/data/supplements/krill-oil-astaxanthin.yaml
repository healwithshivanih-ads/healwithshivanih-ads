notes_for_coach: |-
  Krill oil contains astaxanthin, a carotenoid with antioxidant properties and potential
  5-AR inhibiting activity. Listed in the FMCN toolkit. Clinician should guide dosing.

  Best used for: A lower-dose, pricier way to get EPA/DHA; modest triglyceride lowering
  and limited data for period pain. For triglycerides or inflammation, standard fish oil
  at an adequate EPA/DHA dose is usually better value; the DHT/5-alpha-reductase use is
  not well supported.
notes_for_client: Krill oil contains a powerful antioxidant called astaxanthin that
  may help regulate DHT levels. Take with meals for best absorption.
