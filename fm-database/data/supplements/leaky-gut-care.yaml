notes_for_coach: 'Practitioner-dispensed COMBINATION powder, not a single compound —
  catalogued so plans that prescribe it resolve. Label description: L-glutamine + zinc
  carnosine + mucosal herbs, 80 g powder, 1 scoop daily in water between meals.
  Consolidates what would otherwise be separate glutamine / zinc carnosine / aloe / DGL
  repair items into one product — fewer pills, better adherence. CAUTION: per-ingredient
  amounts are NOT stated on the label, so you cannot assume the L-glutamine reaches a
  5 g gut-repair dose. If a therapeutic glutamine dose is the goal, prescribe
  [[l-glutamine]] alongside and record why. Clinical rationale per ingredient lives on
  its own entry — see [[l-glutamine]], [[zinc-carnosine]].'
notes_for_client: A gut-soothing powder you stir into water between meals. It brings
  several lining-repair ingredients together so you are not taking four separate things.
