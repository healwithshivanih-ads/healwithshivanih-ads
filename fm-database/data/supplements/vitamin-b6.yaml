slug: vitamin-b6
display_name: Vitamin B6 (Pyridoxine)
category: vitamin
forms_available:
- capsule
- tablet
evidence_tier: strong
notes_for_coach: 'Clinical trial used 5 mg/kg body weight — this is a prescription-level dose and must
  be clinician-supervised. Also lowers homocysteine synergistically with folate. Long-term high-dose B6
  risk of peripheral neuropathy.


  MERGED 2026-08-02: vitamin-b6-pyridoxine, pyridoxine-b6 and vitamin-b6-b12 were duplicate entries for
  this same compound and have been merged in; all three survive as aliases so existing plan and catalogue
  references still resolve. Pyridoxal-5-phosphate (P5P) is deliberately kept as a SEPARATE entry — it
  is the active coenzyme form, the same reasoning that keeps folate and methylfolate separate. SAFETY:
  pyridoxine neuropathy is dose-dependent and presents as hand numbness/tingling that can be mistaken
  for the very symptom being treated; do not escalate above the stated range.'
notes_for_client: B6 may help lower blood pressure by calming the nervous system and reducing stress hormones.
  Discuss dosing with your healthcare provider.
