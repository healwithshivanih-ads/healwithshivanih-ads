notes_for_coach: |-
  Latin: Asparagus racemosus; Liliaceae. Sanskrit: Shatavari. Traditional indications:
  debility of the female organs, sexual debility, infertility, impotence, menopause,
  diarrhea, dysentery, stomach ulcers, hyperacidity, dehydration, lung abscess,
  hematemesis, cough, convalescence, cancer, herpes, leucorrhea, chronic fevers.
  Precautions: high Ama, excessive mucus. Ayurvedic energetics from The Yoga of Herbs
  (Frawley & Lad).

  Best used for: Most promising evidence is for perimenopausal and menopausal hot
  flushes and for early postpartum milk supply, each from small single RCTs of
  standardised branded extracts. Results may not carry over to loose powders, and it
  does not correct the hormonal drivers of PCOS.
