notes_for_coach: |-
  Listed as a 5-α reductase inhibitor. More commonly used in FM for menopausal symptom
  relief. Clinician should supervise use especially in women with hormone-sensitive
  conditions.

  Best used for: Best evidence is for hot flashes and night sweats in
  perimenopausal/menopausal women, particularly those who cannot or prefer not to use
  hormone therapy; trial results are mixed, so set expectations and review at 8–12
  weeks. Not a testosterone or DHT intervention.
notes_for_client: Black cohosh is an herb used in hormone support, particularly for
  menopausal symptoms. It may also help regulate DHT levels.
