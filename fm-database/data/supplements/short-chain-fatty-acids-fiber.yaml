notes_for_coach: |-
  Dietary fibre is fermented by gut bacteria to produce short-chain fatty acids (SCFAs)
  like butyrate, which are key nutrients for colonocytes and gut healing. Emphasise
  whole food fibre sources; fibre supplements can be used adjunctively.

  Best used for: Food-first fibre is the foundation; as a supplement, soluble fibre such
  as psyllium has the best evidence — for constipation, IBS, LDL cholesterol and
  glycaemic control. Start low and build slowly; highly fermentable fibres (inulin, FOS)
  often aggravate bloating in SIBO/IBS.
notes_for_client: Eating enough fibre feeds your good gut bacteria, which produce substances called short-chain fatty acids
  that help heal your gut lining.
