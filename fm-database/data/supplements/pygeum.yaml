notes_for_coach: |-
  Pygeum has clinical trial evidence for BPH symptom relief and inhibits 5-α reductase.
  Often combined with saw palmetto. Dosing requires clinician guidance.

  Best used for: Evidence is limited to modest relief of BPH urinary symptoms
  (night-time urination, weak flow) in older men; older trials were small and short.
  Only after a doctor has evaluated the prostate (PSA, exam) — not for testosterone,
  hair loss or general men's health.
notes_for_client: Pygeum is an African tree bark extract traditionally used to support
  prostate health and urinary flow.
