notes_for_coach: |-
  Prebiotics feed beneficial bacteria and support short-chain fatty acid (SCFA)
  production, which nourishes colonocytes. Increase dose gradually to minimize
  gas/bloating during introduction.

  Best used for: Best for constipation and for rebuilding beneficial bacteria once the
  gut is calm, started low and increased slowly. Not a good choice in SIBO or
  FODMAP-sensitive IBS, where it usually worsens bloating — use psyllium or PHGG
  instead.
notes_for_client: Prebiotic fiber feeds the good bacteria in your gut and helps them produce compounds that repair the gut
  lining. Increase intake slowly to avoid gas.
