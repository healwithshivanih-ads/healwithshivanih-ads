notes_for_coach: |-
  Copper is the primary cofactor for DAO enzyme activity. Lynch notes most people get
  enough from food but long-term zinc supplementation can deplete copper. Start with low
  dose (1 mg) and only if copper is not already present in a multivitamin. Excess copper
  is inflammatory — check copper levels via lab before supplementing. Do not supplement
  if copper toxicity is suspected (e.g., Wilson's disease).

  Best used for: Mainly a small top-up for clients on long-term high-dose zinc, or with
  lab-confirmed low copper, where copper deficiency can cause anaemia that does not
  respond to iron. Most people get enough from food. Its role in histamine intolerance
  (as the DAO cofactor) is plausible but untested in trials. Excess copper is harmful.
notes_for_client: Your histamine-clearing enzyme needs copper to work. Most people
  get enough from food — only consider supplementing if you've been taking zinc for
  a long time.
