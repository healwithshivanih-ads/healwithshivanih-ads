notes_for_coach: |-
  A standardized herbal combination product (9 herbs including bitter candy tuft,
  peppermint, chamomile). Listed as a 'transit time modulator' in PPI tapering. Has RCT
  data for functional dyspepsia and IBS.

  Best used for: Best evidence is for functional dyspepsia (fullness, early satiety,
  epigastric pain) and, to a lesser degree, IBS. Not a fix for acid-driven GERD or H.
  pylori, and not for anyone with liver disease, in pregnancy or breastfeeding, or for
  clients avoiding alcohol (the liquid is about 30% ethanol).
