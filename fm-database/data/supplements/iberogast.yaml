contraindications:
  conditions:
  - Liver disease or a history of drug-induced liver injury — contains greater celandine;
    the manufacturer added a liver-injury warning in 2018 after rare hepatotoxicity cases
  - Alcohol dependence or clients avoiding alcohol — the liquid contains about 31% ethanol
  medications: []
  life_stages:
  - Pregnancy — manufacturer advises against use (insufficient safety data, celandine content)
  - Lactation — manufacturer advises against use (insufficient safety data)
