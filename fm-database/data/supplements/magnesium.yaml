notes_for_coach: 'Essential cofactor for both the methylation cycle and COMT enzyme function.
  Approx. 50% of US adults are deficient. Common causes of depletion: high caffeine intake
  and long-term PPI use. Food sources: dark leafy greens, nuts, seeds, fish, beans, avocados,
  whole grains. Supplement form (glycinate, malate) matters for tolerability. Magnesium is
  required for transcription of the hormonal signal at the receptor. Target RBC (red blood
  cell) magnesium in the high 5s to low 6s mg/dL — standard serum magnesium is a poor proxy.
  Magnesium is chronically depleted by stress, toxicity, and aging. Also linked to hippocampal
  volume maintenance.'
notes_for_client: 'Magnesium is crucial for both your methylation cycle and your COMT gene.
  About half of all adults don''t get enough. Cut back on caffeine — it depletes magnesium.
  Top food sources: dark leafy greens, nuts, seeds, avocados. Magnesium is used up by stress
  and hard to keep in normal range as we age. It''s needed for your hormones to actually send
  their messages in your cells. A magnesium supplement — ideally glycinate or malate form
  — is well tolerated and supports both hormonal and brain health.'
