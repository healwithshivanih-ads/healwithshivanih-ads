contraindications:
  conditions: []
  medications:
  - Cyclosporine, tacrolimus — berberine inhibits CYP3A4 and raises their levels
  life_stages:
  - pregnancy — berberine crosses the placenta and can displace bilirubin (kernicterus risk)
  - lactation — berberine passes into breast milk
