notes_for_coach: |-
  Some evidence for ~9% cholesterol reduction. Clinician uses when clinically indicated.
  Thin evidence base — categorized as plausible_emerging.

  Best used for: Best supported for modest LDL lowering (strain NCIMB 30242), functional
  constipation, and reducing side effects during H. pylori treatment (DSM 17938).
  Benefits are strain-specific; do not expect statin-level lipid effects. Bone, oxytocin
  and skin claims rest on single small trials or animal data.
notes_for_client: Lactobacillus reuteri is a probiotic strain with some research suggesting it may modestly lower cholesterol.
  It supports gut health, which is linked to systemic inflammation.
