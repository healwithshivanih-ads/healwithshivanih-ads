notes_for_coach: |-
  Supports cortisol blunting and cognitive resilience under stress. Often combined with
  adaptogens for adrenal recovery protocols. Verify dose with clinician.

  Best used for: Best suited to the stressed client with an exaggerated cortisol
  response to acute stress, and to older adults with mild memory complaints. The memory
  evidence is strongest for the older bovine-derived form, and soy/sunflower PS results
  are mixed. Small trials in children with diagnosed ADHD are encouraging but
  preliminary. It will not correct a flat, low-cortisol picture.
