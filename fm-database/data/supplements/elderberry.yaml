notes_for_coach: |-
  Elderberry has the best evidence base of the botanicals in this toolkit for upper
  respiratory symptoms (Hawkins 2019 meta-analysis). Safe for most adults and children.
  Caution in severe COVID-19 due to theoretical cytokine-stimulating effects.
  Standardized extracts preferred.

  Best used for: Strongest evidence is short-term use at the first sign of a cold or flu
  to shorten duration and ease symptoms. Not supported as daily year-round prevention,
  and not a reason to stimulate immunity in clients with active autoimmune disease.
notes_for_client: Elderberry is a safe and well-researched natural remedy for cold
  and flu symptoms. It works best when taken at the start of illness. Available as
  syrup, capsules, or gummies.
evidence_tier: plausible_emerging
