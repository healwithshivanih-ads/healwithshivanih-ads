contraindications:
  conditions:
  - Intestinal obstruction, acute IBD flare, appendicitis or unexplained abdominal pain —
    for whole-leaf/latex (anthraquinone) forms, a stimulant laxative
  - Liver disease — case reports of acute hepatitis with oral aloe extracts
  medications:
  - Diuretics, digoxin and corticosteroids — latex-induced potassium loss raises hypokalaemia
    and digoxin toxicity risk
  life_stages:
  - Pregnancy — latex/anthraquinone forms can stimulate uterine contractions
  - Lactation — anthraquinones pass into breast milk
