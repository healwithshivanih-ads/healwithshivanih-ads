notes_for_coach: |-
  Listed under 'Repair' in PPI tapering protocol. Aloe vera juice/gel may soothe the GI
  lining. Use decolorized (anthraquinone-free) form to avoid laxative effects.

  Best used for: Decolourised inner-leaf gel has small-trial support for reflux
  symptoms, mild ulcerative colitis and modest glucose lowering; topical gel for skin.
  Avoid whole-leaf/latex products (laxative, potassium loss). Not worth it for IBS —
  trials are mixed.
