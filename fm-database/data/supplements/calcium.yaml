notes_for_coach: 'STUB — dose deliberately blank. FM stance is FOOD-FIRST for calcium:

  dairy, sardines/small fish with bones, leafy greens (collards, kale),

  sesame seeds, ragi, almonds. Supplementation routinely is *not* the FM

  default — excess supplemental calcium has been associated with

  cardiovascular concerns in some studies and competes with magnesium

  (most modern populations are magnesium-deficient, not calcium-deficient).

  Supplementation, when needed, is a clinician decision based on bone

  density, dietary intake, and CKD/CV risk profile.


  Vitaone perspective ("Bone Health Beyond Calcium" post): bone health

  needs vitamin D, K2, magnesium, weight-bearing exercise, protein,

  and gut absorption — not just calcium dosing. Calcium supplementation is rarely the correct first
  intervention for low serum calcium. Coaches should encourage clients to work with their clinician
  to rule out albumin deficiency, magnesium deficiency, low vitamin D, and hypochlorhydria before
  assuming dietary calcium supplementation is needed.'
notes_for_client: 'Calcium for your bones.

  Keep it a few hours from iron or a thyroid tablet — together they block each other.

  Most people get what they need from food — dairy, ragi, sesame, leafy greens, small
  fish with bones — and bones depend on vitamin D, K2, magnesium, protein and
  weight-bearing movement together, not calcium alone.

  A low calcium reading on a blood test does not by itself mean you need a supplement.
  Please check with your doctor before starting one — protein, magnesium and vitamin D
  are often the real reason.'
