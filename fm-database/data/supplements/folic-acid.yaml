sources:
- id: pizzorno-cardiometabolic-atherosclerosis
  location: Homocysteine
  quote: Folic acid (400 mcg daily) alone can reduce homocysteine in some subjects,
    but not all; importance of vitamins B12 and B6 to homocysteine metabolism indicates
    all three should be used together.
version: 2
status: active
updated_at: '2026-10-07'
updated_by: shivani
contraindications:
  conditions:
  - Untreated or unconfirmed B12 deficiency / pernicious anaemia — folate (especially >1 mg/day)
    can correct the anaemia and mask B12 deficiency while nerve damage progresses; check B12
    first or co-supplement
  medications:
  - Methotrexate used for cancer — folate can blunt its effect (low-dose folate alongside
    RA/psoriasis methotrexate is usually prescribed deliberately; leave that to the prescriber)
  - Phenytoin, phenobarbital, primidone and other enzyme-inducing anticonvulsants — folate
    supplementation can lower drug levels and seizure control; prescriber should monitor
  life_stages: []
