notes_for_coach: |-
  Mentioned as universally prescribed alongside Vitamin D. K2 specifically is relevant
  for vascular calcification prevention. Patients on anticoagulants (warfarin) must
  discuss with their clinician before supplementing.

  Best used for: Best as the bone/vascular partner to vitamin D in postmenopausal women
  with low BMD or osteopenia. Not useful for fatigue or lipids, and never a casual
  add-on for anyone on warfarin.
notes_for_client: Vitamin K (especially K2) works alongside Vitamin D and supports
  vascular health. If you are on blood thinners like warfarin, always check with your
  doctor before taking Vitamin K.
