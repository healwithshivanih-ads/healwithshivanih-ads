contraindications:
  conditions:
  - Bowel obstruction, ileus or markedly slowed gut transit — charcoal can impact/form bezoars
    (claim ac-aspiration-pneumonitis-bezoar-major-risks)
  - Chronic constipation — commonly worsens it; avoid regular use
  - GI bleeding or suspected perforation — can obscure endoscopy and worsen obstruction
