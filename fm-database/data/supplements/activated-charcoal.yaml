notes_for_coach: |-
  Used specifically around dental amalgam removal: 800-1000mg immediately before
  procedure, immediately after, and next morning/afternoon. Discontinue by day 2
  post-procedure. Do not take within 2 hours of chlorella. Adult doses only.

  Best used for: There is no good human evidence for the amalgam-removal use — charcoal
  binds metals poorly (the catalogue's own claim says so); its established evidence base
  is emergency poisoning, which is outside coaching scope. Gas relief trials are mixed.
  If used at all, keep it to a short, one-off window and keep it at least 2 hours away
  from all medicines and supplements. Not a daily 'detox' supplement: it binds nutrients
  and medicines indiscriminately and constipates.
notes_for_client: Activated charcoal works like a sponge in your gut to bind and remove
  mercury and other toxins before they can be absorbed. Only use for the short window
  around your dental appointment as directed.
