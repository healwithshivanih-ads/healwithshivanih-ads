  life_stages: []
interactions:
  with_supplements: []
  with_foods: []
  with_medications:
  - medication: methotrexate
    type: monitor
    reason: Methotrexate used for cancer — folate can blunt its effect (low-dose folate alongside
      RA/psoriasis methotrexate is usually prescribed deliberately; leave that to the prescriber)
  - medication: phenytoin
    type: monitor
    reason: Phenytoin, phenobarbital, primidone and other enzyme-inducing anticonvulsants
      — folate supplementation can lower drug levels and seizure control; prescriber should
      monitor
