contraindications:
  conditions:
  - chronic liver disease or heavy alcohol use — retinol hepatotoxicity
  - osteoporosis — chronic high retinol intake associated with fracture risk
  - chronic liver disease or heavy alcohol use — retinol is stored in the liver and is hepatotoxic
    in excess
  - osteoporosis — chronic retinol intake above ~1,500 mcg RAE/day is associated with higher
    fracture risk
  medications:
  - isotretinoin, acitretin or other oral retinoids — additive toxicity
  - isotretinoin, acitretin or other oral retinoids — additive vitamin A toxicity
  life_stages:
  - pregnancy and women who may conceive — high-dose retinol is teratogenic (notes say this,
    but it is not in the structured list)
  - pregnancy and women who may conceive — retinol above ~3,000 mcg RAE (10,000 IU)/day is
    teratogenic
