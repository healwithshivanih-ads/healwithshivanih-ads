notes_for_coach: 'High-dose vitamin A cited for chronic GU protection. CRITICAL: teratogenic
  — use

  beta-carotene if pregnancy is possible (explicitly stated in treatment algorithm).

  Therapeutic dose supervision required.


  Best used for: Useful mainly where intake or absorption is genuinely low (fat

  malabsorption, pancreatic insufficiency, very restricted diets). Food sources and

  beta-carotene are the safer default; supplemental retinol needs a clear reason and

  supervision, and should not be used by anyone who is pregnant or could become

  pregnant.


  Dose note merged from Vitamin A (Retinol) — Hormone Receptor Activation: capsule 2500–5000
  mcg (this entry keeps 5000–25000 mcg).


  Merged from Vitamin A (Retinol) — Hormone Receptor Activation: Vitamin A (retinol form,
  not beta-carotene) is present in every hormone receptor binding domain and switches the
  receptor from repressor to expressive mode. Document mentions ~3,000 IU/day for physiologic
  receptor function. High-dose vitamin A (above ~10,000 IU/day long-term) has toxicity risks
  — verify with clinician, especially in pregnancy. The document notes past fears around vitamin
  A toxicity from polar bear liver consumption as historically overweighted.'
notes_for_client: Vitamin A supports the lining of your stomach. If there's any chance you
  could be pregnant, use beta-carotene instead — high-dose vitamin A is not safe in pregnancy.
