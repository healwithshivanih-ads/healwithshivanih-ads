notes_for_coach: |-
  Murray dose 100-200 mg/day oral; add when glucosamine alone insufficient.
  Low-molecular-weight HA preferred for absorption. Effect on cartilage hydration +
  synovial fluid viscosity. Also benefits skin hydration as bonus effect.

  Best used for: Strongest (still modest) evidence is as an adjunct for knee
  osteoarthritis pain and for skin hydration in older adults, over 8-12 weeks. Not worth
  it as a first-line joint supplement before weight, movement and omega-3 basics are in
  place, and not a treatment for inflammatory arthritis.
notes_for_client: 'Oral hyaluronic acid 100-200 mg daily supports joint cushioning
  + skin hydration.

  Take on empty stomach. Effect on joints builds over 8-12 weeks.

  '
