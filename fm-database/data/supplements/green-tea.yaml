notes_for_coach: 'Used as a smoothie base liquid across multiple recipes (Cardio Smoothie,
  Detox Smoothie, Rainbow Smoothie). Green tea catechins (EGCG) are well-studied for antioxidant,
  metabolic, and cardiovascular benefits. 4–8 oz brewed per smoothie. Decaffeinated, 80% polyphenol
  content preferred. Foundation supplement for recently diagnosed T1DM due to antiviral (rotavirus/enterovirus)
  and epicatechin beta-cell protective effects. Adults: 150–300 mg/day. Children <6y: 50–150
  mg; 6–12y: 100–200 mg.'
notes_for_client: Using brewed green tea as your smoothie base adds antioxidants that support
  heart and metabolic health — with less caffeine than coffee. Green tea extract provides
  protective plant compounds that may help preserve insulin-producing cells, especially in
  early-stage type 1 diabetes.
