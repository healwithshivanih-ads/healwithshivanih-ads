contraindications:
  conditions:
  - Liver disease or prior liver injury — concentrated green tea extract (EGCG ≥800 mg/day,
    especially taken fasting) is linked to hepatotoxicity (EFSA 2018); brewed tea is not the
    concern
  - Iron-deficiency anaemia under active correction — tea catechins block non-haem iron absorption;
    take between meals, never with iron supplements
  medications:
  - Nadolol — green tea reduced nadolol blood levels by ~85% in a human study (Misaka 2014);
    avoid the combination
