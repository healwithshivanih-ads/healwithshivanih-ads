contraindications:
  conditions:
  - Bipolar disorder — antidepressant activity; risk of triggering mania (as with other antidepressants)
  medications:
  - SSRIs / SNRIs / MAOIs (serotonin syndrome risk)
  - anticoagulants (mild antiplatelet effect)
  life_stages:
  - pregnancy (uterine stimulant at higher doses — avoid > 5 g/day; supplement dose probably
    safe but avoid first trimester)
  - breastfeeding (insufficient data)
