notes_for_coach: |-
  Active compounds — crocin, crocetin, safranal, picrocrocin. Mechanism: serotonin
  + dopamine + glutamate modulation; mild MAO-A inhibition. Comparable efficacy to
  fluoxetine 20 mg in mild-to-moderate depression (Akhondzadeh 2005) and to
  imipramine (Akhondzadeh 2004).

  Two practical forms:
  - Stigma extract (the red threads, expensive) — research-grade, traditional
  - Petal extract (the purple flower petals, much cheaper) — Murray's recommendation
    when budget is a factor; comparable efficacy in newer trials (Hosseinzadeh 2010)

  Trial dose for PMS, depression, anxiety: 15 mg twice daily (30 mg total). Effect
  develops over 4-8 weeks. Generally well-tolerated. India produces high-quality
  Kashmir saffron at competitive prices.

  Best used for: Among the better-studied herbs for mild-to-moderate low mood (small
  RCTs over 6–8 weeks, some comparing favourably with standard antidepressants), with
  smaller trials for PMS and for SSRI-related sexual side effects. An adjunct only — not
  a replacement for clinical care in moderate–severe depression or with any suicidal
  thoughts; avoid in bipolar disorder and use with antidepressants only with the
  prescriber's knowledge.
notes_for_client: 'Saffron (kesar) — the world''s most expensive spice but the most
  concentrated form

  is 15 mg twice daily as an extract. Used in Persian + Indian traditional medicine

  for low mood + women''s hormonal symptoms. Modern trials show it works as well as

  Prozac for mild-to-moderate depression. Effect builds over 4-8 weeks.

  '
