contraindications:
  conditions:
  - Sodium-restricted diets (heart failure, uncontrolled hypertension, advanced kidney disease)
    — some alginate products (e.g. Gaviscon-type) carry substantial sodium
  medications:
  - Levothyroxine, iron, tetracycline/quinolone antibiotics, bisphosphonates — calcium/antacid
    components reduce absorption; separate by 2-4 hours
