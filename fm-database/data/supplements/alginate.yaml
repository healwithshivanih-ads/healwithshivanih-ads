notes_for_coach: |-
  Alginate forms a physical 'raft' on top of stomach contents to prevent acid reflux.
  Listed under 'Protect' in PPI tapering. Some RCT evidence for GERD symptom relief.

  Best used for: Strong, practical evidence for reflux and heartburn, especially after
  meals and at bedtime, and a key 'protect' tool while tapering off a PPI. Treats
  symptoms, not cause — pair with root-cause work (meal size, late eating, weight, H.
  pylori).
