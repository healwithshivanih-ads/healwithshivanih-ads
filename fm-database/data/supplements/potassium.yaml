notes_for_coach: |-
  OTC supplements limited to 99 mg/dose by FDA. Salt substitutes (NoSalt, Nu-Salt)
  provide ~530 mg/1⁄6 tsp. Therapeutic doses (2.5–5 g/day) require food-based approach
  or clinician supervision. Contraindicated with digitalis, K-sparing diuretics, ACE
  inhibitors, and in kidney disease.

  Best used for: Strongest evidence is for lowering blood pressure, mainly by raising
  potassium from food (fruit, vegetables, coconut water, dal); prescription potassium
  citrate is used by doctors to prevent recurrent kidney stones. Supplemental potassium
  is unsafe in kidney disease or with BP medicines that raise potassium (ACE inhibitors,
  ARBs, spironolactone) — anything above food-level intake belongs with the client's
  doctor.
notes_for_client: Potassium works hand-in-hand with sodium — the more you get from
  fruits and vegetables, the better your blood pressure tends to be. High-dose pills
  can cause stomach upset; food is always best.
