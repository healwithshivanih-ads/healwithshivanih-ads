contraindications:
  conditions:
  - Chronic kidney disease / reduced eGFR — impaired potassium excretion, risk of dangerous
    hyperkalaemia
  - Known hyperkalaemia or Addison's disease (adrenal insufficiency) — cannot excrete potassium
    normally
  - Oesophageal or GI stricture, delayed gastric emptying or slowed gut transit — solid potassium
    chloride tablets can cause GI ulceration/bleeding (labelled warning)
  medications:
  - ACE inhibitors and ARBs (e.g. ramipril, telmisartan, losartan) — raise serum potassium;
    supplement can cause hyperkalaemia
  - Potassium-sparing diuretics (spironolactone, eplerenone, amiloride) — additive hyperkalaemia
    risk
  - Digoxin — potassium shifts (high or low) alter digoxin toxicity and arrhythmia risk
  life_stages: []
