notes_for_coach: |-
  Latin: Myrica spp.; Myricaceae. Sanskrit: Katphah. Traditional indications: colds,
  flus, laryngitis, sinus and nasal congestion, sore throat, asthma, bronchitis,
  adenoids, fever, bleeding gums, chronic sores, epilepsy. Precautions: high Pitta,
  hyperacidity, hypertension. Ayurvedic energetics from The Yoga of Herbs (Frawley &
  Lad).

  Best used for: Traditional Ayurvedic/Western herbal anti-Kapha decongestant for colds,
  sinus and throat; there are no modern human trials. Use only as a traditional adjunct,
  and avoid in high blood pressure or high Pitta/acidity.
