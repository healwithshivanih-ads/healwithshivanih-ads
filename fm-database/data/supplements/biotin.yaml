notes_for_coach: 'Pharmacological doses (9–16 mg/day) — much higher than standard supplements.

  Upregulates glucokinase (hepatic glucose utilisation enzyme). Adjust insulin when

  adding. Also used for neuropathy. Combination with Cr picolinate: 2 mg biotin + 600

  mcg Cr.


  Best used for: A niche, specialist option for blood sugar, supported only by small

  older trials (often combined with chromium). Not a first-line glucose intervention. At

  these doses it also makes thyroid and cardiac blood tests unreliable, so any use needs

  clinician oversight.


  Dose note merged from Vitamin B7 (Biotin): capsule 300–10000 mcg (this entry keeps 8–16
  mg).


  Merged from Vitamin B7 (Biotin): Only one active form (D-Biotin). Stop 3–4 days before labs.
  High doses may interfere

  with B5 and compete for absorption. 300 mcg typical; high-dose hair protocols

  (2500–10,000 mcg) should be supervised.


  Best used for: Strongest for brittle nails and for hair loss in people who are

  actually biotin-deficient (long antibiotic courses, raw egg white intake,

  anticonvulsants, pregnancy). Little evidence for hair loss in people with normal

  biotin status, and high doses distort thyroid lab results — important for thyroid

  clients.'
notes_for_client: At high doses, biotin activates a key liver enzyme that helps process blood
  sugar — different from standard biotin supplements which use much lower doses.
