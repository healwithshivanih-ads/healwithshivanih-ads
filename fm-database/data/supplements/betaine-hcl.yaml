take_with_food: required
notes_for_coach: |-
  Use only with meals; not needed for light meals. CONTRAINDICATED in confirmed or
  suspected gastric ulcers. Do not open capsules (highly acidic). Pancreatic enzymes
  should be combined. For fat intolerance, add lipase or ox bile (~250 mg).

  Best used for: Used in FM for suspected low stomach acid (heaviness after protein,
  belching, undigested food, B12/mineral malabsorption), typically via a careful
  titration with meals. Human evidence is thin and mostly mechanistic; avoid entirely
  with ulcers, gastritis, NSAID/steroid use or if the client is on acid-suppressing
  medication.
