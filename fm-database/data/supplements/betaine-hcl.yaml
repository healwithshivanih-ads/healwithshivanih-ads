contraindications:
  conditions:
  - Active peptic or gastric ulcer, gastritis or erosive oesophagitis — supplemental acid
    can worsen mucosal injury (already stated in notes_for_coach but missing from contraindications)
  - Untreated H. pylori infection — treat infection first; acid supplementation can aggravate
    mucosal damage
  medications:
  - NSAIDs (including regular aspirin) and oral corticosteroids — combined with supplemental
    acid increase ulcer/GI bleed risk
  - PPIs and H2 blockers — directly opposing therapy; do not combine without clinician input
  life_stages: []
