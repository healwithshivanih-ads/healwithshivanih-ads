notes_for_coach: Betaine provides an alternative (BHMT) pathway for homocysteine remethylation
  independent of MTHFR/folate. Useful as adjunct when B vitamin supplementation alone is insufficient
  to normalise homocysteine. Dosing should be confirmed with clinician. TMG (betaine) is a
  methyl donor that supports homocysteine clearance via the BHMT pathway — an alternative
  methylation route. Useful alongside folate/B12. Clinician verification of dosing recommended.
notes_for_client: Betaine (also known as TMG) supports methylation through a separate pathway,
  providing additional help in managing homocysteine levels. TMG (trimethylglycine) acts as
  a methyl donor to help lower homocysteine and support liver and methylation health.
