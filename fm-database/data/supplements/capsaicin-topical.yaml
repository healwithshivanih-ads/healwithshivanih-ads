notes_for_coach: |-
  Over-the-counter 0.075% cream; apply b.i.d. to affected area (not open wounds). Use
  gloves/plastic wrap to protect hands. Burning sensation expected initially; consistent
  daily use required for sustained effect.

  Best used for: A topical option for localised nerve pain (diabetic neuropathy) and
  knee or hand osteoarthritis pain, requiring consistent daily use for 2–4 weeks before
  benefit. Not for widespread pain, and the initial burning makes adherence the main
  limit.
notes_for_client: Capsaicin cream from chilli peppers blocks pain signals in nerves when applied to the
  skin. It works best when used every day.
