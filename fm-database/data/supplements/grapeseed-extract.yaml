contraindications:
  conditions:
  - Hypothyroidism, Hashimoto's, or impaired T4-to-T3 conversion — NOT a thyroid
    supplement, and the theoretical direction of effect runs the wrong way
    (catechin lowered TPO and 5'-deiodinase I in rats). If used for a vascular
    reason, keep the dose modest, space it well away from levothyroxine, and
    recheck TSH at the next panel
  - Bleeding disorders, or any recent or planned surgery or dental extraction —
    stop at least 2 weeks before
  - Iron deficiency or iron-deficiency anaemia under active correction —
    proanthocyanidins are condensed tannins and block non-haem iron absorption;
    finish correcting the iron first, or separate by at least 2 hours
  - Known reactivity to grapes or grape seeds — check the client's own food
    intolerance and allergy record before suggesting it, since grape seed appears
    on some microbiome-derived intolerance panels
  medications:
  - Anticoagulants and antiplatelets (warfarin, clopidogrel, aspirin, DOACs) —
    theoretical additive bleeding risk, clinician sign-off required
  - Antihypertensives — additive blood-pressure lowering; a client on an ARB, CCB
    or beta-blocker should keep a home BP log and have the doctor aware
  - Drugs cleared by CYP3A4 — grape seed inhibits CYP3A4 in vitro; review the full
    medication list rather than assuming a plant supplement is inert
  life_stages:
  - Pregnancy — no data, not studied
  - Lactation — no data, not studied
interactions: {}
