notes_for_coach: |-
  Bisglycinate form preferred for tolerability and absorption. Critically, iron
  supplementation should be deferred until gut lining is healing and symptoms are
  improving — absorption will be poor and potentially counterproductive if initiated
  during active gut inflammation. Confirm iron deficiency anaemia with clinician before
  prescribing.

  Best used for: Best for confirmed iron deficiency (ferritin below about 30-50) with or
  without anaemia — heavy periods, vegetarians, hair shedding, restless legs, fatigue —
  when the client cannot tolerate inorganic iron salts. Not worth it, and potentially
  harmful, when ferritin is normal or high.
notes_for_client: Iron is best absorbed once your gut is healing. Your practitioner
  will time this carefully so your body can actually take it in.
