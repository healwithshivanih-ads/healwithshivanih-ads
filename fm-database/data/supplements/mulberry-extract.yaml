notes_for_coach: |-
  Alpha-glucosidase inhibitor; 1000 mg dried leaf equivalent t.i.d. with meals at Level
  2 T2DM. Also antioxidant — reduces RBC membrane lipid peroxidation. Monitor glucose
  when combining with insulin/sulfonylureas.

  Best used for: Best evidence is for flattening post-meal glucose spikes when taken
  just before carbohydrate-containing meals, in prediabetes, insulin resistance and type
  2 diabetes. Not useful taken away from food or for clients without a glycaemic issue;
  can cause bloating/flatulence like acarbose.
notes_for_client: Mulberry leaf blocks the enzyme that converts starchy food into
  glucose, helping to flatten blood sugar spikes after meals.
evidence_tier: plausible_emerging
linked_to_mechanisms:
- postprandial-glucose-spike
sources:
