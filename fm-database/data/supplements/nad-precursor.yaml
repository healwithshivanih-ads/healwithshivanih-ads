notes_for_coach: 'NMN (nicotinamide mononucleotide) and NR (nicotinamide riboside) are NAD+
  precursors

  used to support mitochondrial energy production and sirtuin signaling. NAD+ depletion

  is documented in aging, post-viral syndromes including Long COVID, and chronic

  fatigue. Standard clinical dose is 250-500 mg/day for general support, up to 1000

  mg/day in post-viral recovery contexts. NR has more human trial data; NMN may raise

  NAD+ levels more efficiently in muscle. Best taken in the morning on empty stomach.

  Avoid in active cancer (sirtuin activation has complex effects on tumour biology).


  Best used for: Reliably raises blood NAD+, but clinical benefits in humans are small

  and inconsistent. One small NMN trial improved muscle insulin sensitivity in

  prediabetic women, while NR trials on insulin sensitivity were null. Use in post-viral

  fatigue or CFS is experimental with no proven benefit. Not worth the cost as a general

  anti-ageing or energy supplement.


  Dose note merged from NMN (Nicotinamide Mononucleotide): capsule 250–500 mg (this entry
  keeps 250–1000 mg).


  Merged from NMN (Nicotinamide Mononucleotide): NAD+ precursor marketed for cellular energy,
  metabolic and longevity support. Evidence

  in humans is emerging, not established — treat claims cautiously. VitaOne product

  (Uthever®) is a 500 mg capsule taken once daily. No major drug interactions

  documented, but longevity/anti-ageing framing should stay educational within coaching

  scope.


  Best used for: Raises blood NAD+ in humans, but clinical benefits are small and

  inconsistent (one small trial improved muscle insulin sensitivity in prediabetic

  postmenopausal women). Not worth the cost as a general energy or anti-ageing

  supplement; keep it educational.'
notes_for_client: NMN is a building block your body uses to make NAD+, a molecule involved
  in cellular energy. Research is still early, so think of it as an optional extra, not a
  foundation.
