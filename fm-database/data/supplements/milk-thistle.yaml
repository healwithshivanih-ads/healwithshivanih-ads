notes_for_client: Milk thistle supports liver health and helps the liver process toxins released
  during a Candida cleanse or when bile flow is sluggish. Milk thistle supports liver health
  — particularly important in diabetes where the liver can be stressed by excess weight or
  high-dose supplements.
