notes_for_coach: 'Supports hepatocyte repair and liver detoxification — useful for Candida
  die-off reactions and sluggish bile. 200-400mg/day of standardized silymarin extract. Best
  choice if diabetic patient shows impaired liver function (common in overweight diabetics
  with fatty liver). Important given high-dose niacin liver risk and fatty liver prevalence.
  Source (IFM Fig 3.5) names silymarin as an antioxidant protective

  plant derivative buffering Phase 1 intermediates but does NOT give

  dosing. Silymarin is the standardized flavonoid complex (silybin,

  silydianin, silychristin) from Silybum marianum (milk thistle seed).

  Hepatoprotective via glutathione preservation, membrane stabilization,

  and antioxidant activity. Standardized extracts (typically 70-80%

  silymarin) are preferred; bioavailability is improved with

  phosphatidylcholine-complexed forms (silybin-phytosome). Listed as a Phase I antioxidant
  protective nutrient in the document''s detox diagram. Specific doses not provided — verify
  with clinician. Well-known hepatoprotective herb in functional medicine.'
