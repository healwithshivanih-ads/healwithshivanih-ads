notes_for_coach: |-
  B-complex is used in the amalgam removal protocol and B vitamins (B2, B3, B6, B12,
  folate) are key nutrients for Phase I cytochrome P450 enzyme function. Specific doses
  not stated in document — verify with clinician.

  Best used for: Best evidence is for lowering raised homocysteine and covering
  B-vitamin shortfalls (vegetarians, metformin/PPI/OCP users, high stress, heavy
  alcohol). A general B-complex is not a fix for diagnosed B12 or folate deficiency,
  which need dedicated dosing.
notes_for_client: B vitamins are essential cofactors for your liver's detox enzymes. They help your body process and clear
  toxins efficiently.
