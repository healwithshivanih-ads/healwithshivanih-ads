notes_for_coach: |-
  Latin: Myristica fragrans; Myristicaceae. Sanskrit: Jatiphala. Traditional
  indications: poor absorption, abdominal pain and distension, diarrhea, dysentery,
  intestinal gas, insomnia, nervous disorders, impotence. Precautions: pregnancy, high
  Pitta; tamasic — in excess can increase dullness of mind. Ayurvedic energetics from
  The Yoga of Herbs (Frawley & Lad).

  Best used for: A traditional Ayurvedic digestive and calming spice (small pinch, e.g.,
  in warm milk). There is no human trial evidence for insomnia or digestive disorders;
  keep to culinary amounts — around 5 g or more can cause nutmeg poisoning.
