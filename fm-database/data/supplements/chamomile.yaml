notes_for_coach: |-
  1g chamomile flower tea daily shown to reduce cortisol and improve sleep quality in
  primary insomnia. Active constituent: apigenin (flavonoid) — acts via GABA-A
  receptors. Source: Coach Shivani clinical observations.

  Best used for: Modest trial evidence for generalised anxiety (standardised extract)
  and for sleep quality in older adults and postpartum women. In diagnosed chronic
  insomnia it has not beaten placebo. A gentle option for mild anxiety or poorer sleep
  quality, not a treatment for severe insomnia or an anxiety disorder that needs medical
  care.
notes_for_client: Chamomile tea contains a calming compound called apigenin that interacts
  with your brain's relaxation receptors, helping to ease stress and support sleep.
