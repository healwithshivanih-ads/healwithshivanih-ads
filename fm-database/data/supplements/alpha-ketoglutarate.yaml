notes_for_coach: |-
  Listed by Fitzgerald among the nutrient-class DNA methylation adaptogens — a required
  cofactor for the TET demethylase enzymes that actively remove errant methyl marks, and
  an emerging longevity supplement. Evidence is largely animal/cell; treat as
  plausible-emerging, food-and-lifestyle first. Endogenous to the citric-acid cycle.

  Best used for: No human outcome trials — evidence is animal/cell and one uncontrolled
  epigenetic-age study. Not worth recommending to clients; food, sleep and exercise come
  first.
