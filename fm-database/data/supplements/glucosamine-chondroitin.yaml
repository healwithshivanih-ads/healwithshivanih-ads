contraindications:
  conditions:
  - Shellfish allergy — most glucosamine is shellfish-derived; use a vegetarian (fermented-corn)
    form
  medications:
  - Warfarin — case reports and MHRA/FDA pharmacovigilance of raised INR and bleeding with
    glucosamine ± chondroitin; prescriber must know
  life_stages:
  - Pregnancy — insufficient human safety data
  - Lactation — insufficient human safety data
