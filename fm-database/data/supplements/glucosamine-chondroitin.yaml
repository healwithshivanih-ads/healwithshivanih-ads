notes_for_coach: |-
  Standard dosing: 1500 mg glucosamine sulfate + 1200 mg chondroitin sulfate daily. GAIT
  trial showed benefit in moderate-severe OA. Shell fish-derived — check for shellfish
  allergy; vegan forms available.

  Best used for: Reasonable for knee osteoarthritis pain with a 2-3 month trial; stop if
  no clear benefit. The large GAIT trial was negative overall, with possible benefit
  only in a moderate-to-severe pain subgroup. Not worth it for general joint pain or
  inflammatory arthritis.
notes_for_client: Glucosamine and chondroitin help nourish your joint cartilage. Take
  consistently for at least 2–3 months to assess benefit. If you have shellfish allergy,
  ask for a vegan form.
