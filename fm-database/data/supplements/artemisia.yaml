notes_for_coach: |-
  Herbal antimicrobial with both anti-inflammatory and antiprotozoal action (used
  against Blastocystis, Giardia, Toxoplasma, Cryptosporidium). Ruscio adds it as a
  second-line agent when an initial herbal antimicrobial protocol under-responds, and
  cites systematic-review evidence for an anti-inflammatory effect in IBD comparable to
  mesalamine. Avoid overuse (antimicrobial resistance); antimicrobial dosing/duration is
  clinician-directed. Dose stub — fill from the treating clinician's product.

  Best used for: A second-line herbal antimicrobial for clinician-guided SIBO or
  parasite protocols, used in short courses. Small trials of wormwood as an add-on in
  Crohn's disease belong to the treating gastroenterologist, not a coaching plan. Not a
  long-term or general gut supplement, and never a substitute for testing and treatment
  of suspected malaria.
