contraindications:
  conditions:
  - History of depression or suicidal ideation — reserpine can cause severe depression
  - Active peptic ulcer or ulcerative colitis — increases gastric acid and GI motility
  - Parkinson's disease — dopamine depletion worsens symptoms
  medications:
  - MAO inhibitors — risk of excitation and hypertensive reaction
  - Other antihypertensives and beta-blockers — additive hypotension and bradycardia
  - Digoxin and antiarrhythmics — increased arrhythmia/bradycardia risk
  - Levodopa — reserpine opposes its effect
  - Antidepressants (SSRIs, TCAs) — additive CNS/mood effects; avoid unsupervised
  life_stages:
  - Pregnancy — reserpine crosses the placenta (neonatal respiratory and nasal congestion)
  - Breastfeeding — passes into breast milk
