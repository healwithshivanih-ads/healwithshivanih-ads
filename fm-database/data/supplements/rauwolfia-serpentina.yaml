notes_for_coach: |-
  Listed as nutraceutical support during beta blocker tapering. Contains reserpine-like
  alkaloids with antihypertensive properties. This is a potent herb; use only under
  direct clinician supervision. Out of coaching scope for specific dosing.

  Best used for: Contains reserpine, a prescription-strength blood-pressure drug; any
  use belongs to a supervising clinician, typically within a medically managed
  antihypertensive plan. Not a coach-recommended supplement, and unsafe with a history
  of depression.
notes_for_client: Rauwolfia is a traditional botanical used for blood pressure support. It should only be used under the direct
  supervision of your clinician.
