notes_for_coach: 'Fat-soluble carotenoid concentrating in the macula and lens, where it filters
  blue light and acts as an antioxidant. Strongest evidence is the AREDS2 formulation for slowing
  age-related macular degeneration; cataract evidence is weaker and largely observational. Usually
  paired with zeaxanthin at roughly 10:2 mg. MUST be taken with a fat-containing meal or absorption
  is poor. Food first: spinach, methi, drumstick leaves, egg yolk, sweetcorn.'
notes_for_client: A pigment found in dark leafy greens and egg yolk that gathers in the eye. Take
  it with a meal containing some fat, otherwise your body cannot absorb it.
