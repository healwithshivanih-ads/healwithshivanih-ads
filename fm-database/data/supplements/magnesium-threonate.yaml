notes_for_coach: |-
  Magnesium L-threonate is specifically noted for crossing the blood-brain barrier and
  is used for chronic fear/hypervigilance and cognitive support. Specific dosing should
  be confirmed with a clinician.

  Best used for: Worth considering mainly for memory/cognitive complaints in midlife and
  older clients, and as a sleep option; evidence is small and largely industry-funded
  (Magtein). It delivers little elemental magnesium, so it is not the form to correct
  deficiency, insulin resistance or constipation.
notes_for_client: This form of magnesium is designed to support brain function and
  reduce mental tension. Best taken in the evening.
