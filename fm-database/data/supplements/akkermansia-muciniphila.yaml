notes_for_coach: |
  WHO THIS IS FOR — a narrow group, deliberately. Overweight/insulin-resistant client,
  gut-barrier picture, ideally with a stool panel showing LOW Akkermansia, and ideally in the
  weight-MAINTENANCE phase rather than the losing phase. That is where the human evidence
  actually sits.

  WHO IT IS NOT FOR. Anyone whose stool panel shows Akkermansia already adequate — Zhang 2025
  found no clinical improvement in that subgroup and poor colonisation. Anyone who has not yet
  done the polyphenol and fibre work, which is free and feeds the whole community rather than
  one organism. Anyone with active IBD (clinician call). Pregnancy/lactation — no data at all.

  ORDER OF OPERATIONS. Food first (polyphenol-rich-plants-feed-akkermansia), then consider
  testing, then the supplement — not the reverse. This is a Rs 1,199/month product whose
  benefit is baseline-dependent; recommending it blind is how a client spends money for a null
  result.

  PASTEURISED, NOT LIVE. Counterintuitive but it is the whole point — Plovier 2017 showed
  pasteurisation ENHANCES the effect (the active part, Amuc_1100, is a heat-stable outer-membrane
  protein signalling via TLR2), and in the human pilot the pasteurised arm carried the signal
  while live was borderline. A "postbiotic" label is what you want here.

  ** PRODUCT CHOICE — TWO OPTIONS, NEITHER PERFECT (updated 2026-09-02). **
  DeAge (Amazon, Rs 2,205/mo) is CONFIRMED PASTEURISED, strain MBAMM87 — coach
  confirmed with the brand 2026-09-02; the Amazon listing itself states neither. It
  therefore matches the form used in every supporting trial. Its open question is the
  strain: MBAMM87 has NO published record (0 in PubMed, 0 in NCBI, absent from
  BacDive, checked 2026-09-02) and is NOT the trial strain — Depommier and Mount used
  MucT/ATCC BAA-835, Zhang used AKK-WST01. Because A. muciniphila shows documented
  strain-specific effects, MBAMM87 inherits the FORM evidence but not the STRAIN
  evidence.
  FM Nutrition Opti-Akkerm (Rs 1,199/mo) is the cheaper option and its form is still
  UNVERIFIED: marketed "postbiotic" but the composition line reads "5 billion CFU" —
  a viability count, which contradicts a heat-killed preparation — and it names no
  strain. Ask FM Nutrition the same two questions put to DeAge; if it comes back
  pasteurised it becomes the better buy on cost alone.

  COACH DECISION 2026-09-02 — FM NUTRITION STAYS THE DEFAULT. Weighed against
  DeAge's confirmed pasteurisation and decided the Rs 1,006/month saved matters more
  to the client than closing a label ambiguity that is probably vendor sloppiness
  rather than a live product. Source rank already delivers this (fmnutrition ranks
  above amazon), so no override is in place — do NOT "fix" the ordering in a later
  session thinking it is an oversight. Revisit only if FM Nutrition confirms the form
  (then the decision is settled on cost) or declines to answer (then reopen it).

  DOSE GAP. All three human trials used 10^10 (10 billion) cells/day. The FM Nutrition product is
  5 billion per capsule at 1/day — half the studied dose. Matching the trial dose means 2 capsules,
  i.e. ~Rs 2,398/month. Say this out loud to the client rather than quietly under-dosing.

  TESTING. Baseline Akkermansia comes off a stool PCR panel — GI-MAP reports it (already in the
  catalogue at ~Rs 22,000, so the test costs many months of the supplement). For most clients the
  proportionate call is to skip the test, do the food work, and reserve the supplement for someone
  who has already had a stool panel for another reason.

  COMMERCIAL INTEREST. Cani and de Vos, senior authors on both positive trials, co-founded the
  companies commercialising this organism and hold related patents. The one independent trial
  (Zhang 2025) was null on its primary analysis. Weigh accordingly.
notes_for_client: |
  A gut organism that helps keep the lining of your gut intact and seems to help the body handle
  blood sugar and hold onto weight loss.

  The food version comes first and costs nothing — pomegranate, berries, green tea, a square of
  dark chocolate, and generally getting plenty of brightly coloured vegetables into the day. That
  is what feeds it.

  If we do add the capsule, it is one a day with breakfast, and it works best alongside the food
  changes rather than instead of them.
evidence_tier: plausible_emerging
sources:
- id: depommier-2019-akkermansia-proof-of-concept
  location: Abstract — results
  quote: Compared to placebo, pasteurized A. muciniphila improved insulin sensitivity
    (+28.62 +/- 7.02%, P = 0.002), and reduced insulinemia (-34.08 +/- 7.12%, P = 0.006)
    and plasma total cholesterol (-8.68 +/- 2.38%, P = 0.02).
- id: mount-2026-pasteurised-akkermansia-weight-maintenance
  location: Abstract — primary outcome
  quote: MucT led to lower body weight regain versus placebo at the end of the weight
    maintenance period. No serious adverse events related to the treatment were observed.
- id: zhang-2025-akkermansia-baseline-dependent-efficacy
  location: Abstract — stratified result
  quote: Our study indicates that metabolic benefits of A. muciniphila supplementation could
    depend on its baseline intestinal levels, supporting the potential for gut microbiota-guided
    probiotic supplementation.
- id: plovier-2017-pasteurised-akkermansia-amuc1100
  location: Abstract — pasteurisation and Amuc_1100
  quote: Amuc_1100, a specific protein isolated from the outer membrane of A. muciniphila,
    interacts with Toll-like receptor 2, is stable at temperatures used for pasteurization,
    improves the gut barrier and partly recapitulates the beneficial effects of the bacterium.
- id: seregin-2017-akkermansia-pathobiont-il10-colitis
  location: Abstract — pathobiont finding
  quote: A. muciniphila can act as a pathobiont to promote colitis in a genetically susceptible host.
- id: anhe-2015-cranberry-polyphenol-akkermansia
  location: Abstract — polyphenol lever
  quote: CE treatment markedly increased the proportion of the mucin-degrading bacterium
    Akkermansia in our metagenomic samples.
