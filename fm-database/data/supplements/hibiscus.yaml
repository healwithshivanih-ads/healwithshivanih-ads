notes_for_coach: |-
  Protocol: three 240 mL cups brewed tea daily OR extract providing 10–20 mg
  anthocyanidins daily. Comparable to captopril 50 mg/day in double-blind RCT. Inhibits
  plasma ACE activity. Active compounds are anthocyanidin glycosides.

  Best used for: One of the better-supported botanicals for mild-to-moderate high blood
  pressure: about three cups of brewed tea a day lowered systolic BP by around 7 mmHg in
  trials. Best for clients with raised BP not yet on, or on a single, BP medicine. Not
  worth it for lipids or weight.
notes_for_client: Hibiscus tea (3 cups/day) or a standardised extract is one of the
  most powerful botanical options for blood pressure — studies show results comparable
  to a common prescription drug.
