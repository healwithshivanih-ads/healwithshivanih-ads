notes_for_coach: |-
  Lycopene is a carotenoid antioxidant found in tomatoes, associated with sperm quality
  improvement in preliminary research. Part of antioxidant rotation protocol for male
  fertility.

  Best used for: Best supported for sperm quality as part of a male-fertility
  antioxidant plan; cooked tomatoes with fat provide it well from food. Blood-pressure
  and prostate-cancer evidence is modest or observational, so it should not be a primary
  tool for those.
notes_for_client: Lycopene is an antioxidant found in tomatoes and other red fruits
  that may help protect sperm from damage.
