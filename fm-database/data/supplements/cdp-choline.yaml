notes_for_coach: |-
  Choline (CDP/PPC forms) listed for NAFLD support. Supports bile production and hepatic
  fat metabolism. Dose not specified — verify with clinician.

  Best used for: Best evidence is for citicoline in older adults with memory decline or
  mild cognitive impairment, as an add-on to lifestyle work. For fatty liver the
  evidence is for phosphatidylcholine (a different product at much higher doses), not
  citicoline. Not worth it for everyday brain fog in younger clients.
