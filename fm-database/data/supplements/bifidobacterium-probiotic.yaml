notes_for_coach: |-
  Bifidobacterium is indicated especially when firmicutes are elevated and Lactobacillus
  is already high — in that case, shift to Bifidobacterium and Saccharomyces boulardii
  rather than broad-spectrum. Like Lactobacillus, transient effect only. Not indicated
  in SIBO.

  Best used for: Best evidence is strain-specific: B. lactis strains for slow
  transit/constipation and B. infantis 35624 for IBS symptoms. Effects are transient
  (need ongoing use) and it is not indicated in SIBO.
notes_for_client: Bifidobacterium helps restore a healthy balance in your gut microbiome, particularly when certain bacterial
  strains are already elevated.
