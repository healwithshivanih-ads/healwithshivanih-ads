notes_for_coach: |-
  Marine collagen (type I) preferred for hair and skin; bovine (type I+III) for joint
  and gut. Pair with vitamin C to support collagen synthesis. Evidence growing for OA
  knee pain and skin elasticity.

  Best used for: Best evidence is for skin hydration and elasticity, knee osteoarthritis
  pain, and bone density in postmenopausal women with low bone density (one year-long
  trial of specific peptides). It is an incomplete protein, so it does not count towards
  a client's protein target. Hair-loss evidence is weak.
notes_for_client: Collagen powder dissolves easily in coffee, smoothies, or water.
  Pair with a vitamin C source for best results.
