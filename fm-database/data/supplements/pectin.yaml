notes_for_coach: |-
  Soluble fiber from fruit; listed under 'Protect' in PPI tapering. May coat and protect
  the gut lining. Also a prebiotic fiber.

  Best used for: A gentle soluble fibre for loose stools and as a 'protect' agent
  alongside alginate/DGL during PPI tapering; at higher food-level doses it lowers LDL
  modestly. Human evidence for gut-lining protection in GERD is thin, so it should not
  be the main reflux intervention.
