notes_for_coach: |-
  Potent fat-soluble carotenoid antioxidant; take with fat-containing meals for optimal
  absorption; supports skin, eye, and endurance.

  Best used for: Evidence is modest and mostly from small trials: eye fatigue from
  screen work, skin photo-ageing/moisture, and as one antioxidant in male-fertility
  protocols. Not worth it as a first-line lipid, cardiovascular or macular-degeneration
  intervention — those links rest on antioxidant rationale rather than outcome trials.
