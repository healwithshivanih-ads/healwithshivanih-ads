contraindications:
  conditions:
  - Current or recent smokers — avoid formulas with high-dose beta-carotene (increased lung
    cancer risk in ATBC and CARET trials)
  - Haemochromatosis / iron overload — use an iron-free formula
  medications:
  - Levothyroxine — mineral-containing multis bind thyroxine; separate by at least 4 hours
  - Warfarin — vitamin K content can alter INR; keep intake consistent and inform prescriber
  - Quinolone and tetracycline antibiotics — mineral chelation; separate by 2–6 hours
