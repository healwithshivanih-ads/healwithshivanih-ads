notes_for_coach: |-
  Listed as a supplementation option during fasting protocols to support micronutrient
  adequacy when caloric intake is restricted. Specific product should be individualised
  by the clinician.

  Best used for: Most useful as an insurance policy for restricted diets (fasting
  protocols, strict vegetarian/Jain, low appetite, older adults) and medication-related
  depletions; modest cognitive benefit shown in older adults. It does not treat specific
  conditions and is no substitute for correcting a confirmed deficiency at therapeutic
  dose.
notes_for_client: Taking a good multivitamin during a fasting programme helps fill
  any nutritional gaps on lower-calorie days.
