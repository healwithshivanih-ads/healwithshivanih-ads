notes_for_coach: |-
  Latin: Santalum album; Santalaceae. Sanskrit: Chandana. Traditional indications: eye
  diseases, cystitis, urethritis, vaginitis, acute dermatitis, herpes zoster,
  bronchitis, palpitations, gonorrhea, sunstroke. Precautions: high Kapha, severe lung
  congestion. Ayurvedic energetics from The Yoga of Herbs (Frawley & Lad).

  Best used for: Traditional cooling Ayurvedic herb with almost no human trial evidence
  for internal use; mainly relevant as topical/aromatic use (skin soothing, calming).
  Not worth placing in a clinical supplement protocol.
