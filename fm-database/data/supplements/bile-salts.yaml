notes_for_coach: |-
  Bile salts are indicated in patients who have had removal surgeries or have difficulty
  digesting fats. Available as supplements. Typically taken with fat-containing meals.

  Best used for: Best for clients with clear fat-malabsorption signs (pale, greasy or
  floating stools, fat intolerance), especially after gallbladder removal. Not a general
  digestive aid for bloating without fat-digestion signs, and not a treatment for
  psoriasis or autoimmunity on its own.
notes_for_client: Bile salts help your body digest fats, especially if you've had
  surgery or struggle with fat absorption.
