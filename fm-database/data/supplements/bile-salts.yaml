contraindications:
  conditions:
  - Biliary obstruction (blocked bile duct) — adding bile acids is inappropriate until the
    obstruction is assessed medically
  - Bile-acid diarrhoea / ileal resection or chronic watery diarrhoea — exogenous bile acids
    are secretagogues and worsen diarrhoea
