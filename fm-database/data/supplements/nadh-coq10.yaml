notes_for_coach: |-
  Lynch recommends sublingual tablet dissolved under the tongue while still in bed —
  reportedly wakes within minutes. Used for fast COMT and fast MAOA who struggle to rise
  and function without caffeine. Can serve as a non-stimulating caffeine replacement. Do
  not take with food. Only use in the morning.

  Best used for: Best evidence is in ME/CFS, where a combined NADH + CoQ10 product
  reduced fatigue in a small RCT. Not worth using as a caffeine substitute or for
  genotype-based (COMT/MAOA) reasoning alone.
notes_for_client: These compounds give your cells' energy factories an immediate fuel
  boost. Dissolve one under your tongue while still in bed for a caffeine-free wake-up
  effect.
