notes_for_coach: |-
  Listed as a transit time modulator in the PPI taper protocol. An Ayurvedic formula
  with mild laxative and GI motility-supportive properties.

  Best used for: Strongest for mild functional constipation and, as a mouthwash, for
  plaque and gingivitis. Not a substitute for fibre, fluid and movement, and not useful
  for diarrhoea-predominant clients.
