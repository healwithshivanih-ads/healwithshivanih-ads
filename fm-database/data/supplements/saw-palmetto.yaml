notes_for_coach: 'Standardised extract 85-95% fatty acids and sterols, 320 mg/day. Inhibits
  5-alpha-reductase (same mechanism as finasteride) and DHT-receptor binding. Used in BPH
  and female-pattern hair loss (androgenic alopecia) as well as PCOS-related androgenic excess.
  Generally well tolerated; rare GI upset. Avoid in pregnancy and on anti-androgens / hormone
  therapies without clinician oversight. Use liposterolic extract standardized to 85–95% fatty
  acids and sterols. Dose: 160–320 mg b.i.d. Best for mild to moderate BPH. Combine with Urtica
  dioica for enhanced effect equal to finasteride. Less effective in advanced BPH (residual
  urine >150 mL).'
notes_for_client: A traditional herb used for prostate health that also helps with female
  hair loss caused by androgen excess. Used at 320 mg of the standardised extract daily. Saw
  palmetto works best taken consistently for at least 4–6 weeks. Most people with mild prostate
  symptoms notice significant improvement.
