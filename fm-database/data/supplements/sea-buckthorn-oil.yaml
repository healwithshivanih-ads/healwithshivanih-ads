notes_for_coach: 'THE MUCOSAL-DRYNESS OIL. Its differentiator from fish oil is omega-7
  (palmitoleic acid), which tracks to mucous membranes — eyes, mouth, vagina. This
  is why it already appears in the genitourinary-syndrome-menopause protocol at 3 g/day
  for vaginal dryness: same oil, same mechanism, different mucosa. If a client presents
  with dry eyes, ASK whether she is dry anywhere else — one intervention may cover
  several complaints, and it makes the conversation much easier.


  BUY THE FRUIT/PULP OIL, NOT THE SEED OIL. This is the detail that decides whether
  it works at all. Omega-7 is concentrated in the fruit pulp; the seed oil is mostly
  omega-3/6 and low in omega-7. A large share of products on the shelf are seed oil,
  or do not say which. The wrong bottle does not deliver the thing the trial tested.
  Availability in India is fine — it grows in Ladakh and Himachal and is sold as leh
  berry, with domestic brands available.


  ORAL ONLY — see contraindications. Clients reason by analogy from castor oil, which
  does have a genuine preservative-free ophthalmic-grade product category (it even
  appears in some commercial lipid-based artificial tears). Sea buckthorn essentially
  does not. Do not let a client decant a supplement capsule into her eye.


  SET THE TIMELINE OR SHE WILL QUIT. The trial ran three months. Say so up front, or
  she stops at week three and concludes it does not work.


  WHAT IT DOES NOT DO: it changes tear quality. It does not dissolve or remove a
  conjunctival concretion, and it does not unblock a meibomian gland. If a hard deposit
  is abrading the cornea on every blink, better tears make the abrasion more
  comfortable — they do not stop it. Sequence the ophthalmology referral first.


  Dosing is education, not prescription: the eye trial used 2 g/day, the GSM protocol
  carries 3 g/day. Name the range, let her clinician confirm it — especially given the
  antiplatelet caution.'
notes_for_client: A berry oil that helps your body keep its delicate surfaces — eyes,
  mouth and intimate tissues — better lubricated from the inside. Look for one made
  from the fruit or pulp rather than the seed, take it with a meal, and give it a
  full three months before deciding whether it is helping. It is something you swallow
  — never put it in your eyes.
