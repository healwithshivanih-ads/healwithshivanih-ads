contraindications:
  conditions:
  - 'NOT for instillation into the eye. Supplement- and food-grade sea buckthorn oil
    is not a sterile ophthalmic preparation — no controlled sterility, pH or osmolality.
    Dripping it onto an eye whose surface is already broken (corneal abrasion, protruding
    conjunctival concretion, active blepharitis) is a route to microbial keratitis,
    which is sight-threatening. Oral route only.'
  - Planned surgery within 2 weeks — stop beforehand and clear the restart with the
    surgeon, on the same antiplatelet reasoning as the medication caution.
  medications:
  - Anticoagulants and antiplatelets (warfarin, clopidogrel, DOACs, chronic aspirin)
    — sea buckthorn has been reported to affect platelet aggregation. Not an absolute
    bar, but the client's prescriber should sign it off before she starts.
