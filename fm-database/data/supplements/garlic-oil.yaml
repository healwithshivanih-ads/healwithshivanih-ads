notes_for_coach: |-
  Garlic oil is a broad-spectrum antimicrobial with antifungal and antiparasitic
  properties. Part of the herbal removal protocol for gut dysbiosis. Often combined with
  oil of oregano, berberine, and caprylic acid.

  Best used for: Used as one part of a herbal antimicrobial 'weed' phase for dysbiosis
  or candida, usually alongside oregano oil or berberine; evidence is mainly in vitro.
  Garlic-infused cooking oil is a separate low-FODMAP flavour tool, not an
  antimicrobial.
notes_for_client: Garlic oil is a natural antimicrobial that supports your gut by
  targeting harmful bacteria, yeast, and parasites.
