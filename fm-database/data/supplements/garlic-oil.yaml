contraindications:
  conditions:
  - Known garlic/onion (Allium) allergy
  - Scheduled surgery or dental extraction — stop concentrated garlic products 7–10 days beforehand
    (antiplatelet effect, post-operative bleeding reports)
  medications:
  - Warfarin, other anticoagulants and antiplatelets — garlic products prolong bleeding time;
    additive risk
  - HIV protease inhibitors (saquinavir) — garlic reduces their blood levels
