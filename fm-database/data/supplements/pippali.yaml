notes_for_coach: |-
  Latin: Piper longum; Piperaceae. Sanskrit: Pippali. Traditional indications: colds,
  coughs, asthma, bronchitis, laryngitis, arthritis, rheumatism, gout, dyspepsia,
  abdominal distention, flatulence, abdominal tumors, lumbago, sciatica, epilepsy,
  paralysis, worms. Precautions: high Pitta (inflammatory conditions). Ayurvedic
  energetics from The Yoga of Herbs (Frawley & Lad).

  Best used for: An Ayurvedic digestive stimulant (Agni) and expectorant, often used in
  combinations such as trikatu and as a bioavailability enhancer for other herbs. Human
  evidence is limited to traditional use; not a stand-alone treatment for asthma or
  joint pain.
