notes_for_coach: |-
  Carvacrol ≥70% is the active antifungal/antimicrobial component. Broad-spectrum — use
  for 2-4 weeks then rotate. Can disrupt beneficial bacteria with prolonged use.

  Best used for: A short-course (2-4 week) antimicrobial for the Remove phase of candida
  or SIBO/dysbiosis protocols, usually rotated with berberine or garlic extract. Human
  evidence for oregano oil alone is thin (mostly in-vitro plus herbal-blend SIBO data),
  so it is not a stand-alone or long-term option.
notes_for_client: Oregano oil is a powerful natural antimicrobial that can help fight
  Candida and harmful gut bacteria — best used in short courses and rotated with other
  antifungals.
