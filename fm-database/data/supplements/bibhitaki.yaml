notes_for_coach: |-
  Latin: Terminalia belerica; Combretaceae. Sanskrit: Bibhitaki. Traditional
  indications: cough, sore throat, laryngitis, bronchitis, catarrh, stones, chronic
  diarrhea, dysentery, parasites, eye diseases. Precautions: high Vata. Ayurvedic
  energetics from The Yoga of Herbs (Frawley & Lad).

  Best used for: Traditional Ayurvedic Kapha/lung and digestive herb, mainly used as one
  of the three fruits in triphala; there is little human evidence for it alone. Prefer
  triphala when a gentle bowel or digestive tonic is wanted.
