notes_for_coach: |-
  Recommended protein source during elimination diet. Provides 20–24 g protein per 30 g
  serve. Ensure product is gluten-free and free from hidden allergens (check labels for
  inulin, chicory, milk derivatives).

  Best used for: A practical way to close a protein gap for vegetarian and
  perimenopausal/older clients, especially alongside strength training, and during
  elimination diets when dairy/soy are out. Not needed if diet already meets the protein
  target.
notes_for_client: A clean plant protein powder (hemp, rice, or pea) can help meet
  your protein needs during the elimination phase. Always check the label for hidden
  gluten, dairy, or soy.
