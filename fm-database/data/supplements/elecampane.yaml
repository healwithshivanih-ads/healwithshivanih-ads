notes_for_coach: |-
  Latin: Inula spp.; Compositae. Sanskrit: Pushkaramula. Traditional indications: colds,
  asthma, cardiac asthma, pleurisy, dyspepsia, cough, nervous debility. Precautions:
  high Pitta conditions generally. Ayurvedic energetics from The Yoga of Herbs (Frawley
  & Lad).

  Best used for: A traditional Ayurvedic/Western expectorant for wet cough and chest
  congestion; human evidence is minimal. Not a first-line choice for any of the
  practice's core conditions.
