notes_for_coach: 'Use pharmaceutical-grade (free of mercury, PCBs, solvents). Recently diagnosed
  T1DM: 1000 mg each EPA + DHA. Level 1 T1DM/T2DM: 600 mg each. Combined EPA+DHA target 1100–1600
  mg/day. DHA-rich formulas preferred over EPA-dominant products for BP reduction. 3000 mg
  total EPA+DHA recommended in therapeutic approach. Ensure lab-certified purity against pollutants
  and peroxides. Take with a meal for absorption and to reduce fishy aftertaste. Quality varies
  greatly — advise clients to choose brands tested for heavy metals. High doses may affect
  bleeding; refer to clinician.'
notes_for_client: Fish oil reduces inflammation and protects heart health in diabetes without
  affecting blood sugar. Take at the start of a meal to avoid fishy aftertaste. Take fish
  oil with meals. Choose products that list DHA content prominently and are tested for purity.
  Expect results after several weeks of consistent use. Omega-3s from fatty fish (EPA and
  DHA) support your heart, brain, joints, and muscle health. If you don't eat fish 2x/week,
  a fish oil supplement can help fill the gap.
