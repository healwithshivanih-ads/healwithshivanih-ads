notes_for_coach: 'Use pharmaceutical-grade (free of mercury, PCBs, solvents). Recently diagnosed
  T1DM:

  1000 mg each EPA + DHA. Level 1 T1DM/T2DM: 600 mg each. Combined EPA+DHA target

  1100–1600 mg/day. DHA-rich formulas preferred over EPA-dominant products for BP

  reduction. 3000 mg total EPA+DHA recommended in therapeutic approach. Ensure

  lab-certified purity against pollutants and peroxides. Take with a meal for absorption

  and to reduce fishy aftertaste. Quality varies greatly — advise clients to choose

  brands tested for heavy metals. High doses may affect bleeding; refer to clinician.


  Best used for: Strongest evidence is for lowering high triglycerides (at higher,

  clinician-guided intakes), as an adjunct in rheumatoid arthritis, and EPA-rich

  formulas as an add-on for depression; it also helps period pain and modestly lowers

  BP. Generic heart protection in healthy people, hot flashes and dry eye have not held

  up in large trials. Clients with atrial fibrillation or on blood thinners need

  clinician input before higher intakes.


  Dose note merged from Omega-3 Fatty Acids (EPA/DHA): capsule 1000–3000 mg (this entry keeps
  1000–4000 mg).


  Dose note merged from Omega-3 Fatty Acids (EPA/DHA): liquid 5–15 ml (this entry keeps 1000–4000
  mg).


  Merged from Omega-3 Fatty Acids (EPA/DHA): Supports reduction of systemic inflammation that
  drives autoimmune thyroid activity.

  Food sources: fatty fish (salmon, sardines), flaxseeds, chia seeds, walnuts.

  Supplementation dose not specified in document — typical therapeutic range is 1–3 g

  EPA+DHA/day. Adequate omega-3 intake (and the omega-3:omega-6:omega-9 ratio) supports

  fluid, healthy cell membranes required for non-genomic hormone signaling. Trans fats

  and ultra-processed foods create rigid membranes that impair this rapid hormone

  signaling pathway. Testing the omega-3 index or ratio can be useful.


  Best used for: Strongest evidence: lowering high triglycerides, reducing joint pain

  and stiffness in rheumatoid arthritis, as an EPA-rich adjunct in depression, and for

  menstrual pain. These uses typically need higher EPA+DHA intakes than a basic capsule,

  set with the clinician. Generic fish oil has not been shown to prevent heart events.

  Modest or unproven for IBS, candida or general ''hormone balance''. Check diet or the

  omega-3 index before adding it for low-risk clients.'
notes_for_client: 'The good fats your body can''t make — for your heart, your brain and calming
