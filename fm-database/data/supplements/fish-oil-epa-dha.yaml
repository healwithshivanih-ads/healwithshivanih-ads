contraindications:
  conditions:
  - Fish or shellfish allergy — use algae-derived EPA/DHA instead
  - Atrial fibrillation or high AF risk — meta-analyses of RCTs show omega-3 supplementation
    (especially ≥1 g/day, more at 4 g) increases new-onset AF; discuss with cardiologist
  medications:
  - Warfarin, other anticoagulants and antiplatelets (clopidogrel, chronic aspirin) at intakes
    above ~3 g/day EPA+DHA — additive bleeding tendency; prescriber should monitor INR
