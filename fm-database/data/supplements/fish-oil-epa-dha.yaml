contraindications:
  conditions:
  - Fish or shellfish allergy — use algae-derived EPA/DHA instead
  - Atrial fibrillation or high AF risk — meta-analyses of RCTs show omega-3 supplementation
    (especially ≥1 g/day, more at 4 g) increases new-onset AF; discuss with cardiologist
  - History of atrial fibrillation — trials and meta-analyses show dose-dependent increased
    AF risk with omega-3 supplements (especially >1 g/day)
  - Fish or shellfish allergy — use algae-based oil instead of fish/krill oil
