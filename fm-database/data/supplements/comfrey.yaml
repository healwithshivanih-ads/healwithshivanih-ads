contraindications:
  conditions:
  - ANY internal/oral use — pyrrolizidine alkaloids cause liver damage (veno-occlusive disease);
    topical use only
  - Liver disease — avoid all forms
  - Broken or open skin — do not apply topically to wounds (alkaloid absorption)
  medications: []
  life_stages:
  - Pregnancy — avoid all forms (alkaloids hepatotoxic and potentially teratogenic)
  - Breastfeeding — avoid
  - Children — avoid
