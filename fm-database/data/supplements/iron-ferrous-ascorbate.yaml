contraindications:
  conditions:
  - Haemochromatosis or iron overload (raised ferritin / transferrin saturation) — supplemental
    iron worsens organ iron deposition
  - Thalassaemia trait or other non-iron-deficiency microcytosis (common in India) — low MCV/Hb
    is not proof of iron deficiency; iron without a low ferritin risks overload
