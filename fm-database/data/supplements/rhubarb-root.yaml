contraindications:
  conditions:
  - Intestinal obstruction, inflammatory bowel disease flare, appendicitis or undiagnosed
    abdominal pain — stimulant laxative
  - Kidney stones / hyperoxaluria — rhubarb is high in oxalate
  - Chronic diarrhoea or electrolyte imbalance (low potassium)
  medications:
  - Digoxin and antiarrhythmics — stimulant-laxative-induced low potassium increases toxicity
  - Diuretics and corticosteroids — additive potassium loss
  life_stages:
  - Pregnancy — stimulant purgative (uterine stimulation)
  - Breastfeeding — anthraquinones pass into milk
  - Children under 12
