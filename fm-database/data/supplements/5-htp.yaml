notes_for_coach: |-
  Serotonin precursor — most appropriate for fast MAOA (serotonin depleted too quickly)
  and as adjunct in fast COMT. CONTRAINDICATED with SSRIs (serotonin syndrome risk).
  AVOID in slow MAOA (worsens excess serotonin). Sleep-maintenance issues: Lynch
  suggests sustained-release form for overnight delivery. Lynch specifically flags this
  worsens slow MAOA and makes slow COMT more irritable.

  Best used for: Evidence is modest and from small, older trials: migraine prevention,
  fibromyalgia pain and mild low mood, plus reduced carbohydrate cravings in overweight
  adults. Sleep benefit is less well supported than the catalogue framing suggests. Only
  for a client who is NOT on any antidepressant (SSRI, SNRI, tricyclic, MAOI, trazodone,
  mirtazapine), lithium, triptan, tramadol or carbidopa — serotonin syndrome risk. The
  fast/slow MAOA genetics framing is a book theory, not established clinical evidence.
