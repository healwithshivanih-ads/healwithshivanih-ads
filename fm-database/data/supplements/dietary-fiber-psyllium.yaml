contraindications:
  conditions:
  - Bowel obstruction, faecal impaction, GI strictures or swallowing difficulty — bulk-forming
    fibre can obstruct; always take with a full glass of water
  medications:
  - Levothyroxine and other oral medications — fibre reduces absorption; separate by at least
    2-4 hours
  - Insulin / glucose-lowering drugs — may lower post-meal glucose; monitor when starting
