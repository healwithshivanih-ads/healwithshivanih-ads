notes_for_coach: |-
  Fibre slows gastric emptying of liquid phase, reducing rapid acid delivery to the
  duodenum. Specific supplemental forms cited: pectin, guar gum, psyllium. Whole-food
  plant diet is preferred over isolated supplements.

  Best used for: Psyllium has strong evidence for constipation, IBS (especially IBS-C),
  LDL-cholesterol lowering and glucose control in type 2 diabetes and prediabetes. Start
  low and build up with plenty of water; food-first fibre is still the foundation.
  Bran-type insoluble fibre is not a substitute in IBS.
notes_for_client: Adding more fibre to your diet — or taking psyllium supplements
  — may halve your chance of your duodenal ulcer coming back by slowing down how fast
  your stomach empties.
