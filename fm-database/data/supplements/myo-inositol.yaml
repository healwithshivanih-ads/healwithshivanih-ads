notes_for_coach: |-
  Myo-inositol is involved in TSH, FSH, and insulin signal transduction. Found naturally
  in fruits, vegetables, cereals, legumes, and nuts. The document does not specify a
  dose — dose range above reflects commonly used research doses and should be verified
  with clinician. Thin evidence base for thyroid specifically. Lynch recommends for fast
  MAOA to regulate serotonin and improve mood. However, inositol burdens and slows MAOA
  in the slow variant — causes overstimulation. Lynch notes lithium orotate and inositol
  act opposite to each other — if one worsens, the other may help. Use as a MAOA
  discriminator. Start low.

  Best used for: Strongest evidence is in PCOS, especially the insulin-resistant type:
  more regular cycles and ovulation, better insulin sensitivity, and possibly better egg
  quality. Smaller trials support it as an adjunct with selenium in subclinical
  hypothyroidism or Hashimoto's. It is not a general mood or stress supplement. The
  clinician should set the dose and any D-chiro-inositol ratio.
notes_for_client: 'Supports how your body responds to its own insulin, and helps cycle regularity.

  A fine powder that dissolves in water and tastes faintly sweet. Give it three months.'
