notes_for_coach: Myo-inositol is involved in TSH, FSH, and insulin signal transduction. Found naturally
  in fruits, vegetables, cereals, legumes, and nuts. The document does not specify a dose — dose range
  above reflects commonly used research doses and should be verified with clinician. Thin evidence
  base for thyroid specifically. Lynch recommends for fast MAOA to regulate serotonin and improve
  mood. However, inositol burdens and slows MAOA in the slow variant — causes overstimulation. Lynch
  notes lithium orotate and inositol act opposite to each other — if one worsens, the other may help.
  Use as a MAOA discriminator. Start low.
notes_for_client: 'Supports how your body responds to its own insulin, and helps cycle regularity.

  A fine powder that dissolves in water and tastes faintly sweet. Give it three months.'
