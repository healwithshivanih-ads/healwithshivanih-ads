notes_for_coach: |-
  Active constituents: ginsenosides. Reduces acute exercise-induced cortisol and may
  improve neuroplasticity in the hippocampus — a region vulnerable to chronic cortisol
  elevation. Source: Coach Shivani clinical observations. Document mentions 'ginseng tea
  for support' in adrenal restoration. Ginseng is a classic adaptogen used in FM for HPA
  support. Dosing and species (Panax vs. Siberian) not specified. Verify form and dose
  with clinician.

  Best used for: Modest evidence for chronic idiopathic fatigue and for mild
  glucose-lowering support in type 2 diabetes. It is stimulating rather than calming, so
  it suits the tired, flat client better than the anxious, wired or insomnia-prone one.
  It is not interchangeable with American or Siberian ginseng, and it needs care with
  diabetes medication and blood thinners.
