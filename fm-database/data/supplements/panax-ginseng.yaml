notes_for_client: Ginseng may help your body adapt to stress by moderating stress hormone
  release and supporting brain resilience. Ginseng is an herb that may help your body handle
  stress. It's available as tea or supplements. Check with your health practitioner about
  the right type and amount for you.
contraindications:
  conditions:
  - diabetes — may slightly lower blood glucose; monitor (WHO Monographs Vol 1)
  - Uncontrolled hypertension — stimulating; can raise blood pressure in some people
  - Insomnia or anxiety-prone states — stimulating; use only in the morning, may worsen sleep
  - Bipolar disorder — case reports of ginseng-associated mania
  - Hormone-sensitive conditions (breast/endometrial cancer, endometriosis, fibroids) — oestrogen-like
    effects reported (mastalgia, postmenopausal vaginal bleeding case reports)
  medications:
  - MAO inhibitors (e.g. phenelzine) — reports of interaction (WHO Monographs Vol 1)
  - antidiabetic drugs — additive blood-sugar lowering possible (WHO Monographs Vol 1)
  life_stages:
  - Pregnancy — avoid; ginsenoside Rb1 was teratogenic in animal embryo studies and human
    safety data are lacking
  - Lactation — insufficient safety data; avoid
