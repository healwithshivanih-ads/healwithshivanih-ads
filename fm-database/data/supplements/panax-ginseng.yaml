notes_for_coach: 'Active constituents: ginsenosides. Reduces acute exercise-induced cortisol
  and may improve neuroplasticity in the hippocampus — a region vulnerable to chronic cortisol
  elevation. Source: Coach Shivani clinical observations. Document mentions ''ginseng tea
  for support'' in adrenal restoration. Ginseng is a classic adaptogen used in FM for HPA
  support. Dosing and species (Panax vs. Siberian) not specified. Verify form and dose with
  clinician.'
