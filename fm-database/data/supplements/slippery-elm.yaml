notes_for_coach: |-
  Listed under 'Protect' in PPI tapering. A mucilaginous herb that coats and soothes the
  GI tract. Often taken as a porridge or powder in water.

  Best used for: A gentle demulcent for soothing an irritated throat, oesophagus or gut
  lining (e.g., during PPI tapering or reflux flares); human evidence is largely
  traditional and small combination studies. Not a treatment for the cause of reflux and
  not a substitute for addressing it.
