notes_for_coach: |-
  First-line fibre intervention for constipation before escalating to magnesium citrate.
  Also provides ALA omega-3, protein, and minerals. Ensure adequate hydration when
  using.

  Best used for: A food-based fibre for constipation and for blunting post-meal
  blood-sugar rises; works only with enough water. Little evidence for meaningful weight
  loss or cholesterol lowering on its own.
notes_for_client: Two tablespoons of chia seeds daily is a simple, gentle way to get
  your bowels moving regularly and feed the good bacteria in your gut.
