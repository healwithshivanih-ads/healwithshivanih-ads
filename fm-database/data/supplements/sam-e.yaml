notes_for_coach: 'The universal methyl donor produced by the methylation cycle. Available
  OTC in the US; prescription only in several European countries. Highly context-dependent:
  beneficial for slow COMT under stress load; can cause depression, fatigue, or mood destabilization
  if catecholamines are already adequate or if COMT is fast. Do NOT recommend without full
  picture of client''s COMT status and stress context. Defer to clinician. SAMe is a methyl
  donor used in alcoholic liver disease and methylation support. Best taken on an empty stomach.
  Avoid in bipolar disorder (mania risk). Do NOT combine with SSRIs, SNRIs, MAOIs, or other
  serotonergic agents — additive serotonin syndrome risk (less well-known but real). Clinician
  oversight required for dosing.'
notes_for_client: SAMe is produced naturally by your own methylation cycle. It CAN be taken
  as a supplement but has powerful and sometimes unpredictable effects depending on your COMT
  gene type and stress levels. Please work with your clinician before trying it. SAMe supports
  liver detoxification pathways and mood. It's best taken away from food for optimal absorption.
