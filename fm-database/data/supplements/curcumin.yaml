notes_for_coach: 'Lynch mentions curcumin as supportive for MTHFR and healthy methylation.

  Bioavailability is very low without a lipid carrier or piperine. Anti-inflammatory and

  Nrf2-activating mechanisms are plausible.


  Best used for: Best evidence is for knee osteoarthritis pain and stiffness. Supportive

  RCT data cover lowering CRP, ulcerative colitis maintenance (alongside medical

  treatment), NAFLD, prediabetes, and use as an add-on in depression. Effects are

  modest. Use an enhanced-absorption form taken with a fat-containing meal; plain

  turmeric powder capsules deliver little curcumin. Rare liver injury has been reported

  with high-absorption products, so stop and refer if signs of liver trouble appear.


  Dose note merged from Turmeric / Curcumin: capsule 500–1000 mg (this entry keeps 500–2000
  mg).


  Merged from Turmeric / Curcumin: Clinician uses 500mg twice daily. Downregulates NF-κB and
  upregulates NRF2.

  Bioavailability enhanced with piperine (black pepper extract). Anti-inflammatory,

  blood sugar lowering, and HbA1c lowering properties noted.


  Best used for: Best evidence is for knee osteoarthritis pain, raised inflammatory

  markers, fatty liver and as an adjunct for blood sugar and low mood — always a

  bioavailable formulation. Plain turmeric powder in food will not deliver trial doses.

  Not worth it as a stand-alone for hormone or thyroid concerns.'
notes_for_client: The active compound in turmeric, curcumin may help support healthy methylation
  and reduce inflammation. Take with a fat-containing meal to improve absorption.
