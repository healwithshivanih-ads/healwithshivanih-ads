contraindications:
  conditions:
  - obstruction of the biliary tract (WHO Monographs Vol 1)
  - gallstones — use only after consulting a physician (WHO Monographs Vol 1)
  - hypersensitivity / allergic contact dermatitis to turmeric (WHO Monographs Vol 1)
  - Active liver disease or history of drug/herb-induced liver injury — rare idiosyncratic
    hepatotoxicity reported with high-bioavailability and piperine-enhanced curcumin products
    (LiverTox); stop if jaundice, dark urine or abdominal pain
  - gallstones or bile duct obstruction — curcumin is cholagogic (EMA/WHO monographs)
  - active liver disease or prior drug/herb-induced liver injury — case reports of autoimmune-like
    hepatitis with high-bioavailability (piperine/enhanced) curcumin products
  medications:
  - anticoagulant / antiplatelet drugs — high-dose curcumin may add bleeding risk; caution
  - Narrow-therapeutic-index drugs cleared by CYP3A4/P-gp (e.g. tacrolimus, cyclosporine)
    — piperine-enhanced curcumin can raise blood levels; clinician to coordinate
  life_stages:
  - pregnancy — supplemental (concentrated) curcumin not established safe; culinary turmeric
    is fine
  - pregnancy — supplemental (not culinary) doses not established as safe
