notes_for_coach: |-
  Converted in the stomach to DIM. For cervical dysplasia: 200–400 mg daily for 3 months
  minimum. Shifts estrogen from 16α-hydroxylation to 2-hydroxylation. Found naturally in
  cruciferous vegetables.

  Best used for: Evidence is mainly biomarker-level: it shifts oestrogen metabolism
  toward 2-hydroxylation, and one small RCT showed regression of cervical dysplasia
  (CIN), which still needs gynaecological follow-up. Biomarker change has not been shown
  to lower cancer risk, and it is redundant if the client already takes DIM.
notes_for_client: I3C is a natural compound from cruciferous vegetables that supports
  healthy estrogen processing in the body.
