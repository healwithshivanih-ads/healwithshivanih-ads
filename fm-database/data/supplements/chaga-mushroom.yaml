notes_for_coach: |-
  Potent antioxidant medicinal mushroom; used for immunity, detox, and anti-aging;
  morning dosing preferred.

  Best used for: There are no meaningful human trials for chaga; its immune and
  antioxidant claims come from lab and animal studies. Not worth recommending over
  better-studied options. Never for clients with kidney disease or kidney stones.
