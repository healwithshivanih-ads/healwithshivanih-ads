contraindications:
  conditions:
  - Gastroparesis — vinegar further delays gastric emptying (Hlebowicz 2007, type 1 diabetes)
  - Active GERD, erosive oesophagitis or peptic ulcer — acidic; can worsen symptoms
  - Dental enamel erosion — always dilute and rinse mouth/use a straw
