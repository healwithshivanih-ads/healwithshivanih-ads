notes_for_coach: |-
  Lynch specifies Bifidobacterium + L. plantarum as the probiotic combination most
  effective at degrading histamine in the gut. Avoid L. casei and L. bulgaricus strains
  which can produce histamine. Start restoration with a Bifidobacterium-only blend, then
  add L. plantarum. Best taken after dinner.

  Best used for: Chosen for clients with histamine intolerance because these strains
  don't produce histamine (unlike L. casei/bulgaricus), and specific strains (e.g. L.
  plantarum 299v) have IBS trial support. Benefits are strain-specific, so the product
  should name its strains; evidence for histamine degradation in humans is limited.
notes_for_client: These specific probiotic strains help break down histamine in your
  gut. Avoid probiotics containing Lactobacillus casei or bulgaricus, which can make
  histamine symptoms worse.
