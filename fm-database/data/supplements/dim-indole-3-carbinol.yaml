linked_to_claims:
- dim-i3c-breaks-down-estrogen-supports-slow-comt
notes_for_coach: Lynch recommends these as a pair for supporting oestrogen metabolism
  in slow COMT — both promote conversion of potent 16-OH estrogens to the weaker 2-OH
  pathway. Often packaged together. Useful when catechol estrogen accumulation is
  driving symptoms (PMS, fibroids, insomnia). Clinician oversight warranted for anyone
  with a hormone-sensitive cancer history.
notes_for_client: These compounds from cruciferous vegetables help your body process
  and clear oestrogen more efficiently, which can relieve PMS symptoms and reduce
  hormonal burden.
evidence_tier: plausible_emerging
linked_to_mechanisms:
- estrogen-16-hydroxylation
- hepatic-estrogen-metabolism
sources:
- id: dirty-genes-lynch
  location: Chapter 15 — Supplements for Your Slow COMT
  quote: Indole-3-carbinol and DIM. These supplements help break down estrogens so
    that they can be eliminated from your body.
version: 2
status: active
updated_at: '2026-10-07'
updated_by: shivani
contraindications:
  conditions: []
  medications:
  - Tamoxifen — DIM lowered levels of the active metabolite endoxifen in an RCT (Thomson 2017);
    avoid unless the oncologist agrees
  - CYP1A2 substrates (e.g. theophylline, clozapine) — I3C/DIM induce CYP1A2 and may lower
    drug levels
  life_stages:
  - pregnancy
  - lactation
