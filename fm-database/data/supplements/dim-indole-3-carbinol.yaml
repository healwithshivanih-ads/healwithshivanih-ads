slug: dim-indole-3-carbinol
display_name: DIM + Indole-3-Carbinol (I3C)
category: other
forms_available:
- capsule
typical_dose_range:
  capsule:
    min: 100
    max: 200
    unit: mg
timing_options:
- with_dinner
