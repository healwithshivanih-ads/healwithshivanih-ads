notes_for_coach: 'Coach Shivani''s original tip: ''Soak methi seeds in water overnight and
  drink the sieved water the next morning. Good for insulin resistance and diabetes.'' Preparation:
  soak ~1–2 tsp of whole methi seeds in a glass of water overnight; strain in the morning
  and have the water on an empty stomach. The seeds themselves can be eaten or discarded.
  Level 2 insulin enhancer for T2DM: 1 g/day extract. Active compounds: soluble fibre, trigonelline,
  4-hydroxyisoleucine. Also lowers LDL/VLDL/TG. Defatted seed powder used in T1DM trials at
  50 g b.i.d.'
notes_for_client: Fenugreek (methi) seeds soaked overnight produce a mucilaginous water rich
  in soluble fibre, which may help slow glucose absorption and support healthy insulin levels.
  Drink the strained water first thing in the morning before eating. Fenugreek seeds contain
  natural compounds that improve how your body responds to insulin and reduce blood fat levels.
