notes_for_coach: |-
  Whole cayenne / red pepper (Capsicum spp.). A pungent, heating circulatory and
  digestive stimulant — strong dispeller of cold, kindles agni, and enhances the action
  of other herbs. Best for vata/kapha; aggravates pitta. The topical pain-relief product
  is catalogued separately as 'capsaicin-topical'. Ayurvedic energetics from The Yoga of
  Herbs (Frawley & Lad).

  Best used for: A warming culinary spice that supports digestion and circulation in
  food amounts; small studies suggest modest effects on appetite and thermogenesis.
  Joint-pain benefit belongs to topical capsaicin (separate entry), not oral cayenne.
