notes_for_coach: |-
  Latin: Piper nigrum; Piperaceae. Sanskrit: Marich. Traditional indications: chronic
  indigestion, toxins in colon, degenerated metabolism, obesity, sinus congestion,
  fever, intermittent fever, cold extremities. Precautions: inflammatory conditions of
  the digestive organs, high Pitta. Ayurvedic energetics from The Yoga of Herbs (Frawley
  & Lad).

  Best used for: A culinary digestive spice; its main supplement role is as piperine
  added to curcumin and other poorly absorbed compounds to boost absorption. Not a
  stand-alone therapeutic supplement, and piperine extracts can raise levels of several
  medications.
