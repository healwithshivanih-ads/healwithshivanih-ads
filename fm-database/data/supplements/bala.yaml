contraindications:
  conditions:
  - Hypertension — Sida cordifolia contains ephedrine alkaloids that raise blood pressure
  - Heart disease, arrhythmia or tachycardia — ephedrine is a sympathomimetic stimulant
  - Hyperthyroidism — additive sympathomimetic/stimulant effects
  - Enlarged prostate / urinary retention — ephedrine increases bladder-neck tone
  - Anxiety disorders or insomnia — stimulant ephedrine content
  - Narrow-angle glaucoma — ephedrine-type alkaloids are sympathomimetic and can precipitate
    angle closure
  medications:
  - MAO inhibitors — risk of hypertensive crisis with ephedrine-containing herbs
  - Other stimulants/decongestants (pseudoephedrine, high-dose caffeine products) — additive
    cardiovascular stimulation
  life_stages:
  - pregnancy
  - breastfeeding
