notes_for_coach: |-
  Supports bone health, testosterone metabolism, and cognition; often overlooked trace
  mineral in functional protocols.

  Best used for: A small, cheap add-on to a bone-health stack (with vitamin D, K2,
  magnesium and protein) for peri- and postmenopausal women. Human evidence is limited
  and indirect; it is not a stand-alone osteoporosis treatment.
