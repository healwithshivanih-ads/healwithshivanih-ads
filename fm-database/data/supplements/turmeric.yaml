notes_for_coach: Featured prominently in the Brain Smoothie and Inflammation Control Smoothie.
  Fresh or ground form used. Bioavailability enhanced by pairing with black pepper (piperine);
  toolkit does not specify this but coaches may suggest it. Used across multiple smoothie
  and recipe formulas in the toolkit (Brain Smoothie, Inflammation Control Smoothie, Carrot-Ginger
  Soup). Curcumin bioavailability is enhanced by black pepper (piperine) — mention this to
  clients where relevant.
notes_for_client: Turmeric is a powerful anti-inflammatory spice. Use fresh root or ground
  powder in smoothies and soups. Turmeric is one of the most studied anti-inflammatory spices.
  Adding ½–1 tsp to smoothies, soups, or stews is an easy daily habit.
