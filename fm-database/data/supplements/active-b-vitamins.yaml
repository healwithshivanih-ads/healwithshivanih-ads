notes_for_coach: |-
  Active (methylated) forms of B12 (methylcobalamin) and folate (5-MTHF) bypass
  absorption and methylation issues. Particularly relevant for patients on metformin or
  PPIs, and those with MTHFR variants. Dosing must be clinician-directed.

  Best used for: Best evidence is for correcting documented deficiency and lowering
  raised homocysteine, especially in clients on metformin or PPIs and vegetarians with
  low B12. Not worth it as a general energy tonic in a well-nourished client with normal
  B12/homocysteine; methylated forms add little unless MTHFR or absorption issues exist.
notes_for_client: Active B-vitamins are easier for your body to use, especially if you take certain medications or have difficulty
  absorbing nutrients from food.
