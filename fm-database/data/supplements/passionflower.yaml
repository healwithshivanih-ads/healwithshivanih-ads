notes_for_coach: |-
  Calming herb with mild anxiolytic and sleep-onset support effects;
  GABA-pathway mechanism. Source (Menolascino transcript) lists
  passionflower among evidence-supported natural sleep aids but does
  NOT give dosing. Confirm dose from peer-reviewed source before
  client use. Standardized extracts and tincture forms are most
  commonly studied. Often used in combination formulas with lemon
  balm, lavender, and magnesium for evening parasympathetic support. Mild
  anxiolytic-sedative herb. Pizzorno lists Passiflora among botanicals with sedative
  properties for insomnia. Typical dose 200-400 mg standardised extract or 1-2 g dried
  herb as tea before bed. Often combined with valerian, hops, or lemon balm. Generally
  well-tolerated; mild GI upset, drowsiness. Caution with sedatives, alcohol, MAOIs.

  Best used for: Mild anxiety and anxiety-driven difficulty falling asleep, as tea or
  standardised extract in the evening; the anxiety evidence (GAD, pre-procedure anxiety)
  is stronger than the sleep evidence. Not a substitute for addressing
  cortisol/blood-sugar causes of 3 am waking.
