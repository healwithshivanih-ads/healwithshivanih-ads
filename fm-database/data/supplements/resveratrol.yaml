notes_for_coach: |-
  Resveratrol has poor bioavailability; trans-resveratrol or liposomal forms are
  preferred. Evidence for antiviral effects is largely preclinical. May interact with
  anticoagulants (warfarin), antiplatelet drugs, and some chemotherapy agents. Caution
  in pregnancy (Roberts et al. 2014 FASEB J adverse outcomes in primates).

  Best used for: Modest human evidence: small improvements in insulin sensitivity in
  type 2 diabetes and lower testosterone/insulin in PCOS (one RCT at high dose). Poorly
  absorbed; low priority versus diet, inositol or berberine, and not worth it for
  'immune' or antiviral use where data are preclinical.
