notes_for_coach: |-
  PGX is glucomannan + alginate + xanthan gum; viscosity 3–5x higher than glucomannan
  alone. Reduces GI of any food by 15–70%. Must take with 240–360 mL water before or
  with meals. 2500–5000 mg before each meal for T2DM Level 1.

  Best used for: Taken with a full glass of water before carbohydrate-containing meals,
  it is a useful lever for postprandial glucose in prediabetes and type 2 diabetes, with
  a modest LDL benefit. Weight-loss evidence for glucomannan is weak (meta-analyses
  largely null), so do not position it as a weight-loss product.
notes_for_client: PGX or glucomannan fibre taken before meals creates a gel that slows
  glucose absorption — like a natural speed bump for blood sugar.
evidence_tier: plausible_emerging
