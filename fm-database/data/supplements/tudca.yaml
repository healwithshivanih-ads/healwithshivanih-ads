notes_for_coach: |-
  Most potent bile-thinning supplement. Use for sludge, cholestasis, fatty liver under
  clinician supervision. Avoid in complete bile duct obstruction.

  Best used for: Most relevant for sluggish bile flow and mildly raised liver enzymes,
  alongside a clinician's work-up. Gallstone dissolution and cholestatic liver disease
  are medical decisions (prescription bile-acid therapy), not coaching uses. Not needed
  for routine 'liver detox'.
notes_for_client: TUDCA is a bile acid supplement that helps thin and improve the
  flow of bile from your liver and gallbladder — supporting fat digestion and liver
  detox.
