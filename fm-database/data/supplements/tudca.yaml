contraindications:
  conditions:
  - complete bile duct obstruction or acute cholecystitis — choleretic bile acids are contraindicated
    (stated in notes but not in the structured list)
  medications:
  - bile acid sequestrants (cholestyramine, colesevelam) — bind bile acids; separate by at
    least 4 hours
  life_stages:
  - pregnancy — insufficient safety data for supplemental TUDCA
  - lactation — insufficient safety data
