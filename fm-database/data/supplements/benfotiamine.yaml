notes_for_coach: |-
  600 mg benfotiamine + 300 mg ALA shown to outperform benfotiamine alone for reducing
  hyperglycaemic damage in T1DM. Raises blood thiamine 120–240% vs regular thiamine.
  Monotherapy for neuropathy results are modest.

  Best used for: Most useful for people with diabetes who already have neuropathy
  symptoms (burning, painful feet), where trials show modest symptom relief. It is also
  a well-absorbed form of thiamine where intake is poor, such as heavy alcohol use — but
  suspected thiamine-deficiency confusion or unsteadiness is a medical emergency, not a
  supplement question. It does not lower blood sugar and is not worth it as a general
  diabetes supplement without nerve symptoms. For tingling without diabetes, check B12
  first.
notes_for_client: Benfotiamine is a fat-soluble form of vitamin B1 that penetrates
  cells more effectively than regular thiamine, helping to reduce sugar-related nerve
  and kidney damage.
