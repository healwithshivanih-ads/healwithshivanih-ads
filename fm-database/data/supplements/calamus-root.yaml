notes_for_coach: |-
  Latin: Acorus calamus; Araceae. Sanskrit: Vacha. Traditional indications: colds,
  cough, asthma, sinus headaches, sinusitis, arthritis, epilepsy, shock, coma, loss of
  memory, deafness, hysteria, neuralgia. Precautions: bleeding disorders including
  epistaxis, bleeding hemorrhoids; FDA restrictions on internal use in the USA.
  Ayurvedic energetics from The Yoga of Herbs (Frawley & Lad).

  Best used for: A traditional Ayurvedic brain and nasal herb (Vacha), typically used in
  tiny doses or nasally; there is essentially no human clinical evidence and real
  toxicity concerns with oral use. Not one to recommend for anxiety or cognition in
  place of better-studied options.
