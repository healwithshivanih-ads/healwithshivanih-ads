contraindications:
  conditions:
  - Internal use of beta-asarone–containing calamus (Indian triploid/tetraploid varieties)
    — beta-asarone is hepatotoxic/carcinogenic in animal studies; FDA prohibits it in food;
    avoid prolonged or high-dose oral use
  - Bleeding disorders (traditional precaution listed in notes)
  medications:
  - Sedatives (benzodiazepines, barbiturates, alcohol) — calamus has CNS-depressant effects
    in animal studies; additive sedation
  life_stages:
  - pregnancy — avoid (beta-asarone; emmenagogue)
  - breastfeeding — avoid
