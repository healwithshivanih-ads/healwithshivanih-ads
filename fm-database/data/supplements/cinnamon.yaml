contraindications:
  conditions:
  - Liver disease — cassia cinnamon is high in coumarin, which is hepatotoxic at supplemental
    doses; use Ceylon (C. zeylanicum) if supplementing
  medications:
  - Diabetes medications (insulin, sulfonylureas, metformin) — additive glucose lowering;
    monitor
  life_stages:
  - Pregnancy — avoid supplemental doses (insufficient safety data, EMA); culinary amounts
    are fine
