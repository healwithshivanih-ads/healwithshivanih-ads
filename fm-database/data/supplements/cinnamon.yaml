notes_for_coach: |-
  Latin: Cinnamomum zeylanicum; Lauraceae. Sanskrit: Twak. Traditional indications:
  colds, sinus congestion, bronchitis, dyspepsia. Precautions: high Pitta, bleeding
  disorders. Ayurvedic energetics from The Yoga of Herbs (Frawley & Lad).

  Best used for: Small benefits for fasting glucose and insulin resistance in type 2
  diabetes, prediabetes and insulin-resistant PCOS, and small falls in triglycerides and
  cholesterol; HbA1c results are inconsistent. An add-on to diet, not a replacement for
  medication. Most trials used cassia; for regular supplemental use choose Ceylon
  cinnamon, because cassia's coumarin can harm the liver.
