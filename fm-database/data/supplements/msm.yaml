notes_for_coach: |-
  Bioavailable sulfur compound for joint support, detox, and pain; commonly used in
  arthritis and connective tissue protocols.

  Best used for: Best evidence is modest pain and function improvement in knee
  osteoarthritis, often combined with glucosamine; little evidence for other uses.
  Effect sizes are small — worth a 8-12 week trial, not a must-have.
