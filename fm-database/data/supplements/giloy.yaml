notes_for_coach: |-
  Stub created from mindmap-agent shortlist 2026-05-13 — flesh out before clinical use.

  Best used for: Human evidence is thin: a few small Indian trials (allergic rhinitis,
  immune markers, adjunct glucose lowering). Reasonable only as a short-course
  traditional immune tonic in a client with no autoimmune or liver history. Not worth it
  for the thyroid/autoimmune cohort — Indian case series tie giloy to autoimmune-like
  liver injury.
