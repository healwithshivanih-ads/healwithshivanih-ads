slug: giloy
display_name: Giloy (Guduchi)
category: herb
forms_available:
- liquid
- powder
- capsule
typical_dose_range: {}
timing_options: []
take_with_food: optional
contraindications:
  conditions:
  - Autoimmune disease (incl. Hashimoto's, RA, lupus) — immunostimulant herb; an Indian multicentre
    case series (2020-21, post-COVID self-use) linked giloy to autoimmune-like hepatitis,
    some unmasking latent autoimmunity
  - Liver disease or prior herb-induced liver injury — giloy-associated drug-induced liver
    injury is documented in Indian hepatology case series; stop if jaundice, dark urine or
    itching appear
  medications:
  - Immunosuppressants (e.g. tacrolimus, cyclosporine, azathioprine, methotrexate) — immunostimulant
    action may oppose them
  life_stages:
  - Pregnancy — insufficient human safety data
  - Lactation — insufficient human safety data
