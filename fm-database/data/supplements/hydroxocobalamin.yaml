notes_for_coach: |-
  An alternative to methylcobalamin; preferred for clients who are sensitive to methyl
  donors, as hydroxocobalamin is a non-methyl B12 form that the body can convert as
  needed. Avoids the methyl-donor loading effect of methylcobalamin.

  Best used for: Best for clients with documented low or functional B12 deficiency (low
  B12, raised MMA or homocysteine) — vegetarians, metformin or long-term PPI users —
  especially those who feel wired or anxious on methylcobalamin. Not worth adding when
  B12 status is already replete.
notes_for_client: Hydroxocobalamin is a form of B12 that's gentle on the system — it's a good option if you find you're sensitive
  to methyl donors or react to methylcobalamin.
