contraindications:
  conditions:
  - Bile-duct obstruction or active gallstone colic — increases bile load; can provoke biliary
    pain
  - Chronic diarrhoea / bile-acid diarrhoea (e.g. after ileal resection) — bile salts are
    secretory laxatives and can worsen it
  medications:
  - Bile-acid sequestrants (cholestyramine, colesevelam) — bind bile salts; separate dosing
