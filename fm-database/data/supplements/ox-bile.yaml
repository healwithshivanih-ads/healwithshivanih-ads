notes_for_coach: |-
  Lynch recommends starting with 250 mg at dinner for SIBO (antimicrobial action in
  small intestine) and for those without a gallbladder. Supports fat digestion and bile
  flow which is impaired in dirty PEMT. Also used in visceral/gallbladder support
  alongside PEMT spot cleaning.

  Best used for: Strongest rationale is direct bile replacement for fat maldigestion —
  pale/greasy/floating stools, post-cholecystectomy clients, or poor tolerance of
  dietary fat. Not worth it for a client with normal fat digestion, and the
  psoriasis/SIBO/DAO uses rest on single-author or textbook opinion rather than trials.
notes_for_client: A digestive supplement that mimics your own bile — helpful for fat
  digestion, supporting beneficial bacteria balance, and those without a gallbladder.
