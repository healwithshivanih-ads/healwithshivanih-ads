- magnesium-oxide-poor-bioavailability
notes_for_coach: |-
  High elemental magnesium content (~60%) but insoluble and poorly absorbed. Not
  recommended as primary therapeutic magnesium source. Very cheap and widely available,
  which is why it dominates the market.

  Best used for: Poor choice for correcting magnesium deficiency because so little is
  absorbed; its real use is as a cheap, effective osmotic laxative for constipation.
  Choose glycinate/citrate when the goal is sleep, anxiety, migraine or insulin
  sensitivity.
notes_for_client: This form of magnesium is commonly sold but poorly absorbed by the body. It is generally not the best choice
  for correcting magnesium deficiency.
evidence_tier: plausible_emerging
