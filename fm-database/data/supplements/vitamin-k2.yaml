notes_for_coach: |-
  Recommended alongside Vitamin D3 for bone and cardiovascular support in menopausal
  women. K2 directs calcium to bones and away from arterial walls.

  Best used for: Best evidence is for slowing postmenopausal bone loss (an MK-7 trial
  over 3 years). It is commonly paired with vitamin D3 for bone support in women in
  perimenopause and menopause. Evidence that it prevents or reverses arterial
  calcification is mixed, and it does not lower cholesterol or help pain or fatigue. Not
  for anyone on warfarin or acenocoumarol unless the prescriber knows.
notes_for_client: Vitamin K2 works with Vitamin D to help keep calcium in your bones
  where it belongs, rather than in your arteries.
