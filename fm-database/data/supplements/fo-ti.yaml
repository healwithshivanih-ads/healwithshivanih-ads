contraindications:
  conditions:
  - Any liver disease, raised liver enzymes or past drug-induced liver injury — Polygonum
    multiflorum has many documented cases of idiosyncratic hepatotoxicity, including acute
    liver failure (regulatory warnings in UK, Australia, China)
  medications:
  - Other potentially hepatotoxic drugs/supplements (e.g. high-dose paracetamol, methotrexate,
    isoniazid, statins, kava, green-tea extract) — additive liver-injury risk
  life_stages:
  - Pregnancy and breastfeeding — no safety data and hepatotoxicity risk; avoid
