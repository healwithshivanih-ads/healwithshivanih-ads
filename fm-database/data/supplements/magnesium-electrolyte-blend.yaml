contraindications:
  conditions:
  - Chronic kidney disease / reduced eGFR — potassium and magnesium accumulate (hyperkalaemia,
    hypermagnesaemia risk)
  - Heart failure or hypertension on a sodium-restricted regimen — blend adds sodium; check
    with clinician
