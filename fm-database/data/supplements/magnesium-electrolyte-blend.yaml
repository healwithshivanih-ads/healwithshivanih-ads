contraindications:
  conditions:
  - Chronic kidney disease / reduced eGFR — potassium and magnesium accumulate (hyperkalaemia,
    hypermagnesaemia risk)
  - Heart failure or hypertension on a sodium-restricted regimen — blend adds sodium; check
    with clinician
  medications:
  - Potassium-sparing diuretics (spironolactone, amiloride), ACE inhibitors / ARBs — added
    potassium raises hyperkalaemia risk
  - Tetracycline / fluoroquinolone antibiotics, bisphosphonates and levothyroxine — magnesium
    chelates them and cuts their absorption; separate by at least 2-4 hours
  life_stages: []
