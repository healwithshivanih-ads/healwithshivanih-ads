linked_to_claims:
- lchf-electrolytes-prevent-keto-flu
notes_for_coach: |-
  Sodium, potassium, and magnesium are lost rapidly during LCHF dietary adaptation due
  to reduced insulin-driven renal reabsorption. Electrolyte blending is a practical
  strategy to prevent keto flu symptoms. Individual needs vary.

  Best used for: Best used short-term during low-carb adaptation or longer fasting
  windows to prevent keto-flu (headache, fatigue, cramps, dizziness). Not a substitute
  for a therapeutic magnesium form when the goal is sleep, anxiety or insulin
  sensitivity, and not needed on a normal mixed diet.
notes_for_client: When following a low-carb diet, your body loses electrolytes quickly.
  A balanced electrolyte supplement helps prevent the fatigue, headaches, and cramps
  sometimes called 'keto flu'.
