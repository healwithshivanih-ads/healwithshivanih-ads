notes_for_coach: |-
  Common examples: ashwagandha, rhodiola, Siberian ginseng, passionflower, wild oats.
  Best taken daily for stress resilience. May skip during low-stress periods (vacation).
  Do not take stimulating adaptogens close to bedtime.

  Best used for: A placeholder for the class; evidence belongs to individual herbs
  (ashwagandha for stress/sleep, rhodiola for fatigue/burnout). Prefer prescribing the
  specific herb so dose, safety and evidence are clear; a proprietary blend is hard to
  dose or troubleshoot.
notes_for_client: These herbs help your body respond to stress more calmly over time.
  Take with breakfast, or breakfast and lunch if particularly stressed.
