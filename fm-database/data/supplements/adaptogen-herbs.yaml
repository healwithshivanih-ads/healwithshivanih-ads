contraindications:
  conditions:
  - Hyperthyroidism — ashwagandha can raise T4/T3
  - Autoimmune disease on immunosuppressive treatment — ashwagandha and similar herbs are
    immunostimulating; clinician sign-off
  - Bipolar disorder — rhodiola and ginseng-type adaptogens have case reports of mania/hypomania
  - Liver disease or prior herb-induced liver injury — ashwagandha (a common component) has
    published case reports of liver injury; stop if jaundice, dark urine or itching appear
  medications:
  - Levothyroxine/thyroid medication — ashwagandha may raise thyroid hormone levels; recheck
    TSH
  - Sedatives/benzodiazepines — ashwagandha and passionflower are additive
  - Immunosuppressants — opposing effect
  life_stages:
  - Pregnancy — ashwagandha traditionally avoided (abortifacient concern); most adaptogens
    unstudied
  - Lactation — insufficient data
