timing_options:
- with_breakfast
- with_lunch
- with_dinner
take_with_food: required
notes_for_coach: |-
  Copper and zinc compete for absorption; always balance with zinc; typically added when
  supplementing zinc long-term.

  Best used for: Mainly a small top-up for clients on long-term high-dose zinc, or with
  lab-confirmed low copper (for example after bariatric surgery), where copper
  deficiency can cause anaemia that does not respond to iron. Most people get enough
  from food, and excess copper is harmful, so do not use it without a reason.
