contraindications:
  conditions:
  - Wilson's disease or any copper-overload condition — copper accumulates in liver and brain
  - Cholestatic liver disease / biliary obstruction — copper is excreted in bile and builds
    up
  medications:
  - Copper chelators (penicillamine, trientine) — supplementing defeats treatment
