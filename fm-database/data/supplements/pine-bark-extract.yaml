notes_for_coach: 'Interchangeable with grapeseed extract for PCO/proanthocyanidin content.
  Same mechanism: antioxidant + endothelial function support. For ADHD: 1 mg/kg body weight
  daily. For atherosclerosis/general antioxidant: 100 mg daily. Rich in procyanidolic oligomers;
  broad-spectrum antioxidant. Can be used interchangeably with grapeseed extract for antioxidant
  purposes.'
notes_for_client: Pine bark extract (pycnogenol) is a powerful antioxidant flavonoid that
  protects blood vessel linings and improves circulation.
