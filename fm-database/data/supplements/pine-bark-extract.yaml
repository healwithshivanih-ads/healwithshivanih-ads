notes_for_coach: |
  WHAT IT IS. Standardised extract of French maritime pine (Pinus pinaster) bark,
  sold overwhelmingly as the branded ingredient Pycnogenol. Like grape seed
  extract it is an OPC/procyanidin source.

  NOT INTERCHANGEABLE WITH GRAPE SEED EXTRACT — this entry used to say it was, and
  that was wrong (corrected 2026-09-10). They share a compound class, but they are
  different species with largely SEPARATE trial literatures, and the choice should
  follow the evidence rather than the chemistry:
    - Pine bark carries ADHD, perimenopausal symptoms, endometriosis, venous and
      sports-injury data.
    - Grape seed carries the blood-pressure and lipid meta-analyses.
  Substituting one for the other silently discards the reason the choice was made.
  Where a source genuinely says "either" (the Pizzorno microvascular and ARMD
  tables), both are listed on the claim.

  A SECOND ASYMMETRY WORTH KNOWING. Much of the pine bark literature comes from
  one research group publishing open-label registry studies on the branded
  ingredient. That does not make it worthless, but it means pine bark's apparent
  breadth of indication is partly an artefact of who has studied it, not evidence
  that it does more than grape seed does. Weight the blinded trials accordingly.

  WHAT THE BLINDED EVIDENCE SAYS. The single best-designed trial in this class is
  PYCNOVID — quadruple-blind, placebo-controlled, n = 153, Pycnogenol 200 mg/day
  for 12 weeks in post-COVID condition — and it was NULL, with placebo doing
  numerically better. Hold that as the prior for every fatigue-syndrome claim made
  for this ingredient, fibromyalgia included.

  DOSE. 50-200 mg/day. ADHD dosing is weight-based at 1 mg/kg/day. General
  antioxidant / atherosclerosis use around 100 mg/day. Allow 8-12 weeks.

  ANTIOXIDANT CLAIMS. It does lower lipid-peroxidation markers. It has NOT been
  shown to help any autoimmune condition, EBV reactivation, MS or lupus in any
  human trial, and "crosses the blood-brain barrier" is a marketing line that
  overstates what is measurable. See the linked claims before repeating either.

  SAFETY. Same OPC-class cautions as grape seed: antiplatelet activity (clinician
  sign-off alongside any blood thinner; stop 2 weeks pre-surgery), non-haem iron
  blockade (space 2 hours from iron), unknown in pregnancy and lactation.
notes_for_client: Pine bark extract, often sold as Pycnogenol, is a concentrated
  antioxidant. It supports the walls of small blood vessels and circulation. Because
  it can make blood slightly slower to clot, your doctor should know you are taking
  it, and it should be kept a couple of hours away from any iron supplement.
