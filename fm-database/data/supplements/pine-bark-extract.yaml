contraindications:
  conditions:
  - Hypothyroidism, Hashimoto's, or impaired T4-to-T3 conversion — NOT a thyroid
    supplement, and the theoretical direction of effect runs the wrong way
    (catechin lowered TPO and 5'-deiodinase I in rats). If used for a vascular
    reason, keep the dose modest, space it well away from levothyroxine, and
    recheck TSH at the next panel
  - Bleeding disorders, or any recent or planned surgery or dental extraction —
    stop at least 2 weeks before
  - Iron deficiency or iron-deficiency anaemia under active correction —
    procyanidins are condensed tannins and block non-haem iron absorption; finish
    correcting the iron first, or separate by at least 2 hours
  - Autoimmune disease — no human trial evidence of benefit; do not position as
    immune therapy, and note that immunomodulatory claims are unsupported
  medications:
  - Anticoagulants and antiplatelets (warfarin, clopidogrel, aspirin, DOACs) —
    theoretical additive bleeding risk shared across the OPC class, clinician
    sign-off required
  - Antihypertensives — additive blood-pressure lowering
  - Immunosuppressants — no interaction data; clinician decision
  life_stages:
  - Pregnancy — no data, not studied
  - Lactation — no data, not studied
