notes_for_coach: |-
  Standardise to 10% procyanidins or 1.8% vitexin-4'-rhamnoside. Dose: 100–250 mg t.i.d.
  Also improves general heart function. Effects require 2–4 weeks minimum. Best used as
  adjunct to other interventions. 100–250 mg t.i.d. (10% procyanidins or 1.8% vitexin
  with 4% rhamnoside). Best choice for cardiovascular disease or hypertension in
  diabetes. Consider drug interactions with cardiac medications.

  Best used for: Strongest evidence is in mild heart failure (Cochrane: better exercise
  tolerance and symptoms), with a mild blood-pressure effect that takes 2-4+ weeks.
  Reasonable for mild hypertension, including in clients with type 2 diabetes. Any
  client on heart medicines (especially digoxin) needs their cardiologist involved.
notes_for_client: Hawthorn is a gentle herb for the heart and blood pressure — it works gradually,
  so give it at least a month. Hawthorn extract supports healthy blood pressure and heart
  function — the preferred herbal choice when cardiovascular risk is a concern.
evidence_tier: plausible_emerging
