  location: Botanical Medicines / Crataegus
  quote: Extracts of hawthorn berries and flowering tops lower BP and improve heart function.
    BP-lowering effect of hawthorn is quite mild and requires at least 2 to 4 weeks before
    effect is apparent.
- id: pizzorno-cardiometabolic-diabetes
  location: Nutritional and Herbal Supplements / Flavonoids table
  quote: Hawthorn extract (10% procyanidins) 150-300 mg — Best choice in cardiovascular disease
    or hypertension.
