notes_for_coach: >-
  WHAT THE EVIDENCE ACTUALLY SUPPORTS. The strongest data on spirulina is for
  LIPIDS — a GRADE-assessed dose-response meta-analysis of randomised trials. It
  is NOT the anaemia, energy and detox positioning spirulina is sold on in India.
  Spirulina is genuinely protein- and iron-dense by weight, but the doses people
  actually take (1-3 g) contribute little absolute iron, and its iron is non-haem
  like every other plant source. If iron is the goal, moringa has better direct
  human evidence and costs a fraction — see home_remedies/moringa-leaf-powder.

  FOUR CONTRAINDICATIONS THAT ACTUALLY BITE, and the first two are the ones this
  practice will hit:

  1. AUTOIMMUNE DISEASE. Spirulina is immunostimulating. For a Hashimoto's, RA,
     lupus or psoriasis client this is a real reason to leave it alone — and
     Hashimoto's is common in this roster. The concern is mechanistic rather than
     trial-demonstrated, but the upside here does not justify the bet.
  2. GOUT, HIGH URIC ACID, URIC-ACID STONES. Spirulina is purine-rich. This is
     the same axis as the purine-uric-acid caution in _food_cautions.yaml, and
     the catalogue's protein rule already suppresses protein pushes for
     urate-flagged clients — spirulina falls under the same logic.
  3. PHENYLKETONURIA. Absolute. Spirulina is a complete protein and a meaningful
     phenylalanine source.
  4. PRODUCT QUALITY IS A SAFETY ISSUE, NOT A PREFERENCE. Open-pond spirulina can
     carry hepatotoxic microcystins from co-occurring cyanobacteria, plus lead,
     arsenic, cadmium and mercury. This has been found in product actually on
     retail shelves. Only recommend third-party-tested, closed-system product,
     and treat an unbranded local powder as unusable.

  Anaphylaxis has been reported in atopic individuals. Start low.
notes_for_client: >-
  A green algae powder taken for cholesterol support. Start with a small amount —
  about half a teaspoon — and build up, because it can upset the stomach at
  first. Buy a tested brand rather than a loose local powder; with this one the
  brand genuinely matters. Do not start it without checking with Shivani if you
  have a thyroid or other autoimmune condition, gout, or are pregnant or
  breastfeeding.
