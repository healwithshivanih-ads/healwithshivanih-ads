interactions:
  with_medications:
  - medication: warfarin
    type: space_by_hours
    reason: Spirulina contains vitamin K, which can oppose warfarin's effect. INR monitoring is the clinician's call.
  - medication: immunosuppressants
    type: avoid_together
    reason: Spirulina is immunostimulating; the theoretical opposition to immunosuppressive therapy is the reason to avoid rather than time.
pregnancy_safety: contraindicated
lactation_safety: contraindicated
pregnancy_safety_note: >-
  Not the biology — the product. Spirulina itself has no established
  teratogenicity, but retail product is documented to carry microcystin and heavy
  metal contamination, and there is no safety margin worth taking in pregnancy or
  lactation for a supplement whose main evidence base is lipids.
