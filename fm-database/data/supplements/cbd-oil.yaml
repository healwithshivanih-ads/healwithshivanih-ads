contraindications:
  conditions:
  - Liver disease — CBD raises liver enzymes in a dose-dependent manner (Epidiolex trials)
  medications:
  - Warfarin — CBD inhibits CYP2C9 and raises INR
  - Tacrolimus / cyclosporine and other CYP3A4 substrates — raised drug levels
  life_stages:
  - pregnancy — avoid (FDA advises against)
  - breastfeeding — avoid (FDA advises against)
