notes_for_coach: |-
  CBD oil referenced for fibromyalgia, chronic pain, sleep, anxiety, neurodegeneration,
  and autoimmune conditions. Described as a secondary intervention after foundational
  nutrition and antioxidants are in place. Not a replacement for vitamin C, glutathione,
  or foundational diet work. Regulatory status varies by country — verify local
  availability.

  Best used for: Most credible for social or performance anxiety, based on small
  short-term human studies. Evidence for sleep, chronic pain and general anxiety is
  weaker and mixed. Low-dose drops may not match what was studied. Product quality and
  THC content vary in India, and CBD interacts with several medications (blood thinners,
  anti-seizure drugs, transplant drugs, sedatives).
notes_for_client: CBD oil can support pain, sleep, and anxiety as part of a broader
  anti-inflammatory plan. It works best after you've built a strong dietary and nutritional
  foundation.
