notes_for_coach: |-
  Latin: Salvia officinalis; Labiatae. Traditional indications: colds, flu, sore throat,
  laryngitis, swollen lymph glands, night sweats, spermatorrhea, hair loss, nervous
  dysfunction. Precautions: high Vata (excessive dryness), nursing mothers. Ayurvedic
  energetics from The Yoga of Herbs (Frawley & Lad).

  Best used for: Best evidence is for menopausal hot flushes and sweating (small
  open-label trials of standardised fresh-leaf extract) and as a gargle/spray for sore
  throat. Culinary amounts are fine; it is not worth using for mood, immunity or
  'nervous system' support beyond that, and long-term high-dose or essential-oil use
  should be avoided because of thujone.
