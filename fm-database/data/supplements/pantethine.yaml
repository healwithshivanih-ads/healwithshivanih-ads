notes_for_coach: Preferred for hypertriglyceridemia, especially in diabetics. Also normalizes
  platelet lipid composition and blood viscosity. Virtually non-toxic — useful when niacin
  is not tolerated. Active form of vitamin B5. Cited at 300mg three times a day for LDL lowering.
  Can be combined with other lipid-modifying agents.
notes_for_client: Pantethine is an active form of vitamin B5 that lowers triglycerides and
  improves cholesterol with minimal side effects. Pantethine (a form of Vitamin B5) at higher
  doses may help lower LDL cholesterol. It can be used alongside other supplements or medications
  under clinician guidance.
