notes_for_coach: 'CoQ10 is a key mitochondrial antioxidant and ATP co-factor. Ubiquinol
  form may have better bioavailability, especially in older adults. Fat-soluble —
  always take with food. Dose should be verified with clinician.


  Hypertension: average dose 225 mg/day; protocol uses 100 mg b.i.d.–t.i.d. Effect
  is not seen until 4–12 weeks of therapy — CoQ10 corrects a metabolic abnormality
  rather than acting as a direct antihypertensive, so it needs patience. Any drug
  tapering must be supervised by the prescribing clinician. For hypertension WITH
  diabetes, 100–200 mg/day; also used in the cardiovascular-complications protocol.


  Note on doubling: several product entries in supplement_links.yaml pair CoQ10 with
  another nutrient (e.g. "CoQ10 + Selenium", 100 mg CoQ10 per capsule). Check the
  co-prescribed products before adding a standalone CoQ10 — plan-check will warn.'
notes_for_client: CoQ10 is like fuel for your cell's energy factories (mitochondria).
  It can help reduce fatigue and mental sluggishness. Take it with a meal containing
  some fat for best absorption.
