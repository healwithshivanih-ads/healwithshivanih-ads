notes_for_coach: |-
  Standardised to 24% gymnemic acid; 200 mg b.i.d. Monitor blood glucose closely —
  insulin or drug doses may need reduction. Capsules/tablets reduce carbohydrate
  cravings but don't produce tongue sweetness blockade.

  Best used for: Best fit is prediabetes or type 2 diabetes: a small RCT in impaired
  glucose tolerance and a meta-analysis in type 2 diabetes show modest HbA1c and glucose
  reductions. Any client on diabetes medication needs their doctor involved because
  glucose can drop. The type 1 diabetes evidence is one old open trial — not a reason to
  use it there. Capsules do not give the sweet-taste blockade, so do not promise reduced
  sugar cravings.
notes_for_client: Gymnema sylvestre is an Ayurvedic herb that helps your body use
  insulin better and may reduce sugar cravings. Use with medical supervision if on
  insulin.
evidence_tier: plausible_emerging
