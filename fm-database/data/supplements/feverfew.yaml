typical_dose_range: {}
timing_options: []
take_with_food: optional
contraindications:
  conditions:
  - Allergy to Asteraceae/Compositae plants (ragweed, chrysanthemum, marigold, chamomile)
  - Scheduled surgery — stop ~2 weeks before (antiplatelet effect)
  medications:
  - Warfarin, other anticoagulants and antiplatelets — feverfew inhibits platelet aggregation;
    additive bleeding risk
  life_stages:
  - Pregnancy — traditional emmenagogue with uterine-stimulant activity; avoid
  - Breastfeeding — no safety data; avoid
