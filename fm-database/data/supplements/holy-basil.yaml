take_with_food: optional
notes_for_coach: |-
  Adaptogen supporting stress, blood sugar, and inflammation; avoid late-day dosing as
  it may be mildly stimulating.

  Best used for: A reasonable gentle adaptogen for a stressed client with raised blood
  sugar: small RCTs show lower perceived stress and modest glucose reductions. Culinary
  tulsi tea is fine for most; therapeutic doses should be avoided in pregnancy,
  breastfeeding and while trying to conceive.
