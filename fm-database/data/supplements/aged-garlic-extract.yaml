notes_for_coach: |-
  Budoff's research cited showing 600mg twice daily slowed progression of coronary
  calcification. Anti-inflammatory and anti-thrombotic properties also described.

  Best used for: Strongest evidence is cardiovascular: modest BP lowering in
  uncontrolled hypertension and slower coronary calcium progression. Good fit for a
  client with raised BP, family CVD history or a positive CAC score. Not worth it as an
  antifungal — candida evidence is for raw garlic/allicin in vitro, not aged extract.
notes_for_client: Aged garlic extract is different from raw garlic supplements. Research
  by Dr. Budoff suggests it may help slow the buildup of calcium in the arteries.
  Take with meals.
