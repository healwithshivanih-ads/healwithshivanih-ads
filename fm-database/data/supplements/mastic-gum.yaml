notes_for_coach: |-
  Resin from Pistacia lentiscus — H. pylori antimicrobial with some clinical trial
  support. 500mg 2x/day, typically taken on empty stomach. Used as part of antimicrobial
  rotation.

  Best used for: Best evidence is for functional dyspepsia/indigestion, and as one part
  of a layered H. pylori protocol. On its own it clears H. pylori in only a minority of
  people, so it is an adjunct, not a replacement for doctor-led eradication therapy —
  eradication should be confirmed by a retest through the client's doctor.
notes_for_client: Mastic gum is a natural resin with antibacterial properties — it's
  been used to help fight H. pylori and soothe the stomach lining.
