notes_for_coach: |-
  Colostrum (bovine, from early post-partum milk) contains immunoglobulins and growth
  factors that support gut immune repair. Indicated when sIgA antibody is low on GI-MAP
  or blood microbiome testing. Sourced from cow breast milk, early postpartum (6–12
  hours). Verify dairy tolerance before recommending.

  Best used for: Small human trials show it limits the rise in gut permeability during
  NSAID use or heavy exercise, and a meta-analysis found fewer upper respiratory
  infections in athletes and active adults. Evidence in people with existing gut
  conditions is limited. Not suitable for clients with cow's milk protein allergy.
notes_for_client: Colostrum is a natural supplement from early cow's milk that contains immune proteins to help heal and strengthen
  your gut lining. Best taken on an empty stomach.
