notes_for_coach: |-
  Latin: Elettaria cardamomum; Zingiberaceae. Sanskrit: Ela. Traditional indications:
  colds, cough, bronchitis, asthma, hoarse voice, loss of taste, poor absorption,
  indigestion. Precautions: ulcers, high Pitta. Ayurvedic energetics from The Yoga of
  Herbs (Frawley & Lad).

  Best used for: A culinary carminative spice for indigestion and gas, safe in food
  amounts. Small trials on blood pressure, lipids and fatty liver exist but are too
  limited to use it as a therapeutic supplement.
