slug: whey-protein
display_name: Whey Protein (Concentrate / Isolate)
category: other
forms_available:
- powder
- liquid
evidence_tier: strong
notes_for_coach: 'Whey protein is included in the beta blocker tapering protocol, likely for
  its role in

  supporting muscle mass, blood pressure reduction (via bioactive peptides), and

  glutathione synthesis. Appropriate for most clients unless dairy-sensitive.


  Best used for: Most useful for closing a protein gap in vegetarian clients, and for

  older or perimenopausal/menopausal women doing strength training to protect muscle. A

  pre-meal dose can blunt glucose spikes in type 2 diabetes. Not needed when diet

  protein is already adequate.


  Dose note merged from Whey Protein Isolate: powder 20–40 g (this entry keeps 14–28 g).


  Merged from Whey Protein Isolate: Protein top-up for the dairy-tolerant lacto-vegetarian
  client — the default protein

  powder when dairy is NOT being eliminated. Whey ISOLATE (not concentrate) —

  low-lactose, highest leucine, most palatable, so client pushback is lowest. Use

  isolate-grade for low-FODMAP clients (concentrate is not low FODMAP — lactose). Mild

  caution in histamine-sensitive clients (dairy can be a histamine liberator for some) —

  prefer the plant blend there. Do NOT raise the protein target for clients with kidney

  disease or high uric acid / gout — keep moderate and refer to physician. Source =

  catalogue queue once the affiliate sign-up clears; until then the affiliate-link chain

  falls back to Amazon / no link.


  Best used for: Best for dairy-tolerant vegetarians who fall short of their protein

  target, for preserving muscle in midlife and older clients alongside strength

  training, and as a small pre-meal dose to soften post-meal glucose spikes. Not for

  milk-protein allergy, and protein targets stay moderate in kidney disease or high uric

  acid.'
notes_for_client: Whey protein is an easy way to get high-quality protein that supports muscle,
  immune function, and antioxidant production. Blend into a smoothie or mix with water.
