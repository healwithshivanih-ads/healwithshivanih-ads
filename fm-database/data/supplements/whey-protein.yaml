contraindications:
  conditions:
  - cow's milk protein allergy — whey is a milk protein
  - advanced chronic kidney disease (markedly reduced eGFR) — added protein load; keep total
    protein moderate and only with the treating clinician's guidance
  - kidney-disease
  - chronic-kidney-disease
  - gout
  - hyperuricemia
  - Cow's milk protein allergy — whey is a milk protein (lactose-free isolate does not remove
    the allergen)
  medications: []
  life_stages: []
interactions:
  with_supplements: []
  with_foods: []
  with_medications:
  - medication: levodopa
    type: space_by_hours
    reason: levodopa (Parkinson's) — a large protein dose competes with levodopa absorption
      and can blunt its effect; keep whey away from levodopa doses
