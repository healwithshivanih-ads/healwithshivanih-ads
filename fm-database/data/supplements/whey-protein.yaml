contraindications:
  conditions:
  - cow's milk protein allergy — whey is a milk protein
  - advanced chronic kidney disease (markedly reduced eGFR) — added protein load; keep total
    protein moderate and only with the treating clinician's guidance
  medications:
  - levodopa (Parkinson's) — a large protein dose competes with levodopa absorption and can
    blunt its effect; keep whey away from levodopa doses
