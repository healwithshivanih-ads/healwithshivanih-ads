notes_for_coach: |-
  Latin: Foeniculum vulgare; Umbelliferae. Sanskrit: Shatapushpa. Traditional
  indications: indigestion, low agni, abdominal pain, cramps or gas, difficult or
  burning urination, children's colic. Precautions: a good general herb and spice for
  all constitutions. Ayurvedic energetics from The Yoga of Herbs (Frawley & Lad).

  Best used for: Best for gas, cramping and post-meal indigestion, and as a gentle
  option for menstrual cramps. Culinary/tea amounts are safe for nearly everyone; the
  urinary indication is traditional only.
