contraindications:
  conditions:
  - Allergy to Apiaceae plants (celery, carrot, mugwort, coriander) — cross-reactive allergy
  - Oestrogen-sensitive cancers (e.g. ER+ breast cancer) — anethole is weakly oestrogenic;
    avoid concentrated extracts/oil (culinary use is fine)
  medications: []
  life_stages:
  - Pregnancy and breastfeeding — EMA advises against medicinal fennel preparations, especially
    the essential oil (estragole content); culinary amounts and occasional seed tea are fine
