notes_for_coach: |-
  Specifically recommended alongside aloe vera gel and L-glutamine for gastric ulcer
  healing. Use when betaine HCl is contraindicated due to suspected ulcer.

  Best used for: Best for the stomach lining: gastritis or peptic ulcer, NSAID-related
  gut irritation, support alongside H. pylori treatment (spaced at least 2 h from
  tetracycline or quinolone doses), and during PPI tapering. Not a general zinc source.
  Count its zinc toward the daily total when another zinc product is in the plan.
notes_for_client: If you have or suspect a stomach ulcer, use zinc carnosine, aloe
  vera gel, and L-glutamine to help heal the lining before starting HCl supplementation.
