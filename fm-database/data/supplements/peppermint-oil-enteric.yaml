notes_for_coach: |-
  Peppermint contains saponins that act as molecular sponges for excess hydrogen and
  methane. Also promotes intestinal motility. Enteric coating prevents reflux. Useful in
  methane-dominant and mixed SIBO.

  Best used for: First-line, well-evidenced option for IBS abdominal pain, cramping and
  bloating (enteric-coated, before meals), and with caraway for functional dyspepsia.
  Less useful where reflux is the main complaint, as it can worsen heartburn.
notes_for_client: Enteric-coated peppermint oil helps mop up excess gas in your gut
  and supports healthy gut movement.
