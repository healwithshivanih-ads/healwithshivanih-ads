contraindications:
  conditions:
  - Liver disease or raised liver enzymes — rare hepatotoxicity reports (German BfArM review);
    stop if jaundice or dark urine
  medications: []
  life_stages:
  - Pregnancy — not recommended (EMA monograph, no data)
  - Lactation — not recommended (EMA monograph, no data)
  - Infants under 1 year — not established safe
interactions:
