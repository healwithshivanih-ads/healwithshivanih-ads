notes_for_coach: |-
  EPs 7630 extract: Adults 3 mL t.i.d. or 2×20 mg tablets t.i.d. for up to 14 days
  (sinusitis) or 22 days. Children 7–12: 30 drops t.i.d.; ≤6 years: 10 drops t.i.d.
  Approved drug in Germany for acute bronchitis. No known drug interactions.

  Best used for: Best evidence is for shortening acute bronchitis and acute sinusitis
  and reducing common-cold duration when started at the first symptoms (EPs 7630
  extract, up to 2-3 weeks). Not a long-term immune 'booster' — there is no evidence for
  prevention or continuous use.
notes_for_client: Umcka is most effective when started early in a respiratory infection.
  Use for no longer than 2–3 weeks per course.
evidence_tier: plausible_emerging
