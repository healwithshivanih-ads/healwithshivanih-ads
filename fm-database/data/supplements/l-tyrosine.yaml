notes_for_coach: Precursor to dopamine, norepinephrine, epinephrine, and thyroid hormones.
  Best taken away from food. Use cautiously with thyroid conditions or stimulant medications.
  Lynch recommends for fast COMT as a precursor to dopamine, norepinephrine, and epinephrine.
  NEVER within 6 hours of bedtime (stimulating). AVOID in slow COMT — worsens excess catecholamine
  burden. Also a MAOA burden — avoid in slow MAOA. Only appropriate when catecholamine levels
  are genuinely low (fast COMT). Discuss with clinician if prescribed as any medication could
  interact.
