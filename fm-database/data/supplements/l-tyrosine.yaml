notes_for_client: L-tyrosine is an amino acid that helps build your focus and motivation brain
  chemicals, especially useful when stress has depleted your drive. An amino acid that helps
  your body make energising brain chemicals. Take only in the morning or early afternoon —
  never close to bedtime.
