notes_for_coach: |-
  Latin: Apium graveolens; Umbelliferae. Sanskrit: Ajamoda. Traditional indications:
  colds, flus, laryngitis, bronchitis, asthma, cough, colic, indigestion, edema,
  arthritis. Precautions: hyperacidity, high Pitta. Ayurvedic energetics from The Yoga
  of Herbs (Frawley & Lad).

  Best used for: Culinary/traditional carminative for gas and sluggish digestion; human
  evidence is thin. Fine as a kitchen remedy (ajwain water after heavy meals), not a
  supplement to rely on for a diagnosed GI condition.
