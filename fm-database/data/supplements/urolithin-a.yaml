notes_for_coach: 'Postbiotic — a gut-microbiome metabolite of ellagitannins (pomegranate,
  walnuts, berries). Only an estimated 30-40% of people produce it in meaningful amounts,
  which is the rationale for supplementing the finished compound. Mechanism is MITOPHAGY (clearing
  damaged mitochondria) — a different lever from CoQ10 / NAD+ / B vitamins, which support
  the mitochondria you already have.


  EVIDENCE, HONESTLY: four human RCTs, all manufacturer-funded (Amazentis/Timeline, who make
  the branded Mitopure used in every trial). Andreux 2019 was a SAFETY trial with molecular
  secondary outcomes. Singh 2022 (n=88 untrained overweight middle-aged, 500 mg, 4 months)
  showed ~12% strength gain. Liu 2022 (aged 65-90, 1000 mg, 8 weeks) showed better muscle
  endurance. Denk 2025 is a phase 1 n=50 immune-marker study. Good journals, real trials,
  one funder — so tier stays plausible_emerging until independent replication exists.


  DOSE: 500-1000 mg once daily, with or without food; consistency of timing matters more than
  which time. Benefits reported to plateau at 1000 mg.


  SAFETY: the 2026 vendor talk stated NO contraindications at all — searched explicitly. That
  silence is not clearance. The pregnancy/lactation caution below is ours and stays. No protein
  or purine load, so no uric-acid or kidney concern.


  POSITIONING: a refinement, not a first-line lever. Consider only after sleep, protein, resistance
  training, iron/B12/D and thyroid are addressed — the trials recruited people who changed
  nothing else, which is not how we coach. Cost in India is a real barrier; no affiliate link
  yet.'
