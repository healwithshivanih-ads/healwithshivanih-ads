notes_for_coach: Clinically important because a client with slow COMT/MAOA (neurotransmitter build-up)
  put on an SSRI may get MORE anxious/irritable. If mood worsens after an SSRI or methyl-donor is started,
  that is a heads-up to route the client back to their prescriber — never adjust medication yourself.
sources:
- id: fmca-m11-genetics-epigenetics-joffe
  location: Mood & behaviour segment (Mary case)
  quote: COMT is the Swiss-army-knife gene. With slow MAOA TT and slow COMT AA you build up serotonin
    and dopamine, not low; the SSRI may be compounding the problem.
- id: dirty-genes-lynch
  location: 'Chapter 6: Your COMT in Action'
  quote: The COMT gene affects the way you metabolize estrogen, catechols from food and drink, and the
    stress neurotransmitters dopamine, norepinephrine, and epinephrine.
- id: dirty-genes-lynch
  location: Chapter 15 — Supporting a Slow COMT
  quote: Protein provides tyrosine, a nutrient that your COMT enzyme uses. If you give it a lot of tyrosine,
    you're potentially slowing it down.
- id: dirty-genes-lynch
  location: 'Chapter 3 — The Super Seven: A Snapshot'
  quote: COMT affects metabolism of dopamine, norepinephrine, and epinephrine, affecting your mood, energy
    level, ability to calm down, ability to sleep, and ability to focus; it also affects estrogen metabolism.
