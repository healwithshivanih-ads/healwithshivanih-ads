slug: mitophagy
display_name: Mitophagy
aliases:
- mitochondrial autophagy
- mitochondrial clearance
- mitochondrial recycling
category: metabolic
summary: The selective clearance of damaged mitochondria, so they can be broken down
  and replaced with new ones. It is the maintenance arm of mitochondrial turnover
  and declines with age, which lets dysfunctional mitochondria accumulate. Distinct
  from biogenesis (making new mitochondria) and from supporting the function of
  mature ones — a cell can be making new mitochondria while still failing to clear
  the broken ones.
