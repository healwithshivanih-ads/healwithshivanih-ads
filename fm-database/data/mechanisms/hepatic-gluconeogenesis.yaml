notes_for_coach: 'The answer to "I ate nothing after 8pm and my morning sugar was still high": the
  liver keeps exporting glucose overnight when insulin fails to suppress it. Levers are the evening
  meal composition, a post-dinner walk, sleep and stress load — not eating even less at night.'
