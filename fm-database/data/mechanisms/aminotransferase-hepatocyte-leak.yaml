slug: aminotransferase-hepatocyte-leak
display_name: ALT and AST leaking from stressed liver and muscle cells
aliases:
- transaminase leak
- hepatocellular enzyme leak
- aminotransferase release
- sgpt sgot leak
category: metabolic
summary: |
  ALT and AST are working enzymes INSIDE cells. They move amino groups between
  amino acids so the cell can turn protein into fuel and glucose, and both
  need vitamin B6 (as P5P) to work. Normally only a trickle reaches the blood.
  When cells are stressed or damaged, their membranes leak and more enzyme
  spills out, so the blood level is a measure of cell injury, not of how well
  the liver "works".

  ALT sits almost only in the liver's cell fluid, so it is the more
  liver-specific of the two. AST sits in the liver too, but also in muscle,
  heart, kidney and red cells, and much of it is inside mitochondria. That is
  why AST rises with hard exercise, muscle injury and haemolysis, and why
  AST climbing above ALT points to deeper (mitochondrial) liver damage such as
  alcohol injury or fibrosis.

  In fatty liver, fat and insulin resistance overload the liver cell
  (lipotoxicity), which leaks ALT first; that is why ALT is the classic
  liver-fat marker and AST/ALT stays below 1 in early fatty liver. Because
  the enzymes need B6, a B6-deficient or frail person can show a falsely low
  reading.
