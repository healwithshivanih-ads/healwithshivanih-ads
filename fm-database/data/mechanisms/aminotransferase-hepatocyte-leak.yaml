notes_for_coach: |
  Use this to explain to yourself why the two enzymes disagree. ALT up more
  than AST = liver-cell (often fat) stress. AST up more than ALT = think
  alcohol, muscle (exercise, injury, statin myalgia), or more advanced liver
  disease; check CK if muscle is possible.
