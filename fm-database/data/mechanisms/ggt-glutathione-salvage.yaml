slug: ggt-glutathione-salvage
display_name: GGT and the glutathione salvage cycle
aliases:
- gamma-glutamyl cycle
- ggt glutathione recycling
- glutathione salvage
- serum ggt as oxidative stress marker
category: metabolic
summary: |
  Gamma-glutamyl transferase (GGT) sits on the outer surface of liver, kidney,
  bile-duct and many other cells. Its job is to break down glutathione OUTSIDE
  the cell so that the pieces (above all cysteine, the scarce building block)
  can be taken back in and used to rebuild glutathione INSIDE the cell. When a
  cell is under oxidative stress (alcohol, liver fat, bile backing up,
  enzyme-inducing medicines, pollutants), it makes more GGT to recover more
  cysteine, and more GGT spills into the blood. That is why serum GGT, even
  inside the lab's normal range, tracks oxidative stress, low antioxidant
  status and later cardiometabolic disease. The same reaction has a darker
  side: its product cysteinyl-glycine can reduce iron and so generate free
  radicals, which is why high GGT together with high ferritin is a stronger
  oxidative picture than either alone.
