notes_for_coach: |
  Use this to explain to yourself, not to the client, why one cheap liver
  enzyme is so predictive. The client version: "GGT is a smoke alarm for how
  hard your body is working to keep its main antioxidant topped up."

  It also explains the levers: give the cycle less to do (less alcohol, less
  liver fat, fewer exposures) and give it more raw material (protein with
  cysteine and glycine, sulphur vegetables, colourful plants). It is a
  reason to check ferritin when GGT is high, because iron turns the cycle
  from protective to pro-oxidant.

  GGT is non-specific. A high value says "stress on the glutathione system",
  never which stress. Enzyme-inducing medicines raise it without harm.
