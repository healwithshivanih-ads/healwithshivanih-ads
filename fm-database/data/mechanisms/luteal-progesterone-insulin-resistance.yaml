slug: luteal-progesterone-insulin-resistance
display_name: Luteal Progesterone-Driven Insulin Resistance
aliases:
- progesterone insulin resistance
- luteal insulin resistance
category: metabolic
summary: High luteal-phase progesterone reduces insulin sensitivity, so the same meal
  produces higher and more variable glucose excursions in the second half of the cycle
  than in the first. This is a physiological pro-gestational adaptation, not a failure
  of the client's diet.
