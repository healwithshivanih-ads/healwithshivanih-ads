category: immune
summary: The self-perpetuating inflammatory loop that turns transient dryness into
  chronic dry eye disease. An unstable or evaporating tear film raises tear
  osmolarity; hyperosmolar tears stress the surface epithelium, which releases
  inflammatory cytokines and matrix metalloproteinases; these recruit T cells to the
  ocular surface and lacrimal gland, damaging goblet cells and reducing both mucin
  and tear secretion — which destabilises the tear film further. Once the loop is
  established it sustains itself independently of the original trigger, which is
  precisely why adding more lubricant stops helping and why treatment shifts to
  anti-inflammatory agents. It is also why benefit is measured in weeks to months
  rather than days.
upstream_drivers:
- meibomian gland dysfunction and lid margin disease
- postmenopausal oestrogen and androgen decline
- autoimmune glandular infiltration (Sjögren's)
- low omega-3 status and a high omega-6 to omega-3 ratio
- reduced blink rate from screen use
- anticholinergic, antihistamine, beta-blocker and diuretic medication
- preservative (benzalkonium chloride) toxicity from frequent preserved drop use
- low ambient humidity, air conditioning and direct airflow
