notes_for_coach: 'Timing is the diagnostic clue worth asking about: fermentation bloat builds through
  the day and is worst after fermentable carbohydrate, unlike gastric bloat which is immediate. Low-FODMAP
  is a short diagnostic tool, NOT a destination — prolonged restriction starves the very species you
  are trying to restore.'
