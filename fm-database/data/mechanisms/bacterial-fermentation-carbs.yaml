slug: bacterial-fermentation-carbs
display_name: Bacterial Fermentation of Carbohydrate
category: gut
aliases:
- carbohydrate fermentation
- bacterial carbohydrate fermentation
summary: Bacteria ferment carbohydrate that has not been absorbed in the small intestine, producing
  hydrogen, methane, carbon dioxide and short-chain fatty acids. In the colon this is normal and desirable.
  Displaced upward into the small intestine — as in SIBO — or fed by more fermentable substrate than
  the system can handle, the same process produces distension, gas and pain within an hour or two
  of eating.
