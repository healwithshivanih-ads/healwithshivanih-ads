slug: bacterial-histamine-production
display_name: Bacterial Histamine Production
category: gut
aliases:
- microbial histamine production
- histamine-producing bacteria
summary: Certain gut species decarboxylate dietary histidine into histamine in the lumen, adding to
  the histamine load the body must clear. Where DAO activity is already limited, this microbial contribution
  can be the difference between tolerance and reaction — and is why some probiotics, including several
  Lactobacillus strains, make histamine symptoms worse rather than better.
