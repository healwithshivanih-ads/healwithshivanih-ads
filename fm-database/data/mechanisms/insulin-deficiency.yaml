slug: insulin-deficiency
display_name: Insulin Deficiency
category: endocrine
aliases:
- absolute insulin deficiency
- beta cell insulin loss
summary: 'Absolute shortfall of insulin because the beta cells producing it have been destroyed or
  exhausted. Distinct from insulin resistance, where insulin is present but tissues do not respond:
  here the hormone itself is missing, glucose cannot enter cells, and the body switches to fat for
  fuel with ketones as the by-product.'
