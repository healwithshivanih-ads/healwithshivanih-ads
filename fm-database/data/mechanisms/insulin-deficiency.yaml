linked_to_symptoms:
- polyphagia
notes_for_coach: Never coach carbohydrate restriction or fasting into suspected insulin deficiency
  — this is the presentation where that causes harm. Hunger with weight LOSS, thirst and polyuria
  is an urgent referral, not a lifestyle conversation.
