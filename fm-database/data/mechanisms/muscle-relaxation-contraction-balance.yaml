notes_for_coach: Night cramps and eyelid twitch are the everyday presentation. Food-first magnesium
  (pumpkin seeds, leafy greens, millets) plus hydration and salt in the heat; glycinate if a supplement
  is warranted, since oxide mostly loosens the bowel.
