sources:
- id: coconote-fm-vitamin-b9-b12-mthfr
  location: Methylcobalamin / SAM section
  quote: SAM is very necessary for the methylation of various biochemical reactions in the body, including
    the myelin production. Now it is also necessary for the production of some very important neurotransmitters
    like dopamine and serotonin.
- id: dirty-genes-lynch
  location: 'Chapter 2 — Methylation: Your Key to Clean Genes'
  quote: Methylation controls your genetic expression. It determines whether a particular gene will be
    turned on—or off. Every gene in every cell is ultimately regulated by methylation.
- id: vitaone-nutrition-toolkit
  location: 'Food Sources: Vitamin B12'
  quote: Those who have high homocysteine levels or genetic variants in methylation genes may respond
    better to 'active' forms of vitamin B12 such as methylcobalamin.
- id: vitaone-fm-nutrition-cheatsheets
  location: Key Mechanisms Explained – methylation-support
  quote: The source describes folate, B12, choline, riboflavin, niacin, glycine, creatine, and TMG as
    nutrient supports for methylation.
- id: coconote-fm-biomarkers-cvs
  location: Homocysteine and Clotting
  quote: this whole reaction is is covered by the mthfr gene and you can say methyl tetrahydrofolic enzyme
    and this enzyme requires four factors vitamin b vitamin b9 and vitamin b12 so typically this is called
    methylation process
- id: dirty-genes-lynch
  location: 'Chapter 5: The Methylation Cycle Part 2'
  quote: MTHFR gets the process going by passing a methyl group to folate. That methylfolate then interacts
    with another biochemical—homocysteine, for example—passing the methyl group to it.
