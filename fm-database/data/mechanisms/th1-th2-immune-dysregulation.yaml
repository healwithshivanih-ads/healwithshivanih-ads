- th1-th2-imbalance
summary: The T-helper response skews rather than staying balanced. A Th1 skew favours cell-mediated,
  tissue-damaging autoimmunity; a Th2 skew favours antibody, allergic and atopic responses. Regulatory
  T-cell capacity — which depends on vitamin D, butyrate and a diverse microbiome — is what normally
  holds the balance.
