slug: non-ovulatory-lh-surge
display_name: Non-Ovulatory LH Surge
aliases:
- failed ovulation attempt
- lh surge without ovulation
- unsuccessful lh surge
category: endocrine
summary: An LH surge occurs but fails to rupture the follicle, so no corpus luteum
  forms and no progesterone rise follows. The body may mount a second, successful
  surge later in the same cycle — which looks like a "long cycle" but is a distinct
  event. Seen in PCOS and in perimenopause, where brain-to-ovary signalling is
  poorly coordinated.
