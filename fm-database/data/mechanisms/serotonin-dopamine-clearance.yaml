slug: serotonin-dopamine-clearance
display_name: Serotonin & Dopamine Clearance
category: neurological
aliases:
- monoamine clearance
- monoamine breakdown
summary: Rate at which monoamine neurotransmitters are broken down after release, chiefly by monoamine
  oxidase and by COMT. Clearance that runs fast leaves the synapse depleted between signals; clearance
  that runs slow leaves signalling elevated and slow to switch off. Both directions are symptomatic,
  which is why the same nutrient can help one person and unsettle another.
upstream_drivers:
- monoamine-oxidation
- catechol-methylation
downstream_effects:
- low-mood
- anxiety
- addictive-tendencies
