- maoa-slow-serotonin-excess
notes_for_coach: 'The practical consequence of a genotype report: direction of travel matters more
  than the variant name. Go low and slow with anything methyl-donating or precursor-loading in a slow
  clearer, and watch for agitation rather than assuming benefit.'
