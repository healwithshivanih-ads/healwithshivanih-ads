slug: microvascular-damage
display_name: Microvascular Damage
category: structural
aliases:
- small vessel damage
- microangiopathy
- capillary damage
summary: Sustained hyperglycaemia, oxidative stress and advanced glycation end-products thicken and
  stiffen capillary basement membranes, so perfusion of the tissues that depend on the smallest vessels
  fails first — retina, glomerulus, peripheral nerve, and the skin of the feet. The damage is largely
  silent until function is already lost.
