notes_for_coach: This is the mechanism that makes post-meal glucose control matter more than a single
  fasting number. Screening intervals (retinal, renal, foot) are clinician scope — the coaching job
  is making sure they actually happen, and that any foot wound is seen quickly rather than watched.
