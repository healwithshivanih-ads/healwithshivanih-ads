evidence_tier: plausible_emerging
notes_for_coach: 'WHY THIS MATTERS FOR PRESCRIBING EXERCISE, and it is the practical half.
  Lehman notes that people with mild intermittent pain often feel BETTER after aggressive
  exercise or foam rolling, because that activity triggers the body''s own pain relief. A
  centrally sensitised client gets a much smaller response from the same approach, or flares
  up with more pain. So the failure mode is prescribing the intensity that works for
  everyone else and reading the flare as the client not trying. The instruction is not to
  stop exercising — it is to do less in one session, progress intensity slowly, and expect
  that some flare-ups will happen anyway.

  HABITUATION IS THE SAME MACHINERY RUNNING THE OTHER WAY — the same input producing a
  smaller output over time. That is what graded exposure is trading on, and it is why the
  answer to a sensitised system is a smaller dose repeated, not avoidance.

  DO NOT USE THIS AS A LABEL IN FRONT OF A CLIENT. "You are centrally sensitised" lands as
  "the pain is in your head". The workbook''s own framing — the alarm system has got very
  good at its job and is going off too easily — says the same thing without the insult.'
