- sensitised nervous system
- wind-up
category: neurological
summary: The nervous system becomes better at producing pain. The same input from the body
  is amplified as it is processed through the spinal cord and brain, so a normal amount of
  nociception yields a much larger amount of pain — and eventually pain arrives with little
  or no nociception at all. It is the mechanism behind pain that spreads, moves around,
  flares easily, or is felt where there should only be pressure or touch.
upstream_drivers:
- continued tissue irritation and nociception
- poor sleep
- psychological stress, worry and catastrophising
- fear of movement and prolonged avoidance
downstream_effects:
- pain out of proportion to tissue findings
- pain that spreads or moves to other body areas
- pain felt from light touch or pressure that should not hurt
- flare-ups triggered more readily, including by exercise that helps others
- reduced response to exercise-induced pain relief
