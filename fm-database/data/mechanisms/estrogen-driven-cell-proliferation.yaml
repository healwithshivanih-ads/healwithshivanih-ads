slug: estrogen-driven-cell-proliferation
display_name: Oestrogen-Driven Cell Proliferation
category: endocrine
aliases:
- estrogen driven proliferation
- oestrogenic proliferation
- estrogen-driven-cell-proliferation
summary: Oestrogen binding to receptors in hormone-sensitive tissue — endometrium, breast, myometrium
  — drives mitosis in that tissue. Where oestrogen is relatively unopposed by progesterone, or where
  clearance through methylation, glucuronidation and the gut is slow, proliferation outruns the shedding
  that would normally balance it.
