notes_for_coach: 'The coaching levers are on CLEARANCE, not on oestrogen itself: daily bowel movements,
  cruciferous vegetables, adequate fibre to bind conjugated oestrogens, alcohol moderation. Any new
  or worsening abnormal bleeding is a referral, not a coaching target.'
