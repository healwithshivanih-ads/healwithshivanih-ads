interpretation_high: |
  Cholesterol carried in triglyceride-rich remnant particles: total
  cholesterol minus HDL minus LDL.

    - under 20 mg/dL: low remnant burden
    - 20 to 30: borderline
    - above 30: high — a risk on top of LDL that tracks insulin resistance
      and high TG

  Each 39 mg/dL (1 mmol/L) rise carried 2.8 times the heart-disease risk
  in Copenhagen genetic data. Only meaningful when LDL is measured
  directly; with a calculated (Friedewald) LDL it is just TG/5.
when_to_order: |
  Nothing extra to order: a lipid panel with a DIRECT LDL (Thyrocare prints
  'LDL Cholesterol - Direct').
