units: ratio
sample_type: blood (calculated)
conventional_low: 1.2
fm_optimal_low: 1.2
interpretation_low: |
  Cholesterol per ApoB particle (both mg/dL). Every LDL particle carries
  one ApoB, so a low ratio means many small particles each carrying little
  cholesterol — the small dense LDL pattern.

    - 1.2 or more: normal cholesterol load per particle
    - under 1.2: suggests small dense LDL; follow ApoB, not LDL-C

  A surrogate: TG/HDL predicts small dense LDL at least as well, so the
  app reads the two together.
when_to_order: |
  Needs ApoB on the panel (Aarogyam F Pro includes it).
