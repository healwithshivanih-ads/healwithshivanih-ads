notes_for_coach: >-
  THE COACH CAN DO THIS - no laboratory, no doctor, no cost. It is the objective
  measure that turns "she says her mouth is dry" into a number.

  METHOD - client must not eat, drink, smoke or brush for 90 minutes beforehand.
  Late morning is standard (flow varies through the day, so repeat at the same
  time). Seated, head slightly forward, eyes open. Ask them to let saliva pool and
  spit into a pre-weighed or graduated container every 60 seconds for 5 minutes,
  WITHOUT swallowing and without stimulating the mouth (no chewing, no tongue
  movement). Divide total mL by 5. 1 gram = 1 mL if weighing.

  WHY THIS MATTERS IN INDIAN PRACTICE - clients are often treated badly for asking
  a doctor to run a specific test. A measured flow rate of 0.08 mL/min is a
  finding, not a request, and it changes the consultation. Pair it with a
  direct-order ENA/anti-SSA panel where indicated.

  Reference points are approximate and method-sensitive - normal unstimulated flow
  is usually quoted around 0.3-0.5 mL/min. Use the trend within a client as much
  as the absolute number.
