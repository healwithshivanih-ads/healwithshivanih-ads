units: mL/min
sample_type: saliva
conventional_low: 0.1
conventional_high: 1.5
fm_optimal_low: 0.3
fm_optimal_high: 1.5
interpretation_low: >-
  0.1 mL/min or less is objectively low and is a scoring item in the 2016
  ACR/EULAR Sjogren's classification criteria. 0.1 to 0.2 mL/min is borderline -
  a re-analysis argues the 0.1 cutoff is too strict and that 0.2 raises
  sensitivity by about 19.8% (>=70% sensitivity, >=50% specificity). Treat <=0.1
  as clearly low and 0.1-0.2 as worth pursuing, not normal. Common non-autoimmune
  causes to exclude first - anticholinergic and sedating medication (tricyclics,
  SSRIs, antihistamines, benzodiazepines, opioids, diuretics), mouth breathing,
  dehydration, and head/neck radiotherapy.
interpretation_high: Not clinically meaningful; high flow is not a concern.
when_to_order: >-
  Any client reporting dry mouth, and ROUTINELY in autoimmune thyroid disease
  where 37% meet xerostomia criteria. Especially where dry mouth and dry eyes
  co-occur. Also useful to objectify a symptom before deciding whether antibody
  testing is worth the cost, and to track response over time.
