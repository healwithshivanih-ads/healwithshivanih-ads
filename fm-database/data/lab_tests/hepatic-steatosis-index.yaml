sources:
- id: lee-2010-hepatic-steatosis-index
  location: Abstract
  quote: At values of <30.0 or >36.0, HSI ruled out NAFLD with a sensitivity of 93.1%, or detected NAFLD with a specificity of 92.4%
evidence_tier: strong
notes_for_coach: |
  Worked example: a woman with ALT 46.5, AST 26.7, BMI 24.0, no diabetes.
  46.5 / 26.7 = 1.74; x 8 = 13.9; + 24.0 = 37.9; + 2 for female = 39.9.
  Above 36, so it suggests fatty liver even at a normal BMI, because ALT is
  well above AST.

  Derived in Korean adults. Never tell a client they "have fatty liver" from
  this number; say whether a scan is worth discussing with the doctor.
