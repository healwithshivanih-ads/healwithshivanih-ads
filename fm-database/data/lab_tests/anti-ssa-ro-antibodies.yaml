units: U/mL
sample_type: blood
interpretation_low: Negative. Does NOT exclude Sjogren's - seronegative disease is
  well described, and a client with clearly low salivary flow still warrants
  clinician review.
interpretation_high: >-
  Positive - the principal serological marker for Sjogren's syndrome, also seen in
  lupus. In one cohort serum anti-SSA/Ro reached AUC 0.906 with 100% sensitivity
  and 81% specificity. A positive result is a REFERRAL TRIGGER to rheumatology,
  never a diagnosis made by us. Note anti-Ro52 can be positive with a negative
  ANA, so a normal ANA does not rule it out.
when_to_order: >-
  Dry mouth plus dry eyes, particularly in autoimmune thyroid disease (Sjogren's
  runs at 17% in Hashimoto's). Best ordered as part of an ENA profile, which
  bundles SSA and SSB with Sm, RNP, Scl-70 and Jo-1 for a similar price. Consider
  measuring unstimulated whole salivary flow rate FIRST - it costs nothing and
  tells you whether the antibody spend is justified.
