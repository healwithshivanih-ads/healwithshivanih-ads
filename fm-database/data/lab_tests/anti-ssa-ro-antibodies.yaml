notes_for_coach: >-
  DIRECTLY ORDERABLE IN INDIA WITHOUT A PRESCRIPTION as part of an ENA/ANA profile
  - Redcliffe, Metropolis, Lupin, Ganesh, HOD and others offer it with home
  collection. Observed range roughly Rs 3,500-7,800 depending on lab and on
  qualitative versus quantitative; the Rs 4,500 here is a mid-point, so CONFIRM
  current pricing with Acumen before quoting a client a figure.

  This is the practical answer to doctors reacting badly when a patient asks for a
  specific test - order it directly, then the client attends with a result in hand.

  Order the ENA PROFILE rather than SSA alone; it is barely more expensive and
  covers SSB/La in the same draw.
