slug: fib-4
display_name: FIB-4
full_name: Fibrosis-4 Index (age, AST, ALT and platelets)
aliases:
- fib4
- fib-4 index
- fib-4 score
- fibrosis-4
units: score
sample_type: blood (calculated)
# FIB-4 = (age in years x AST U/L) / (platelets 10^9/L x square root of ALT U/L)
# Low-risk cut-off in fatty-liver guidance: below 1.3. Above 2.67 = high risk.
# Under 35 the score is unreliable; over 65 a cut-off of 2.0 is often used.
fm_optimal_high: 1.3
interpretation_high: |
  FIB-4 is not a separate blood test. It is worked out from four things
  already on most reports: age, AST, ALT and platelet count. It estimates the
  chance that a fatty or damaged liver has already scarred (fibrosis).

    - under 1.3: low risk of advanced fibrosis; lifestyle work and re-check
      every 1-2 years if risk factors stay
    - 1.3 to 2.67: indeterminate; needs a liver stiffness scan (FibroScan)
      or the doctor
    - above 2.67: high risk; the doctor, promptly

  Its strength is ruling scarring OUT (over 90% reliable below the low
  cut-off). A high score is a reason for a scan, not a diagnosis.
when_to_order: |
  Calculate it whenever age, AST, ALT and platelets are on the same report
  and the client has insulin resistance, prediabetes, type 2 diabetes,
  central weight, raised ALT, or drinks. Nothing extra to order.
  Not reliable under 35; over 65 it reads high, so 2.0 is used as the
  low-risk line.
fasting_required: false
