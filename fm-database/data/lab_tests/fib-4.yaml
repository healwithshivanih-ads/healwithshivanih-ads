evidence_tier: strong
notes_for_coach: |
  Worked example: a 48-year-old with AST 30, ALT 36, platelets 250.
  48 x 30 = 1440; square root of 36 = 6; 250 x 6 = 1500; 1440 / 1500 = 0.96.
  Under 1.3, so low risk of scarring.

  Platelets must be in 10^9/L. Indian reports often print "lakhs/cumm":
  2.5 lakhs = 250.

  Why it matters for coaching: a normal ALT can hide fatty liver, and a
  raised ALT is often harmless fat stress. FIB-4 tells which clients need
  the doctor's scan now and which can simply do the lifestyle work.

  Never tell a client they "have fibrosis" or "don't have fibrosis" from this
  number; say whether it suggests a scan is worth discussing with the doctor.
