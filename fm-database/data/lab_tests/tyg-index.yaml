slug: tyg-index
display_name: TyG index
full_name: Triglyceride-Glucose Index
aliases:
- tyg
- triglyceride glucose index
- triglyceride-glucose index
- tyg index
units: score
sample_type: blood (calculated)
# TyG = ln(fasting TG mg/dL x fasting glucose mg/dL / 2)
# Computed automatically by fmdb/assess/lab_ratios.py (Liver & Metabolic Risk).
conventional_high: 8.8
fm_optimal_high: 8.3
interpretation_high: |
  TyG is worked out from two numbers on almost every report: fasting
  triglycerides and fasting glucose. It reads insulin resistance without a
  fasting insulin test.

    - under 8.3: no insulin-resistance signal
    - 8.3 to 8.8: borderline; early insulin resistance
    - above 8.8: insulin resistance and a fatty-liver risk pattern

  Cut-offs vary by population, and several South Asian studies sit lower,
  so the trend between reports matters more than one number.
when_to_order: |
  Nothing extra to order: any report with fasting triglycerides and fasting
  glucose. Most useful when fasting insulin (and so HOMA-IR) is missing.
  Needs a true 8-12 hour fast; an acute illness or a heavy or alcohol-rich
  meal the night before raises both inputs.
fasting_required: true
typical_cost_inr: 0
