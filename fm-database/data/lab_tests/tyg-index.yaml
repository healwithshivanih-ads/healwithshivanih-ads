evidence_tier: plausible_emerging
notes_for_coach: |
  Worked example: TG 54 mg/dL, fasting glucose 93.75 mg/dL.
  54 x 93.75 = 5062.5; half of that is 2531.25; ln(2531.25) = 7.84.
  Under 8.3, so no insulin-resistance signal.

  Units must be mg/dL. The app converts mmol/L itself (TG x 88.57,
  glucose x 18).
