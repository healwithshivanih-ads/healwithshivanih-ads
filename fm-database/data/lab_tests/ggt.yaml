notes_for_coach: |
  How to read it, step by step:

  1. Pair it with ALP. GGT and ALP both high = bile-flow picture (GGT is not
     made in bone, so it tells a liver ALP from a bone ALP). ALP high with
     GGT normal = more likely bone or growth, not liver.
  2. Pair it with ALT. GGT and ALT both creeping up with high triglycerides,
     waist or fasting insulin = liver-fat / insulin-resistance pattern.
     GGT up alone with a normal ALT = think alcohol, medicines, oxidative load.
  3. Ask about alcohol honestly and specifically (drinks per week, weekend
     pattern). It is the most common single cause.
  4. Check the medicine list for enzyme inducers (anticonvulsants, some
     TB and psychiatric medicines) before reading it as "toxic load".
  5. Look at ferritin. GGT's reaction makes free radicals when iron is
     around, and high ferritin plus high GGT is a stronger oxidative picture
     than either alone.

  What a coach can work on (in scope):
    - Alcohol reduction; re-test in 6-8 weeks
    - Colourful plants daily (carotenoid-rich: carrot, pumpkin, papaya,
      tomato, greens) and fruit; food, not antioxidant pills (in CARDIA,
      vitamin supplements went WITH higher GGT)
    - Less red and processed meat (heme iron)
    - Sulphur foods and glutathione building blocks (onion, garlic, crucifers,
      protein with enough cysteine and glycine)
    - Liver-fat levers: fibre, lower refined carbs and fructose, movement,
      waist loss
    - Coffee is fine for most; it goes with lower GGT, not higher
    - Cut exposures: smoking, solvents, pesticide residue, plastics on heat

  Refer: GGT above the lab's own upper limit, a sharp rise between tests,
  GGT with raised bilirubin or ALP (possible blockage), jaundice, pain under
  the right ribs, or very high values (several times the upper limit).

  Do NOT say to a client that GGT measures their "toxins" or proves a detox
  problem. It is a sensitive but non-specific stress signal.

  Corrected 17 Nov 2026: this entry was a stub. The old claim that "under 70
  is optimal" (ggt-above-70-indicates-phase-2-detox-impairment) is
  deprecated; 70 sits above most labs' own upper limit and the cohort data
  show risk climbing from the teens.

  India context: GGT comes in every standard LFT (Acumen base panel covers
  it); stand-alone it is ₹200-400.
