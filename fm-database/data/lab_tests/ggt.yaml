units: U/L
sample_type: blood
# Conventional upper limit varies by lab, method and sex. Typical printed
# limits: men ~55-61 U/L, women ~36-40 U/L. 55 is a middle value for a
# report that prints one range; always read the client's own report first.
conventional_high: 55
# FM-optimal ceiling 16 U/L matches the assess engine
# (fmdb/assess/lab_ratios.py: <=16 optimal, 17-25 borderline, >25 high) so
# the catalogue and the lab read never disagree. Risk in the cohorts rises
# from the low teens upward (Lee 2003: reference group was under 9 U/L).
# No FM-optimal LOW: a low GGT is not a finding in itself.
fm_optimal_high: 16
interpretation_low: |
  A low GGT is the usual healthy result and needs nothing done. A few FM
  texts link very low GGT to low magnesium or an underactive thyroid; that is
  thin and not worth acting on alone.
interpretation_high: |
  GGT is the enzyme on the outside of cells that breaks down glutathione so
  the cell can take the pieces back in and rebuild glutathione inside. Cells
  make more of it when they are under oxidative stress, so serum GGT reads
  like a smoke detector for the glutathione system and the liver.

  Common reasons it rises (most to least common in coaching practice):
    - Alcohol: even moderate, steady drinking pushes it up step by step
    - Liver fat (NAFLD / MASLD) and insulin resistance: GGT tracks liver fat
      and predicts diabetes better than ALT
    - Bile flow problems (cholestasis, gallstones): GGT rises WITH ALP
    - Enzyme-inducing medicines: phenytoin, carbamazepine, phenobarbital and
      similar raise GGT without liver damage
    - Low antioxidant intake / high oxidative load: lower fruit, vegetable
      and carotenoid intake, higher heme-iron (red meat) intake, smoking,
      possibly higher pollutant exposure

  Within the normal range, higher GGT predicts diabetes, cardiovascular death
  and death from any cause in a dose-response way. That is a risk signal,
  not a diagnosis.

  Bands used here:
    - up to 16 U/L: FM optimal
    - 17-25 U/L: borderline; look at alcohol, liver fat, diet quality
    - above 25 U/L: elevated in FM terms, even when the lab prints "normal"
    - above the lab's own upper limit: a clinician's question, not a coaching one
when_to_order: |
  On every baseline panel; it is cheap and sits inside the standard LFT. Read
  it alongside ALT, AST, ALP and bilirubin, never alone. Especially useful
  for:
    - Insulin resistance, prediabetes, PCOS, central weight gain (early
      liver-fat signal)
    - Any client who drinks regularly, or under-reports drinking
    - Suspected high toxic load (solvents, pesticides, smoking, mould)
    - Fatigue with chemical sensitivity
    - Cardiometabolic risk work, alongside ApoB, hs-CRP and HbA1c
    - Clients on anticonvulsants or other enzyme-inducing medicines
  Re-test 6-8 weeks after a lifestyle change. GGT turns over in a few weeks,
  so it is one of the quickest liver markers to show a response.
