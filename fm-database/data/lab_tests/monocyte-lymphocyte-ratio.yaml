interpretation_high: |
  Absolute monocytes divided by absolute lymphocytes: innate (monocyte-led)
  inflammation relative to the adaptive arm.

    - under 0.25: balanced
    - 0.25 to 0.35: borderline
    - above 0.35: high — chronic infection, visceral fat, atherosclerosis risk

  No agreed cut-off; FM working bands. Any infection, cold, vaccine or injury in the 3 weeks before the draw raises it; read it when the client is well.
