units: U/mL
sample_type: blood
interpretation_low: Negative. Less sensitive than anti-SSA; a negative result
  carries little weight on its own.
interpretation_high: >-
  Positive - more specific for Sjogren's than anti-SSA but less sensitive, and
  rarely positive in isolation. Usually interpreted alongside anti-SSA/Ro.
  Referral trigger, not a diagnosis.
when_to_order: Always alongside anti-SSA/Ro as part of an ENA profile; there is
  little reason to order it alone.
