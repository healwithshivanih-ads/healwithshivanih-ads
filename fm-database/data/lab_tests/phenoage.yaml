units: years
sample_type: blood (calculated)
interpretation_high: |
  A research score: the age whose mortality risk matches nine routine
  blood markers (albumin, creatinine, glucose, CRP, lymphocyte %, MCV,
  RDW, ALP, WBC) plus calendar age. Older than calendar age means the
  blood reads older; the inputs pulling it up are the ones to work on.
  Show it as a trend between reports, never as a diagnosis.
when_to_order: |
  Nothing extra: Aarogyam F Pro carries every input (hsCRP, CBC, LFT, KFT,
  glucose). Needs the client's date of birth.
