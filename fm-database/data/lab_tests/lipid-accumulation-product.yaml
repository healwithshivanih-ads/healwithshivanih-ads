  quote: LAP (describing lipid overaccumulation) performed better than BMI (describing weight overaccumulation)
evidence_tier: plausible_emerging
notes_for_coach: |
  Worked example: a woman with waist 80 cm and TG 54 mg/dL (0.61 mmol/L).
  80 - 58 = 22; 22 x 0.61 = 13.4. Low.

  TG must be in mmol/L for this one (mg/dL / 88.57); the app converts.
