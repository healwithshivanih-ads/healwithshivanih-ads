interpretation_high: |
  Platelets divided by absolute lymphocytes.

    - under 150: balanced
    - 150 to 200: borderline
    - above 200: high — platelet-driven inflammation or low lymphocytes
      (chronic stress, infection; iron deficiency also pushes platelets up)

  Adults 45+ in Rotterdam averaged 120 (95% range 61-239). FM working bands.
  Any infection, cold, vaccine or injury in the 3 weeks before the draw
  raises it; read it when the client is well.
