interpretation_low: |
  1 / (log fasting insulin + log fasting glucose mg/dL). LOWER means more
  insulin resistant — the opposite direction to HOMA-IR.

    - 0.35 or more: good insulin sensitivity (lean adults averaged 0.37)
    - 0.33 to 0.35: reduced
    - under 0.33: insulin resistance (obese group 0.33, type 2 diabetes 0.30)
