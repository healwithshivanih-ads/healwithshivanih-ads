interpretation_high: |
  SII = platelets x neutrophils / lymphocytes, all as absolute counts.
  It rises when platelets and neutrophils go up and lymphocytes go down:
  a body-wide inflammatory load.

    - under 500: low inflammatory signal
    - 500 to 800: borderline
    - above 800: high; find the driver (infection, gut, visceral fat,
      sleep, chronic stress)

  These are FM working bands; there is no agreed cut-off. Adults 45+ in
  Rotterdam averaged 459 (95% range 189-1168), and SII rises with age.
  Any infection, cold, vaccine or injury in the 3 weeks before the draw
  raises it; read it when the client is well.
when_to_order: |
  Nothing extra to order: any CBC with a differential. The app uses the
  absolute counts, or works them out from the % and the total WBC.
