slug: tryptase
display_name: Tryptase
full_name: Serum Tryptase
aliases:
- baseline tryptase
- mast cell tryptase
- serum tryptase
- total tryptase
units: ng/mL
sample_type: blood
interpretation_low: A normal tryptase does NOT rule out MCAS — it is a poor stand-alone marker.
interpretation_high: 'Very high baseline: consider systemic mastocytosis or hereditary alpha-tryptasemia.
  An acute rise of 20% + 2 ng/mL over baseline within 1-4 h of an event meets the conventional MCAS criterion.'
when_to_order: Mast cell workup — MCAS, anaphylaxis, mastocytosis, HaT. Draw a baseline when well and
  a second sample within 1-4 h of a flare. Pair with chromogranin A and chilled urine mediators.
fasting_required: false
