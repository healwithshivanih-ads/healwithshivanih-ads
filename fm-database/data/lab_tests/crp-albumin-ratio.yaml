units: ratio
sample_type: blood (calculated)
conventional_high: 0.075
fm_optimal_high: 0.025
interpretation_high: |
  CRP (mg/L) divided by albumin (g/L). Albumin falls as inflammation rises,
  so the ratio is steadier than CRP alone.

    - under 0.025: little inflammation for the protein reserve
    - 0.025 to 0.075: low-grade inflammation, or a low albumin
    - above 0.075: inflammation outpacing the liver's protein output

  The bands mirror the hsCRP 1 and 3 mg/L lines at a normal albumin; in
  acute hospital admissions a ratio above 2 predicted mortality.
when_to_order: |
  Nothing extra to order: hsCRP (or CRP) and albumin.
