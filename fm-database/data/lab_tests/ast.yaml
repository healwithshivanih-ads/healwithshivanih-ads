notes_for_coach: |
  How to read it, step by step:

  1. Look at AST/ALT (the assess engine computes it).
       - under 1 with ALT raised: early fatty-liver pattern
       - about 1-2 with both raised: watch; in fatty liver a ratio creeping
         toward 1 can mean fibrosis is building, so run FIB-4
       - above 2: alcohol pattern until proven otherwise; ask about drinking
         honestly and specifically
  2. AST up alone (ALT normal): think muscle first. Ask about the gym in the
     last week; look at CK. Also thyroid, and a possibly haemolysed sample.
  3. Run FIB-4 with ALT, platelets and age.

  What a coach can work on: the same levers as ALT (weight, sugar, alcohol,
  movement, supplement review). For a muscle-only rise, simply re-test after
  a week with no hard training.

  Refer: AST above the lab's upper limit on two tests, AST/ALT above 2 with
  raised enzymes, AST higher than ALT with low platelets, jaundice, dark
  urine, muscle pain with weakness or dark urine on a statin (needs the
  doctor the same day), or FIB-4 of 1.3 or more.

  Corrected 17 Nov 2026: this entry was a stub.

  India context: in every standard LFT; many labs print "SGOT".
