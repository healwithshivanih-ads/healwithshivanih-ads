units: U/L
sample_type: blood
# Typical printed upper limit is about 40 U/L (some labs 32-35 for women).
conventional_high: 40
# FM-optimal ceiling 20 U/L matches the assess engine
# (fmdb/assess/lab_ratios.py: <=20 optimal, 21-25 borderline, >25 high).
# Kim 2004: against AST under 20, AST 20-29 already carried 2.5-3.3 times the
# risk of liver death.
fm_optimal_high: 20
interpretation_low: |
  A low AST is the usual healthy result. Like ALT it needs vitamin B6, so
  very low readings can reflect low B6, and in older adults low muscle mass.
  Not worth acting on alone.
interpretation_high: |
  AST is less liver-specific than ALT. It sits in liver, muscle, heart,
  kidney and red cells, and much of it is inside mitochondria. So a raised
  AST means "some cells are leaking"; the job is to find which.

  Common reasons it rises:
    - Liver fat (NAFLD / MASLD): AST usually rises less than ALT early on
    - Alcohol: AST rises MORE than ALT; AST/ALT above 2 is the classic
      alcohol pattern
    - Muscle: hard or unaccustomed exercise (stays up for about a week),
      muscle injury, statin muscle aches; check CK
    - Medicines and herbal supplements (as for ALT)
    - Thyroid disease (both under- and over-active), coeliac disease
    - Haemolysis: a sample that sat too long or was drawn badly can read high
    - More advanced liver disease: as fibrosis builds, AST climbs relative to
      ALT, which is why AST drives the FIB-4 score

  Bands used here:
    - up to 20 U/L: FM optimal
    - 21-25 U/L: borderline; read with ALT and CK
    - above 25 U/L: elevated in FM terms
    - above the lab's upper limit, or AST higher than ALT with both raised:
      a clinician's question
when_to_order: |
  On every baseline panel, always with ALT (never alone). Add CK when AST is
  up more than ALT and the client exercises hard or takes a statin. Needed
  for FIB-4 together with ALT, platelets and age.
  Re-test 8-12 weeks after a lifestyle change, with no hard exercise for
  3-7 days before the draw.
fasting_required: false
