sources:
- id: bedogni-2006-fatty-liver-index
  location: Abstract
  quote: A FLI < 30 (negative likelihood ratio = 0.2) rules out and a FLI > or = 60 (positive likelihood ratio = 4.3) rules in fatty liver
evidence_tier: strong
notes_for_coach: |
  Worked example: TG 150 mg/dL, GGT 40 U/L, BMI 30, waist 100 cm.
  0.953 x ln 150 = 4.78; 0.139 x 30 = 4.17; 0.718 x ln 40 = 2.65;
  0.053 x 100 = 5.30; sum minus 15.745 = 1.15; FLI = 100 x e^1.15 /
  (1 + e^1.15) = 76. Sixty or more, so it suggests fatty liver.

  Derived in Italian adults; waist cut-offs in South Asians sit lower, so a
  grey-zone FLI deserves more weight here.
