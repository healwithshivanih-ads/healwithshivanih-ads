slug: fatty-liver-index
display_name: Fatty Liver Index (FLI)
full_name: Fatty Liver Index
aliases:
- fli
- fatty liver index
- bedogni fatty liver index
units: score (0-100)
sample_type: blood (calculated) + body measurement
# y = 0.953 ln(TG mg/dL) + 0.139 BMI + 0.718 ln(GGT U/L) + 0.053 waist cm - 15.745
# FLI = 100 x e^y / (1 + e^y)   (Bedogni 2006)
# Computed automatically when TG, GGT, BMI and waist are known.
conventional_high: 60
fm_optimal_high: 30
interpretation_high: |
  FLI is worked out from triglycerides, GGT, BMI and waist. It runs from 0
  to 100 and screens for fatty liver.

    - under 30: fatty liver unlikely
    - 30 to 59: grey zone; cannot rule it in or out
    - 60 or more: suggests fatty liver; an ultrasound is worth discussing
      with the doctor

  Not reliable within about 4 weeks of a paracetamol course or an acute
  illness, or after hard resistance training in the week before the draw
  (weightlifting raises ALT and AST for 7 days or more; GGT is not raised by
  exercise). Ask before reading it.
when_to_order: |
  Nothing to order. Appears when triglycerides and GGT are on a report and
  the client's height, weight and waist are on file.
fasting_required: true
typical_cost_inr: 0
