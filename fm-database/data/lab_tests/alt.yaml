notes_for_coach: |
  How to read it, step by step:

  1. Compare with AST. ALT higher than AST (AST/ALT under 1) with high
     triglycerides, waist or fasting insulin = liver-fat / insulin-resistance
     pattern. AST higher than ALT = think alcohol, muscle, or more advanced
     liver disease.
  2. Compare with ALP and GGT. ALT/AST up more than ALP = liver-cell pattern.
     ALP and GGT up more = bile-flow pattern (see the GGT entry).
  3. Ask about the last week: hard gym session, new herb or supplement,
     paracetamol, alcohol. Each can push ALT up for days.
  4. Run FIB-4 if age, AST, ALT and platelets are all on the report (see the
     fib-4 entry). A raised ALT with FIB-4 under 1.3 is reassuring; 1.3 or
     more needs the doctor.
  5. Do not be reassured by a normal ALT in a client with diabetes, high
     triglycerides and a big waist; fatty liver, even fibrosis, can sit
     behind a normal ALT.

  What a coach can work on (in scope):
    - Weight: about 5% body-weight loss improves liver fat; 10% resolves
      NASH in most people who reach it
    - Cut sugar-sweetened drinks, juices and refined carbs; more fibre
    - Alcohol down or out; re-test in 8-12 weeks
    - Movement: regular walking and resistance work (but not a hard session
      the week before the blood draw)
    - Supplement review: fewer products, no new herbs while ALT is being
      watched; flag any rise after a new product to the doctor
    - Coffee is fine for most and goes with better liver enzymes

  Refer: ALT above the lab's upper limit on two tests, any ALT over about
  3 times the upper limit, ALT with raised bilirubin or jaundice, dark urine,
  pain under the right ribs, a rise after a new medicine or supplement, or
  FIB-4 of 1.3 or more. Coeliac, hepatitis and iron-overload tests are the
  doctor's to order.

  Do NOT tell a client ALT measures their "toxins" or "detox". It is a
  liver-cell stress signal.

  Corrected 17 Nov 2026: this entry was a stub.

  India context: in every standard LFT (Acumen base panel covers it);
  stand-alone ₹150-250. Many Indian labs still print "SGPT".
