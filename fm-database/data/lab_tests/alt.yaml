units: U/L
sample_type: blood
# Typical printed upper limits are 40 (women) to 56 (men) U/L; 40 is used for
# a report that prints one range. Always read the client's own report first.
# The ACG guideline puts a truly healthy ALT at 29-33 men / 19-25 women.
conventional_high: 40
# FM-optimal ceiling 20 U/L matches the assess engine
# (fmdb/assess/lab_ratios.py: <=20 optimal, 21-25 borderline, >25 high) so the
# catalogue and the lab read never disagree. Prati 2002 healthy limit for
# women is 19; Kim 2004 lowest-risk group was under 20.
# No FM-optimal LOW: a low ALT is only a signal in older or frail clients.
fm_optimal_high: 20
interpretation_low: |
  Usually a healthy result. Two exceptions worth knowing:
    - In older adults (65+), a very low ALT goes with frailty, muscle loss and
      lower survival, so read it as a muscle-and-reserve signal, not a
      "perfect liver"
    - ALT needs vitamin B6 to work; low B6 can pull the reading down
  Neither is a reason to act on ALT alone; look at protein intake, muscle mass
  and B6 status.
interpretation_high: |
  ALT lives almost only inside liver cells, so a raised ALT means liver cells
  are under stress and leaking. It measures injury, not liver "function".

  Common reasons it rises (most to least common in coaching practice):
    - Liver fat (NAFLD / MASLD) with insulin resistance, central weight,
      high triglycerides: by far the most common
    - Alcohol (AST usually rises more than ALT here)
    - Medicines and supplements: paracetamol, statins (usually mild), some
      antibiotics and anti-TB drugs, and herbal products (ashwagandha, green
      tea extract, turmeric, multi-herb blends)
    - Hard or unaccustomed exercise in the last week (AST and CK rise too)
    - Coeliac disease, thyroid disease, haemochromatosis
    - Viral hepatitis (B, C, also A and E in India) and autoimmune hepatitis

  Higher ALT inside the "normal" range already predicts diabetes and death
  from liver disease. A normal ALT does NOT rule out fatty liver.

  Bands used here:
    - up to 20 U/L: FM optimal
    - 21-25 U/L: borderline; look at liver fat, sugar and alcohol
    - above 25 U/L: elevated in FM terms, even when the lab prints "normal"
    - above the lab's own upper limit, or rising between tests: a clinician's
      question, not a coaching one
when_to_order: |
  On every baseline panel; it sits inside the standard LFT. Always read it
  with AST, GGT, ALP and bilirubin, and with the platelet count (for FIB-4).
  Especially useful for:
    - Insulin resistance, prediabetes, PCOS, central weight gain
    - Any client who drinks, or who takes several supplements or herbs
    - Before and 4-12 weeks after starting a new herb or supplement stack
    - Clients on statins, anti-TB drugs, methotrexate or other liver-watched
      medicines (the prescriber orders those checks; we read them)
    - Unexplained fatigue with bloating or weight loss (think coeliac)
  Re-test 8-12 weeks after a lifestyle change. Avoid heavy exercise for 3-7
  days before the draw, or the result can read high.
