notes_for_coach: |
  Formula (Dietrich): GD = 8e-6 x (5e-7 + FT4) x (1 + 2e9 x 3e-7) x FT3 /
  (0.026 x FT4), concentrations in mol/L, result in nmol/s. The (1 + K30 x
  TBG) term, about 601, turns free T3 into total T3 at a standard TBG.
  Worked example: FT4 1.2 ng/dL (15.4 pmol/L), FT3 3.0 pg/mL (4.6 pmol/L)
  gives 27.6 — normal. FT4 1.6 ng/dL with FT3 2.0 pg/mL gives 13.8 — low
  conversion. Biotin in the 3 days before the draw distorts both inputs.
