interpretation_low: |
  A modelled estimate of how much T4 the body converts to active T3,
  from free T4 and free T3. Low conversion: look at selenium, zinc, iron,
  inflammation, cortisol, calorie restriction and liver health.
interpretation_high: |
  Conversion running hot: seen early in thyroid under-function
  (compensation), with iodine shortage, or on T3 medication.
when_to_order: |
  Needs FREE T4 and FREE T3. Total T3/T4 (the Aarogyam default) cannot be
  used, so add free hormones when conversion is the question.
