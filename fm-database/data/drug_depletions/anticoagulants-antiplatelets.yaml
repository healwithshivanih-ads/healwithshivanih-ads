summary: |
  Exists so the medication matcher can resolve these drugs and their Indian
  brands, and so a record that says only "blood thinner" is recognised at all.
  Warfarin and acenocoumarol have their own entry, vitamin-k-antagonists.
coach_notes: |
  Grouped for matching, not because the drugs behave alike. When a client's list
  says only "blood thinner", find out which one before keeping anything that
  carries vitamin K or adds to bleeding risk. Never advise changing the drug;
  that belongs to the prescriber.
