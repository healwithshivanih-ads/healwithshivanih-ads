pattern_signals:
- Client reports chronic indecision or difficulty committing
- History of repeatedly abandoning plans or goals mid-way
- Tendency to absorb others' anger without responding
- Periodontal symptoms worsen during high-stress periods
differential_note: 'Periodontal disease has well-established local and systemic causes:
  poor oral hygiene, bacterial biofilm accumulation, smoking, Type 2 diabetes (bidirectionally
  linked), nutritional deficiencies (especially vitamin C — scurvy), medications causing
  gingival hyperplasia (phenytoin, calcium channel blockers, cyclosporine), and genetic
  susceptibility. A dentist or periodontist should assess and manage all active gum
  disease. Vitamin C deficiency causing gum disease is a medical issue, not merely
  a coaching concern.'
notes_for_coach: The vitamin C → gum disease link is well-established and should be
  flagged as a nutritional priority alongside any emotional exploration.
