slug: gum-disease-somatic-map
display_name: Gum Disease / Periodontal Problems
target_kind: symptom
target_slug: gum-inflammation
sensitivity: general
emotional_roots:
- pattern: Inability to stand behind decisions
  note: Gum disease may be associated in some frameworks with a pattern of second-guessing,
    of not standing firm, and of repeatedly revisiting commitments rather than supporting
    them.
- pattern: Eroded foundation
  note: When a person's sense of stability feels gradually worn down — by people,
    circumstances, or persistent stress — this can manifest as a loss of inner groundedness
    that sometimes shows up physically.
- pattern: Swallowed anger
  note: What has been repeatedly suppressed, held back, or never said may be associated
    with inflammatory responses in the oral tissues.
reframe: No one else can make your choices feel solid from the outside. Committing,
  and even getting things wrong, is how a stable life is actually built — through
  action, not through waiting for certainty.
inquiry_question: Where do your foundations feel worn down, and what would shore them
  up?
somatic_practice: voo-vocalization
