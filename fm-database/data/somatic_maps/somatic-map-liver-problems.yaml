slug: somatic-map-liver-problems
display_name: Liver Problems — Suppressed Anger and the Burden of Toxins
target_kind: topic
target_slug: liver-detoxification
sensitivity: coach_only
differential_note: Liver disease has numerous physiological causes — viral hepatitis,
  alcohol, NAFLD/MASLD, autoimmune hepatitis, haemochromatosis, Wilson's disease,
  medication-induced liver injury, and biliary disease — all of which must be investigated
  and managed medically. Elevated liver enzymes or jaundice require urgent referral.
  Emotional framing must never be used to delay or replace medical evaluation.
emotional_roots:
- pattern: Chronic unprocessed anger
  note: Across many traditional medicine systems, the liver is associated with the
    processing of anger. When anger becomes chronic — sustained resentment, suppressed
    rage — it may be accompanied by states of physiological stress (cortisol, inflammatory
    mediators) that place burden on the liver's detoxification capacity. This is an
    observed cultural and somatic association, not a demonstrated causal mechanism.
- pattern: Feeling stuck and unable to move forward
  note: The liver is understood in some frameworks to govern decisiveness and the
    ability to process and move forward from life experiences. Liver dysfunction is
    sometimes associated with patterns of feeling blocked, overwhelmed, or unable
    to filter out what needs to go.
reframe: Anger that was justified deserved to be heard — by you, at the very least.
  Allowing it to move through you rather than staying compressed in your body is an
  act of self-respect, not weakness.
inquiry_question: Is there an old anger that still comes back to you? What would help
  it finally move?
somatic_practice: movement-discharge
also_consider:
  supplements:
  - milk-thistle
  - dandelion-root
  practical:
  - Reduce alcohol and processed foods
  - Dandelion root supports liver detox pathways
  home_remedies: []
  cooking_adjustments: []
pattern_signals:
- Client describes long-standing suppressed rage or years of swallowed grievance
- History of NAFLD or elevated liver enzymes in the context of obesity and metabolic
  syndrome
- Described emotional pattern of chronic bitterness or inability to let go
notes_for_coach: This map is coach_only. Liver disease is a serious medical condition.
  Emotional associations must never be presented to a client as a cause of their liver
  condition. This framing is for the coach's reflective use only, to inform the quality
  of supportive conversation after medical treatment is in place.
coach_only_note: Never surface the emotional framing for liver problems to a client
  without explicit medical clearance and established rapport. The risk of the client
  feeling blamed for a serious illness is high. Use only as a reflective backdrop
  for conversations the client themselves initiates around anger and stuck energy.
evidence_tier: fm_specific_thin
