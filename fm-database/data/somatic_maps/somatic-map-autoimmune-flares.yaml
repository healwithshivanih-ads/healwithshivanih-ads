differential_note: Autoimmune disease requires specialist diagnosis and management.
  Flares can be organ-threatening — lupus nephritis, vasculitis and serositis are
  medical emergencies. Never let this framing delay rheumatology input or interrupt
  immunosuppression. Check vitamin D and screen for infection, which commonly triggers
  flares.
coach_only_note: NEVER auto-surface. Telling someone their immune system attacks them
  because they abandoned themselves is among the most harmful messages in this book.
  Session material only, and only where the client raises it first.
notes_for_coach: Dhanishta (cl-004), Niti (cl-014), Shruti (cl-013), Archana (cl-007)
  and Nazneen (cl-022) all have Hashimoto's. This map must stay coach-only for all
  of them.
