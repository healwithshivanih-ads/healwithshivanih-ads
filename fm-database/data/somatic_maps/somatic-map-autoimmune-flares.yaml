slug: somatic-map-autoimmune-flares
display_name: Autoimmune Flares — The Fight Turned Inward
target_kind: topic
target_slug: autoimmune
sensitivity: coach_only
emotional_roots:
- pattern: Anger with nowhere outward to go
  note: Absorbing every injustice and staying agreeable at your own expense; the fight
    that should go out finds the only target left.
- pattern: Self-abandonment
  note: Not defending your own boundaries until there is little left that feels worth
    protecting.
- pattern: After a long override
  note: Autoimmune conditions frequently follow prolonged periods of having to override
    your own needs to get through.
reframe: You get to decide that your own care is not conditional, however you were
  taught otherwise.
inquiry_question: Where have you been treating your own needs as the thing to sacrifice
  first?
somatic_practice: knee-to-chest
