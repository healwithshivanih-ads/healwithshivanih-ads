slug: somatic-map-varicose-veins
display_name: Varicose Veins — Standing Still in a Draining Situation
target_kind: topic
target_slug: varicose-veins
sensitivity: general
emotional_roots:
- pattern: Stuck in circumstances that deplete
  note: The picture is of remaining in place in something that drains — work that
    is disliked, obligations without end, relationships that do not replenish.
- pattern: Forward movement blocked
  note: Blood pools where movement has stopped; the metaphor is often uncomfortably
    close to the person's actual situation.
- pattern: Carrying more than a fair share while standing still
  note: Load without progress.
reframe: It is worth asking honestly whether what you are getting from this situation
  is worth what it is taking.
inquiry_question: Where are you standing still in something that is draining you?
somatic_practice: legs-up-the-wall
also_consider:
  supplements: []
  home_remedies: []
  cooking_adjustments: []
  practical:
  - Compression stockings genuinely support venous return
  - Elevate the legs daily
  - Movement matters most — the calf muscle is the pump; avoid long unbroken standing
    or sitting
pattern_signals: []
differential_note: Varicose veins are a structural venous problem — valve incompetence,
  family history, prolonged standing, pregnancy and raised BMI. Exclude deep venous
  insufficiency and DVT. Skin changes, ulceration, bleeding or a hot painful calf
  require vascular assessment rather than lifestyle work.
coach_only_note: ''
notes_for_coach: Horse chestnut extract has reasonable evidence for venous insufficiency
  but is not yet in the catalogue — add it before recommending.
sources:
