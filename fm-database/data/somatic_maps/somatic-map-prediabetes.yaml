notes_for_coach: 'Drafted 2026-08-13 by Claude on Shivani''s instruction, adapted from
  somatic-map-diabetes for the PRE-diagnosis stage — wording is hers to change. Authored
  for Geetika (cl-006), whose condition reads "Prediabetes (HbA1c 6.20%)": that string
  resolved to nothing before this map existed, because the `prediabetes` topic owns
  its own canonical slug and cannot be aliased into type-2-diabetes, so the diabetes
  map never reached the very clients whose blood sugar is still most reversible. The
  difference in register from somatic-map-diabetes is deliberate: agency is still
  clearly present here, so the map asks rather than consoles. Lead with the metabolic
  work — the sweetness framing is a session conversation, not a plan line. The source
  location below is inherited from somatic-map-diabetes (same blood-sugar territory);
  it was not independently derived, and no quote is claimed.'
