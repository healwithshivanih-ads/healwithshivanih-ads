display_name: Menstrual Pain & PMS
target_kind: topic
target_slug: premenstrual-syndrome
sensitivity: sensitive
emotional_roots:
- pattern: Suppressed anger blocking flow
  note: In traditional Chinese medicine, the liver is considered to govern menstrual
    flow; when frustration and anger are held unexpressed, flow is said to become
    obstructed or painful. Some practitioners observe that women with severe cramping
    are carrying emotion they haven't felt safe expressing — this is an association,
    not a proven mechanism.
- pattern: Shame or disgust about the body
  note: Early messages that menstruation is unclean, something to hide rather than
    understand, may over time be associated with increased pain and distress around
    the cycle.
- pattern: Cycle amplifying suppressed emotion
  note: The premenstrual phase may surface emotions that have been pushed down throughout
    the month. What intensifies before a period can serve as a signal about what has
    been unaddressed.
- pattern: Difficulty with surrender and release
  note: The menstrual cycle is biologically a process of building and releasing. Pain
    may be more frequent for people who find it hard to let go in any domain of life.
reframe: Your cycle is not punishing you — it is reflecting you. What surfaces before
  your period is asking for attention, not suppression. The pain and the emotion are
  messengers worth listening to throughout the whole month.
inquiry_question: What does the pattern of your emotions across your cycle reveal
  about what you have been carrying or pushing away?
