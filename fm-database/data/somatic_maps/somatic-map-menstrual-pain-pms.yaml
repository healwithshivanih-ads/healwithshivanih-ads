pattern_signals:
- Client reports emotions dramatically worsen in the week before menstruation
- Describes severe cramping alongside difficulty expressing anger or frustration
- History of early messages about menstruation being dirty or shameful
- Reports difficulty 'letting go' in multiple life contexts
differential_note: 'Dysmenorrhea and PMS have well-characterised physiological causes
  that must be assessed first: prostaglandin excess, endometriosis, uterine fibroids,
  adenomyosis, polycystic ovary syndrome, pelvic inflammatory disease, cervical stenosis,
  thyroid dysfunction, and nutritional deficiencies (magnesium, B6, omega-3s). Premenstrual
  dysphoric disorder (PMDD) requires clinical diagnosis and may need psychiatric or
  pharmacological management. Emotional associations are secondary considerations
  only.'
notes_for_coach: Source is a somatic-health book (moderate quality). The TCM liver-menstrual
  flow link is traditional, not peer-reviewed. Magnesium and omega-3 for dysmenorrhea
  have reasonable evidence. Seed cycling has very limited peer-reviewed evidence.
