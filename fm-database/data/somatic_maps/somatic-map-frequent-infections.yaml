slug: somatic-map-frequent-infections
display_name: Frequent Infections — Volume, Not One Big Thing
target_kind: symptom
target_slug: frequent-infections
sensitivity: general
emotional_roots:
- pattern: Too much at once
  note: Overwhelmed less by a single event than by the sheer quantity of everything.
- pattern: Grief
  note: In Chinese medicine the lungs govern the immune barrier and also hold grief;
    the two are described together for a reason.
- pattern: Small hurts accumulating
  note: Nothing individually large enough to address, and collectively more than the
    system can carry.
reframe: You do not need to get ill to deserve a day off. Saying no before your body
  says it for you is the cheaper option.
inquiry_question: What would you have to decline in order to stop getting sick?
somatic_practice: supine-twist
