  - elderberry
  home_remedies: []
  cooking_adjustments: []
  practical:
  - Sleep is the single most powerful immune support
  - Fermented foods support immunity via the gut
pattern_signals: []
differential_note: Check HbA1c (undiagnosed diabetes commonly presents this way),
  full blood count, and consider HIV testing where relevant. Refer for immunology
  assessment where infections are unusually severe, need repeated antibiotics, involve
  unusual organisms, or come with weight loss and night sweats.
