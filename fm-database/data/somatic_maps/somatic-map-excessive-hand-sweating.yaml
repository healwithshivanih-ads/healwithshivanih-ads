sources:
- id: klein-body-remembers
  location: 41. Excessive Sweating (Hands) — Emotional Root
  quote: Your hands sweat when you can't surrender to uncertainty—gripping the outcome,
    bracing for what might go wrong, refusing to relax into not knowing. Often shows
    up as social anxiety. Fear of being watched, judged, or required to perform.
