sources:
- id: klein-body-remembers
  location: 85. Low Milk Supply — EMOTIONAL ROOT
  quote: Milk production requires oxytocin. Oxytocin requires safety. Stress, anxiety,
    and fear suppress it. When your nervous system reads the environment as threatening,
    it diverts resources away from nurturing functions.
