slug: somatic-map-pcos-ovarian-cysts
display_name: PCOS & Ovarian Cysts
target_kind: topic
target_slug: pcos
sensitivity: sensitive
emotional_roots:
- pattern: Blocked creative and feminine expression
  note: Some somatic traditions associate PCOS with a sense of creative energy having
    no outlet — feminine potential that feels blocked, suppressed, or unsafe to express.
    This is a metaphorical and observational framing, not a causal claim.
- pattern: Pressure to suppress femininity
  note: Somatic practitioners sometimes observe a pattern in women with PCOS of having
    felt pressure to be 'more masculine' to succeed, or having received mixed messages
    about the value of female identity — leading to a disconnection from cyclical,
    intuitive ways of being.
- pattern: Unprocessed reproductive or sexual pain
  note: Old hurts related to sexuality, reproductive shame, or negative body messaging
    may — in some frameworks — be associated with ongoing physical holding in the
    ovarian region. This is purely associative.
reframe: You are allowed to take up space — with your ideas, your creativity, your
  desires, your whole self. Your feminine nature does not need to justify itself or
  compete with any other way of being.
inquiry_question: What aspects of your creative or feminine self have you been keeping
  small, and what would it feel like to let them take up more space?
somatic_practice: gentle-sway
also_consider:
  supplements:
  - spearmint-tea
  - inositol
  - myo-inositol
  practical:
  - Low-glycaemic eating to support blood sugar balance
  - Strength training to improve insulin sensitivity
  - Prioritise sleep quality — poor sleep worsens androgen dysregulation
  - Consider dairy and refined sugar elimination trial for 6-8 weeks
  - Cycle charting even with irregular periods to rebuild body connection
  home_remedies: []
  cooking_adjustments: []
pattern_signals:
- Client describes feeling she had to 'be like a man' to succeed professionally
- Reports creative dreams put on hold indefinitely
- Expresses ambivalence or shame about femininity
- Describes disconnection from her cycle and body rhythms
differential_note: 'PCOS is a metabolic and endocrine condition with clearly defined
  diagnostic criteria (Rotterdam criteria) that must be established clinically. Causes
  and contributors to investigate include: insulin resistance (present in approximately
  70% of PCOS), androgen excess, hypothalamic-pituitary dysfunction, thyroid disorders,
  congenital adrenal hyperplasia, hyperprolactinaemia, and post-pill hormonal disruption.
  Ovarian cysts may also represent simple functional cysts, dermoid cysts, endometriomas,
  or other pathology requiring ultrasound assessment. Emotional framing should only
  be offered after thorough clinical workup and should never replace medical management.'
notes_for_coach: Spearmint tea has small RCT evidence for androgen reduction in PCOS.
  Inositol (particularly myo-inositol and d-chiro-inositol combination) has reasonable
  evidence for insulin sensitivity and ovulation restoration in PCOS. Blood sugar
  and lifestyle interventions are well-evidenced. The emotional/creative associations
  are observational and culturally specific.
