slug: somatic-map-hair-loss
display_name: Hair Loss — Survival Mode
target_kind: topic
target_slug: hair-loss
sensitivity: general
emotional_roots:
- pattern: Gripping too hard
  note: Holding everything under control because trusting it feels impossible — and
    burning through reserves doing it.
- pattern: Stuck in survival
  note: Under sustained perceived threat the body shuts down what is not immediately
    essential. Hair goes early.
- pattern: Loss of identity
  note: Hair is bound up with self-image; losing it can mirror a loss already underway.
reframe: Surviving and living can look the same from outside and feel nothing alike
  from inside. You are allowed to come back to living.
inquiry_question: When did getting through the day replace actually living it?
somatic_practice: supported-childs-pose-receiving
also_consider:
  supplements:
  - iron-bisglycinate
  - ashwagandha
  - saw-palmetto
  home_remedies: []
  cooking_adjustments: []
  practical:
  - Protein intake and absorption matter — hair is keratin
  - Rosemary oil to the scalp has trial evidence comparable to minoxidil
  - He Shou Wu and nettle root are traditional options not yet in the catalogue
pattern_signals: []
differential_note: 'Hair loss has specific, testable causes: iron and ferritin status,
  thyroid disease, telogen effluvium after illness, childbirth or crash dieting, androgenetic
  pattern loss, PCOS, and scarring alopecias which need urgent dermatology to prevent
  permanent loss. Check ferritin, TSH and vitamin D before any other framing.'
coach_only_note: ''
notes_for_coach: Hariharan (cl-005) has dry skin and scalp; Dhanishta has low ferritin.
  Check iron before raising anything here.
