steps:
- Heat the oil in a deep pan. Add the mustard and cumin, then the green chilli, ginger
  and curry leaves.
- Add the sprouts and the dry spices and stir for a minute. Add salt and 1 cup of
  water.
- Cook until the moong is done.
- Lower the heat, stir in the beaten curd and simmer gently for 2–3 minutes.
- Top with coriander and serve hot with rice.
