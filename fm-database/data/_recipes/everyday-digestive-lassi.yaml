translations:
  hi:
    name: रोज़ की पाचक लस्सी
    steps:
    - कमरे के तापमान वाला पानी 16-औंस के काँच के जार में डालें।
    - दही, हल्दी और अदरक डालें।
    - इमर्शन हैंड ब्लेंडर से 1 मिनट तेज़ ब्लेंड करें जब तक मिश्रण झागदार हो जाए।
    - तरल को थोड़ी देर बैठने दें, फिर ऊपर जमे दूध-ठोस झाग को चम्मच से हटाकर फेंक दें।
    - दो 8-औंस गिलासों में डालकर परोसें — दोपहर के भोजन के बाद सबसे फायदेमंद।
