translations:
  hi:
    name: कंगनी बाजरे की रोटी
    steps:
    - कंगनी बाजरे के आटे में नमक मिलाएँ। थोड़ा-थोड़ा गुनगुना पानी डालते हुए नरम, लचीला
      आटा गूँधें। 10 मिनट रखें।
    - लोइयाँ बनाएँ। हर एक को आटा लगी सतह पर थपथपाकर या बेलकर गोल रोटी बनाएँ (ग्लूटेन-रहित
      आटे दो पार्चमेंट शीट के बीच सबसे अच्छे बिलते हैं)।
    - गरम तवे पर हर तरफ़ 1-2 मिनट पकाएँ जब तक भूरे धब्बे आ जाएँ और यह फूल जाए।
    - हल्का घी लगाएँ और गरम परोसें।
