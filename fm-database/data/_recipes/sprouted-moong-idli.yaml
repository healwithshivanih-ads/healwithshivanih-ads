steps:
- Grind the sprouts to a smooth paste with a little water.
- Mix in the curd, carrot, capsicum, coriander, green chillies and ginger paste, adding
  water for a thick pouring batter.
- Heat the oil, splutter the mustard seeds with the curry leaves and hing, and pour
  this over the batter.
- Grease the idli moulds. Add the salt and fruit salt to the batter and whisk briskly.
- Pour into the moulds at once and steam for 10–12 minutes. Unmould once cool and
  serve with coconut chutney.
