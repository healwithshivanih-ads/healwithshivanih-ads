steps:
- Boil the soaked moong in fresh water until just tender but still holding its shape
  — about 20 minutes. Drain.
- Splutter the mustard seeds in the coconut oil, add the curry leaves, onion, ginger
  and green chilli.
- Add the drained moong with the turmeric and salt and toss well.
- Cook uncovered for 5 minutes so any remaining water goes and the sabzi finishes
  dry.
- Fold in the coconut and coriander off the heat.
