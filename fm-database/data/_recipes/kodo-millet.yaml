steps:
- Rinse kodo millet under running water until the water runs clear.
- Heat ghee in a medium saucepan over medium heat.
- Add the rinsed millet and dry-roast for 2–3 minutes, stirring gently.
- Pour in 225 ml water and bring to a boil.
- Reduce heat to low, cover with a lid, and simmer for 15–18 minutes until all water
  is absorbed and millet is tender.
- Fluff with a fork and add salt to taste.
