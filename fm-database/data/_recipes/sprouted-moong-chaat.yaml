steps:
- Steam the sprouts 5 minutes and cool them completely.
- Toss with the potato, onion, tomato and pomegranate.
- Add the green chutney, chaat masala, amchur, roasted cumin, lemon juice and rock
  salt and mix well — a chaat should be assertively sour and salty, unlike the plain
  salad.
- Fold in the peanuts and coriander at the very end so they stay crunchy.
- Serve immediately.
