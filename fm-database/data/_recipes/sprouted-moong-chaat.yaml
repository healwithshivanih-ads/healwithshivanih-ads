translations:
  hi:
    name: अंकुरित मूँग चाट
    steps:
    - स्प्राउट्स को 5 मिनट भाप में पकाएँ और पूरी तरह ठंडा कर लें।
    - आलू, प्याज़, टमाटर और अनार के साथ मिलाएँ।
    - हरी चटनी, चाट मसाला, अमचूर, भुना जीरा, नींबू का रस और सेंधा नमक डालकर अच्छे
      से मिलाएँ — चाट सादी सलाद के मुक़ाबले ज़ोरदार खट्टी और नमकीन होनी चाहिए।
    - मूँगफली और धनिया बिल्कुल आख़िर में मिलाएँ ताकि कुरकुरे रहें।
    - तुरंत परोसें।
