steps:
- Cook the little millet in the water until very soft — softer than you would for
  a pulao. Mash it lightly while still warm.
- Let it cool to just-warm before adding the curd, or the curd will split. Stir in
  the milk to loosen.
- Fold through the carrot, ginger, chilli, coriander and salt.
- Heat the coconut oil, splutter the mustard seeds, add the urad dal and curry leaves,
  and pour over.
- Serve at room temperature or lightly chilled.
servings: '2'
prep_time_min: 10
