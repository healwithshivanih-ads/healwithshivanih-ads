one_line: A cooling little-millet curd rice, lightly mashed and tempered with mustard,
  ginger and curry leaf.
headnote: Letting the millet cool before the curd goes in is what keeps the dish creamy
  rather than split — and mashing it slightly gives the curd something to cling to,
  which millet grains otherwise resist.
