  unit: tsp
steps:
- Beat the eggs with the milk, salt and pepper until just combined — don't over-whisk
  or they turn rubbery.
- Melt the ghee in a heavy pan on LOW heat. Low is the whole trick with scrambled
  eggs.
- Pour in the eggs and leave them for 20 seconds, then push them slowly from the edge
  to the centre with a spatula.
- Take the pan off the heat while they still look slightly underdone — they carry
  on cooking in their own heat.
- Serve immediately; scrambled eggs go tough if they sit.
