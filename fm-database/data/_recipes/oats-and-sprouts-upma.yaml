steps:
- Heat the oil in a wok. Add the mustard seeds, green chillies, curry leaves, onion
  and tomato and cook for a minute.
- Add the vegetables and cook another minute.
- Add the sprouts and 2 cups of water and bring to a boil. Add the salt and coriander
  and cook for a minute.
- Stir in the oats, cover and cook on low heat for a minute.
- Finish with the lemon juice and serve hot.
