steps:
- Soak the rice separately, and the urad dal with the methi seeds, for 5–6 hours.
- Grind the dal first to a light fluffy paste, then the rice to a slightly grainy
- The batter is ready when it has risen and smells pleasantly sour. Thin it with water
  to a pouring consistency.
- Heat a tawa until a drop of water skitters. Pour a ladle at the centre and spread
  outward in a spiral.
- Drizzle oil at the edges and cook until the base is golden and lifts away cleanly.
  Fold and serve.
- This batter makes about 12 dosas — roughly 5 servings. Refrigerate what you don't
  cook and use it within 3 days. one. Mix, add salt, and ferment overnight.
