steps:
- Heat the ghee and fry the onion until it turns properly golden — bhurji lives or
  dies on this step, so give it 5–6 minutes.
- Add the ginger and green chilli, then the tomato. Cook until the tomato collapses
  and the oil separates at the edges.
- Stir in the turmeric, chilli powder and salt.
- Pour in the eggs and stir continuously on medium heat, breaking up the curds, until
  dry and crumbly.
- Finish with a big handful of coriander. Eat with roti or on its own.
