steps:
- 'Cook the prawns first: sear them in the hot oil for 2 minutes, then lift them out
  before they overcook.'
- In the same pan, toss the garlic and ginger for 20 seconds.
- Add the beans and stir-fry 2 minutes, then the capsicum for another minute.
- Return the prawns with the tamari, pepper and salt, toss once.
- Throw in the spring onion and take the pan off the heat immediately.
