steps:
- Dry-roast the millet for 3–4 minutes until it smells nutty. This is what stops upma
  turning to mush.
- In another pan, splutter the mustard seeds in the ghee, add the urad dal and curry
  leaves.
- Add the onion, ginger and green chilli, then the vegetables, and cook 3 minutes.
- Pour in the water with the salt and bring to a boil. Stir in the roasted millet.
- Cover and cook on low 12–15 minutes until the water is absorbed. Rest 5 minutes,
  then fluff with a fork and finish with coriander and lemon.
