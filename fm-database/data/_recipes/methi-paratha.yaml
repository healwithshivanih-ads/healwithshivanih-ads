translations:
  hi:
    name: मेथी पराठा
    steps:
    - मेथी के पत्तों को धोकर बारीक काट लें और थोड़ा नमक बुरककर नरम कर लें।
    - आटे में मेथी, हल्दी, लाल मिर्च पाउडर, अजवायन, तेल और नमक मिलाएँ।
    - पानी थोड़ा-थोड़ा डालकर नरम आटा गूँधें, फिर 15 मिनट रखें।
    - 6 लोइयाँ बनाएँ और हर एक को आटा लगाकर मध्यम गोल बेल लें।
    - गरम तवे पर सेंकें, पलटें, और दोनों तरफ़ घी लगाकर सुनहरे धब्बे आने तक सेंकें।
    - दही या अचार के साथ गरम परोसें।
