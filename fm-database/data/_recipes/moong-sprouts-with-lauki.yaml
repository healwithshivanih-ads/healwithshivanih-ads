steps:
- Heat the ghee and add the cumin. When it darkens, add the onion and cook until pink.
- Add the tomato, garlic, salt, turmeric, chilli and coriander powder with a quarter
  cup of water. Cover and cook 1 minute.
- Add the sprouts and half a cup of water and cook covered on low for 2–3 minutes,
  until the sprouts are tender.
- Add the lauki with another half cup of water and cook until soft. Finish with the
  lemon juice.
