translations:
  hi:
    name: रतालू और ओट मफिन
    steps:
    - ओवन को 400°F (200°C) पर पहले से गरम करें। 6-कप मफिन ट्रे में पेपर लाइनर लगाएँ या नारियल तेल लगाएँ।
    - एक छोटे कटोरे में अंडे को फूला होने तक फेंटें, फिर दूध, मसला शकरकंद और मेपल सिरप या मोलैसेस मिलाएँ।
    - आधा कप ओट्स को एक सूखे ब्लेंडर या फूड प्रोसेसर में आटा बनने तक पीसें, करीब 30–60 सेकंड।
    - एक बड़े बर्तन में पिसे ओट्स को रोल्ड ओट्स, बेकिंग सोडा, बेकिंग पाउडर, दालचीनी, सोंठ, जायफल और नमक के साथ मिलाएँ।
    - गीली सामग्री को सूखी सामग्री में डालें और बस मिलने तक चलाएँ — ज़्यादा न मिलाएँ।
    - चाहें तो वैकल्पिक चीज़ें (पेकन और/या खजूर) धीरे से मिलाएँ, फिर घोल को 6 मफिन कप में बराबर बाँटें।
    - 30 मिनट बेक करें, या जब तक ऊपर सुनहरा हो जाए और बीच में डाली सींक साफ निकले।
    - हर मफिन पर 1–2 छोटा चम्मच घी, नारियल तेल या नट बटर लगाकर परोसें।
