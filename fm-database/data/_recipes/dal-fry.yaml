one_line: Dal cooked into a fried onion-tomato masala rather than tempered at the
  end — thicker and richer.
headnote: A simple vegetable is one of the most digestible protein sources — cooked
  soft, spiced gently with cumin and ginger, and kept free of heavy onion-tomato gravy.
