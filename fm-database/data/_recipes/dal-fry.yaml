steps:
- Pressure-cook the dal with turmeric and water until soft. Don't whisk it as smooth
  as for tadka — dal fry keeps some texture.
- In a separate pan, crackle the cumin in the ghee and brown the onion properly.
- Add the ginger-garlic paste, then the tomato, coriander powder and chilli powder.
- Cook until the masala thickens and the oil separates out.
- Tip the cooked dal into the masala (not the other way round), add salt, and simmer
  5–7 minutes so they marry. Finish with garam masala and coriander.
