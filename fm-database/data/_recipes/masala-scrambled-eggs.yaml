steps:
- Heat the ghee and soften the onion and green chilli for 2–3 minutes until the raw
  smell goes.
- Stir in the turmeric and let it bloom for 10 seconds.
- Pour in the beaten eggs with the salt, drop the heat low, and push them gently until
  just set.
- Fold through the coriander off the heat and serve hot.
