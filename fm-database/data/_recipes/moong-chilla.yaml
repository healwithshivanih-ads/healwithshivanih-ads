steps:
- Drain the soaked dal and grind it with the ginger, green chilli and just enough
  water to a smooth, pourable batter.
- Stir in the onion, coriander, cumin powder and salt. Don't rest it long — moong
  batter thickens quickly.
- Heat a tawa on medium. Pour a ladleful and spread gently into a round.
- Drizzle ghee at the edges and cook 2–3 minutes until the base is golden and lifts
  freely.
- Flip, cook a minute more, and serve hot with chutney.
