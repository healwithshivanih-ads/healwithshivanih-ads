notes_for_coach: 'TIMING IS CLINICAL, NOT PREFERENCE: ash gourd is a diuretic, so
  this juice must be taken BEFORE 3pm. A client drinking it at 6-6.30pm was waking
  repeatedly to urinate and losing sleep; she confirmed the link herself by skipping
  it for one night (cl-022, 23/7/2026). Recipe is the coach''s own, as given to that
  client. Makes 4 glasses — one glass is a serving. Pick ONE of carrot / cucumber
  / beetroot rather than all three. Skip the leafy greens in monsoon. Amla is the
  vitamin-C anchor; do not drop it.'
