main_ingredients:
- Ash gourd (petha / safed kaddu), peeled and cubed — 1.5 cups
- Tomatoes — 2 medium
- Carrot, cucumber or beetroot — 1 medium (pick one)
- Coriander, basil, parsley or baby spinach leaves — a handful
- Celery, stick part only — less than a handful
- Ginger — 1 inch
- Amla (Indian gooseberry) — 1 whole
- Lime juice — 2 tbsp
- Roasted jeera (cumin) powder — a pinch
