steps:
- Wash everything well. Peel the ash gourd and cut into rough cubes. Quarter the tomatoes
  and the carrot (or cucumber or beetroot — just one of the three).
- Pick the leaves off the coriander — use the leaves only, not the stalks. In the
  monsoon months, leave the leafy greens out altogether.
- Add everything to a blender with just enough water to get the blades moving, then
  add more water as it blends.
- Strain once through a sieve, pressing everything down firmly. There should be very
  little pulp left to throw away.
- Stir in the lime juice and a pinch of roasted jeera powder. Serve fresh.
servings: 4
one_line: A light, hydrating everyday juice built on ash gourd, with amla for vitamin
  C and jeera to keep it easy on the stomach.
