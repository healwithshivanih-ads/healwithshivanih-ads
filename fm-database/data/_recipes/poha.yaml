steps:
- Rinse the poha in a colander under running water for a few seconds, then leave it
  to drain and swell. Never soak it standing in water.
- Splutter the mustard seeds in the oil and add the curry leaves.
- Add the onion and green chilli and cook until soft.
- Stir in the turmeric and salt, then fold in the drained poha gently with a light
  hand.
- Cover on low for 2 minutes, then finish with lemon juice and coriander.
