translations:
  hi:
    name: पनीर काठी रोल
    steps:
    - पनीर की स्ट्रिप्स को दही, तंदूरी मसाला, लाल मिर्च पाउडर और नमक के साथ मिलाएँ।
    - पैन में तेल गरम करें और प्याज़ व शिमला मिर्च को एक मिनट भूनें, फिर पनीर डालकर
      3 से 4 मिनट हल्का चारित होने तक पकाएँ।
    - रोटियाँ गरम करें, हरी चटनी लगाएँ और एक किनारे पर पनीर का भरावन रखें।
    - कसकर रोल करें, दो हिस्सों में काटें और गरम परोसें।
