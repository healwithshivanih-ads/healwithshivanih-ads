one_line: Sprouted methi seeds cooked soft in an onion-tomato masala, rounded off
  with a little curd.
headnote: Sprouting takes much of the bitterness out of methi seeds, and the onion
  and curd mellow the rest. A small portion alongside dal and roti is how it is eaten.
