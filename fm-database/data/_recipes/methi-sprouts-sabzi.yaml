steps:
- Warm the sesame oil and add the cumin, then the onion. Cook until lightly coloured.
- Add the tomato, garlic, turmeric, chilli, coriander powder and salt and stir well.
- Add 4 tablespoons of water and the methi sprouts. Cover and cook until the sprouts
  are really tender.
- Stir in the curd, take off the heat and top with the coriander.
