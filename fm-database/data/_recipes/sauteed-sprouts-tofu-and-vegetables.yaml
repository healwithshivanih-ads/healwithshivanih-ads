steps:
- Warm the ghee in a heavy pan on low heat. Add the cumin, onion and garlic and cook
  for a minute.
- Add the French beans and carrot and stir-fry.
- Add the broccoli and capsicum, then the tofu, salt and chilli flakes, and toss well.
- Add the sprouts last, toss and serve straight away.
