steps:
- Pressure-cook the dal with the turmeric, salt and water until completely soft, then
  whisk it smooth.
- Heat the ghee in a small tempering pan until properly hot.
- Add the cumin, then the garlic, red chillies and hing. Take it off the moment the
  garlic turns golden — a second longer and it's bitter.
- Stir in the chilli powder off the heat so it doesn't burn.
- Pour the whole sizzling tempering over the dal at the table and stir it in. Finish
  with coriander.
