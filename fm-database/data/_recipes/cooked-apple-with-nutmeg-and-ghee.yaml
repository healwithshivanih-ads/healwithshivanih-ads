steps:
- Heat ghee in a small pan over low heat.
- Add apple pieces and water.
- Cover and cook for 4-5 min, stirring occasionally, until apple is soft and begins
  to break down.
- Sprinkle nutmeg powder and stir gently.
- Cook uncovered for 1 more minute if needed to reduce any excess liquid.
- Serve warm.
