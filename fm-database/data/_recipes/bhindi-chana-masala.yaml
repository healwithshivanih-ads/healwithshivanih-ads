steps:
- Dry-roast the coriander seeds, chana dal, urad dal and red chillies and let them
  cool.
- Grind them with the coconut and tamarind to a paste.
- Heat the coconut oil on low and cook the onion until light pink.
- Add the bhindi, chana sprouts and salt. Cover and cook on low for 5 minutes, stirring
  now and then.
- When the bhindi is cooked, mix in the masala paste and cook on low for 7–10 minutes.
  Serve with rice or roti.
