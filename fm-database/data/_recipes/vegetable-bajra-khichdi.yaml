translations:
  hi:
    name: सब्ज़ी बाजरा खिचड़ी
    steps:
    - बाजरे को खूब पानी में 4-6 घंटे (या रातभर) भिगोएँ, फिर निथार लें; मूँग दाल धोकर दोनों अलग रखें।
    - प्रेशर कुकर में घी गरम करें, जीरा और हींग डालें, और जीरे को चटकने दें।
    - कद्दूकस अदरक और हल्दी मिलाएँ, फिर कटी सब्ज़ियाँ डालकर एक मिनट भूनें।
    - निथारा बाजरा, मूँग दाल, नमक और पानी डालें और अच्छी तरह चलाएँ।
    - 6-7 सीटी प्रेशर-कुक करें (या ढककर 40-45 मिनट उबालें) जब तक बाजरा बहुत नरम और खिचड़ी जैसी हो जाए।
    - कुकर खोलकर हल्के से मसलें, गरम पानी से पतला करके नरम, चम्मच से खाने लायक बनाएँ।
    - ताज़ा धनिया से सजाएँ और चाहें तो थोड़ा अतिरिक्त घी डालकर गरम परोसें।
