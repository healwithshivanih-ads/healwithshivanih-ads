steps:
- Pat the tofu properly dry and leave it under a weighted plate for 10 minutes if
  you have time — wet tofu steams instead of browning.
- Get the pan hot before the oil goes in. Sear the tofu in a single layer, undisturbed,
  until one side is golden.
- Turn the cubes, add the garlic and the white parts of the spring onion, and toss
  for a minute.
- Splash in the tamari and pepper, throw in the green spring onion tops, and take
  it off the heat.
