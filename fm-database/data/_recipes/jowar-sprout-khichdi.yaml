steps:
- Heat the oil in a pressure cooker and cook the chillies, curry leaves, garlic and
  ginger.
- Add the onion, tomato and vegetables.
- Add the dal and jowar sprouts, then the dry spices and salt.
- Pour in 2 cups of water and stir well.
- Pressure-cook for 4–5 whistles. Serve with raita or curd.
