translations:
  hi:
    name: भुनी शिमला मिर्च और टमाटर सूप
    steps:
    - शिमला मिर्च को आँच पर घुमाते हुए तब तक भूनें जब तक छिलका चारों तरफ काला पड़ जाए। एक कटोरे में रखकर ठंडा करें, फिर छीलें, बीज निकालें और चार टुकड़े करें।
    - टमाटरों को तेज पत्ता और लहसुन के साथ करीब 3 कप पानी में तब तक उबालें जब तक टमाटर नरम हो जाएँ।
    - तेज पत्ते और ढीले हुए टमाटर के छिलके निकाल दें, भुनी शिमला मिर्च डालें और भगोने में ही चिकना पीस लें।
    - वापस आँच पर रखें, वॉर्सेस्टरशायर सॉस और नमक मिलाएँ, और करीब 5 मिनट उबालें। गरम परोसें, चाहें तो तीखी सॉस के साथ।
