steps:
- Grind the lobia sprouts with a quarter cup of water to a smooth paste.
- Mix in the curd, carrot, capsicum, coriander, green chillies, ginger paste, hing
  and salt. Add a little water if the batter is too thick.
- Grease an appe pan with oil and pour in the batter.
- Cover and cook on medium-low heat for about 10 minutes, turning once. Serve with
  green chutney.
