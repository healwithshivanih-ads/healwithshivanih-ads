  unit: cup
steps:
- Choose a small-seeded variety — large kabuli chana and large rajma often refuse
  to sprout.
- Soak in clean drinking water for 7–8 hours, then drain completely.
- Rinse and drain three times a day. These big beans spoil faster than moong, so do
  not skip a rinse.
- Expect 3 to 4 days before good sprouts show.
- Always cook these before eating. Rajma sprouts must be boiled hard for at least
  10 minutes, or pressure-cooked — raw or undercooked kidney beans upset the stomach.
  Boil chickpea sprouts until tender.
- Use within 2 days, stored airtight in the fridge.
