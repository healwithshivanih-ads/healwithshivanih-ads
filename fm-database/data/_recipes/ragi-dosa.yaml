steps:
- Whisk the ragi flour, rice flour, curd and water into a thin, lump-free batter —
  much thinner than a regular dosa batter.
- Stir in the onion, green chilli, cumin, coriander and salt. Rest 10 minutes.
- Heat the tawa well. Instead of spreading, POUR the thin batter from a height in
  a ring, filling the gaps.
- Drizzle oil around the edge and cook until crisp and lacy. This style doesn't need
  flipping if the pan is hot enough.
- Serve straight off the pan — it softens as it sits.
