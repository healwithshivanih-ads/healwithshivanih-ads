translations:
  hi:
    name: सोया चंक पुलाव सब्ज़ियों के साथ
    steps:
    - सोया चंक को नमकीन पानी में 4-5 मिनट उबालें, छानें, और पानी निचोड़ लें। अलग रख
      दें।
    - भारी बर्तन में मध्यम आँच पर तेल गरम करें। तेज पत्ता, लौंग, इलायची, दालचीनी और
      जीरा डालें; खुशबू आने तक चटकने दें।
    - कटा प्याज़ डालकर सुनहरा होने तक भूनें, फिर अदरक-लहसुन पेस्ट मिलाकर 1 मिनट पकाएँ।
    - मिली-जुली सब्ज़ियाँ और निचोड़े सोया चंक डालें, 3-4 मिनट भूनें, फिर गरम मसाला
      और नमक छिड़कें।
    - भिगोया चावल छानकर बर्तन में डालें, दानों को तोड़े बिना हल्के से मसाले में मिलाएँ।
    - 2 कप पानी डालें, उबाल लाएँ, फिर ढककर धीमी आँच पर 12-15 मिनट पकाएँ जब तक चावल
      फूल जाए और पानी सोख जाए।
    - ढककर 5 मिनट रखें, काँटे से फुलाएँ, और परोसने से पहले ताज़े धनिया से सजाएँ।
