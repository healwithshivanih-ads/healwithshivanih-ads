steps:
- Warm the ghee in a pan and let the mustard seeds, cumin and urad dal crackle for
  a few seconds.
- Add the onion and cook until it just starts to brown.
- Stir in the moong sprouts, salt, turmeric and half a cup of water. Cover and cook
  until the moong is tender.
- Scatter over the coconut, tomato and green chilli, cover again and cook 5 minutes
  more.
