steps:
- Rinse the kodo millet and all four dals together and soak 4–6 hours, then drain.
- Grind with the red chillies and fennel seeds to a coarse batter — adai should stay
  slightly grainy, looser than idli batter but thicker than dosa.
- Stir in the onion, curry leaves, coriander and salt. Rest 20 minutes; no ferment
  needed.
- Heat a tawa, spread a ladleful into a thick round and ring the edge with sesame
  oil. Make a hole in the centre so the middle cooks through.
- Cook until crisp and golden, flip once, and serve hot with chutney or jaggery-free
  avial.
servings: '4'
prep_time_min: 20
cook_time_min: 20
good_for:
- blood-sugar-regulation
- satiety-and-weight
one_line: A thick, protein-heavy kodo millet adai carrying four dals, crisp at the
  edges and coarse in the middle.
headnote: The four-dal base is what makes adai worth choosing over dosa — it lands
  far more protein per plate, so the meal holds without a mid-morning dip. Buy kodo
  from a supplier with good turnover and store it airtight and dry.
