steps:
- Heat the ghee in a deep pan and add the cumin and whole spices, then the green chillies
  and ginger.
- Add the spinach, stir for a few seconds, then add the sprouts.
- Add the rice and stir gently. Pour in 3 cups of water and add salt.
- Cover and cook on low heat; check the rice after 7–8 minutes.
- Off the heat, stir in the lemon juice, scatter over the coriander and keep covered
  5 minutes more. Serve with raita or curd.
