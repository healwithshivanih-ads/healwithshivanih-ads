translations:
  hi:
    name: पालक और अंकुरित मूँग का पुलाव
    steps:
    - गहरे बर्तन में घी गरम करें और जीरा और खड़े मसाले डालें, फिर हरी मिर्च और अदरक।
    - पालक डालकर कुछ सेकंड चलाएँ, फिर अंकुरित मूँग डालें।
    - चावल डालकर हल्के हाथ से चलाएँ। 3 कप पानी और नमक डालें।
    - ढककर धीमी आँच पर पकाएँ; 7–8 मिनट बाद चावल देख लें।
    - आँच से उतारकर नींबू का रस मिलाएँ, हरा धनिया डालें और 5 मिनट ढककर रखें। रायते
      या दही के साथ परोसें।
