translations:
  hi:
    name: मूँग दाल और समा की खिचड़ी
    steps:
    - मूँग की धुली दाल को पैन में 2 मिनट सूखा भूनें जब तक खुशबू आए, फिर दाल और समा
      को एक साथ धोकर छान लें।
    - प्रेशर कुकर में घी गरम करें, जीरा और हींग डालें, और जीरा चटकने दें।
    - कद्दूकस अदरक और हल्दी डालें, थोड़ा चलाएँ, फिर कटी सब्ज़ियाँ डालकर एक मिनट भूनें।
    - छना समा और मूँग दाल नमक और पानी के साथ डालें, और अच्छी तरह मिलाएँ।
    - 3-4 सीटी प्रेशर-कुक करें (या ढककर 25-30 मिनट उबालें) जब तक नरम और दलिये जैसी
      हो जाए।
    - कुकर खोलें और चलाकर नरम, सूपी खिचड़ी बनाएँ, गाढ़ी हो तो गरम पानी मिलाएँ।
    - ताज़ी धनिया से सजाकर गरम परोसें।
