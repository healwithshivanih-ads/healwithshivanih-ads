translations:
  hi:
    name: सब्ज़ी उत्तपम
    steps:
    - फ़र्मेंट किए घोल को अच्छी तरह चलाएँ और नमक डालकर गाढ़ा, चम्मच लायक गाढ़ापन बनाएँ।
    - कटा प्याज़, टमाटर, शिमला मिर्च, हरी मिर्च और धनिया एक कटोरे में मिलाएँ।
    - तवा मध्यम आँच पर गरम करें और हल्का चिकना करें।
    - एक कलछी घोल डालें और डोसे से मोटा, गोल फैलाएँ।
    - ऊपर से मुट्ठीभर सब्ज़ी का मिश्रण डालें और हल्का दबाएँ ताकि चिपक जाए।
    - किनारों पर कुछ बूँद तेल डालें और ढक दें; नीचे का हिस्सा सुनहरा होने तक पकाएँ।
    - पलटें और सब्ज़ी वाला हिस्सा एक-दो मिनट जमने तक पकाएँ, फिर चटनी के साथ गरम परोसें।
