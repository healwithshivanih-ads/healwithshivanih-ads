translations:
  hi:
    name: हॉट एंड सॉर वेज सूप (इंडियन स्टाइल)
    steps:
    - गहरे बर्तन में तिल तेल गरम करें। अदरक, लहसुन, हरी मिर्च 1–2 मिनट भूनें।
    - कटे टमाटर 3 मिनट पकाएँ, दबाकर रस निकालें, जल्दी बेस बनाएँ।
    - पानी या स्टॉक डालकर तेज़ उबालें। गाजर, बीन्स डालकर 4 मिनट पकाएँ।
    - पत्तागोभी, सिरका, तमारी, काली-सफ़ेद मिर्च, नमक डालें। 3–4 मिनट पकाएँ।
    - पतला चाहें तो 2 बड़े चम्मच पानी में कॉर्नफ्लोर घोलकर डालें, 1 मिनट पकाएँ।
    - खट्टापन या तीखापन ठीक करें। कटोरों में हरे प्याज़ और धनिया डालें।
