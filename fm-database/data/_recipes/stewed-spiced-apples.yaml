one_line: Soft cinnamon-clove stewed apples — a classic Ayurvedic gentle morning food,
  easy on digestion.
method: '1. Chop 1-2 apples; simmer in 1/2 cup water with 1/4 tsp cinnamon, 1 clove,
  a few raisins.

  2. Cook ~10 min until soft. Eat warm, ideally as a first food in the morning (traditionally
  eaten ~30 min before other breakfast).'
