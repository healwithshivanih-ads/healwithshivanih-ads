steps:
- Peel the apples — the skin is harder work for a delicate digestion, which is the
  whole point of stewing them.
- Warm the ghee if using and add the cinnamon and cloves for a few seconds.
- Add the apples, raisins and water. Cover and simmer on low for 12–15 minutes until
  completely soft.
- Mash lightly with the back of a spoon, leaving some texture.
- Fish out the cloves, dust with cardamom, and eat warm — traditionally on its own,
  half an hour before anything else.
