steps:
- Grind the sprouts with the chillies, ginger and curry leaves, using a little water.
- Tip into a bowl and mix in the hing, salt, paneer, semolina and coconut. Rest 10
  minutes.
- Heat an appe pan and brush the hollows with coconut oil.
- Spoon in the batter and cook, turning, until crisp on all sides.
