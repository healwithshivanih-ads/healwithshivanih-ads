steps:
- Heat the ghee and crackle the cumin seeds, then add the garlic and green chilli.
- Add the spinach and cook uncovered until it wilts and the water dries off — this
  keeps the sabzi dry rather than soupy.
- Stir in the turmeric and salt.
- Fold in the paneer cubes and warm through for 2 minutes only.
- Finish with lemon juice off the heat.
