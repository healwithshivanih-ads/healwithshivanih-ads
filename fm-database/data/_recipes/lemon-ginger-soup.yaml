steps:
- Fry two-thirds of the ginger with the garlic and onion in the ghee until fragrant
  but not browned.
- Add the water, crushed peppercorns, turmeric and salt, and simmer 12 minutes.
- Strain if you want a clear broth, or leave it rustic.
- Off the heat, stir in the lemon juice, the remaining raw ginger and the honey if
  using — honey should never be boiled.
- Finish with coriander.
