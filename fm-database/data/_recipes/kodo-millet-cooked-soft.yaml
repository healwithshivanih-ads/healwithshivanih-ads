steps:
- Rinse kodo millet thoroughly under running water.
- In a pot, bring water to a boil with salt.
- Add rinsed kodo millet.
- Stir once, reduce heat to low, and cover.
- Cook for 20-25 minutes until millet is completely soft and fully cooked.
- Fluff with a fork, drizzle with ghee if using, and serve warm.
