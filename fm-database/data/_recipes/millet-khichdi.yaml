steps:
- Dry-roast the moong dal for 2 minutes until it smells nutty, then rinse it with
  the millet.
- Heat the ghee, crackle the cumin, and add the hing, ginger and turmeric.
- Add the millet and dal and toss for a minute in the ghee.
- Pour in the water with the salt and pressure-cook 3 whistles, or simmer covered
  25 minutes until it collapses.
- Keep it soft and porridge-loose. Finish with coriander.
