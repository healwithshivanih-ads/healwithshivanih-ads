steps:
- Whisk the besan with water to a smooth batter, slightly thicker than chilla.
- Add the black salt — it is what gives this its eggy note — plus turmeric, salt and
  the pinch of soda.
- Fold in the vegetables and coriander.
- Pour a round onto a medium-hot oiled pan and cook covered for 2–3 minutes until
  the top is nearly set.
- Fold in half like an omelette, press gently, and cook another minute.
