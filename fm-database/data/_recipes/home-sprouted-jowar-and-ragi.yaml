steps:
- Wash the grain well and soak it in the sprouting jar in clean drinking water overnight
  (7–8 hours).
- Drain completely, rinse with fresh water and drain again.
- Rinse and drain three times a day — these small grains need it more often than beans
  do.
- Jowar grows good roots in about 3 days and tastes sweet. Ragi takes about the same
  time and stays tiny.
- Store airtight in the fridge; ragi sprouts keep up to 5 days.
- Cook jowar sprouts before eating — pressure-cook them into a khichdi or upma. Ragi
  sprouts can be stirred raw into dosa batter or added to soup.
