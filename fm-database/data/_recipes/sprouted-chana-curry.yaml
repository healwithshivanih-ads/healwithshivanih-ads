translations:
  hi:
    name: अंकुरित चना करी
    steps:
    - पैन में तेल गरम करें और जीरा चटकाएँ।
    - कटा प्याज़ डालें और नरम व हल्का भूरा होने तक भूनें।
    - अदरक-लहसुन पेस्ट मिलाएँ और एक मिनट पकाएँ, फिर टमाटर, हल्दी, धनिया पाउडर और नमक
      डालें।
    - टमाटर के गलने और मसाले के गाढ़ा होने तक पकाएँ।
    - अंकुरित चना और एक कप पानी डालें और उबाल पर लाएँ।
    - ढककर 12 से 15 minute तक पकाएँ जब तक अंकुर नरम पर आकार बनाए रखें।
    - गरम मसाला डालकर मिलाएँ, और रोटी या चावल के साथ गरम परोसें।
