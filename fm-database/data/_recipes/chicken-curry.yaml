steps:
- Brown the onions slowly in the oil until genuinely deep golden — 10 minutes at least.
  This is the body of the gravy.
- Add the ginger-garlic paste and fry until the raw smell goes.
- Add the tomato puree with the turmeric, chilli powder and coriander powder. Cook
  until the oil separates out at the sides.
- Add the chicken and salt and toss to coat every piece. Cover and cook on low for
  20 minutes, stirring now and then.
- Add a splash of hot water if it catches. Finish with garam masala and coriander,
  rested for 5 minutes before serving.
