steps:
- Boil the rajma sprouts hard for at least 10 minutes and drain — kidney beans must
  never go in undercooked.
- Heat the oil on low and add the mustard seeds and urad dal.
- Add the turmeric, boiled rajma, moong sprouts and French beans and toss lightly.
- Add 3–4 teaspoons of water, cover and let everything cook in its own steam.
- Meanwhile grind the green chillies with the coconut. Stir this paste in, add salt,
  cook a few seconds more and serve hot.
