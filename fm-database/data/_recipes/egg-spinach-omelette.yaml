steps:
- Heat the ghee and soften the onion and garlic for 2 minutes.
- Add the spinach and cook just until it wilts and its water dries off — wet spinach
  makes a soggy omelette.
- Beat the eggs with salt and pepper and pour them over the spinach, tilting to spread.
- Cook on low until the base sets, fold over, and cook a minute more.
