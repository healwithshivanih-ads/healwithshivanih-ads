steps:
- Heat the ghee and add the herbs, then the capsicums and horsegram sprouts.
- Sprinkle generously with water and cook until the vegetables are just done — do
  not overcook.
- Scoop out the avocado and mix it into the pan. Season with salt and pepper.
- Toast the bread slices on a pan and pile the sprout mixture on top. Garnish with
  a few sprouts and chopped peppers.
