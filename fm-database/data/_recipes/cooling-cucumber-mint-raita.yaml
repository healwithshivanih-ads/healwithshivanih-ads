steps:
- Grate the cucumber and squeeze out its water firmly, or the raita turns thin within
  minutes.
- Whisk the curd smooth with a fork — lumpy curd never recovers once the cucumber
  is in.
- Fold in the cucumber, mint, roasted cumin, rock salt and pepper.
- Chill for 15 minutes before serving so the mint infuses.
- Finish with coriander and an extra dusting of roasted cumin.
