steps:
- Blanch the cabbage leaves until just pliable.
- Cook the garlic, onion and chopped vegetables in a little oil. Add the sprouts and
  cook 2 minutes.
- Add the soy sauce, chilli sauce, salt and pepper, mix and leave to cool.
- Put a little filling on each leaf and roll it up.
- Steam the rolls, or sauté them lightly in a little oil. Serve hot with a sauce of
  your choice.
