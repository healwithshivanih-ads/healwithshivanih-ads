translations:
  hi:
    name: मिक्स स्प्राउट्स चाट
    steps:
    - मिले-जुले स्प्राउट्स को हल्का भाप में पका लें — कच्चे की बजाय भाप में पके स्प्राउट्स
      पाचन के लिए ज़्यादा नरम होते हैं।
    - खीरा, नींबू का रस, भुना जीरा और सेंधा नमक के साथ मिलाएँ।
    - ताज़ा हरी पत्तियाँ और थोड़ा तेल (हो तो) मिलाएँ। ताज़ा परोसें।
