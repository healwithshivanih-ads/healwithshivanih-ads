steps:
- Mix the sprouts, chopped vegetables, hung curd, salt and chaat masala in a bowl.
- Scoop the seeds out of the cucumber halves to make boats.
- Fill with the sprout mixture and top with the grated carrot, beetroot and coriander.
- Squeeze over the lemon juice and eat.
