steps:
- Toss the prawns with the turmeric and a pinch of salt, then sear them in 1 tsp oil
  for 2 minutes. Lift out and chop roughly.
- In the same pan soften the onion, curry leaves and green chilli.
- Beat the eggs with salt, stir in the cooked prawns and coriander.
- Add the remaining oil, pour in the egg mixture and tilt to spread.
- Cook on low until the base sets, fold over, and give it one more minute.
