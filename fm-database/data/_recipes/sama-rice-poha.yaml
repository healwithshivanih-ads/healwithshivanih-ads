steps:
- Cook the sama ahead and spread it on a plate to cool — warm millet clumps when you
  toss it.
- Splutter the mustard seeds in the oil, add the curry leaves, onion and green chilli.
- Add the peas and carrot with a splash of water and cook until tender.
- Stir in the turmeric and salt, then fold the cooled sama through gently.
- Warm for 2 minutes, then finish with lemon juice and coriander.
