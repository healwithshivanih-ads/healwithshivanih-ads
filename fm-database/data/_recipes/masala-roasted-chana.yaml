translations:
  hi:
    name: मसाला भुना चना
    steps:
    - उबालने के बाद, चनों को एक साफ़ रसोई के कपड़े पर फैलाएँ और पूरी तरह सुखाकर पोंछ लें — सतह की कोई भी नमी उन्हें भूनने के बजाय पैन में भाप में पका देगी।
    - एक भारी लोहे या नॉन-स्टिक पैन को मध्यम आँच पर बिना तेल के गरम करें। सूखे चनों को एक परत में डालें और हर 2–3 मिनट चलाते हुए 12–15 मिनट सूखा भूनें जब तक छिलके साफ़ कुरकुरे हो जाएँ और पैन पर दबाने पर चना खोखला बजे।
    - आँच धीमी करें, एक चम्मच तेल डालें, और ऐसे मिलाएँ कि हर चने पर हल्की परत चढ़ जाए।
    - सारे मसाले — जीरा, धनिया, मिर्च, अमचूर, चाट मसाला, काला नमक और साधारण नमक — डालें और 1 मिनट तेज़ी से मिलाएँ ताकि मसाले बिना जले खिल जाएँ।
    - रखने या परोसने से पहले एक प्लेट में फैलाकर पूरी तरह ठंडा करें; ठंडा होते-होते ये और कुरकुरे हो जाते हैं। हवाबंद जार में एक हफ़्ते तक रखें।
