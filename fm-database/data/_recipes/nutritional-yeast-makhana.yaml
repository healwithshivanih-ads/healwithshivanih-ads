translations:
  hi:
    name: न्यूट्रिशनल यीस्ट मखाना
    steps:
    - चौड़े भारी पैन में धीमी-मध्यम आँच पर घी गरम करें। मखाने को एक परत में डालें
      और हर मिनट चलाते हुए 10–12 मिनट कुरकुरे और हल्के सुनहरे होने तक भूनें। एक तोड़कर
      देखें — यह अंदर तक कुरकुरा होना चाहिए, कहीं नरम नहीं।
    - पैन आँच से उतार लें पर मखाने गरम पैन में ही रहने दें। तुरंत ऊपर से न्यूट्रिशनल
      यीस्ट, काली मिर्च, नमक, लाल मिर्च पाउडर और हल्दी छिड़कें।
    - पैन गरम रहते हुए ही करीब 30 सेकंड तेज़ी और अच्छी तरह चलाएँ ताकि यीस्ट के फ्लेक्स
      मखाने की सतह पर हल्के चिपक जाएँ।
    - एक प्लेट में फैलाकर 2 मिनट ठंडा करें — ठंडे होते ही और कुरकुरे हो जाते हैं।
      बचा हुआ हवा-बंद डिब्बे में 3 दिन तक रखें।
