steps:
- Rinse the poha in a colander until just damp, then leave it to sit — never soak
  it in standing water or it turns to paste.
- Splutter the mustard seeds in the oil, add the curry leaves, onion and green chilli.
- Add the carrot and peas with a splash of water and cook until tender.
- Stir in the turmeric and salt, then the shredded chicken.
- Fold in the poha gently, cover for 2 minutes on low, then finish with lemon juice
  and coriander.
