translations:
  hi:
    name: भुनी ब्रोकली
    steps:
    - ब्रोकली के फूलों को गरम नमकीन पानी में 2 मिनट उबालें, फिर अच्छे से छान लें।
    - पैन में तेल गरम करें, जीरा चटकाएँ और कटा लहसुन और हरी मिर्च डालें।
    - लहसुन को बस सुनहरा और खुशबूदार होने तक भूनें।
    - ब्रोकली को हल्दी, कुटी काली मिर्च और नमक के साथ डालें और तेज़ आँच पर 3 से 4
      मिनट भूनें।
    - फूलों को चमकीला हरा और थोड़ा कुरकुरा रखें; ज़्यादा न पकाएँ।
    - ऊपर से नींबू का रस निचोड़ें, एक बार मिलाएँ और गरमागरम परोसें।
