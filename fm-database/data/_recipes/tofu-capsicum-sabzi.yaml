steps:
- Crackle the cumin seeds in the hot oil.
- Add the onion and cook until soft, then the ginger.
- Add the capsicum and stir-fry on high for 2–3 minutes so it keeps its bite.
- Stir in the turmeric, coriander powder and salt, then fold in the tofu and warm
  through for 3 minutes.
- Finish with amchur and fresh coriander — the amchur is what makes this taste Indian
  rather than Chinese.
