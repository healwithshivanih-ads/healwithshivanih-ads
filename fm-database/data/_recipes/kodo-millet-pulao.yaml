translations:
  hi:
    name: कोदो बाजरे का मटर-जीरा पुलाव
    steps:
    - भीगे कोदो बाजरे को छानकर रख दें; मटर और गाजर तैयार रखें।
    - एक मोटे तले के बर्तन में तेल गरम करें, जीरा, तेज़ पत्ता, दालचीनी और लौंग डालें,
      और जीरा चटकने दें।
    - कटा प्याज़ डालकर नरम और हल्का सुनहरा होने तक भूनें, फिर कद्दूकस किया अदरक आधे
      मिनट के लिए मिलाएँ।
    - गाजर, मटर, हल्दी और नमक डालें, और 2 minute भूनें।
    - छना हुआ कोदो बाजरा डालें और एक मिनट मसालों में हल्के से लपेटें।
    - पानी डालें, उबाल लाएँ, फिर ढककर धीमी आँच पर 15-18 minute तक बाजरा नरम और पानी
      सूखने तक पकाएँ।
    - ढककर 5 minute रखें, फिर काँटे से हल्के से फुलाएँ और धनिया से सजाएँ।
