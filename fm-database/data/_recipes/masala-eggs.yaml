steps:
- Boil the eggs, cool them under running water, peel and halve them.
- Heat the ghee, brown the onion, then add the ginger-garlic paste and cook off the
  raw smell.
- Add the tomato puree, turmeric, coriander powder and salt. Cook down until thick
  and glossy.
- Lay the egg halves in cut-side up, spoon the masala over them, cover and warm through
  for 3–4 minutes.
- Scatter with garam masala and coriander before serving.
