translations:
  hi:
    name: पालक तिल चटनी
    steps:
    - तिल को धीमी आँच पर सुनहरा और ख़ुशबूदार होने तक सूखा भूनें, फिर अलग रखें।
    - पैन में तेल गरम करें, जीरा तड़काएँ और हरी मिर्च और लहसुन डालें।
    - कटी पालक डालें और 2 से 3 मिनट भूनें जब तक बस मुरझा जाए।
    - मिश्रण को थोड़ा ठंडा होने दें ताकि रंग चमकीला बना रहे।
    - मुरझाई पालक, भुने तिल, नमक और नींबू का रस मिक्सी में डालें।
    - चिकनी या थोड़ी दरदरी चटनी पीस लें, ज़रूरत हो तो थोड़ा पानी डालें।
    - एक बर्तन में निकालें और चावल, रोटी या डोसे के साथ परोसें।
