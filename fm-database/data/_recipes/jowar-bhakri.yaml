steps:
- Make the dough as for roti, with boiling salted water — soft and pliable. A stiff
  dough is what cracks when you pat it out.
- Pat each ball out slightly thicker than a roti, no more, on a board dusted with
  dry jowar flour.
- Cook on a medium-high tawa. A cool tawa makes a bhakri hard rather than gentle —
  this is the commonest mistake.
- Once the base has set, wet the top surface all over with your fingers before you
  flip. This carries off the dusting flour, and the moistened skin is what sets and
  lifts.
- Turn, cook the watered side, then finish directly over the flame for a few seconds
  so it puffs.
- Serve hot with ghee or white butter.
