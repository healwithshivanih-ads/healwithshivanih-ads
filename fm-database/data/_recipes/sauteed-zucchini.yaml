translations:
  hi:
    name: भुनी ज़ुकीनी
    steps:
    - पैन में तेल गरम करें और राई डालें; चटकने पर जीरा, करी पत्ता और लहसुन डालें।
    - लहसुन को कुछ सेकंड खुशबू आने तक भूनें।
    - ज़ुकीनी को हल्दी, मिर्च पाउडर और नमक के साथ डालें, और अच्छी तरह मिलाएँ।
    - मध्यम-तेज़ आँच पर चलाते हुए 5 से 6 मिनट पकाएँ ताकि ज़ुकीनी बस नरम पर थोड़ी कुरकुरी
      रहे।
    - ज़्यादा न पकाएँ वरना पानी छोड़ देगी; ताज़ी धनिया डालकर गरम परोसें।
