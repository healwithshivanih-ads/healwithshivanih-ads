steps:
- Dry-roast the moong dal for 2–3 minutes until it smells nutty, then rinse it with
  the rice until the water runs clear.
- Heat the ghee, crackle the cumin, and add the hing, ginger and turmeric.
- Add the drained rice and dal and toss for a minute so every grain is coated.
- Add the water and salt. Pressure-cook for 3 whistles, or simmer covered for 25 minutes.
- Khichdi should be soft and pourable, not fluffy — loosen with hot water if needed,
  and finish with coriander and a spoon of ghee.
