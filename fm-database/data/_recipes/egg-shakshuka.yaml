steps:
- Heat the oil in a wide shallow pan and soften the onion, capsicum and garlic for
  5–6 minutes.
- Add the tomato, cumin, paprika and salt. Simmer 10–12 minutes until it thickens
  into a sauce you can draw a spoon through.
- Make four wells in the sauce with the back of a spoon and crack an egg into each.
- Cover and cook on low for 5–7 minutes, until the whites are set but the yolks still
  wobble.
- Scatter with herbs and bring the pan to the table.
