steps:
- Grind the sprouts with the garlic, ginger, green chilli and onion.
- Tip into a bowl and add the kasoori methi, sesame seeds, salt and jowar flour. Bring
  together into a dough — it usually needs no water.
- Divide into 4. Pat each portion into a flat round on butter paper with damp fingertips.
- Cook on a tawa with a little ghee until done on both sides.
