steps:
- Pressure-cook the masoor sprouts for one whistle only, so they hold their shape.
  Set aside.
- Heat the oil in a deep pan and add the cumin, garlic, ginger and curry leaves, then
  the onion. Cook until golden.
- Add the tomato, then all the dry spices with 4 tablespoons of water. Cook, stirring,
  until the oil separates.
- Add the cooked masoor and salt, and loosen with water to the consistency you like.
  Taste and adjust the spice.
- Serve hot with rice, or as misal with a squeeze of lemon and a spoonful of farsan
  on top.
