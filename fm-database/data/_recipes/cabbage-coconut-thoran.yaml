steps:
- Crush the coconut coarsely with the green chilli, garlic and cumin — a few pulses
  in a mortar, not a paste. Some households instead fold in plain grated coconut;
  both are done, and crushing releases more moisture.
- Splutter the mustard seeds in the coconut oil, add the urad dal, red chilli and
  curry leaves.
- Add the shallots and soften them for a minute — every Kerala version starts here.
- Add the cabbage with the turmeric and salt and toss on high.
- Cover and cook 5 minutes on low — the cabbage should steam in its own water, with
  none added.
- Uncover, fold in the crushed coconut mixture, and toss on high for 2 minutes until
  dry.
