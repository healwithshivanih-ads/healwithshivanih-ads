steps:
- Heat the oil in a wok and soften the garlic, ginger, onion and capsicum.
- Add the sliced vegetables and cook until just tender.
- Whisk the coconut milk with the soy sauce, chilli sauce and nut butter until smooth,
  pour it in and simmer 3–4 minutes.
- Add the sprouts, lemon juice and salt, cover and cook another 3–4 minutes. Serve
  hot with rice or noodles.
