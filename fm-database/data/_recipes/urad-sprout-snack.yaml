steps:
- Blanch the urad sprouts in boiling water for about a minute and drain.
- Warm the ghee on low heat and add the cumin, hing, curry leaves, green chillies,
  garlic, ginger and salt. Stir for a few seconds.
- Add the sprouts and cook 2–3 minutes.
- Add the onion and a squeeze of lemon, and top with the coriander.
