steps:
- Grind the sprouts, semolina, ginger, chilli and salt to a fine paste with as little
  water as possible. Cover and rest 15 minutes.
- Whisk the batter for 2–3 minutes until light and frothy.
- Heat a paniyaram pan and brush the hollows with oil. Drop in spoonfuls of batter
  and cook, turning, until golden all over.
- Soak the vadas in warm water for 2 minutes, squeeze gently and let them cool.
- Whip the curd with salt, black salt, chaat masala and cumin powder and pour it over
  the vadas. Top with chutney and coriander.
