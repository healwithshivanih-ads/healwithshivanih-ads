translations:
  hi:
    name: अंकुरित मूँग का दही वड़ा (बिना तले)
    steps:
    - अंकुरित मूँग, सूजी, अदरक, हरी मिर्च और नमक को कम से कम पानी के साथ बारीक पीस
      लें। ढककर 15 मिनट रखें।
    - घोल को 2–3 मिनट फेंटें जब तक हल्का और झागदार हो जाए।
    - अप्पे का पैन गरम करके खाँचों में तेल लगाएँ। चम्मच से घोल डालें और पलटते हुए
      चारों तरफ़ से सुनहरा होने तक सेंकें।
    - वड़ों को 2 मिनट गुनगुने पानी में भिगोएँ, हल्के हाथ से निचोड़ें और ठंडा होने
      दें।
    - दही को नमक, काला नमक, चाट मसाला और जीरा पाउडर के साथ फेंटकर वड़ों पर डालें।
      ऊपर से चटनी और हरा धनिया डालें।
