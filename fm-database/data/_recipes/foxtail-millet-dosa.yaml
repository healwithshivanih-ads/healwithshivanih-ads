steps:
- Rinse the foxtail millet well — millets carry more surface starch than rice.
- Soak the millet separately, and the urad dal with methi, for 5 hours.
- Grind the dal light and fluffy, then the millet slightly coarse. Mix with salt and
  ferment 8–10 hours.
- Millet batter ferments faster than rice batter in warm weather, so check it early.
- Spread thin on a hot tawa, oil the edges, and cook until golden and crisp underneath.
