steps:
- Splutter the mustard seeds in the coconut oil and add the curry leaves.
- Soften the shallots, then add the ginger-garlic paste and green chilli.
- Stir in the turmeric and coriander powder, then the chicken and salt. Seal the pieces
  on all sides.
- Pour in the coconut milk, bring to a bare simmer, cover and cook 25 minutes until
  the chicken is tender.
- Keep it below a boil throughout — coconut milk splits if pushed. Finish with coriander.
