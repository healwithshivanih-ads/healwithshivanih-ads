translations:
  hi:
    name: मशरूम पेपर फ्राई
    steps:
    - मशरूम को पोंछकर साफ करें और आधा या चौथाई काटें ताकि सब टुकड़े लगभग एक बराबर
      हों। समय हो तो पकाने से पहले उन्हें ट्रे पर उल्टा रखकर 20 मिनट सीधी धूप में
      रखें।
    - एक चौड़े भारी पैन में नारियल तेल मध्यम-तेज़ आँच पर गरम करें। राई डालें और चटकने
      दें, फिर सूखी लाल मिर्च और करी पत्ता डालकर 30 सेकंड खुशबू आने तक भूनें।
    - कटा प्याज़ डालें और बार-बार चलाते हुए 7–8 मिनट पकाएँ जब तक किनारे सुनहरे हो
      जाएँ।
    - अदरक और लहसुन डालकर 1 मिनट भूनें, फिर हल्दी, जीरा पाउडर, आधी कुटी काली मिर्च
      और नमक डालकर प्याज़ पर मिलाएँ।
    - मशरूम डालें, अच्छी तरह मिलाएँ, और एक परत में फैलाएँ। तेज़ आँच पर बिना चलाए 3–4
      मिनट पकाएँ ताकि मशरूम सिंकें और नमी छोड़ें, फिर चलाकर 3–4 मिनट और पकाएँ जब तक
      सूख और हल्का भूरा हो जाए।
    - आँच से हटाएँ, बची कुटी काली मिर्च और नींबू का रस डालें, अच्छी तरह मिलाएँ, और
      ताज़ी धनिया डालकर पूरा करें। गरम परोसें।
