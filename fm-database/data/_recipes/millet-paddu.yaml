steps:
- Rinse the millet, urad dal and fenugreek seeds, then soak them together in plenty
  of water for at least 6 hours or overnight. Discard the soaking water — this is
  what brings the phytate down.
- Grind to a smooth, thick batter with just enough fresh water, add salt, and leave
  to ferment 8–10 hours until risen and faintly sour.
- Stir in the onion, carrot, green chilli, curry leaves and coriander. The batter
  should drop thickly from a spoon.
- Heat a paddu (appe) pan, brush each well with coconut oil and fill three-quarters
  full.
- Cover and cook 2–3 minutes until the edges set, then flip each one and cook until
  golden. Serve hot with chutney.
servings: '4'
prep_time_min: 20
cook_time_min: 20
good_for:
- agni-digestive-fire
- blood-sugar-regulation
one_line: Fermented millet-and-urad paddu, cooked in a dimpled pan so they crisp outside
  and stay soft within.
headnote: The overnight soak and the ferment are doing real work here beyond flavour
  — both cut the phytate that otherwise binds iron and zinc, which matters once millets
  become an everyday grain rather than an occasional one.
