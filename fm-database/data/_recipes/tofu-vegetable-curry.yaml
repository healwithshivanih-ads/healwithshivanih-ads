steps:
- Splutter the mustard seeds in the coconut oil, then add the curry leaves.
- Soften the onion, add the ginger-garlic paste and cook off the raw smell.
- Add the vegetables with the turmeric, coriander powder and salt, and a splash of
  water. Cover and cook until just tender.
- Pour in the coconut milk and bring to a bare simmer — never a rolling boil, or it
  splits.
- Slide in the tofu, warm through for 3–4 minutes, and finish with coriander.
