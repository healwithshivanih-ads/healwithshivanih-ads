steps:
- Rinse and drain the poha and set it aside to swell.
- Splutter the mustard seeds in the oil with the curry leaves, then add the onion
  and green chilli.
- Add the potato first and cook covered for 5 minutes — it takes longest.
- Add the carrot and peas with a splash of water and cook until everything is tender.
- Stir in the turmeric and salt, fold in the poha, cover 2 minutes, and finish with
  lemon and coriander.
