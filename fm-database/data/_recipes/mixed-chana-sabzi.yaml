steps:
- Warm the oil on low heat and add the cumin and onion, then the ginger-garlic paste.
- When the onion turns light brown, add the tomato puree and salt.
- Once the oil separates, add the boiled sprouts and the pepper.
- Cook until the masala coats the chana well. Good with dosa.
