translations:
  hi:
    name: अंकुरित चने की मसाला सब्ज़ी
    steps:
    - धीमी आँच पर तेल गरम करें और जीरा और प्याज़ डालें, फिर अदरक-लहसुन का पेस्ट।
    - प्याज़ हल्का सुनहरा होने पर टमाटर की प्यूरी और नमक डालें।
    - तेल छूटने पर उबले हुए अंकुरित चने और काली मिर्च डालें।
    - तब तक पकाएँ जब तक मसाला चनों पर अच्छी तरह चढ़ जाए। डोसे के साथ अच्छा लगता है।
