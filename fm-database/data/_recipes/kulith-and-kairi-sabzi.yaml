translations:
  hi:
    name: कुलथी और कैरी की सब्ज़ी
    steps:
    - भारी तले की कड़ाही में तेल गरम करके प्याज़ नरम करें।
    - अंकुरित कुलथी और कसी हुई कैरी डालकर चलाते रहें।
    - 3–4 छोटे चम्मच पानी डालें, ढककर धीमी आँच पर एक-दो मिनट पकाएँ — अंकुर ज़्यादा
      नरम चाहिए तो थोड़ा और।
    - नमक और काली मिर्च डालें और ऊपर से नारियल छिड़कें। प्याज़ के साथ चुटकी भर गरम
      मसाला डालना भी अच्छा लगता है।
