steps:
- Heat the oil in a heavy pan and soften the onion.
- Add the horsegram sprouts and grated raw mango and keep stirring.
- Add 3–4 teaspoons of water, cover and cook on low for a minute or two — longer if
  you like the sprouts softer.
- Season with salt and pepper and top with the coconut. A pinch of garam masala with
  the onions is a good variation.
