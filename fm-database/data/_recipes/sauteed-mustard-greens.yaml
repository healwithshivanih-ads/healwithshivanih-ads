translations:
  hi:
    name: भुनी सरसों का साग
    steps:
    - कड़ाही में तेल गरम करें, हींग डालें, फिर कुटा लहसुन, अदरक, हरी मिर्च।
    - एक मिनट भूनें जब तक लहसुन महके, फिर प्याज़ नरम होने तक पकाएँ।
    - कटा सरसों का साग हल्दी और नमक के साथ डालें।
    - बिना ढके मध्यम आँच चलाते हुए लगभग 10 मिनट पकाएँ जब तक साग नरम हो।
    - नमी सुखाएँ ताकि साग गाढ़ा हो, और रोटी या बाजरे रोटले के साथ परोसें।
