one_line: Crumbled paneer cooked down with capsicum, tomato and masala — a quick,
  high-protein scramble.
headnote: Paneer cooked simply with vegetables is a quick, satisfying protein that
  doesn't need a heavy gravy to taste good. Written without onion or garlic, so it
  suits Jain and allium-free plans as it stands. Capsicum stands in for the onion
  and gives the same sweetness once it softens.
