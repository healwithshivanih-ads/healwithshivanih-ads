steps:
- Crumble the paneer by hand — a grater makes it pasty.
- Heat the ghee, soften the capsicum for 2 minutes, then add the ginger and green
  chilli.
- Add the tomato and cook until it collapses and the oil separates.
- Stir in the turmeric, chilli powder and salt, then fold in the paneer.
- Cook just 2–3 minutes — paneer turns rubbery if you keep going. Finish with garam
  masala and coriander.
