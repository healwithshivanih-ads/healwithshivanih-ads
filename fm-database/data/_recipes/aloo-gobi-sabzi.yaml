translations:
  hi:
    name: आलू गोभी की सब्ज़ी
    steps:
    - कड़ाही में तेल गरम करें और जीरा तड़काएँ।
    - प्याज़ और अदरक-लहसुन का पेस्ट डालें; प्याज़ के नरम और सुनहरा होने तक भूनें।
    - टमाटर, हल्दी, मिर्च और धनिया पाउडर थोड़े पानी के साथ डालें; मसाला गाढ़ा होने
      तक पकाएँ।
    - आलू और फूलगोभी नमक के साथ डालें, मसाले में अच्छी तरह मिलाएँ।
    - ढककर धीमी आँच पर बीच-बीच में चलाते हुए दोनों के नरम होने तक पकाएँ, करीब 15 मिनट।
    - ढक्कन हटाएँ, आँच तेज़ करें और बची हुई नमी सुखा दें ताकि किनारे हल्के सुनहरे
      हो जाएँ।
    - ताज़ा धनिया डालें और गरमागरम रोटी के साथ परोसें।
