steps:
- Soften the onion and green chilli in the ghee for 2 minutes — you want them translucent,
  not browned.
- Add the turmeric, then the crumbled paneer, salt and pepper.
- Toss gently over low heat for 2–3 minutes, just until warmed through.
- Fold in the coriander off the heat.
