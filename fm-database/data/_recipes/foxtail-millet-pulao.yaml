one_line: A one-pot foxtail-millet pulao with whole spices and vegetables.
headnote: Written without onion or garlic, so it suits Jain and allium-free plans
  as it stands. The whole spices carry the flavour — bloom them properly in the ghee
  and you will not miss the aromatics. Rinsing and draining the millet well keeps
  the grains separate rather than sticky.
