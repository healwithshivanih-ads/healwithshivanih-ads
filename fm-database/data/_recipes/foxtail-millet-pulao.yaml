steps:
- Rinse the millet and drain it well.
- Heat the ghee and fry the whole spices and cumin until they release their scent.
- Add the ginger and green chilli and let them lose their raw edge, about 30 seconds.
- Add the vegetables and millet and toss for 2 minutes so every grain gets coated.
- Pour in the water with the salt and mint, cover, and cook on low 15 minutes. Rest
  5 minutes off the heat before fluffing.
