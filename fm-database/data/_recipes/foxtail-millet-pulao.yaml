translations:
  hi:
    name: कंगनी बाजरा पुलाव
    steps:
    - बाजरा धोकर अच्छे से छान लें।
    - घी गरम करें, साबुत मसाले और जीरा भूनें जब तक ख़ुशबू आए।
    - प्याज़ हल्का भूरा करें, फिर अदरक-लहसुन पेस्ट डालें।
    - सब्ज़ियाँ और बाजरा 2 मिनट चलाएँ ताकि हर दाना लिपटे।
    - पानी, नमक, पुदीना डालें, ढककर धीमी आँच 15 मिनट पकाएँ। 5 मिनट रखकर फुलाएँ।
