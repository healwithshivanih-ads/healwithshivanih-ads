translations:
  hi:
    name: सब्ज़ी मूँग खिचड़ी
    steps:
    - मूँग दाल और चावल को साथ में दो-तीन बार पानी बदलकर धोएँ, फिर छानकर अलग रखें।
    - प्रेशर कुकर में घी गरम करें, जीरा और हींग डालें, और जीरा चटकने दें।
    - कद्दूकस अदरक और हल्दी डालें, कुछ सेकंड चलाएँ, फिर कटी सब्ज़ियाँ डालकर एक मिनट भूनें।
    - छनी दाल और चावल नमक और पानी के साथ डालें, और अच्छी तरह चलाएँ।
    - 3-4 सीटी तक प्रेशर-कुक करें (या ढककर 25-30 मिनट उबालें) जब तक सब कुछ बहुत नरम और दलिये जैसा हो जाए।
    - कुकर खोलें, नरम, सूपी गाढ़ापन आने तक चलाएँ, बहुत गाढ़ा हो तो गरम पानी से ढीला करें।
    - ताज़े धनिया से सजाकर गरम परोसें।
