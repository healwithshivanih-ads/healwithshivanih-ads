steps:
- Grind the chana sprouts with the green chillies, ginger and about a quarter cup
  of water to a smooth paste.
- Mix in the hing, besan, turmeric, chilli powder, vegetables and salt. Add a little
  water for a pancake batter.
- Heat a skillet, brush with ghee and spread a ladleful of batter into a cheela.
- Cover and cook on low until the underside is golden. Drizzle with a little ghee,
  flip and cook the other side.
- Serve hot with coriander chutney.
