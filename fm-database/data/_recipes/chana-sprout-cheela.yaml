translations:
  hi:
    name: अंकुरित चने का चीला
    steps:
    - अंकुरित काले चने को हरी मिर्च, अदरक और करीब चौथाई कप पानी के साथ बारीक पीस लें।
    - इसमें हींग, बेसन, हल्दी, लाल मिर्च, सब्ज़ियाँ और नमक मिलाएँ। थोड़ा पानी डालकर
      चीले का घोल बना लें।
    - तवा गरम करके घी लगाएँ और एक करछी घोल फैलाकर चीला बनाएँ।
    - ढककर धीमी आँच पर नीचे से सुनहरा होने तक सेंकें। थोड़ा घी डालें, पलटें और दूसरी
      तरफ़ सेंकें।
    - धनिये की चटनी के साथ गरम परोसें।
