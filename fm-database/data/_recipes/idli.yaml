steps:
- Soak the rice and the dal-with-methi separately for 5–6 hours.
- Grind the dal to a very light, aerated paste and the rice to a fine one. Combine
  gently — the air you beat in is what makes idlis soft.
- Add salt and ferment overnight until risen and mildly sour.
- Grease the idli moulds, pour the batter in to about three-quarters, and steam for
  10–12 minutes.
- A skewer should come out clean. Rest for 2 minutes before unmoulding.
