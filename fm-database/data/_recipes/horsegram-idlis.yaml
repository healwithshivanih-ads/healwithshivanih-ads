  hi:
    name: अंकुरित कुलथी की इडली
    steps:
    - उड़द दाल धोकर एक घंटा भिगोएँ, पानी निकालकर बारीक पीस लें। रात भर ख़मीर उठने
      दें।
    - सुबह दलिया 15 मिनट भिगोकर छलनी में पानी निकाल दें।
    - अंकुरित कुलथी को दरदरा पीस लें। दलिया और उड़द के पेस्ट के साथ मिलाएँ, नमक डालें
      और हल्का और फूला होने तक अच्छी तरह फेंटें।
    - चिकनाई लगे इडली साँचों में डालें और 15–18 मिनट भाप में पकाएँ।
    - पुदीने की चटनी या थोड़े घर के सफ़ेद मक्खन के साथ परोसें।
