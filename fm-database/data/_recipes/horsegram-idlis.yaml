steps:
- Wash the urad dal, soak it for an hour, drain and grind to a paste. Leave to ferment
  overnight.
- Next morning soak the broken wheat for 15 minutes and drain it in a colander.
- Grind the horsegram sprouts coarsely. Mix with the broken wheat and urad paste,
  add salt and beat well until light and fluffy.
- Pour into greased idli moulds and steam for 15–18 minutes.
- Serve with pudina chutney or a little home-made white butter.
