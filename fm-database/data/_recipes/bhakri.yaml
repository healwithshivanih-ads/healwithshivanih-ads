translations:
  hi:
    name: भाकरी
    steps:
    - सब्ज़ी वाले आटे में नमक मिलाएँ। गुनगुना पानी थोड़ा-थोड़ा करके डालें, गूँधकर नरम, मुलायम आटा बनाएँ। 10 मिनट रखें।
    - लोइयाँ बना लें। हर एक को आटा लगी सतह पर थपथपाकर या बेलकर गोल रोटी बनाएँ (ग्लूटेन-रहित आटे दो परचमेंट शीटों के बीच सबसे अच्छे बिलते हैं)।
    - गरम तवे पर 1-2 मिनट प्रति तरफ़ सेंकें जब तक भूरे धब्बे न आ जाएँ और यह फूल न जाए।
    - हल्का घी लगाकर गरम परोसें।
