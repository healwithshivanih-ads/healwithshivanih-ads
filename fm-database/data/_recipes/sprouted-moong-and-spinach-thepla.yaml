translations:
  hi:
    name: अंकुरित मूँग और पालक का थेपला
    steps:
    - अंकुरित मूँग को हरी मिर्च, अदरक और लहसुन के साथ दरदरा कूट लें।
    - कटोरे में निकालें और पालक, हरा धनिया, हल्दी, हींग, एक बड़ा चम्मच तेल और नमक
      डालें।
    - आटा और थोड़ा पानी डालकर नरम आटा गूँध लें। 5 मिनट रखें।
    - छोटी-छोटी लोइयाँ बेलकर तवे पर थोड़े तेल के साथ सेंकें।
