steps:
- Roughly crush the sprouts with the chilli, ginger and garlic.
- Tip into a bowl and add the spinach, coriander, turmeric, hing, a tablespoon of
  oil and salt.
- Add the flour and a little water and knead into a soft dough. Rest 5 minutes.
- Roll small portions into rounds and cook on a tawa with a little oil.
