translations:
  hi:
    name: रोज़ का बादाम दूध
    steps:
    - बादाम को भिगोने वाले पानी में कम-से-कम 6 घंटे या रातभर भिगोएँ।
    - भिगोने का पानी छानकर फेंक दें; बादाम धो लें।
    - बादाम को 1 कप ताज़े पानी के साथ हैंड या जार ब्लेंडर से चिकना होने तक ब्लेंड करें।
    - बचा हुआ 3 कप पानी डालें और चिकना व झागदार होने तक फिर ब्लेंड करें।
    - बारीक छलनी या मलमल के कपड़े से छान लें — बहुत चिकने दूध के लिए दो बार छानें। बचा बादाम का चूरा बेकिंग या ब्लेंड किए सूप गाढ़ा करने के लिए रखें।
    - तुरंत इस्तेमाल करें या फ्रिज में 3–5 दिन तक रखें।
