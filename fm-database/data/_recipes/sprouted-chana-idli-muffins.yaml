steps:
- Stir the chana sprouts into the idli batter with the cumin and salt.
- Whisk in the sesame oil really well.
- Pour into lightly greased idli or muffin moulds and steam for 18–20 minutes.
- Serve hot or cold — they are good even without chutney.
