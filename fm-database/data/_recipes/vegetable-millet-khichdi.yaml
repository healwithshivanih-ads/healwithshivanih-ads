steps:
- Rinse the millet and dal together.
- Heat the ghee, crackle the cumin, add the hing, ginger and onion and soften.
- Add all the vegetables with the turmeric and toss for 3 minutes.
- Add the millet, dal, water and salt. Pressure-cook 3 whistles or simmer covered
  25–30 minutes.
- Everything should be soft enough to eat with a spoon. Finish with plenty of coriander.
