steps:
- Heat the oil and add the mustard seeds, cumin, green chillies and curry leaves.
- When they splutter, add the peanuts, potato, sprouts and salt and cook, stirring.
- Add the onion, tomato and vegetables and cook until tender.
- Add the poha and turmeric and toss.
- Sprinkle with lemon juice and top with the coriander.
