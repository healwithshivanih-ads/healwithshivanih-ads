steps:
- Rinse the millet and dal together until the water runs clear.
- Heat the ghee, crackle the cumin, add the hing and ginger.
- Add the vegetables and turmeric and toss for 2 minutes.
- Add the millet, dal, water and salt. Pressure-cook 3 whistles, or simmer covered
  25 minutes.
- Khichdi should be soft and loose — stir in hot water if it tightens. Finish with
  coriander and a little extra ghee.
