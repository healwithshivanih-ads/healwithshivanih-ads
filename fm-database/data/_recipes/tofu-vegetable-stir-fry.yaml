steps:
- Cut every vegetable to a similar thickness so they finish together.
- Sear the tofu in the hot oil until golden on two sides, then lift it out and set
  aside.
- In the same pan, toss the garlic and ginger for 20 seconds, then the beans and carrot
  for 2 minutes.
- Add the capsicum and stir-fry another minute — it should still snap.
- Return the tofu, add the tamari and salt, toss once, and finish with spring onion
  greens.
