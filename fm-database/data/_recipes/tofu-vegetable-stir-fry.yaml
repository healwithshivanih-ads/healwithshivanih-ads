translations:
  hi:
    name: टोफू-सब्ज़ी स्टिर-फ्राई
    steps:
    - हर सब्ज़ी को एक जैसी मोटाई में काटें ताकि साथ-साथ पकें।
    - टोफू को गरम तेल में दो तरफ़ से सुनहरा होने तक सेंकें, फिर निकालकर अलग रख दें।
    - उसी पैन में लहसुन और अदरक को 20 सेकंड चलाएँ, फिर बीन्स और गाजर को 2 मिनट।
    - शिमला मिर्च डालकर एक मिनट और स्टिर-फ्राई करें — यह अब भी कड़क होनी चाहिए।
    - टोफू वापस डालें, तामारी और नमक मिलाएँ, एक बार चलाएँ, और हरी प्याज़ के पत्तों
      से पूरा करें।
