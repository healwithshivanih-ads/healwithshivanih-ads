steps:
- Use millet cooked earlier and cooled — warm millet clumps and turns sticky in a
  stir-fry.
- Get the pan hot, add the oil and the garlic for 20 seconds.
- Toss in the beans and carrot for 2 minutes, then the capsicum for one more.
- Add the cooled millet, tamari, pepper and salt, and toss on high until heated through.
- Finish with spring onion off the heat.
