steps:
- Put 1 tsp sabja seeds into a glass of water.
- Leave to soak for 10-15 minutes. The seeds swell and take on a soft, translucent
  jelly coat — that swelling is the point, so do not rush it.
- Stir and drink, seeds and all. Top up with a little more water if it has gone too
  thick.
servings: 1
one_line: Soaked basil seeds in water — a cooling, mucilage-rich drink that holds
  moisture at the mouth and throat rather than just passing through.
