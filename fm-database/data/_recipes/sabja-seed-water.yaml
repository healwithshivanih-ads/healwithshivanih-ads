notes_for_coach: 'Used for dry mouth. The mucilage coats and HOLDS moisture at the
  mucosa, which is why it helps where plain water does not — a client drinking 3L/day
  still had severe dryness, and reported real relief from sabja (cl-022). TIMING:
  keep it BEFORE 3pm. It is a fluid load like any other, and in a client already waking
  at night to urinate, an evening glass works against her sleep. Always soak — dry
  seeds swell in the throat.'
