steps:
- Sprouts need no pre-boiling — steam them for 5 minutes only, or skip straight to
  the pan if you like them crunchy.
- Splutter the mustard seeds in the coconut oil with the curry leaves.
- Add the onion, ginger and green chilli and soften.
- Add the sprouts with the turmeric and salt and toss on medium for 5–6 minutes.
- Fold in the coconut, lemon juice and coriander off the heat.
