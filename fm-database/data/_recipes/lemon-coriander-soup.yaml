steps:
- Separate the coriander stalks from the leaves — the stalks carry most of the flavour
  and go in early.
- Soften the garlic and onion in the ghee, then add the chopped stalks and fry for
  a minute.
- Add the carrot, cabbage, water and salt and simmer 10 minutes.
- Take the pan off the heat before adding the lemon juice — boiling it turns the soup
  bitter.
- Stir in the coriander leaves and crushed pepper and serve at once.
