steps:
- Rinse the little millet through several changes of water until it runs clear.
- Soak the millet separately, and the urad dal with methi, for 5 hours.
- Grind the dal very light, then the millet fine. Fold together with salt and ferment
  overnight.
- Pour into greased moulds and steam for 12 minutes.
- These are slightly denser than rice idlis — don't overfill the moulds.
