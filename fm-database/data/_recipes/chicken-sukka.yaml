steps:
- Dry-roast the red chillies, coriander seeds, cumin and peppercorns in a pan until
  fragrant, then grind coarsely.
- In the same pan, dry-roast the grated coconut until it turns light brown. Watch
  it — it goes from golden to burnt fast.
- Heat the coconut oil, fry the onion and curry leaves, then the ginger-garlic paste.
- Add the chicken, turmeric, ground spice mix and salt. Cover and cook in its own
  juices for 20 minutes.
- Uncover, add the tamarind and roasted coconut, and keep cooking on medium until
  completely dry and clinging.
