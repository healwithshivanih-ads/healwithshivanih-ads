translations:
  hi:
    name: रोज़ाना चिया पुडिंग
    steps:
    - चिया बीजों को बादाम के दूध में कम-से-कम 5 मिनट भिगोएँ।
    - भीगे बीज, बादाम का दूध और कोई भी मिक्स-इन ब्लेंडर में डालें।
    - तेज़ गति पर 2 मिनट ब्लेंड करें — जितना ज़्यादा ब्लेंड करेंगे, पुडिंग उतनी चिकनी और हल्की होगी।
    - पुडिंग को कुछ मिनट गाढ़ी होने के लिए रखें, फिर कटोरों में परोसें।
    - 'शॉर्टकट: चिया आधी करें और सब कुछ एक जार में हिलाएँ (बिना ब्लेंडर) एक गाढ़ी टैपिओका जैसी पुडिंग के लिए।'
