steps:
- Dice the tomato and cucumber to roughly the same small size — kachumber is judged
  on the knife work.
- Toss them with the green chilli and coriander.
- Add the lemon juice, roasted cumin, black salt and pepper and mix.
- Salt LAST and only just before serving — salted early, the cucumber and tomato weep
  and you get a puddle.
- Serve straight away, cold or at room temperature.
