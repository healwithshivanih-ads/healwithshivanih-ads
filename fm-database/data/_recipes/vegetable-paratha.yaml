translations:
  hi:
    name: मिली-जुली सब्ज़ी पराठा
    steps:
    - आटे में चुटकी भर नमक और पानी डालकर नरम आटा गूँथें, ढककर 15 मिनट रखें।
    - कद्दूकस गाजर, पत्तागोभी, मसले मटर, हरी मिर्च, जीरा पाउडर, धनिया और नमक मिलाकर
      नम भरावन बनाएँ।
    - आटे को 5 लोइयों में बाँटें, हर एक को चपटा करें, सब्ज़ी की भरावन भरें और किनारे
      बंद करें।
    - आटा छिड़ककर धीरे से पराठा बेलें, सब्ज़ियाँ अंदर बराबर टिकी रखें।
    - गरम तवे पर सेंकें, पलटें और दोनों तरफ घी लगाकर सुनहरा और पका होने तक सेंकें।
    - दही या चटनी के साथ गरमागरम परोसें।
