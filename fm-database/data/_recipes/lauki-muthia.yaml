steps:
- Squeeze the grated lauki firmly and KEEP the water — use it to bind the dough instead
  of fresh water.
- Mix the lauki with both flours, the ginger-chilli paste, turmeric, jaggery, lemon
  juice, salt and a teaspoon of oil into a soft dough.
- Shape into two or three cylinders and steam for 18–20 minutes, until a skewer comes
  out clean.
- Cool completely, then slice into rounds — hot muthia crumbles when cut.
- Splutter the mustard and sesame seeds in the remaining oil with the curry leaves,
  toss the slices through until lightly crisp, and finish with coriander.
