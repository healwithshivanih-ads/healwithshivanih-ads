notes_for_coach: 'The plain counterpart to `ash-gourd-vegetable-juice`. That one is
  the everyday hydrating juice; this one is the therapeutic one for acidity, and the
  difference is what is ABSENT — no tomato, no lime, no amla, no ginger, no salt.
  Do not "improve" it by adding them back. TIMING IS CLINICAL, NOT PREFERENCE: ash
  gourd is a diuretic, so this must be taken BEFORE 3pm — a client drinking the mixed
  version at 6-6.30pm was waking repeatedly to urinate and losing sleep, and confirmed
  the link herself by skipping it for one night (cl-022, 23/7/2026). For acidity,
  give it first thing on an empty stomach, 20-30 min before breakfast. JAIN-safe as
  written (ash gourd is a fruit-vegetable, not a root, and there is no ginger, onion
  or garlic) — this is why it carries the `jain` tag and the mixed version does not.
  One glass is a serving; make it fresh each time rather than storing.'
