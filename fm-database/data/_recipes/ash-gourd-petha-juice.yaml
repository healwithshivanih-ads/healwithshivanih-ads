steps:
- Choose a mature ash gourd — the flesh should be white and firm, never spongy or
  yellowing. Peel off the green skin, scoop out the seeds and the soft central pith,
  and cube the white flesh.
- Blend the cubes with just enough water to move the blades. Do not add salt, lime,
  amla, tomato or ginger — the whole point of this version is that nothing sour or
  sharp goes in.
- Strain through a fine sieve, pressing the pulp down firmly.
- Stir in the mint leaves (crushed between the palms first) and the pinch of roasted
  jeera if using. Drink immediately — it separates and turns bitter within the hour.
servings: 1
one_line: Plain white ash gourd juice, taken on an empty stomach — cooling, nothing
  sour in it.
headnote: Ash gourd (kushmanda) is the classical Ayurvedic drink for amlapitta — burning,
  sour eructation, that hot feeling under the breastbone. It works because it is sweet
  and cooling with almost nothing sour about it, so this version deliberately leaves
  out the lime, amla and tomato that make a mixed vegetable juice taste better but
  make it wrong for a burning stomach.
