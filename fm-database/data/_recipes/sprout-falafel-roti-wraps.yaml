translations:
  hi:
    name: अंकुरित फलाफल-स्टाइल रोटी रैप
    steps:
    - अंकुर, हरा धनिया, पुदीना, प्याज़, लहसुन की 4 कलियाँ, हरी मिर्च, अदरक और नमक
      को दरदरा पीस लें।
    - बची हुई लहसुन की कली कसकर दही में चिली सॉस, ओरेगैनो, चिली फ्लेक्स, नमक और काली
      मिर्च के साथ मिलाएँ — यह डिप है।
    - हर रोटी की एक तरफ़ अंकुरों का पेस्ट फैलाएँ और उसी तरफ़ को हल्के तेल लगे तवे
      पर सेंकें।
    - दही की डिप लगाएँ, कटी सब्ज़ियाँ और एवोकाडो रखें और रोल कर लें।
