steps:
- Grind the sprouts, coriander, mint, onion, 4 of the garlic cloves, chillies, ginger
  and salt to a coarse paste.
- Stir the last garlic clove, grated, into the curd with the chilli sauce, oregano,
  chilli flakes, salt and pepper to make the dip.
- Spread the sprout paste over one side of each roti and roast that side on a lightly
  oiled tawa.
- Spread with the curd dip, add the sliced vegetables and avocado, and roll up.
