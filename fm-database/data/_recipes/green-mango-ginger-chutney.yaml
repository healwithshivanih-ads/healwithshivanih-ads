translations:
  hi:
    name: कच्ची कैरी-अदरक की चटनी
    steps:
    - कच्ची कैरियों को छीलकर 1 इंच के टुकड़ों में काट लें। मिर्च को बारीक काट लें (कम तीखेपन के लिए बीज निकाल दें), और अदरक को छीलकर आधा इंच के पतले टुकड़ों में काट लें।
    - सारी सामग्री एक बड़े पतीले में डालें और धीमी आँच पर बिना ढके तब तक पकाएँ जब तक मिश्रण जैम जैसा गाढ़ा न हो जाए — लगभग 1 घंटा। या फिर धीमी कुकर में रातभर पकाएँ।
    - ठंडा करके 16-औंस के काँच के जार में भरकर फ्रिज में रखें। कुछ हफ़्तों में इस्तेमाल कर लें।
