steps:
- Whisk the curd with salt in a deep bowl.
- Heat the oil and add the hing, cumin, garlic, half the chilli powder and the turmeric.
  Pour this tempering over the curd and mix.
- In another bowl mix the boiled chana, the vegetables, the rest of the chilli powder
  and the chaat masala.
- Fold into the curd and top with the coriander.
