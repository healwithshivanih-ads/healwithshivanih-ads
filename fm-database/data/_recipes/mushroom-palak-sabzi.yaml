translations:
  hi:
    name: मशरूम और पालक की भुजिया
    steps:
    - पैन में तेल गरम करके जीरा तड़काएँ, फिर लहसुन और प्याज़ डालें; नरम होने तक भूनें।
    - कटे मशरूम डालें और तेज़ आँच पर तब तक पकाएँ जब तक वे अपना पानी छोड़ दें और वह
      सूख जाए।
    - हल्दी, मिर्च पाउडर, कुटी काली मिर्च और नमक मिलाएँ।
    - कटा पालक डालें और तेज़ आँच पर लगभग 3 से 4 मिनट, नरम होने तक, चलाएँ।
    - बची नमी सुखा दें ताकि सब्ज़ी सूखी रहे, और रोटी के साथ गरम परोसें।
