steps:
- Blend the moong, matki, corn and rice until smooth.
- Pour into a saucepan with 4 cups of water and bring to a boil.
- Add the ragi sprouts and carrot and cook until tender.
- Season well with salt and pepper, add the lemon juice and serve hot.
