steps:
- Mushrooms release a lot of water — cook them in a wide pan, and don't crowd it or
  they will stew.
- Sear the tofu first until golden, then set it aside.
- Add the mushrooms to the hot pan and leave them alone until they colour, then toss
  and let their water cook off completely.
- Add the garlic for 30 seconds, return the tofu, and season with tamari, pepper and
  salt.
- Finish with coriander or spring onion.
