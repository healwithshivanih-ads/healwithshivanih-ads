steps:
- Beat the eggs with the salt and pepper, then stir in the onion, chilli and coriander.
- Heat the ghee in a flat pan and swirl to coat.
- Pour in the mixture and tilt the pan so it spreads evenly. Cook undisturbed for
  2 minutes until the base is set.
- Fold in half, give it another minute, and slide it out.
