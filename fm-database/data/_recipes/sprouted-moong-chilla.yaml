steps:
- Grind the sprouted moong with the ginger and green chilli and a little water to
  a coarse batter — leave some texture.
- Sprouted batter is looser than dal batter; add the rice flour if it won't hold a
  shape.
- Stir in the onion, coriander, cumin and salt.
- Spread on a medium tawa, drizzle ghee at the edges, and cook until set and speckled.
- Flip once and finish. Sprouted chilla browns faster, so keep the heat lower than
  you would for dal chilla.
