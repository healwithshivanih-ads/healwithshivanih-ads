steps:
- Cut the capsicums into 1 cm rings. Mash the chickpea sprouts in a bowl.
- Mix in the vegetables, curd, besan, chaat masala, ajwain, chilli powder and salt.
- Lightly grease a frying pan, lay in a few capsicum rings and fill each with the
  mixture, patting it level. Top with grated paneer.
- Cook on medium heat for 4–5 minutes with a little ghee, flip carefully and cook
  the other side for 4–5 minutes.
- Serve hot with coriander-mint chutney.
