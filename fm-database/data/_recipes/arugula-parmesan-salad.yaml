translations:
  hi:
    name: अरुगुला और पार्मेसन सलाद
    steps:
    - अरुगुला को ठंडे पानी में धोएँ, पानी झाड़कर सुखाएँ और एक बड़े बर्तन में रखें।
    - नींबू का रस, ऑलिव ऑयल, नमक और काली मिर्च को फेंट लें, अरुगुला पर डालें और मिलाएँ।
    - स्वाद अनुसार ऊपर से पार्मेसन कद्दूकस करके छिड़कें।
    - चाहें तो अनार के दाने और सूरजमुखी के बीज डालकर पूरा करें।
