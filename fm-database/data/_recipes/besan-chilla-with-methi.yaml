steps:
- Chop the methi leaves fine and toss them with a pinch of salt. Leave them 5 minutes,
  then squeeze gently — this draws out the water that would otherwise thin the batter,
  and takes the sharpest edge off the bitterness.
- Whisk the besan with the water gradually — adding it all at once guarantees lumps.
- Stir in the methi, onion, chilli, ajwain, turmeric and salt. The batter should coat
  a spoon but pour easily; methi releases a little more water as it sits, so keep
  it a touch thick.
- Heat a tawa on medium, pour a ladleful and spread thin.
- Drizzle ghee around the edge, cook 2 minutes until it lifts, flip and finish.
