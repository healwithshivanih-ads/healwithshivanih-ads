one_line: The everyday besan chilla with a bunch of methi folded through — faintly
  bitter, iron-rich, and steadier on blood sugar than the plain version.
headnote: Fresh methi turns a plain chilla into something with a bitter edge that
  Indian kitchens have always paired with a heavy breakfast. Fenugreek leaves carry
  iron and fibre, and the bitter rasa is the one most missing from a modern plate
  — useful when blood sugar is the thing being worked on. Squeeze the chopped leaves
  before they go in or the batter turns watery.
