translations:
  hi:
    name: टिंडोरा की सब्ज़ी
    steps:
    - कड़ाही में तेल गरम करें, राई डालें और चटकने दें, फिर जीरा, करी पत्ता और हींग
      डालें।
    - प्याज़ डालें और नरम होने तक भूनें।
    - कटा टिंडोरा, हल्दी, मिर्च, धनिया पाउडर और नमक डालें; लपेटने के लिए चलाएँ।
    - ढककर धीमी आँच पर बीच-बीच में चलाते हुए तब तक पकाएँ जब तक टिंडोरा नरम हो जाए,
      लगभग 15 मिनट।
    - ढक्कन हटाएँ, आँच तेज़ करें और तब तक पकाएँ जब तक टुकड़े सूखे और किनारों पर हल्के
      करारे हो जाएँ।
    - रोटी या दाल-चावल के साथ गरम परोसें।
