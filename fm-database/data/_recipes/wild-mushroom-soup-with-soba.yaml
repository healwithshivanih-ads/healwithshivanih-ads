translations:
  hi:
    name: सोबा के साथ जंगली मशरूम सूप
    steps:
    - प्रेशर कुकर में ताज़े मशरूम, 1/4 कप पानी और नमक डालें। तेज़ आँच पर बीच-बीच में
      चलाते हुए तब तक पकाएँ जब तक पानी सूख जाए और मशरूम अपनी नमी छोड़ दें (8–12 मिनट)।
    - आँच मध्यम करें, तेल डालें, और मशरूम को बार-बार चलाते हुए गहरे भूरे होने तक पकाएँ
      (4–6 मिनट)।
    - लहसुन डालें और खुशबू आने तक पकाएँ (करीब 30 सेकंड)। वाइन और सोया सॉस डालें, तली
      से चिपके भूरे अंश खुरचें, और वाइन सूखने तक पकाएँ (करीब 1 मिनट)।
    - बचा 2 क्वार्ट पानी डालें और साबुत काली मिर्च डालें। ढक्कन बंद करें और तेज़ आँच
      पर हाई प्रेशर तक लाएँ।
    - हाई प्रेशर आते ही आँच मध्यम-धीमी करें और 30 मिनट प्रेशर बनाए रखें।
    - बर्तन आँच से हटाएँ और 15 मिनट अपने आप प्रेशर निकलने दें। बचा प्रेशर क्विक रिलीज़
      करें, फिर ढक्कन सावधानी से अपने से दूर की ओर खोलें।
    - सूप को धीमी आँच पर दोबारा उबाल पर लाएँ। कोम्बू डालें और तब तक पकाएँ जब तक वह
      नरम होकर करीब दुगना हो जाए (करीब 10 मिनट)।
    - सूप को महीन छलनी से एक कटोरे में छानें, ठोस अंश को दबाकर ज़्यादा से ज़्यादा
      तरल निकालें। पके मशरूम रखें; कोम्बू और काली मिर्च फेंक दें (या चाहें तो नरम,
      बेरी जैसी काली मिर्च रहने दें)।
    - अलग बर्तन में 2 क्वार्ट ताज़ा पानी उबालें। सोबा नूडल्स डालें और बीच-बीच में
      चलाते हुए बस नरम होने तक पकाएँ (करीब 5 मिनट)। महीन छलनी में छानें और कटोरियों
      में बाँटें।
    - अब खाली प्रेशर-कुकर बर्तन में छना मशरूम शोरबा, रखे पके मशरूम और एनोकी मशरूम
      को मध्यम-धीमी आँच पर उबाल आने तक धीरे गरम करें।
    - हर कटोरी में नूडल्स के ऊपर गरम सूप और मशरूम डालें। ऊपर मूली और हरे प्याज़ डालें।
      चाहें तो तिल का तेल डालकर परोसें।
