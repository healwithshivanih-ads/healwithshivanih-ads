steps:
- Dry-roast the moong dal until fragrant, then rinse it with the millet.
- Pressure-cook the millet and dal with the water and salt for 3 whistles, or simmer
  covered until very soft. Pongal should be soft and loose, not grainy.
- Heat the ghee or coconut oil in a small pan, fry the cashews, then add the cumin, crushed pepper,
  ginger, curry leaves and hing.
- Pour the whole tempering into the cooked pongal and stir it through.
- Loosen with hot water if it tightens as it sits.
