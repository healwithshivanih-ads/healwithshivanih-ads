steps:
- Hang the curd in a muslin for a few minutes if it looks thin — a watery marinade
  slides off the paneer.
- Whisk the curd with the ginger paste, chilli powder, turmeric, garam masala, roasted
  besan and salt.
- Fold in the paneer and capsicum and leave to marinate for 20 minutes at room temperature.
- Heat the oil in a heavy pan and cook the pieces in a single layer, turning once,
  until charred at the edges.
- Squeeze lemon over just before serving.
