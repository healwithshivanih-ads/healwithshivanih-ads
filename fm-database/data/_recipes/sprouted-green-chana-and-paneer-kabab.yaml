steps:
- Mash the cooked chana well in a bowl.
- Add the paneer, carrot, French beans, green chillies, coriander, ginger-garlic paste,
  amchur and salt and mix well.
- Shape into 8 tikkis and press a cashew onto each.
- Shallow-fry in the ghee until golden on both sides. Serve with mint chutney or a
  hung-curd dip.
