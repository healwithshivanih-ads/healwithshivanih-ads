translations:
  hi:
    name: भुनी मेथी
    steps:
    - कड़ाही में तेल गरम करें, जीरा चटकाएँ और हींग डालें।
    - कुटा लहसुन और प्याज़ डालकर नरम और सुनहरा होने तक भूनें।
    - कटी मेथी हल्दी, मिर्च पाउडर और नमक के साथ डालें।
    - बिना ढके मध्यम आँच पर चलाते हुए पकाएँ जब तक पत्ते मुरझा जाएँ और कड़वाहट कम हो
      जाए, लगभग 6 से 8 मिनट।
    - सारी नमी सुखा लें ताकि मेथी नरम रहे पर पानीदार न हो, और रोटी के साथ गरम परोसें।
