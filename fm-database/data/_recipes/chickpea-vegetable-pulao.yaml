translations:
  hi:
    name: छोले-सब्ज़ी पुलाव
    steps:
    - भिगोए चावल का पानी निकालकर अलग रखें; उबले छोले तैयार रखें।
    - एक भारी बर्तन में तेल गरम करें, जीरा, तेजपत्ता, दालचीनी, इलायची और लौंग डालें
      और कुछ सेकंड चटकने दें।
    - कटा प्याज़ डालें और नरम व हल्का सुनहरा होने तक भूनें, फिर अदरक-लहसुन पेस्ट डालकर
      आधा मिनट चलाएँ।
    - कटी सब्ज़ियाँ, हल्दी और नमक डालें और 2 मिनट भूनें।
    - निथारे चावल और छोले डालें और मसालों में हल्के से लपेटते हुए एक मिनट चलाएँ।
    - पानी डालें, उबाल लाएँ, फिर ढककर धीमी आँच पर 12-15 मिनट पकाएँ जब तक चावल नरम
      हो जाए और पानी सूख जाए।
    - आँच बंद कर दें और ढककर 5 मिनट रहने दें, फिर काँटे से हल्के से फुलाएँ और धनिया
      से सजाएँ।
