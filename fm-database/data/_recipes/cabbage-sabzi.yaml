steps:
- Crackle the cumin in the ghee, then soften the onion, ginger and green chilli.
- Add the cabbage and peas with the turmeric, coriander powder and salt.
- Toss well, cover, and cook on low for 8 minutes. Cabbage releases plenty of water
  — don't add any.
- Uncover and cook off any liquid so the sabzi finishes dry.
- Finish with amchur and coriander.
