translations:
  hi:
    name: पत्तागोभी की सब्ज़ी
    steps:
    - घी में जीरा चटकाएँ, फिर प्याज़, अदरक और हरी मिर्च नरम कर लें।
    - पत्तागोभी और मटर डालें, साथ में हल्दी, धनिया पाउडर और नमक।
    - अच्छे से मिलाएँ, ढककर धीमी आँच पर 8 मिनट पकाएँ। पत्तागोभी खूब पानी छोड़ती है
      — पानी न डालें।
    - ढक्कन हटाकर सारा पानी सुखा लें ताकि सब्ज़ी सूखी बने।
    - अमचूर और धनिये से पूरा करें।
