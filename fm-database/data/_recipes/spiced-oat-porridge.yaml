steps:
- Warm the ghee and toast the oats for a minute with the cinnamon, cardamom and ginger
  — toasting stops the porridge tasting flat.
- Add the liquid, dates and the pinch of salt.
- Simmer on low, stirring often, for 8–10 minutes until thick and creamy.
- Add a splash more liquid if it tightens — it thickens further off the heat.
- Serve warm.
