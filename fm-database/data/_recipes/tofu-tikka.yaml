steps:
- Press the tofu under a weight for 10 minutes so it takes the marinade instead of
  shedding water.
- Whisk the curd with the ginger-garlic paste, chilli powder, turmeric, garam masala,
  besan and salt.
- Fold in the tofu, capsicum and onion and leave 20 minutes.
- Cook in a single layer in a hot heavy pan, turning once, until the edges char.
- Finish with lemon juice.
