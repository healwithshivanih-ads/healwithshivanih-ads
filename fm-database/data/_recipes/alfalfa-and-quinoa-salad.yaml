steps:
- Combine the quinoa, vegetables and alfalfa sprouts in a large bowl.
- Shake the salt, pepper, honey, lemon juice, olive oil and chilli flakes together
  in a closed jar.
- Pour the dressing over and toss until everything is coated. Serve straight away.
