  qty: to taste
  unit: ''
steps:
- Sauté the paneer cubes in the ghee with the herbs until lightly golden. Cool.
- Pack the sprouts, vegetables and paneer in a container, drizzle with the olive oil
  and toss lightly.
- Add the salt and toss again only just before eating, so the vegetables stay crisp.
