steps:
- Use the tender stalks as well as the leaves — they carry a lot of the flavour.
- Grind the coriander, green chilli and ginger with as little water as the blender
  will allow.
- Add the cumin powder, salt and lemon juice and pulse once more.
- Taste and adjust the lemon — this chutney should be sharp.
- Keeps 2 days refrigerated; the colour dulls after that.
