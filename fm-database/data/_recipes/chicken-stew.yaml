steps:
- Warm the coconut oil and add the cinnamon and cloves for a few seconds.
- Soften the onion, ginger and green chilli without browning them — a stew should
  stay pale.
- Add the vegetables, crushed pepper and salt with half a cup of water. Cover and
  cook until nearly tender.
- Add the chicken and the coconut milk. Simmer very gently for 20 minutes.
- Drop in the curry leaves at the end and rest the stew off the heat for 10 minutes
  before serving.
