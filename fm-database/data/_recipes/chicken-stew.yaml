steps:
- Warm the coconut oil and add the cinnamon, cloves and cardamom for a few seconds.
  The cardamom is the defining aroma of an ishtu — don't skip it.
- Soften the onion, ginger, green chilli and curry leaves without browning them. A
  stew should stay pale, and the leaves need this time in the oil to carry through
  the coconut milk.
- Add the vegetables, crushed pepper and salt with half a cup of water. Cover and
  cook until nearly tender.
- Add the chicken and the coconut milk. Simmer very gently for 20 minutes.
- Rest the stew off the heat for 10 minutes before serving — it settles and thickens
  slightly.
