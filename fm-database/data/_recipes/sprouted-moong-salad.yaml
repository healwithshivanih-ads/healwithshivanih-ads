steps:
- Steam the sprouts for 4–5 minutes if your digestion is delicate; otherwise use them
  raw.
- Let them cool completely — dressing warm sprouts makes the salad watery.
- Toss with the cucumber, tomato, onion and coriander.
- Dress with lemon juice, roasted cumin, rock salt and the oil if using.
- Serve straight away; it weeps if it stands.
