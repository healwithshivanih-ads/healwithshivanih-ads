one_line: A one-pot Karnataka bisi bele bath built on foxtail millet instead of rice,
  with dal and vegetables carrying the protein and fibre.
headnote: Cooking the millet apart from the dal is the whole trick — it keeps the
  grain distinct instead of collapsing into paste, which is what usually goes wrong
  when rice is swapped for millet in this dish.
