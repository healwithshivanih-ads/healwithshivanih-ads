steps:
- Pressure-cook the toor dal with turmeric and a third of the water until soft, then
  whisk it smooth.
- Cook the soaked millet separately with half the remaining water until tender but
  still holding its shape — about 12 minutes. Keeping it separate stops it turning
  pasty.
- Simmer the vegetables with the tamarind water, sambar powder and salt until just
  tender.
- Fold the dal, millet and vegetables together, loosening with hot water to a soft,
  spoonable consistency.
- Heat the ghee, splutter the mustard seeds, add curry leaves and asafoetida, and
  pour the tempering over. Rest five minutes before serving.
