translations:
  hi:
    name: मशरूम जीरा स्टिर-फ्राई
    steps:
    - एक चौड़ी कड़ाही में मध्यम-तेज़ आँच पर तेल गरम करें। जीरा डालें और 20 सेकंड चटकने
      दें।
    - चीरी हुई हरी मिर्च, अदरक और लहसुन डालें; 1 मिनट भूनें जब तक खुशबू न आए।
    - मशरूम को एक ही परत में डालें। 2–3 मिनट तक न चलाएँ, ताकि एक तरफ़ रंग आ जाए।
    - मशरूम को चलाएँ, हल्दी, धनिया पाउडर, नमक और काली मिर्च छिड़कें, और 4–5 मिनट और
      भूनें जब तक सारी नमी सूख जाए और किनारे हल्के सुनहरे हो जाएँ।
    - आँच बंद करें, नींबू का रस और ताज़ा धनिया डालकर पूरा करें, और तुरंत परोसें।
