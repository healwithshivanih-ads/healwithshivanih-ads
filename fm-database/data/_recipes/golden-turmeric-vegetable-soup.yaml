steps:
- Crackle the cumin in the oil, then soften the onion, garlic and ginger.
- Stir in the turmeric and black pepper together — the pepper is what makes the turmeric
  usable, so don't leave it out.
- Add the lentils, vegetables, water and salt. Simmer 20–25 minutes until the lentils
  have collapsed.
- Blend about half the soup and stir it back in, so it is thick but still has pieces.
- Add the coconut milk and warm through without boiling. Finish with lemon juice and
  coriander.
