steps:
- Splutter the mustard seeds in the coconut oil and add the curry leaves.
- Soften the onion, add the ginger-garlic paste, then the turmeric and coriander powder.
- Add the vegetables with a little water, cover, and cook until just tender.
- Pour in the coconut milk and bring to a bare simmer.
- Slide in the prawns and cook 4 minutes only, until they curl and turn opaque. Finish
  with coriander.
