steps:
- Whisk the besan, curd and water into a batter noticeably thicker than chilla batter
  — it has to hold the toppings.
- Add the cumin and salt and rest 10 minutes.
- Pour a thick round onto a medium tawa. Don't spread it out.
- Scatter the onion, tomato, capsicum, chilli and coriander over the top and press
  them in gently with the back of the ladle.
- Drizzle oil around the edge, cover, and cook until the base is golden. Flip carefully
  and give the topping a minute on the pan.
