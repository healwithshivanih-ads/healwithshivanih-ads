translations:
  hi:
    name: बेसन उत्तपम
    steps:
    - बेसन, दही और पानी को फेंटकर चीले के घोल से काफ़ी गाढ़ा घोल बनाएँ — इसे ऊपर की
      टॉपिंग सँभालनी है।
    - जीरा और नमक डालें और 10 मिनट रखा रहने दें।
    - मध्यम तवे पर एक मोटा गोल घोल डालें। इसे फैलाएँ नहीं।
    - ऊपर से प्याज़, टमाटर, शिमला मिर्च, मिर्च और धनिया बिखेरें और कलछी की पीठ से
      हल्के से दबाएँ।
    - किनारों पर तेल डालें, ढककर तली सुनहरी होने तक पकाएँ। सावधानी से पलटें और टॉपिंग
      वाले हिस्से को तवे पर एक मिनट सिकने दें।
