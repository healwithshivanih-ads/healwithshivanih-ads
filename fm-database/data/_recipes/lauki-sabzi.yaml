steps:
- Taste a raw sliver of lauki before you cook it — discard the whole gourd if it is
  bitter.
- Crackle the cumin in the ghee, add the hing, ginger and green chilli.
- Add the tomato and cook until soft, then the turmeric and coriander powder.
- Add the lauki and salt, cover, and cook 12–15 minutes. Lauki gives out plenty of
  water, so add none.
- Uncover and dry off any excess. Finish with coriander.
