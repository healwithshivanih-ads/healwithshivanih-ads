  qty: '2'
  unit: cup
- item: hot water
  qty: '1.5'
  unit: cup
- item: salt
  qty: '0.25'
  unit: tsp
- item: ghee (optional, to serve)
  qty: '1'
  unit: tsp
steps:
- Bring the water to a rolling boil with the salt — jowar has no gluten, and it is
  the hot water that binds the dough.
- Pour it over the flour and mix with a spoon until cool enough to handle, then knead
  into a smooth, soft dough.
- Keep the dough covered and warm; it cracks as it cools.
- Take a ball and pat it out into a round with wet palms, turning as you go.
- Cook on a hot tawa, turning twice; press gently with a cloth and it should puff.
