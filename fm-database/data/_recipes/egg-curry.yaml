steps:
- Boil, cool and peel the eggs. Prick each one a few times with a fork so the gravy
  gets in.
- Heat the coconut oil, crackle the curry leaves, then brown the onion well.
- Add the ginger-garlic paste, cook off the raw smell, then the tomato, turmeric,
  coriander powder and chilli powder.
- Cook until the tomato breaks down and the oil separates.
- Pour in the coconut milk with the salt, slide the eggs in, and simmer gently for
  6–8 minutes. Don't boil hard or the coconut milk splits.
- Finish with coriander.
