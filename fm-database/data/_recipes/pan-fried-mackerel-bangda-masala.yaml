translations:
  hi:
    name: तवा-तली बांगड़ा मछली मसाला
    steps:
    - सूखी लाल मिर्च, लहसुन, धनिया दाने, जीरा, काली मिर्च, हल्दी, सिरका और नमक को
      पीसकर गाढ़ा चिकना मसाला पेस्ट बनाएँ, ज़रूरत हो तो 1 बड़ा चम्मच पानी डालें।
    - हर बांगड़ा को दोनों तरफ़ हड्डी तक तीन बार तिरछा चीरें; मसाला पेस्ट पूरे ऊपर
      और चीरों में मलें। कमरे के तापमान पर 15 मिनट मैरिनेट करें।
    - एक चपटे, भारी तवे या लोहे के पैन में मध्यम-तेज़ आँच पर तेल गरम करें।
    - मछली को एक परत में रखें और बिना हिलाए 4–5 मिनट तलें जब तक नीचे की तरफ़ गहरी
      परत बन जाए और पैन से आसानी से छूटे।
    - सावधानी से पलटें और दूसरी तरफ़ 4 मिनट और तलें जब तक छिलका कुरकुरा हो और गूदा
      पक जाए — यह रीढ़ के पास से टुकड़ों में टूटना चाहिए।
    - तुरंत नींबू की फाँकों और पतले कटे प्याज़ के छल्लों के साथ परोसें।
