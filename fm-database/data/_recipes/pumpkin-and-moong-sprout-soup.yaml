steps:
- Heat the ghee in a saucepan. Add the cumin, ginger, garlic and green chilli and
  stir for a few seconds.
- Add the pumpkin, onion and carrot and cook for a minute, then the sprouts for another
  minute.
- Add salt, pepper and 2 cups of water. Cover and cook on low until the pumpkin is
  soft.
- Cool, then blend until smooth, thinning with water as needed.
- Reheat and serve topped with spring onion greens, a little grated carrot and a few
  sprouts.
