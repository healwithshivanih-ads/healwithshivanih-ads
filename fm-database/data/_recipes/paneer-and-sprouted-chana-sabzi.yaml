steps:
- Heat the oil and cook the cumin and onion.
- Add the tomato, chilli-ginger paste and salt, cook for a minute, then add the boiled
  chana.
- Stir in the coriander and crumbled paneer and cook one minute more.
- Serve hot, with a vegetable soup alongside.
