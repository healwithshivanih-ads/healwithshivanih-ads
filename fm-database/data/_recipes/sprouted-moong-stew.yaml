steps:
- Soften the onion, ginger and garlic in the olive oil for a minute.
- Add the carrot, potato, tomato and coriander and keep cooking.
- Add the salt and dry spices, pour in a cup of water and bring to a boil.
- Add the sprouts, cover and cook until everything is tender.
- Stir in the lemon juice and serve with rice.
