steps:
- Warm the almond milk gently with the crushed cardamom — bring it to steaming, never
  to a boil.
- Soften the dates in the warm milk for 5 minutes, then blend the whole thing smooth.
- Return to the pan and warm through again if it has cooled.
- Grate the nutmeg over at the very end — nutmeg loses its calming aroma if boiled,
  and a pinch is enough.
- Stir in the ghee if using, and drink warm about an hour before bed.
