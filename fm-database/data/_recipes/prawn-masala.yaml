steps:
- Pat the prawns dry and toss them with a little turmeric and salt while you start
  the masala.
- Brown the onion well in the coconut oil, then add the ginger-garlic paste.
- Add the tomato and the powdered spices and cook until thick and the oil separates.
- Add the prawns and cook on high for 4–5 minutes ONLY — prawns turn to rubber if
  you keep going.
- Finish with garam masala and coriander.
