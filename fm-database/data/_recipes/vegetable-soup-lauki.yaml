steps:
- Rinse the moong dal — a small handful gives the broth body without making it heavy.
- Crackle the cumin in the ghee, add the ginger and turmeric.
- Add all the vegetables and the dal with the water and salt.
- Simmer uncovered 20 minutes until the dal has broken down and the vegetables are
  tender but still hold their shape.
- Do NOT blend this one. Finish with pepper and coriander.
