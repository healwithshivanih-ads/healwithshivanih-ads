steps:
- Mix the millet flour, besan, onion, herbs, chilli, cumin and salt together dry so
  the onion moisture starts loosening the flour.
- Add water a little at a time and knead to a soft, pliable dough. It should feel
  slightly sticky rather than stiff.
- Take a lemon-sized ball and pat it out directly on a greased banana leaf or square
  of parchment with wet fingers, into a thin round.
- Invert onto a hot tawa, peel the leaf away, and drizzle oil around the edge.
- Cook until brown spots appear, flip once, and serve hot with chutney.
servings: '3'
prep_time_min: 15
cook_time_min: 15
good_for:
- blood-sugar-regulation
- satiety-and-weight
one_line: A hand-patted savoury millet flatbread studded with onion and curry leaf,
  pressed thin on a banana leaf rather than rolled.
headnote: Patting rather than rolling is the point — millet flour has no gluten to
  hold a rolled sheet together, so it tears under a pin but behaves perfectly under
  wet fingers. The besan adds enough binding to make it forgiving.
