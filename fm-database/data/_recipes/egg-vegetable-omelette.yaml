steps:
- Deseed the tomato before dicing — the seeds release water and loosen the omelette.
- Heat the ghee and toss the onion, capsicum and chilli for 3 minutes until they soften
  but keep some bite.
- Add the tomato and cook for another minute.
- Beat the eggs with the turmeric and salt, pour over the vegetables, and cook on
  low until set underneath.
- Fold, finish for a minute, and scatter with coriander.
