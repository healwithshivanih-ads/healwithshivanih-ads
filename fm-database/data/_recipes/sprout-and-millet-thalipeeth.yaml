steps:
- Grind the sprouts, garlic, chillies, ginger and curry leaves to a coarse paste with
  very little water.
- Tip into a deep bowl and add the flours, onion, coriander, dry spices, salt and
  2 tablespoons of oil. Knead lightly into a soft dough without adding more water.
- Divide into 6. Pat one portion flat on a wet cloth and poke a small hole in the
  centre.
- Lift it onto a hot tawa and cook both sides, brushing lightly with oil, until golden.
  Serve hot.
