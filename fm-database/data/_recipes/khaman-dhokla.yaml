translations:
  hi:
    name: खमन ढोकला
    steps:
    - एक बड़े कटोरे में बेसन, दही, पानी, अदरक-मिर्च पेस्ट, हल्दी, चीनी, नमक और नींबू का रस मिलाकर चिकना, बिना गुठली वाला बहने लायक घोल बनाएँ। ढककर कमरे के तापमान पर 30 मिनट रखें ताकि हल्का खमीर उठे।
    - एक स्टीमर में 2 इंच पानी डालकर उबाल लाएँ। एक गोल 20 सेमी केक टिन या थाली को तेल से अच्छी तरह चिकना करें।
    - भाप देने से ठीक पहले घोल पर ईनो फ्रूट सॉल्ट छिड़कें। ईनो पर 1 बड़ा चम्मच पानी डालें और एक दिशा में करीब 15 सेकंड तेज़ी से चलाएँ जब तक घोल झागदार हो जाए — ज़्यादा न मिलाएँ। तुरंत चिकने टिन में डालें।
    - टिन को स्टीमर में रखें, ढक्कन लगाएँ, और मध्यम-तेज़ आँच पर 18-20 मिनट भाप दें। बीच में टूथपिक डालें — साफ निकलनी चाहिए। टिन से निकालकर थाली पर पलटने और चौकोर काटने से पहले 5 मिनट रखें।
    - तड़के के लिए एक छोटे पैन में 2 बड़े चम्मच तेल गरम करें। राई डालें; तड़कने पर तिल, हरी मिर्च और करी पत्ता डालें। 20 सेकंड चलाएँ, फिर 3 बड़े चम्मच पानी और 1 छोटा चम्मच चीनी डालें। 10 सेकंड उबलने दें और तड़का ढोकले के टुकड़ों पर समान रूप से डालें।
    - ताज़ा धनिया और कद्दूकस नारियल से सजाएँ। साथ में हरी चटनी के साथ गरमागरम परोसें।
