steps:
- Sear the prawns in half the oil for 2 minutes until they just curl, then push them
  to one side of the pan.
- Add the remaining oil and the garlic to the empty side for 20 seconds.
- Pour the beaten eggs in and scramble them softly, then fold everything together.
- Season with tamari, pepper and salt, and finish with the spring onion off the heat.
