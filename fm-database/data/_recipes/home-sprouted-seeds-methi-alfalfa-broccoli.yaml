steps:
- Put the seeds in the sprouting jar and cover with clean drinking water. Seeds need
  a shorter soak than beans — 4 to 6 hours, or overnight at the most.
- Drain with the jar at a slant until no water is left, then rinse with fresh water
  and drain again.
- Rinse and drain two to three times a day. Seeds are small and hold water, so leave
  the jar slanted between rinses to keep them draining.
- Harvest when the roots are longer than the seed — usually 3 to 5 days. Methi grows
  long, mild-bitter shoots; alfalfa and broccoli stay fine and delicate.
- 'Store airtight in the fridge: methi sprouts keep 7 days, alfalfa 3 days, broccoli
  2 days.'
- Seed sprouts are usually eaten raw. To be on the safe side, dip them in hot water
  for 10–15 seconds first, especially after a few days in the fridge.
