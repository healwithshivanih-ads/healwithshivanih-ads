translations:
  hi:
    name: परवल की सब्ज़ी
    steps:
    - कड़ाही में तेल गरम करें और राई डालें; चटकने पर जीरा और हींग डालें।
    - कटा प्याज़ डालें और नरम व पारदर्शी होने तक भूनें।
    - परवल, हल्दी, मिर्च, धनिया पाउडर और नमक डालें; अच्छी तरह मिलाएँ।
    - ढककर धीमी आँच पर बीच-बीच में चलाते हुए परवल के नरम होने तक पकाएँ, करीब 15 मिनट।
    - ढक्कन हटाकर बची नमी सुखाएँ ताकि टुकड़े किनारों पर हल्के भूरे हो जाएँ।
    - ताज़ा धनिया डालकर पूरा करें और रोटी या चावल के साथ गरम परोसें।
