steps:
- Soak the rice and the dal-with-methi separately for 5 hours. If using whole ragi,
  soak that too.
- Grind the dal to a light aerated paste, then the rice and ragi finer.
- Combine gently with salt and ferment overnight. Ragi batter looks darker and rises
  less dramatically than white idli batter — that's normal.
- Pour into greased moulds and steam 12–14 minutes.
- Rest 2 minutes before unmoulding or they tear.
