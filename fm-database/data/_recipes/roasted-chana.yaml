translations:
  hi:
    name: भुना चना और बीज मिश्रण
    steps:
    - अगर बाज़ार का भुना चना इस्तेमाल कर रहे हैं, तो बस कद्दू और सूरजमुखी के बीज के
      साथ एक छोटे कटोरे में मिला लें।
    - ताज़ा भूनने के लिए — सूखे चने रात भर भिगोएँ, निथारें और पोंछकर सुखाएँ। थोड़े
      घी और सेंधा नमक में मिलाएँ।
    - बेकिंग ट्रे पर एक परत में फैलाएँ और 350°F (175°C) पर 20-25 मिनट भूनें, बीच में
      एक बार चलाएँ, जब तक सुनहरे और कुरकुरे हो जाएँ। रखने से पहले पूरी तरह ठंडा करें।
    - खाने से ठीक पहले भुना चना बीजों के साथ मिलाएँ — एक कुरकुरा, प्रोटीन से भरपूर
      नाश्ता।
