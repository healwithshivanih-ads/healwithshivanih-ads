steps:
- If using store-bought roasted chickpeas, simply combine with the pumpkin and sunflower
  seeds in a small bowl.
- To roast fresh — soak dried chickpeas overnight, drain, and pat dry. Toss with a
  light coating of ghee and rock salt.
- Spread on a baking tray in a single layer and roast at 350°F (175°C) for 20-25 minutes,
  stirring halfway, until golden and crisp. Cool completely before storing.
- Mix roasted chana with the seeds just before eating for a crunchy, protein-rich
  snack.
