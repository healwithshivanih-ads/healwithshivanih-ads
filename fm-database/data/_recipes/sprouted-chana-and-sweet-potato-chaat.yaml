steps:
- Spread the chana, sweet potato, moong and matki sprouts in a flat dish.
- Scatter over the mint and a little chaat masala, then spoon over the curd.
- Sprinkle with more chaat masala, drizzle with the tamarind chutney and finish with
  the roasted cumin powder. Serve straight away.
