steps:
- Heat the ghee, add the cumin and then both kinds of chana. Stir well.
- Sprinkle over the salt and all the dry spices.
- Add 3 tablespoons of water, stir, cover and cook for 1 minute.
- Serve warm or cold with the lemon juice squeezed over.
