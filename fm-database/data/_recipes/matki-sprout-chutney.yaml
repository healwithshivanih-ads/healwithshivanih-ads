steps:
- Steam the matki sprouts for 3–4 minutes and cool them.
- Sauté the garlic cloves in the ghee.
- Grind everything together with one ice cube until smooth — the ice keeps the chutney
  bright green.
- Serve on cucumber slices, or as a dip with vegetable sticks.
