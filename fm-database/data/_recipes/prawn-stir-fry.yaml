steps:
- Pat the prawns properly dry — wet prawns steam and go tough.
- Get the pan very hot, add the oil, then the garlic and curry leaves for 20 seconds.
- Add the prawns in one layer with the turmeric and salt. Leave them undisturbed for
  90 seconds.
- Turn once, add the crushed pepper, and cook another 2 minutes until just opaque.
- Squeeze lemon over and serve straight away.
