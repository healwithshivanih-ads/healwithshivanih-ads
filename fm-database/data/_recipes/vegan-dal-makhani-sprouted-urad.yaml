  qty: '2'
  unit: tbsp
steps:
- Blend the tomatoes and garlic with half a cup of the steamed sprouts until smooth.
- Heat the oil, add the cumin and then the paste. Cook for 2 minutes.
- Add the chilli powder, salt and the rest of the sprouts with 1–2 cups of water,
  depending on how thick you like it.
- Simmer 10 minutes. Adjust the salt, add the lemon juice and serve hot.
