    steps:
    - चारों ब्रेड स्लाइस पर हरी चटनी अच्छे से लगाएँ।
    - दो स्लाइस पर खीरा, टमाटर, प्याज़, शिमला मिर्च और आलू की परत लगाएँ।
    - सब्ज़ियों पर चाट मसाला, नमक और काली मिर्च छिड़कें।
    - बची स्लाइस से ढकें, दबाएँ, आधा काटें, परोसें। चाहें तो पैन में सेकें।
