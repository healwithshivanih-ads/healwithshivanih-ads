translations:
  hi:
    name: अंकुरित मूँग की भरावन वाला पालक डोसा
    steps:
    - भरावन के लिए एक छोटा चम्मच तेल गरम करें, सब्ज़ियाँ और अंकुरित मूँग डालकर 2 मिनट
      पकाएँ। नमक और काली मिर्च डालकर अलग रखें।
    - बाक़ी तेल गरम करके अदरक और हरी मिर्च, फिर पालक और हरा धनिया 2 मिनट पकाएँ। नमक
      डालें, ठंडा करके बारीक पीस लें।
    - पालक की यह प्यूरी डोसे के घोल में अच्छी तरह मिलाएँ।
    - पतले डोसे बनाएँ, भरपूर भरावन और थोड़ा कसा पनीर रखें, मोड़ें और चटनी के साथ परोसें।
