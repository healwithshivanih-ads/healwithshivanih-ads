steps:
- For the filling, heat a teaspoon of oil, add the vegetables and sprouts and cook
  2 minutes. Season with salt and pepper and set aside.
- Heat the remaining oil and cook the ginger and green chillies, then the spinach
  and coriander, for 2 minutes. Add salt, cool and grind smooth.
- Whisk the spinach puree into the dosa batter.
- Make thin dosas, add a generous spoonful of filling and a sprinkle of paneer, fold
  and serve with chutney.
