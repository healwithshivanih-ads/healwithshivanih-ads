translations:
  hi:
    name: सादा पराठा
    steps:
    - आटे में चुटकी भर नमक मिलाएँ, धीरे-धीरे पानी डालकर नरम, मुलायम आटा गूँधें।
    - ढककर 15 मिनट रखें, फिर 5 लोइयाँ बनाएँ।
    - एक लोई को गोल बेलें, घी लगाएँ, आटा छिड़कें, तिकोना या गोल मोड़ें, फिर दोबारा
      बेलें।
    - गरम तवे पर तब तक सेंकें जब तक हल्के बुलबुले आएँ, पलटें और घी लगाएँ।
    - हल्का दबाएँ और दोनों तरफ परतदार व सुनहरा होने तक सेंकें।
    - किसी भी सब्ज़ी, दाल या दही के साथ गरम परोसें।
