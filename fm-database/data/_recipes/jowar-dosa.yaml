steps:
- Whisk the jowar flour, rice flour, curd and water to a thin batter with no lumps.
- Add the cumin, green chilli, coriander and salt, and rest for 15 minutes so the
  flour hydrates.
- The batter thickens as it stands — loosen it with a splash of water before each
  dosa.
- Pour onto a hot tawa and spread gently; jowar batter is more fragile than rice batter,
  so work from the centre outward without pressing.
- Oil the edges and cook until it lifts cleanly.
