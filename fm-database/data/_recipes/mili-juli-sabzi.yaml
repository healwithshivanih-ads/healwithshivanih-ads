steps:
- Heat the oil and add the cumin and onion.
- Add the potato, tomato, carrot, cauliflower and peas with the dry spices and salt.
  Stir, then add half to one cup of water.
- Add the moong sprouts, cover and cook until the vegetables and sprouts are tender.
- Squeeze over the lemon juice and serve.
