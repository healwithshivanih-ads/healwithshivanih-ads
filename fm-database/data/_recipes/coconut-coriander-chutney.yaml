steps:
- Grind the coconut, coriander, roasted chana dal, green chilli, ginger, tamarind
  and salt with the water to a smooth chutney.
- The roasted chana dal is what gives it body — without it the chutney separates.
- Adjust with more water to the consistency you want.
- For the tempering, splutter the mustard seeds in the coconut oil with the red chilli
  and curry leaves.
- Pour the tempering over the chutney and stir it in just before serving.
