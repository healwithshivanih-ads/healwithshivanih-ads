- item: clean drinking water, for soaking and rinsing
  qty: '4'
  unit: cup
steps:
- Pick over the beans and put them in a sprouting jar, filling no more than a third
  of it — they swell and need air. Cover well with clean drinking water and leave
  upright overnight (7–8 hours).
- Next morning pour off all the water. Refill with fresh water, swirl and drain straight
  away, then rest the jar at a slant for 6–8 minutes so the last of the water runs
  out.
- Stand the jar upright, out of direct sun. Rinse and drain fully like this twice
  a day — morning and night is enough. Water left sitting in the jar is what makes
  sprouts sticky.
- Carry on for 2–3 days, depending on the weather. Moong shows tails after about 24
  hours; the sprouts are ready when the root is longer than the bean.
- 'Store in an airtight box in the fridge: moong and matki keep 3 days, chana 2 days.
  Steam or lightly boil bean sprouts before eating — a few minutes, not until mushy.'
- Wash the jar and lid with warm soapy water after every batch (not boiling water,
  the glass can crack).
