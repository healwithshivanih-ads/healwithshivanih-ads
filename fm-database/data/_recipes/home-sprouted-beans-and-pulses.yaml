one_line: 'The basic method for moong, matki, masoor, chana, urad and horsegram: soak
  overnight, then rinse and drain twice a day for 2–3 days.'
headnote: Good beans, clean drinking water and a full drain after every rinse are
  the whole method. If a batch fails, the beans are usually the reason — old or poor-quality
  beans do not sprout.
