translations:
  hi:
    name: घर पर अंकुरित दालें और चने (मूँग, मटकी, मसूर, चना)
    steps:
    - दाने बीनकर अंकुरित करने वाले जार में डालें, जार एक-तिहाई से ज़्यादा न भरें —
      दाने फूलते हैं और उन्हें हवा चाहिए। साफ़ पीने का पानी भरकर जार को सीधा रखें
      और रात भर (7–8 घंटे) भिगोएँ।
    - सुबह सारा पानी निकाल दें। ताज़ा पानी भरें, हिलाएँ और तुरंत निकाल दें, फिर जार
      को 6–8 मिनट तिरछा रखें ताकि बचा हुआ पानी भी निकल जाए।
    - जार को सीधा रखें, सीधी धूप से दूर। दिन में दो बार इसी तरह धोकर पूरा पानी निकालें
      — सुबह और रात काफ़ी है। जार में रुका पानी ही अंकुरों को चिपचिपा बनाता है।
    - मौसम के हिसाब से 2–3 दिन ऐसा करते रहें। मूँग में करीब 24 घंटे में अंकुर दिखने
      लगते हैं; जब जड़ दाने से लंबी हो जाए तो अंकुर तैयार हैं।
    - 'एयरटाइट डिब्बे में फ्रिज में रखें: मूँग और मटकी 3 दिन, चना 2 दिन चलता है। खाने
      से पहले दालों के अंकुर भाप में या हल्का उबाल लें — कुछ मिनट, गलने तक नहीं।'
    - हर बार के बाद जार और ढक्कन को गुनगुने साबुन के पानी से धोएँ (उबलता पानी नहीं,
      काँच चटक सकता है)।
