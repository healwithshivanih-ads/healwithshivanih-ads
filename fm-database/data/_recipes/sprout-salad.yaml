translations:
  hi:
    name: अंकुरित सलाद
    steps:
    - मिले-जुले अंकुरों को हल्की भाप दें — अंकुर कच्चे की तुलना में भाप देने पर पाचन
      के लिए हल्के होते हैं।
    - खीरा, नींबू का रस, भुना जीरा और सेंधा नमक के साथ मिलाएँ।
    - ताज़ी जड़ी-बूटियाँ और थोड़ा तेल (अगर डाल रहे हों) मिलाएँ। ताज़ा परोसें।
