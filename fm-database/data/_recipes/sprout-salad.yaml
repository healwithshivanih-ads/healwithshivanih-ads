steps:
- Steam the mixed sprouts lightly — sprouts are gentler on digestion steamed than
  raw.
- Toss with cucumber, lemon juice, roasted cumin, and rock salt.
- Fold through fresh herbs and a touch of oil if using. Serve fresh.
