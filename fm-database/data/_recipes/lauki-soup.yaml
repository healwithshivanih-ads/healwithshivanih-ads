  unit: tbsp
steps:
- Taste a raw sliver of the lauki first — if it is bitter at all, discard it. Bitter
  lauki is genuinely unsafe.
- Crackle the cumin in the ghee, add the onion and soften.
- Add the lauki, water and salt. Simmer covered for 15 minutes until completely soft.
- Blend smooth, return to the pan, and adjust with hot water to the thickness you
  want.
- Finish with pepper and coriander.
