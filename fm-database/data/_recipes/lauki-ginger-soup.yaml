steps:
- Check the lauki for bitterness before you start.
- Crackle the cumin in the ghee, then add most of the ginger and the green chilli
  and fry for a minute.
- Add the lauki, water and salt, and simmer covered 15 minutes.
- Blend smooth, then return to the heat with the crushed pepper.
- Finish with the remaining raw ginger, lemon juice and coriander stirred in off the
  heat — that late ginger is what makes this different from a plain lauki soup.
