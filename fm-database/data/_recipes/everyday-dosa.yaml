translations:
  hi:
    name: रोज़ का डोसा
    steps:
    - चावल और मूँग को महीन छलनी में दो बार धोएँ जब तक पानी साफ न आए, फिर साथ में ताज़े पानी में कम से कम 6 घंटे या रात भर भिगोएँ।
    - भीगे चावल और मूँग का पानी निथारकर धो लें।
    - मिश्रण को पानी, नमक और चाहें तो धनिया के साथ फूड प्रोसेसर में तेज़ गति पर 5 मिनट पीसें (या ब्लेंडर में थोड़ा-थोड़ा करके) जब तक पैनकेक बैटर जैसा चिकना घोल न बने — कम से कम 3 मिनट पीसें।
    - घोल को एक कटोरे में निकालें, कपड़े से ढककर किसी गरम जगह पर 8-12 घंटे या रात भर खमीर उठने के लिए रखें।
    - पकाने के समय एक सेरामिक नॉन-स्टिक पैन मध्यम आँच पर गरम करें और 0.5 छोटा चम्मच नारियल तेल डालें; सतह पर पानी की कुछ बूँदें छिड़कें — जब वे छनछनाएँ तो पैन तैयार है।
    - करीब 1/3 कप घोल डालें और पैन घुमाकर या चम्मच की पीठ से पतला और गोल फैलाएँ।
    - जब बुलबुले उठें और किनारे पैन से अलग होने लगें तब देखें कि नीचे की सतह सुनहरी-भूरी हो गई है — करीब 5 मिनट।
    - ज़्यादा कुरकुरा चाहें तो पलटकर कुछ मिनट और पकाएँ।
    - तुरंत परोसें या बाकी बनाते समय गरम ओवन में एक के ऊपर एक रखकर गरम रखें।
