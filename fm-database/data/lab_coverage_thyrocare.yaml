# FM marker -> Thyrocare coverage (PRIMARY lab). Same contract as lab_coverage.yaml
# (Acumen, the backup): keys = EXACT LAB_PANELS marker names (what lands in
# requested_labs); coverage = in_base | addon:<slug> | profile_only | not_at_lab.
# A missing key => unknown => routed to requisition (safe default).
# in_base = inside Aarogyam F Pro + fasting glucose (verified against a real
# F Pro report, 17 Nov 2026). addon slugs = lab_providers/thyrocare.yaml#addon_tests.
# not_at_lab re-checked against the ThyroNXT catalogue 18 Nov 2026.
markers:
  # Thyroid
  "TSH": { coverage: in_base }
  "Free T3": { coverage: in_base }
  "Free T4": { coverage: in_base }
  "Reverse T3": { coverage: not_at_lab }
  "TPO Antibodies": { coverage: addon:thyroid-antibodies }
  "Thyroglobulin Antibodies": { coverage: addon:thyroid-antibodies }
  "TSI (Thyroid Stimulating Immunoglobulin)": { coverage: addon:thyroid-antibodies }  # TRAb in the Autoimmune Thyroid panel
  # Metabolic
  "Fasting Glucose": { coverage: in_base }
  "Fasting Insulin": { coverage: in_base }
  "HbA1c": { coverage: in_base }
  "C-Peptide": { coverage: addon:c-peptide }
  "Post-prandial Glucose + Insulin (2-hr)": { coverage: addon:insulin-pp }
  "Glucose Tolerance Test with Insulin Response (GTT-IR)": { coverage: not_at_lab }
  "HOMA-IR (Insulin Resistance Index)": { coverage: in_base }
  "QUICKI (Quantitative Insulin Sensitivity Check Index)": { coverage: in_base }
  "Adiponectin": { coverage: not_at_lab }
  "hsCRP (high-sensitivity CRP)": { coverage: in_base }
  "Homocysteine": { coverage: in_base }
  "ESR": { coverage: addon:esr }
  "Fibrinogen": { coverage: not_at_lab }
  "GGT": { coverage: in_base }
  "Uric Acid": { coverage: in_base }
  "Mycotoxin Panel": { coverage: not_at_lab }
  # Lipids
  "Total Cholesterol": { coverage: in_base }
  "LDL Cholesterol": { coverage: in_base }
  "HDL Cholesterol": { coverage: in_base }
  "Triglycerides": { coverage: in_base }
  "VLDL": { coverage: in_base }
  "ApoB": { coverage: in_base, slug: apob }
  "ApoA1": { coverage: in_base }
  "Lp(a) — Lipoprotein(a)": { coverage: in_base, slug: lp-a }
  "NMR LipoProfile": { coverage: not_at_lab }
  # Blood, liver, kidney
  "CBC with Differential": { coverage: in_base }
  "Reticulocyte Count": { coverage: addon:reticulocytes }
  # F Pro has sodium + chloride but no potassium / bicarbonate.
  "Comprehensive Metabolic Panel (CMP)": { coverage: addon:potassium }
  "Liver Function Tests (LFT)": { coverage: in_base }
  "Cystatin C": { coverage: addon:cystatin-c }
  "BUN / Creatinine Ratio (UCAR)": { coverage: in_base }
  "eGFR (CKD-EPI)": { coverage: in_base }
  "Urinary Albumin / Creatinine Ratio (UACR)": { coverage: addon:urine-microalbumin }
  "Urine Routine": { coverage: addon:urine-routine }
  # Nutrients
  "Vitamin D (25-OH)": { coverage: in_base }
  "Vitamin B12": { coverage: in_base }
  "MMA (Methylmalonic Acid)": { coverage: not_at_lab }
  "Active B12 (Holotranscobalamin)": { coverage: addon:active-b12 }
  "RBC Folate": { coverage: not_at_lab }
  "Ferritin": { coverage: in_base }
  "Serum Iron": { coverage: in_base }
  "TIBC / Transferrin Saturation": { coverage: in_base }
  "RBC Magnesium": { coverage: not_at_lab }
  "Zinc (Plasma)": { coverage: addon:zinc }
  "Copper / Cu:Zn Ratio": { coverage: addon:copper }
  # F Pro's 22-element panel includes selenium and the toxic metals.
  "Selenium": { coverage: in_base }
  "Heavy Metals Panel": { coverage: in_base }
  "Iodine (Urinary)": { coverage: not_at_lab }
  "Omega-3 Index": { coverage: not_at_lab }
  # Sex hormones
  "Estradiol (E2)": { coverage: addon:estradiol-e2 }
  "Progesterone": { coverage: addon:progesterone }
  "FSH": { coverage: addon:fsh }
  "LH": { coverage: addon:lh }
  "AMH (Anti-Müllerian Hormone)": { coverage: addon:amh }
  "17-OH Progesterone": { coverage: addon:17-oh-progesterone }
  "Total Testosterone": { coverage: addon:total-testosterone }
  "Free Testosterone": { coverage: addon:free-testosterone }
  "SHBG": { coverage: addon:shbg }
  "DHEA-S": { coverage: addon:dhea-s }
  "Prolactin": { coverage: addon:prolactin }
  "Estradiol (E2) — for men": { coverage: addon:estradiol-e2 }
  # Adrenal
  "Morning Cortisol (8am, fasting)": { coverage: addon:am-cortisol }
  "DUTCH Test (Dried Urine)": { coverage: not_at_lab }
  "Salivary Cortisol 4-point": { coverage: not_at_lab }
  "Aldosterone + Renin": { coverage: addon:aldosterone-renin }
  "Pregnenolone": { coverage: not_at_lab }
  # Genetics / functional
  "MTHFR Gene Variants": { coverage: not_at_lab }
  "COMT Gene Variants": { coverage: not_at_lab }
  "MTR / MTRR Gene Variants": { coverage: not_at_lab }
  "Organic Acid Test (OAT)": { coverage: not_at_lab }
  # Autoimmune — ANA + anti-CCP + RF are inside F Pro
  "ANA (Anti-Nuclear Antibodies)": { coverage: in_base }
  "ENA Panel": { coverage: not_at_lab }
  "Anti-CCP": { coverage: in_base }
