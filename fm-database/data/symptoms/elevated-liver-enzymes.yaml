category: metabolic
severity: concerning
description: |
  ALT and/or AST above the FM-optimal ceiling (about 20 U/L) or above the
  lab's own limit. It means liver (or, for AST, muscle) cells are leaking
  enzyme; it is a signal of cell stress, not a diagnosis.

  Most common causes in coaching practice: liver fat with insulin
  resistance, alcohol, medicines and herbal supplements, hard exercise in the
  last week, coeliac disease, thyroid disease. Statins can raise ALT, usually
  mildly; serious statin liver injury is rare.

  The pattern matters: ALT above AST points to fatty liver; AST above ALT
  (ratio over 2) to alcohol; AST alone with high CK to muscle. FIB-4 (age,
  AST, ALT, platelets) tells whether scarring needs checking.
when_to_refer: |
  Refer to the clinician if ALT or AST are above the lab's upper limit on two
  tests, more than about 3 times the limit once, rising between tests, or
  come with jaundice, dark urine, itching, pain under the right ribs, or a
  new medicine or herb. Also refer when AST/ALT is above 2, or FIB-4 is 1.3
  or more. Same day for muscle pain with weakness or dark urine.
