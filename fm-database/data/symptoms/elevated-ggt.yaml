category: metabolic
severity: concerning
description: GGT (gamma-glutamyl transferase) above the functional-medicine optimal ceiling of about 16 U/L, read in bands
  (17-25 borderline, above 25 elevated, above the lab's own upper limit for the clinician). Often silent; sometimes comes
  with fatigue, chemical sensitivity or a fatty-liver picture. It signals stress on the glutathione system and the liver
  (most often alcohol, liver fat and insulin resistance, bile-flow problems, enzyme-inducing medicines, or low antioxidant
  intake and high toxic load) and, even inside the normal range, predicts diabetes and cardiovascular risk. It never says
  which cause on its own.
when_to_refer: Refer if GGT is above the lab's upper limit, rising between tests, several times the upper limit, or comes
  with raised ALP or bilirubin, jaundice, dark urine, pale stools or pain under the right ribs.
