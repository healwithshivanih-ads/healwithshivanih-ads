notes_for_coach: 'When a client reports this, resist reaching for the remedy shelf.
  Ask instead whether it is worse on blinking and whether it is one eye or both — a
  one-sided, blink-linked sensation is a physical-cause story and belongs with an
  ophthalmologist. Every home eyewash and oil in this catalogue is contraindicated in
  an active eye problem, and a breached corneal surface is exactly that.'
