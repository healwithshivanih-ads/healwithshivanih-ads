category: other
severity: concerning
description: The persistent sense that something is in the eye — sand, an eyelash, grit
  — typically worst on blinking. Distinct from generalised dryness or burning because
  it is localised and blink-linked, which points towards something physically present
  on or under the lid rather than a purely tear-film problem. Causes include an actual
  foreign body, a conjunctival concretion erupting through the surface, a corneal
  abrasion, in-turned lashes, and severe dry eye.
when_to_refer: 'Refer rather than manage. Same-day if there is pain, vision change or
  light sensitivity — a blink-linked foreign body sensation can mean the corneal
  epithelium is being abraded, and that can ulcerate. Rated concerning rather than
  common for this reason: it is the one eye symptom that most often has a removable
  physical cause, and the fix is a procedure, not a remedy.'
