notes_for_coach: 'The reframe clients find genuinely surprising and useful: "your eyes
  are watering BECAUSE they are dry". Without it, a client will reject dry-eye advice
  out of hand — she knows her eyes are wet. Worth saying out loud before any other
  suggestion lands.'
