category: other
severity: common
description: Excessive tearing or overflow of tears down the cheek. Counter-intuitively
  this is more often a sign of DRY eye than of wet eye — when the tear film is unstable
  or the ocular surface is irritated, the lacrimal gland fires off a reflex flood of
  watery tears that lack the oil needed to stay put. Also seen with blocked meibomian
  glands, lid-margin inflammation, a foreign body or concretion abrading the surface,
  allergy, and true tear-drainage obstruction.
when_to_refer: Watering with pain, vision change or light sensitivity; discharge that
  is purulent rather than clear; one-sided watering that persists (drainage obstruction
  or lid malposition needs an eye clinician); any suspicion of a foreign body.
