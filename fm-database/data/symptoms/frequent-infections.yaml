category: constitutional
severity: concerning
description: Infections that arrive more often, last longer, or hit harder than expected. Usually
  reflects cumulative load — sleep debt, undernutrition, sustained stress — rather than a discrete
  immune defect.
when_to_refer: Refer for immunology assessment where infections are unusually severe, need repeated
  antibiotics or hospital care, involve unusual organisms, or come with weight loss and night
  sweats. Check HbA1c, HIV status where relevant, and full blood count.
