category: skin
severity: concerning
description: 'Persistent urge to scratch, with or without visible skin change. Itch WITHOUT
  a rash is the clinically important presentation: it points to a systemic cause rather than
  a skin one.'
when_to_refer: Generalised itch with no rash requires bloods before anything else — iron studies,
  thyroid, renal and liver function including bile salts, glucose, and full blood count. Persistent
  unexplained itch with night sweats, weight loss or lymphadenopathy needs urgent assessment
  for lymphoma. Itch in pregnancy affecting palms and soles suggests obstetric cholestasis —
  same-day referral.
