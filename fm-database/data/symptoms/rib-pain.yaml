category: musculoskeletal
severity: concerning
description: Pain in the chest wall, often sharp and reproducible on movement, deep breathing
  or direct pressure. Costochondritis and intercostal or costovertebral joint irritation are
  common causes; chronic upper-chest breathing loads these structures continuously.
when_to_refer: Chest pain must not be assumed musculoskeletal. Refer urgently for crushing or
  pressure-like pain, radiation to jaw or arm, breathlessness, sweating, or pain on exertion.
  Also exclude pulmonary embolism, pneumothorax and rib fracture.
linked_to_topics: []
linked_to_mechanisms: []
notes_for_coach: Reproducible on palpation points toward the chest wall — but that finding does
  not exclude a cardiac cause, and should never be used to reassure alone.
