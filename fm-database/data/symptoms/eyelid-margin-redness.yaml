slug: eyelid-margin-redness
display_name: Red / Inflamed Eyelid Margins
aliases:
- red-eyelid-margins
- lid-margin-redness
- red-eyelids
- inflamed-eyelids
- sore-eyelids
category: skin
severity: common
description: Redness, thickening or soreness along the rim of the eyelid where the
  lashes emerge, often with visible small blood vessels and blocked or capped gland
  openings. The visible face of lid-margin inflammation, and frequently the driver
  behind evaporative dry eye and recurrent styes. Strongly associated with rosacea,
  where facial flushing and lid disease travel together.
when_to_refer: Marked swelling, pus, or spread beyond the lid margin — possible
  preseptal or orbital cellulitis, urgent. Also refer for one-sided persistent change,
  lash loss, or a firm nodule that does not settle.
linked_to_topics:
