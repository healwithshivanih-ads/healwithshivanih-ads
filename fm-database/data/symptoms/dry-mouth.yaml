description: Subjective complaint of oral dryness — sticky or cotton-textured mouth,
  needing frequent sips or chewing gum, difficulty with dry foods, disturbed sleep
  from waking thirsty. Common in perimenopausal and menopausal women (falling oestrogen
  thins and dries mucous membranes), in T2DM, on anticholinergic and diuretic medications,
  and alongside mouth-breathing or dehydration. When it appears with dry eyes plus
  joint pain it forms the sicca pattern and warrants an autoimmune workup.
when_to_refer: Sicca pattern (dry mouth + dry eyes + joint pain) → autoimmune / Sjögren
  workup. Also refer if accompanied by unexplained thirst and urination (screen for
  diabetes), difficulty swallowing or speaking, or rapid dental decay — chronic xerostomia
  raises caries risk and needs dental input.
notes_for_coach: 'Coaching levers before anything clinical — (a) audit DIURETICS and
  timing: caffeine, alcohol and diuretic foods/drinks taken late land the fluid load
  in the sleep window and worsen overnight dryness; (b) audit ORAL IRRITANTS, in particular
  RAW onion and other raw pungent alliums, raw garlic, chilli and very salty foods
  — see claim coach-raw-onion-aggravates-dry-mouth; (c) mucosal-coating foods work
  where plain water does not — soaked sabja (basil) seeds and fresh coconut are both
  well tolerated in Indian households and reliably reported as helping; (d) front-load
  total fluids before ~4pm rather than raising the total. Cooked onion is NOT implicated
  and should not be stripped from a client''s food on this basis.'
