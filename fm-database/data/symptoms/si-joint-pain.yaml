category: musculoskeletal
severity: common
description: Pain localised to the dimple at the base of the spine, often one-sided, worse on
  standing from sitting, single-leg loading and rolling in bed. Common in pregnancy and postpartum
  from ligamentous laxity.
when_to_refer: Bilateral SI pain with morning stiffness over 30 minutes and improvement with
  exercise in someone under 45 suggests axial spondyloarthritis — refer to rheumatology rather
  than treating as mechanical.
