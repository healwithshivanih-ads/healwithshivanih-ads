description: Observable excess of motor activity and impulsivity — constant movement,
  fidgeting, difficulty staying seated, acting before thinking. Most often presenting
  in children with ADHD or autism spectrum disorder, where it is the symptom cluster
  most responsive to dietary intervention. Functional substrates commonly implicated
  are artificial colours/flavours/preservatives and salicylate load against deficient
  sulfation capacity, gluten and casein exorphin peptides crossing a permeable gut,
  glycemic volatility, and low omega-3 status. Distinct from `restlessness`, which
  is the felt inability to settle; hyperactivity is the outward behaviour a parent
  or teacher reports.
when_to_refer: Refer to a paediatrician or developmental clinician for formal
  assessment when hyperactivity impairs schooling, relationships, or safety, or when
  a parent raises ADHD or autism — diagnosis is out of coaching scope. Coaching
  supports the dietary and lifestyle layer alongside, never instead of, that
  assessment.
