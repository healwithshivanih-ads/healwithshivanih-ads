notes_for_coach: Created 2026-08-02 as its own entry. "hyperactivity" had been an
  alias of `anxiety`, which mis-filed every real occurrence — the corpus hits are
  ADHD/autism hyperactivity, a different thing from anxious arousal. Keep the aliases
  here disjoint from `restlessness` so alias-aware matching stays unambiguous.
