# Content library — the videos and guides follow-up emails may point people to.
#
# Read by fm-database-web/src/lib/fmdb/content-library-store.ts. Underscore-
# prefixed, so `fmdb validate` skips it (same footing as _food_cautions.yaml).
#
# NOTHING HERE NEEDS HAND-MAINTENANCE TO STAY SAFE (2026-10-21).
#   - Videos carry NO date. The daily `content-status` job asks YouTube itself
#     whether each video is public and when it went public, and only a fresh
#     "public" answer lets a video into an email. Hand-typed dates were wrong
#     within a day (the HRT video went public 18 Oct; the file said 28 Feb).
#   - New long videos on the channel are found by the same job and added
#     automatically (concerns read from the title + description, the title as
#     the line). An entry here is CURATION ONLY: better concern tags and a
#     better line for a video the job would find anyway.
#   - Guides are checked daily too (the page must answer 200). Their
#     `live_from` only says since when they exist, to tell new from old.
#
# RULES (content-library.test.ts fails if any is broken):
#   - A link may reach a person ONLY from this file or the job's auto list.
#   - `until` (optional) retires seasonal items.
#   - `concerns` use the ids in lib/fmdb/concerns.ts.
#   - `stage`: `first` = good as the first thing someone gets; `deeper` = for
#     someone who has already engaged.
#   - `line` is client-facing, one sentence, her voice. No "free call", no
#     evidence-hedging, no programme name before its reveal.

