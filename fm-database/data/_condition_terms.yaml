# ============================================================================
# Condition terms — the shared vocabulary between a supplement's contraindication
# text and a client's record.
#
# Read by fmdb/plan/supplement_clash.py. Underscore-prefixed, so `fmdb validate`
# skips it (same footing as _client_screens.yaml and _food_cautions.yaml).
#
# WHY THIS EXISTS
# `contraindications.conditions` and `active_conditions` are both free text and
# used to be compared by exact string. "Active peptic or gastric ulcer, gastritis
# or erosive oesophagitis — supplemental acid can worsen mucosal injury" can never
# equal "GERD / acid reflux", so the check fired zero times across 370 supplements.
# Neither side can be a term list of its own: the two sides describe the same
# illness in different words. A concept here is what joins them.
#
# HOW A CONCEPT MATCHES
# - `contra`  terms looked for in the HEAD of the catalogue string, the part before
#             " — ". The tail is explanation and names other illnesses in passing
#             ("(used therapeutically in hyperthyroidism)").
# - `client`  terms looked for on the client's record. Defaults to `contra`.
# - `contra_not` / `client_not`  a hit here cancels the concept.
# - `fields: allergies`  read known_allergies instead of the condition lists.
#
# RULES
# - Terms are FOLDED before matching: lowercase, hyphen/underscore/slash/apostrophe
#   to a space, -aem- to -em-, oesoph/oestr to esoph/estr, diarrhoea to diarrhea,
#   coeliac to celiac. Write terms folded ("hemochromatosis", "esophagitis").
# - Letter boundaries, so "ulcer" does not hit "ulcerative", and a digit may end a
#   term. List plurals separately.
# - A concept joins only what is truly the same clinical question. "Kidney stones"
#   is not "kidney disease"; bajra and ragi taught this file's sibling that lesson.
# - No dairy concept: read milk through fmdb/plan/dairy.py, never the raw fields.
# - A string with no concept stays silent. Silence is the old behaviour, a false
#   alarm is a new cost. What stays silent on purpose: surgery timing, pending
#   blood tests, dose and route notes, alcohol and smoking (no client field).
# ============================================================================

concepts:
  # --- kidney ---------------------------------------------------------------
  - id: kidney-disease
    contra: [chronic kidney disease, kidney disease, ckd, renal impairment, renal insufficiency,
             renal failure, kidney impairment, impaired kidney function, impaired renal function,
             reduced egfr, kidney failure, nephritis, dialysis]
    client: [chronic kidney disease, kidney disease, ckd, renal impairment, renal insufficiency,
             renal failure, kidney failure, nephropathy, dialysis]
  - id: kidney-stones
    contra: [kidney stones, kidney stone, hyperoxaluria]
    client: [kidney stones, kidney stone, renal stone, renal stones, renal calculi, nephrolithiasis]

  # --- liver and bile -------------------------------------------------------
  - id: liver-disease
    contra: [liver disease, liver disorders, hepatitis, cirrhosis, raised liver enzymes,
             elevated liver enzymes]
    contra_not: [cholestatic]
    client: [liver disease, fatty liver, nafld, masld, nash, cirrhosis, hepatitis,
             raised liver enzymes, elevated liver enzymes]
  - id: drug-induced-liver-injury
    contra: [liver injury]
    client: [liver injury, dili]
  - id: gallstones-biliary
    contra: [gallstones, gallstone, bile duct obstruction, bile ducts, biliary obstruction,
             biliary tract, cholecystitis, cholestatic]
    client: [gallstones, gallstone, cholelithiasis, cholecystitis, biliary obstruction]

