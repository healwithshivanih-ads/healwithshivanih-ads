virya: heating
vipaka: pungent
preparation: >-
  Stir 1 tsp of dried leaf powder into warm water, buttermilk, dal or a vegetable dish. Adding it at the end of cooking rather than boiling it keeps more of the vitamin C, which is also what helps the iron absorb. Fresh cooked drumstick leaves are the traditional form and are just as good.
typical_dose: >-
  Start at 1/2 tsp a day and build to 1-2 tsp. Trials of the powder have used considerably more, but food quantities are what this entry is about.
duration: >-
  Daily use is fine as a food. Give it weeks, not days, if haemoglobin is the goal.
timing_notes: >-
  With a meal. Pair with a vitamin C source and keep it away from chai and coffee — the same absorption levers as any non-haem iron.
