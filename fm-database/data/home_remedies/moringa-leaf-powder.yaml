category: kitchen_remedy
route: internal
summary: >-
  Dried drumstick leaf, taken as a spoonful of powder stirred into water, buttermilk
  or dal, or simply cooked as the fresh leaf. Iron- and calcium-dense, cheap, and
  grown in most of India. Of everything in this list it has the best human
  evidence for raising haemoglobin — small trials, but repeatedly in the same
  direction, including one where moringa powder performed comparably to iron
  sulphate in lactating women.
indications:
- iron-nutrition
- iron-deficiency
- iron-deficiency-anemia
- blood-sugar-regulation
contraindications:
- pregnancy — the LEAF is widely eaten as a food, but moringa ROOT and BARK are traditionally abortifacient and must be avoided; do not use root-containing preparations, and keep leaf use to food quantities
- hypothyroidism on levothyroxine — moringa is calcium- and fibre-rich; keep it clear of the thyroid dose
- on blood-sugar-lowering medication — the glycaemic effect is real enough to matter; the clinician monitors
- calcium-oxalate stone formers — moringa leaf carries oxalate
- start small — a full tablespoon on day one commonly causes loose stools and nausea
