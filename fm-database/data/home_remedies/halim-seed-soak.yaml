- balya
- emmenagogue
preparation: >-
  Soak 1 tsp halim seeds in about 1/2 cup water, lemon water or warm milk for
  15-30 minutes, until the seeds swell and turn gelatinous. Drink the whole thing
  including the seeds — this is not a strained water, and straining would discard
  most of what you are after. Lemon water is the better base when the goal is
  iron: the vitamin C improves non-haem iron absorption from the same meal. Halim
  is also traditionally roasted into ladoos with jaggery and coconut, which is the
  usual postpartum form.
typical_dose: >-
  1 tsp (roughly 3-4 g) of dry seed once a day. Traditional practice does not go
  far above this and there is no dose-ranging evidence to justify more.
duration: >-
  Rotate it rather than run it continuously — a few weeks at a time alongside
  other iron-bearing foods, reviewed with the coach.
timing_notes: >-
  Mid-morning or as an afternoon drink. Keep it away from chai, coffee and the
  main calcium source of the day, all of which reduce non-haem iron absorption,
  and at least 4 hours clear of levothyroxine if the client takes it.
