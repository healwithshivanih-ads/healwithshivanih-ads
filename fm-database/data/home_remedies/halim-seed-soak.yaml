# ============================================================================
# HALIM (garden cress, Lepidium sativum) — coach notes. Authored 2026-09-21
# after a client question. Halim was completely absent from the catalogue: no
# ingredient entry, no caution, no remedy. (HomeRemedy has no notes_for_coach
# field, so the reasoning lives here and, machine-readably, in the four
# garden-cress-* claims.)
#
# THE IRON NUMBER IS THE THING TO GET RIGHT. Every Indian wellness page repeats
# 100 mg iron per 100 g. Direct laboratory analyses put it at 7.3-11.7 mg/100 g
# — roughly a tenth — and the higher figure would exceed the iron density of
# any commonly eaten food. At the credible level a 1 tsp serving contributes on
# the order of a THIRD OF A MILLIGRAM of iron: a worthwhile addition to an
# iron-focused pattern, nothing like a treatment.
# See claims/garden-cress-seed-iron-content-is-widely-overstated.
#
# NO ENTRY WAS ADDED TO _ingredient_nutrients.yaml, deliberately. The published
# values disagree more than tenfold on exactly the nutrient that matters, and
# that table drives the `rich_in: iron` badge and the coach's nutrient strip.
# The 100 mg figure would make every halim dish falsely blaze "rich in iron";
# a hand-picked midpoint would be an invented number inside automated output.
# Revisit only if a national table publishes a value for the SEED — IFCT 2017
# carries garden cress LEAVES (halim sag) as a green leafy vegetable, which is
# a different food and must not be used as a proxy.
#
# IT IS A BRASSICA, and glucosinolate is reported in the seed — but halim was
# deliberately NOT added to the goitrogen-brassica-thyroid caution. Reasoning is
# recorded in a comment in _food_cautions.yaml and in
# claims/garden-cress-seed-is-a-brassica-carrying-glucosinolate.
#
# THE HAEMOGLOBIN EVIDENCE IS ABOUT UNDERNOURISHED TEENAGERS, and halim was one
# ingredient inside a composite supplementary food in both studies. Do not carry
# those effect sizes into an adult conversation.
#
# COACH USE: Shivani uses halim for low iron on the strength of her own clinical
# experience, and that is recorded as a first-class indication here (see
# claims/halim-seed-soak-coach-observation-low-iron). The published-literature
# caveats above are about the 100 mg figure and the adolescent studies — they are
# not an argument against the remedy.
# ============================================================================
