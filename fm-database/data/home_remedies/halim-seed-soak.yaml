category: kitchen_remedy
route: internal
summary: >-
  A teaspoon of garden cress (Lepidium sativum) seed soaked until it swells into a
  soft gel, taken in water, lemon water or warm milk. A traditional Indian
  iron-bearing and postpartum food, and one the coach uses for low iron on her own
  clinical experience. Pair it with vitamin C and keep it away from chai, coffee
  and the meal's calcium — the absorption levers matter more here than the dose.
  Note for accuracy when talking to clients: the widely circulated 100 mg
  iron/100 g figure is not supported by laboratory analysis.
indications:
- iron-nutrition
- iron-deficiency
- iron-deficiency-anemia
- constipation
contraindications:
- pregnancy — avoid; animal antifertility data plus a long traditional emmenagogue
  and abortifacient reputation, and human safety is not established
- trying to conceive — leave out on the same precautionary grounds
- hypothyroidism on levothyroxine — not a reason to avoid the seed, but keep it
  clear of the thyroid dose like any high-fibre or calcium-containing food (the
  4-hour rule lives in drug_depletions/levothyroxine.yaml)
- calcium-oxalate stone formers — the seed carries oxalate; not a ban, but it is
  not the iron food to reach for in this client
- swallowing difficulty — the soaked seed forms a mucilaginous gel and must be
  taken with adequate fluid
balances_dosha:
- vata
