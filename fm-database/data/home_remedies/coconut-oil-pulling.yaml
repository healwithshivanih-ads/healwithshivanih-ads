prabhava: Lauric acid converts to monolaurin, giving coconut an antimicrobial and
  antifungal action sesame lacks - the likely reason it outperforms other oils.
preparation: >-
  Take 1 tablespoon (about 15 ml) of cold-pressed virgin coconut oil into the mouth
  on an empty stomach, before eating, drinking or brushing. In cool weather it will
  be solid - it melts in the mouth within seconds. Swish gently between the teeth
  and along the gum margins for 10 minutes. Do not gargle and do not tip the head
  back. The oil thins and turns milky white as it mixes with saliva. Spit it all
  out into a bin or tissue, never the sink - it solidifies and blocks drains. Rinse
  with warm water, then brush as usual.

  SHORTER, SAFER VERSION for anyone with reflux, swallowing difficulty, sedating
  medication, or age over 75 - use 1 teaspoon, swish 5 minutes, sitting fully
  upright, morning only, and stop immediately at any cough or gag.
typical_dose: One session daily
duration: Daily and ongoing. The antibacterial effect is transient - load rebounds
  within about 24 hours - so daily practice is the point, not occasional use.
  Gingival improvement reported over 2 to 4 weeks; the periodontitis trial ran one
  month plus follow-up.
timing_notes: First thing in the morning on an empty stomach, before food, drink or
  brushing. Sitting upright. Not at night, and never when drowsy or sedated.
