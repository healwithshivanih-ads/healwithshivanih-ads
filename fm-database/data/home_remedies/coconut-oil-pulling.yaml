summary: >-
  Swishing cold-pressed coconut oil around the mouth and between the teeth, then
  spitting it out. The evidence-preferred oil for oil pulling on current trial
  data - in a triple-blind randomised trial in periodontitis it reduced red-complex
  pathogens (Tannerella forsythia, Treponema denticola), RAISED commensals
  including Streptococcus, Actinomyces and Veillonella, improved the subgingival
  dysbiosis index versus placebo, and lowered gum-pocket IL-6 and TNF-alpha where
  chlorhexidine did not. In the one trial that held everything else constant and
  varied only the oil, coconut outperformed both sesame and sunflower.

  Coconut's edge is biochemical, not textual - lauric acid converts to monolaurin,
  which sesame does not carry. It is also the only oil with a signal against
  Streptococcus mutans (the acid-producing caries organism) versus saline.

  IMPORTANT - classical Ayurveda specifies SESAME (tila taila) for kavala, not
  coconut; coconut is a regional South Indian and pitta-appropriate choice. Argue
  for coconut from the trial data, never by claiming the texts prescribe it. See
  sesame-oil-pulling-gum-massage for the classical practice.

  NEVER recommend sunflower oil - it has no traditional basis and is the oil behind
  both major null results in this literature.
indications:
- gingivitis, bleeding or swollen gums
- periodontal disease (as an adjunct to dental treatment, never instead of it)
- oral dysbiosis / elevated oral pathogens on stool or oral testing
- Fusobacterium nucleatum raised on gut microbiome testing (oral-origin organism)
- plaque control and general oral hygiene
- substitute for antiseptic or alcohol-based mouthwash, especially in hypertension
- halitosis from oral bacteria
- frequent dental caries (alongside fluoride, never replacing it)
- white tongue coating / suspected oral candida
- dry mouth (comfort only - see notes, oil is no better than water here)
contraindications:
- dysphagia or impaired swallow
- gastro-oesophageal reflux, hiatus hernia or nocturnal regurgitation
- dyspepsia, acidity, pantoprazole, omeprazole, rabeprazole, esomeprazole, lansoprazole
- sedating or anticholinergic drugs - tramadol, nortriptyline, amitriptyline, pregabalin,
  gabapentin, alprazolam, clonazepam, diazepam, benzo
- loose teeth, gum abscess or pus
- coconut allergy - use sesame instead
- children under five
