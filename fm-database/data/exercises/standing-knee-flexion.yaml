slug: standing-knee-flexion
display_name: Standing Knee Flexion (Knee Flexor)
client_name: Bending the knee, standing
modality: strength
intensity_tier: beginner
position: standing
summary: Hamstring strengthening against an ankle cuff weight, performed standing so it trains balance
  at the same time.
why_it_works: 'The Otago programme performs every strengthening exercise except the knee extensor
  standing, deliberately: holding a single-leg stance while the other leg works trains balance and
  strength together.'
setup:
- Strap the ankle cuff weight around one ankle.
- Stand tall facing a stable bench or kitchen counter, both hands resting on it.
steps:
- Bend the knee, bringing the heel up towards the buttock over two to three seconds.
- Lower over four to five seconds under control — do not let it drop.
- Keep the thighs level with each other; the working thigh should not swing forward.
- Complete the repetitions, then swap the weight to the other ankle.
levels:
- level: A
  prescription: 10 repetitions each leg
  reps: 10
  sets: 1
  support: both hands
- level: B
  prescription: 2 sets of 10 each leg
  reps: 10
  sets: 2
  support: both hands
- level: C
  prescription: 2 sets of 10 at a heavier cuff weight
  reps: 10
  sets: 2
  support: one hand
- level: D
  prescription: 2 sets of 10 at the heaviest tolerated weight
  reps: 10
  sets: 2
  support: one hand
frequency: 3x/week with a rest day between.
equipment:
- ankle cuff weights
- a stable bench or counter
builds:
- hamstring strength
- standing balance
joint_stress:
- knee
- hip
balance_demand: 2
impact: none
cautions:
- condition: osteoarthritis
  condition_aliases:
  - rheumatoid arthritis
  - arthritis
  - joint pain
  - chronic pain
  - fibromyalgia
  severity: caution
  reason: The Otago manual instructs people with rheumatoid arthritis, osteoarthritis or other painful
    conditions to work in a pain-free range.
  modification: Reduce range until the movement is pain-free rather than reducing frequency; stop
    if muscle pain does not settle afterwards.
- condition: history of falls
  condition_aliases:
  - falls
  - unsteady
  - dizziness
  - vertigo
  - syncope
  - osteoporosis
  - osteopenia
  - peripheral neuropathy
  severity: caution
  reason: Unsupported balance work is the point of the exercise and also its risk; the manual requires
    confirming the person can recover balance with lower-limb strategies before prescribing any unsupported
    level.
  modification: Stay at the supported level until recovery strategies are confirmed. Work beside
    a solid bench or kitchen counter, never a chair that slides.
- condition: post-exertional malaise
  condition_aliases:
  - long covid
  - long-covid
  - me/cfs
  - chronic fatigue
  - post-viral fatigue
  - pem
  - myalgic encephalomyelitis
  severity: block
  reason: 'NICE NG206 withdrew graded exercise therapy for ME/CFS: any programme of fixed incremental
    increases can provoke a lasting relapse. The ladder in this entry is exactly that shape.'
  modification: ''
notes_for_coach: Support here is a bench or counter, never a chair — a chair that slides is how a
  balance exercise becomes a fall.
