notes_for_coach: 'THE MOST DEMANDING ENTRY IN THE STRENGTH SET, AND THE ONE TO WITHHOLD FIRST. Ten
  of sixteen clients carry tagged body pain and the knee is the commonest site; a lunge concentrates
  weight through one bent knee and does it standing on a narrow base. It is here because it is the
  honest next step after the squat and because single-leg work catches a side-to-side difference
  nothing else in the catalogue will — not because it belongs in most plans.

  Ask about stairs before prescribing. A client who takes stairs one at a time or holds the rail
  going down is telling you their single-leg strength is the limiting factor, and that is a reason
  to build it with supported levels — not a reason to skip straight to level 3.

  The book''s reverse lunge steps backwards instead of forwards and is easier on the front knee. It
  was not shipped separately because it is the same movement in the opposite direction; use it as
  the modification when the forward step is the part that hurts.'
