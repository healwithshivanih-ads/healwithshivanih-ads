notes_for_coach: 'Included as the easy rung of the floor-conditioning family — a client not ready
  for mountain climbers can keep the circuit structure with this instead. It is also quietly a
  hamstring mobiliser: the pike position is a moving version of the cool-down''s hamstring reach.'
