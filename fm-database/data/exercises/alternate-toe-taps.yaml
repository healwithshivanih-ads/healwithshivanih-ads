- shoulder
cautions:
- condition: post-exertional malaise
  condition_aliases:
  - long covid
  - long-covid
  - me/cfs
  - chronic fatigue
  - post-viral fatigue
  - pem
  - myalgic encephalomyelitis
  severity: block
  reason: Belongs to the timed-circuit family NICE NG206 warns against in ME/CFS.
  modification: ''
- condition: wrist pain
  condition_aliases:
  - carpal tunnel
  - wrist injury
  - arthritis of the hands
  severity: caution
  reason: Alternating single-arm support doubles the load on the planted wrist.
  modification: Raise the hands onto a step; shorten the round.
- condition: uncontrolled hypertension
  condition_aliases:
  - high blood pressure
  - hypertension
  severity: caution
  reason: The piked position puts the head below the heart repeatedly.
  modification: Fewer, slower reaches with the hands elevated.
