slug: alternate-toe-taps
display_name: Alternate Toe-Taps (Press-Up Position)
client_name: Toe taps in plank
aliases:
- toe taps
- plank toe touches
modality: cardiovascular
intensity_tier: intermediate
position: four_point
equipment: []
summary: In a press-up position, each hand reaches back to the opposite foot in turn — moving
  plank work that mixes conditioning with shoulder endurance.
why_it_works: Reaching a hand to the opposite foot pikes the hips and shifts the whole load onto
  one arm for a beat, so the shoulders and trunk work through movement rather than a static hold.
  The book classes it low-intensity, which makes it the gentlest of the floor conditioning moves.
setup:
- Take a press-up position on the balls of the feet, hands under the shoulders, back straight.
steps:
- Push the hips up and back while reaching the right hand to the left foot.
- Return to the press-up line and immediately reach the left hand to the right foot.
- Alternate with rhythm, moving briskly without losing the straight back between reaches.
levels:
- level: '1'
  prescription: '3 rounds of 6 slow alternating reaches, resting between rounds'
  reps: 6
  sets: 3
  support: none
- level: '2'
  prescription: '3 rounds of 30 seconds at a steady rhythm, resting 30 seconds'
  sets: 3
  support: none
frequency: 2x/week inside circuits, as the floor-based recovery station.
builds:
- shoulder endurance
- trunk control through movement
- hamstring flexibility under load
easier_variant: forearm-plank
harder_variant: mountain-climbers
movement_patterns:
- core_brace
- mobility
muscles_worked:
- shoulders
- abdominals
- triceps
- hamstrings
impact: low
balance_demand: 1
requires_floor_transfer: true
joint_stress:
