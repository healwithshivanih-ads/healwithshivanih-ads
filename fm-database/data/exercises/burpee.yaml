cautions:
- condition: post-exertional malaise
  condition_aliases:
  - long covid
  - long-covid
  - me/cfs
  - chronic fatigue
  - post-viral fatigue
  - pem
  - myalgic encephalomyelitis
  severity: block
  reason: The book itself calls this maximal-demand conditioning; it is the last thing NICE NG206
    permits in ME/CFS.
  modification: ''
- condition: uncontrolled hypertension
  condition_aliases:
  - high blood pressure
  - hypertension
  severity: caution
  reason: Rapid repeated changes between standing and head-down floor positions at high effort are
    a blood-pressure and dizziness double load.
  modification: Level 1-2 only (no jump levels), a full breath's pause at the crouch before rising,
    and stop for any light-headedness. With BP that is not well controlled, do not prescribe this
    entry at all — the mountain-climber step-through covers the conditioning goal without the
    posture change.
- condition: pelvic floor dysfunction
  condition_aliases:
  - stress incontinence
  - urinary incontinence
  - prolapse
  - postnatal
  severity: caution
  reason: The jump levels spike intra-abdominal pressure; the kick-back does too.
  modification: Cap at level 1 (step-back, no jump) until pelvic-floor work is established.
- condition: wrist pain
  condition_aliases:
  - carpal tunnel
  - wrist injury
  - arthritis of the hands
  severity: caution
  reason: Every repetition drops body weight onto extended wrists.
  modification: Fewer reps, hands on a low step, stop for numbness.
- condition: knee pain
  condition_aliases:
  - osteoarthritis
  - arthritis
  - joint pain
  - meniscus
  severity: caution
  reason: The crouch and the jump landings both load bent knees at speed.
  modification: Level 1 only, stepping in and out; skip the jump levels entirely.
- condition: history of falls
  condition_aliases:
  - falls
  - unsteady
  - dizziness
  - peripheral neuropathy
  severity: caution
  reason: Fast floor-to-standing transitions are where orthostatic dizziness bites.
  modification: Pause one breath at the crouch before rising; level 1-2 only.
refer_out: []
