notes_for_coach: 'One entry, four rungs, ON PURPOSE: "burpee" arrives as one word from clients and
  the ladder keeps its regressions attached so prescribing level 1 is natural. The step-back
  version is a legitimate strength-and-mobility exercise for a fit beginner; the press-up version
  is the hardest thing in this catalogue. The tuck-jump and long-jump book variants remain
  deliberately excluded — maximal plyometrics with no candidate on any foreseeable roster. Floor
  get-up confidence is a prerequisite, not a nice-to-have.'
