slug: burpee
display_name: Burpee (Squat-Thrust Ladder)
client_name: Burpees
client_summary: "Stand, crouch, step or kick your feet back, then come back up. It works everything at once, and there is a gentler version without the jump."
aliases:
- burpees
- squat thrust
- squat thrusts
- burpee press-up
modality: cardiovascular
intensity_tier: advanced
position: standing
equipment: []
summary: Stand, crouch, kick back to a press-up line, return and rise — the whole-body conditioning
  ladder, from a stepped no-jump version to the full press-up form.
why_it_works: The burpee chains a squat, a plank and (higher up the ladder) a press-up and a jump
  into one continuous movement, which is why the book calls it the most singularly beneficial
  bodyweight exercise — it taxes strength, endurance and coordination together and reaches every
  major muscle group with no kit. The ladder below the classic form keeps the chain while removing
  its two hardest links.
setup:
- Clear floor space; check the ceiling if the jump levels are in play.
- Wrists warm and ready — some weight lands on the hands every repetition.
steps:
- From standing, crouch and place the hands on the floor just wider than the shoulders.
- Kick or step the legs back into a straight press-up position.
- Return the feet to the crouch and stand (or jump) to finish.
- Move continuously but under control; the straight back in the plank line is the technique that
  matters most.
levels:
- level: '1'
  prescription: 'Step-back version: step one leg back at a time, stand to finish. 2 sets of 5'
  reps: 5
  sets: 2
  support: none
- level: '2'
  prescription: 'Non-jump burpee: kick both legs back, stand tall to finish. 2 sets of 6-8'
  reps: 8
  sets: 2
  support: none
- level: '3'
  prescription: 'Standard burpee: finish each repetition with a jump. 2 sets of 8-10'
  reps: 10
  sets: 2
  support: none
- level: '4'
  prescription: 'Press-up burpee: add a full press-up in the plank phase. 2 sets of 8'
  reps: 8
  sets: 2
  support: none
frequency: 2x/week inside circuits, with a rest day between; quality collapses before the lungs do.
builds:
- whole-body conditioning
- squat-to-floor transition confidence
- press-up and plank strength in context
