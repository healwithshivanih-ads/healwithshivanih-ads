notes_for_coach: 'THE RUNG ABOVE `chair-sit-to-stand`, wired as its harder variant. That entry was the
  top of the seated strength chain and clients outgrew it with nowhere to go — this is the answer, and
  it needs no equipment.


  DOUBLES AS A MEASURE. Counting how many rises are possible in thirty seconds is a recognised functional
  test, so this entry can be re-taken as an outcome rather than only prescribed. Worth recording the number
  at the start of a plan.


  SEAT HEIGHT IS THE DIAL. A cushion makes it markedly easier and a low sofa markedly harder, which is
  a finer adjustment than changing the repetitions.'
