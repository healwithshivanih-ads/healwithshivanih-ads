slug: sit-to-stand-no-hands
display_name: Sit to Stand Without Hands
client_name: Standing up without using your hands
client_summary: "Standing up from a chair using your legs alone, arms folded across your chest."
aliases:
- sit to stand no hands
- hands-free sit to stand
- unassisted chair rise
- chair rise no hands
modality: strength
intensity_tier: intermediate
position: seated
equipment:
- a stable chair, ideally without arms
summary: Rising from a chair using the legs alone, with the arms folded across the chest.
why_it_works: Standing up is the most frequently performed strength task in anyone's day, and the hands
  quietly do a great deal of the work. Folding the arms removes that assistance and makes the legs produce
  the whole movement. It is also a recognised functional test — the ability to rise repeatedly without
  hands tracks leg strength and predicts independence, so it doubles as a measure the coach can re-take.
setup:
- Sit towards the front of a stable chair with the feet flat and drawn back slightly behind the knees.
- Fold the arms across the chest.
- Have the chair against a wall so it cannot slide.
steps:
- Lean the chest forward over the knees — nose over toes. This is the part most people skip, and without
  it the movement is nearly impossible.
- Press down through the heels and stand up in one movement.
- Stand fully upright and squeeze the buttocks at the top.
- Sit down with CONTROL, taking three seconds. The lowering is where most of the strength is built.
- Do not drop into the chair.
levels:
- level: '1'
  prescription: 5 repetitions from a higher chair or with a cushion
  reps: 5
  sets: 2
  support: raised seat height, hands ready but unused
- level: '2'
  prescription: 10 repetitions from a standard chair
  reps: 10
  sets: 2
  support: none
- level: '3'
  prescription: 10 repetitions from a lower seat, twice
  reps: 10
  sets: 2
  support: none
  note: Lowering the seat is the progression. A single-leg rise is the next step beyond this and is not
    yet in the catalogue.
frequency: 3x/week, or several short sets through the day.
builds:
- thigh and buttock strength
- the strength to get out of a chair, a car and a bath unaided
- a measure of leg strength that can be re-tested
easier_variant: chair-sit-to-stand
harder_variant: null
