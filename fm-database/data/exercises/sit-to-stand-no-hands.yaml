cautions:
- condition: post-exertional malaise
  condition_aliases:
  - long covid
  - long-covid
  - me/cfs
  - chronic fatigue
  - post-viral fatigue
  - pem
  - myalgic encephalomyelitis
  severity: block
  reason: NICE NG206 withdrew graded exercise therapy for ME/CFS, and every level ladder here is a progression
    schedule.
  modification: ''
- condition: knee pain
  condition_aliases:
  - knee osteoarthritis
  - knee injury
  - knee replacement
  - patellofemoral
  - meniscus
  - knee arthritis
  severity: caution
  reason: Rising without hands puts the whole bodyweight through the knees, and a lower seat increases
    the angle they must work through.
  modification: Raise the seat with a firm cushion, which shortens the range considerably, and keep the
    hands available even if unused.
- condition: dizziness
  condition_aliases:
  - vertigo
  - postural hypotension
  - orthostatic hypotension
  - lightheaded
  - syncope
  - fainting
  - bppv
  severity: caution
  reason: Repeated standing up is exactly the provocation for a blood-pressure drop.
  modification: Rise slowly, pause standing before sitting again, and stop at any lightheadedness. Not
    to be done alone if this has happened before.
- condition: balance problems
  condition_aliases:
  - falls
  - unsteady
  - fall risk
  - poor balance
  severity: caution
  reason: The arms are folded, so there is nothing to catch with if balance goes at the top.
  modification: Stand within reach of a wall or a second chair, and use `chair-sit-to-stand` with hands
    until standing is steady.
