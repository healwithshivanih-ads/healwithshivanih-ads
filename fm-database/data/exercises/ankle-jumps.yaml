linked_to_symptoms: []
notes_for_coach: 'Shipped for the bone agenda more than the fitness one: for a post-menopausal
  client with LOW-NORMAL bone density, ten purposeful pogo hops are closer to the LIFTMOR evidence
  than any amount of walking. It is the harder variant of heel-raises and should be introduced
  exactly that way — as the next rung, not as cardio.'
