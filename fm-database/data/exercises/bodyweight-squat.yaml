cautions:
- condition: post-exertional malaise
  condition_aliases:
  - long covid
  - long-covid
  - me/cfs
  - chronic fatigue
  - post-viral fatigue
  - pem
  - myalgic encephalomyelitis
  severity: block
  reason: 'NICE NG206 withdrew graded exercise therapy for ME/CFS: this entry is a fixed depth-and-
    repetition ladder, which is the shape of progression that can provoke a lasting relapse.'
  modification: ''
- condition: knee pain
  condition_aliases:
  - osteoarthritis
  - knee osteoarthritis
  - arthritis
  - knee injury
  - patellofemoral
  - joint pain
  - chondromalacia
  severity: caution
  reason: Knee compression rises steeply with depth, and the bottom of a deep squat is where
    patellofemoral pain is usually provoked.
  modification: Reduce the DEPTH, not the frequency — stay in the range that is pain-free even if
    that is only a few centimetres, and build repetitions there before going lower.
- condition: history of falls
  condition_aliases:
  - falls
  - unsteady
  - dizziness
  - vertigo
  - syncope
  - peripheral neuropathy
  severity: caution
  reason: Taking the chair away removes the thing that was catching the client's weight, and the
    bottom of the movement is the least stable point.
  modification: Work beside a solid counter or worktop, never a chair that can slide. Stay on
    chair-sit-to-stand until standing balance is confirmed.
- condition: uncontrolled hypertension
  condition_aliases:
  - high blood pressure
  - raised blood pressure
  - hypertension
  severity: caution
  reason: Large-muscle resistance work raises blood pressure transiently, and rising hard from the
    bottom invites a held breath.
  modification: Breathe out on the way up. Stand up smoothly rather than straining, and stop for
    dizziness or head pressure on standing.
