notes_for_coach: 'THIS IS THE ENTRY THAT COMPLETES AN EXISTING CHAIN. `chair-sit-to-stand` came from
  the Otago falls manual and had no `harder_variant` — a 45-year-old who could already stand up
  from a chair twenty times had nowhere to progress to, which is a real gap on a roster whose median
  client is decades younger than Otago''s trial population. This is that next rung, and it needs no
  equipment.

  Note the safety axes: this does NOT flex or rotate the loaded spine, so unlike the crunch it is
  not on the vertebral-osteoporosis red line — it is one of the better things a client with low bone
  density can do, because it loads the hip. `loads_spine` is left false because bodyweight alone
  puts no meaningful axial load through the spine; that changes the moment anything is held, and a
  weighted squat would need its own entry.

  The book''s prisoner and wide variants (hands behind the head, or a doubled stance) were not
  shipped separately — they are stance changes, not new movements, and adding them would triple the
  library for no clinical gain.'
