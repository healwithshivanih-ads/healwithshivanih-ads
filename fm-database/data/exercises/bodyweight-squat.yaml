slug: bodyweight-squat
display_name: Bodyweight Squat (Free Standing, No Chair)
client_name: Standing squats
aliases:
- squat
- squats
- standard squat
- air squat
- free squat
modality: strength
intensity_tier: intermediate
position: standing
equipment: []
summary: The free-standing squat — the step up from rising out of a chair, and the most complete
  leg-strength movement available without equipment.
why_it_works: Sitting to standing is a squat with the chair setting the depth and catching the
  weight. Taking the chair away means the legs control the whole descent and there is no point at
  which the load is handed off, which is what turns a daily movement into a strength stimulus. It
  uses nearly every muscle in the leg at once and loads the hip through a long range, which is the
  loading direction that matters for hip bone density.
setup:
- Stand with the feet slightly wider than hip-width, toes turned out a little.
- Keep the back in its normal upright curve, not rounded and not arched.
- Hold the arms out in front at shoulder height as a counterweight.
steps:
- Push the hips back and bend the knees to lower under control.
- Keep the weight through the middle of the foot; the knees should track over the toes, not collapse
  inwards or drift out past them.
- Lower as far as is comfortable and controlled, aiming eventually for the thighs parallel to the
  floor.
- Drive back up through the legs to stand tall, without locking the knees hard at the top.
levels:
- level: '1'
  prescription: 8 repetitions to a quarter depth, next to a counter in case a hand is wanted
  reps: 8
  sets: 1
  support: a bench or counter within reach, not held
  note: Standing beside support is not the same as using it. The point of this level is that the
    legs do the work and the hand is only insurance.
- level: '2'
  prescription: 12 repetitions to roughly half depth, no support
  reps: 12
  sets: 1
  support: none
- level: '3'
  prescription: 12 repetitions to thighs parallel, rest, then a second set
  reps: 12
  sets: 2
  support: none
frequency: 2-3x/week with a rest day between.
builds:
- thigh, hip and buttock strength
- hip and knee loading for bone
- the strength to stand up without pushing off
easier_variant: chair-sit-to-stand
harder_variant: split-squat
