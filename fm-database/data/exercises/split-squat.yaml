slug: split-squat
display_name: Split Squat (Static Lunge)
client_name: Split squat
aliases:
- split squat
- static lunge
- stationary lunge
- stationary split squat
modality: strength
intensity_tier: intermediate
position: standing
equipment:
- a chair or wall within reach for balance
summary: A lunge held in one place — the feet stay put and only the body moves up and down.
why_it_works: 'A forward lunge asks two things at once: load one leg hard, and control a step. Splitting
  them apart is the whole point of this entry. With the feet already planted the balance demand drops
  sharply while the strength demand stays, so a client can build single-leg strength months before they
  can safely step into a lunge. It is the rung between a two-legged squat and a moving lunge.'
setup:
- Take a long stride forward so one foot is well ahead of the other, both pointing forward.
- Rise onto the ball of the back foot and stand tall.
- Rest a hand on a chair or wall until the position feels steady.
steps:
- Lower straight down by bending both knees, as if dropping between the feet rather than travelling forward.
- The back knee heads towards the floor; the front shin stays close to upright.
- Stop before the back knee touches, then press up through the front heel.
- Complete the repetitions on one side, then change legs. The feet do not move at all.
levels:
- level: '1'
  prescription: 6 shallow repetitions each leg with a hand on a chair, twice
  reps: 6
  sets: 2
  support: one hand on a chair, small range
- level: '2'
  prescription: 10 repetitions each leg, no support
  reps: 10
  sets: 2
  support: none
- level: '3'
  prescription: 12 repetitions each leg to a deeper range, twice
  reps: 12
  sets: 2
  support: none
frequency: 2-3x/week with a rest day between.
builds:
- single-leg strength
- hip and thigh strength for stairs and slopes
- the strength a forward lunge needs before it is safe
easier_variant: bodyweight-squat
harder_variant: forward-lunge
