cautions:
- condition: post-exertional malaise
  condition_aliases:
  - long covid
  - long-covid
  - me/cfs
  - chronic fatigue
  - post-viral fatigue
  - pem
  - myalgic encephalomyelitis
  severity: block
  reason: NICE NG206 withdrew graded exercise therapy for ME/CFS, and every level ladder here is a progression
    schedule.
  modification: ''
- condition: knee pain
  condition_aliases:
  - knee osteoarthritis
  - knee injury
  - knee replacement
  - patellofemoral
  - meniscus
  - knee arthritis
  severity: caution
  reason: Both knees are loaded through a large range, and the front knee takes most of the bodyweight.
  modification: Keep the range shallow, make sure the front shin stays close to upright rather than travelling
    far over the toes, and use the chair. Stop at any pain at the front of the knee.
- condition: balance problems
  condition_aliases:
  - falls
  - unsteady
  - dizziness
  - vertigo
  - fall risk
  - poor balance
  severity: caution
  reason: A split stance is narrow front-to-back and asks the ankle and hip to hold a line.
  modification: Keep a hand on a solid chair or the wall throughout, and widen the stance slightly side-to-side
    for a broader base.
- condition: hip replacement
  condition_aliases:
  - hip arthroplasty
  - thr
  - total hip replacement
  - hip precautions
  severity: caution
  reason: The deep range can take the hip beyond post-surgical precautions.
  modification: Keep the range shallow and check the surgical team's limits on hip flexion before going
    deeper.
