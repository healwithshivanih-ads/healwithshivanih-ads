notes_for_coach: 'THE RUNG BETWEEN THE SQUAT AND THE LUNGE, and wired both ways. `forward-lunge` demands
  strength AND a controlled step simultaneously, which is why clients fail it — this entry removes the
  step so the strength can be built first.


  `balance_demand: 2` is recorded at the HARDEST level, per the field''s rule, which is the unsupported
  deep version. Level 1 with a hand on a chair is far less demanding, so do not let the screen''s caution
  rule out the supported form for someone who could manage it.'
