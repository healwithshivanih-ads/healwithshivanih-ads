slug: bird-dog
display_name: Bird Dog (Four-Point Contralateral Reach)
client_name: Opposite arm and leg reach
aliases:
- bird dog
- birddog
- quadruped reach
- opposite arm and leg
- superman on all fours
modality: strength
intensity_tier: beginner
position: four_point
equipment:
- a mat or folded blanket
summary: On hands and knees, extending one arm and the opposite leg while the back stays perfectly still.
why_it_works: The work is not in the limbs — it is in refusing to move. Lifting an arm and the opposite
  leg pulls the trunk towards rotating and arching, and the deep trunk muscles have to cancel both. That
  is anti-rotation training, and it happens with the spine held neutral throughout, which is what makes
  it available to people for whom bending and twisting are off the table.
setup:
- Kneel on all fours with the hands directly under the shoulders and the knees under the hips.
- Set the back flat — neither arched nor rounded — and look down at the mat so the neck stays in line.
- Imagine a glass of water balanced on the lower back that must not spill.
steps:
- Slide one arm forward and the opposite leg back, until both are level with the body.
- Reach long rather than lifting high. The limbs should not go above the line of the back.
- Hold for a breath or two, keeping the hips square to the floor — do not let the lifted side rise.
- Return both to the floor with control and change sides.
levels:
- level: '1'
  prescription: lift one arm only, then one leg only, 6 each side
  reps: 6
  sets: 1
  support: one limb at a time until the back stays still
- level: '2'
  prescription: 8 opposite arm-and-leg reaches each side
  reps: 8
  sets: 2
  support: none
- level: '3'
  prescription: 8 each side holding 5 seconds at the top
  reps: 8
  sets: 2
  support: none
  hold_seconds: 5
frequency: 3-4x/week.
builds:
- deep trunk control
- the ability to keep the back still while the limbs move
- shoulder and hip stability
easier_variant: null
harder_variant: side-plank
