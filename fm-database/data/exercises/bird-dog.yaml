cautions:
- condition: post-exertional malaise
  condition_aliases:
  - long covid
  - long-covid
  - me/cfs
  - chronic fatigue
  - post-viral fatigue
  - pem
  - myalgic encephalomyelitis
  severity: block
  reason: NICE NG206 withdrew graded exercise therapy for ME/CFS, and every level ladder here is a progression
    schedule.
  modification: ''
- condition: wrist pain
  condition_aliases:
  - carpal tunnel
  - wrist injury
  - hand pain
  - arthritis hands
  severity: caution
  reason: Bodyweight passes through an extended wrist for the whole set.
  modification: Come down onto the forearms, or make fists so the wrist stays straight.
- condition: knee pain
  condition_aliases:
  - knee osteoarthritis
  - knee injury
  - patellofemoral
  - knee replacement
  - meniscus
  severity: caution
  reason: Kneeling puts direct pressure on the kneecap.
  modification: Double the mat or put a folded towel under the knees. If kneeling is not possible at all,
    this exercise is not available — use a standing alternative.
- condition: low back pain
  condition_aliases:
  - back pain
  - lumbar pain
  - disc herniation
  - slipped disc
  - sciatica
  severity: caution
  reason: Reaching too high arches the lower back, which is the one thing the exercise exists to prevent.
  modification: Reach long and low, stop well below the line of the back, and drop to one limb at a time.
    If the back arches, the range is too big.
