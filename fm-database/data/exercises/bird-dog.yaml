notes_for_coach: 'THE THIRD SPINE-NEUTRAL CORE ENTRY, alongside `forearm-plank` and `floor-bridge`. All
  three screen clear for a bone-loss client where `abdominal-crunch` is blocked, and this one adds the
  axis the other two do not train: resisting rotation.


  It is also the gentlest of the three to start, because level 1 lifts one limb at a time and the load
  can be reduced to almost nothing. For a deconditioned client this is a better first core exercise than
  the plank.


  REQUIRES KNEELING AND A FLOOR TRANSFER, which rules it out for a good part of an older roster regardless
  of the back being safe. `requires_floor_transfer` is true for exactly that reason — see `floor-get-up`,
  which trains the thing this depends on.'
