slug: split-jumps
display_name: Split Jumps (Scissor Skip)
client_name: Scissor skips
client_summary: "A light scissor action — your feet swap front and back with a small hop, a bit like skiing on the spot."
aliases:
- split jump
- scissor jumps
- skier jumps
modality: cardiovascular
intensity_tier: intermediate
position: standing
equipment: []
summary: A light scissor action — the feet exchange front and back with a small hop, like
  cross-country skiing on the spot. The book's gentlest jump.
why_it_works: The split stance keeps each hop small and low, so the heart-rate benefit accumulates
  through cadence rather than height — the book counts it low-intensity plyometric, usable for the
  long intervals that jumps normally cannot sustain. The alternating stride also rehearses the
  step-recovery pattern that catches a stumble.
setup:
- Stand in a short split stance, one foot ahead of the other, both knees soft.
- Bend the arms to 90 degrees, opposite arm forward.
steps:
- Hop lightly and exchange the feet, front to back, driving with the arms.
- Land soft with the knees bent, and immediately exchange again in rhythm.
- Keep the hops small — this is a skip, not a leap.
levels:
- level: '1'
  prescription: 'Step-through version — quick alternating steps, no hop, 3 rounds of 20 seconds'
  sets: 3
  support: none
- level: '2'
  prescription: '4 rounds of 30 seconds with the hop, resting 30 seconds'
  sets: 4
  support: none
- level: '3'
  prescription: '60 continuous exchanges at a high tempo'
  reps: 60
  sets: 1
  support: none
frequency: 2-3x/week inside conditioning circuits.
builds:
- heart and lung fitness
- stride-exchange coordination (the stumble-recovery pattern)
- calf and thigh spring
