  - post-viral fatigue
  - pem
  - myalgic encephalomyelitis
  severity: block
  reason: Timed conditioning intervals are the NICE NG206 pattern to avoid in ME/CFS.
  modification: ''
- condition: pelvic floor dysfunction
  condition_aliases:
  - stress incontinence
  - urinary incontinence
  - prolapse
  - postnatal
  severity: caution
  reason: Continuous hopping raises intra-abdominal pressure with every landing.
  modification: The step-through version keeps the cadence without the flight phase.
- condition: history of falls
  condition_aliases:
  - falls
  - unsteady
  - dizziness
  - peripheral neuropathy
  severity: caution
  reason: Airborne foot exchange demands sure landings in a narrow stance.
  modification: Step-through version beside a counter until stride exchange is confident.
- condition: knee pain
  condition_aliases:
  - osteoarthritis
  - arthritis
  - joint pain
  severity: caution
  reason: Every landing loads a split stance through the front knee.
  modification: Keep the split short and the hop minimal, or use the step-through version.
