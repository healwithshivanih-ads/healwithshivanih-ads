notes_for_coach: 'SHIPPED BECAUSE THE CATALOGUE WAS REFERRING TO SOMETHING IT DID NOT CONTAIN.
  Eight entries carry a pelvic-floor caution whose modification says some version of "until
  pelvic-floor work has restored confidence" — and there was no pelvic-floor entry to point
  at. This is that entry.

  THE BLOCK ON PELVIC PAIN IS THE IMPORTANT PART. The instinct is that pelvic floor problems
  mean a weak pelvic floor, so squeeze more. For a hypertonic floor — which is what pain
  usually indicates — that is precisely wrong and makes symptoms worse. Weakness and tightness
  present with overlapping symptoms and are told apart by examination, not by history, which
  is why pain routes to a physiotherapist rather than to a modification.

  DELIBERATELY HAS NO `levels` LADDER, and that is a modelling decision rather than an
  omission. Every other entry''s levels are a progressive-loading ladder, which is why the
  screen blocks post-exertional malaise from all of them. This is a daily habit whose dose
  grows — closer to cleaning your teeth than to a strength progression — so the graduation
  lives in `frequency` and the PEM caution can stay a caution with a real modification
  instead of a block that would deny a PEM client continence work she may badly need.

  Sims frames the plank as a self-test worth knowing: if the lower belly domes downward during
  a forearm plank, the deep abdominal wall is not doing its job and the plank should be
  regressed (knees down, or hands on a sofa arm) until it stays flat.'
