  severity: caution
  reason: The exercise itself is tiny, but a daily fixed-repetition target is still a
    progression ladder, and the floor position for two of the parts costs energy.
  modification: Do the squeezes only, in whatever position is already being used, with no
    daily count to hit.
refer_out:
- Refer to a pelvic-health physiotherapist for any leaking that is not improving after
  six to eight weeks, any prolapse sensation (heaviness or bulging), or any pelvic pain. This
  is a specialist assessment, and an internal examination is what distinguishes a weak floor
  from a tight one.
