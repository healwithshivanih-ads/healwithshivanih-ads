summary: The three-part pelvic-floor set — held and quick squeezes, elevator abs, and
  child's-pose breathing — trained as one unit with the diaphragm and deep abdominals.
why_it_works: The pelvic floor does not work alone. It forms a canister with the diaphragm
  above, the deep abdominal wall in front and the multifidus behind, and the four contract
  together to manage the pressure that every lift, cough and landing generates. Training the
  squeeze in isolation is why Kegels alone often disappoint; adding the breath work and the
  deep-abdominal lift trains the canister as the pressure system it actually is.
setup:
- Any position will do for the squeezes — sitting, standing or lying.
- For the breathing, kneel and sit back on the heels with the knees about hip-width apart.
- Empty the bladder first; do not practise by stopping the flow mid-stream.
steps:
- Held squeezes — draw the pelvic floor up as if stopping yourself passing water, hold for up
  to 10 seconds, release fully. Repeat up to 10 times.
- Quick squeezes — 10 short, strong lifts, releasing completely between each.
- Elevator abs — lying face down, hold the pelvic-floor lift, then draw the lower belly up
  and in as if a string were lifting it off the floor. Release in reverse order.
- Child's pose breathing — folded forward over the thighs, breathe in wide into the lower
  ribs and out slowly, 6 to 10 breaths.
levels: []
frequency: 'Every day — unlike the rest of this catalogue, this one has no rest day. Build the
  dose rather than the difficulty: start with whatever is manageable today (even three long
  and three short squeezes counts), work toward 10 long squeezes of up to 10 seconds plus 10
  short ones, and add the elevator abs and the breathing once the squeezes are habit.'
builds:
- pelvic floor strength and endurance
- pressure management for lifting, coughing and landing
- the diaphragm-to-pelvic-floor coordination that Kegels alone miss
