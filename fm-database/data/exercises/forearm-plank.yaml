notes_for_coach: 'THE ANSWER TO "WHAT DO I GIVE INSTEAD OF SIT-UPS". This and `floor-bridge` are the
  two spine-neutral core entries, and both screen CLEAR for a bone-loss client where
  `abdominal-crunch` is blocked outright. Trained in the direction the abdomen resists rather than
  the direction it bends, so nothing about it approaches the vertebral-fracture mechanism.

  It is the catalogue''s second sustained isometric, so it inherits the same blood-pressure caution
  as `wall-squat-hold` — keyed to `hypertension` with aliases, because a client record says
  "Hypertension" and not "uncontrolled hypertension". Keep those two entries in step: if the
  practice ever changes its position on isometrics and blood pressure, both need editing.

  A KNEELING PLANK IS THE REAL STARTING POINT for most of this roster, and it is built into level 1
  as a support option rather than shipped as its own entry. The book also gives raised-leg and side
  variants; the side planks load one shoulder heavily and the rotator and twist versions add loaded
  spinal rotation, so none of those were shipped. Side plank is the sensible next step if someone
  outgrows this, but screen the shoulder first.'
