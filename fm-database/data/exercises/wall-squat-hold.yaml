notes_for_coach: 'THE ONE SAFETY POINT THIS BOOK ADDS THAT OTAGO DOES NOT. Every other strength
  entry in this catalogue is repetition work; this is the only sustained isometric, and the book
  singles isometrics out as the thing to avoid with high blood pressure. That caution is keyed to
  `hypertension` with aliases rather than to `uncontrolled hypertension` alone, deliberately — a
  client record on this roster says "Hypertension", not "uncontrolled hypertension", and a caution
  keyed to vocabulary the records do not use is an absent caution.

  IT IS A `caution`, NOT A `block`, AND THAT IS A CONSIDERED CALL. A hard block would withhold this
  from every well-controlled hypertensive client, and short supervised isometric work is not the
  hazard — the hazard is a long strained hold with a held breath while blood pressure is
  unmanaged. The modification says exactly that, and says to use squat repetitions instead when it
  is not yet safe. If the practice ever decides to be stricter, change it here, not by adding a
  second overlapping caution.

  `harder_variant` points at bodyweight-squat because moving is genuinely harder than holding here,
  and this is the gentler doorway into leg strengthening for a knee that objects to repetitions.'
