notes_for_coach: 'THE STEP `forearm-plank` ALREADY POINTS AT. That entry''s notes say side plank is the
  sensible next move but the shoulder must be screened first — this entry exists to be that step, and
  it carries a deliberately stronger shoulder caution than the front plank because the load goes through
  one joint rather than two.


  The fourth spine-neutral core entry and the only one training the lateral axis. `bird-dog` is set as
  its easier variant: same spine-neutral principle, far less shoulder load, and no single-sided weight
  bearing.


  The book''s rotating and twisting side-plank variants were NOT taken — they add loaded spinal rotation,
  which is the other osteoporosis red line.'
