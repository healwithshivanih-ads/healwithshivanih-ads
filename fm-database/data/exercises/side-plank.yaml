cautions:
- condition: post-exertional malaise
  condition_aliases:
  - long covid
  - long-covid
  - me/cfs
  - chronic fatigue
  - post-viral fatigue
  - pem
  - myalgic encephalomyelitis
  severity: block
  reason: NICE NG206 withdrew graded exercise therapy for ME/CFS, and every level ladder here is a progression
    schedule.
  modification: ''
- condition: hypertension
  condition_aliases:
  - high blood pressure
  - raised blood pressure
  - htn
  - hypertensive
  - uncontrolled hypertension
  - preeclampsia
  severity: caution
  reason: A sustained isometric drives a pressor response for as long as it lasts, and holding the breath
    against it raises blood pressure sharply — the warning this catalogue carries on every hold.
  modification: Keep holds to 15 seconds, breathe audibly so the breath cannot be held, and rest fully
    between sides. Do not prescribe while blood pressure is uncontrolled or unmeasured.
- condition: shoulder pain
  condition_aliases:
  - rotator cuff
  - frozen shoulder
  - shoulder impingement
  - adhesive capsulitis
  - shoulder injury
  severity: caution
  reason: The entire body weight rests on ONE shoulder for the whole hold — double the load of a front
    plank, on a single joint.
  modification: Screen the shoulder before prescribing at all. Hold from the knees to reduce the load,
    shorten the hold, and work only the unaffected side if one shoulder is the problem.
- condition: hip pain
  condition_aliases:
  - hip osteoarthritis
  - hip replacement
  - hip bursitis
  - trochanteric
  - hip injury
  severity: caution
  reason: The down-side hip carries the load and the greater trochanter presses into the mat, which is
    exactly where bursitis hurts.
  modification: Double the mat under the hip, or skip this and use `bird-dog` instead.
- condition: low back pain
  condition_aliases:
  - back pain
  - lumbar pain
  - disc herniation
  - slipped disc
  - sciatica
  severity: caution
  reason: If the side cannot hold the line the hips drop and the load transfers to the lower back.
  modification: Hold from the knees and stop the moment the hips start to sag. A short well-held position
    beats a long collapsing one.
