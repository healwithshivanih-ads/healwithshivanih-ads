slug: side-plank
display_name: Side Plank (Lateral Isometric Hold)
client_name: Side hold
aliases:
- side plank
- lateral plank
- side hold
- side bridge
modality: strength
intensity_tier: intermediate
position: side_lying
equipment:
- a mat or folded blanket
summary: Holding the body in a straight line on one forearm and the side of the feet or knees.
why_it_works: The muscles down the side of the trunk are the ones that stop you buckling sideways, and
  nothing else in this catalogue trains them. Gravity tries to drop the hips to the floor and the whole
  side contracts to refuse. Like the front plank it is an anti-movement exercise, so the spine stays neutral
  and neither bends nor twists under load.
setup:
- Lie on one side with the elbow directly under the shoulder and the forearm flat on the mat.
- Stack the knees and feet, or bend the knees to 90 degrees for the easier version.
- Lift the hips until the body is one straight line from head to knees or feet.
steps:
- Hold still, with the hips lifted and level — do not let them sag towards the floor or roll forward.
- Keep the shoulder pulled away from the ear rather than sinking into it.
- Look straight ahead so the neck stays in line with the spine.
- Breathe normally. The hold ends when the line goes, not when the timer does. Change sides.
levels:
- level: '1'
  prescription: hold 15 seconds from the knees, each side, twice
  hold_seconds: 15
  sets: 2
  support: knees bent, weight on the knee rather than the foot
- level: '2'
  prescription: hold 20 seconds from the feet, each side, twice
  hold_seconds: 20
  sets: 2
  support: none
- level: '3'
  prescription: hold 40 seconds each side, twice
  hold_seconds: 40
  sets: 2
  support: none
frequency: 3x/week.
builds:
- lateral trunk strength
- hip stability
- trunk stiffness that protects the lower back
easier_variant: bird-dog
harder_variant: null
movement_patterns:
- core_brace
muscles_worked:
- obliques
- abdominals
- shoulders
- hip_abductors
loads_spine: false
spinal_flexion: false
loaded_spinal_rotation: false
overhead: false
impact: none
balance_demand: 2
requires_floor_transfer: true
joint_stress:
- shoulder
