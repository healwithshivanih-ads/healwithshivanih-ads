notes_for_coach: 'THE GENTLEST REAL STRENGTH ENTRY IN THE CATALOGUE, and the one to reach for when
  almost everything else screens out. No balance demand, no impact, negligible knee load, spine held
  straight — it clears for the bone-loss client, the falls-risk client and the painful-knee client
  alike, which very little else does.

  Together with `forearm-plank` this is the spine-neutral half of the core work. Where
  `abdominal-crunch` bends the loaded spine and is blocked for low bone density, these two train the
  midsection and hips without ever going in that direction. Prescribe them as the swap rather than
  simply refusing the crunch.

  Pairs naturally with `prone-back-extension` — one works the back of the hips lying face up, the
  other the back muscles lying face down, and between them they cover the whole posterior chain
  without a single forward bend. The book''s single-leg version was not shipped; it roughly doubles
  the load on one hip and belongs behind a screen this entry is specifically here to avoid needing.'
