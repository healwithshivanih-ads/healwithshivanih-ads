slug: floor-bridge
display_name: Floor Bridge (Supine Hip Lift)
client_name: Lifting your hips off the floor
aliases:
- glute bridge
- hip bridge
- bridge
- hip raise
- floor bridging
modality: strength
intensity_tier: beginner
position: lying_supine
equipment:
- a mat or folded blanket
summary: Lying on the back and lifting the hips — buttock and hamstring strength with the spine held
  straight, and one of the gentlest useful movements in the catalogue.
why_it_works: The gluteal muscles extend the hip, which is the action behind standing up, climbing
  stairs and walking uphill, and they are commonly weak in anyone who sits a lot. Lifting the hips
  from lying trains that action against nothing more than body weight, in a position where balance
  is irrelevant and the knees take almost no load. The spine moves into extension rather than
  bending, so it is safe in the direction that matters for fragile bone.
setup:
- Lie on the back with the knees bent and the feet flat, hip-width apart and close enough that the
  fingertips could brush the heels.
- Rest the arms alongside the body, palms down.
- Let the head and shoulders stay heavy on the floor throughout.
steps:
- Press through the heels and lift the hips until the body makes a straight line from the shoulders
  to the knees.
- Squeeze the buttocks at the top and hold for two or three seconds.
- Lower slowly, stopping just short of the floor rather than resting between repetitions.
- Keep the ribs down so the lift comes from the hips rather than from arching the lower back.
levels:
- level: '1'
  prescription: 8 lifts, holding two seconds at the top
  reps: 8
  sets: 1
  hold_seconds: 2
  support: both feet flat
- level: '2'
  prescription: 12 lifts, holding three seconds at the top
  reps: 12
  sets: 1
  hold_seconds: 3
  support: both feet flat
- level: '3'
  prescription: 12 lifts, rest, then a second set
  reps: 12
  sets: 2
  hold_seconds: 3
  support: both feet flat
frequency: 3-4x/week. It is light enough to sit alongside the leg work rather than replace it.
builds:
- buttock and hamstring strength
- hip extension for standing and stairs
- lower-back support
