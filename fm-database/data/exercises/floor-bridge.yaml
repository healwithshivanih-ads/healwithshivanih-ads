cautions:
- condition: post-exertional malaise
  condition_aliases:
  - long covid
  - long-covid
  - me/cfs
  - chronic fatigue
  - post-viral fatigue
  - pem
  - myalgic encephalomyelitis
  severity: block
  reason: 'NICE NG206 withdrew graded exercise therapy for ME/CFS: this entry carries a fixed
    repetition ladder, which is the progression shape that can provoke a lasting relapse — even
    though the movement itself is gentle.'
  modification: ''
- condition: low back pain
  condition_aliases:
  - back pain
  - lumbar pain
  - spinal stenosis
  - spondylolisthesis
  - facet joint
  severity: caution
  reason: Lifting too high arches the lower back instead of extending the hip, which loads the facet
    joints — the commonest way this gentle movement is made uncomfortable.
  modification: Lift only until the body is straight from shoulders to knees and no further, and
    keep the ribs down. A lower, well-controlled lift is the correct one.
- condition: pregnancy
  condition_aliases:
  - pregnant
  - third trimester
  severity: caution
  reason: Lying flat on the back is unsuitable beyond the first trimester.
  modification: Use a standing or seated hip-extension movement instead until after delivery.
- condition: hamstring cramp
  condition_aliases:
  - cramps
  - muscle cramp
  - hamstring
  severity: caution
  reason: With weak glutes the hamstrings take over and cramp at the top of the lift.
  modification: Bring the heels closer to the buttocks so the glutes do more of the work, and lower
    at once if a cramp starts.
