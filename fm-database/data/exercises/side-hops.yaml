linked_to_symptoms: []
notes_for_coach: 'THE ONLY MULTI-DIRECTIONAL IMPACT IN THE CATALOGUE, and that is the entire
  point of shipping it. Sims argues that running and walking are poor bone stimuli precisely
  because they repeat the forward line the skeleton is already adapted to; sideways landing
  is novel loading, and novel is what bone answers. For a perimenopausal client with
  low-normal bone density this earns its place ahead of more walking.

  Keep the object genuinely low — a rolled towel, not a step. The height adds nothing to the
  bone stimulus and everything to the fall risk.'
