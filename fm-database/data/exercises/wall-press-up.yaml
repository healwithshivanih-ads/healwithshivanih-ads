impact: none
requires_floor_transfer: false
cautions:
- condition: post-exertional malaise
  condition_aliases:
  - long covid
  - long-covid
  - me/cfs
  - chronic fatigue
  - post-viral fatigue
  - pem
  - myalgic encephalomyelitis
  severity: block
  reason: 'NICE NG206 withdrew graded exercise therapy for ME/CFS: a programme of fixed incremental
    increases can provoke a lasting relapse. The repetition ladder in this entry is exactly that
    shape, however gentle the movement looks.'
  modification: ''
- condition: shoulder pain
  condition_aliases:
  - rotator cuff
  - frozen shoulder
  - shoulder impingement
  - adhesive capsulitis
  - shoulder injury
  severity: caution
  reason: Loaded shoulder flexion is the position that provokes impingement and rotator-cuff pain.
  modification: Keep the hands no wider than the shoulders and stop the descent short of any pinch
    at the front of the shoulder. Work in a pain-free range; if the range is tiny, that is still
    the right range.
- condition: carpal tunnel syndrome
  condition_aliases:
  - wrist pain
  - carpal tunnel
  - wrist arthritis
  - de quervain
  severity: caution
  reason: A flat palm on the wall holds the wrist extended under load, which raises carpal-tunnel
    pressure and provokes wrist-joint pain.
  modification: Press through a loose fist with the wrist straight, or place the forearms on the
    wall instead of the hands.
- condition: uncontrolled hypertension
  condition_aliases:
  - high blood pressure
  - raised blood pressure
  - hypertension
  severity: caution
  reason: Any resistance work raises blood pressure transiently, and breath-holding against effort
    raises it sharply.
  modification: Breathe out on the push and in on the lower; never hold the breath. Stop for
    head pressure, throbbing or dizziness. Confirm blood pressure is being managed before adding
    the second set.
