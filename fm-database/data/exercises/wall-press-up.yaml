slug: wall-press-up
display_name: Wall Press Up (Standing Incline Push)
client_name: Pushing away from the wall
aliases:
- wall push up
- wall pushup
- standing press up
modality: strength
intensity_tier: beginner
position: standing
equipment:
- a clear stretch of solid wall
summary: The easiest usable pressing movement — upper-body strength built standing, with no floor
  transfer and no equipment.
why_it_works: A press-up is one movement whose difficulty is set by how much of the body weight the
  arms carry, and that is set by the angle. Standing almost upright against a wall puts the smallest
  possible share through the arms, so the same pattern that is impossible on the floor becomes
  achievable — and the load can then be increased by changing position rather than by adding weight.
setup:
- Stand facing a solid wall, about an arm's length away, feet hip-width apart.
- Place both palms flat on the wall a little wider than the shoulders, at roughly shoulder height.
- Let the body lean in until it forms one straight line from the head to the heels.
steps:
- Bend the elbows and lower the chest slowly towards the wall until it is almost touching.
- Keep the line from head to heels — the hips should not lead or lag.
- Push back to the leaning start position by straightening the arms.
- Move at a steady, controlled speed rather than bouncing off the wall.
levels:
- level: '1'
  prescription: 8 repetitions, standing close to the wall
  reps: 8
  sets: 1
  support: standing near-upright, small lean
  note: Start here if pressing is new. The closer the feet are to the wall, the easier it is.
- level: '2'
  prescription: 12 repetitions, feet a step further back
  reps: 12
  sets: 1
  support: standing, moderate lean
- level: '3'
  prescription: 15 repetitions, rest, then a second set of 15
  reps: 15
  sets: 2
  support: standing, deeper lean
  note: When two sets of 15 feel comfortable, the next gain comes from changing the movement, not
    from adding more repetitions — move to the kneeling version.
frequency: 2-3x/week with at least a day between sessions.
builds:
- chest and shoulder strength
- arm strength for pushing and carrying
- the pressing pattern, learned safely
easier_variant: null
harder_variant: kneeling-press-up
