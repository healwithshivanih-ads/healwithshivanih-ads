notes_for_coach: 'THE ENTRY POINT FOR UPPER-BODY WORK ON THIS ROSTER, and the reason it was worth
  ingesting a book aimed at fit people. Everything else in this catalogue''s strength set came from
  the Otago falls manual, which is legs-only — there was no arm or chest work at all, and nothing
  that could be given to someone who cannot get down to and up off the floor. This one is done
  standing at a wall, needs no equipment and no floor transfer, and is genuinely the easiest rung
  of a real ladder rather than a token movement.

  Progression here is by CHANGING THE MOVEMENT, not by piling on repetitions — see the level 3 note.
  Past about 15-20 comfortable reps a client is training endurance, not strength; the strength gain
  comes from moving to kneeling. That is the book''s central bodyweight principle and it applies to
  every pressing entry in this catalogue.'
