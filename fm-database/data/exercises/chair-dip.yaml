linked_to_symptoms:
- muscle-weakness
notes_for_coach: 'THE RUNG ABOVE `floor-dip`, and wired as its harder variant. Unlike the floor version
  it needs no floor transfer, which makes it available to a client who cannot get down to the mat — worth
  remembering, because it is one of very few upper-body strength options for that group.


  THE SHOULDER CAUTION IS THE STRONGEST ON ANY PUSHING ENTRY, and deliberately so. Shoulder extension
  under load is where this movement bites, and it bites early. Screen before prescribing.


  CHAIR STABILITY IS A REAL HAZARD, not a formality — a chair on a hard floor slides. Put it against a
  wall.'
