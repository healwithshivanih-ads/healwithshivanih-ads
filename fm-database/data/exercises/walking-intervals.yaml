slug: walking-intervals
display_name: Walking Intervals (Aerobic Interval Training on Foot)
client_name: Brisk and easy walking
client_summary: "Alternating brisk and easy walking in timed blocks. You get more from it than walking at one steady pace, without needing to run."
aliases:
- interval walking
- brisk walk intervals
- walk intervals
- fartlek walking
modality: cardiovascular
intensity_tier: intermediate
position: walking
equipment:
- supportive shoes
- a watch or phone timer
summary: Alternating brisk and easy walking in timed blocks — more cardiovascular benefit than
  steady walking, without needing to run.
why_it_works: A steady walk settles at one intensity the body soon finds easy. Alternating a harder
  block with an easy one lets the harder block be genuinely harder than anything sustainable for the
  whole walk, and the easy block is what makes that repeatable. It is the same interval structure
  used for running, done at walking speeds, so it stays available to someone with knees that will
  not tolerate impact.
setup:
- Choose a flat, even route — a park loop or a quiet stretch of road, not broken pavement.
- Walk easily for three to five minutes first to warm up.
- Decide the effort by feel, not by pace. Brisk means breathing noticeably harder but still able to
  speak in short sentences; easy means able to talk comfortably.
steps:
- Walk briskly for three minutes.
- Drop to an easy, comfortable pace for three minutes.
- Repeat that pair for the number of rounds prescribed.
- Finish with three to five minutes of easy walking to bring the pulse down gradually rather than
  stopping abruptly.
levels:
- level: '1'
  prescription: 3 brisk-and-easy pairs, about 20 minutes including warm-up and cool-down
  reps: 3
  sets: 1
  support: flat route
- level: '2'
  prescription: 5 pairs, about 30 minutes in total
  reps: 5
  sets: 1
  support: flat route
- level: '3'
  prescription: 8 pairs, about 45 minutes in total
  reps: 8
  sets: 1
  support: flat route, or add a gentle incline to the brisk blocks
frequency: 2-3x/week, alongside rather than instead of ordinary daily walking.
builds:
- heart and lung fitness
- walking stamina
- the ability to hurry without getting winded
