notes_for_coach: 'COMPLETES THE SECOND DEAD-END CHAIN. `walking-plan` came from the Otago manual and
  had no `harder_variant` — the manual is explicit that walking alone does not reduce falls, so it
  was never meant to be the whole cardiovascular answer, and there was nothing above it. This is
  that rung, and it stays on foot, which matters for a roster where walking is the activity clients
  actually do.

  EFFORT IS PRESCRIBED BY FEEL, NOT BY HEART RATE, on purpose. The book gives age-predicted maximum
  heart rate and percentage zones, and admits in the same breath that the formula is out by roughly
  twelve beats either way and is less accurate for women. Nobody on this roster wears a monitor.
  Perceived effort — the talk test — is the honest instrument here and it costs nothing.

  This is the entry to reach for with the metabolic cohort. Post-meal brisk walking is the single
  most transferable thing in the catalogue for blood sugar, and the interval structure gives it a
  progression that a plain walk does not.'
