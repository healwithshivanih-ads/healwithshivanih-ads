cautions:
- condition: post-exertional malaise
  condition_aliases:
  - long covid
  - long-covid
  - me/cfs
  - chronic fatigue
  - post-viral fatigue
  - pem
  - myalgic encephalomyelitis
  severity: block
  reason: 'NICE NG206 withdrew graded exercise therapy for ME/CFS: a fixed schedule of increasing
    intervals is precisely that, and pushing into breathlessness is the kind of exertion that
    provokes a delayed crash.'
  modification: ''
- condition: uncontrolled hypertension
  condition_aliases:
  - high blood pressure
  - raised blood pressure
  - hypertension
  - angina
  - heart disease
  - heart failure
  - arrhythmia
  severity: caution
  reason: Interval work deliberately pushes the heart rate higher than steady walking does, which is
    the intensity band that needs clearance when there is cardiovascular disease.
  modification: Confirm medical clearance before the brisk blocks. Keep the brisk effort at "can
    still speak in short sentences" rather than breathless, and stop for chest tightness,
    unusual breathlessness or light-headedness.
- condition: knee pain
  condition_aliases:
  - osteoarthritis
  - knee osteoarthritis
  - arthritis
  - joint pain
  - hip osteoarthritis
  - plantar fasciitis
  severity: caution
  reason: Walking faster increases the load through the knee and hip with every step, and the total
    step count rises with the session length.
  modification: Lengthen the easy blocks rather than shortening the walk, keep to flat even ground,
    and check the shoes. Reduce the number of pairs if joints are sore the following day.
- condition: history of falls
  condition_aliases:
  - falls
  - unsteady
  - dizziness
  - vertigo
  - syncope
  - peripheral neuropathy
  severity: caution
  reason: Walking faster reduces the time available to recover from a trip, and outdoor ground is
    uneven.
  modification: Keep the brisk blocks to smooth, familiar, well-lit ground and walk with someone
    until the pace is confident. Do not prescribe brisk outdoor walking to someone still working on
    standing balance.
