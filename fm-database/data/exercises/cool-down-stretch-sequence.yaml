slug: cool-down-stretch-sequence
display_name: Cool Down and Held Stretch Sequence
client_name: Winding down after moving
aliases:
- cool down
- cooldown
- post-workout stretch
- stretching
- static stretching
modality: flexibility
intensity_tier: beginner
position: any_position
equipment: []
summary: The end of a session — a few minutes of easing off, then stretches held long enough to
  matter, at the point when the muscles are warm.
why_it_works: Stopping hard exercise abruptly lets blood pool in the legs, which is what produces
  the light head afterwards, so the pulse is brought down gradually instead. Stretching is put here
  rather than at the start because warm muscle lengthens more readily and there is reasonable doubt
  that stretching a cold muscle before hard work helps at all. Hold time is what separates a stretch
  that maintains range from one that builds it.
setup:
- Finish the main session and keep moving gently rather than sitting straight down.
- Have a wall or counter within reach for the standing leg stretches.
steps:
- Walk about, or march on the spot, for three to five minutes, letting the effort taper off until
  breathing is comfortable.
- Then take one stretch per body part, moving slowly into each until a mild pull is felt — never
  pain — and hold it still without bouncing.
- Back of the upper arm - reach one arm overhead, bend the elbow so the hand drops behind the neck,
  and ease the elbow back with the other hand.
- Chest - stand tall, clasp the hands behind the back and lift them gently away.
- Front of the thigh - stand on one leg holding support, catch the other ankle behind and draw the
  heel towards the buttock, keeping the knees together.
- Back of the thigh - step one foot forward with the leg straight and the toes up, then hinge
  forward from the hip with the back flat.
- Calf - step one foot well back, heel down, and lean into the front leg.
- Breathe normally throughout. Holding the breath during a stretch is common and unhelpful.
frequency: After every session.
builds:
- range of movement kept or gained
- a gradual return to rest rather than an abrupt stop
- less next-day stiffness
