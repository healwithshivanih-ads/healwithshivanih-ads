notes_for_coach: 'HOLD TIME IS THE PRESCRIPTION, and it is the bit clients get wrong. Fifteen to
  twenty seconds MAINTAINS the range that exists. Twenty-five to thirty seconds, held until the
  tension eases and then eased a little further, is what actually DEVELOPS range. A six-second
  stretch — which is what most people do — is not long enough to change anything, and the book is
  candid that it doubts the value of the brief pre-exercise version for that reason.

  The stretch positions here are described from the book''s photographs plus standard practice; the
  written cues for the individual stretches were not part of what was read, so they are deliberately
  short and generic. Anyone who wants a fuller stretch library should build it from a source read in
  full rather than expanding this entry.

  Single-level and unprogressive, like the warm-up, so it is not withheld from a client with
  post-exertional malaise. Do not add levels.'
