cautions:
- condition: history of falls
  condition_aliases:
  - falls
  - unsteady
  - dizziness
  - vertigo
  - syncope
  - peripheral neuropathy
  severity: caution
  reason: The thigh and calf stretches are done standing on one leg or in a long stride, at the end
    of a session when the legs are already tired.
  modification: Keep a hand on a solid counter throughout, or take the thigh stretch lying on the
    side instead. Never balance against a chair that can slide.
- condition: hypermobility
  condition_aliases:
  - joint hypermobility
  - ehlers-danlos
  - hypermobile
  - eds
  - loose joints
  severity: caution
  reason: A hypermobile joint reaches a big range before anything is felt, so stretching to the
    point of sensation can mean stretching past a safe end range.
  modification: Stop at the first hint of a stretch rather than chasing the pull, and hold to
    maintain range rather than to increase it. Strength work matters more than length here.
- condition: acute injury
  condition_aliases:
  - recent injury
  - muscle tear
  - sprain
  - strain
  - post-surgical
  severity: caution
  reason: Stretching into recently injured tissue can pull on healing fibres.
  modification: Leave the injured area out and stretch everything else, until a clinician has
    cleared it.
