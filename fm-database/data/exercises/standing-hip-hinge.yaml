notes_for_coach: 'MORE A PATTERN THAN AN EXERCISE, and the highest-transfer item in the catalogue — it
  is the movement every client performs a dozen times a day, usually badly.


  THE OSTEOPOROSIS CAUTION IS DELIBERATELY NOT A BLOCK, which is unusual for a forward-bending entry and
  the reasoning should not be reversed casually: the red line is spinal FLEXION, and a true hinge produces
  none — the spine stays neutral while the hip moves. `spinal_flexion` is therefore false. That is precisely
  why a bone-loss client needs this taught rather than being told never to bend, which is neither achievable
  nor safe advice.


  The stick is the whole teaching method. Without feedback most people believe their back is flat when
  it is not.'
