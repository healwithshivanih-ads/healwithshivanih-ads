cautions:
- condition: post-exertional malaise
  condition_aliases:
  - long covid
  - long-covid
  - me/cfs
  - chronic fatigue
  - post-viral fatigue
  - pem
  - myalgic encephalomyelitis
  severity: block
  reason: NICE NG206 withdrew graded exercise therapy for ME/CFS, and every level ladder here is a progression
    schedule.
  modification: ''
- condition: low back pain
  condition_aliases:
  - back pain
  - lumbar pain
  - disc herniation
  - slipped disc
  - sciatica
  severity: caution
  reason: Done correctly this is protective and is often exactly what a painful back needs. Done with
    a rounded spine it is the movement that hurt it in the first place.
  modification: Use the stick every time until the pattern is automatic, keep the range shallow, and add
    no load at all. If it cannot be done without rounding, refer for hands-on teaching rather than practising
    the fault.
- condition: osteoporosis
  condition_aliases:
  - osteopenia
  - low bone density
  - low bone mass
  - vertebral fracture
  - brittle bones
  severity: caution
  reason: Bending forward is the vertebral red line — but ONLY when the spine rounds. A true hinge keeps
    it neutral, which is why this movement is the safe way for a bone-loss client to reach the floor at
    all.
  modification: Teach with the stick and insist on the three contact points. No added load. If the flat
    back cannot be held, do not use this movement.
- condition: hamstring injury
  condition_aliases:
  - hamstring strain
  - hamstring tear
  - pulled hamstring
  severity: caution
  reason: The hinge stretches and loads the hamstring at length, which is where a healing strain fails.
  modification: Stay in a very shallow range with no load and stop at the first pull.
refer_out:
- a physiotherapy assessment if the flat back cannot be achieved even with the stick
