slug: standing-hip-hinge
display_name: Standing Hip Hinge (Bend-and-Reach Pattern)
client_name: Bending safely from the hips
client_summary: "Learning to bend by sending your hips backwards instead of rounding your back."
aliases:
- hip hinge
- hinge
- good morning
- stiff leg hinge
- bend from the hips
modality: strength
intensity_tier: beginner
position: standing
equipment:
- a stick, broom handle or wall to check the back stays flat
summary: Learning to bend by sending the hips backwards rather than rounding the spine.
why_it_works: 'Most people bend by rounding the back, which loads the discs and the ligaments. The hinge
  sends the hips backwards instead, so the movement happens at the hip joint and the spine stays neutral
  — the back muscles hold their line while the hamstrings and glutes take the load. This is less an exercise
  than a pattern: it is how a bin should be lifted, how a shoe should be picked up, and how every deadlift-shaped
  task in daily life ought to be done.'
setup:
- Stand with the feet hip width apart and a soft bend in the knees.
- Hold a stick along the spine, touching the back of the head, the upper back and the tailbone — three
  points of contact that tell you the back is flat.
- Rest the hands on the front of the hips if no stick is available.
steps:
- Push the hips straight backwards, as if closing a car door with them.
- Let the chest travel forward as a consequence — do not bend it deliberately.
- Go only as far as the back stays flat. For most people that is somewhere above the knee, and it is felt
  as a stretch behind the thighs.
- Drive the hips forward to stand up, squeezing the buttocks at the top.
- If the stick loses contact at any of the three points, the back has rounded and the range was too big.
levels:
- level: '1'
  prescription: 8 hinges to a shallow angle with the stick, twice
  reps: 8
  sets: 2
  support: stick along the spine as feedback
- level: '2'
  prescription: 10 hinges to a deeper angle without the stick, twice
  reps: 10
  sets: 2
  support: none
- level: '3'
  prescription: 10 hinges holding a light household weight, twice
  reps: 10
  sets: 2
  support: none
  note: A shopping bag or water bottle in each hand is enough. This is the point at which the pattern
    becomes strength work.
frequency: 3-4x/week, and rehearse it whenever something needs picking up.
builds:
- hamstring and buttock strength
- a spine-sparing way to bend and lift
- the pattern behind safe lifting in daily life
