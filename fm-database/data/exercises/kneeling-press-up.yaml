notes_for_coach: 'The first entry in the pressing ladder that needs a FLOOR TRANSFER — check the
  client can get down and back up unaided before prescribing it. That is a real gate on this roster
  and it is why the wall version exists as a permanent alternative rather than a stepping stone to
  be discarded.

  The book lists an "extended kneeling" version between this and the full press-up, where the knees
  move further back. It is not a separate catalogue entry: it is the same movement with a longer
  lever, and the honest way to use it is as a bridge when level 3 here is easy but the full press-up
  is not yet possible. Walk the knees back a hand-width at a time.'
