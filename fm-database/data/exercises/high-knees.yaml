cautions:
- condition: post-exertional malaise
  condition_aliases:
  - long covid
  - long-covid
  - me/cfs
  - chronic fatigue
  - post-viral fatigue
  - pem
  - myalgic encephalomyelitis
  severity: block
  reason: Timed continuous conditioning pushes through the energy envelope by design (NICE NG206).
  modification: ''
- condition: pelvic floor dysfunction
  condition_aliases:
  - stress incontinence
  - urinary incontinence
  - prolapse
  - pelvic organ prolapse
  - postnatal
  severity: caution
  reason: Single-leg landings at cadence spike intra-abdominal pressure repeatedly.
  modification: March the knees high without the hop — same movement, no flight phase — until
    pelvic-floor work has restored confidence.
- condition: history of falls
  condition_aliases:
  - falls
  - unsteady
  - dizziness
  - vertigo
  - peripheral neuropathy
  severity: caution
  reason: A fast single-leg hop is a balance demand at speed; a trip here is a fall.
  modification: Use the marching version beside a counter until single-leg stance is confirmed
    steady (one-leg-stand level 2).
- condition: knee pain
  condition_aliases:
  - osteoarthritis
  - arthritis
  - joint pain
  - meniscus
  severity: caution
  reason: Repeated single-leg landings load one knee at a time at cadence.
  modification: March instead of hop; height of the knee matters more than the bounce.
- condition: uncontrolled hypertension
  condition_aliases:
  - high blood pressure
  - hypertension
  severity: caution
  reason: High-cadence whole-body work raises blood pressure sharply.
  modification: Shorter intervals at a talking pace; stop for a pounding head or dizziness.
