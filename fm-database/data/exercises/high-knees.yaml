notes_for_coach: 'The marching version (level 1) is a legitimate exercise on its own, not an
  apology — it is knee-height hip-flexor work with zero flight time, and for most of the current
  roster it is the correct entry point. The book''s "plus skip" variation is folded in as the
  level-3 option rather than a separate entry.'
