slug: high-knees
display_name: High Knees (On-the-Spot Knee Drive)
client_name: High knees on the spot
aliases:
- high knee run
- knee drives
- high knees plus skip
modality: cardiovascular
intensity_tier: intermediate
position: standing
equipment: []
summary: Hopping from foot to foot while driving each knee towards the chest — running on the spot
  with intent, the step up from star jumps.
why_it_works: Driving the knee high recruits the hip flexors and calves at a faster cadence than
  jacks, and the single-leg landings add a balance and bone stimulus the two-footed jump lacks. The
  book uses it as its longer-interval engine because effort scales smoothly with knee height and
  tempo.
setup:
- Stand tall, feet slightly wider than hip-width, eyes ahead.
- Rise onto the balls of the feet.
steps:
- Lift one knee towards the chest while shifting the weight to the other leg.
- Rapidly swap — a light hop from foot to foot, knees lifting high, arms driving in rhythm.
- Keep the trunk tall; do not lean back to lift the knees.
levels:
- level: '1'
  prescription: '3 rounds of 15 seconds at marching pace (no hop), resting 45 seconds'
  sets: 3
  support: none
- level: '2'
  prescription: '4 rounds of 30 seconds with the hop, resting 30 seconds'
  sets: 4
  support: none
- level: '3'
  prescription: '60 continuous repetitions at a high tempo, or add a small skip between knee lifts'
  reps: 60
  sets: 1
  support: none
frequency: 2-3x/week inside conditioning circuits, after a warm-up.
builds:
- heart and lung fitness
- hip flexor and calf power
- single-leg landing control
easier_variant: jumping-jacks
harder_variant: mountain-climbers
movement_patterns:
- jump
- balance
muscles_worked:
- quadriceps
- calves
- glutes
- hamstrings
impact: high
balance_demand: 2
joint_stress:
