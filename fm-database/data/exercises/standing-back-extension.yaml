slug: standing-back-extension
display_name: Standing Back Extension
client_name: Gentle backward arch
modality: flexibility
intensity_tier: beginner
position: standing
summary: A small standing extension of the lower back — and one of the few spinal movements that
  is actively wanted rather than merely tolerated in low bone density.
why_it_works: Counters the flexed posture that sitting and kyphosis reinforce. Extension loads the
  posterior elements rather than compressing the vertebral bodies, which is why it sits on the opposite
  side of the line from flexion work.
setup:
- Stand tall with the feet about shoulder-width apart.
- Rest both hands on the small of the back for support.
steps:
- Arch gently backwards, letting the hands support the movement.
- Go only as far as is comfortable — this is a mobilisation, not a stretch to be felt.
- Return upright. Repeat five times.
levels:
- level: A
  prescription: 5 slow repetitions
  reps: 5
  support: hands on the back
frequency: Before every session, as part of a 5-minute warm-up.
builds:
- spinal extension range
- upright posture
joint_stress:
- lower_back
balance_demand: 1
impact: none
movement_patterns:
- mobility
muscles_worked:
- lower_back
spinal_flexion: false
cautions:
- condition: spinal stenosis
  severity: caution
  reason: Extension narrows the canal and can provoke leg symptoms in stenosis — the one condition
    where this direction is the uncomfortable one.
  modification: Keep the range very small, or omit; substitute the ankle and trunk warm-ups.
notes_for_coach: WORTH KNOWING THE DIRECTION. In low bone density it is spinal FLEXION (toe-touches,
  sit-ups, loaded crunches) that carries vertebral fracture risk — extension is the direction usually
  encouraged. This entry is therefore appropriate for Pranati (cl-009, osteoporosis on teriparatide),
  and the `spinal_flexion` flag on every entry exists so that distinction is machine-readable rather
  than remembered.
