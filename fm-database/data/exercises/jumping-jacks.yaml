cautions:
- condition: post-exertional malaise
  condition_aliases:
  - long covid
  - long-covid
  - me/cfs
  - chronic fatigue
  - post-viral fatigue
  - pem
  - myalgic encephalomyelitis
  severity: block
  reason: 'Continuous-effort conditioning is exactly the shape NICE NG206 warns about in ME/CFS:
    a timed interval pushes through the energy envelope by design.'
  modification: ''
- condition: pelvic floor dysfunction
  condition_aliases:
  - stress incontinence
  - urinary incontinence
  - prolapse
  - pelvic organ prolapse
  - postnatal
  severity: caution
  reason: Repeated jumping raises intra-abdominal pressure on every landing, the classic provocation
    for stress leakage and prolapse symptoms.
  modification: Swap the jump for a step-out version (step the feet wide alternately while raising
    the arms) until pelvic-floor work has restored confidence; volume comes before height.
- condition: knee pain
  condition_aliases:
  - osteoarthritis
  - knee osteoarthritis
  - arthritis
  - joint pain
  - meniscus
  severity: caution
  reason: Every landing is a ground-reaction spike through the knees, dozens of times a minute.
  modification: Use the step-out version, or halve the interval length and land consciously softly.
- condition: severe osteoporosis
  condition_aliases:
  - fragility fracture
  - vertebral fracture
  - t-score below -3
  severity: caution
  reason: High-impact work is a bone stimulus at moderate bone loss but a fracture risk once
    fragility fractures have occurred.
  modification: With established fragility, use the step-out version; the impact decision belongs
    with the treating doctor.
- condition: uncontrolled hypertension
  condition_aliases:
  - high blood pressure
  - raised blood pressure
  - hypertension
  severity: caution
  reason: Sustained overhead arm work with jumping raises blood pressure more than leg work alone.
  modification: Keep the hands at shoulder height rather than overhead, and keep intervals short.
