slug: jumping-jacks
display_name: Jumping Jacks (Star Jumps)
client_name: Star jumps
aliases:
- star jumps
- jumping jack
- side straddle hops
modality: cardiovascular
intensity_tier: intermediate
position: standing
equipment: []
summary: The classic arms-and-legs-out jump — a whole-body pulse-raiser that needs no space and no
  kit, and the standard warm-up opener for conditioning circuits.
why_it_works: Rhythmic jumping recruits the calves, thighs and shoulders together at low force per
  jump, which raises heart rate quickly without exhausting any single muscle — the book classes it
  low-intensity precisely so it can be held for longer intervals. The repeated small ground contacts
  are also a bone stimulus at the hip, which two-legged low-impact work cannot provide.
setup:
- Stand tall, feet hip-width apart, knees soft, hands by the sides.
- Clear the space around you and check the ceiling.
- Wear supportive shoes; do this on a firm, non-slip surface.
steps:
- Jump and spread the feet to about one-and-a-half shoulder widths while raising the hands above
  the head.
- Quickly reverse the movement, landing softly with the knees soft each time.
- Keep the rhythm continuous and the breathing steady.
levels:
- level: '1'
  prescription: '3 rounds of 20 seconds at an easy rhythm, resting 40 seconds between'
  sets: 3
  support: none
- level: '2'
  prescription: '4 rounds of 30 seconds brisk, resting 30 seconds between'
  sets: 4
  support: none
- level: '3'
  prescription: '50 continuous repetitions at a high tempo as a circuit opener'
  reps: 50
  sets: 1
  support: none
frequency: As a warm-up before conditioning work, or 2-3x/week inside a circuit.
builds:
- heart and lung fitness
- calf and shoulder endurance
- bone stimulus at the hip through repeated light impact
