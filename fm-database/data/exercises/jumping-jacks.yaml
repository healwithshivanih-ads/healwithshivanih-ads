notes_for_coach: 'The gateway conditioning move for weight-loss clients: it is the book''s standard
  warm-up and the lowest rung of its interval work, which is why it sits at intermediate rather
  than advanced. For a deconditioned client the step-out version IS the exercise for the first
  fortnight. The impact that makes it a knee caution is the same impact that makes it one of the
  few bone-loading moves in this catalogue — read the client, not just the flag.'
