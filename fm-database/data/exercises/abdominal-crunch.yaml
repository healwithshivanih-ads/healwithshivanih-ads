notes_for_coach: 'THIS ENTRY EXISTS TO BE SCREENED OUT, AND THAT IS THE POINT. It carries
  `spinal_flexion: true`, which is the vertebral-osteoporosis red line the safety axes were built
  for, plus an outright block keyed to osteoporosis and its aliases. On a roster of women largely in
  their forties and fifties, low bone density is common and under-recorded, so expect this to be
  withheld often.

  `loads_spine` is false and `spinal_flexion` is true — those are different things and the
  distinction matters. Nothing is being carried, so there is no axial compression; the hazard is the
  bending direction, not the weight. Do not "fix" this by setting both true.

  WHEN A CLIENT ASKS FOR SIT-UPS, the useful answer is a swap, not a refusal. `forearm-plank` and
  `floor-bridge` are the direct substitutes — both train the midsection hard with the spine held
  straight, and both screen CLEAR for the same bone-loss client this entry is blocked for.
  `prone-back-extension` covers the opposite direction. Offer those three by name rather than
  saying no.'
