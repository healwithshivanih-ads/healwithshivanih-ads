cautions:
- condition: osteoporosis
  condition_aliases:
  - osteopenia
  - low bone density
  - low bone mass
  - vertebral fracture
  - compression fracture
  - spinal fracture
  - fragility fracture
  severity: caution
  reason: The side bend and the trunk turn take the spine towards its end range in bending and
    rotation. Unloaded and small they are low risk, but end-range flexion is still the direction to
    respect in fragile bone.
  modification: Keep the side bend and the turn small and slow — a quarter of the available range,
    not the end of it — or leave both out and keep the wrist, shoulder, ankle and hip circles, which
    is most of the warm-up anyway.
- condition: history of falls
  condition_aliases:
  - falls
  - unsteady
  - dizziness
  - vertigo
  - syncope
  - peripheral neuropathy
  severity: caution
  reason: The ankle circles and heel flicks are done standing on one leg, and hip circles move the
    weight in a loop around the base of support.
  modification: Keep a hand on a solid counter for the single-leg parts, or sit for the ankle
    circles. Never use a chair that can slide.
- condition: cervical radiculopathy
  condition_aliases:
  - neck pain
  - cervical spondylosis
  - neck injury
  - whiplash
  severity: caution
  reason: Shoulder and neck movements can compress an irritated cervical nerve root.
  modification: Keep shoulder circles small and below shoulder height, and skip any movement that
    sends symptoms into the arm. Neck circles are deliberately not part of this sequence.
