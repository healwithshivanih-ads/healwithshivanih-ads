slug: joint-mobilising-sequence
display_name: Joint Mobilising and Pulse-Raise Sequence
client_name: Warming up
aliases:
- warm up
- warm-up
- mobility sequence
- joint circles
- mobilising
modality: flexibility
intensity_tier: beginner
position: standing
equipment: []
summary: The three-to-five minute warm-up — every joint taken gently through a circle, with the
  heart rate raised alongside it.
why_it_works: Two things happen before exercise and they are separate. Mobilising moves each joint
  through its range so the synovial fluid that lubricates it is distributed. Raising the pulse
  redirects blood towards the muscles — at rest they take a small share of the circulation and
  under load they need most of it — and warm muscle is more pliable than cold. Doing both together
  takes three to five minutes rather than ten.
setup:
- Find a space where the arms can circle freely.
- Start walking slowly on the spot or around the room, standing tall.
steps:
- While walking, circle each wrist six to eight times.
- Shrug both shoulders up towards the ears and back down, six to eight times, then circle each
  shoulder the same number.
- Stop walking. Stand on one leg with a hand on support if needed and circle the raised ankle six to
  eight times, then swap sides.
- Hands on hips, circle the hips slowly six to eight times each way.
- Stand with the feet hip-width apart and the knees soft, then turn the upper body gently to each
  side four times, keeping the hips facing forward.
- Bend gently to each side four times, sliding a hand down the outside of the thigh.
- Flick each heel up behind towards the buttock, alternating, ten times in all.
- Finish with a minute of something rhythmic — marching on the spot with the knees lifting, or a
  brisk walk — to raise the pulse.
frequency: Before every session. Longer in cold weather, and longer again if starting from sitting
  all day.
builds:
- joint range before load
- raised muscle temperature and blood flow
- a settled start to a session
