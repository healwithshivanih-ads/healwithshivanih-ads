notes_for_coach: 'SINGLE-LEVEL AND UNPROGRESSIVE ON PURPOSE. It carries no repetition ladder, so it
  is not withheld from a client with post-exertional malaise — gentle range-of-movement inside the
  energy envelope is not graded exercise therapy, and a PEM client left with literally nothing is a
  worse outcome than one left with a warm-up. Do not add levels to this entry; that would flip it
  into the progressive set.

  It is the only warm-up in the catalogue and almost every plan should open with it. Note the
  practical detail the book is good on: if the session is press-ups, add a few easy press-ups at the
  end of the warm-up. The warm-up should rehearse the thing about to be done.

  `spinal_flexion` is flagged true for the side bend even though nothing is being carried. That is
  the truthful reading of the movement, and the caution rather than a block is the right severity
  for unloaded small-range work — but the flag has to be honest or the screen cannot reason about
  it.'
