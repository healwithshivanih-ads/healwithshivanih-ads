notes_for_coach: 'THE CATALOGUE''S ONLY PULLING MOVEMENT, and it was added because its absence was a structural
  flaw rather than because a client asked. Before this entry every strength item was a push (the press-up
  and dip ladders) or a leg, which is the imbalance desk work already produces — so the catalogue was
  reinforcing it.


  NOT FROM THE MARTINOLI BOOK. That book is bodyweight-only and the pages read contain no pulling movement
  at all, because pulling needs something to pull against. This entry is therefore authored from general
  practice and carries no citation; `evidence_tier: fm_specific_thin` is accurate, not modest. If a suitable
  source is ingested later, cite it here rather than inventing one.


  EQUIPMENT IS THE REAL BARRIER, not difficulty. A door frame works for the shallow versions; the deep
  lean genuinely needs a low bar or a solid table edge, and a flimsy table is a hazard. Check what the
  client actually has before prescribing level 3.'
