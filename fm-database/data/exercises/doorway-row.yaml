cautions:
- condition: post-exertional malaise
  condition_aliases:
  - long covid
  - long-covid
  - me/cfs
  - chronic fatigue
  - post-viral fatigue
  - pem
  - myalgic encephalomyelitis
  severity: block
  reason: NICE NG206 withdrew graded exercise therapy for ME/CFS, and every level ladder here is a progression
    schedule.
  modification: ''
- condition: shoulder pain
  condition_aliases:
  - rotator cuff
  - frozen shoulder
  - shoulder impingement
  - adhesive capsulitis
  - shoulder injury
  severity: caution
  reason: The whole load passes through the shoulder at full stretch when the arms are straight.
  modification: Stay nearly upright so the load is light, keep the elbows close to the body rather than
    flared wide, and stop short of the range that pinches.
- condition: elbow pain
  condition_aliases:
  - tennis elbow
  - golfers elbow
  - epicondylitis
  - elbow injury
  severity: caution
  reason: Gripping and pulling loads the forearm tendons at their attachment.
  modification: Use a thicker grip such as a rolled towel, keep the wrists straight, and reduce the lean.
- condition: wrist pain
  condition_aliases:
  - carpal tunnel
  - wrist injury
  - hand pain
  - de quervain
  severity: caution
  reason: Bodyweight hangs through the grip for the whole set.
  modification: Loop a towel and hold that instead of gripping a frame, which lets the hand stay in a
    neutral fist.
