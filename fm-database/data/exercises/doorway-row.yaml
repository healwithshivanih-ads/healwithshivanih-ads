slug: doorway-row
display_name: Doorway Row (Bodyweight Horizontal Pull)
client_name: Doorway pull
aliases:
- doorway row
- towel row
- bodyweight row
- inverted row
- door row
modality: strength
intensity_tier: beginner
position: standing
equipment:
- a sturdy door frame, or a towel looped around a fixed post
summary: Pulling the body towards a fixed handhold — the catalogue's only horizontal pulling movement.
why_it_works: 'Every other strength entry in this catalogue pushes or works the legs. Pushing alone shortens
  the front of the chest and leaves the muscles between the shoulder blades untrained, which is exactly
  the pattern desk work already creates. A row trains the opposite: the mid-back, the rear shoulder and
  the arm flexors. Leaning further back lengthens the lever and makes it harder, which is how bodyweight
  work adds resistance without adding weight.'
setup:
- Stand facing a door frame and take hold of both sides at about chest height, or loop a towel around
  a fixed post and hold an end in each hand.
- Walk the feet forward and lean back with the arms straight, until the body is a straight line tilted
  away from the hands.
- The further forward the feet, the harder it becomes. Start nearly upright.
steps:
- Pull the chest towards the hands, leading with the elbows and drawing the shoulder blades together.
- Keep the body one straight line — do not let the hips sag or lead with the head.
- Pause a moment when the chest is closest.
- Lower back to straight arms with control. That lowering is half the exercise.
levels:
- level: '1'
  prescription: 8 repetitions, nearly upright, twice
  reps: 8
  sets: 2
  support: feet well back so the lean is shallow
- level: '2'
  prescription: 10 repetitions with the feet further forward, twice
  reps: 10
  sets: 2
  support: none
- level: '3'
  prescription: 12 repetitions at a deep lean, three times
  reps: 12
  sets: 3
  support: none
  note: Once the body is near horizontal this needs a low bar or a sturdy table edge rather than a door
    frame.
frequency: 2-3x/week, with a rest day between.
builds:
- mid-back and rear shoulder strength
- pulling strength for daily lifting and carrying
- the postural muscles that oppose desk work
