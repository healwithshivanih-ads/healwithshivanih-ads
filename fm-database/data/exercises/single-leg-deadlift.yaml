slug: single-leg-deadlift
display_name: Single-Leg Deadlift (Unloaded Hip Hinge on One Leg)
client_name: One-legged hip hinge
client_summary: "Balancing on one leg and hinging forward, the other leg sweeping back behind you."
aliases:
- single leg deadlift
- one leg deadlift
- airplane hinge
- single-leg hinge
modality: strength
intensity_tier: intermediate
position: standing
equipment: []
summary: A hip hinge balanced on one leg, the other sweeping straight back — hamstring and
  glute strength and single-leg balance trained in the same movement.
why_it_works: The hinge is the pattern that protects the back when lifting anything off the
  floor, and doing it on one leg exposes the side-to-side difference that a two-legged hinge
  lets the stronger side hide. Because the base is one foot and the weight travels forward,
  it trains balance under a moving load rather than balance while standing still — which is
  what real stumbles involve.
setup:
- Stand tall with the feet under the hips, hands on the hips or one hand near a counter.
- Pick a spot on the floor two metres ahead to keep the eyes on.
steps:
- Shift the weight onto the right leg, letting that knee bend softly.
- Hinge at the hips, tipping the trunk forward while pressing the left leg straight back
  behind you.
- Stop when the trunk and the back leg make one line, roughly parallel with the floor, keeping
  the back flat rather than rounded.
- Squeeze the right buttock to return to standing. Complete the set, then change legs.
levels:
- level: '1'
  prescription: '6 hinges each leg, both hands on a counter, back foot lightly touching down'
  reps: 6
  sets: 1
  support: two hands on a solid counter
- level: '2'
  prescription: '8 hinges each leg, one hand resting on a counter'
  reps: 8
  sets: 1
  support: one hand on a solid counter
- level: '3'
  prescription: '8-10 hinges each leg, no support, pausing one breath at the bottom'
  reps: 10
  sets: 2
  support: none
frequency: 2-3x/week with a rest day between.
builds:
- hamstring and buttock strength
- the hip-hinge pattern that protects the lower back
- single-leg balance under a moving weight
- evenness between the two legs
easier_variant: standing-hip-hinge
harder_variant: null
