notes_for_coach: 'Fills the catalogue''s real hinge gap. Before this, the only hinge patterns
  were the two-legged standing-hip-hinge and the floor bridge — nothing trained the hinge and
  balance together, which is the combination that actually happens when someone picks a bag
  off the floor while stepping.

  It is also the gentlest way to find a side-to-side difference: if one side wobbles and the
  other does not, that asymmetry was there before you asked, and it is worth knowing about.

  Sims uses it as a loaded barbell variation; here it is unloaded on purpose. The balance
  demand of the unloaded version is already the hard part for this roster, and adding weight
  is a referral, not a level.'
