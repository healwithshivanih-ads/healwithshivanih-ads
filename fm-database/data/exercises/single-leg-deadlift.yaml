cautions:
- condition: post-exertional malaise
  condition_aliases:
  - long covid
  - long-covid
  - me/cfs
  - chronic fatigue
  - post-viral fatigue
  - pem
  - myalgic encephalomyelitis
  severity: block
  reason: A fixed repetition ladder is the progression shape NICE NG206 withdrew for ME/CFS.
  modification: ''
- condition: history of falls
  condition_aliases:
  - falls
  - unsteady
  - dizziness
  - vertigo
  - peripheral neuropathy
  severity: caution
  reason: Single-leg stance with the trunk travelling forward moves the centre of mass well
    outside the base of support.
  modification: Keep both hands on a counter and let the back foot brush the floor throughout
    (level 1). Unsupported only once one-leg-stand is confident.
- condition: low back pain
  condition_aliases:
  - back pain
  - lumbar pain
  - disc
  - sciatica
  - lower back pain
  severity: caution
  reason: A hinge is the correct pattern for a sore back, but a hinge that rounds into flexion
    is the provocative one, and fatigue on one leg makes rounding likelier.
  modification: Reduce the depth so the back stays flat — halfway is a full repetition if flat
    is what halfway allows. Stop the set when form goes, not when the count ends.
- condition: uncontrolled hypertension
  condition_aliases:
  - high blood pressure
  - hypertension
  severity: caution
  reason: Repeatedly lowering and raising the head relative to the heart can provoke
    light-headedness.
  modification: Move slowly, breathe out on the way up, and keep the trunk above parallel.
