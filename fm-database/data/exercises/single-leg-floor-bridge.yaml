cautions:
- condition: post-exertional malaise
  condition_aliases:
  - long covid
  - long-covid
  - me/cfs
  - chronic fatigue
  - post-viral fatigue
  - pem
  - myalgic encephalomyelitis
  severity: block
  reason: NICE NG206 withdrew graded exercise therapy for ME/CFS, and every level ladder here is a progression
    schedule.
  modification: ''
- condition: low back pain
  condition_aliases:
  - back pain
  - lumbar pain
  - disc herniation
  - slipped disc
  - sciatica
  severity: caution
  reason: If the hip cannot produce the lift the lower back arches to finish the movement, which turns
    a hip exercise into a back extension on one side.
  modification: Return to the two-legged `floor-bridge` until it is easy, keep the range small, and stop
    the moment the back takes over.
- condition: hamstring injury
  condition_aliases:
  - hamstring strain
  - hamstring tear
  - pulled hamstring
  - hamstring cramp
  severity: caution
  reason: A single-leg bridge loads the hamstring hard and commonly cramps it.
  modification: Move the foot slightly closer to the buttock so the buttock does more and the hamstring
    less, and reduce the repetitions.
- condition: hip pain
  condition_aliases:
  - hip osteoarthritis
  - hip replacement
  - hip bursitis
  - trochanteric
  - hip injury
  severity: caution
  reason: The whole load passes through one hip.
  modification: Use the two-legged version, or keep the lifted foot touching down lightly to share the
    load.
