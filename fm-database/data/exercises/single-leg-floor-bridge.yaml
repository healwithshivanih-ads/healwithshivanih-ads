slug: single-leg-floor-bridge
display_name: Single-Leg Floor Bridge
client_name: One-legged bridge
aliases:
- single leg bridge
- one leg bridge
- single-leg glute bridge
- unilateral bridge
modality: strength
intensity_tier: intermediate
position: lying_supine
equipment:
- a mat or folded blanket
summary: A floor bridge lifted and held on one leg, doubling the load on that side without adding any
  weight.
why_it_works: 'Taking one foot off the floor roughly doubles what the other hip must produce, and it adds
  a demand the two-legged bridge does not have: the pelvis now wants to drop on the unsupported side,
  and the hip muscles have to stop it. That is the same job those muscles do in single-leg stance and
  in every step taken, so it transfers directly to walking. The spine stays neutral throughout, so it
  inherits the two-legged version''s safety.'
setup:
- Lie on the back with the knees bent and both feet flat, arms resting alongside.
- Lift the hips into a bridge on both feet first, so the position is set.
- Straighten one leg, or lift that knee towards the chest.
steps:
- Keeping one foot on the floor, lower the hips towards the mat under control.
- Press through that heel to lift the hips back to a straight line from shoulder to knee.
- Keep the pelvis LEVEL — the lifted side must not drop. That is the part that matters.
- Complete the repetitions, lower, and change sides.
levels:
- level: '1'
  prescription: 6 repetitions each side with the lifted foot resting lightly on the standing shin
  reps: 6
  sets: 2
  support: lifted foot touching down lightly for reference
- level: '2'
  prescription: 10 repetitions each side, knee lifted
  reps: 10
  sets: 2
  support: none
- level: '3'
  prescription: 10 each side with a 5-second hold at the top
  reps: 10
  sets: 2
  hold_seconds: 5
  support: none
frequency: 3x/week.
builds:
- single-hip and buttock strength
- pelvic control during walking
- hamstring strength
easier_variant: floor-bridge
harder_variant: null
