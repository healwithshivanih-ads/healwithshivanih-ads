notes_for_coach: 'THE RUNG ABOVE `floor-bridge`, wired as its harder variant. Still spine-neutral, so
  it stays available to the bone-loss group that `abdominal-crunch` is blocked for — the whole spine-neutral
  core set now runs bridge -> single-leg bridge -> bird dog -> plank -> side plank.


  WATCH THE PELVIS, NOT THE HEIGHT. Clients chase how high the hips go; the training effect is in keeping
  the pelvis level. A lower bridge held square beats a high one that tips.'
