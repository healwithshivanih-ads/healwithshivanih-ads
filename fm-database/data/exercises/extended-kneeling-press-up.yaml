cautions:
- condition: post-exertional malaise
  condition_aliases:
  - long covid
  - long-covid
  - me/cfs
  - chronic fatigue
  - post-viral fatigue
  - pem
  - myalgic encephalomyelitis
  severity: block
  reason: NICE NG206 withdrew graded exercise therapy for ME/CFS, and every level ladder here is a progression
    schedule.
  modification: ''
- condition: shoulder pain
  condition_aliases:
  - rotator cuff
  - frozen shoulder
  - shoulder impingement
  - adhesive capsulitis
  - shoulder injury
  severity: caution
  reason: More of the body's weight passes through the shoulder than in the kneeling version.
  modification: Walk the hands back towards the kneeling position, keep the elbows close to the ribs,
    and stop short of any painful depth.
- condition: wrist pain
  condition_aliases:
  - carpal tunnel
  - wrist injury
  - hand pain
  - arthritis hands
  severity: caution
  reason: Load passes through an extended wrist and increases as the hands move forward.
  modification: Press on fists to keep the wrist straight, or use `wall-press-up` instead, where the wrist
    angle is far gentler.
- condition: knee pain
  condition_aliases:
  - knee osteoarthritis
  - knee injury
  - knee replacement
  - patellofemoral
  - meniscus
  - knee arthritis
  severity: caution
  reason: The knees bear weight against the floor throughout.
  modification: Double the mat or fold a towel under the knees.
