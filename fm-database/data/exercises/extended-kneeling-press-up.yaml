slug: extended-kneeling-press-up
display_name: Extended Kneeling Press-Up
client_name: Kneeling press-up, hands further forward
client_summary: "A kneeling press-up with your hands further forward, which makes it harder without adding any weight."
aliases:
- extended kneeling press up
- three-quarter press-up
- long kneeling press-up
- box press-up extended
modality: strength
intensity_tier: beginner
position: four_point
equipment:
- a mat or folded blanket
summary: A kneeling press-up with the hands walked further forward, which lengthens the lever and adds
  load without adding weight.
why_it_works: With bodyweight you cannot change the resistance, so you change the leverage — the book's
  own principle and the whole logic of the press-up ladder. Walking the hands forward from the kneeling
  position moves the body's centre of mass further from the knees, so a greater share of it passes through
  the arms. It is the missing rung between kneeling and a full press-up, which is otherwise a jump most
  people cannot make.
setup:
- Kneel on a mat and place the hands on the floor slightly wider than the shoulders.
- Walk the hands forward until the body makes a straight line from the head to the knees, with the hips
  extended rather than piked.
- The further forward the hands, the harder it gets. Start just beyond the kneeling position.
steps:
- Lower the chest towards the floor by bending the elbows, keeping them at about 45 degrees to the ribs
  rather than flared wide.
- Keep the body one straight line — the hips must not sag or pike up.
- Go as low as control allows, then press back up.
- Cross the ankles behind if it helps hold the line.
levels:
- level: '1'
  prescription: 6 repetitions, hands just forward of kneeling, twice
  reps: 6
  sets: 2
  support: hands close in
- level: '2'
  prescription: 10 repetitions with the hands further forward, twice
  reps: 10
  sets: 2
  support: none
- level: '3'
  prescription: 12 repetitions at near-full extension, three times
  reps: 12
  sets: 3
  support: none
frequency: 2-3x/week with a rest day between.
builds:
- chest, shoulder and triceps strength
- the strength to reach a full press-up
- trunk stiffness held under load
easier_variant: kneeling-press-up
harder_variant: standard-press-up
