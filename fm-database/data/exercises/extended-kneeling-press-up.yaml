notes_for_coach: 'THE MISSING RUNG. The ladder ran wall -> kneeling -> standard, and the gap between kneeling
  and standard is the one most people stall at for months. This entry fills it and is wired in as `kneeling-press-up`''s
  harder variant and `standard-press-up`''s easier one.


  The adjustment is continuous, not stepped: how far forward the hands go IS the dial. That makes it unusually
  easy to individualise — move them an inch at a time.'
