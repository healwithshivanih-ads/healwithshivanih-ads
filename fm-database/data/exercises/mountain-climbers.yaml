cautions:
- condition: post-exertional malaise
  condition_aliases:
  - long covid
  - long-covid
  - me/cfs
  - chronic fatigue
  - post-viral fatigue
  - pem
  - myalgic encephalomyelitis
  severity: block
  reason: Interval conditioning against the clock is the NICE NG206 pattern to avoid in ME/CFS.
  modification: ''
- condition: wrist pain
  condition_aliases:
  - carpal tunnel
  - wrist injury
  - de quervain
  - arthritis of the hands
  severity: caution
  reason: The whole movement happens on loaded, extended wrists.
  modification: Fists on a folded towel, or raise the hands onto a low step to reduce wrist
    extension; stop for numbness or tingling.
- condition: uncontrolled hypertension
  condition_aliases:
  - high blood pressure
  - hypertension
  severity: caution
  reason: Head-below-heart positioning plus hard intervals is a double blood-pressure load.
  modification: Use the slow step-through version with the hands elevated on a step; keep intervals
    short.
- condition: shoulder pain
  condition_aliases:
  - rotator cuff
  - impingement
  - frozen shoulder
  severity: caution
  reason: The shoulders carry half of body weight throughout, with impact on each exchange.
  modification: Elevate the hands on a step or counter — the same movement at a fraction of the
    shoulder load.
