modality: cardiovascular
intensity_tier: intermediate
position: four_point
equipment: []
summary: From a press-up position, the legs exchange places in a running action — conditioning that
  loads the shoulders and trunk as much as the legs.
why_it_works: Holding the plank line while the legs drive turns a cardio move into whole-body work —
  the shoulders and trunk stabilise isometrically while the hips produce the movement. That double
  duty is why the book rates it medium intensity and uses it as a Tabata staple — effort climbs
  fast without any equipment.
setup:
- Take a press-up position, hands under the shoulders, body straight from head to heel.
- Spread the fingers and grip the floor; soften the elbows a touch.
steps:
- Drive one knee up towards the chest, keeping the hips level with the shoulders.
- Jump or step to exchange the legs, keeping the back straight and the backside down.
- Continue exchanging at a steady rhythm, breathing throughout.
levels:
- level: '1'
  prescription: 'Slow step-through version — step each knee in and back, 3 rounds of 20 seconds'
  sets: 3
  support: none
- level: '2'
  prescription: '4 rounds of 20 seconds at a running rhythm, resting 40 seconds'
  sets: 4
  support: none
- level: '3'
  prescription: '8 rounds of 20 seconds hard with 10 seconds rest (the book''s Tabata form)'
  sets: 8
  support: none
frequency: 2-3x/week inside conditioning circuits; not on consecutive days.
builds:
- heart and lung fitness
- shoulder and trunk endurance under a moving load
- hip drive
