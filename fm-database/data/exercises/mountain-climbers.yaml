notes_for_coach: 'The bridge between the press-up family and the conditioning family: a client who
  has earned the kneeling press-up has the shoulders for the step-through version. Requires getting
  to the floor — check floor-get-up first for anyone over 65. For weight-loss clients this plus
  jumping-jacks plus a squat makes a complete no-kit circuit.'
