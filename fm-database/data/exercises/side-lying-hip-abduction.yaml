cautions:
- condition: post-exertional malaise
  condition_aliases:
  - long covid
  - long-covid
  - me/cfs
  - chronic fatigue
  - post-viral fatigue
  - pem
  - myalgic encephalomyelitis
  severity: block
  reason: NICE NG206 withdrew graded exercise therapy for ME/CFS, and every level ladder here is a progression
    schedule.
  modification: ''
- condition: hip pain
  condition_aliases:
  - hip osteoarthritis
  - hip replacement
  - hip bursitis
  - trochanteric
  - hip injury
  severity: caution
  reason: Lying on the affected side presses directly on the greater trochanter, which is exactly where
    bursitis hurts. The lifting side is usually fine; the down side is the problem.
  modification: Pad generously under the hip, or work only the upper side and change position rather than
    lying on the painful one. After hip replacement, check the surgical team's limits on abduction first.
- condition: low back pain
  condition_aliases:
  - back pain
  - lumbar pain
  - disc herniation
  - slipped disc
  - sciatica
  severity: caution
  reason: Rolling the pelvis backwards to lift the leg higher swaps hip work for lower-back work.
  modification: Keep the lift low and the hips stacked. If the body rolls back, the leg is going too high.
