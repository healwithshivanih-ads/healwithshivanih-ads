notes_for_coach: 'THE RUNG BELOW `standing-hip-abduction`, not above it — this is one of the few additions
  that makes the catalogue EASIER rather than harder. It is wired as that entry''s easier variant.


  Worth reaching for whenever the standing version fails for balance reasons rather than strength ones,
  which is common: `balance_demand: 0` here against 1 standing, so the screen treats them differently
  for a fall-risk client.


  REQUIRES A FLOOR TRANSFER, though a bed works and is often the better instruction for an older client.'
