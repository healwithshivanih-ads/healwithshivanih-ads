cautions:
- condition: post-exertional malaise
  condition_aliases:
  - long covid
  - long-covid
  - me/cfs
  - chronic fatigue
  - post-viral fatigue
  - pem
  - myalgic encephalomyelitis
  severity: block
  reason: 'NICE NG206 withdrew graded exercise therapy for ME/CFS: fixed incremental progression can
    provoke a lasting relapse, and this is the hardest rung of exactly such a ladder.'
  modification: ''
- condition: shoulder pain
  condition_aliases:
  - rotator cuff
  - frozen shoulder
  - shoulder impingement
  - adhesive capsulitis
  - shoulder injury
  severity: caution
  reason: This is the largest shoulder load in the catalogue, taken through a flexed and internally
    loaded joint with the body's full weight behind it.
  modification: Drop back to the kneeling version rather than reducing the range here. A painful
    full press-up is not a full press-up worth keeping.
- condition: carpal tunnel syndrome
  condition_aliases:
  - wrist pain
  - carpal tunnel
  - wrist arthritis
  - de quervain
  severity: caution
  reason: Full body weight through a maximally extended wrist is the heaviest wrist position this
    catalogue prescribes.
  modification: Press through loose fists with the wrists straight. If that is not comfortable, use
    the kneeling version, which loads the wrist far less.
- condition: uncontrolled hypertension
  condition_aliases:
  - high blood pressure
  - raised blood pressure
  - hypertension
  severity: caution
  reason: Near-maximal repetitions are commonly done with a held breath, which produces a sharp
    transient rise in blood pressure.
  modification: Breathe out on every push and stop the set two repetitions before failure. Do not
    prescribe this until blood pressure is known to be managed.
