notes_for_coach: 'THE LADDER STOPS HERE ON PURPOSE. The book carries on well past this — splayed
  leg, raised leg, T press-up, one-handed, decline, handstand, and the clapping plyometric versions
  — and none of those were ingested. They are aimed at a conditioned population, several carry the
  book''s own beginner warning, and no client on this roster is a candidate. If someone genuinely
  outgrows two sets of ten full press-ups, that is a good problem and the right answer is a
  supervised programme, not a catalogue entry.

  `harder_variant` is deliberately null rather than pointing at something unshipped, so a matcher
  offering "what''s next" returns nothing rather than a movement no one has screened.'
