slug: standard-press-up
display_name: Standard Press Up (Full Prone Push)
client_name: A full press-up
aliases:
- press up
- push up
- full press up
- standard push up
modality: strength
intensity_tier: intermediate
position: lying_prone
equipment: []
summary: The full-lever pressing movement from the toes — the top of the pressing ladder this
  catalogue prescribes.
why_it_works: From the toes the arms carry the largest share of body weight the pattern allows,
  which is what makes it a genuine strength stimulus rather than endurance work. The trunk has to
  hold a straight line under that load, so it trains the midsection at the same time without any
  spinal bending.
setup:
- Lie face down and place the hands on the floor a little wider than the shoulders, fingers pointing
  forward.
- Push up onto the palms and the balls of the feet, feet together or hip-width apart.
- Set the body in one straight line from the head to the heels.
steps:
- Bend the elbows and lower the chest until it is close to the floor.
- Hold the straight line — the hips should not sag towards the floor or ride up.
- Straighten the arms and push back to the start.
- Keep the pace controlled in both directions.
levels:
- level: '1'
  prescription: 5 repetitions, stopping short of the floor
  reps: 5
  sets: 1
  support: toes, partial range
  note: If five is not yet possible with a straight body, go back to kneeling rather than letting
    the hips sag — a sagging press-up loads the lower back instead of the chest.
- level: '2'
  prescription: 8 repetitions, chest close to the floor
  reps: 8
  sets: 1
  support: toes, full range
- level: '3'
  prescription: 10 repetitions, rest, then a second set
  reps: 10
  sets: 2
  support: toes, full range
frequency: 2-3x/week with a rest day between.
builds:
- chest, shoulder and arm strength
- trunk stiffness under load
- upper-body pushing power
easier_variant: extended-kneeling-press-up
harder_variant: null
