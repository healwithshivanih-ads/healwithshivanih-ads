cautions:
- condition: post-exertional malaise
  condition_aliases:
  - long covid
  - long-covid
  - me/cfs
  - chronic fatigue
  - post-viral fatigue
  - pem
  - myalgic encephalomyelitis
  severity: block
  reason: NICE NG206 withdrew graded exercise therapy for ME/CFS, and every level ladder here is a progression
    schedule.
  modification: ''
- condition: shoulder pain
  condition_aliases:
  - rotator cuff
  - frozen shoulder
  - shoulder impingement
  - adhesive capsulitis
  - shoulder injury
  severity: caution
  reason: Raising the arm overhead is the classic impingement position, and the wall removes the compensations
    someone would normally use to avoid it.
  modification: Work only in the pain-free lower range and do not chase height. If a painful arc appears
    partway up, stop below it — going through it repeatedly is what irritates the tendon.
- condition: neck pain
  condition_aliases:
  - cervical spondylosis
  - neck injury
  - cervical radiculopathy
  - whiplash
  severity: caution
  reason: Holding the back of the head against the wall can crane the neck if the upper back is stiff.
  modification: Let the head come off the wall rather than forcing it back, and keep the chin gently tucked.
- condition: hypertension
  condition_aliases:
  - high blood pressure
  - raised blood pressure
  - htn
  - hypertensive
  severity: caution
  reason: Sustained work with the arms above the head raises blood pressure more than the same effort
    at waist height.
  modification: Keep the movement flowing rather than holding at the top, and breathe out on the way up.
