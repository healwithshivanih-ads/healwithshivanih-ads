slug: wall-angels
display_name: Wall Angels (Scapular Retraction and Overhead Slide)
client_name: Wall slides
client_summary: "Sliding your arms up and down a wall, keeping your back, head and arms touching it."
aliases:
- wall angels
- wall slides
- scapular wall slide
- shoulder wall slide
- snow angels against a wall
modality: flexibility
intensity_tier: beginner
position: standing
equipment:
- a clear stretch of wall
summary: Sliding the arms up and down a wall while keeping the back, head and arms in contact with it.
why_it_works: 'Desk work parks the shoulders forward and the upper back rounded, and the muscles between
  the shoulder blades stop working because they are never asked to. The wall is the teacher here: it will
  not let the back arch or the shoulders roll forward, so the only way to move the arms is to use the
  muscles that draw the shoulder blades down and together. Most people discover they cannot keep the wrists
  on the wall at all, which is the finding, not a failure.'
setup:
- Stand with the back against a wall, feet a few inches out from it.
- Flatten the lower back towards the wall by tucking the tailbone slightly.
- Put the back of the head, the upper back, the elbows and the backs of the wrists against the wall, arms
  bent like a goalpost.
steps:
- Slide the arms slowly up the wall, keeping every contact point touching.
- Go only as high as the wrists stay in contact and the lower back stays flat.
- Slide back down, drawing the elbows towards the ribs and squeezing the shoulder blades together at the
  bottom.
- Move slowly. Where the contact is lost is the restriction, and that is the point worth working at.
levels:
- level: '1'
  prescription: 6 slides through a small range, twice
  reps: 6
  sets: 2
  support: range limited to wherever contact is kept
- level: '2'
  prescription: 10 slides through a fuller range, twice
  reps: 10
  sets: 2
  support: none
- level: '3'
  prescription: 10 slow slides with a 3-second hold at the top, twice
  reps: 10
  sets: 2
  hold_seconds: 3
  support: none
frequency: Daily if desk-based — it takes under a minute.
builds:
- mid-back and shoulder-blade control
- shoulder range overhead
- an upright posture that survives a working day
