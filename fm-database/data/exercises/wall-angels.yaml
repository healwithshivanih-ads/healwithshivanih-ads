notes_for_coach: 'THE CATALOGUE''S ONLY SHOULDER AND SCAPULAR ENTRY. Before this there was nothing above
  the trunk except the press-up ladder, which pushes — so the desk-worker presentation that walks in most
  often had no matching exercise at all.


  Filed as `flexibility` rather than `strength` because the intent is range and control, not load, and
  because that is the modality tier a deconditioned client is most likely to be cleared for.


  `overhead: true` is set, which is what makes the screen surface the blood-pressure and shoulder cautions.
  Pairs naturally with `doorway-row`: this one teaches the position, the row loads it.'
