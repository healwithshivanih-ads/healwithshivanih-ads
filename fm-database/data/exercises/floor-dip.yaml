linked_to_symptoms:
- muscle-weakness
notes_for_coach: 'The book also gives an elevated version with the hands on a chair, which is
  HARDER, not easier — the extra height increases the range and the shoulder extension. It was
  deliberately not shipped as a separate entry: on this roster the shoulder position is already the
  limiting factor, and a chair adds range in exactly the direction that provokes it.

  Pair this with a press-up entry rather than prescribing it alone. On its own it trains one side of
  the shoulder repeatedly in the position that tends to be the sore one.'
