# ─── What this ingest is FOR (decided 2026-08-03, before any text was read) ───
# Recorded now so the extraction pass has a target and doesn't just hoover up
# 300 pages of a cookbook into a clinical catalogue.
targets:
  cooking_adjustments:
    # The gap this book actually fills. Existing grain/legume adjustments are
    # Ayurvedic-framed (see source notes); these would be the Western-technique
    # counterparts. Candidate shapes only — each must be earned from the text.
    intent: >-
      Grain, legume and seed handling technique: when salt goes into the pot,
      soak-vs-no-soak and what each costs, doneness cues, cooking liquid reuse,
      batch-cook and storage. One entry per reusable decision, not per dish.
    reuse_first: >-
      Check the 25 existing cooking_adjustments before creating any entry —
      soak-and-sprout-legumes, quick-soak-legumes-boil-and-rest,
      rinse-and-soak-grains-before-cooking, pressure-cook-grains-legumes,
      add-kombu-to-bean-cooking-water and dry-roast-whole-spices already cover
      real ground. Prefer enriching an existing entry over adding a near-duplicate;
      the catalogue has been through four de-duplication sweeps and should not
      re-acquire the problem.

  recipes:
    intent: >-
      Dishes that widen the library where it is genuinely thin, not a bulk port
      of the book.
    selection_rule: >-
      Take a dish only if it (a) survives Indian-kitchen sourcing — no ingredient
      the coach's clients cannot buy, and (b) fills a real gap. The v0.76 coverage
      analysis found the library thinnest on vitamin-D and B12 vegetarian dishes
      and on monsoon-season recipes; whole-grain and legume mains that carry
      protein and fibre are the overlap with this book. Skip anything that is a
      near-duplicate of an existing recipe.
    schema: data/_recipes/_README.md          # steps in OUR words; ingredients faithful
    must_carry:
      - attribution: {author, book, source_id: berens-grist-2021, page}
      - sources: [{id: berens-grist-2021, location: '<section>, pg N'}]
      - no committed image binary; rights_status book_reference_uncleared if referenced
    after_write:
      - python fm-database-web/scripts/validate-recipes.py
      - python fm-database-web/scripts/compute-recipe-nutrients.py   # nutrients + rich_in
    watch: >-
      approve-recipe-candidate.py's gates (dedup ≥75% name-token overlap,
      no-porridge rule, diet consistency, allergen derivation) exist for a reason.
      Recipes written straight to disk bypass them — so apply the same checks by
      hand, especially allergen derivation from the ingredient list.

  claims:
    intent: >-
      Sparingly. See the ⚠ EVIDENCE-TIER CAUTION on the source entry — a chef's
      cookbook is not clinical evidence. Culinary-technique claims only, or
      nothing.

# ─── Provenance discipline ───
# Every entry written from this book must be traceable to a page. If the page
# is unknown, the entry is not ready to commit.
