# Hindi translation glossary for the client "kitchen sheet" (printable menu +
# recipes for domestic help). Deterministic, composed at render time by
# src/lib/fmdb/menu-translate.ts — NO AI, NO runtime cost.
#
# Underscore-prefixed directory so `fmdb validate` skips it (same footing as
# _ingredient_nutrients.yaml). Ships baked into the Fly image (catalogue), so a
# change here needs a Fly redeploy.
#
# Adding a language = drop a sibling `<lang>.yaml` with the same shape + add each
# recipe's `translations.<lang>` block. ZERO code change.
#
# Keys are matched case-insensitively; `terms` keys are matched longest-phrase
# first, so a multi-word key ("mixed vegetables") wins over its single words.
# A dish only renders in Hindi when EVERY non-connective word resolves — anything
# unresolved stays English and is counted, never garbled or dropped.

_meta:
  lang: hi
  name: हिंदी
  script: devanagari

