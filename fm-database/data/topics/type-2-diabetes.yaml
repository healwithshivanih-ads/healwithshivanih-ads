coaching_scope_notes: Coaches support the lifestyle pillars alongside clinical
  management — low-GL whole-food diet, exercise, weight normalisation, and the
  foundation/level-1/level-2 supplement protocol. Do NOT adjust medications; that is
  physician-only. Refer for regular eye, kidney and foot exams.
clinician_scope_notes: Diagnose per ADA criteria. Initiate pharmacotherapy as appropriate;
  oral agents or insulin if targets are not met at Level 2. Monitor HbA1c, fasting
  glucose, C-peptide, lipids, microalbuminuria, GGTP, homocysteine and ferritin.
  Screen for micro- and macrovascular complications. Consider LADA in atypical
  presentations (GAD antibodies).
