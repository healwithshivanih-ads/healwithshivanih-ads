summary: End-stage progression of insulin resistance characterised by overt hyperglycaemia
  (fasting glucose ≥126 mg/dL, HbA1c ≥6.5%), chronic hyperinsulinaemia coexisting
  with progressive β-cell apoptosis, and multi-system complications. Driven by obesity,
  diet, sedentary lifestyle, persistent organic pollutants and oxidative stress.
  Ninety percent of all diabetics have T2DM.
