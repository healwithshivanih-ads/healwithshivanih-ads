- chronic-inflammation
coaching_scope_notes: 'Lid hygiene is the mainstay and it is entirely a coaching-scope
  habit — but it must be framed as ongoing maintenance, not a course, because
  blepharitis relapses reliably when hygiene stops. Daily routine — warm compress
  to soften crusts, then wipe along the lash line with a clean damp cloth or a
  commercial lid wipe, then a gentle lid massage. Support the skin picture alongside
  it if rosacea or seborrhoeic dermatitis is present, since the lid is downstream of
  it. Omega-3 helps the coexisting meibomian component. Replace eye make-up regularly
  and remove it fully; discard old mascara. Avoid recommending undiluted tea tree oil
  near the eye — Demodex treatment uses specific diluted preparations and belongs
  with the prescriber.'
clinician_scope_notes: Slit-lamp lid-margin assessment, lash sampling for Demodex
  (cylindrical dandruff at the lash base is characteristic). Topical antibiotics,
  ophthalmic azithromycin, oral tetracyclines for the rosacea-associated form, and
  in-office Demodex treatments (tea tree derivatives, lotilaner) are clinician-led.
notes_for_coach: Blepharitis and MGD are usually the same client. If dry eye is not
  responding to drops, ask specifically about morning crusting and whether the lids
  feel stuck on waking — clients rarely volunteer it because they file it under
  "just sleep in my eyes". The single most common reason lid hygiene fails is that
  it was done for two weeks and stopped; build it into an existing daily anchor so
  it survives.
evidence_tier: strong
