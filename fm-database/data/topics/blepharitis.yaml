summary: Chronic inflammation of the eyelid margins. Anterior blepharitis affects
  the lash line and is driven by staphylococcal overgrowth, seborrhoeic skin, or
  Demodex mite infestation of the lash follicles; posterior blepharitis is meibomian
  gland dysfunction. Most clients have a mixed picture. Presents as crusting or
  flaking at the lash base worse on waking, red or thickened lid margins, itching
  and grittiness, and recurrent styes or chalazia. It is a leading cause of chronic
  dry eye and of dry eye that does not respond to lubricants, because the inflamed
  lid margin keeps destabilising the tear film. Strongly associated with rosacea and
  seborrhoeic dermatitis — the eyelid is often the last place a skin condition gets
  recognised.
common_symptoms:
- dry-eyes
- crusting-eyelids
- photophobia
- blurred-vision
red_flags:
- loss of lashes, distorted lid margin, or a persistent unilateral lesion — refer to
  exclude malignancy
- corneal involvement, marked photophobia or vision change
- rapid onset with pain and swelling
related_topics:
