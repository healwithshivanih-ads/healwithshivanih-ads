slug: smart-smarter-goals
display_name: SMART & SMARTER Goals in Coaching
aliases:
- smart goals
- goal setting coaching
summary: SMART goals are Specific, Measurable, Achievable, Relevant, and Time-bound;
  SMARTER extends this with Evaluate and Reward (or Review and Reward). Used within
  a client-centred model, the coach helps the client turn a global aspiration ('lose
  weight', 'feel better') into a short-term, action-oriented weekly experiment linked
  to their vision and values. Goals fail when they are extrinsically motivated, too
  big, or disconnected from what actually matters to the client.
