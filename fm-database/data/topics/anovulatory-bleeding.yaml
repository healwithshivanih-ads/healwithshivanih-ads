summary: 'Most common cause of heavy bleeding in the forties. Because ovulation is
  failing, no

  progesterone is made to thin the uterine lining — meanwhile estrogen keeps building
  it up.

  Result is heavy, prolonged (>7 days) or between-period bleeding, and if left unchecked
  can

  progress to endometrial hyperplasia or uterine polyps. Anovulatory bleeding is what
  most

  women mean when they experience "flooding" (>200 mL, sometimes >500 mL per cycle)
  in

  perimenopause. First-line assessment: rule out fibroids / adenomyosis / hyperplasia
  /

  polyps / thyroid disease / von Willebrand disease via GP + ultrasound + blood tests.

  Progesterone deficiency is the actual driver, so treatment is oral micronised progesterone

  (Prof Prior protocol: 300 mg at bedtime daily × 3 months for very heavy flow) OR
  a

  hormonal IUD (progestin, but achieves 90% flow reduction locally). Adjuncts: tranexamic

  acid or NSAID during flow, iron supplementation for the inevitable iron deficiency,

  strictly dairy-free diet trial to lighten flow via mast-cell / prostaglandin reduction.

  '
