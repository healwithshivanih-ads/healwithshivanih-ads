red_flags:
- unilateral or persistent salivary gland swelling (parotid) - needs urgent clinician review, small
  lymphoma risk in long-standing Sjogren's
- rapidly progressive dental decay in an adult with dry mouth
- dry eyes with pain, photophobia or vision change - ophthalmology, not lubricants
coaching_scope_notes: 'IN SCOPE - noticing the pattern, measuring unstimulated whole salivary flow
  rate in a session (see lab test of the same name), asking directly about dry eyes and dry mouth
  in every autoimmune-thyroid client, protecting the teeth (fluoride, no alcohol mouthwash, sipping
  water, sugar-free stimulation), and arranging direct-order antibody testing so the client presents
  to a doctor WITH a result.

  OUT OF SCOPE - diagnosing Sjogren''s, interpreting a positive antibody result as diagnosis, or advising
  on immunosuppressive treatment.

  Indian-practice note - clients are frequently dismissed when they ask a doctor for a specific test.
  Ordering the ENA/anti-SSA panel directly (available without prescription) and walking in with a
  positive result changes that conversation entirely. A negative result does NOT exclude Sjogren''s
  - seronegative disease is real - so a client with clearly low salivary flow still warrants review.

  Special caution with health-anxious clients - naming a possible autoimmune diagnosis can do real
  harm. Frame as comfort and dental protection, and discuss testing only if they raise it.'
clinician_scope_notes: Diagnosis is by the 2016 ACR/EULAR classification criteria, integrating anti-SSA/Ro,
  ocular staining, Schirmer's test, unstimulated whole salivary flow and labial minor salivary gland
  biopsy. Referral is to rheumatology.
