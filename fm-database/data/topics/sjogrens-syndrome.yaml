summary: 'An autoimmune condition attacking the moisture-producing glands, producing dry mouth (xerostomia)
  and dry eyes (keratoconjunctivitis sicca), often with fatigue and joint pain. It matters enormously
  in this practice because it travels with autoimmune thyroid disease - Sjogren''s runs at 17% in
  Hashimoto''s, 37% of autoimmune-thyroid patients meet xerostomia criteria, 23% meet dry-eye criteria,
  and 24% carry Sjogren''s features overall. Conversely autoimmune thyroid disease in primary Sjogren''s
  runs at nine times the background rate. The overlap is mechanistic, not coincidental - anti-thyroglobulin
  antibodies in the two conditions bind an overlapping region of human thyroglobulin.

  Practical consequence - dry mouth in a Hashimoto''s client is never a throwaway symptom, and dry
  mouth PLUS dry eyes in that client should trigger objective assessment rather than a saliva-substitute
  suggestion. Untreated it is not merely uncomfortable - loss of saliva drives rampant caries, candida
  and swallowing difficulty.'
