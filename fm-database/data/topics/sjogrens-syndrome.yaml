notes_for_coach: Screening trigger to apply across the roster - autoimmune thyroid disease PLUS dry
  mouth PLUS dry eyes. On the current roster that is Nazneen Irani (cl-022), whose stated goal is
  literally that her dry mouth return to normal. Niti Sethi (cl-014) has Hashimoto's and dry mouth
  but no dry eyes, and her dry mouth has a competing explanation in documented night-time mouth breathing
  - lower suspicion, still worth the salivary flow measurement.
