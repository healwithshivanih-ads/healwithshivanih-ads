summary: "Systemic autoimmune disease in which lymphocytes infiltrate and progressively\
  \ damage the exocrine glands — principally the lacrimal and salivary glands\
  \ — producing the sicca picture of dry eyes plus dry mouth. Around nine times\
  \ more common in women, with peaks in the perimenopausal years and again after 60.\
  \ Primary Sj\xF6gren's occurs alone; secondary Sj\xF6gren's accompanies another\
  \ autoimmune disease, most often rheumatoid arthritis, lupus or Hashimoto's\
  \ thyroiditis. Beyond the glands it is genuinely systemic — fatigue and\
  \ widespread musculoskeletal pain are among the most disabling features and are\
  \ frequently the reason a client presents, dryness of all mucous membranes\
  \ (including vaginal dryness and recurrent lower urinary tract symptoms) is common,\
  \ and there is a recognised association with interstitial cystitis. It is widely\
  \ under-diagnosed, with reported delays of several years, because the individual\
  \ complaints get attributed separately to age, menopause or anxiety."
common_symptoms:
- dry-eyes
- dry-mouth
- joint-pain
- fatigue
- vaginal-dryness
red_flags:
- "persistent parotid or submandibular gland swelling — needs prompt assessment;\
  \ Sj\xF6gren's carries an elevated non-Hodgkin lymphoma risk"
- breathlessness or persistent dry cough (interstitial lung disease)
- profound unexplained muscle weakness or persistent low potassium (renal tubular
  acidosis)
- new neurological symptoms such as numbness or burning in the feet
