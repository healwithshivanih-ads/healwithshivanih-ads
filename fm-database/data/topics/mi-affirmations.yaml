slug: mi-affirmations
display_name: MI Affirmations — Shining a Light on Existing Strengths
aliases:
- affirming in coaching
- strengths lens affirmation
summary: In MI, an affirmation names a genuine strength, effort, or value that the
  client already has — it is not praise, flattery, or cheerleading. Simple affirmations
  acknowledge; complex affirmations connect the strength to the client's larger story.
  Delivered too early or too warmly they can feel patronising, so coaches watch the
  client's body language and ease off if the affirmation lands awkwardly.
