summary: 'Two states from positive psychology worth naming for clients: flow (deep,
  absorbed engagement in an activity matched to skill and challenge) and awe (the
  emotion of encountering something vast that expands one''s sense of self). Both
  are levers for meaning, wellbeing and behaviour change — often available through
  everyday activities, not only peak experiences.'
