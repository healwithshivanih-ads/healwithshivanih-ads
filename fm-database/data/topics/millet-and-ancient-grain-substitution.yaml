summary: Replacement of refined grains (white rice, wheat) with millets (foxtail,
  barnyard, kodo, little, jowar) and quinoa across meals — biryanis, khichdis, rotis,
  upma — to reduce glycaemic load and increase micronutrient density.
key_mechanisms:
- glycemic-load-reduction
- dietary-fiber-modulation
coaching_scope_notes: 'Millets should be rinsed 2–3 times and soaked before cooking
  to reduce phytic acid — prefer an overnight soak with the water discarded where
  millets are a daily staple, not a 10–15 minute rinse-soak. Many recipes serve millet
  as a direct rice substitute.

  THREE CAUTIONS TO CARRY WITH ANY MILLET-FORWARD PLAN — all three are absent from
  popular millet advocacy, which is uniformly promotional:

  1. Pearl millet (bajra) carries heat-stable C-glycosylflavone goitrogens. The usual
  "cook your goitrogens" rule does NOT apply to bajra. Rotate rather than making it
  the daily roti in thyroid clients — see pearl-millet-goitrogens-heat-stable-unlike-brassica.

  2. Kodo millet has a documented Aspergillus / cyclopiazonic-acid contamination risk
  tied to damp harvest and storage. Attach sourcing and storage guidance to every kodo
  recommendation — see kodo-millet-mycotoxin-contamination-risk.

  3. Phytate binds non-haem iron and zinc. Matters once millets go daily, especially
  in menstruating women and vegetarians — see millet-phytate-mineral-binding-soak-and-ferment.

  Rotation across millets is the practical answer to all three: no single millet
  becomes the everyday grain.'
