summary: 'Umbrella term (replacing the older "vulvovaginal atrophy") for the entire
  cluster of

  vagina / vulva / bladder / pelvic-floor symptoms driven by menopausal low estrogen:
  dryness,

  burning, itching, painful intercourse or bleeding, painful urination, bladder urgency,

  stress incontinence, recurrent UTIs, loss of libido, arousal or orgasm, and vaginal
  wall

  prolapse. 50% chance by age 60, 75% by age 70 — and unlike hot flushes, GSM does
  NOT

  self-resolve; without treatment it progressively worsens. Highly treatable. Vaginal

  estrogen (Vagifem Low® estradiol or Ovestin® estriol) is the number-one treatment
  and is

  very safe — carries essentially none of the systemic estrogen risks and may even
  be safe

  after breast cancer per ACOG guidance. Adjuncts: oral zinc 30 mg for epithelial
  integrity

  (Bradfield Strydom protocol — vaginal dryness can improve significantly in weeks),

  vaginal probiotic (Lactobacillus rhamnosus GR-1 + L. reuteri RC-14) for microbiome

  balance, D-mannose 2 g/day for UTI prevention, sea buckthorn oil 3 g/day, silicone-
  or

  water-based lubricants with vagina-friendly pH 4.5 and osmolality <1200 mOsm/kg.
  Avoid

  douches, wipes, high-osmolality lubricants and mineral-oil-based products (BV promoters).

  '
