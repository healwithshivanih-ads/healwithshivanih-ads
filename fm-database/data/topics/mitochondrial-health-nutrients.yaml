coaching_scope_notes: Coach can educate on the role of mitochondrial nutrients and
  guide food-first strategies — nutrient-dense dietary patterns and the lifestyle
  habits that support mitochondrial health are the foundation. Supplement protocols
  should be coordinated with an FM provider.
clinician_scope_notes: 'Supplement dosing for mitochondrial support and assessment of
  mitochondrial dysfunction are clinician scope. Key supplements: CoQ10, carnitine,
  ALA, NAC, B vitamins, magnesium, omega-3s, vitamin C — personalised to labs,
  medications and health history.'
