slug: mi-oars-four-core-skills
display_name: OARS — The Four Core MI Skills
aliases:
- oars
- open questions affirmations reflections summaries
summary: 'The four core communication skills used throughout every MI task: Open questions
  (invite talk, create forward momentum), Affirmations (name a strength the client
  already has, without praise or cheerleading), Reflections (simple and complex —
  feed the client''s own words back so they hear themselves), and Summaries (gather
  what''s been said and hand the thread back). Used differently in each task — reflections
  dominate in Engaging; open questions and complex reflections drive Evoking.'
