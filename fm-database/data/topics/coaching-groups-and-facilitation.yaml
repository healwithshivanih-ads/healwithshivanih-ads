summary: Group coaching (ideal 8–12) demands different craft from 1:1 — active listening
  to a room, journaling prompts and breakouts to preserve intimacy, accountability
  pairs between sessions, and a firm close-out where each person names their key takeaway.
  Groups >20 are facilitation, not coaching.
