coaching_scope_notes: 'The single most valuable thing a coach can do here is get the
  client to ask her eye doctor one specific question: "are these conjunctival
  concretions, and can they be removed?" Clients are often told "calcium deposits,
  nothing to be done" and go home to hunt for remedies, when a two-minute procedure
  would resolve it. Comfort measures — warm compress, preservative-free artificial
  tears, lid hygiene for the near-universal accompanying lid inflammation — are in
  scope and worth doing. Be straight that they soothe rather than remove. Explicitly
  head off two harmful ideas the "calcium" label invites: cutting dietary calcium
  (useless here and actively bad for an older woman''s bones) and putting home oils
  or eyewashes into an eye whose surface may already be broken.'
clinician_scope_notes: Removal, corneal assessment, and the decision about whether
  raised serum calcium needs investigating are all clinician territory.
notes_for_coach: 'UNVERIFIED SOURCING — READ BEFORE CLIENT USE. Drafted 2026-08-11
  from an active client question (Kamla Bhutani, told by her doctor she had calcium
  deposits under the eyelids). No source is cited because the container egress proxy
  blocked every ophthalmology reference that was tried; this is clinical general
  knowledge that has NOT been checked against a primary source, hence
  confirm_with_clinician. Add a proper reference before this is used to shape client
  advice.


  WHY IT EARNS AN ENTRY: "calcium deposits under the eyelid" is a phrase clients
  arrive with, and it maps onto three different things — concretions (lid, not really
  calcium, common), band keratopathy (cornea, genuinely calcium, systemically
  meaningful) and xanthelasma (skin, cholesterol). Getting that fork wrong sends the
  coach down the wrong road, and one branch of it interacts directly with vitamin D
  and calcium supplementation. The aliases are deliberately written in the client''s
  words rather than the textbook''s so the phrase resolves here.


  HOME REMEDIES — WHAT TO SAY NO TO. The catalogue''s eye remedies
  (castor-oil-eye-drops-cataracts, triphala-eyewash,
  ayurvedic-eye-wash-cool-water-rose-hydrosol) all carry the same contraindication:
  active eye problem, do not use. That contraindication is live while a concretion
  is abrading the surface. Sequence it — ophthalmologist first, comfort remedies
  after clearance. Sea buckthorn oil is oral and safe to run in parallel, but it
  changes tear quality and does nothing to the deposit.'
