summary: Small hard yellowish-white specks embedded in the inner (palpebral) surface
  of the eyelid, extremely common with age and with any long-running lid inflammation.
  Patients are routinely told they are "calcium deposits", which is what brings the
  question to a coach. Two facts decide every downstream answer. First, they are not
  really calcium — they are inspissated plugs of dead epithelial cells and mucus
  trapped in pockets of the conjunctiva. Second, they do not dissolve. Nothing
  swallowed, rubbed on, warmed or eliminated from the diet will remove one. Most are
  silent; when a concretion erupts through the surface it abrades the cornea on every
  blink, which produces the foreign-body sensation, watering and scratchiness. The
  definitive answer is an ophthalmologist lifting it out with a needle tip under
  anaesthetic drops — a couple of minutes, immediate relief, and it can recur.
common_symptoms:
- foreign body sensation
- gritty eyes
- watery eyes
red_flags:
- Any pain, vision change or light sensitivity — a concretion abrading the cornea
  can cause an epithelial defect; refer same-day rather than adding remedies.
- 'Doctor described calcium deposits in the CORNEA rather than the lid (band
  keratopathy): this can reflect raised blood calcium — parathyroid disease, excess
  vitamin D, sarcoid, kidney disease. If the client is on vitamin D or calcium
  supplements, this needs serum calcium and PTH checked before anything is added.'
- Yellow plaques on the eyelid SKIN are xanthelasma — cholesterol, not calcium, and
  a cardiovascular risk marker. Different conversation entirely.
