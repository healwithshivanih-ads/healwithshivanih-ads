summary: 'The value case for embedding a health coach in an FM clinic: the physician
  makes the diagnosis and orders labs, and the coach carries the client through implementation
  of the protocol between visits — supplement adherence, food-plan translation, lifestyle
  habits, and check-ins that would otherwise not happen.'
