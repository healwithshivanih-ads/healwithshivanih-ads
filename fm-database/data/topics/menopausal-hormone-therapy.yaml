summary: 'Modern replacement of the old term HRT. Umbrella for body-identical estradiol
  (transdermal

  patch/gel preferred over oral because it doesn''t form dangerous clotting factors
  in the

  liver) plus oral micronised progesterone (Prometrium / Utrogestan) — NOT progestins
  like

  medroxyprogesterone (Provera), norethisterone (Primolut), dydrogesterone or the

  levonorgestrel IUD, which drive the breast-cancer risk historically attributed to
  HRT.

  Distinct from BHRT (which traditionally referred to compounded custom formulas from

  compounding chemists). Briden''s rules of thumb: (1) if you take MHT, always pair
  estrogen

  with real progesterone, even after hysterectomy (progesterone helps sleep, mood,
  breasts,

  bones, not just uterine lining); (2) transdermal estradiol + oral micronised progesterone

  is the safest combination; (3) start within 10 years of the final period ("window
  of

  opportunity") — starting later can INCREASE dementia and cardiovascular risk; (4)
  vaginal

  estrogen is very safe (may even be safe with breast-cancer history) and treats GSM

  effectively without systemic risk; (5) progesterone-alone (no estrogen) is often
  the

  BETTER treatment for the high-estrogen perimenopause phase.

  '
