summary: A chronic condition where stomach acid flows back into the esophagus, causing
  heartburn. Affects ~20% of US adults weekly. Associated with significant healthcare
  costs (~$15–20B/year in the US). Managed with PPIs, lifestyle changes, and natural
  supplements during tapering. The functional framing is that the problem is often
  not excess acid but a weakened cardiac sphincter (lower oesophageal sphincter) —
  driven by large evening meals, lying down soon after eating, and drinking large
  volumes of fluid with meals — which is why meal timing and meal size are first-line
  coaching levers.
