coaching_scope_notes: Coaches can support dietary trigger avoidance and lifestyle
  modifications — in particular meal timing (a light evening meal, not lying down
  after eating) and fluid timing (not drinking large volumes with meals), plus stress.
  PPI tapering and supplement dosing require clinician supervision.
clinician_scope_notes: PPI tapering protocol, H2 blocker transitions, and high-risk
  factor assessment (Barrett's, hiatal hernia, gastrin levels) are clinician-scope.
evidence_tier: strong
