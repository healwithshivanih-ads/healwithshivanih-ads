sources:
- id: fmca-m2-mi-focusing-lanier
  location: Focusing task transcript
  quote: Focusing is agreeing on a direction — you can't evoke change talk without
    a target.
- id: fmca-m2-mi-evoking-lanier
  location: Evoking task transcript
  quote: Evoking is drawing out the client's own arguments for change.
- id: fmca-m2-mi-planning-lanier
  location: Planning definition
  quote: Engaging was about the who, focusing about the what, evoking about the why,
    and planning about the how.
