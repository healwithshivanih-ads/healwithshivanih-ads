summary: 'MI unfolds through four sequential, recursive processes: Engaging (building
  the working relationship), Focusing (agreeing on a change target), Evoking (drawing
  out the client''s own motivation and change talk), Planning (co-creating concrete
  next steps when the client is ready).'
