slug: mi-four-processes
display_name: The Four Tasks of MI — Engaging, Focusing, Evoking, Planning
aliases:
- engaging focusing evoking planning
- mi processes
- mi tasks
- four processes of mi
summary: 'MI unfolds through four sequential-but-overlapping tasks: Engaging (the
  ''who'' — build the working relationship), Focusing (the ''what'' — agree on where
  the session is going), Evoking (the ''why'' — the heart of MI, drawing out and strengthening
  the client''s own change talk), and Planning (the ''how'' — moving from mobilising
  change talk into concrete steps). Each task uses OARS differently — reflections
  dominate Engaging; evoking uses complex reflections and open questions strategically.'
