summary: A collaborative, client-centred conversational style for strengthening a
  person's own motivation for change. Built on a specific 'spirit' (compassion, acceptance,
  partnership, empowerment — the coach's CAPE) plus four tasks (Engaging, Focusing,
  Evoking, Planning) and four core skills (OARS). MI is the foundational framework
  in FMCA and NBHWC coaching for working with ambivalence without argument or advice-giving.
