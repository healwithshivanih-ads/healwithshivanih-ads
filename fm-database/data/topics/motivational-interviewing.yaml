summary: MI is a collaborative, goal-oriented style of communication that strengthens
  a client's own motivation and commitment to change by exploring and resolving ambivalence.
  In coaching it operates through the spirit (partnership, acceptance, compassion,
  evocation) and the core skills (OARS).
