coaching_scope_notes: 'MI is squarely coaching territory: use it in every task — build
  engagement, agree on a focus, evoke and strengthen change talk, plan concrete steps.
  Keep the CAPE spirit even in Planning.'
clinician_scope_notes: MI does not replace clinical assessment, diagnosis, or treatment
  decisions — those remain with the clinician.
notes_for_coach: Simple, not easy. Miller's own words. Expect years of practice; record
  and get feedback.
