slug: second-puberty-perimenopause
display_name: Second Puberty (Perimenopause as a Sequence of Events)
aliases:
- second puberty
- perimenopause as second puberty
- reverse puberty
summary: 'Prof Jerilynn Prior''s framing (adopted by Briden) that perimenopause is
  not slow decline

  but the mirror image of first puberty — a sequence of hormonal events lasting 2–12
  years

  that starts with LOSING progesterone (while estrogen stays high and fluctuates wildly,
  up

  to 3× reproductive-age peaks), then transitions to lower estrogen after the final
  period.

  Reframes many "menopausal" symptoms (heavy bleeds, breast pain, migraines, mood
  swings,

  night sweats) as high-estrogen / low-progesterone symptoms of the EARLY phases,
  not

  low-estrogen symptoms — which matters because progesterone-alone (not estrogen)
  is often

  the better treatment during this phase. Prior breaks the transition into 4 phases
  plus

  menopause: very early perimenopause (regular cycles) → early menopause transition

  (irregular cycles) → late menopause transition (first cycle >60 days) → late perimenopause

  (12 months from final period) → menopause (life phase 1 year after last period).

  '
