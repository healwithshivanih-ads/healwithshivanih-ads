coaching_scope_notes: 'Warm compress and lid hygiene are squarely in coaching scope
  and are the highest-value thing you can offer — they are self-care, not treatment
  of a diagnosis. Dose them properly: warm compress 5-10 minutes, 2-4 times a day
  (the stye claims in this catalogue carry the NHS figures), then wipe gently along
  the lash line straight afterwards while the oils are still soft. The order matters
  and clients routinely get it backwards. Set the expectation that this is ongoing
  daily maintenance like brushing teeth, not a two-week course — the single commonest
  reason it "does not work" is that the client stopped. Do not diagnose this; describe
  the self-care and send her to an eye clinician for the label.'
clinician_scope_notes: Diagnosis, gland expression, topical or oral antibiotics,
  ciclosporin, and any decision about Demodex treatment all sit with an ophthalmologist
  or optometrist.
