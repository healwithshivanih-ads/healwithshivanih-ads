summary: Chronic inflammation of the eyelid margin, and blockage of the meibomian glands
  that line it. Those glands secrete the oil layer that stops tears evaporating, so
  when they clog the tear film breaks up early and the eye feels gritty, burning, sore
  and paradoxically watery. This is the commonest driver of evaporative dry eye and
  of recurrent styes, and it very often sits underneath complaints the client describes
  as something else. It is managed, not cured — warm compress plus lid-margin hygiene,
  done daily and indefinitely, is the whole foundation of care.
common_symptoms:
- gritty eyes
- burning eyes
- dry eyes
- watery eyes
- eyelid crusting
- eyelid margin redness
red_flags:
- Vision affected, or pain rather than discomfort — refer same-day.
- Pus, marked swelling, or spread of infection into the eye or eyelid — possible
  preseptal or orbital cellulitis, urgent referral.
- One eyelid persistently and asymmetrically involved, with lash loss or a firm
  nodule that does not settle — needs an ophthalmologist to exclude other causes.
- Dry eyes plus dry mouth plus joint pain — a sicca pattern; refer for autoimmune
  workup rather than treating as lid disease.
