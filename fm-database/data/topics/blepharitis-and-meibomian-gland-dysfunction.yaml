  and re-tier.


  WHY THIS ENTRY EXISTS: the catalogue had stye and dry-eye-syndrome but nothing on
  the lid-margin disease that causes most of both. That gap meant warm-compress advice
  was only reachable through the stye topic, which is the wrong door for a client
  who has never had a stye.


  MOST USEFUL REFRAME FOR A CLIENT: heat and hygiene treat the glands and the
  inflammation. They do not remove anything solid. If there is a physical deposit or
  a firm lump, that is a separate problem needing a separate answer — see
  conjunctival-concretions.'
