red_flags:
- severe-colitis
- colon-cancer-risk
- neurodegenerative-disease-progression
- rectal-bleeding
- chronic-uncontrolled-diarrhea
- Persistent bloating present on waking that worsens throughout the day — warrants evaluation to rule
  out ovarian cancer or other pathology
- New-onset blood in stool or significant change in bowel habits — refer for GI evaluation
- Bloating accompanied by unexplained weight loss
- persistent bloody stool
- unintentional-weight-loss
- severe abdominal pain — refer to GI specialist
clinician_scope_notes: DNA sequencing stool tests (e.g., Ombre, Tiny Health) provide more accurate microbiome
  data than traditional culture. Fungal overgrowth (SIFO) may require antifungal intervention.
