slug: mi-complex-reflections
display_name: Complex Reflections — MI's Deep-Listening Skill
aliases:
- complex reflection
- continuing the paragraph
- double-sided reflection
summary: Complex reflections go beyond simply repeating the client's words — they
  add meaning, emotion, or the underlying value; continue the paragraph the client
  didn't finish; or hold two sides of ambivalence at once. Used skilfully they invite
  deeper exploration and strengthen change talk. They are genuinely hard, and even
  experienced coaches keep practising them.
