summary: 'BJ Fogg''s behavior-design framework: behaviour happens when motivation,
  ability and prompt converge (B=MAP). The Tiny Habits method starts with the smallest
  possible version of a behaviour, anchors it to an existing routine, and uses immediate
  positive emotion to wire in the habit. Designed for durability, not willpower.'
