summary: Stanford's BJ Fogg's Behavior Design frames every behaviour as Behavior =
  Motivation × Ability × Prompt (B=MAP). Since motivation is unreliable, the reliable
  levers are making the behaviour easier (Ability) and building a clear trigger (Prompt).
  Tiny Habits attaches a shrunk-down new behaviour to an existing anchor ('After I
  ___, I will ___') and celebrates immediately to wire in the emotion. Reliability
  beats ambition — tiny wins compound.
