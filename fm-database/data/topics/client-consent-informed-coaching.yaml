summary: The written and verbal agreement between coach and client covering scope
  of practice, confidentiality, cancellation policy, fees, session cadence, communication
  norms, and the boundaries of the coaching relationship. Signed at intake and revisited
  as needed. Distinct from HIPAA — coaches typically aren't HIPAA-covered entities,
  but professional consent, ethics and confidentiality standards still apply.
