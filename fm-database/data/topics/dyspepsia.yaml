slug: dyspepsia
display_name: Dyspepsia & Upper GI Discomfort in Midlife
aliases:
- upper GI discomfort
- nausea
summary: Dyspepsia — encompassing reflux, nausea, bloating after meals, and general upper GI discomfort
  — is common in perimenopause and menopause, linked to declining HCL production, digestive enzyme output,
  bile flow, and microbiome-level fermentation changes.
common_symptoms:
- acid-reflux-heartburn
- nausea
- bloating
- flatulence
- discomfort after fatty meals
- greasy stools
red_flags:
- steatorrhea (fat in stool) warrants stool testing or clinician evaluation
- gallbladder symptoms should be evaluated medically
related_topics:
- perimenopause
- microbiome
- gut-hormone-axis
- constipation
- digestive-enzyme-insufficiency
key_mechanisms:
- hcl-decline
- bile-flow-reduction
coaching_scope_notes: Coaches can discuss meal environment, chewing, stress-reduction before meals, and
  general digestive support supplements. HCL supplementation and bile-acid supplements require clinician
  involvement.
clinician_scope_notes: HCL testing, steatocrit on stool testing, gallbladder evaluation, and bile-acid
  supplement dosing are clinician scope.
evidence_tier: plausible_emerging
sources:
- id: thurlow-microbiome-session-6
  location: Session 6 — Main Transcript, Dyspepsia Section
  quote: The term dyspepsia in traditional allopathic medicine to really talk about you just don't feel
    great. Like you might have a little bit of reflux, you might have a little bit of nausea, and this
    can be a direct reflection of what's changing at the microbiome level.
