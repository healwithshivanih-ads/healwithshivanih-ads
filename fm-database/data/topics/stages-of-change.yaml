- prochaska
- pre-contemplation contemplation preparation action maintenance
summary: Behaviour change moves through pre-contemplation, contemplation, preparation,
  action, maintenance (and sometimes relapse). Coach interventions are stage-matched
  — consciousness-raising in early stages, decisional balance in contemplation, action
  plans in preparation/action, relapse-prevention in maintenance. Movement is non-linear.
