coaching_scope_notes: Assess the stage each visit — clients often move from maintenance
  back into preparation. Ask permission before discussing lifestyle or behaviour change.
notes_for_coach: Don't over-categorise. Use the stage to build rapport and identify
  blocks, not to label the client.
