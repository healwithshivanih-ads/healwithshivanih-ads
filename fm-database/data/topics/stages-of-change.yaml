summary: 'Six stages a person moves through when changing a behaviour: Pre-contemplation,
  Contemplation, Preparation, Action, Maintenance, and Recycle/Relapse (or Termination).
  Movement is spiral, not linear — clients loop back, and recycling is normal. Coaches
  match language and interventions to the client''s current stage: experiential processes
  (awareness, feelings) in the earlier stages; behavioural processes (commitment,
  environment, action) in the later stages.'
