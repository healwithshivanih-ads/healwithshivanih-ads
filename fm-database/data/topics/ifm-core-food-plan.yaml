summary: The Institute for Functional Medicine's foundational food plan, suitable
  for clients of all ages as a first step off a Standard American Diet. Emphasises
  high micronutrient density from produce and offers vegan, vegetarian, vegan-with-soy
  and vegan-without-soy variations. The clinician prescribes the calorie level; the
  coach translates it into servings, personalises around the client's culture and
  preferences, and co-creates the transition plan.
