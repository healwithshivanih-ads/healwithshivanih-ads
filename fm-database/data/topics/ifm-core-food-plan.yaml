summary: The Institute for Functional Medicine's foundational nutrition template —
  a whole-food, phytonutrient-dense plate emphasising non-starchy vegetables, quality
  protein, healthy fats, low-glycemic carbs, and hydration. Serves as the base plate
  that other therapeutic food plans (elimination, mito, cardiometabolic) are built
  on.
