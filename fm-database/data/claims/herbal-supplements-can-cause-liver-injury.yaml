slug: herbal-supplements-can-cause-liver-injury
statement: Herbal and dietary supplements cause a growing share of drug-induced liver injury (about 20% of cases in the US network by 2013), and non-bodybuilding supplement injury is more often severe than injury from medicines. Ashwagandha is among the herbs with documented cases, typically 2-12 weeks after starting.
evidence_tier: strong
rationale: A coach who recommends herbs must be able to recognise when a rise in liver enzymes may be the supplement, and act on it.
coaching_translation: If ALT, AST, ALP or bilirubin rise after a new herb or supplement, or the client gets itching, dark urine, yellow eyes or nausea, the product stops and the doctor is told. Keep stacks short, add one new product at a time, and re-check liver enzymes 4-12 weeks after starting a herb in anyone with a liver history.
out_of_scope_notes: Diagnosing drug- or herb-induced liver injury is the doctor's; the coach stops recommending the product and refers.
caveats:
- Serious injury is rare relative to how many people take these products.
- Ashwagandha evidence is a five-case series; the injury was cholestatic (ALP and bilirubin high) and recovered in 1-5 months.
- Product quality and adulteration vary; the cause is not always the named herb.
