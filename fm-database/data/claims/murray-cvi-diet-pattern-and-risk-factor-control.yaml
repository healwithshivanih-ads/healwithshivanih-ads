out_of_scope_notes: |
  Coaching the dietary pattern, movement, tobacco cessation and adherence to prescribed cardiovascular medication is in scope. Diagnosing hypertension or dyslipidaemia, setting lipid or BP targets, interpreting labs, and starting or changing drugs are clinician scope.
