out_of_scope_notes: >
  Coach scope: behaviour-change support for smoking cessation and alcohol reduction,
  including motivation, triggers, substitution and relapse planning. Clinician scope:
  managing alcohol withdrawal, prescribing cessation pharmacotherapy, and assessing
  liver or testicular damage.
sources:
