  location: Chapter 49 — Erectile Dysfunction, pg 905
  quote: |-
    Long-term alcohol consumption or tobacco use is often a big contributor to ED. In addition to increasing the risk for atherosclerosis, both of these agents negatively affect sexual function. Alcohol use can produce acute episodes of ED as well as more permanent ED due to testicular shrinkage. Smoking just two cigarettes has been shown to inhibit an erection.
