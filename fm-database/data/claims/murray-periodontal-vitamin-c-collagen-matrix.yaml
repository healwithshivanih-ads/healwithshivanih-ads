out_of_scope_notes: >
  The coach may teach vitamin-C-rich and protein-adequate eating and may notice signs
  worth a referral. Diagnosing a deficiency, ordering or reading a serum ascorbate or
  ferritin result, and prescribing gram-level vitamin C are clinician scope. Treating
  the gum disease itself remains dentist scope.
sources:
- id: murray-pizzorno-2012-encyclopedia
  location: Chapter 84 — Periodontal Disease, pg 1390
  quote: >-
    The classical symptom of gingivitis seen in scurvy (severe vitamin C deﬁciency) illustrates the vital function vitamin C plays in maintaining the integrity of the periodontal membrane and collagen matrix.1 The effects of deﬁciency on the bone include osteoporosis and retardation or cessation of bone formation. Subclinical vitamin C deﬁciency plays a signiﬁcant role in periodontal disease through these effects and through its role in delaying wound healing.
- id: murray-pizzorno-2012-encyclopedia
  location: Chapter 84 — Periodontal Disease, pg 1389
  quote: >-
    Because periodontal collagen is constantly being renewed, it is extremely vulnerable when the necessary cofactors for collagen synthesis (protein, zinc, copper, vitamins C, B6, and A, etc.) are absent or deﬁcient.
