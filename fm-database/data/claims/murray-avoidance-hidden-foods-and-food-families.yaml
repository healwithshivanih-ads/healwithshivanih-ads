out_of_scope_notes: >
  Coach scope: label reading, meal planning, restaurant strategy, finding
  culturally appropriate substitutes, and keeping the diet nutritionally adequate.
  Out of scope: deciding which foods must be avoided, extending avoidance to a
  whole food family, or managing a client with a true IgE allergy — that client
  needs an allergist, a written emergency plan and, where indicated, adrenaline
  on hand. A coach does not manage anaphylaxis risk.
sources:
- id: murray-pizzorno-2012-encyclopedia
  location: Chapter 52 — Food Allergy, pg 944
  quote: |-
    Elimination of offending antigens from the diet will begin to alleviate associated symptoms after the body has cleared itself of the antigen/antibody complexes and after the intestinal tract has eliminated any remaining food (usually three to five days). Avoidance means avoiding the food not only in its most identifiable state (e.g., eggs in an omelet), but also in its hidden state (e.g., eggs in bread).
- id: murray-pizzorno-2012-encyclopedia
  location: Chapter 52 — Food Allergy, pg 944
  quote: |-
    For severe reactions, it may also be necessary to eliminate closely related foods with similar antigenic components (e.g., rice and millet, for patients with severe wheat allergy).
