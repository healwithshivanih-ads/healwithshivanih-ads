slug: mast-cell-mediators-functional-dyspepsia
statement: A meta-analysis of case-control studies found raised duodenal mast cells and eosinophils in
  functional dyspepsia; an upper-GI scope that comes back normal, or gastritis with no known cause, is
  a reason to consider mast cell activation.
evidence_tier: plausible_emerging
rationale: Functional dyspepsia is common in the roster. A 'normal scope' does not end the enquiry.
coaching_translation: A normal scope doesn't mean nothing is going on. Some upper-gut discomfort is driven
  by immune cells in the gut lining, and your doctor can look for that.
out_of_scope_notes: Ordering or interpreting biopsies is clinician scope.
caveats:
- Shah et al., Clin Gastroenterol Hepatol 2022; the 'think mast cell' rule is Plotnikoff's clinical opinion.
