slug: briden-hrm-iodine-safety-in-women-40s
statement: 'Iodine deficiency is most common in women 40–49 — iodine matters for thyroid,
  immune, eyes, brain, ovaries and breasts. Downregulates estrogen receptors, making
  cells less sensitive to estrogen swings; helps ovulation pain, ovarian cysts, fibroids,
  premenstrual mood, breast pain. BUT dose depends on thyroid antibody status: with
  antibodies, cap at 500 mcg (0.5 mg)/day; without antibodies, can safely go to 3
  mg/day (Briden''s clinical dose for breast pain). Always co-supplement 150 mcg selenium
  to protect the thyroid. Prefer molecular iodine (I2, brand Violet®) — absorbs preferentially
  into breast tissue over thyroid.'
