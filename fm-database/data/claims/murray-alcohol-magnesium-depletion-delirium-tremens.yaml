out_of_scope_notes: |
  Clinician: magnesium status, repletion during and after withdrawal, cardiac
  and renal assessment. Coach: magnesium-rich everyday foods, sleep and stress
  routines, and noticing cramps, palpitations or tremor as a reason to refer.
