  location: 'Chapter 19 — Alcohol Dependence, pg 431'
  quote: 'In fact, one study found deﬁciency in as many as 60% of alcoholics and a strong link to delirium tremens (a state of confusion and trembling during alcohol withdrawal).39 It is thought to be the major reason for the increased cardiovascular disease noted in alcoholics. This deﬁciency is due primarily to a reduced magnesium intake coupled with alcohol-induced excessive excretion of magnesium by the kidneys, which continues during withdrawal despite low serum magnesium levels.'
