slug: fmca-m3-macros-personalise-not-prescribe
statement: There is no universal macronutrient ratio — the right protein/fat/carb
  split is personalised. What everyone agrees on is high micronutrient density from
  produce; the macronutrient composition is tuned to the individual client's biology,
  activity, goals and clinician's plan.
evidence_tier: strong
rationale: Coach-facing takeaway distilled from the live-call reflection; ready for
  use in briefings and sessions.
coaching_translation: Avoid the low-carb / high-fat / plant-based tribalism. Anchor
  to plants; let the ratio follow the person.
