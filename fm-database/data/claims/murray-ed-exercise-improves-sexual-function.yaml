out_of_scope_notes: >
  Coach scope: designing and supporting a progressive aerobic and strength programme
  within the client's cleared capacity, and habit adherence. Clinician scope: exercise
  clearance for a man with cardiovascular risk, cardiac stress testing, and any
  prescription of exercise as therapy for diagnosed ED.
