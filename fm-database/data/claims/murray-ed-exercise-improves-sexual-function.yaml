  location: Chapter 49 — Erectile Dysfunction, pg 908
  quote: |-
    Like many other studies, this one showed the beneﬁcial effects of regular exercise on ﬁtness and coronary heart disease risk factors. Analysis of diary entries revealed signiﬁcantly greater sexuality enhancements in the exercise group (frequency of various intimate activities, reliability of adequate functioning during sex, percentage of satisfying orgasms, etc.). Moreover, the degree of sexuality enhancement among exercisers was correlated with the degree of their individual improvement in ﬁtness.
