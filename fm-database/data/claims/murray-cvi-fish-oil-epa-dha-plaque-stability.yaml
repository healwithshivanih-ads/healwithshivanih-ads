out_of_scope_notes: |
  Coaching omega-3-rich foods and explaining the plaque-stabilisation idea is in scope. Recommending a dose, advising a client on a supplement alongside their anticoagulant, or implying it substitutes for prescribed therapy is clinician scope and must be referred.
