sources:
- id: murray-pizzorno-2012-encyclopedia
  location: Chapter 35 — Cerebral Vascular Insufficiency, pg 646
  quote: 'TIAs may produce transient symptoms of CVI: dizziness, ringing in the ears, blurred vision,
    confusion, and so on. Repeated TIAs are serious, as over time they can result in substantial, progressive
    damage to brain function. What makes this so insidious is that the lack of a sudden event can mask
    the problem, so it is not recognized until too late.'
