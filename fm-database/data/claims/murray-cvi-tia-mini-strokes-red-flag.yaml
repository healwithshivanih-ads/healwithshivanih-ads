out_of_scope_notes: |
  Recognising and escalating red flags is squarely inside coaching scope - and is arguably the most important thing a coach does here. Diagnosing TIA vs stroke vs mimic, imaging, and starting antiplatelet or anticoagulant therapy are clinician scope only.
