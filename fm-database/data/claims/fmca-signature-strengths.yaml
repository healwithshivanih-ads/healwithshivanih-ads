slug: fmca-signature-strengths
statement: Every client has 3–7 signature strengths (from the VIA 24) — strengths
  that feel like 'the real me' and energise rather than drain. Coaching for change
  goes faster when the goal is pursued through the client's signature strengths, not
  around them.
