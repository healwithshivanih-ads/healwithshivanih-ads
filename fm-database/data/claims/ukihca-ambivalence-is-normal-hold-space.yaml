slug: ukihca-ambivalence-is-normal-hold-space
statement: Ambivalence is normal and there for a reason. The coach's skill is meeting
  clients where they are with unconditional positive regard — not jumping in to fix,
  which usually backfires. A neutral MI tone ('I'm hearing you're not interested in
  giving up the coke') keeps sustain talk non-judgmental. Change is disruptive even
  when healthy, and stages of change aren't linear — sometimes the work is simply
  holding space.
evidence_tier: strong
rationale: Coach-facing takeaway distilled from the live-call reflection; ready for
  use in briefings and sessions.
coaching_translation: When you catch yourself trying to fix, pause. Reflect the sustain
  talk neutrally instead. The change momentum returns when the client feels heard.
