slug: fmca-m3-goal-vs-strategy-vs-tactic
statement: Goal, strategy and tactic are distinct. Goal = the desired outcome (I want
  to feel energetic by June). Strategy = the approach (build a morning routine). Tactic
  = the specific action (walk 10 minutes after breakfast this week). Coaches conflate
  them at their peril — clients lose direction when the levels blur.
evidence_tier: plausible_emerging
rationale: Coach-facing takeaway distilled from the live-call reflection; ready for
  use in briefings and sessions.
coaching_translation: Label them explicitly on the plan. Weekly tactics change; strategy
  is reviewed monthly; goal anchors the whole engagement.
