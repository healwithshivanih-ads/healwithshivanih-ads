slug: ukihca-curiosity-client-centred
statement: In complex reflections, keep curiosity client-centred — turn it toward
  the client's experience ('how did you react?') rather than feeding your own interest
  ('why did your boss blow up?'). The board rubric is a minimum bar, not the ceiling.
