slug: briden-hrm-hot-flushes-narrowed-thermoneutral-zone
statement: Hot flushes are caused by a narrowed thermoneutral zone in the hypothalamus
  — mediated by estrogen drops and altered serotonin/noradrenaline. The bigger the
  swing from high to low estrogen (a feature of natural perimenopause, especially
  in women exposed to high fluctuating estrogen), the more likely hot flushes; women
  who ran a lower average estrogen may flush less. Explains why perimenopausal flushes
  respond to progesterone (calms noradrenaline) while post-menopausal flushes respond
  better to estrogen (restores thermoneutral zone).
evidence_tier: strong
