out_of_scope_notes: >
  Coach scope: asking what supplements and home remedies a client is already taking, educating
  that herbs can interact with prescribed medication, and encouraging the client to disclose
  everything they take to their HIV clinician or pharmacist. Clinician scope: deciding whether
  any herb is safe alongside a specific antiretroviral regimen, all dosing, blood-pressure and
  potassium monitoring, and managing hypertension. A coach must never recommend, dose or
  discontinue a herbal product for someone on antiretroviral therapy, and must never let a herbal
  conversation become a reason for the client to question their medication.
sources:
- id: murray-pizzorno-2012-encyclopedia
  location: Chapter 18 — Acquired Immunodeficiency Syndrome (AIDS) and HIV Infection, pg 416
  quote: >-
    The big concern is that licorice root at a dosage of more than 3 g per day or glycyrrhizin at
    more than 100 mg per day for more than six weeks may cause sodium and water retention, leading
    to high blood pressure. Monitoring of blood pressure and increasing dietary potassium intake
    are suggested.
