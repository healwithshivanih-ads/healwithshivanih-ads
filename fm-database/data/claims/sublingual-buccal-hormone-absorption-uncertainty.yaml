slug: sublingual-buccal-hormone-absorption-uncertainty
statement: Sublingual/buccal hormone dosing is avoided by some FM clinicians because
  absorption through the oral mucosa cannot be guaranteed complete — any swallowed
  portion undergoes hepatic first-pass metabolism, reintroducing the risks associated
  with oral dosing that transdermal routes are meant to avoid.
evidence_tier: fm_specific_thin
rationale: This is a stated clinical preference from the speaker, contrasted against
  colleagues who do use sublingual dosing — he explicitly frames it as his own caution
  rather than a settled consensus.
coaching_translation: If a client mentions she's been offered sublingual or buccal
  hormone drops, it's a reasonable prompt to ask her prescriber how they confirm
  absorption — not something a coach should weigh in on directly.
caveats:
- Speaker explicitly notes other respected clinicians do use sublingual hormones;
  this is a stated personal caution, not consensus.
