sources:
- id: ask-expert-perimenopause-menopause-elyaman
  location: Q&A — sublingual/buccal estrogen absorption question
  quote: Even though some doctors that I respect are using these sublingual hormones,
    I am very worried about it because you can't guarantee me that 100% is going
    to get absorbed through the mouth and that none of it's going to get swallowed.
    And if it gets swallowed and goes through the liver, we can have problems.
