slug: two-cycles-minimum-to-read-a-hormone-pattern
statement: Reading a hormone pattern meaningfully takes about two cycles — or six to
  eight weeks for someone who is not cycling — because a single cycle cannot show
  whether what you are seeing repeats or was an outlier.
evidence_tier: fm_specific_thin
rationale: Cycles vary within the same woman, so one chart cannot separate a stable
  pattern from a one-off.
coaching_translation: Give it about two cycles before drawing conclusions — one cycle
  can be an off month.
