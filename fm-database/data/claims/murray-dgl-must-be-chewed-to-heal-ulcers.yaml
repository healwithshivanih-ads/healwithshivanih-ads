out_of_scope_notes: >
  Recommending a specific DGL product and dose is a supplement recommendation and
  sits outside coaching scope in the NBHWC/FMCA framing — surface it as an option
  for the client to raise with their doctor, and be the one who explains WHY the
  chewable form and pre-meal timing matter if the doctor agrees to it. Never
  suggest DGL as a swap for a prescribed acid-suppressant, and always flag the
  plain-licorice/blood-pressure distinction, which clients routinely miss because
  mulethi is sold everywhere.
