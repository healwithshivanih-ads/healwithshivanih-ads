- id: murray-pizzorno-2012-encyclopedia
  location: Chapter 83 — Peptic Ulcer, pg 1382
  quote: |-
    Clinical studies have demonstrated that DGL is as effective as cimetidine in preventing recurrence of ulcers.28 DGL contains several ﬂavonoids that have been shown to inhibit H. pylori.32 In addition, unlike antibiotics, the ﬂavonoids were also shown to augment natural defense factors that prevent ulcer formation. The activity of the most potent ﬂavonoid was shown to be similar to that of bismuth subcitrate.
- id: murray-pizzorno-2012-encyclopedia
  location: Chapter 83 — Peptic Ulcer, pg 1383
  quote: |-
    It appears that in order to be effective in healing peptic ulcers, DGL must mix with saliva. DGL may promote the release of salivary compounds that stimulate the growth and regeneration of stomach and intestinal cells. DGL in capsule form has not been shown to be effective. The standard dosage for DGL is two to four 380-mg chewable tablets between meals or 20 minutes before meals. Taking DGL after meals is associated with poor results.
