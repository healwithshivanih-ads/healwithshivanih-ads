slug: sjogrens-prevalence-elevated-in-autoimmune-thyroid-disease
statement: >-
  Sjogren's syndrome is substantially over-represented in autoimmune thyroid
  disease. Reported prevalence ranges from 3% to 32%, with 17% in Hashimoto's
  thyroiditis and 5% in Graves'. Among patients with autoimmune thyroid disease,
  37% met criteria for xerostomia and 23% for keratoconjunctivitis sicca, and
  Sjogren's features were present in 24% overall (27% in Hashimoto's). Conversely,
  autoimmune thyroid disease occurs in primary Sjogren's at nine times the
  general-population rate. Anti-thyroglobulin antibodies in the two conditions bind
  an overlapping region of human thyroglobulin, indicating shared pathogenesis
  rather than coincidence.
