caveats:
- >-
    Prevalence estimates vary widely by criteria used and by whether subclinical
    features or full classification is counted. Association is well established;
    direction of causation is not.
coaching_translation: >-
  Dry mouth and dry eyes are common in autoimmune thyroid conditions and are worth
  taking seriously rather than living with. There is a simple no-cost measurement
  we can do in a session, and a blood test that can be arranged directly if it is
  warranted.
out_of_scope_notes: >-
  Diagnosis belongs to a rheumatologist. Our role is to notice the pattern,
  measure salivary flow objectively, protect the teeth, and make sure the client
  reaches a clinician WITH evidence rather than a request. With health-anxious
  clients, do not name the possible diagnosis unprompted.
rationale: >-
  SCREENING RULE - autoimmune thyroid disease PLUS dry mouth PLUS dry eyes.
  On the current roster this fires on Nazneen Irani (cl-022 - Hashimoto's,
  anti-TPO 128.1, dry mouth AND dry eyes, whose stated goal is that her dry mouth
  return to normal). Niti Sethi (cl-014) is a partial match - Hashimoto's with dry
  mouth but no dry eyes, and documented night-time mouth breathing as a competing
  explanation. At 17% prevalence this is too common to leave to memory.
