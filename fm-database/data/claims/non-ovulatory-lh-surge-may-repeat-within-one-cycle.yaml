slug: non-ovulatory-lh-surge-may-repeat-within-one-cycle
statement: A failed (non-ovulatory) LH surge can be followed by a second, successful
  surge later in the same cycle; this looks like one long cycle but is two distinct
  ovulation attempts, and is seen in PCOS and perimenopause.
evidence_tier: plausible_emerging
rationale: Pulsatile brain-to-ovary signalling can fail to recruit a responsive
  follicle, then succeed on a later attempt, producing two LH peaks with progesterone
  rising only after the second.
coaching_translation: Sometimes the body tries to ovulate, misses, and tries again
  later in the same cycle — which explains a "late" period that is not a pregnancy.
