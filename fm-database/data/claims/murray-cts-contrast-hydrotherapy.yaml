out_of_scope_notes: >
  COACH: this one is genuinely inside coaching scope — teaching and supporting a
  self-administered comfort measure — provided sensation is intact and a clinician is already
  involved in the case. CLINICIAN: confirming the diagnosis, ruling out sensory impairment or
  vascular contraindications that make hot/cold immersion unsafe, and directing definitive
  management.
