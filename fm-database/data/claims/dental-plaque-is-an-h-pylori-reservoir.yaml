slug: dental-plaque-is-an-h-pylori-reservoir
statement: >-
  Dental plaque is an established extragastric reservoir for Helicobacter pylori
  and is poorly cleared by standard triple therapy. Adding periodontal treatment
  to triple therapy raised gastric eradication from 51.1% to 64.7% in a
  meta-analysis of clinical trials, with the benefit greater where good plaque
  control was maintained afterwards. Failure to clear H. pylori from dental plaque
  has been associated with roughly 64-fold higher odds of gastric eradication
  failure.
evidence_tier: plausible_emerging
