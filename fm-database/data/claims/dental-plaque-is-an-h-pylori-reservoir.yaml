caveats:
- >-
    This concerns professional PERIODONTAL TREATMENT (scaling and plaque control),
    NOT oil pulling. Extending it to oil pulling is a reasonable but entirely
    untested inference. Whether H. pylori genuinely colonises the mouth or is
    transiently present has also been questioned in the literature. Never tell a
    client that oil pulling treats H. pylori.
coaching_translation: >-
  If reflux or gastric symptoms are driven by H. pylori, the mouth can act as a
  reservoir that re-seeds the stomach after treatment - which is why dental
  cleaning and daily oral hygiene are worth taking seriously alongside whatever
  the doctor prescribes.
rationale: >-
  The most defensible mechanism linking an oral practice to a GASTRIC outcome, and
  the best available explanation for coach-observed reflux improvement on oil
  pulling. Directly relevant to Sudarshan Karnad (cl-008) - possible H. pylori,
  white tongue coating, long antibiotic history, six months of pantoprazole.
