slug: murray-silymarin-alcoholic-cirrhosis-survival
statement: |
  Murray and Pizzorno cite a controlled trial in which 87 cirrhotic patients (46
  with alcoholic cirrhosis) received silymarin, the flavonoid complex of milk
  thistle (Silybum marianum), against 83 controls (45 alcoholic), followed for
  an average of 41 months. Deaths were 24 (18 liver-related) on silymarin versus
  37 (31 liver-related) on placebo, giving a four-year survival of 58% versus
  39%. They also report improved immune function in cirrhotic patients on
  silymarin. The dosing given in the chapter's treatment summary is milk thistle
  extract standardised to 70-80% silymarin at 70-210 mg three times daily, or
  silymarin phytosome 120 mg two to three times daily between meals.
evidence_tier: confirm_with_clinician
rationale: |
  Tiered confirm_with_clinician, deliberately, despite an eye-catching survival
  difference. This is a single trial from the 1980s in an era of different
  cirrhosis management, the alcoholic subgroup is roughly half of a modest
  total, and the chapter reports it without the confidence intervals or
  randomisation detail needed to judge it. Later and larger reviews of silymarin
  in alcoholic liver disease have not reproduced a clear mortality benefit. More
  importantly, the population is people with cirrhosis - by definition under
  specialist care, frequently on multiple medications, with altered drug
  handling. It is a reasonable thing for a clinician to consider and an
  unreasonable thing for a coach to suggest.
coaching_translation: |
  Milk thistle (silymarin) is the herb most often raised when liver damage is in
  the picture, and there is a well-known older study suggesting better survival
  in people with cirrhosis who took it. It is not something to start on your
  own. Anyone with liver disease is usually on other medicines, and the liver is
  exactly where those medicines are handled, so this is a conversation with
  their doctor or hepatologist - and it is worth having, because most doctors
  will engage with it. If a client is already taking it, the useful thing you
  can do is make sure their doctor knows, along with everything else they take.
caveats:
- 'Unsupervised withdrawal in a dependent drinker can be fatal - delirium tremens and withdrawal seizures are medical emergencies. A coach never advises stopping or cutting down alcohol; medically supervised detoxification and addiction-specialist care are required, and nutritional work sits alongside that care, never instead of it.'
- 'Cirrhosis is specialist-managed disease. A coach does not recommend, dose or endorse silymarin - the role is to surface it for the treating clinician and to document what the client is already taking.'
- 'Silymarin can affect cytochrome P450 and glucuronidation pathways, so interaction with existing medication must be checked by a clinician or pharmacist.'
- 'Milk thistle is in the Asteraceae family - caution with ragweed and related allergies.'
- 'The trial is decades old and its mortality finding has not been consistently reproduced; it must not be presented to a client as proven life extension.'
- 'Indian context: alcohol use carries heavy family and social stigma, so intake is routinely under-reported and a client may be drinking considerably more than they say. Keep the framing curious rather than confrontational, use person-first language (a person with alcohol dependence, never ''an alcoholic''), and be careful about who is in the room - disclosure in front of family can cost the client more than the information is worth.'
