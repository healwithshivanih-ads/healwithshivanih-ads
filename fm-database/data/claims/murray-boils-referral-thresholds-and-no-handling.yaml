out_of_scope_notes: >
  Clinician scope - assessing severity, incision and drainage, culture and sensitivity,
  antibiotic prescription, and diagnosing cellulitis or bacteraemia. Coach scope -
  teaching hands-off local care and hygiene, watching the clock against the
  two-to-three-day threshold, naming the red flags out loud, and making the referral
  happen.
