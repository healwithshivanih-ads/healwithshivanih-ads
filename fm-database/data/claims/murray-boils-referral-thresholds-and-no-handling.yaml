    If the boil is severe or does not resolve within two to three days, consult a physician, since the infection can spread under the skin, causing cellulitis (inﬂammation of the connective tissue), or into the bloodstream, causing bacteremia (bacteria in the blood). Cleanliness should be rigorously maintained. The infected area should be immobilized and not handled, except when necessary to change the poultice.
