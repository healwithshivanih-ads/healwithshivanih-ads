out_of_scope_notes: |
  Clinician: liver enzyme interpretation, imaging, antioxidant or NAC
  prescribing, staging of liver disease. Coach: antioxidant-rich everyday foods,
  adequate protein, and never presenting nutrition as a licence to keep
  drinking.
