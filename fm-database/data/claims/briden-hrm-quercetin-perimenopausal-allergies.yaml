slug: briden-hrm-quercetin-perimenopausal-allergies
statement: Quercetin (300–600 mg 2–3× daily) stabilises mast cell membranes to prevent
  histamine release — traditional prevention for hayfever, hives, eczema and asthma.
  Useful for the perimenopausal-allergy onset that ~doubles in this life phase. Safe
  with few side effects. Good adjunct to vitamin B6 (which upregulates DAO enzyme
  to clear histamine).
