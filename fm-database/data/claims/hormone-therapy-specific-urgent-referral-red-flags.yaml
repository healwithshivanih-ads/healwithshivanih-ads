slug: hormone-therapy-specific-urgent-referral-red-flags
statement: Clients on or considering hormone therapy need specific urgent-evaluation
  vigilance beyond general wellness coaching — chest pain or other cardiovascular
  symptoms, shortness of breath, calf pain or swelling (possible blood clot), and
  any new vaginal bleeding while on hormone therapy all require prompt clinician
  evaluation rather than reassurance or a wait-and-see approach.
evidence_tier: strong
rationale: These are standard hormone-therapy safety red flags (venous thromboembolism
  and abnormal uterine bleeding surveillance) consistent with conventional hormone-therapy
  prescribing guidance, not an FM-specific claim.
coaching_translation: Know these red flags cold. A coach's credibility comes from
  recognizing when something is outside scope and referring promptly — not from
  reassurance. When in doubt, always refer.
