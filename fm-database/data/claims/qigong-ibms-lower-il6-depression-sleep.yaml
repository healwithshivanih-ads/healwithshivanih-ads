slug: qigong-ibms-lower-il6-depression-sleep
statement: In a three-arm RCT (n=281) of adults with depressive symptoms and poor sleep, eight weekly
  integrative body-mind-spirit or Qigong sessions eased depression and sleep problems and lowered IL-6
  and IL-1-beta compared with controls.
evidence_tier: plausible_emerging
rationale: Mind-body practice moves measurable inflammatory cytokines, not just mood.
