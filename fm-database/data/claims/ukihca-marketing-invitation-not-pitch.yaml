slug: ukihca-marketing-invitation-not-pitch
statement: 'Marketing tips for coaches: choose a niche so you know where your ideal
  clients gather; the antidote to ''too many ideas'' paralysis is sorting options
  by impact and naming the underlying fear of committing. Networking works best with
  the coach hat on — asking questions, offering value (like a free workshop) rather
  than pitching. Reframe: it''s not a pitch, it''s an invitation to connect.'
