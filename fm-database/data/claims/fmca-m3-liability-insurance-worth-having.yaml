slug: fmca-m3-liability-insurance-worth-having
statement: Professional liability insurance for coaches covers acts or omissions during
  professional duties. Even inside scope, it protects against claims of harm or negligence.
  It is not expensive and is worth carrying — especially for coaches marketing publicly,
  working with clients across jurisdictions, or running group programs.
evidence_tier: strong
rationale: Coach-facing takeaway distilled from the live-call reflection; ready for
  use in briefings and sessions.
coaching_translation: Get a policy the moment you take your first paying client. Renew
  annually. It's cheaper than the peace of mind is worth.
