slug: dhea-decline-under-chronic-stress-and-supplementation-role
statement: Under sustained stress, DHEA typically rises first and then drops; the
  resulting low DHEA can contribute to sex-hormone-imbalance symptoms, and DHEA
  supplementation is used clinically to help support downstream sex-hormone production
  (including via DHEA's conversion to testosterone).
evidence_tier: plausible_emerging
rationale: The biphasic DHEA stress response (early rise, later decline with chronic/prolonged
  stress) is described in HPA-axis literature; DHEA's role as a precursor to testosterone/estrogen
  is established steroidogenesis. Clinical DHEA supplementation for sex-hormone
  support is common FM/anti-aging practice with mixed-quality trial support, hence
  plausible_emerging rather than strong.
coaching_translation: DHEA supplementation is a clinician/prescriber decision (it
  is a hormone precursor, not a general wellness supplement) — a coach's role is
  supporting the stress-management foundation that protects the HPA axis in the
  first place.
caveats:
- DHEA supplementation should be monitored with lab levels; not a self-directed
  supplement.
