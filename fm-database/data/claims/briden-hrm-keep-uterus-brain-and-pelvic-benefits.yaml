slug: briden-hrm-keep-uterus-brain-and-pelvic-benefits
statement: 'A partial hysterectomy (uterus only, ovaries kept) has long-term consequences
  beyond fertility: increases prolapse risk, impairs bladder function, weakens pelvic
  floor, reduces orgasm capacity, and may affect brain spatial memory (uterus-ovary-brain
  animal research). Most conditions leading to hysterectomy (heavy periods, adenomyosis)
  improve with menopause, so ''watch and wait'' with progesterone / IUD / minor procedures
  is often the better play — get a second opinion before agreeing to hysterectomy.'
evidence_tier: plausible_emerging
