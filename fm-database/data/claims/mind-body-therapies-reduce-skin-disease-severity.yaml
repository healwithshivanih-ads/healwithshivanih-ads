slug: mind-body-therapies-reduce-skin-disease-severity
statement: Systematic reviews in skin disease found CBT, mindfulness-based interventions and habit-reversal
  therapy the most promising psychological approaches, and in psoriasis five of six RCTs showed lower
  severity after 8-12 weeks of guided meditation.
evidence_tier: plausible_emerging
rationale: Gives an evidence base for prescribing a daily mindfulness practice to psoriasis, eczema and
  hives clients.
coaching_translation: Ten minutes of guided meditation a day, kept up for two to three months, has been
  shown to calm psoriasis. It's one of the practices we can build in.
out_of_scope_notes: ''
caveats:
- Rafidi 2022 (40 studies, n=3,112, mostly psoriasis and atopic dermatitis); Bartholomew 2022 (6 RCTs).
