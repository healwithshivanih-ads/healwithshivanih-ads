out_of_scope_notes: >
  Coaching food-first soluble fibre - cooked fruit, kanji, banana, a modest amount of psyllium - is in scope. Dosing a supplement to an infant or a child, or using fibre as the response to a diarrhoea that has not been medically evaluated, is not.
