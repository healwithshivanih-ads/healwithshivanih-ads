slug: non-hdl-cholesterol-captures-all-atherogenic-particles
statement: Non-HDL cholesterol (total cholesterol minus HDL) sums all the atherogenic lipoprotein particles - LDL,
  intermediate-density lipoproteins and remnants - so it captures risk that LDL alone can miss, and Indian and American
  guidelines use it alongside LDL.
evidence_tier: strong
rationale: CSI-aligned editorial (Sawhney & Gupta 2024) and the 2026 ACC/AHA guideline both use non-HDL-C with LDL-C
  goals; the arithmetic definition is standard lipidology.
coaching_translation: 'Take your total cholesterol and subtract your HDL. What''s left is non-HDL: every carrier
  that can cause trouble, in one number. Many reports print it; if yours doesn''t, you can work it out.'
caveats:
- Targets are set by the clinician for the individual; coaches explain the line, not the cut-off.
