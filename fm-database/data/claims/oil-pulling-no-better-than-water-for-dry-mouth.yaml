slug: oil-pulling-no-better-than-water-for-dry-mouth
statement: >-
  In a randomised single-blind crossover trial of cold-pressed sunflower oil
  pulling versus mineral water for one week each in moderate medication-induced
  xerostomia, oil pulling relieved the overall xerostomic burden but showed NO
  difference against water for symptom relief. In a separate crossover trial in 24
  women with Sjogren's syndrome, a carboxymethylcellulose gel containing aloe vera
  and coconut oil and a conventional CMC saliva substitute both reduced the
  xerostomia index from about 7.3 at baseline to about 2.85 at two weeks (p<0.001),
  with no significant difference between them.
