caveats:
- >-
    The negative trial used SUNFLOWER oil; a coconut arm has never been run in
    xerostomia, so the null is not necessarily a property of oil pulling in general.
    The Sjogren's trial tested a GEL that remains in the mouth, not several minutes
    of vigorous swishing - a different intervention. Salivary flow was not measured
    in the Sjogren's trial because the authors considered it inappropriate given
    permanent glandular dysfunction.
coaching_translation: >-
  Swishing does help dry mouth - but plain water worked just as well as oil in the
  one trial that compared them. Never push a dry-mouth client through fifteen
  minutes of oil they dislike. A coconut-oil-based gel matched an expensive
  commercial saliva substitute, which is useful in India on cost and availability.
out_of_scope_notes: >-
  Relieving dry mouth does not address its cause. Always ask what is driving it -
  anticholinergic or sedating medication, mouth breathing, dehydration, or
  autoimmune glandular disease. See sjogrens-syndrome.
rationale: >-
  Recorded so we do not oversell oil pulling to the dry-mouth clients on the
  roster. Deepti Palnitkar (cl-011) is almost exactly this trial's population -
  twenty years of SSRI plus benzodiazepine, with suspected OSA on top - and the
  honest advice for her is the cheap one.
