  quote: Typically, the problem develops at the carotid bifurcation—the splitting of the carotid artery
    into the internal branch (supplying the brain) and the external branch (supplying the face and scalp).
    This bifurcation is similar to a stream splitting into two branches. At the bifurcation, just as at
    the splitting of the stream, debris and sediment accumulate. Signiﬁcant symptoms begin to appear in
    most cases only when the blockage of the artery has reached 90%.
