out_of_scope_notes: |
  Diagnosing CVI, ordering or reading carotid ultrasound, and deciding on endarterectomy, stenting or antiplatelet therapy are entirely clinician scope. The coach's scope is education about the shared risk factors and supporting the diet, movement, sleep, stress and smoking-cessation work the physician has cleared.
