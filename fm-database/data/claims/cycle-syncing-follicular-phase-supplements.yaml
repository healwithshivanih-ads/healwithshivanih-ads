slug: cycle-syncing-follicular-phase-supplements
statement: The Cycle Syncing Method pairs the follicular phase with sprouted and fermented
  foods, a roughly 250 kcal reduction, and CoQ10, choline and turmeric.
evidence_tier: fm_specific_thin
rationale: The follicular phase is the follicle-maturation window, where the method targets
  mitochondrial support for the developing follicle and estrogen conjugation in the liver.
coaching_translation: Early in your cycle, lean on sprouted and fermented foods.
