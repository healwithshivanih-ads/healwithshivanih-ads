slug: fmca-m3-tiny-habits-anchor-recipe
statement: The Tiny Habits recipe is 'After I [existing anchor behaviour], I will
  [new tiny behaviour]'. The anchor gives the prompt for free; the tiny size guarantees
  Ability; celebrating immediately after wires in the positive emotion that makes
  the habit stick.
evidence_tier: strong
rationale: Coach-facing takeaway distilled from the live-call reflection; ready for
  use in briefings and sessions.
coaching_translation: Write the recipe out loud with the client. Ask them to demonstrate
  the celebration. If they can't celebrate, the habit won't stick.
