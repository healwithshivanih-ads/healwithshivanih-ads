slug: briden-hrm-testosterone-dominance-menopause
statement: As progesterone and estrogen fall away with menopause, adrenal and ovarian
  androgen production stays constant or slightly rises, and sex hormone-binding globulin
  (SHBG) drops — leading to relative 'testosterone dominance.' This drives insulin
  resistance, abdominal weight gain, female pattern hair loss, mild facial hair, and
  a body-shape change from hourglass to squarer. Reversing insulin resistance and
  raising SHBG (via phytoestrogens, thyroid support) can partly counteract it.
evidence_tier: strong
