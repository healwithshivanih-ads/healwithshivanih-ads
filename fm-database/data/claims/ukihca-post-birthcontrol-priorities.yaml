slug: ukihca-post-birthcontrol-priorities
statement: Post-hormonal-birth-control priorities are supporting micronutrients (B
  vitamins, D3, omega-3s) and the gut before attempting cycle-syncing. HRT is a useful
  tool but is not nuanced enough on its own — clients should still get proper testing
  (e.g. FSH) and maintain diet/lifestyle foundations. Post-menopause the focus shifts
  to circadian support (melatonin, oxytocin, nitric oxide) rather than a four-phase
  cycle framework.
evidence_tier: plausible_emerging
rationale: Coach-facing takeaway distilled from the live-call reflection; ready for
  use in briefings and sessions.
coaching_translation: Coach the micronutrient and gut foundations first; refer cycle-syncing
  depth or HRT questions to the clinician.
out_of_scope_notes: HRT decisions, FSH interpretation, and specific supplement dosing.
