slug: briden-hrm-thyropause-perimenopause-hashimotos
statement: '''Thyropause'' — perimenopause is a common trigger for autoimmune thyroid
  disease (Hashimoto''s) because losing progesterone destabilises immune regulation
  and progesterone directly modulates thyroid hormone. Symptoms of hypothyroidism
  and perimenopause overlap heavily (fatigue, weight gain, brain fog, heavy periods,
  hair loss, aches) — miss the thyroid diagnosis and you''ll misattribute the symptoms.
  Always ask for TSH + free T4 + THYROID ANTIBODIES (TPO). A family history of autoimmune
  disease + hypothyroid symptoms = insist on the antibody test.'
