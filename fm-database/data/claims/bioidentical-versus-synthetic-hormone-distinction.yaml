slug: bioidentical-versus-synthetic-hormone-distinction
statement: Bioidentical (body-identical) hormones are structurally identical to what
  the body makes; synthetics such as progestins and ethinyl estradiol bind the same
  receptors without matching the native molecule, which is why their side-effect
  profiles differ. Drug names are misleading — ethinyl estradiol and medroxyprogesterone
  acetate are synthetic despite their names.
evidence_tier: plausible_emerging
rationale: Receptor binding is not the same as identical signalling; a differently
  shaped ligand can produce different downstream effects at the same receptor.
coaching_translation: "\"Estradiol\" or \"progesterone\" in a drug name does not mean
  it is the same molecule your body makes — worth asking your prescriber which one
  you are on."
linked_to_topics:
