out_of_scope_notes: Coaches must never recommend, compare or adjust hormone therapy.
  This is education to help a client ask her prescriber an informed question.
caveats:
- Presenter's summary in Q&A; comparative safety of specific agents is a clinical
  question and is not settled by this source.
