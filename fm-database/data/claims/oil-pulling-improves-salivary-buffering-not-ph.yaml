slug: oil-pulling-improves-salivary-buffering-not-ph
statement: >-
  In a four-week randomised trial in 80 girls aged 12-14 (coconut oil, sesame oil,
  chlorhexidine, plain water), oil pulling significantly improved salivary
  BUFFERING CAPACITY versus control - coconut p=0.0345, sesame p=0.026,
  chlorhexidine p=0.045 - while salivary pH itself did not differ significantly
  (p>0.05). Oil pulling matched chlorhexidine on both buffering capacity and total
  antioxidant capacity.
evidence_tier: plausible_emerging
linked_to_topics:
- oral-health-toxins
