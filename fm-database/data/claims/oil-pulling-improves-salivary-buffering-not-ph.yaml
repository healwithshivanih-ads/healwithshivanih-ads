sources:
- id: oil-pulling-salivary-ph-buffering-rct-children
  location: Four-arm randomised study, baseline vs 30 days
caveats:
- >-
    Paediatric female population, four weeks, single centre; numeric tables were not
    retrievable from the abstract page. Buffering capacity and resting pH are
    different properties and the distinction is load-bearing here.
coaching_translation: >-
  Oil pulling does not make the mouth less acidic at rest. What it appears to
  improve is saliva's ability to RECOVER after an acid hit - from a meal, a sweet,
  or reflux - which is what protects enamel over time.
rationale: >-
  Corrects the widespread claim that oil pulling "alkalises the mouth". It does
  not. Use this wording whenever a client or a source makes the pH claim. Relevant
  to the caries clients on the roster (Manju Jain cl-016, Krittika Krishnan
  cl-019) and to anyone with reflux, whose saliva is already lower in pH and
  buffering capacity.
