slug: ukihca-values-visioning-not-checkbox
statement: Visioning is not a foundation-session box to tick — it's evoking the client's
  deeply held values. When someone struggles, be clever about how you ask (playful
  questions, extra time, pre-work). Tiny Habits and Appreciative Inquiry are practical
  tools worth revisiting whenever a client is stuck.
