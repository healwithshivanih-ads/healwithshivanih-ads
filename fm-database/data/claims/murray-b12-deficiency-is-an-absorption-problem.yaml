out_of_scope_notes: >
  Diagnosing pernicious anemia, testing B12 or intrinsic-factor antibodies, interpreting
  those results, prescribing B12 or hydrochloric acid supplements, and reviewing
  acid-suppressing medication are all clinician scope. Coach scope: educating the client that
  B12 status is an absorption question as well as an intake question, flagging the risk
  pattern (vegan or strict vegetarian diet, long-term antacid use, age, prior gut surgery) as
  something to raise with their doctor, and supporting food habits alongside whatever the
  doctor decides.
sources:
- id: murray-pizzorno-2012-encyclopedia
  location: Chapter 21 — Anemia, pg 467
  quote: >-
    Vitamin B12 deﬁciency is most often due to a defect in absorption, not a dietary lack. In
    order for vitamin B12 to be absorbed from food, it must be liberated from food by
    hydrochloric acid and bound to a substance known as intrinsic factor within the small
    intestine. Intrinsic factor is secreted by the parietal cells of the stomach. These same
    cells are responsible for the secretion of hydrochloric acid.
