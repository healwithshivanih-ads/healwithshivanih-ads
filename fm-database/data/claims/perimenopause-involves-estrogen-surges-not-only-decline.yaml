slug: perimenopause-involves-estrogen-surges-not-only-decline
statement: Perimenopause is not a smooth estrogen decline — it commonly includes
  sustained estrogen surges with low progesterone, which can drive breast tenderness,
  fullness, low mood, irritability and shifting migraine patterns.
evidence_tier: plausible_emerging
rationale: As follicles become less responsive, the brain raises its signalling and
  the ovary can then release a disproportionately large estrogen output, producing
  high estrogen unopposed by progesterone in an anovulatory cycle.
coaching_translation: In perimenopause estrogen can spike as well as fall, so symptoms
  that change suddenly are often the hormones moving, not you doing something wrong.
