slug: briden-hrm-melatonin-timing-vs-dose
statement: 'Dr Heidi Roth (UNC neurologist) protocol: melatonin works best when taken
  ~6 hours BEFORE bedtime at a low dose of 0.5–1 mg, not the usual 3–5 mg taken at
  bedtime. Higher doses (3+ mg) are appropriate for fibromyalgia, migraine prevention,
  and possibly osteoporosis/breast cancer risk reduction — but not for straightforward
  sleep. Melatonin is prescription-only in Australia and NZ; over-the-counter ''melatonin''
  is homeopathic and won''t work.'
