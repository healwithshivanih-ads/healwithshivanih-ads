slug: confirming-ovulation-requires-pdg-rise-after-lh-surge
statement: An LH surge alone does not confirm ovulation; confirmation requires a
  sustained rise in PdG (a urinary progesterone metabolite) after the surge, with a
  luteal phase of roughly 11-16 days and PdG above E3G during that window.
evidence_tier: plausible_emerging
rationale: LH triggers follicle rupture but does not guarantee it. Only a corpus
  luteum produces progesterone, so a PdG rise is the downstream evidence that release
  actually happened.
coaching_translation: A positive ovulation strip says your body tried; a progesterone
  rise afterwards says it worked.
