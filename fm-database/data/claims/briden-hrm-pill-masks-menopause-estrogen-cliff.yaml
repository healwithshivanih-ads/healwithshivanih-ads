slug: briden-hrm-pill-masks-menopause-estrogen-cliff
statement: Staying on the combined oral contraceptive pill through the perimenopausal
  years masks the natural transition — the pill's synthetic estrogen suppresses ovulation
  and prevents hot flushes. Stopping the pill in the 50s can therefore precipitate
  a sudden 'estrogen cliff' with intense withdrawal symptoms (severe hot flushes,
  dry skin, insomnia) instead of the gradual four-phase perimenopause. Better to transition
  to body-identical hormone therapy under medical guidance.
