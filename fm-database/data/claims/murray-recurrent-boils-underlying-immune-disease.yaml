out_of_scope_notes: >
  Clinician scope - diagnosing the underlying condition, ordering and interpreting
  fasting glucose / HbA1c / HIV or immune workup, culturing the lesion, deciding on
  incision and drainage or antibiotics. Coach scope - noticing and naming the
  recurrence pattern, making the referral explicit and specific, and supporting
  lifestyle factors (sleep, refined-carbohydrate load, household hygiene) while the
  client waits to be seen.
