slug: coeliac-disease-raises-transaminases-gluten-free-reverses
statement: Raised ALT and AST are common in untreated coeliac disease (42% of adults at diagnosis in one series) and return to normal on a strict gluten-free diet in almost all of them.
evidence_tier: strong
rationale: Coeliac is a treatable, often-missed cause of unexplained raised liver enzymes, especially in lean clients with gut symptoms, anaemia or thyroid autoimmunity.
coaching_translation: A lean client with unexplained raised ALT/AST plus bloating, loose stools, low iron or Hashimoto's may be worth a coeliac test. Suggest they ask their doctor for it BEFORE going gluten-free, or the test can read falsely negative.
out_of_scope_notes: Coeliac testing and diagnosis are the doctor's; never start a gluten-free trial before the test is done.
caveats:
- Single Italian centre; when enzymes stayed high on the diet, another liver disease was usually present.
