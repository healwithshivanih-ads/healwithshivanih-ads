out_of_scope_notes: >
  Trialling dairy removal and structured reintroduction, and coaching replacement of the lost nutrients, are in scope. Diagnosing lactose intolerance, ordering or interpreting hydrogen breath tests, and excluding coeliac disease are clinician work.
sources:
- id: murray-pizzorno-2012-encyclopedia
  location: Chapter 46 — Diarrhea, pg 868
  quote: "Lactose intolerance is due to a deﬁciency in the enzyme lactase, responsible for digesting the lactose found in dairy products; it is common worldwide. It has been estimated that 70 to 90% of adults of Asian, black, American Indian, and Mediterranean ancestry lack this enzyme. The frequency of deﬁciency is 10 to 15% among adults of northern and western European descent."
- id: murray-pizzorno-2012-encyclopedia
  location: Chapter 46 — Diarrhea, pg 871
  quote: "Acute intestinal illnesses, such as viral or bacterial intestinal infections, will frequently injure the cells that line the small intestine. This results in a temporary deﬁciency of lactase, the enzyme responsible for digesting milk sugar (lactose) from dairy products. Avoid dairy products (with the possible exception of yogurt with live cultures) while experiencing diarrhea."
