out_of_scope_notes: >
  A coach may take a careful intake history including every supplement, sweetener and over-the-counter antacid, and may notice the osmotic pattern and raise it. Assigning the diarrhoea to a type, and any work-up for tumours, IBD or infection, is clinician work.
sources:
- id: murray-pizzorno-2012-encyclopedia
  location: Chapter 46 — Diarrhea, pg 867
  quote: "Diarrhea is divided into four major types: osmotic, secretory, exudative, and inadequate-contact. Osmotic diarrhea is caused by an excess of water-soluble molecules in the stool, which results in increased ﬂuid retention. Secretory diarrhea results from excessive secretion of ions into the bowel, with the same result of excessive water retention in the stools."
- id: murray-pizzorno-2012-encyclopedia
  location: Chapter 46 — Diarrhea, pg 867
  quote: "Exudative diarrhea is usually due to infections and inﬂammatory bowel diseases, resulting in abnormal intestinal permeability and intestinal loss of serum proteins, blood, mucus, and pus."
