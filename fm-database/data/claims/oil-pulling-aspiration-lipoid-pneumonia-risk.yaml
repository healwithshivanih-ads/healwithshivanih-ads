slug: oil-pulling-aspiration-lipoid-pneumonia-risk
statement: >-
  Repeated oil pulling can cause exogenous lipoid pneumonia through aspiration. Two
  published cases involved sesame oil - a 66-year-old man practising nightly nasal
  oil washing for 8 months who "often aspirated the oil" and presented with dry
  cough requiring steroid pulse therapy and bronchoalveolar lavage, and a
  38-year-old woman practising morning mouth washing for 6 months who "would
  sometimes aspirate" and presented with shortness of breath, resolving on
  discontinuation alone. Both presented months after symptom onset.
evidence_tier: plausible_emerging
