slug: crh-skin-mast-cells-urticaria-psoriasis
statement: Under stress, skin mast cells and keratinocytes release more IL-6, CRH and cortisol. CRH-activated
  skin mast cells widen and leak blood vessels in urticaria, and mast cells beside psoriatic plaques carry
  CRH receptors that drive IL-6 into the lesion.
evidence_tier: plausible_emerging
rationale: Links stress flares in hives and psoriasis to a mechanism the client can work with.
coaching_translation: Your skin reacts to stress through the same immune cells that cause hives and flares,
  so calming your stress response can calm your skin.
out_of_scope_notes: ''
caveats:
- Konstantinou 2020 systematic review (urticaria); Marek-Jozefowicz 2022 and Wozniak 2021 (psoriasis,
  largely mechanistic).
