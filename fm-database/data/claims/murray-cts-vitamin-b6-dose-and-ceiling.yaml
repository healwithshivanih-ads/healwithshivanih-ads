out_of_scope_notes: >
  CLINICIAN: deciding whether to trial B6, choosing the dose, monitoring for pyridoxine
  neuropathy, ordering nerve conduction studies. COACH: explaining what the evidence does and
  does not show, supporting B6- and B2-rich food intake, tracking symptoms in a client log,
  and flagging any new or spreading numbness to the clinician immediately.
