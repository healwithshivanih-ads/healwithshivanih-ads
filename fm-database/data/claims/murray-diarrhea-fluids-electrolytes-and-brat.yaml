  quote: "With diarrhea, a person loses much water and a great deal of electrolytes, such as potassium, sodium, and chloride. It is important to replace these lost items. This replacement can be in the form of herbal teas, vegetable broths, fruit juices, and electrolyte replacement drinks."
- id: murray-pizzorno-2012-encyclopedia
  location: Chapter 46 — Diarrhea, pg 870
  quote: "During the acute phase of diarrhea, the focus should be on liquids and the BRAT diet. The components of this diet are bananas, white rice, apples, plain white toast or bread (consider bread made with rice ﬂour instead of wheat ﬂour), and tea. These foods are easy on the digestive system and tend to slow down the rhythmic contractions of the intestines."
