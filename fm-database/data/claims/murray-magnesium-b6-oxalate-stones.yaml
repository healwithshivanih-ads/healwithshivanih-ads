out_of_scope_notes: >
  Coach scope: educating on magnesium- and B6-rich foods and building them into meals within
  the client's oxalate constraints. Clinician scope: prescribing magnesium or B6, choosing
  form and dose, checking renal function before magnesium, and monitoring for B6 neuropathy.
  A coach must not interpret a serum or RBC magnesium result.
