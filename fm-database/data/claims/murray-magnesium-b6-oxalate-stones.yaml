  quote: Many patients with recurrent oxalate stones show laboratory signs of vitamin B6
    deficiency. As with magnesium, vitamin B6 deficiency also results in kidney stones.
    Supplemental vitamin B6 is known to reduce the production and urinary excretion of
    oxalates.25,26 Supplementing the diet with additional vitamin B6 is very important in
    preventing recurrent kidney stones.
