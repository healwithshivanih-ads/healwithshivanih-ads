slug: tirzepatide-withdrawal-regain-surmount4
statement: In SURMOUNT-4, after a 20.9% loss on tirzepatide, switching to placebo led to 14.0% weight regain over
  52 weeks, while continued tirzepatide produced a further 5.5% loss; only 16.6% on placebo kept at least 80% of
  their initial loss vs 89.5% on drug.
evidence_tier: strong
rationale: Double-blind randomised withdrawal RCT (n=670) in JAMA.
coaching_translation: With tirzepatide (Mounjaro, Zepbound), people switched to a dummy injection regained roughly
  half of what they had lost within a year.
caveats:
- Industry-funded.
- Excluded people with diabetes.
