slug: fmca-m3-foundation-session-strengths-vision-values
statement: 'The FMCA foundation session pattern uses three inputs: the Wheel of Life
  (surface areas needing attention), the VIA character-strengths survey (what''s right
  about the client), and a values exercise (what actually matters). Together they
  set up the vision and give the coach a strengths-and-values-based frame to return
  to whenever the client is stuck.'
evidence_tier: plausible_emerging
rationale: Coach-facing takeaway distilled from the live-call reflection; ready for
  use in briefings and sessions.
coaching_translation: Send all three exercises with the pre-work. In the foundation
  session, sit with the strengths and values before touching goals.
