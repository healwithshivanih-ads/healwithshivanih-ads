out_of_scope_notes: >
  Coach scope: designing and progressing a movement routine within the client's tolerance,
  behaviour change around consistency, and mind-body practices such as yoga, tai chi and
  breathing. Clinician scope: exercise clearance, assessing cardiac or bone safety, managing
  peripheral neuropathy or fatigue of unclear cause, and any interpretation of CD4 or viral load.
  Never use immune-marker language to motivate a client here.
