out_of_scope_notes: >
  Recommending or dosing grape seed extract for hypertension is clinician scope,
  particularly for a client already on antihypertensive medication where the
  effects are additive. A coach may explain the mechanism, may support every
  lifestyle lever that moves blood pressure further than this supplement does,
  and should surface the supplement to the treating doctor if a client has
  started it on their own.
sources:
- id: zhang-2016-grape-seed-extract-bp-meta-analysis
  location: Abstract — pooled results and subgroup analysis
  quote: >-
    Overall analyses found significant reductions for SBP and DBP after grape seed
    extract treatment (SBP -6.077 mmHg, DBP -2.803 mmHg). The beneficial impact was
    more obvious in younger or obese subjects, as well as in patients with metabolic
    disorders.
- id: asbaghi-2022-grape-seed-fmd-bp-meta-analysis
  location: Abstract — nineteen trials, primary endpoints
  quote: >-
    Grape seed extract supplementation significantly reduced diastolic blood pressure
    and heart rate but had no significant effects on flow-mediated dilation.
- id: nccih-grape-seed-extract-factsheet
  location: What the Science Says — Blood Pressure
  quote: >-
    A 2022 review showed the supplement reduced diastolic blood pressure (the lower
    number in a blood pressure reading) but not systolic blood pressure.
