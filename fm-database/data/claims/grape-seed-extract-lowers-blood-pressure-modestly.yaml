slug: grape-seed-extract-lowers-blood-pressure-modestly
statement: |
  Standardised grape seed extract (Vitis vinifera, oligomeric proanthocyanidins)
  produces a modest reduction in blood pressure across randomised trials, but the
  size of that reduction is genuinely disputed. The most-cited meta-analysis
  (16 trials, 810 subjects) reported -6.1 mmHg systolic and -2.8 mmHg diastolic,
  with larger effects in younger, obese, and metabolically disordered subjects.
  The largest and most rigorous meta-analysis (19 trials, with dose- and
  duration-response modelling) found a significant DIASTOLIC and heart-rate
  reduction but NO significant systolic effect — and, critically, no significant
  improvement in flow-mediated dilation. NCCIH's independent read agrees with the
  second: diastolic yes, systolic no. Typical effective doses in these trials sit
  between 150 and 400 mg/day over 8-16 weeks.
evidence_tier: plausible_emerging
rationale: >
  Multiple independent meta-analyses of RCTs agree on the DIRECTION of effect,
  which is why this is not tiered lower. It is not tiered "strong" because the
  three pooled estimates disagree by a factor of four on the systolic endpoint
  (-6.1 mmHg, -1.5 mmHg, and null), the constituent trials are small and
  heterogeneous in extract preparation, several are industry-linked, and the
  mechanistic endpoint that would corroborate the whole story — flow-mediated
  dilation, the direct measure of endothelial function — did NOT move in the
  best-powered analysis. A blood pressure number falls; the endothelial mechanism
  behind it remains asserted rather than demonstrated.
coaching_translation: >
  Grape seed extract nudges blood pressure down a little. Realistically that is a
  couple of points of diastolic pressure and possibly a few of systolic — worth
  having as one contributor alongside sodium, potassium, weight, sleep and
  movement, and not worth having INSTEAD of any of them. It is an add-on, never a
  substitute for an antihypertensive a doctor has prescribed, and a client should
  never reduce a BP medication because they have started it. The people most
  likely to see something are younger clients with metabolic risk rather than
  older clients with long-established hypertension.
caveats:
- The systolic effect may be zero — two of three pooled analyses could not find one.
- Flow-mediated dilation did not improve, so do not tell a client this "repairs
  their blood vessels" — that goes beyond the evidence.
- Effect builds over 8-16 weeks; nothing meaningful will show at 2 weeks.
- Standardisation matters and Indian retail proanthocyanidin products frequently
  under-deliver the labelled OPC percentage.
- Additive with antihypertensive medication — a client already on an ARB, CCB or
  beta-blocker should have their doctor aware, and should keep a home BP log.
