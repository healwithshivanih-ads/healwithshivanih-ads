slug: briden-hrm-alcohol-worst-for-perimenopause
statement: 'Alcohol is particularly unhelpful during perimenopause: lowers melatonin
  and worsens sleep, shrinks the hippocampus (HPA-axis regulator), damages the gut
  microbiome, activates mast cells and histamine, promotes intestinal permeability,
  stimulates female appetite, undermines muscle and bone building, and impairs estrogen
  metabolism (a risk factor for breast cancer). Even one drink/day significantly raises
  breast cancer risk. Briden puts the ceiling at 5 drinks/week for any woman; zero
  is safest with any family history of breast cancer.'
