  quote: Alcohol consumption increases uric acid production by accelerating purine nucleotide degradation and reduces uric acid excretion by increasing lactate production, which impairs kidney function. The net effect is a signiﬁcant increase in serum uric acid levels. This explains why alcohol consumption is often a precipitating factor in acute attacks of gout.
