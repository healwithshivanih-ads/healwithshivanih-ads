slug: classical-ayurveda-specifies-sesame-for-kavala
statement: >-
  The classical Ayurvedic texts specify SESAME oil (tila taila) for oil pulling,
  not coconut. Charaka Samhita describes kavala graha; Sushruta Samhita and
  Vagbhata's Ashtanga Hridaya describe both gandusha (holding) and kavala graha
  (swishing), the distinction being the quantity held rather than the oil used.
  Charaka attributes to sesame oil gargling - strength of the jaws, depth of
  voice, improved taste perception, prevention of throat dryness and cracked lips,
  prevention of dental caries, and the ability to chew hard foods. Coconut is a
  regional South Indian and pitta-appropriate choice, not the textual
  prescription.
