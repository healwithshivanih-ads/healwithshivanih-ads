coaching_translation: >-
  Traditional oil pulling means sesame oil. Coconut is a southern regional variant
  with better modern trial data behind it.
rationale: >-
  Recorded specifically to prevent a credibility error. The strongest argument
  against the sunflower-oil trials is NOT that "Ayurveda specifies coconut" -
  because it does not - but that sunflower oil is a twentieth-century industrial
  seed oil with no traditional basis at all, and that the one head-to-head trial
  puts coconut ahead of it. Argue for coconut from the trial data; argue against
  sunflower from both. An Ayurvedic practitioner will correct the first framing.
