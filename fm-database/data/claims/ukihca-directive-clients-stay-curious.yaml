slug: ukihca-directive-clients-stay-curious
statement: When a client wants a 'prescription' — a specific diet, plan, supplement
  — the coach's move is to stay curious rather than prescriptive. Explore what has
  worked before, educate on the basics (like a core food plan), and refer to a nutritionist
  or clinician for specific plans while continuing to help the client implement whatever
  is chosen.
