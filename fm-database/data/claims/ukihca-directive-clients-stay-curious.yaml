slug: ukihca-directive-clients-stay-curious
statement: With clients who want a prescription, stay curious not prescriptive — explore
  what has worked for them, educate on basics (like the Core Food Plan), refer to
  a nutritionist for specifics while I help them implement. Ask how they learn and
  what their barriers are.
