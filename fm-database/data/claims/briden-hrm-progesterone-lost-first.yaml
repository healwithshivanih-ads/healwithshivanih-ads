slug: briden-hrm-progesterone-lost-first
statement: In perimenopause, progesterone drops years before estrogen does — because
  ovulation becomes intermittent (anovulatory cycles) while estrogen production continues.
  This asymmetry drives the classic 'high-estrogen / low-progesterone' pattern responsible
  for perimenopausal migraines, heavy periods, breast pain, insomnia and mood swings.
