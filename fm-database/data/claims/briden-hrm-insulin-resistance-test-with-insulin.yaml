slug: briden-hrm-insulin-resistance-test-with-insulin
statement: 'Insulin resistance affects ~1 in 2 midlife women and cannot be ruled out
  by a normal glucose test. The correct test is a fasting insulin OR a glucose tolerance
  test WITH insulin at fasting, 1h and 2h intervals. Optimal: fasting insulin <10
  mIU/L (60 pmol/L); 1h and 2h insulin <60 mIU/L (410 pmol/L). Doctors often only
  order glucose — coach must brief the client to specifically request insulin.'
evidence_tier: strong
