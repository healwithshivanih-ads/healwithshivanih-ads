sources:
- id: ask-expert-perimenopause-menopause-elyaman
  location: Q&A — osteoporosis and testosterone dosing question
  quote: If you look at what most people are giving women for pellets... they're
    giving them 150 to 200 milligrams and they're never checking levels. I start
    people at 25, which is such a tiny tiny amount enough to help with symptoms,
    but we're watching for symptoms. We're watching levels.
