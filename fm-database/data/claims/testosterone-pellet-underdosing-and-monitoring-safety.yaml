slug: testosterone-pellet-underdosing-and-monitoring-safety
statement: Widely-used testosterone pellet dosing for women (150-200 mg) is often
  given without checking follow-up levels; a more conservative starting dose (e.g.,
  around 25 mg) with symptom and level monitoring is used clinically to avoid supraphysiologic
  testosterone exposure.
evidence_tier: fm_specific_thin
rationale: This is the speaker's own clinical dosing practice, contrasted against
  what he describes as common pellet-therapy practice; no comparative dosing-safety
  trial is cited, so captured as fm_specific_thin.
coaching_translation: If a client is considering testosterone pellet therapy, encourage
  her to ask her prescriber what dose is being used and whether follow-up levels
  will be checked — dosing and monitoring are prescribing decisions, not something
  a coach evaluates.
caveats:
- Speaker's dosing figures reflect his own clinical practice, not a published dosing-safety
  trial.
