slug: fmca-m2-six-stages-of-change
statement: 'Prochaska''s Transtheoretical Model describes six stages: Pre-contemplation,
  Contemplation, Preparation, Action, Maintenance, and Recycle (or Termination). Clients
  move through them in a spiral — relapse and recycling are normal and not failure.
  Assess the client''s stage every visit.'
evidence_tier: strong
rationale: Coach-facing takeaway distilled from the live-call reflection; ready for
  use in briefings and sessions.
coaching_translation: 'Different language for each stage. Pre-contemplation: raise
  awareness gently. Preparation: co-create the plan. Action: track and celebrate.'
