out_of_scope_notes: 'Coach scope: coaching a lower-saturated-fat, more omega-3-oriented eating pattern
  as general health behaviour, plus habit design, shopping and cooking support, and honest framing of
  the evidence. Out of scope: presenting the Swank diet as MS treatment, prescribing it as a therapeutic
  protocol, or supervising a restrictive diet in someone with progressive disability or nutritional risk
  - that needs a dietitian and the neurology team.'
