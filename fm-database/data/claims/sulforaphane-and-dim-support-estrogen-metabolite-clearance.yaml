slug: sulforaphane-and-dim-support-estrogen-metabolite-clearance
statement: For elevated estrogen, sulforaphane (from broccoli/cruciferous sources)
  supports phase 2 liver detoxification and may lower estrone; DIM (diindolylmethane)
  is used when urine estrogen metabolite testing shows an unfavorable 4-hydroxy
  pathway pattern, to help shift metabolism toward the more favorable 2-hydroxy
  pathway.
evidence_tier: fm_specific_thin
rationale: Sulforaphane's role in phase 2 conjugation and DIM's effect on estrogen
  hydroxylation pathway ratios are established in FM/nutrigenomics literature; the
  speaker presents both as personal clinical pearls ('what I've picked up over the
  years') rather than citing specific trials, so this is captured as fm_specific_thin
  alongside the stronger dedicated sourcing already present elsewhere in the catalogue.
coaching_translation: These are supplement and testing decisions for the client's
  prescribing provider — a coach's role is supporting the cruciferous-vegetable-rich,
  fibre-rich diet that feeds the same phase 2 detox pathway sulforaphane supports.
caveats:
- Speaker frames both as personal clinical pattern-recognition, not cited trial
  evidence.
- Urine estrogen metabolite (2-OH vs 4-OH pathway) testing and DIM dosing are clinician-directed.
