slug: fmca-coach-carries-plan-between-visits
statement: A coach embedded in an FM practice carries the protocol between visits
  — supplement adherence, food-plan translation, movement habits, sleep hygiene. Compliance
  lives in the gap between visits, not in the visit itself.
evidence_tier: plausible_emerging
