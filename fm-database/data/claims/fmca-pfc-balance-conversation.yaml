slug: fmca-pfc-balance-conversation
statement: Coaches can teach the concept of protein-fat-carb balance (blood-sugar
  stability, satiety, satisfaction) without prescribing macros. Specific gram targets
  are a nutritionist's or physician's domain; the coach's craft is helping the client
  notice how balance feels.
