out_of_scope_notes: >-
  Coach scope: withholding a discretionary food during pregnancy and saying why.
  Clinician scope: everything about managing a pregnancy, and any advice to a
  client who has already been taking halim while pregnant — that is a
  reassurance-and-assessment conversation for her doctor, not the coach.
