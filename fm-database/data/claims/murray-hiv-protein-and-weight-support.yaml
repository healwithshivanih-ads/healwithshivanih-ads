out_of_scope_notes: >
  Coach scope: helping a client eat enough, spreading protein across the day, practical
  food-first strategies for a poor appetite, and monitoring weight as a shared tracking habit.
  Clinician scope: diagnosing the cause of weight loss, deciding whether ART is working,
  investigating opportunistic infection or malignancy, prescribing medical nutrition therapy or
  appetite stimulants, and setting protein targets where organ function is impaired. Escalate,
  do not manage, unexplained weight loss.
