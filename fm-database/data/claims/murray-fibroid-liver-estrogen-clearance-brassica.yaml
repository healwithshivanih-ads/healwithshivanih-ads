out_of_scope_notes: >
  A coach may teach the liver–gut oestrogen-clearance story and encourage daily cruciferous
  vegetables as food. Recommending I3C, DIM, SAMe or a lipotropic formula at a dose, or
  interpreting oestrogen-metabolite testing (DUTCH, 2:16 ratio), is clinician scope.
