slug: murray-delayed-igg-igg4-food-reactions
statement: |
  Murray & Pizzorno separate immediate from delayed food reactions by antibody
  class. IgE drives the classic immediate (type I) reaction; IgG, IgG4, IgM and
  IgA are held to drive delayed reactions, including the cyclical pattern that
  comes and goes. Type III immune-complex reactions are described as occurring more
  than two hours — and sometimes days — after exposure, and the authors estimate
  that 80% of food allergy reactions involve IgG and IgG4. They further argue that
  IgG4, once thought to be a protective blocking antibody, is itself involved in
  producing allergic symptoms. This delayed timeframe is the practical reason food
  reactions are so often missed: the client does not connect Tuesday's bloating to
  Sunday's meal.
evidence_tier: fm_specific_thin
rationale: >
  The delayed-reaction concept is genuinely useful clinically, and non-IgE-mediated
  food reactions unquestionably exist. But the specific claims here are contested
  and should not be presented to a client as settled. The 80% figure is given
  without a citation in this chapter. More importantly, the book's reading of IgG4
  runs directly against the mainstream immunological position, which treats
  food-specific IgG and IgG4 as markers of normal exposure and developing oral
  tolerance rather than of pathology — the major allergy societies (EAACI, AAAAI)
  advise against IgG/IgG4 food panels for diagnosing food sensitivity for exactly
  this reason. The chapter cites older asthma work to argue the opposite. Tiered
  fm_specific_thin: the pattern is worth knowing, the antibody attribution is not
  safe to assert.
coaching_translation: >
  Not every food reaction happens straight away. The obvious kind — hives within
  minutes of eating peanut — is only a small slice. Far more often the reaction is
  delayed, showing up hours or even a day or two later as bloating, headache,
  joint ache, brain fog or a skin flare. That delay is exactly why people cannot
  spot their own trigger: the timing does not line up in their head. It is also
  why a symptom-and-food diary over two to three weeks tells us more than any
  guess. Be careful with the blood panels that claim to measure this — see the
  separate note on testing.
caveats:
- Do not tell a client that a positive IgG or IgG4 food panel proves a food is
  harming them. Elevated food IgG frequently just reflects that they eat that
  food, and allergy societies advise against these panels for diagnosis.
- Delayed symptoms have many non-food causes — infection, stress, sleep loss,
  medication, hormonal cycling — so a diary shows association, never causation.
- The book's own preferred route to confirmation is elimination and rechallenge,
  not antibody measurement; keep the diagnostic weight there.
- Coeliac disease and IgE allergy must be excluded by a clinician before a
  reaction is filed under "delayed sensitivity".
