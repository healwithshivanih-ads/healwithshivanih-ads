out_of_scope_notes: >
  A coach may explain that reactions can be delayed and may help a client keep a
  food-and-symptom diary. A coach may NOT order, interpret, or act on IgG/IgG4
  food panels, or tell a client which antibody class is driving their symptoms —
  that is lab interpretation and diagnosis. Immediate IgE reactions (swelling,
  wheeze, collapse) are an emergency and belong entirely to a clinician.
