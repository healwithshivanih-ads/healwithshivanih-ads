    One of the key advantages of the ELISA over other laboratory methods is its ability to measure IgG4 antibodies. This subclass of antibody was initially thought to act as a blocking antibody, thereby exerting protective effects against allergy. However, it is now established that IgG4 antibodies are actually involved in producing allergic symptoms.
