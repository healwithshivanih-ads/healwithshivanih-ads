  quote: "Viruses are the most common cause of infectious diarrhea, accounting for at least 75% of cases. Viruses are suspected when vomiting is prominent, the incubation period is longer than 14 hours, and the entire illness is over in less than 72 hours."
- id: murray-pizzorno-2012-encyclopedia
  location: Chapter 46 — Diarrhea, pg 867
  quote: "A virus is likely to be the cause if there are no warning signs of bacterial infection (such as high fever, bloody diarrhea, severe abdominal pain, or more than six stools in 24 hours) and there are no epidemiological clues from the history (i.e., travel, sexual contact, antibiotic use)."
