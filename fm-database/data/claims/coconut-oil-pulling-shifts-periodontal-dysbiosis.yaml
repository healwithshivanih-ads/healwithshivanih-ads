caveats:
- >-
    n=10 per arm, single centre; the authors flag sample size as the main
    limitation. Captured from the open-access record rather than full methods.
    Alpha diversity was relatively stable and beta-diversity treatment effects were
    minimal - the finding is a shift in specific taxa and in the dysbiosis index,
    not a wholesale community restructuring. Applies to COCONUT oil in DISEASED
    mouths over a month; do not extend to other oils (see
    sunflower-oil-pulling-shows-no-compositional-shift) or to a single session.
coaching_translation: >-
  Coconut oil pulling appears to move the mouth's bacterial balance in the right
  direction - fewer of the organisms that damage gums, more of the helpful ones -
  rather than simply killing everything indiscriminately. Daily practice, as an
  addition to brushing and dental care, never a replacement.
rationale: >-
  This is the claim that licenses recommending oil pulling for oral dysbiosis
  rather than only for gum comfort. Note the Veillonella and Actinomyces increase
  - those are the nitrate-reducing genera chlorhexidine destroys, which is why
  coconut oil is preferable to an antiseptic rinse in hypertensive clients.
