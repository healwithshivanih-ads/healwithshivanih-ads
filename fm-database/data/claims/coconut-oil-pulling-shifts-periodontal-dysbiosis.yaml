slug: coconut-oil-pulling-shifts-periodontal-dysbiosis
statement: >-
  In a triple-blind randomised trial in stage II-III periodontitis (n=30; coconut
  oil vs 0.12% chlorhexidine vs placebo, one month plus non-surgical periodontal
  therapy), coconut oil pulling produced a directional shift in oral microbial
  COMPOSITION, not merely a drop in bacterial load. Red-complex pathogens
  Tannerella forsythia and Treponema denticola fell, along with Treponema
  socranskii, T. maltophilum, Olsenella uli and the families Spirochaetaceae and
  Tannerellaceae, while commensal Streptococcus, Actinomyces, Veillonella and
  Gemella rose. The subgingival microbial dysbiosis index improved significantly
  versus placebo.
evidence_tier: plausible_emerging
