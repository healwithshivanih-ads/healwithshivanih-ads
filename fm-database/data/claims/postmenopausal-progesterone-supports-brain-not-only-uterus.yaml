  location: Progesterone prescribing segment
  quote: Even if they don't have a uterus, in conventional medicine, if you don't
    have a uterus, they say you don't need progesterone because you don't have a
    uterus. In functional medicine, we say your brain is important and progesterone
    is needed for the brain. So we're going to put you on progesterone as well.
