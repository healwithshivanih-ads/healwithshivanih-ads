out_of_scope_notes: >
  Diagnosing and treating iron deficiency is clinician scope. Supplement and meal
  TIMING is squarely coaching scope and is where this claim earns its keep — a
  coach can and should space polyphenol extracts, tea and coffee away from iron,
  without needing anyone's sign-off.
