slug: same-food-different-glucose-response-by-phase
statement: The same food eaten by the same person can produce a well-controlled glucose
  response in the follicular phase and a poorly controlled one in the luteal phase.
evidence_tier: plausible_emerging
rationale: Luteal progesterone lowers insulin sensitivity while follicular estrogen
  raises it, so the metabolic context of an identical meal differs by phase.
coaching_translation: A food that suits you in week two may not suit you in week four
  — pair it with protein or fibre then, rather than dropping it.
