slug: briden-hrm-progesterone-alone-for-perimenopause
statement: 'For perimenopausal symptoms driven by high-estrogen/low-progesterone (heavy
  periods, night sweats, insomnia, migraines, mood, breast pain), progesterone-alone
  (100–200 mg oral micronised progesterone at bedtime, or cream for milder symptoms)
  is often the better treatment than adding more estrogen — because the client already
  has too much estrogen. Prof Prior''s protocols support this; most GPs will only
  know Prometrium/Utrogestan as a companion to estrogen. Coach''s role: educate client
  to bring Prior''s published papers to the GP appointment.'
evidence_tier: strong
