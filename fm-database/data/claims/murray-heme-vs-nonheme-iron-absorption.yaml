  quote: >-
    The absorption rate of non-heme iron, which is the kind found in plant food and in
    supplements such as ferrous sulfate and ferrous fumarate, is 2.9% on an empty stomach and
    0.9% with food, much less than the absorption rate of heme iron, which is as high as 35%.
    In addition, heme iron is without the side effects associated with non-heme sources of
    iron, such as nausea, ﬂatulence, constipation, and diarrhea.
