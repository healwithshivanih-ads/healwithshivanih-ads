out_of_scope_notes: >
  Coach scope: teaching the difference between animal-source and plant-source iron, and
  helping the client build meals that make plant iron more available. Clinician scope:
  deciding whether a client needs iron at all, which salt, at what dose, and monitoring the
  response. The coach must not translate "plant iron absorbs poorly" into a supplement
  recommendation.
