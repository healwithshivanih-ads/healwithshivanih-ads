slug: briden-hrm-magnesium-plus-taurine-basic-plan
statement: 'Briden''s ''basic action plan'' for the brain symptoms of perimenopause:
  magnesium (300 mg glycinate) + taurine (3 g) at bedtime, plus reversing insulin
  resistance, plus quitting alcohol, plus moving/building muscle. Approximately half
  of Briden''s hot-flush patients need nothing more than magnesium + taurine to see
  meaningful relief. Taurine calms GABA receptors and supports mitochondrial energy
  metabolism.'
