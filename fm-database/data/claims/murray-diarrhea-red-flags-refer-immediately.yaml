out_of_scope_notes: >
  Recognising and escalating red flags is squarely within coach scope and is arguably the coach's single most important contribution here. Determining the cause, ordering or reading stool studies, and prescribing antimicrobials or antimotility drugs are clinician-only.
sources:
- id: murray-pizzorno-2012-encyclopedia
  location: Chapter 46 — Diarrhea, pg 878
  quote: "• Diarrhea in a child under six years of age • Severe or bloody diarrhea • Diarrhea that lasts more than three days • Signiﬁcant signs of dehydration (sunken eyes, severe dry mouth, strong body odor, etc.) After identiﬁcation of the cause of chronic diarrhea, appropriate treatment can be determined with the help of a physician."
- id: murray-pizzorno-2012-encyclopedia
  location: Chapter 46 — Diarrhea, pg 868
  quote: "Since most causes of acute diarrhea, such as mild infections due to food poisoning or viral gastroenteritis, are self-limiting and will resolve on their own, only some general recommendations may be needed. If the diarrhea is severe or bloody, or if it involves a child under the age of six years, contact a physician immediately. A physician should also be consulted if any diarrhea lasts for more than three days."
