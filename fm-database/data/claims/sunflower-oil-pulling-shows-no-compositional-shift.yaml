slug: sunflower-oil-pulling-shows-no-compositional-shift
statement: >-
  A single 15-minute session of SUNFLOWER oil pulling in 3 healthy volunteers
  reduced total oral microbial burden by 78-92% by colony count, but the microbiota
  was restored within about 24 hours and composition did not meaningfully change.
  Removal was indiscriminate across taxa regardless of morphology, cell wall
  structure or oxygen tolerance; the authors describe the mechanism as an "oral
  massage" that enwraps epithelial cells carrying bacteria in oil vesicles, with no
  preference for particular bacteria.
evidence_tier: fm_specific_thin
