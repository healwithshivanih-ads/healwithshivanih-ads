- id: oil-pulling-oral-microbiome-16s-pilot-2021
  location: 16S rDNA next-generation sequencing plus culture, saline control
caveats:
- >-
    READ NARROWLY. n=3, healthy mouths, ONE session, sunflower oil - an industrial
    seed oil with no traditional basis in oil pulling. This result is valid about
    sunflower oil and silent about coconut, which produced the opposite finding in
    diseased mouths over a month (see
    coconut-oil-pulling-shifts-periodontal-dysbiosis). It is frequently cited as
    proof that "oil pulling does nothing to the microbiome" - that generalisation is
    not supported. The transience finding is separately useful and probably does
    generalise - it is why the practice must be DAILY.
coaching_translation: >-
  Rinsing lowers the total bacteria in the mouth sharply but they return within a
  day - which is why oil pulling is a daily habit, not an occasional one. Sunflower
  oil in particular showed no useful selectivity and should not be used.
rationale: >-
  Recorded deliberately as the counter-evidence so it is not rediscovered later as
  a refutation. The oil-specificity distinction here is the same failure mode as
  the millet cautions - a generic entry warned hardest about the mildest species;
  a generic "oil pulling" entry lets the wrong oil discredit the right one.
