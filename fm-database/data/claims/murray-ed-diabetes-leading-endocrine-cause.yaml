out_of_scope_notes: >
  Coach scope: supporting the eating pattern, activity, sleep and weight work that
  improves glycaemic control, and encouraging screening. Clinician scope: diagnosing
  diabetes, interpreting glucose and HbA1c, managing medication, and diagnosing
  neuropathy.
sources:
- id: murray-pizzorno-2012-encyclopedia
  location: Chapter 49 — Erectile Dysfunction, pg 905
  quote: |-
    There are various endocrine and hormonal disorders that can lead to erectile dysfunction. The most common of these disorders is diabetes. Individuals with diabetes are at higher risk for atherosclerosis and nerve damage, both of which can cause ED.
