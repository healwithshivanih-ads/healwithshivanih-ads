slug: postpartum-ovulation-precedes-return-of-periods
statement: After birth, prolactin suppresses cycling for anywhere from about eight
  weeks to two years, and ovulation returns before the first period — so waiting for
  a period to reappear is waiting for the second event, not the first.
evidence_tier: plausible_emerging
rationale: A period is the withdrawal bleed that follows an ovulatory cycle, so the
  ovulation that produces it necessarily comes first.
coaching_translation: Your fertility can return before your first postpartum period
  does.
