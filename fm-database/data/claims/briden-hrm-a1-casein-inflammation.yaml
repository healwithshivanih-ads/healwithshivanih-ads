slug: briden-hrm-a1-casein-inflammation
statement: About 1 in 3 people cannot tolerate A1 beta-casein (found in Holstein cow
  milk) — an enzyme converts it to inflammatory peptide BCM-7. Presents as heavy periods,
  PMS mood, period pain, digestive bloating, chronic sinus/tonsillitis history. A2
  dairy (goat, sheep, jersey cow) plus low-casein products (butter, ghee, ricotta,
  whey) are usually fine. A dairy-free (A1-free) trial for 2 months is Briden's most-cited
  single dietary intervention for heavy bleeding and mood.
