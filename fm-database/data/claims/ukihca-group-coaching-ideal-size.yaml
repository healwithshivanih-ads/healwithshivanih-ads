slug: ukihca-group-coaching-ideal-size
statement: Ideal group is 8–12; larger groups get unruly. Break into breakout groups
  of ~5 so people actually connect. Bring 1:1 tools into the room — active listening
  to the whole group, prompts and journaling, check-ins, accountability. Always leave
  time at the end for each person's key takeaway.
