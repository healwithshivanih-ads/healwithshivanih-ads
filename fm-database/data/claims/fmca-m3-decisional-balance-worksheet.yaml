slug: fmca-m3-decisional-balance-worksheet
statement: The Decisional Balance worksheet — a classic MI/Stages-of-Change tool —
  helps clients surface their own ambivalence by listing the pros and cons of changing
  versus not changing. Especially useful when the client has competing goals or has
  been stuck in Contemplation.
evidence_tier: strong
rationale: Coach-facing takeaway distilled from the live-call reflection; ready for
  use in briefings and sessions.
coaching_translation: Offer it when the client keeps circling. Fill it in together
  in the session; hand them the worksheet to sit with.
