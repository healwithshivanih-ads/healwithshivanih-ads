out_of_scope_notes: 'Coach scope: food-first omega-3 education, cooking-oil coaching, flagging evening
  primrose oil for the clinician to review, and adherence support for a clinician-set supplement. Out
  of scope: recommending a fish-oil or algae-oil dose, advising on it alongside anticoagulants, or presenting
  omega-3 as disease-modifying.'
