slug: ukihca-visioning-loosen-the-question
statement: When a client is overwhelmed or feels 'too old' to dream, the literal 'what
  is your vision?' closes them down. Loosen with playful prompts — 'if you had an
  extra hour', 'if everything on your wheel of life was a 10' — and let vision evolve
  across sessions.
