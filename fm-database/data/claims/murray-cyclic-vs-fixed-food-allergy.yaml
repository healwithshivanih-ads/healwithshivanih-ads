slug: murray-cyclic-vs-fixed-food-allergy
statement: |
  Murray & Pizzorno divide adverse food reactions into two clinically distinct
  patterns. Cyclical (cyclic) allergies build up slowly through repeated eating of
  the same food; if that food is avoided for a period — typically more than four
  months — it can often be reintroduced and tolerated, provided it is not eaten too
  frequently again. Fixed allergies react every single time the food is eaten,
  regardless of how long the gap between exposures, and the person stays reactive
  for life. The book puts cyclic reactions at 80 to 90% of all food allergies,
  which is why most people who react to a food are not permanently barred from it.
evidence_tier: fm_specific_thin
rationale: >
  The cyclic/fixed distinction is a naturopathic and nutrition-medicine clinical
  framework, described by the authors as what "naturopathic and other
  nutrition-oriented physicians recognize" rather than as a validated
  immunological taxonomy. The 80-90% figure is presented without a supporting
  citation in this chapter. Mechanistically it is at least coherent — true
  IgE-mediated allergy (roughly 10-15% of food reactions per the same chapter) is
  the population that behaves like a "fixed" allergy, while dose- and
  frequency-dependent non-IgE reactions plausibly wax and wane. But the specific
  four-month avoidance window and the 80-90% split are clinical convention, not
  trial-derived numbers, so this is tiered fm_specific_thin.
coaching_translation: >
  Most food reactions are not a life sentence. There are two patterns. The common
  one builds up because you have been eating the same thing very often — take it
  out for several months, then bring it back occasionally, and many people are
  fine. The less common one reacts every single time no matter how long you leave
  it, and that food usually has to stay out for good. This matters for how we
  plan: I do not want you cutting out roti or curd forever if we do not have to.
  Which pattern you have is something we watch over months, not something we
  decide in one session.
caveats:
- A clinician must first exclude celiac disease, IgE food allergy, and other
  organic GI disease before anything is labelled a "cyclic" reaction and
  re-challenged.
- If a food has ever caused lip/throat swelling, wheeze, or collapse, treat it as
  fixed and never re-challenge it outside medical supervision — the cyclic/fixed
  frame does not apply to anaphylaxis.
- The four-month figure is a clinical rule of thumb, not a tested interval.
- In an Indian vegetarian diet the "eaten too frequently" trap is structural —
  wheat, curd and dal appear at nearly every meal — so the cyclic pattern may be
  commoner and harder to unwind here than the book's Western picture suggests.
