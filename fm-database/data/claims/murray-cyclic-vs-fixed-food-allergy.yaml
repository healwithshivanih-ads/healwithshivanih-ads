  location: Chapter 52 — Food Allergy, pg 941
  quote: |-
    Cyclical allergies develop slowly through repeated eating of a food. If the allergenic food is avoided for a period of time (typically more than four months), it may be reintroduced and tolerated unless it is again eaten too frequently. Cyclic allergies account for 80 to 90% of food allergies. Fixed allergies occur whenever a food is eaten, no matter what the time span is between episodes of ingestion.
