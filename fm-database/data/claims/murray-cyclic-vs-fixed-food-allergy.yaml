out_of_scope_notes: >
  Coach scope: educating a client on why a food was removed and why it may return
  later; supporting the practical side of a planned reintroduction. Out of scope:
  deciding that a reaction is "cyclic" rather than "fixed", and re-challenging any
  food in a client with a history of anaphylaxis or airway involvement — that is
  emergency/clinician territory and requires a supervised setting.
