  location: Abstract — design and results
  quote: >-
    Fifty patients with idiopathic fibromyalgia were included: 26 in the Pycnogenol group
    and 24 served as controls. All subjects were otherwise healthy women (BMI<26), not
    using any drug. Pycnogenol supplementation was used at the dose of 150 mg/day
    (4 weeks).
