  quote: Here we show that MucT led to lower body weight regain versus placebo at the end of the
    weight maintenance period (MucT - 1.2 +/- 0.7 kg, placebo - 3.2 +/- 0.4 kg, P = 0.012).
    Additionally, the MucT group had a greater net weight loss from baseline to end of maintenance
    than the placebo group (3.1 +/- 0.7 kg, P = 0.009).
