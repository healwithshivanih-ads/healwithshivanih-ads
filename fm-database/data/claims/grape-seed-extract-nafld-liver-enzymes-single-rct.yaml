out_of_scope_notes: >
  Fatty liver is a medical diagnosis and its management, including any
  supplement, is clinician scope. Everything that actually works for it —
  visceral fat loss, fructose and refined-carbohydrate reduction, alcohol
  reduction, post-meal movement — is in coaching scope, and should be where the
  conversation goes.
