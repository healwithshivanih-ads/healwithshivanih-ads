slug: ukihca-establish-credibility-once
statement: The coach establishes credibility in the foundation session and then stops
  selling — sometimes clients need to discover for themselves that the coach is a
  professional. Coaching friends and family is genuinely hard because the professional
  boundary is blurred; medical decisions always stay with the clinician, and collaboration
  keeps the weight off the coach's shoulders alone.
evidence_tier: plausible_emerging
rationale: Coach-facing takeaway distilled from the live-call reflection; ready for
  use in briefings and sessions.
