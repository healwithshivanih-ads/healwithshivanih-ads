slug: ukihca-group-size-8-to-12
statement: Ideal group-coaching size is around 8-12 people. Larger groups get unruly;
  breaking into small breakout groups (~5) lets people actually connect. The real
  skill is bringing one-to-one tools into the group — active listening to the whole
  room, prompts and journaling, check-ins and accountability — and always leaving
  time at the end for each person's key takeaway so the learning doesn't evaporate.
evidence_tier: plausible_emerging
rationale: Coach-facing takeaway distilled from the live-call reflection; ready for
  use in briefings and sessions.
coaching_translation: Design groups for 8-12. Above 12, split into breakouts of 5.
  Never end a group without individual takeaway time.
