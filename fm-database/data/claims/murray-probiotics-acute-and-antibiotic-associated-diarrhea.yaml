out_of_scope_notes: >
  Educating a client that a probiotic alongside a prescribed antibiotic course reduces diarrhoea risk, and helping them build the habit, is in coach scope. Selecting a strain and dose to treat an active C. difficile infection, or advising anything in an immunocompromised client, is clinician-only.
sources:
- id: murray-pizzorno-2012-encyclopedia
  location: Chapter 46 — Diarrhea, pg 872
  quote: "There is absolutely no question that probiotic supplementation shortens the duration of acute infectious diarrhea and reduces stool frequency, as numerous clinical studies now document this beneﬁt. Probiotic supplementation is especially important in helping children susceptible to infectious diarrhea."
- id: murray-pizzorno-2012-encyclopedia
  location: Chapter 46 — Diarrhea, pg 872
  quote: "For example, in one double-blind study of 740 patients undergoing cataract surgery, the patients were given an antibiotic containing ampicillin (250 mg) and cloxacillin (250 mg) and either a placebo or a probiotic supplement. The incidence of diarrhea in patients receiving the antibiotic alone was 13.3% compared with 0% in patients receiving the antibiotic with the probiotic."
- id: murray-pizzorno-2012-encyclopedia
  location: Chapter 46 — Diarrhea, pg 874
  quote: "We recommend a dosage of at least 15 billion to 20 billion organisms during antibiotic therapy; leave as much time as possible between the dose of antibiotic and the probiotic supplement. If pseudomembranous enterocolitis develops, in addition to Lactobacillus and Biﬁdobacter species we also recommend supplementing with Saccharomyces boulardi (also known as S. cerevisiae), a nonpathogenic probiotic yeast"
