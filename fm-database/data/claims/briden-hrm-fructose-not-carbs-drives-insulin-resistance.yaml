slug: briden-hrm-fructose-not-carbs-drives-insulin-resistance
statement: 'The main dietary driver of insulin resistance is not overall carbohydrate
  but high-dose fructose from soft drinks, fruit juice, desserts, sweetened yoghurts,
  dried fruit and breakfast cereals. High-dose fructose promotes insulin resistance
  via intestinal permeability, oxidative stress, inflammation and fatty liver. Low-dose
  fructose from whole fruit is fine and often beneficial (paired with fibre and polyphenols).
  Practical implication: cut sweet drinks and dessert-type foods, keep whole fruit.'
evidence_tier: strong
