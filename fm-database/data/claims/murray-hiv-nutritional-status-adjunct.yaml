out_of_scope_notes: >
  Coach scope: education about food quality and adequacy, meal planning, cooking skills, budgeting
  and food access, appetite and routine, and supporting the client's own adherence goals.
  Clinician scope only: HIV testing, diagnosis and staging, all antiretroviral decisions,
  interpreting CD4 counts or viral load, ordering or interpreting nutrient labs, and setting
  supplement doses. A coach must never do or say anything that could reduce a client's adherence
  to antiretroviral therapy — if a client raises doubts about their medication, the response is to
  refer them back to their HIV clinician, not to explore alternatives.
