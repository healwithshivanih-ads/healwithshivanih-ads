slug: mindfulness-cbt-ibs-quality-of-life
statement: Mindfulness-based cognitive therapy and meditation-plus-yoga programmes reduced symptoms and
  improved quality of life in randomised trials of people with IBS.
evidence_tier: strong
rationale: Supports gut-directed mind-body work for IBS clients, including those with a mast-cell picture.
coaching_translation: Mindfulness and gentle yoga have been shown in trials to ease IBS symptoms, and
  they're things you can do at home.
out_of_scope_notes: ''
caveats:
- Henrich 2020 (women, MBCT RCT); D'Silva 2023 (meditation and yoga RCT).
