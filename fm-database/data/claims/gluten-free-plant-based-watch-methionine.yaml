slug: gluten-free-plant-based-watch-methionine
statement: A diet that is both gluten-free (or grain-free) and fully plant-based can run low in methionine,
  which methylation depends on; anyone combining the two needs deliberate attention to protein quality.
evidence_tier: fm_specific_thin
rationale: Directly relevant to vegetarian and Jain clients asked to drop wheat. Pair dals with rice/millets,
  include dairy where allowed, and watch homocysteine.
coaching_translation: If you're vegetarian and also cutting out wheat, we'll make sure you still get enough
  good-quality protein from dals, dairy, nuts and seeds.
out_of_scope_notes: ''
caveats:
- 'Plotnikoff states there is ''no methionine'' in such a diet, which is an overstatement: legumes, nuts
  and seeds supply it, though pulses are relatively low. Kept as a prompt to check protein adequacy, not
  as fact.'
