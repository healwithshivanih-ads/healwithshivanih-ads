slug: briden-hrm-prior-diagnostic-nine-symptoms
statement: 'Prof Jerilynn Prior''s diagnostic criteria: a woman over 35 with regular
  cycles is likely in perimenopause if she has 3+ of nine changes — new-onset heavy/longer
  flow, cycles ≤25 days, sore/swollen/lumpy breasts, mid-sleep waking, increased cramps,
  new premenstrual night sweats, new/increased migraines, new/increased premenstrual
  mood swings, weight gain without diet/exercise change.'
evidence_tier: strong
