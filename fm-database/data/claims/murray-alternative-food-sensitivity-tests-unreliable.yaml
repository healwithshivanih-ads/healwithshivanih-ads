out_of_scope_notes: >
  A coach may explain, factually and without disparaging a named practitioner,
  that these methods lack evidence, and may decline to build a plan on their
  output. A coach may not order tests, interpret lab results, or tell a client
  their existing diagnosis is wrong. If a client wants testing, the referral is to
  a physician or allergist.
sources:
- id: murray-pizzorno-2012-encyclopedia
  location: Chapter 52 — Food Allergy, pg 944
  quote: |-
    Energetic methods of food sensitivity testing (electroacupuncture according to Voll, Vega testing, Carroll testing, applied kinesiology, electrodermal screening, and bioresonance therapy), cytotoxic food allergy testing, and Nambudripad’s allergy elimination techniques (NAET) are some of the ways alternative medicine practitioners test for food sensitivities or intolerances, but scientific studies either have not been done to verify the clinical relevance of these methods or have shown these methods to be unreliable and clinically questionable.
- id: murray-pizzorno-2012-encyclopedia
  location: Chapter 52 — Food Allergy, pg 943
  quote: |-
    Most nutritionally oriented physicians now employ blood tests to diagnose food allergies. These tests are convenient, but they can range in cost from a modest $130 to an extravagant $1,200.
