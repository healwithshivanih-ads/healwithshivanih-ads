slug: briden-hrm-b12-deficiency-common-after-50
statement: 'By age 50, ~40% chance of vitamin B12 deficiency — critical brain nutrient,
  deficiency causes fatigue, brain fog, memory problems, tingling, permanent nerve
  damage if untreated. Ask for the numeric result: optimal ≥ 400 pg/mL (not the 200
  pg/mL lab cutoff). Metformin, PPI stomach acid meds and alcohol all impair absorption.
  If low, treat with B12 injections or 1000 mcg sublingual spray — oral tablets absorb
  poorly at this age.'
