out_of_scope_notes: >
  Coach scope: everything behavioural on this pathway — chewing, meal pace, eating
  environment, meal spacing, sleep, and stress-management practice, plus educating
  the client on why those matter for food reactions. Out of scope: diagnosing low
  stomach acid, pancreatic insufficiency or intestinal permeability; ordering or
  interpreting permeability or stool testing; and recommending betaine HCl,
  pancreatic enzymes or any gut-repair supplement — all of that is clinician
  territory and some of it can cause harm if self-prescribed.
sources:
- id: murray-pizzorno-2012-encyclopedia
  location: Chapter 52 — Food Allergy, pg 938
  quote: |-
    When properly chewed and digested, 90% of ingested proteins are completely broken down and then absorbed as amino acids and small peptides. However, partially digested dietary proteins can cross the intestinal barrier and be absorbed into the bloodstream. These larger molecules can cause an allergic response that can occur either directly at the intestinal barrier, at distant sites, or throughout the body.
- id: murray-pizzorno-2012-encyclopedia
  location: Chapter 52 — Food Allergy, pg 938
  quote: |-
    During stressful times, food allergies tend to develop or become worse. This situation probably results from a stress-induced decrease in secretory IgA levels. IgA plays an important role in the lining of the mucosal membrane of the intestinal tract, where it helps protect against the entrance of foreign substances into the body.
