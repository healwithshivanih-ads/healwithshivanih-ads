out_of_scope_notes: >
  Fully within coaching scope - hydration is a lifestyle behaviour. The coach may set and
  track a fluid habit. The coach may not set fluid targets for a client with kidney disease,
  heart failure or on diuretics, and may not present hydration as treatment for an existing
  stone (a lodged stone is a clinical problem).
