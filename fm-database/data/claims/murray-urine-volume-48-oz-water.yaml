  quote: Drinking more water has long been recognized as one of the main approaches to
    preventing kidney stones. Increasing the urine volume results in a decrease in stone
    prevalence. Numerous clinical trials have found that consumption of more than about 48 fl
    oz of water per day lowers the long-term risk of kidney stone recurrence by approximately
    60%.13
