out_of_scope_notes: >
  Deciding whether a client can stop, reduce, or substitute an NSAID or
  cardioprotective aspirin is prescriber scope — as is deciding whether gastro-
  protection is needed alongside it. The coach's contribution is a complete,
  honest medication and OTC inventory (which is often the piece the doctor never
  sees), plus lifestyle work on the pain that drives the NSAID use in the first
  place.
sources:
- id: murray-pizzorno-2012-encyclopedia
  location: Chapter 83 — Peptic Ulcer, pg 1377
  quote: |-
    The study was conducted at ﬁve test hospitals in England and found an increased risk of gastrointestinal bleeding due to peptic ulcer at all dosage levels. However, the dosage of 75 mg per day was associated with 40% less bleeding than 300 mg per day and 30% less bleeding than 150 mg per day. The researchers concluded: “No conventionally used prophylactic aspirin regimen seems free of the risk of peptic ulcer complications.”
