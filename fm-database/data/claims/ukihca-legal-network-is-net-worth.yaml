slug: ukihca-legal-network-is-net-worth
statement: 'Legal reassurance for coaches: your own name works as a business name
  and avoids trademark issues. The biggest scope-of-practice line is ordering or interpreting
  labs — that''s practising medicine. Use AI for back-office work but verify sources.
  Referrals come from relationships — ''your network is your net worth'' — so partner
  with practices intentionally.'
evidence_tier: strong
rationale: Coach-facing takeaway distilled from the live-call reflection; ready for
  use in briefings and sessions.
coaching_translation: Spend an hour a week deepening one clinician or practitioner
  relationship. Referrals compound over years, not months.
