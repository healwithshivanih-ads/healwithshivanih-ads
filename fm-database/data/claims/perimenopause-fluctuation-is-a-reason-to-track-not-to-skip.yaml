slug: perimenopause-fluctuation-is-a-reason-to-track-not-to-skip
statement: The common positions that perimenopausal hormones are "all low" or "too
  fluctuating to bother measuring" are both wrong; fluctuation is precisely why serial
  tracking beats a single-timepoint test in this life stage.
evidence_tier: fm_specific_thin
rationale: A one-off blood draw can land on either a peak or a trough of a moving
  pattern, so it cannot distinguish low, high and swinging — serial daily data can.
coaching_translation: "Your hormones change a lot right now — that is the reason to
  watch the pattern, not a reason to give up on understanding it."
