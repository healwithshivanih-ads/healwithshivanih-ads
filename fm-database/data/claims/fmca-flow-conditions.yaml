slug: fmca-flow-conditions
statement: Flow arises when a task's challenge slightly exceeds a person's current
  skill, feedback is immediate, and attention is undivided. In coaching, help clients
  design activities that meet these conditions — often something they used to love
  that they've stopped doing.
evidence_tier: strong
