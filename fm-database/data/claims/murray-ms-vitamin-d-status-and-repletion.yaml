  quote: A recent study looked at the serum vitamin D levels in 199 people with MS and found 84% of them
    to be deﬁcient.42 In addition to this circumstantial evidence, studies involving the animal model
    of MS have shown that vitamin D has the ability to decrease immune-cell-mediated inﬂammation and prevent
    MS-like lesions.43,44
