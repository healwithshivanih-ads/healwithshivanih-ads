slug: briden-hrm-strength-training-heart-and-brain
statement: Just 1 hour/week of strength (resistance) training can reduce heart attack
  and stroke risk by up to 70% (2019 study). Strength training also improves hot flushes,
  cognition, sarcopenia, insulin sensitivity, bone density and BDNF/neurogenesis.
  Can be done with body weight (lunges, squats, planks — 7-minute-workout format).
  More important than cardio for the perimenopausal / menopausal woman's outcomes.
