slug: briden-hrm-oral-micronised-progesterone-heavy-flow
statement: 'Prof Prior''s protocol for very heavy anovulatory perimenopausal bleeding:
  oral micronised progesterone (Prometrium / Utrogestan) 300 mg at bedtime DAILY for
  a full 3 months. Same period-lightening effect as a progestin but without the mood,
  breast or metabolic side effects. Practical daily cost ~50 cents. This is off-label
  from most GPs'' perspective — coach the client to bring Prior''s published protocol
  paper to the appointment.'
