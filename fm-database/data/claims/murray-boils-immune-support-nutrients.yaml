out_of_scope_notes: >
  Clinician scope - prescribing or approving any of these doses, especially vitamin A
  in a woman of childbearing age, and supervising a therapeutic zinc course. Coach
  scope - the food work: reducing sugar and refined carbohydrate load, building
  zinc/vitamin A/vitamin C rich meals from Indian staples, improving mineral
  bioavailability by soaking and sprouting, and helping the client notice food-symptom
  patterns without labelling them allergies.
