slug: dietary-fibre-supports-mast-cell-stabilisation
statement: Fibre-rich plant foods feed beneficial gut microbes, and fibre and its metabolites (such as
  short-chain fatty acids) appear to dampen mast cell activation.
evidence_tier: plausible_emerging
rationale: Argues against over-restricting a histamine client into a low-plant diet; tolerated fibre should
  be protected.
coaching_translation: Fibre from vegetables, dals and whole grains feeds the good bacteria in your gut,
  and that seems to help keep immune cells calmer.
out_of_scope_notes: ''
caveats:
- Folkerts et al., Front Immunol 2018 (review, largely preclinical).
