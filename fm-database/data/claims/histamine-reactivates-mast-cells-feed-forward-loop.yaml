slug: histamine-reactivates-mast-cells-feed-forward-loop
statement: Mast cells are long-lived and keep re-making their mediators, and released histamine can re-activate
  mast cells, so a flare can become a self-sustaining loop; breaking it often needs more than diet and
  supplements.
evidence_tier: fm_specific_thin
rationale: Sets client expectations and justifies pairing dietary work with the clinician's mast-cell
  medication.
coaching_translation: Once these immune cells get going they can keep each other going. That's why food
  changes alone sometimes aren't enough, and why your doctor's treatment matters too.
out_of_scope_notes: ''
