out_of_scope_notes: >
  A coach may run a structured, time-limited elimination and reintroduction and
  teach food-symptom journalling. Ordering or interpreting IgE/IgG food panels,
  diagnosing food allergy, and managing anaphylaxis risk are clinician scope. If a
  client reports true allergic symptoms (swelling, breathing difficulty), refer
  immediately and do not run a food challenge.
sources:
- id: murray-pizzorno-2012-encyclopedia
  location: Chapter 83 — Peptic Ulcer, pg 1378
  quote: |-
    A diet that eliminates food allergens has been used with great success in treating and preventing recurrent ulcers.8,9 It is ironic that many people with peptic ulcers soothe their stomachs by consuming milk, a highly allergenic food. Milk should be avoided on this basis alone. However, population studies offer additional evidence that increased milk consumption leads to a greater likelihood of ulcer. The reason is probably that milk signiﬁcantly increases stomach acid production.11
