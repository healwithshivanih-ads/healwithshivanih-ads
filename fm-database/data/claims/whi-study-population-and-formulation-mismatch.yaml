slug: whi-study-population-and-formulation-mismatch
statement: The 2002 Women's Health Initiative findings of increased cardiovascular
  events, stroke, and breast cancer with hormone therapy came from a trial population
  averaging age 63 (about two-thirds already 10+ years past menopause) given non-bioidentical
  conjugated equine estrogen plus medroxyprogesterone acetate — not bioidentical
  estradiol and progesterone started near the menopause transition — so the results
  do not directly generalize to bioidentical hormone therapy started in the typical
  45-55 window.
evidence_tier: plausible_emerging
rationale: The WHI's age/timing mismatch and its use of non-bioidentical formulations
  (conjugated equine estrogens, medroxyprogesterone acetate rather than estradiol/micronized
  progesterone) are documented in the trial's own published methods and are widely
  discussed in endocrinology literature as the basis of the 'timing hypothesis.'
  The speaker's reframing of why non-bioidentical formulations were tested (regulatory/patent
  economics) is his own interpretation, not itself a clinical finding.
coaching_translation: If a client says she was told hormone therapy is unsafe because
  of "that study," it's fair to note that the landmark 2002 study tested older women
  on non-bioidentical hormones starting many years after menopause — not the bioidentical
  options and earlier timing her own doctor may be discussing with her. This is
  context for her conversation with her prescriber, not something a coach diagnoses
  or prescribes around.
caveats:
- Speaker's account of why WHI used non-bioidentical formulations (patent/FDA-approval
  economics) is his own explanatory framing, not a cited historical source — treat
  as context, not fact-checked history.
- Does not establish that bioidentical HRT is risk-free; only that the WHI's specific
  findings apply most directly to the population and formulation it tested.
