  quote: Although metabolic co-morbidities are less common, there is no difference
    in liver disease severity among both groups.
caveats:
- Single-centre hepatology-clinic cohort, not a population estimate. The widely quoted "about 1 in 5 NAFLD patients is lean" is a global meta-analysis figure, not an Indian one.
