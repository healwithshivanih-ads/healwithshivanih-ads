slug: lean-nafld-india-same-severity
statement: A normal BMI does not rule out fatty liver in Indians. In a PGIMER
  Chandigarh cohort of 1,040 NAFLD patients, about 1 in 7 (14.3%) were lean
  (BMI under 23), and their liver disease was just as severe as in heavier
  patients (similar steatosis, fibrosis and NASH rates). Nearly half of the lean
  patients (48.3%) still carried central (belly) obesity, and they had similar
  rates of diabetes, high triglycerides and low HDL.
evidence_tier: plausible_emerging
