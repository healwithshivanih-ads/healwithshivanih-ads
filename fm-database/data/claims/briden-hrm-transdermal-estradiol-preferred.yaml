slug: briden-hrm-transdermal-estradiol-preferred
statement: 'Transdermal (patch or gel) body-identical estradiol is the safest form
  of systemic estrogen — enters the bloodstream directly, bypassing first-pass liver
  metabolism and so not producing the dangerous clotting factors that oral estrogen
  does. Products: Estradot®, Climara®, Sandrena®, Estrogel®. Oral conjugated equine
  estrogens (Premarin®) increase blood clot, heart disease and breast risk and are
  essentially obsolete.'
evidence_tier: strong
