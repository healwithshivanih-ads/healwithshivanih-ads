slug: dash-mind-diet-lower-migraine-severity
statement: Women who followed a DASH or MIND-style diet more closely reported shorter and less severe
  migraine headaches in observational studies.
evidence_tier: plausible_emerging
rationale: A whole-diet pattern adds to trigger removal; these are close to a balanced Indian thali with
  more vegetables, dals, nuts and less salt.
coaching_translation: Eating plenty of vegetables, dals, nuts and whole grains, with less salt and fewer
  packaged foods, is linked with milder migraines.
out_of_scope_notes: ''
caveats:
- Mirzababaei 2020 and Askarpour 2020 — cross-sectional, Iranian cohorts; no RCT.
