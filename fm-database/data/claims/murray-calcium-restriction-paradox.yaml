out_of_scope_notes: >
  Coach scope: educating that food calcium is protective, and coaching the habit of pairing
  calcium-containing foods with higher-oxalate meals. Clinician scope: prescribing calcium
  supplements, deciding dose or form, and any client with abnormal serum calcium, PTH or a
  named metabolic cause. The coach must not tell a client to start or stop a supplement their
  doctor set.
