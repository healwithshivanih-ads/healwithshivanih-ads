out_of_scope_notes: >
  Coach scope: meal-timing and food-pairing habits (vitamin C at meals, chai and coffee away
  from meals, spacing calcium-rich or supplement-heavy moments away from iron-rich meals).
  Clinician scope: prescribing iron, choosing the salt or dose, advising on antacid or
  acid-blocker use, and deciding whether a supplement is needed at all.
sources:
- id: murray-pizzorno-2012-encyclopedia
  location: Chapter 21 — Anemia, pg 471
  quote: >-
    For iron deﬁciency, the usual recommendation for any non-heme source is generally up to
    60 mg per day in divided doses. High intakes of other minerals, particularly calcium,
    magnesium, and zinc, can interfere with iron absorption, so in treating iron deﬁciency it
    is recommended to take iron away from other mineral supplements. In contrast, vitamin C
    enhances iron absorption.
- id: murray-pizzorno-2012-encyclopedia
  location: Chapter 21 — Anemia, pg 472
  quote: >-
    Several foods and beverages contain substances that inhibit iron absorption, including
    tea, coffee, wheat bran, and egg yolk. Antacids and overuse of calcium supplements also
    decrease iron absorption. These items should be restricted by individuals who have iron
    deﬁciency.
