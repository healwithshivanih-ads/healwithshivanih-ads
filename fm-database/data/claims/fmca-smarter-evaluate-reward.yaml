slug: fmca-smarter-evaluate-reward
statement: The 'E' and 'R' in SMARTER — Evaluate and Reward (or Re-adjust) — turn
  a one-shot goal into a learning loop. Building the evaluation moment into the goal
  is what converts a plan into a practice.
