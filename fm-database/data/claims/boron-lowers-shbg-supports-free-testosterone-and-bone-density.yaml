slug: boron-lowers-shbg-supports-free-testosterone-and-bone-density
statement: Boron is used clinically to lower SHBG and increase free testosterone,
  and may also support bone density in women — relevant both to low-free-testosterone
  symptom pictures and to bone-health support in perimenopause/menopause.
evidence_tier: fm_specific_thin
rationale: Boron's effect on SHBG and free testosterone has small supporting human
  studies; bone-density effects are less consistently evidenced. The speaker presents
  this as a clinical pearl rather than citing a specific trial.
coaching_translation: Supplement dosing is outside coaching scope; a coach can note
  boron as a topic worth raising with the client's prescriber if SHBG is elevated,
  alongside the diet and lifestyle factors that are squarely coaching territory.
caveats:
- No specific study cited by the speaker; cross-reference the catalogue's existing
  boron entry for dose and evidence detail.
