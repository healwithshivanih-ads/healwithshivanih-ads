out_of_scope_notes: >
  Coach scope: educating on purine-dense foods, moderating portions, alcohol reduction, and
  the hydration habit. Clinician scope: confirming the stone is uric acid, interpreting serum
  or urinary uric acid, prescribing urinary alkalinisation or urate-lowering medication, and
  setting protein targets for anyone with abnormal renal markers.
