slug: fmca-m2-evoking-is-the-heart
statement: Evoking is the heart of MI. It shifts from expressing concern (Engaging)
  to strategically drawing out the client's own reasons for change. The coach listens
  for change talk (Desire, Ability, Reasons, Need — DARN) and responds with reflections
  that strengthen it. Motivation is drawn out, never inserted.
evidence_tier: strong
rationale: Coach-facing takeaway distilled from the live-call reflection; ready for
  use in briefings and sessions.
coaching_translation: If you're trying to convince the client that change matters,
  you've slipped out of MI. Ask instead.
