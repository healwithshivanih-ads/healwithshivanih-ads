out_of_scope_notes: >
  Diet and bowel-regularity coaching is squarely within coach scope. Ordering or interpreting
  serum oestradiol, or claiming a diet will shrink a fibroid, is not — the size of a fibroid
  is tracked by the gynaecologist on imaging.
