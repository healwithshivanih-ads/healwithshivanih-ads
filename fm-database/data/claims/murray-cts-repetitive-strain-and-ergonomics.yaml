out_of_scope_notes: >
  CLINICIAN: diagnosis, provocative testing, nerve conduction studies, fitness-for-work
  decisions and any occupational-health certification. COACH: education about neutral wrist
  positioning, break frequency, task rotation and vibration exposure, plus habit support for
  sustaining those changes.
