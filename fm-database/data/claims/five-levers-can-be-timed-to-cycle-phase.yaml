slug: five-levers-can-be-timed-to-cycle-phase
statement: Five categories of intervention can be timed to cycle phase rather than
  delivered uniformly — diet, fasting, seed cycling, exercise, and herbs/supplements.
evidence_tier: fm_specific_thin
rationale: If metabolism, insulin sensitivity and neurotransmitter response all shift
  between follicular and luteal, then interventions acting on those systems have a
  better and a worse half of the cycle to land in.
coaching_translation: Most of what we change — food, movement, fasting, supplements
  — can be matched to where you are in your cycle instead of done identically every
  day.
