out_of_scope_notes: |
  Educating a client about what ginkgo is, what the evidence does and does not show, and that it interacts with blood thinners is in scope. Recommending it, choosing a product, setting a dose, or advising on it alongside anticoagulant therapy is prescriber scope - refer every time, without exception.
