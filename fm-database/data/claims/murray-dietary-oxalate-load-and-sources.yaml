out_of_scope_notes: >
  Coach scope: teaching where oxalate sits in everyday food, coaching pairing and cooking
  changes, and protecting nutrient adequacy while oxalate is reduced. Clinician scope:
  confirming the stone is calcium oxalate, ordering or interpreting a 24-hour urinary oxalate,
  identifying enteric hyperoxaluria (the chapter lists ileal disease, resection, bypass and
  steatorrhoea as causes), and prescribing a formal low-oxalate diet.
sources:
- id: murray-pizzorno-2012-encyclopedia
  location: Chapter 73 — Kidney Stones, pg 1209
  quote: It appears that people with recurrent kidney stones have a tendency to absorb higher
    levels of dietary oxalates compared with normal subjects not prone to kidney stones. A
    low-oxalate diet is usually defined as one containing less than 50 mg oxalate per day, so
    foods that have high or moderate levels of oxalate should be avoided.
