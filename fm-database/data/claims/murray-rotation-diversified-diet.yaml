    Tolerated foods are eaten at regularly spaced intervals of four to seven days. For example, a person who has wheat on Monday will have to wait until Friday to have anything with wheat in it again. This approach is based on the principle that infrequent consumption of tolerated foods is not likely to induce new allergies or exacerbate mild allergies, even in highly sensitized and immune-compromised individuals.
