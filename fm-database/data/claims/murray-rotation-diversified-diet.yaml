out_of_scope_notes: >
  Building variety into a client's week, planning rotation-friendly menus, and
  helping them shop and cook for it are squarely coach work. Prescribing a strict
  rotation protocol as treatment for a diagnosed allergy, or deciding which food
  families a client must space out, is clinician/dietitian work — particularly
  where protein or micronutrient adequacy is at stake in a vegetarian client.
