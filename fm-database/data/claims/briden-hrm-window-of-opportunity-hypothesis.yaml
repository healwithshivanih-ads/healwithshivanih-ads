slug: briden-hrm-window-of-opportunity-hypothesis
statement: 'The ''timing hypothesis'' or ''window of opportunity'': estrogen therapy
  started around menopause (within 5–10 years of the final period) can reduce cardiovascular
  and dementia risk, but estrogen started >10 years past menopause can INCREASE those
  risks — because estrogen is only protective before arterial plaque has progressed.
  Once atherosclerosis exists, estrogen (especially oral) promotes clots. Coach corollary:
  a woman who declined MHT in her early 50s should not be encouraged to reconsider
  in her mid-60s.'
