out_of_scope_notes: >
  Diagnosing the stone, ordering or interpreting stone analysis, urinalysis or serum
  chemistry, and prescribing urinary alkalinisation or acidification are all clinician scope.
  The coach's scope is to ask whether the type is known, to educate on what each type
  generally implies, and to withhold type-specific dietary advice until a clinician has
  confirmed the type.
sources:
- id: murray-pizzorno-2012-encyclopedia
  location: Chapter 73 — Kidney Stones, pg 1202
  quote: Diagnosing the type of stone is critical to determining the appropriate therapy.
    Careful evaluation of a number of criteria (diet; underlying metabolic or disease factors;
    urinalysis; urine culture; and blood levels of calcium, uric acid, creatinine, and
    electrolytes) will usually allow a physician to determine the composition of the stone if
    one is not available for chemical analysis.
