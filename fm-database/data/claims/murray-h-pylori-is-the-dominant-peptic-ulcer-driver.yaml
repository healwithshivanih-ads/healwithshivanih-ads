slug: murray-h-pylori-is-the-dominant-peptic-ulcer-driver
statement: |
  Helicobacter pylori infection is the single most common driver of peptic ulcer
  disease. Murray & Pizzorno report that 90-100% of duodenal ulcer patients, 70% of
  gastric ulcer patients, and roughly 50% of people over age 50 test positive. They
  name H. pylori and NSAIDs as "by far the most significant" of the factors that
  break down mucosal defence. Critically, the predisposing conditions for
  colonisation are LOW gastric acid output and low antioxidant status in the gut
  lining — H. pylori then raises gastric pH further, creating a self-reinforcing
  loop the authors call a vicious circle.
evidence_tier: strong
rationale: >
  The prevalence figures are cited (ref 1) and match the mainstream
  gastroenterology consensus that emerged after Marshall and Warren; this is not a
  fringe FM position. The mechanism is well characterised: urease-driven ammonia
  production neutralises local acid and degrades the mucin layer. The low-acid-
  predisposes-to-colonisation direction is the FM-distinctive part and is cited
  (ref 2) but is a smaller literature than the eradication data. Tiered strong for
  the causal association; the low-acid-as-antecedent framing is the weaker limb.
coaching_translation: >
  Ulcers are far more often an infection problem than a "too much acid" problem.
  A bacterium called H. pylori is found in almost everyone with a duodenal ulcer.
  It is very common in India and it spreads through shared food, water and
  households. If you have ongoing burning or gnawing stomach pain, the useful
  question for your doctor is not "what will settle the acid" but "have we actually
  tested for H. pylori" — and if a family member has tested positive, it is worth
  asking whether you should be tested too.
caveats:
- |-
  H. pylori positivity is not the same as active ulcer disease — carriage is common and asymptomatic in a large share of adults over 50
- |-
  Serology stays positive after successful eradication; stool antigen or urea breath testing is needed to confirm clearance. This is a clinician call, not a coach call
- |-
  Acid-suppressing drugs and recent antibiotics cause false-negative breath and stool tests — the doctor decides the washout
- |-
  Prevalence figures are US-derived; Indian community prevalence is generally reported higher, so do not quote these percentages as local numbers
