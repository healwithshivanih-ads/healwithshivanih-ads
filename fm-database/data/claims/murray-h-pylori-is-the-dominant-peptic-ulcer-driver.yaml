out_of_scope_notes: >
  Diagnosing H. pylori, ordering or interpreting breath/stool/serology tests, and
  prescribing or sequencing eradication therapy (triple/quadruple regimens) are
  strictly clinician scope. The coach's role is to normalise testing, support
  adherence to the doctor's regimen, and rebuild diet and lifestyle around it —
  never to suggest herbal protocols as a substitute for eradication.
sources:
- id: murray-pizzorno-2012-encyclopedia
  location: Chapter 83 — Peptic Ulcer, pg 1376
  quote: |-
    It has been shown that 90 to 100% of patients with duodenal ulcers, 70% with gastric ulcers, and about 50% of people over the age of 50 test positive for this bacterium.1 Physicians can determine if it is present by measuring the level of antibodies to H. pylori in the blood or saliva, or by culturing material collected during an endoscopy.
