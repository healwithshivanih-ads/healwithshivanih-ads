out_of_scope_notes: >
  Diagnosing folate deficiency, ordering or interpreting serum or RBC folate, prescribing
  folate at any dose, and evaluating the underlying malabsorption are all clinician scope.
  Coach scope: education on folate-rich foods, cooking methods that preserve folate, alcohol
  as a modifiable driver, and referral when chronic diarrhoea or malabsorption symptoms are
  described.
