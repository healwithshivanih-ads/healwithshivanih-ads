sources:
- id: murray-pizzorno-2012-encyclopedia
  location: Chapter 21 — Anemia, pg 468
  quote: >-
    Folic acid deﬁciency is the most common vitamin deﬁciency in the world. The body does not
    store a large surplus of folic acid (unlike vitamin B12); it stores only enough to sustain
    itself for one to two months. Folic acid deﬁciency will result in the same type of anemia
    as that caused by a vitamin B12 deﬁciency: an anemia characterized by enlarged RBCs
    (macrocytic anemia).
- id: murray-pizzorno-2012-encyclopedia
  location: Chapter 21 — Anemia, pg 469
  quote: >-
    Folic acid deﬁciency is quite common among patients who have chronic diarrhea or
    malabsorption states such as celiac disease, Crohn’s disease, or tropical sprue. Since a
    deﬁciency of folic acid will result in diarrhea and malabsorption, often a vicious circle
    ensues.
