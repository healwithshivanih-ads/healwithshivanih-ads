slug: fmca-m3-coach-educate-cocreate-evaluate
statement: The coach's role in nutrition is to educate, co-create and evaluate — never
  to prescribe. Educate on food categories and the plan's logic; co-create the personalised
  transition; evaluate what's actually working for the client's life. The clinician
  sets the calorie level and any therapeutic prescription.
evidence_tier: strong
rationale: Coach-facing takeaway distilled from the live-call reflection; ready for
  use in briefings and sessions.
coaching_translation: Anchor every nutrition conversation in those three verbs. If
  you're doing anything else, check whether you've drifted out of scope.
