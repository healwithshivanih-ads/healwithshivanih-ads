out_of_scope_notes: >
  Coach scope: teaching food hygiene, safe cooking and storage, water safety, and how to eat out
  more safely — all standard health education. Clinician scope: assessing the client's degree of
  immunosuppression, deciding how strict the precautions need to be, prophylaxis against
  opportunistic infections, and diagnosing or treating any foodborne illness. If a client
  develops fever or gastrointestinal illness, refer rather than advise.
