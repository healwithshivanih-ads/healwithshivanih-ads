slug: briden-hrm-estrogen-can-triple-in-perimenopause
statement: During the early phases of perimenopause, estrogen can spike up to 3× reproductive-age
  peaks and fluctuates wildly — Prof Jerilynn Prior describes it as the ovary's 'grand
  finale' or 'fireworks show.' Estrogen is not on a smooth decline; the high-then-drop
  pattern is what drives heavy periods, breast pain and estrogen-withdrawal night
  sweats.
evidence_tier: strong
