slug: urolithin-a-targets-mitophagy-not-energy-production
statement: Urolithin A acts on mitophagy — clearing damaged mitochondria — which is
  a different lever from CoQ10, NAD+ precursors and B vitamins, which support the
  functioning of mature mitochondria.
evidence_tier: plausible_emerging
rationale: Mitochondrial health has three separable arms — clearance, energy
  production and biogenesis — and the common mitochondrial supplements cluster on
  the latter two. This is the case for it being additive rather than duplicative.
coaching_translation: Most mitochondrial supplements help the mitochondria you have
  work better; this one is about clearing out the worn-out ones.
