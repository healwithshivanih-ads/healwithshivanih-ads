slug: briden-hrm-vaginal-estrogen-very-safe
statement: 'Vaginal estrogen (Vagifem Low® estradiol pessary, Ovestin® estriol cream)
  delivered locally does not carry systemic estrogen''s cardiovascular or breast risks
  — ACOG explicitly states no evidence of increased cancer recurrence, even in women
  with breast cancer history or on tamoxifen. Highly effective for GSM: dryness, painful
  sex, recurrent UTIs, prolapse, vaginal microbiome balance. Effectively no downside
  apart from occasional thrush (which vaginal probiotics prevent).'
evidence_tier: strong
