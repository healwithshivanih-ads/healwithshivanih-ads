out_of_scope_notes: >
  Recommending, dosing or supervising an AREDS-type formula is clinician scope — it is
  a therapeutic-dose regimen with a real interaction profile (zinc–copper, vitamin E–
  anticoagulants, beta-carotene–smoking history). The coach may explain what the study
  found, ask whether the client's ophthalmologist has discussed an eye formula, and
  support the food-first version. The coach must not select a product, set a dose, or
  tell a client to add zinc at 80 mg.
