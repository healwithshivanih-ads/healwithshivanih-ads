slug: murray-armd-areds-antioxidant-zinc-formula
statement: |
  The Age-Related Eye Disease Study (AREDS) tested a combination rather than a single
  nutrient, on the reasoning that no one antioxidant explains the impaired antioxidant
  status seen in ARMD — the deficit is spread across several nutrients at once. The
  amounts used were 500 mg vitamin C, 400 IU vitamin E, 15 mg beta-carotene (labelled
  as equivalent to 25,000 IU vitamin A), 80 mg zinc as zinc oxide, and 2 mg copper as
  cupric oxide. The copper is not optional decoration: at 80 mg/day zinc will induce
  copper deficiency, which is why it is in the formula. Murray & Pizzorno's own
  clinical recommendation sits well below the trial doses (zinc 30–45 mg/day, vitamin
  E 100–200 IU, vitamin C 500–1,000 mg) inside a broader multi.
evidence_tier: confirm_with_clinician
rationale: >
  AREDS is a large randomised trial and the dose figures are reported directly in the
  chapter, so the numbers themselves are solid. The tier is set to
  confirm_with_clinician because these are therapeutic, not nutritional, doses: 80 mg
  elemental zinc daily is roughly eight times the RDA and is not a self-directed
  intake, 400 IU vitamin E has its own signal in some cardiovascular and prostate
  literature, and 15 mg beta-carotene is the exact intervention that increased lung
  cancer incidence in smokers in the ATBC and CARET trials — a group that overlaps
  heavily with the ARMD population, since smoking is a leading ARMD risk factor. The
  chapter does not flag the smoker/beta-carotene conflict; that is a real omission and
  is the reason this claim must not be actioned by a coach alone.
coaching_translation: >
  The big eye study did not test one vitamin — it tested a bundle, because people with
  macular degeneration tend to be low across several antioxidants at once, not just
  one. The bundle used high-dose vitamin C and E, beta-carotene, a large dose of zinc,
  and a small amount of copper to stop the zinc from pushing copper down. These are
  treatment-level doses, not everyday nutrition, so they belong in a conversation with
  the client's eye doctor or physician — especially for anyone who smokes or used to.
  What a coach can do meanwhile is build the food version: a wide, colourful plant
  intake plus a sensible everyday multivitamin.
caveats:
- Beta-carotene at these doses is contraindicated in current and former smokers
  (increased lung cancer incidence in ATBC and CARET) — a group over-represented in ARMD.
  The chapter does not mention this.
- 80 mg/day elemental zinc is a therapeutic dose; sustained use without the paired
  copper causes copper-deficiency anaemia and myeloneuropathy, and can suppress immunity.
- High-dose vitamin E interacts with warfarin and other anticoagulants.
- Doses this size are prescriptive and outside coaching scope regardless of the client's
  enthusiasm.
- AREDS was conducted in a Western population; nothing in the chapter addresses whether
  the same doses are appropriate for Indian clients with different baseline intakes.
