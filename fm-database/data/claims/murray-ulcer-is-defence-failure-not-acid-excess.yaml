linked_to_mechanisms: [gastric-mucosal-barrier-disruption, hypochlorhydria, hypochlorhydria-from-ppi, histamine-mediated-gastric-acid-hypersecretion, low-stomach-acid-antigen-load]
out_of_scope_notes: >
  Any decision to taper, switch, or stop a PPI such as pantoprazole belongs to the
  prescribing doctor. A coach may educate on what acid does, support meal-pattern
  and stress changes, and encourage the client to book a medication review — but
  must not set a taper schedule, suggest a dose reduction, or imply the medicine is
  unnecessary. Interpreting B12/iron/magnesium results from long-term use is also
  clinician scope.
sources:
- id: murray-pizzorno-2012-encyclopedia
  location: Chapter 83 — Peptic Ulcer, pg 1376
  quote: |-
    Contrary to popular opinion, excessive secretion of gastric acid output is rarely a factor in the development of gastric ulcers. In fact, patients who have gastric ulcers tend to secrete normal or even reduced levels of gastric acid. In duodenal ulcer patients, however, almost half have increased gastric acid output. This increase may be due to an increased number of acid-producing cells, known as parietal cells.
