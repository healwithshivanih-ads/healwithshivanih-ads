slug: time-interventions-to-phase-not-calendar-day
statement: Cycle-timed interventions should follow the client's actual follicular and
  luteal phases, not a fixed two-weeks-each calendar split; a woman with a 49-day
  cycle stays in her follicular plan well past day 14.
evidence_tier: fm_specific_thin
rationale: Phase boundaries are set by ovulation, which varies widely between women
  and between cycles, so a day-count schedule misassigns the plan for anyone whose
  cycle is not textbook.
coaching_translation: Switch your plan when your body switches phase, not on a date
  in the diary.
