slug: mcas-pattern-inflammation-allergy-dystrophism
statement: MCAS typically shows as chronic waxing-and-waning multisystem inflammation, with or without
  allergic-type reactions and with or without odd growth or development changes in tissues (dystrophisms).
  A long problem list of '-itis' diagnoses plus puzzling allergies and drug sensitivities is the clue.
evidence_tier: fm_specific_thin
rationale: 'Gives the coach a timeline pattern to spot: many unrelated-looking diagnoses may be one process.'
