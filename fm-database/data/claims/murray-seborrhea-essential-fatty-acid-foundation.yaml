out_of_scope_notes: >
  Coach scope: food-first fats, cooking and storage habits, fermented foods, food-symptom
  journalling, and supporting adherence to a clinician-supervised elimination trial.
  Clinician scope: allergy testing and interpretation, deciding on and supervising elimination
  diets (especially in infants and children), and clearing omega-3 dosing for anyone on
  anticoagulants. Referral boundary not attributable to this chapter: adult seborrheic
  dermatitis of sudden, severe or explosive onset can mark underlying illness including HIV
  and Parkinson's disease and must be seen by a doctor.
