slug: fmca-m3-therapeutic-plans-are-clinician-prescribed
statement: The IFM therapeutic food-plan suite (Elimination, Cardiometabolic, Mito,
  Detox, ReNew, Low-FODMAP, etc.) is prescribed by the clinician for a specific therapeutic
  reason. The coach's job is to coach the plan the clinician has chosen — translate,
  personalise, sustain — not to choose which plan a client should be on.
evidence_tier: strong
rationale: Coach-facing takeaway distilled from the live-call reflection; ready for
  use in briefings and sessions.
coaching_translation: If a client asks 'should I be on AIP?', reflect it back to their
  clinician. You coach whatever plan they land on.
out_of_scope_notes: Selecting the therapeutic food plan is a clinical decision.
