  location: Q&A — vaginal estrogen and UTI prevention pearl
  quote: I'll tell them to buy a vaginal dilator kit or a pelvic floor dilator kit...
    they start at the lowest tube and increase it... put the vaginal estradiol on
    that and then insert it so it's evenly distributed and you're not just hoping
    it goes where it needs to go.
