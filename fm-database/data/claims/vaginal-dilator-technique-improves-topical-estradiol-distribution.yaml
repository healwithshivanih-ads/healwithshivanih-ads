slug: vaginal-dilator-technique-improves-topical-estradiol-distribution
statement: For clients with genitourinary syndrome of menopause and pain with penetration,
  using a graduated vaginal/pelvic-floor dilator kit (starting at the smallest size)
  as the applicator for topical vaginal estradiol — rather than inserting the cream
  alone — distributes the medication more evenly and can be paired with pelvic-floor
  training.
evidence_tier: fm_specific_thin
rationale: Vaginal estradiol for genitourinary syndrome of menopause is well established;
  the specific dilator-as-applicator technique is a practical clinical pearl the
  speaker relays from a urologist colleague, not a published technique study.
coaching_translation: If a client mentions pain with intercourse or that her vaginal
  estrogen 'doesn't seem to be working,' this even-distribution technique — and
  pelvic-floor training more broadly — is worth raising as a question for her prescriber
  or pelvic-floor therapist. A coach doesn't direct the technique itself but can
  normalize that dilator-assisted application and pelvic-floor training are real,
  common tools.
caveats:
- Technique is a clinical pearl relayed secondhand from a urologist colleague, not
  a published method.
