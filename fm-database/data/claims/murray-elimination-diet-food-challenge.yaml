- id: murray-pizzorno-2012-encyclopedia
  location: Chapter 52 — Food Allergy, pg 942
  quote: |-
    The individual stays on this limited diet for at least one week, and up to one month. If the symptoms are related to food sensitivity, they will typically disappear by the fifth or sixth day of the diet. If the symptoms do not disappear, it is possible that a reaction to a food in the elimination diet is responsible.
- id: murray-pizzorno-2012-encyclopedia
  location: Chapter 52 — Food Allergy, pg 942
  quote: |-
    WARNING: Food challenge testing should not be used by people who have potentially life-threatening symptoms such as airway constriction or severe allergic reactions. In the elimination diet method, the patient is put on a limited diet.
- id: murray-pizzorno-2012-encyclopedia
  location: Chapter 52 — Food Allergy, pg 942
  quote: |-
    After the elimination diet period, individual foods are reintroduced every two days. Methods range from reintroducing a single food every two days to reintroducing a food every one or two meals. Usually, after the “cleansing” period, the patient will develop an increased sensitivity to offending foods.
