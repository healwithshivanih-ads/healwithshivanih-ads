out_of_scope_notes: >
  Supervising the practical side of an elimination diet — meal planning, shopping,
  the symptom log, adherence, keeping the client nourished — is coach-adjacent and
  within scope with a client who has been medically cleared. Deciding that a
  client should undertake one, interpreting the result as a diagnosis, and
  supervising any re-challenge in a client with a history of anaphylaxis or airway
  involvement are clinician-only. Anaphylaxis is an emergency: if a client has ever
  had lip/tongue/throat swelling, wheeze, or collapse after a food, that food is
  never re-challenged by a coach, in any setting.
