slug: ast-alt-ratio-above-2-suggests-alcohol
statement: When liver enzymes are raised, an AST/ALT ratio above 2 strongly suggests alcohol-related liver disease; fatty liver and viral hepatitis usually show a ratio below 1.
evidence_tier: strong
rationale: The ratio is already computed by the assess engine; this gives the coach the reading and the reason to ask about alcohol specifically.
coaching_translation: If AST is more than twice ALT, ask about alcohol gently and specifically (drinks per week, weekend pattern). Whatever the answer, this pattern goes to the doctor.
out_of_scope_notes: Diagnosing alcohol-related liver disease is the doctor's; the coach supports cutting down.
caveats:
- Only meaningful when the enzymes are raised; with both enzymes low, the ratio is noise.
- Muscle injury, advanced fibrosis of any cause and B6 deficiency can also push the ratio up.
- Original study in hospital patients with established disease (1979).
