slug: fmca-m3-signature-strengths-first
statement: Every client has 3-5 'signature' character strengths that feel natural
  and energising to use. In coaching, leaning first into signature strengths (rather
  than fixing weaknesses) creates traction; the client feels 'this is me at my best'
  and can attach new behaviours to something they already own.
evidence_tier: plausible_emerging
rationale: Coach-facing takeaway distilled from the live-call reflection; ready for
  use in briefings and sessions.
coaching_translation: Ask the VIA-24 which top strengths surprise them. Then design
  the next tiny habit around one of those strengths.
