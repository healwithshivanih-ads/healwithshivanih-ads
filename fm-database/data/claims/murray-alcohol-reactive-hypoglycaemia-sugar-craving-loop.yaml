out_of_scope_notes: |
  Clinician: diagnosing hypoglycaemia, excluding other causes, adjusting
  diabetes medication. Coach: meal timing and composition, reducing added sugar,
  and helping the client notice the dip-then-craving pattern without shame.
sources:
- id: murray-pizzorno-2012-encyclopedia
  location: 'Chapter 19 — Alcohol Dependence, pg 425'
  quote: 'Alcohol consumption often results in reactive hypoglycemia, in which a rapid increase in blood glucose levels is followed by a subsequent drop. The drop in blood glucose produces a craving for food, particularly foods that quickly elevate blood glucose, such as sugar and more alcohol. Increased sugar consumption aggravates the reactive hypoglycemia, particularly in the presence of alcohol.'
