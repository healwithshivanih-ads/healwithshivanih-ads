  location: Chapter 49 — Erectile Dysfunction, pg 902
  quote: |-
    In fact, in men over the age of 50, organic causes are responsible for erectile dysfunction in more than 90% of cases.3 In the past, a man with ED who was able to have nighttime or early morning erections was thought to have psychogenic impotence. However, it is now recognized that this is not a reliable indicator.
