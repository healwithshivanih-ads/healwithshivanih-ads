out_of_scope_notes: >
  Coach scope: normalising the conversation, encouraging assessment, and working on
  stress, sleep and relationship context alongside medical care. Clinician scope: the
  entire diagnostic workup — history, examination, bloods, hormone levels, penile
  monitoring, vascular and neurological assessment.
