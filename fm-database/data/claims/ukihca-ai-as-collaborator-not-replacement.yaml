slug: ukihca-ai-as-collaborator-not-replacement
statement: AI is a coach collaborator that frees up back-office time for the face-to-face
  connection — it doesn't replace creativity or the coaching relationship. The caveat
  is to keep verifying sources because AI can hallucinate. Connection matters more
  than perfection.
evidence_tier: plausible_emerging
rationale: Coach-facing takeaway distilled from the live-call reflection; ready for
  use in briefings and sessions.
coaching_translation: Use AI to draft session notes, marketing copy, follow-up messages.
  Then verify anything factual and always write client-facing messages in your own
  voice.
