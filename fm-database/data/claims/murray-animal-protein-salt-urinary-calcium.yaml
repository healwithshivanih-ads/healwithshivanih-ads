out_of_scope_notes: >
  Coach scope: reducing processed-salt sources, moderating animal-protein portions, protecting
  protein adequacy in vegetarians, and coaching the water habit alongside. Clinician scope:
  setting a protein prescription for anyone with raised uric acid, creatinine or reduced eGFR;
  interpreting a 24-hour urine calcium or sodium; and prescribing sodium restriction in
  cardiac or renal disease.
