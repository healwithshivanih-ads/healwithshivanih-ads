  quote: Another dietary recommendation is to decrease salt consumption. Urinary calcium
    excretion increases approximately 40 mg for each 2,300 mg increase in dietary sodium in
    normal adults; those who form kidney stones have an even greater increase in urinary
    calcium with an increase in salt intake. The best approach is to combine increased water
    intake with decreased sodium intake.14
