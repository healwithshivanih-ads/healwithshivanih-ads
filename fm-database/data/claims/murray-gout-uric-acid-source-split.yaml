out_of_scope_notes: Diagnosis, urate testing and its interpretation, and management of an acute attack are clinician scope. The coach's scope is education about purine metabolism and the diet/alcohol/weight levers, and supporting the client to act on them. A single acutely hot, red, swollen joint may be septic arthritis, not gout — that is a same-day emergency referral, not a coaching conversation. Never assume 'it's just gout'.
