out_of_scope_notes: >
  Thyroid diagnosis, dosing and monitoring are clinician scope throughout. What a
  coach can and should do: not present these extracts as thyroid support, keep any
  polyphenol extract spaced from levothyroxine, and flag self-started supplement
  use to the prescribing doctor before the next thyroid panel so an unexplained TSH
  drift is not chased in the dark.
