- id: chandra-2013-catechin-thyroid-enzyme-inhibition
  location: Abstract — enzyme and hormone findings
  quote: >-
    Catechin decreased the activities of thyroid peroxidase and thyroidal
    5'-deiodinase I, while substantial decrease in serum T3 and T4 levels coupled with
    significant elevation of serum TSH were noted.
- id: divi-doerge-1996-flavonoid-tpo-inhibition
  location: Abstract — structure-activity panel
  quote: >-
    Most flavonoids tested were potent inhibitors of TPO with IC50 values of 0.6-41
    microM. Inhibition by the more potent compounds, fisetin, kaempferol, naringenin
    and quercetin, which contain a resorcinol moiety, was consistent with
    mechanism-based inactivation of TPO.
