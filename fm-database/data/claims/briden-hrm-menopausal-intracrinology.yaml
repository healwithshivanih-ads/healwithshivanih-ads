slug: briden-hrm-menopausal-intracrinology
statement: 'After menopause, cells throughout the body (heart, brain, breast) can
  make their own estrogen locally from androgen precursors using the enzyme aromatase
  — a process called intracrinology. Maintaining a healthy level of the adrenal androgen
  DHEA is what supports this local production. Explains why ovaries removed at menopause
  is more consequential than natural menopause: it strips the androgen precursor supply.'
