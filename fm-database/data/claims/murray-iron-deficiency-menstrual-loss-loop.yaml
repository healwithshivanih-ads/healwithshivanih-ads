out_of_scope_notes: >
  Evaluating heavy menstrual bleeding, investigating a source of GI blood loss, and deciding
  whether iron repletion is indicated are all clinician scope. Coach scope: helping the
  client notice and describe her flow and her fatigue accurately, prompting her to raise both
  with her doctor together rather than separately, and supporting the dietary side once a
  cause has been established.
