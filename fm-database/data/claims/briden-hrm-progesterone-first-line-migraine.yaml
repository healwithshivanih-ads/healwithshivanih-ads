slug: briden-hrm-progesterone-first-line-migraine
statement: 'Progesterone is one of Briden''s best treatments for perimenopausal /
  premenstrual migraines — calms the brain via GABA and reduces migraine-driving histamine.
  Protocol: bedtime capsule throughout the luteal phase, plus an add-on daytime dose
  if a migraine begins. Estrogen (transdermal, low-dose) is a distant second choice
  and only for very-low-estrogen migraines (surgical menopause) or during the estrogen-dropping
  ''danger window'' (5 days before period through day 2). Oral estrogen and combined
  pill both WORSEN migraine and raise stroke risk in migraineurs.'
evidence_tier: strong
