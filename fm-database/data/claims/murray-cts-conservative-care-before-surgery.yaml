out_of_scope_notes: >
  CLINICIAN: diagnosis, splint prescription and fitting, nerve conduction studies, and the
  decision on timing and type of surgical release. COACH: adherence support for the clinician's
  conservative plan, symptom tracking so change over time is visible, and — importantly —
  prompting the client to return for review rather than tolerating unresolved symptoms past
  the point where the nerve is at risk.
