slug: fmca-m2-experiential-vs-behavioural-processes
statement: In the earlier stages of change (Pre-contemplation → Preparation), the
  client benefits from experiential processes — increasing awareness, exploring thoughts
  and feelings. In the later stages (Action, Maintenance), the client needs behavioural
  processes — commitment, environmental cues, taking action. Matching process to stage
  is the coach's core skill.
evidence_tier: strong
rationale: Coach-facing takeaway distilled from the live-call reflection; ready for
  use in briefings and sessions.
coaching_translation: If a Pre-contemplator asks for a meal plan, back up — they need
  awareness before action.
