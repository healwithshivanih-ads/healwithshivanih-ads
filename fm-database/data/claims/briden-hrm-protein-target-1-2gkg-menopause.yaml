slug: briden-hrm-protein-target-1-2gkg-menopause
statement: Menopausal women need ~1.2 g protein per kg ideal body weight per day (up
  from ~1.0 g/kg in reproductive years) just to maintain muscle mass against the loss
  of estrogen's anabolic effect. For a 65 kg woman that's ~78 g/day = ~26 g per meal,
  or 20 g × 3 meals + a protein snack. High-intensity exercisers and women with insulin
  resistance need more still.
evidence_tier: strong
