slug: glucose-response-varies-by-menstrual-cycle-phase
statement: Blood glucose varies systematically across the menstrual cycle, peaking
  in the luteal phase and declining in the late-follicular phase, independently of
  step count, cravings, fatigue or sleep.
evidence_tier: plausible_emerging
rationale: A study of 49 participants combining continuous glucose monitoring, activity
  tracking and daily urinary hormone testing found the association held after
  accounting for behavioural confounders, which earlier calendar-recall studies could
  not do.
coaching_translation: Your blood sugar behaves differently in the two halves of your
  cycle — that is physiology, not willpower.
