slug: briden-hrm-oral-progesterone-strongly-sedating
statement: Oral micronised progesterone (100–300 mg) is strongly sedating because
  it converts to allopregnanolone, a neurosteroid that activates GABA receptors —
  so it MUST be taken at bedtime or the client will feel groggy. Progesterone also
  improves deep-sleep architecture directly, reduces mast-cell activation / histamine,
  and unlike sleeping tablets does not impair the breathing reflex (safe with other
  sleep meds).
evidence_tier: strong
