out_of_scope_notes: 'Coach scope: magnesium-rich foods and noticing the dietary pattern. Clinician scope: any supplemental magnesium in cardiac or renal disease, its dose and form, and all lab interpretation. IV magnesium is hospital-only and must never be discussed as an option.'
