out_of_scope_notes: >
  Recommending or dosing bilberry, ginkgo, grape seed or pine bark extract is
  clinician scope — ginkgo in particular has a bleeding-risk profile that makes it
  genuinely unsafe to suggest without knowing the client's full medication list, and
  many older Indian clients with ARMD are on aspirin or an anticoagulant for
  cardiovascular reasons. A coach may encourage flavonoid-rich whole foods freely, may
  explain why the ophthalmologist or physician might consider an extract, and should
  proactively surface any anticoagulant use to the treating clinician if a client is
  already self-medicating with ginkgo.
