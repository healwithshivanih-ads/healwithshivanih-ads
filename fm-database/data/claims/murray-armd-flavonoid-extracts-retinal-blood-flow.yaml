slug: murray-armd-flavonoid-extracts-retinal-blood-flow
statement: |
  The chapter frames ARMD as free-radical damage to the macula (the same class of
  damage that drives cataract) layered on top of reduced blood and oxygen supply to
  the retina — and names the perfusion deficit, not the oxidation, as the key factor.
  That is the rationale for the botanical layer. Murray & Pizzorno position
  flavonoid-rich extracts — bilberry, ginkgo biloba, grape seed and pine bark
  (Pycnogenol) — as working on that second half of the mechanism: not just antioxidant
  capacity but retinal blood flow and function. They report human studies in which all
  three
  halted the progressive visual loss of dry ARMD and possibly improved visual
  function. Bilberry standardised to 25% anthocyanidins is presented as the pick of
  the three because its anthocyanosides have strong affinity for the retinal pigmented
  epithelium — the exact tissue that degenerates in ARMD. Ginkgo (24% flavonglycosides)
  is the preferred choice where the client also shows signs of reduced cerebral blood
  flow. Doses given: ginkgo 120–240 mg/day, bilberry 120–240 mg/day, grape seed or pine
  bark (95% procyanidolic) 150–300 mg/day — one of the three, not all three.
evidence_tier: fm_specific_thin
rationale: >
  The mechanism is coherent and the tissue-affinity argument for bilberry is a genuine
  pharmacological point rather than hand-waving. But the clinical support is asserted,
  not shown: the chapter cites a block of four references (27–30) for "clinical studies
  of humans have demonstrated that all three are also capable of halting the
  progressive visual loss," gives no trial sizes, durations, designs or effect sizes,
  and the phrase "possibly even improving visual function" is doing a lot of hedging.
  The word "three" against four named botanicals is itself loose. Tiered
  fm_specific_thin: this is characteristic naturopathic practice with plausible
  mechanism and thin, unspecified clinical backing.
coaching_translation: >
  Beyond antioxidants, this chapter leans on concentrated berry and plant extracts —
  bilberry, ginkgo, grape seed, pine bark — because they are thought to improve blood
  flow into the small vessels feeding the retina, and poor blood supply is a big part
  of why the macula degenerates. Bilberry is their first pick because its pigments
  stick specifically to the layer of the eye that ARMD damages. Only one of these is
  used at a time, not a stack. This is a supplement decision, so it belongs with the
  client's doctor — but the food-level version is free and safe: dark berries (jamun,
  black grapes, blueberries, blackberries, falsa), pomegranate, and generally the
  deep purple-blue end of the produce shelf.
caveats:
- Ginkgo biloba has real bleeding risk — it must not be combined with warfarin,
  clopidogrel, aspirin or DOACs, and should be stopped before surgery. It also
  interacts with some SSRIs and anticonvulsants.
- Grape seed and pine bark extracts have mild antiplatelet activity; same caution.
- Bilberry at extract doses may affect blood glucose; watch in clients on insulin or
  sulfonylureas.
- Standardisation matters and Indian retail products frequently under-deliver the
  stated anthocyanidin or flavonglycoside percentage — a real quality risk.
- Nothing here substitutes for anti-VEGF treatment in wet ARMD.
