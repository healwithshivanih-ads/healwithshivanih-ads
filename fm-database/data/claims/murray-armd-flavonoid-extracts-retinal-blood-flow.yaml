  location: Chapter 74 — Macular Degeneration, pg 1219
  quote: >-
    The degeneration appears to be a result of free radical damage, similar to the
    type of damage that induces cataracts (see the chapter “Cataracts”). However,
    decreased blood and oxygen supply to the retina is the key factor leading to
    macular degeneration.
- id: murray-pizzorno-2012-encyclopedia
  location: Chapter 74 — Macular Degeneration, pg 1226
  quote: >-
    Flavonoid-rich extracts of bilberry (Vaccinium myrtillus), ginkgo biloba, grape
    seed, or pine bark (e.g., Pycnogenol) offer signiﬁcant beneﬁts in the prevention
    and treatment of ARMD. In addition to exerting excellent antioxidant activity, all
    of these extracts have been shown to have positive effects on retinal blood ﬂow
    and function.
