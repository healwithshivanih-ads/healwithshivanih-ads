slug: fmca-m2-dont-plan-if-low-confidence
statement: Self-efficacy is essential to successful change. If the client is low in
  confidence, don't rush into planning — instead, evoke confidence first (past successes,
  small wins, strengths). Premature planning with low confidence sets the plan up
  to fail.
evidence_tier: strong
rationale: Coach-facing takeaway distilled from the live-call reflection; ready for
  use in briefings and sessions.
coaching_translation: Ask 'on a scale of 1-10, how confident are you?' — if under
  6, pause and evoke confidence.
