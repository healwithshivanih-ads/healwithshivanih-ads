slug: murray-cabbage-juice-glutamine-and-brassica-for-ulcer-healing
statement: |
  Raw cabbage juice is the chapter's flagship food intervention for peptic ulcer:
  documented since 1949, one litre per day of fresh juice in divided doses produced
  total ulcer healing in an average of 10 days. The active principle is thought to
  be glutamine, which feeds mucin synthesis and so rebuilds the protective layer
  rather than blocking acid. A double-blind study of 57 patients using 1.6 g/day
  glutamine beat conventional therapy (antacids, antispasmodics, milk, bland diet):
  half healed within two weeks and 22 of 24 within four. Separately, sulforaphane
  from brassicas is active against H. pylori — broccoli sprouts at 70 g/day for
  eight weeks lowered H. pylori and gastric inflammation markers, though values
  returned to baseline two months after stopping.
evidence_tier: plausible_emerging
rationale: >
  Three different quality levels are stacked here and should not be flattened. The
  1949 cabbage-juice work (refs 15, 16) is uncontrolled, pre-endoscopy, and used
  radiographic healing — remarkable but not modern evidence. The glutamine trial
  (ref 17) is double-blind with a plausible mucin-synthesis mechanism but small and
  old, and the authors admit the mechanism is unproven. The broccoli-sprout study
  (ref 18) is the strongest limb: randomised, double-blind, with an active-looking
  placebo (alfalfa sprouts), though it reduced MARKERS and did not eradicate the
  organism, and the effect washed out after stopping. Tiered plausible_emerging —
  genuinely promising, food-based, low-risk, but nowhere near eradication-grade.
coaching_translation: >
  The kitchen has real tools here. Fresh raw cabbage juice is the oldest and
  best-documented one — the original work used about a litre a day split across the
  day, which is a lot, so most people start much smaller and build. What makes it
  work seems to be an amino acid called glutamine that helps your stomach rebuild
  its protective lining, which is a very different idea from just blocking acid.
  Broccoli sprouts help too, in a different way: they contain a compound that
  suppresses the H. pylori bacterium — but only while you keep eating them, so it
  is a habit, not a course. Cabbage, broccoli, cauliflower and mustard greens all
  belong to the same family and all fit an Indian vegetarian plate easily.
caveats:
- |-
  A litre a day of raw cabbage juice causes significant gas and bloating in most people and is impractical long-term — start at a small glass and build, and stop if it aggravates
- |-
  Raw cabbage is goitrogenic in quantity; in a client with thyroid disease this needs the doctor's awareness, especially at juice-level volumes
- |-
  Broccoli sprouts must be grown and rinsed hygienically — sprouts are a recognised food-safety risk, which matters more in a warm Indian climate
- |-
  The sulforaphane effect reversed within two months of stopping — it suppresses, it does not eradicate, and it is not a substitute for prescribed eradication therapy
- |-
  Supplemental glutamine is a separate decision from cabbage juice and should be cleared with the doctor in anyone with liver or kidney disease
linked_to_topics: [peptic-ulcer-disease, h-pylori-infection, gastrointestinal-tract-overview]
linked_to_supplements: [l-glutamine, sulforaphane-broccoli-sprouts, sulforaphane]
linked_to_mechanisms: [gastric-mucin-degradation, gastric-mucosal-barrier-disruption, h-pylori-mucosal-defense-breakdown]
out_of_scope_notes: >
  Recommending cabbage juice, broccoli sprouts and brassica-rich meals is food
  coaching and in scope. Recommending a specific therapeutic dose of supplemental
  L-glutamine is a supplement recommendation and should be routed through the
  client's doctor, particularly alongside prescribed therapy. Never position any of
  this as a replacement for H. pylori eradication.
