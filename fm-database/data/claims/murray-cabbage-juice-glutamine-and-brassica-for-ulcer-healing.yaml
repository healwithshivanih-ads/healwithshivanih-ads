  location: Chapter 83 — Peptic Ulcer, pg 1379
  quote: |-
    Raw cabbage juice was ﬁrst documented as having remarkable success in treating peptic ulcers in 1949.15,16 One liter per day of the fresh juice, taken in divided doses, resulted in total ulcer healing in an average of only 10 days. Further research has shown that the high glutamine content of the juice is probably responsible for its efﬁcacy in treating ulcers.
- id: murray-pizzorno-2012-encyclopedia
  location: Chapter 83 — Peptic Ulcer, pg 1379
  quote: |-
    In a double-blind clinical study of 57 patients, 24 using 1.6 g per day of glutamine and the rest using conventional therapy (antacids, antispasmodics, milk, and a bland diet), glutamine proved to be the more effective treatment. Half of the patients using glutamine showed complete healing (according to radiographic analysis) within two weeks, and 22 of the 24 showed complete relief and healing within four weeks.17
- id: murray-pizzorno-2012-encyclopedia
  location: Chapter 83 — Peptic Ulcer, pg 1380
  quote: |-
    48 H. pylori–infected patients were randomly assigned to consume broccoli sprouts (70 g per day for eight weeks), which contain sulforaphane, or to consume an equal amount of alfalfa sprouts, which do not contain sulforaphane, as a placebo. Broccoli sprouts decreased markers for both H. pylori and gastric inﬂammation. Values returned to their original levels two months after treatment was discontinued.18
