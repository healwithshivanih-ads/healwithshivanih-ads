slug: ggt-inversely-tracks-antioxidant-status
statement: People with higher GGT, even within the normal range, have lower blood levels of carotenoids (alpha- and beta-carotene, lycopene, lutein) and vitamin C, which fits GGT being an early marker of oxidative stress.
evidence_tier: plausible_emerging
rationale: Connects a routine liver number to a coachable behaviour (colourful plants) and explains why GGT is read as an oxidative-stress signal.
coaching_translation: A borderline GGT is a good prompt to look at how many coloured vegetables and fruits the client eats each day. Aim for orange, red and dark-green foods daily (carrot, pumpkin, papaya, tomato, amla, greens) and re-check GGT in 6-8 weeks.
out_of_scope_notes: ''
caveats:
- Cross-sectional (NHANES III); it does not show that eating more carotenoids lowers GGT.
- Vitamin E showed no link.
- Food, not pills; in CARDIA, vitamin supplement use went with HIGHER GGT.
