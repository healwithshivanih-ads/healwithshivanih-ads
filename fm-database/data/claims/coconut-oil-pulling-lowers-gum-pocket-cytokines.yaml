caveats:
- >-
    CRITICAL SCOPE LIMIT - these cytokines were measured in GINGIVAL CREVICULAR
    FLUID, i.e. locally within the gum pocket, NOT in serum. This demonstrates
    reduced LOCAL inflammation. It does not by itself demonstrate reduced systemic
    inflammatory burden, and it must not be used to claim an effect on systemic or
    autoimmune disease. n=10 per arm.
coaching_translation: >-
  Coconut oil pulling calmed inflammation in the gum tissue itself, and did so
  better than a standard antiseptic mouthwash. Whether that translates into
  anything measurable elsewhere in the body has not been shown.
rationale: >-
  This is the single hard data point people reach for when arguing oil pulling
  helps systemic or thyroid conditions. Recording the GCF-not-serum distinction
  explicitly is the point of this entry - it is the exact place the inference
  overreaches. See coach-observation-oil-pulling-reflux-and-thyroid.
