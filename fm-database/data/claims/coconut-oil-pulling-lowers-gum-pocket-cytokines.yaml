slug: coconut-oil-pulling-lowers-gum-pocket-cytokines
statement: >-
  In the same triple-blind periodontitis trial, coconut oil pulling significantly
  reduced inflammatory cytokines in gingival crevicular fluid - IL-6 fell by 72.4
  pg/mL (p=0.021) and TNF-alpha fell (p=0.021) from baseline to final measurement.
  Chlorhexidine produced no significant cytokine reduction. Coconut oil was
  superior to placebo for IL-6 between months one and three (p=0.027) and for
  TNF-alpha overall (p=0.045).
evidence_tier: plausible_emerging
