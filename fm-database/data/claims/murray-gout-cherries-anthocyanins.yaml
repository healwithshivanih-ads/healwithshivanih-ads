out_of_scope_notes: Suggesting cherries and deep-coloured fruit as food is in scope. Recommending cherry, grape seed, pine bark or EMIQ extract doses is a supplement recommendation and sits with the clinician, as does any decision about a client's existing vitamin C or niacin dose.
