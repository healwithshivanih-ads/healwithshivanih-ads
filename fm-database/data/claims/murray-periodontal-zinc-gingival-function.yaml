out_of_scope_notes: >
  Teaching zinc-rich foods, and the soaking/sprouting/fermenting practices that
  improve zinc bioavailability in an Indian vegetarian diet, is core coach work.
  Recommending 30–45 mg/day supplemental zinc is prescribing and must come from the
  clinician, particularly because of the copper-depletion risk. Any medicated mouth
  rinse is dentist or physician territory.
