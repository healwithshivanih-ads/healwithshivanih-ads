    The functions of zinc in the gingiva and periodontium include stabilization of membranes, antioxidant activity, collagen synthesis, inhibition of plaque growth, inhibition of mast-cell degranulation, and numerous immune-enhancing activities.17–20 Zinc is also known to signiﬁcantly reduce wound healing time. Plaque growth can be inhibited by the use twice per day of a mouthwash that contains 5% zinc.19
