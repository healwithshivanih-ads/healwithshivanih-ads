sources:
- id: murray-pizzorno-2012-encyclopedia
  location: Chapter 84 — Periodontal Disease, pg 1389
  quote: >-
    Numerous local factors favor the progression of periodontal disease. These include food residue, unreplaced missing teeth, malocclusion, tongue thrusting, bruxism (grinding of the teeth), toothbrush trauma, mouth breathing, and tobacco smoking. Tobacco smoking is associated with increased susceptibility to severe periodontal disease and tooth loss.1,7,8 Many of the harmful effects of smoking are a result of free radical damage.
- id: murray-pizzorno-2012-encyclopedia
  location: Chapter 84 — Periodontal Disease, pg 1395
  quote: >-
    Since there are as yet no clear guidelines for determining which factors are most important for any given person, a general approach is recommended here. If you are a smoker, we strongly encourage you to stop, as continued smoking greatly decreases the success of any therapy for periodontal disease.
