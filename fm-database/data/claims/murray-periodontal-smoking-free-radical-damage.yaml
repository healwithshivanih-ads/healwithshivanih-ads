out_of_scope_notes: >
  Smoking and tobacco cessation coaching is core NBHWC-track coach work and is the
  highest-leverage action available here. Prescribing nicotine replacement or
  varenicline is clinician scope. Assessing bruxism, malocclusion or any oral lesion,
  and all periodontal treatment, is dentist scope — refer.
