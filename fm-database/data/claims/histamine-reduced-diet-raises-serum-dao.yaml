slug: histamine-reduced-diet-raises-serum-dao
statement: In histamine intolerance, following a histamine-reduced diet was linked with symptom improvement
  and a rise in serum DAO that tracked how closely the diet was followed.
evidence_tier: plausible_emerging
rationale: Supports a time-limited low-histamine trial with good adherence before deciding it 'doesn't
  work'.
coaching_translation: Sticking closely to the lower-histamine foods for a few weeks gives your body the
  best chance to settle, and it's how we learn whether histamine is part of the picture.
out_of_scope_notes: ''
caveats:
- Lackner 2019 (small study) and Cucca 2022 (retrospective) as cited by IFM.
