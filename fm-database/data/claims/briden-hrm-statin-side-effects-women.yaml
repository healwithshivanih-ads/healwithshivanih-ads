slug: briden-hrm-statin-side-effects-women
statement: 'Statins have reasonable evidence for SECONDARY prevention (after a heart
  attack), thin evidence for PRIMARY prevention (number-needed-to-treat as high as
  400). Women are more likely than men to experience statin side effects: muscle pain,
  insulin resistance, type 2 diabetes, fatigue, memory loss and insomnia. High cholesterol
  can also be a symptom of untreated hypothyroidism — screen thyroid first. Coach:
  if the client has no family history of heart disease and only isolated high cholesterol,
  help her advocate for a CAC scan and cardiology referral before starting a statin.'
