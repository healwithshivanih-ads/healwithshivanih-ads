out_of_scope_notes: >
  Choosing between oral and injectable B12, setting the dose, selecting the form and
  monitoring the response are entirely clinician scope — this claim is dose-bearing and must
  never be delivered to a client as a recommendation. Coach scope: knowing that an
  evidence-supported oral option exists so that a client struggling with injections can be
  encouraged to ask their doctor about it, and supporting adherence to whatever regimen the
  doctor sets.
sources:
- id: murray-pizzorno-2012-encyclopedia
  location: Chapter 21 — Anemia, pg 474
  quote: >-
    It has been established that the average absorption rate of oral cyanocobalamin by
    patients with pernicious anemia is 1.2% across a wide range of dosages. Thus an oral
    dosage of 100 to 250 mcg per day results in a average absorption of 1.2 to 3 mcg,
    respectively—a dosage that is sufﬁcient for many, but not all, patients.
- id: murray-pizzorno-2012-encyclopedia
  location: Chapter 21 — Anemia, pg 475
  quote: >-
    For oral vitamin B12, the recommended dosage is 2,000 mcg per day (14,000 mcg weekly) for
    at least one month, followed by a daily intake of 1,000 mcg. Methylcobalamin, the active
    form of B12, is preferred over cyanocobalamin.
