slug: murray-oral-b12-effective-without-intrinsic-factor
statement: |
  High-dose oral B12 works even when intrinsic factor is absent, because roughly 1.2% of an
  oral dose is absorbed by passive diffusion regardless of intrinsic factor — an average
  absorption rate the book reports holds across a wide range of dosages in patients with
  pernicious anemia. This is why the early low-dose trials (100–250 mcg/day, giving only
  1.2–3 mcg absorbed) looked unreliable, and why adequate dosing changes the picture: the
  chapter cites a 1978 study of 64 Swedish patients given 1,000 mcg oral cyanocobalamin daily
  in whom serum levels, liver stores and clinical remission all normalised over three years.
  The book's recommendation is 2,000 mcg/day for at least one month, then 1,000 mcg/day, and
  it prefers methylcobalamin — an immediately active form — over cyanocobalamin, which must be
  converted in the body.
evidence_tier: strong
rationale: >
  The passive-diffusion route for cobalamin absorption is established physiology, and the
  clinical equivalence of adequately dosed oral B12 to intramuscular injection in pernicious
  anemia has since been confirmed by randomised trials and Cochrane review — this has moved
  from a contrarian position in 2012 to mainstream practice. The book cites references 6 and
  7, names the 1978 Swedish cohort with its size and follow-up, and gives the specific 1.2%
  absorption figure. The weaker parts are rhetorical rather than evidential: the flat claim
  that oral therapy is "fully (100%) effective" overstates a cited source, and the preference
  for methylcobalamin over cyanocobalamin is a mechanistic argument, not an outcome
  comparison — head-to-head clinical superiority is not demonstrated here.
coaching_translation: >
  If a client has been told they must have B12 injections for life, it is worth them knowing
  that high-dose tablets have been shown to work too — including for people whose stomach
  cannot absorb B12 the normal way, because a small fixed percentage gets through by simple
  diffusion at high doses. The dose has to be high enough; small doses are what made oral B12
  look unreliable in the past. This is a genuinely useful thing for clients who dislike
  injections, live far from a clinic, or find the repeat visits costly — but it is a
  conversation for them to have with their doctor, not a switch to make on their own.
caveats:
- Switching from injectable to oral B12 is a prescribing decision and must be made and
  monitored by the client's doctor, with follow-up bloods. A coach raising it as a question
  is appropriate; a coach suggesting the change is not.
- Doses of 1,000–2,000 mcg/day are therapeutic doses, not maintenance nutrition. Do not quote
  them to a client as a general recommendation.
- Sublingual and plain oral tablets perform similarly; the advantage is dose, not route of
  the tablet.
- The cost argument in the chapter is US-specific (US$20–100 per injection administration) and
  does not transfer to Indian pricing, where injections are comparatively inexpensive. The
  convenience and adherence arguments do transfer.
- In neurological B12 deficiency, initial parenteral treatment is often still preferred
  clinically. The chapter does not make this distinction.
