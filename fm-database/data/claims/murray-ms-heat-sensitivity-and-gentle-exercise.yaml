out_of_scope_notes: 'Coach scope: this is the strongest coaching surface in the chapter - behaviour change
  around gentle regular movement, pacing, cooling strategies, and stress-reduction practice. Out of scope:
  prescribing exercise for someone with significant gait, balance or spasticity impairment (physiotherapist),
  and any judgement about whether a new symptom is heat or relapse (neurologist, same day).'
