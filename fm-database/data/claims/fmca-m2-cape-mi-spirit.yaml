slug: fmca-m2-cape-mi-spirit
statement: 'The ''spirit'' of MI is captured in the coach''s CAPE: Compassion, Acceptance,
  Partnership, and Empowerment. Skills without spirit collapse into technique; skills
  with spirit build a working alliance where change can happen. The coach carries
  the CAPE into every task, not just Engaging.'
evidence_tier: strong
rationale: The spirit is what distinguishes MI from ordinary conversation — coaches
  who skip it slip into fixing.
coaching_translation: Before opening the session, name the CAPE for yourself. Notice
  which of the four is easiest and which needs work today.
