slug: briden-hrm-mast-cell-histamine-in-perimenopause
statement: High perimenopausal estrogen directly stimulates mast cells and downregulates
  the DAO enzyme that clears histamine — creating a vicious cycle where estrogen raises
  histamine and histamine feeds back to raise estrogen. Many symptoms attributed to
  'estrogen dominance' (PMS-like irritability, insomnia, migraines, hives, heavy periods)
  are actually mast-cell / histamine symptoms and respond to antihistamine measures.
