out_of_scope_notes: >
  Diagnosis, sizing, imaging, and management of fibroids are gynaecology scope. The coach's
  scope is education about oestrogen physiology and support for diet, bowel regularity,
  weight and toxin-exposure habits that plausibly influence oestrogen load — always alongside,
  never instead of, the client's gynaecologist.
