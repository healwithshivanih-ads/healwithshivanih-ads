slug: fmca-m3-body-mind-bidirectional
statement: The body and mind are integrated, and communication runs both ways. Positive
  emotions and optimism measurably influence physical health markers; physical states
  (posture, movement, breathing, illness) measurably influence mood and cognition.
  Coaching that ignores either direction leaves leverage on the table.
evidence_tier: strong
rationale: Coach-facing takeaway distilled from the live-call reflection; ready for
  use in briefings and sessions.
coaching_translation: Coach both. When physical symptoms are unmoving, ask about emotional
  state. When mood is stuck, ask about sleep, movement, breath.
