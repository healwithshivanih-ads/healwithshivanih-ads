out_of_scope_notes: >
  Suggesting green tea as a daily drink is coach scope. Recommending 100–300 mg
  standardised grape seed, pine bark or green tea extract is prescribing, and the
  antiplatelet and hepatotoxicity signals make clinician sign-off necessary — more so
  before any dental surgery. The periodontal treatment itself stays with the dentist.
