slug: fmca-m3-smart-inside-client-centred-model
statement: SMART goals only work when generated inside a client-centred model — otherwise
  they become a coach's prescription. The client-centred model rests on rapport, trust,
  self-awareness, and the client choosing what to work on; SMART formatting comes
  after that, not before.
evidence_tier: strong
rationale: Coach-facing takeaway distilled from the live-call reflection; ready for
  use in briefings and sessions.
coaching_translation: Never open a session with 'let's SMART-goal this'. The client
  tells you what matters first; you help them shape it.
