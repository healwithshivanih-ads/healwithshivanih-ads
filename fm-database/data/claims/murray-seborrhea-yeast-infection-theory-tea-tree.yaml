out_of_scope_notes: >
  Coach scope: explaining that the cause is genuinely unsettled, discussing over-the-counter
  medicated shampoo options as something to raise with their doctor, patch-test safety, and
  realistic expectations about recurrence. Clinician scope: diagnosing the rash, prescribing
  topical antifungals or steroids, and any assessment of immune status. Referral boundary:
  seborrheic dermatitis of sudden, severe or explosive onset in an adult — or seborrheic
  dermatitis with unexplained weight loss, fever, thrush, or new tremor/stiffness — is a
  medical referral for underlying illness, including HIV and Parkinson's disease. The AIDS
  association is the chapter's; the Parkinson's and explosive-onset framing is not, and is
  included here as standard practice, not as the book's statement.
