slug: murray-seborrhea-yeast-infection-theory-tea-tree
statement: |
  Murray & Pizzorno state plainly that the cause of seborrheic dermatitis is unknown, and list
  genetic predisposition, emotional stress, diet, hormones and infection with yeast-like
  organisms as all having been implicated. They give one specific reason to weight the
  infection theory: seborrheic dermatitis is described as one of the most common manifestations
  of AIDS, affecting as many as 83% of AIDS patients — an immune-suppressed population in whom
  a yeast overgrowth would be expected to run unchecked. Consistent with that, the strongest
  numbers in the chapter are for a topical antifungal botanical: in a study of 126 patients,
  5% tea tree (Melaleuca alternifolia) oil shampoo produced a 41% improvement in severity
  versus 11% in the placebo group, and the authors say it is especially helpful when the scalp
  is involved. Their practical note is to use a tea tree shampoo or add roughly 1 tbsp of the
  oil per 8 oz of an existing shampoo.
evidence_tier: plausible_emerging
rationale: >
  The highest tier this short chapter earns, and only for the tea tree arm. The tea tree
  result is the one place the authors give a real controlled comparison with a sample size
  and a placebo arm (126 patients, 41% vs 11%), and it converges with the infection theory
  rather than merely asserting it. It stops short of "strong": one trial, on shampoo severity
  scores rather than clearance, with no replication cited and no long-term or relapse data,
  in a condition the book itself says has a prognosis of lifelong recurrence. Important
  honesty point — this chapter never names Malassezia (or Pityrosporum). It says only
  "yeast-like organisms". The modern identification of Malassezia as the relevant organism is
  not in this text and must not be attributed to it; what is in the text is an antifungal
  rationale and an antifungal-botanical trial that supports it.
coaching_translation: >
  Nobody has pinned down a single cause of seborrheic dermatitis — genes, stress, diet,
  hormones and a yeast that lives normally on skin have all been suggested. The clue that
  points to the yeast is that this rash becomes very common when the immune system is badly
  suppressed. That is why an antifungal shampoo often helps. In one study of 126 people, a 5%
  tea tree oil shampoo improved severity by about 41% versus 11% on placebo. A tea tree
  shampoo is a reasonable everyday self-care option a client can discuss with their doctor;
  the book's home version is about 1 tbsp of tea tree oil stirred into 8 oz of their usual
  shampoo. Patch-test first, keep it out of the eyes, and expect management rather than cure —
  this condition tends to come back.
caveats:
- Tea tree oil is a common contact allergen and irritant. Patch-test on the inner forearm
  first, keep it away from eyes and broken skin, and stop at any burning or worsening redness.
- Never swallowed. Tea tree oil is toxic if ingested — a real risk in homes with young children.
- Oxidised (old, heat- or light-exposed) tea tree oil is markedly more sensitising than fresh.
- Prescription antifungal and steroid preparations are clinician scope; a coach may not
  suggest a client swap off a prescribed treatment onto a shampoo.
- The chapter's AIDS statistic is an observation about disease association, not a screening
  tool. Do not use a client's rash to speculate about their HIV status — refer instead.
- The chapter says "yeast-like organisms" and never names Malassezia; do not tell a client
  the book identified the organism.
