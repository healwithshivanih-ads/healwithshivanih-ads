slug: fmca-m3-informed-consent-covers-scope
statement: Informed consent is the coach's core protective document. It names what
  coaching is and is not, the scope of the coaching relationship, confidentiality,
  fees, cancellation and communication norms. A signed consent form both protects
  the coach legally and educates the client on how the relationship works.
evidence_tier: strong
rationale: Coach-facing takeaway distilled from the live-call reflection; ready for
  use in briefings and sessions.
coaching_translation: Send the consent form BEFORE the first session. Read it together
  in the foundation session. Keep the signed copy in the client folder.
