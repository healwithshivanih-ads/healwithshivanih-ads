out_of_scope_notes: |
  Clinician: ordering and interpreting B6/folate/B12 status, deciding repletion
  route and dose. Coach: food sources, cooking patterns that preserve folate,
  and flagging low mood or neuropathic symptoms for medical review.
sources:
- id: murray-pizzorno-2012-encyclopedia
  location: 'Chapter 19 — Alcohol Dependence, pg 430'
  quote: 'A functional vitamin B6 (pyridoxine) deﬁciency is also common in alcoholics, due not so much to inadequate intake as to impaired conversion to its active form, pyridoxal-5-phosphate, and enhanced degradation.37 In addition to inhibiting conversion to more active forms, alcohol decreases the absorption and utilization by the liver and increases the urinary excretion of many B vitamins, especially folic acid.38'
