slug: briden-hrm-cac-scan-over-cholesterol
statement: 'Coronary artery calcium (CAC) scoring — a CT-based measure of actual plaque
  calcification — is currently the best test for predicting cardiovascular risk, and
  per Sydney cardiologist Ross Walker ''far more useful than a cholesterol test.''
  If the doctor is pressuring you to take a statin, request a CAC scan first: if you''re
  high-risk enough for a statin, you''re high-risk enough for a CAC. Cholesterol is
  a surrogate marker; CAC measures the actual disease.'
evidence_tier: strong
