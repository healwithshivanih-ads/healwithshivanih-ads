slug: ibs-four-times-more-likely-mast-cell-disorder
statement: In a US database of over 53 million patients, people with IBS were at least four times more
  likely than the general population to carry a primary or idiopathic mast cell disorder diagnosis, the
  strongest association found.
evidence_tier: plausible_emerging
rationale: IBS is the most common door into MCAS. A client with IBS plus flushing, hives, reactions to
  medicines or multisystem symptoms is worth flagging to the clinician.
coaching_translation: IBS and mast cell problems often travel together. If your gut symptoms come with
  skin, sinus or whole-body reactions, mention that to your doctor.
out_of_scope_notes: Coach flags the pattern; diagnosis belongs to the clinician.
caveats:
- Kurin et al., Neurogastroenterol Motil 2022 (database association, not causation); diagnosis coding
  of mast cell disorders is uneven.
