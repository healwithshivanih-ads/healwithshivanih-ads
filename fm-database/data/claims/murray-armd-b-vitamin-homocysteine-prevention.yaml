slug: murray-armd-b-vitamin-homocysteine-prevention
statement: |
  ARMD prevention is not only an antioxidant story — methylation status appears to
  matter too. In a randomised, double-blind, placebo-controlled trial of 5,442 female
  health professionals aged 40+ with existing cardiovascular disease or three or more
  CVD risk factors, a combination of folic acid 2.5 mg, vitamin B6 50 mg and vitamin
  B12 1 mg daily produced 55 cases of ARMD versus 82 on placebo over an average 7.3
  years, and 26 versus 44 cases of more severe ARMD — a 34% and 41% relative risk
  reduction respectively. The implied mechanism is homocysteine lowering and therefore
  better small-vessel/endothelial function in the retina, which fits the chapter's own
  claim that reduced blood and oxygen supply is the key driver of ARMD.
evidence_tier: plausible_emerging
rationale: >
  This is a large, long, properly randomised, placebo-controlled trial with a clear
  effect size, which is much better evidence than most of this chapter carries. Three
  things hold it back from a strong tier. It is a secondary outcome in a
  cardiovascular-prevention trial, not a trial designed to answer the ARMD question.
  The population is entirely women aged 40+ at elevated cardiovascular risk, so it
  does not generalise cleanly to low-risk adults or to men. And the chapter asserts
  the finding without naming the mechanism — homocysteine lowering is the obvious
  candidate but the chapter does not demonstrate it. The doses used are also
  therapeutic, not nutritional.
coaching_translation: >
  Alongside the antioxidant work, the B vitamins that control homocysteine — folate,
  B6 and B12 — showed a real protective effect on the eyes in a large seven-year trial
  in women at cardiovascular risk: roughly a third fewer cases of macular degeneration
  and about 40% fewer severe cases. That fits the bigger picture, because high
  homocysteine damages small blood vessels and the macula lives on very small blood
  vessels. In food terms for Indian clients that means daily dark leafy greens
  (palak, methi, chaulai), dals and rajma, beetroot and citrus for folate; and — this
  is the big one for vegetarians — B12, which simply is not available from plant food
  and quietly runs low in long-term vegetarian and vegan clients.
caveats:
- These are therapeutic doses (folic acid 2.5 mg is roughly six times the RDA), not a
  food or everyday-multivitamin conversation.
- 'High-dose synthetic folic acid is itself contested in functional medicine — it can
  mask B12 deficiency and, in people with reduced MTHFR activity, may accumulate as
  unmetabolised folic acid. Many practitioners would use methylfolate and
  methylcobalamin instead; the trial did not test that.'
- Never give folate without adequate B12, especially in a vegetarian Indian population
  where B12 deficiency is common — masked deficiency can progress to irreversible
  neurological damage.
- 'The chapter''s own treatment summary prints a folic acid dose of "800 to 2,000 mg
  per day", which is a units error in the source (mcg is meant). Do not repeat that
  figure.'
- Findings come from women 40+ with cardiovascular risk; do not extrapolate to a
  low-risk 30-year-old.
