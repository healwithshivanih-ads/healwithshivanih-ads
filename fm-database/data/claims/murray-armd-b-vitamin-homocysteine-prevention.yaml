    randomly received a combination of folic acid (2.5 mg per day), vitamin B6 (50 mg
    per day), and vitamin B12 (1 mg per day) or a placebo. After an average of 7.3
    years of treatment and follow-up, there were 55 cases of ARMD in the combination
    treatment group and 82 in the placebo group. There were 26 cases of more severe
    ARMD in the combination treatment group and 44 in the placebo group. These results
    indicate a 34% and 41% reduced relative risk, respectively.
