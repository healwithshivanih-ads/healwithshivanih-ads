out_of_scope_notes: >
  Ordering or interpreting homocysteine, serum B12, MMA or folate results is clinician
  scope, as is deciding on 2.5 mg folic acid or any therapeutic B-vitamin regimen —
  and so is the judgement call between folic acid and methylfolate. Coaching scope is
  food-level: building folate-rich meals, flagging long-term vegetarian or vegan diet
  as a B12 risk worth testing, and raising the question with the client's doctor. A
  coach must not start a client on high-dose folate, and must never reassure a client
  that a normal serum B12 rules out deficiency.
