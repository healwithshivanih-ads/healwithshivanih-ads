slug: briden-hrm-gluten-free-for-hashimotos
statement: Gluten-free diet significantly improves Hashimoto's — up to 15% of Hashimoto's
  patients have undetected celiac disease, and up to 50% have the celiac genes HLA-DQ2/DQ8
  with gluten-induced intestinal permeability. Strictly gluten-free (not 'reduced
  wheat') for at least 8 weeks trial. This is DIFFERENT from FODMAP sensitivity —
  gluten sensitivity presents with autoimmunity, migraines, psoriasis, brain fog;
  FODMAP sensitivity presents with digestive bloating.
evidence_tier: strong
