slug: fmca-m2-darn-cat-change-talk
statement: 'Change talk has two phases: preparatory (Desire, Ability, Reasons, Need
  — DARN) and mobilising (Commitment, Activation, Taking steps — CAT). The coach evokes
  DARN in Evoking and listens for the shift into CAT as the signal to move into Planning.'
evidence_tier: strong
rationale: Coach-facing takeaway distilled from the live-call reflection; ready for
  use in briefings and sessions.
coaching_translation: 'Track the language shift: when a client moves from ''I could''
  or ''I want to'' into ''I will'' — plan.'
