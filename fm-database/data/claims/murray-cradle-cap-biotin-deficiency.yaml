out_of_scope_notes: >
  Coach scope: explaining what cradle cap is, normalising it for an anxious parent, supporting
  the mother's own nutrition and gut health, and gentle non-medicated scalp care habits.
  Clinician scope: diagnosing the rash, prescribing or dosing any infant supplement, and all
  topical antifungals and steroids. Referral boundary that this chapter does not state and
  should not be attributed to it: seborrheic dermatitis of sudden, severe or explosive onset
  in an ADULT can flag underlying illness — including HIV and Parkinson's disease — and is a
  medical referral, not a coaching case. The chapter does note the AIDS association separately.
