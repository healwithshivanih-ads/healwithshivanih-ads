out_of_scope_notes: >
  Coach scope: hydration habits, meal size and timing, tolerance-led food choices, a temporary
  trial of reducing lactose, and supporting the client to report symptoms to their doctor.
  Clinician scope: identifying the cause of diarrhoea, stool testing, treating opportunistic
  infections, changing or managing antiretroviral side effects, diagnosing coeliac disease, and
  prescribing anti-diarrhoeal or rehydration therapy. A coach must never suggest that a
  medication side effect is a reason to stop the medication.
