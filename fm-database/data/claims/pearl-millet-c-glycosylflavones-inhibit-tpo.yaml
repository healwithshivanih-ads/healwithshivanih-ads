slug: pearl-millet-c-glycosylflavones-inhibit-tpo
statement: The goitrogen in pearl millet (bajra) is not thiocyanate but a group of
  C-glycosylflavones — glycosylvitexin, vitexin and glycosylorientin — which inhibit
  thyroid peroxidase, the enzyme that iodinates thyroid hormone. Gaitan et al. reported
  inhibition of up to 85% of TPO activity in the porcine thyroid slice system. The
  thiocyanate hypothesis was tested first and discarded — measured thiocyanate in pearl
  millet fractions was insufficient to account for the observed goitrogenic effect.
evidence_tier: plausible_emerging
rationale: In vitro and animal mechanism work, well replicated, with a coherent human
  epidemiological counterpart (see pearl-millet-staple-intake-endemic-goitre). Tiered
  plausible_emerging rather than strong because the human dose-response in a
  supplemented, iodine-sufficient population has not been established, and because
  this entry was captured from abstracts rather than full text.
coaching_translation: Bajra's goitrogen works the way soy's does — by blocking the
  enzyme that makes thyroid hormone — not the way cabbage's does. That matters
  practically — cooking does not switch it off the way it switches off the goitrogens
  in raw cabbage or broccoli. Sustained dry heat (roasting) degrades it more than a
  brief boil. For a thyroid client, bajra is a rotation grain a couple of times a
  week, not the everyday roti flour.
caveats:
- Mechanism evidence is in vitro and animal; human dose-response is not established
- Captured from the abstract and a 2026 review — the full text was not retrievable
- Applies to pearl millet specifically; finger millet (ragi) carries roughly an order
  of magnitude less, and foxtail and little millet are reported negligible
