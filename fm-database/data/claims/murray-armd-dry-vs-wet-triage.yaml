out_of_scope_notes: >
  Determining which form a client has, staging it, deciding on or timing anti-VEGF
  injections or laser therapy, and interpreting an Amsler grid result are clinician
  scope. A coach may teach a client what the wavy-line symptom means and encourage
  prompt review, and may support nutrition alongside — but must never delay or
  substitute for ophthalmology referral, and must never suggest that nutritional
  support is an alternative to injections in the wet form.
sources:
- id: murray-pizzorno-2012-encyclopedia
  location: Chapter 74 — Macular Degeneration, pg 1220
  quote: >-
    Between 80 and 85% of people with ARMD have the dry form of the disease. The
    primary lesions are atrophic changes in the retinal pigmented epithelium (RPE),
    which composes the innermost layer of the retina.
- id: murray-pizzorno-2012-encyclopedia
  location: Chapter 74 — Macular Degeneration, pg 1220
  quote: >-
    The disease progresses slowly, and only central vision is lost; peripheral vision
    remains intact. It is rare for anyone to become totally blind from dry ARMD.
    Currently there is no standard medical treatment for this common form of ARMD,
    though the use of nutritional supplements designed to address the underlying
    oxidative damage is becoming the “unofﬁcial” standard of care.
- id: murray-pizzorno-2012-encyclopedia
  location: Chapter 74 — Macular Degeneration, pg 1221
  quote: >-
    Wet ARMD is also known as the neovascular form or advanced ARMD. It affects 5% to
    20% of people with ARMD. Wet ARMD is characterized by the growth of abnormal
    blood vessels. Because the disease can rapidly progress to a point at which laser
    surgery cannot be used, treatment should be performed as soon as possible. A
    common early symptom of wet ARMD is that straight lines appear wavy.
