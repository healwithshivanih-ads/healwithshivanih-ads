slug: murray-armd-dry-vs-wet-triage
statement: |
  ARMD splits into two forms that carry completely different urgency. The dry
  (atrophic) form accounts for 80–85% of cases, progresses slowly, takes only central
  vision while peripheral vision stays intact, and — per Murray & Pizzorno — has no
  standard medical treatment, which is why nutritional support aimed at the
  underlying oxidative damage has become the de facto standard of care. The wet
  (neovascular) form affects 5–20% of people with ARMD, is driven by abnormal blood
  vessel growth, and can progress fast enough that the window for laser treatment
  closes. The chapter's flagged early symptom of wet ARMD is that straight lines
  appear wavy — which makes that one symptom a same-week referral trigger, not a
  nutrition conversation.
evidence_tier: strong
rationale: >
  The dry/wet split, the approximate prevalence bands, the drusen/RPE-lipofuscin
  description and the wavy-line distortion symptom are standard ophthalmology
  teaching and are consistent across the chapter's cited references (1–3). The
  "unofficial standard of care" phrasing for nutritional supplementation in dry ARMD
  is the authors' own characterisation, not a guideline statement — but it is
  directionally accurate in that no drug is approved for dry ARMD and the AREDS-type
  formula is what is actually offered. Tiered strong for the clinical distinction;
  the supplement-as-standard-of-care framing is the softer part of the claim.
coaching_translation: >
  There are two kinds of macular degeneration and they behave very differently. The
  common kind ("dry") is slow — it blurs the centre of what you look at while the
  edges of your vision stay fine, and there is no drug for it, which is exactly why
  diet and targeted nutrients matter so much here. The less common kind ("wet")
  involves leaky new blood vessels and can move fast. The warning sign for the fast
  kind is that straight lines — a door frame, a window edge, lines of text — start to
  look bent or wavy. If a client ever describes that, the answer is "please see an
  eye specialist this week", full stop.
caveats:
- Wavy or distorted straight lines, a new dark spot in central vision, or a sudden
  drop in vision are urgent — refer, do not coach.
- Only an eye specialist can tell dry from wet; the two look similar to the client.
- 'The phrase "no standard medical treatment for dry ARMD" is not permission to promise
  that supplements will restore sight — the best-documented outcome is slowed
  progression.'
- Wet ARMD management (anti-VEGF injections such as ranibizumab, bevacizumab or
  pegaptanib, laser, radiation) is entirely ophthalmologist territory.
