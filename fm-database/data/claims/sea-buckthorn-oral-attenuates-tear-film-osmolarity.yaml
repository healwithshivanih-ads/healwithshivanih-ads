  quote: Compared with the placebo group, the increase in tear film osmolarity was
    significantly less in the sea buckthorn group when all participants were included
    (intention to treat, P = 0.04) and when only participants consuming the study
    products for at least 80% of the intervention days were included (per protocol,
    P = 0.02).
