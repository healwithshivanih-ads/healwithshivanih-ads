  location: Chapter 49 — Erectile Dysfunction, pg 904
  quote: |-
    Atherosclerosis of the penile artery is the primary cause of impotence in nearly half the men over the age of 50 who have erectile dysfunction.1,2 Atherosclerosis refers to a process of hardening of the artery walls due to a buildup of plaque containing cholesterol, fatty material, and cellular debris.
