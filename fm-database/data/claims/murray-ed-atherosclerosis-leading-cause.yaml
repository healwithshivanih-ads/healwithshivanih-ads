out_of_scope_notes: >
  Coach scope: the lifestyle change that reduces cardiovascular risk, and helping the
  client sustain it. Clinician scope: confirming a vascular cause, ordering ultrasound or
  lipid testing, interpreting results, and treating hypertension or dyslipidaemia.
