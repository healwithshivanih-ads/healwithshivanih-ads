slug: ukihca-hold-emotion-refer-when-beyond
statement: Coaches shouldn't bypass a client's low mood or body-image comments out
  of fear of going out of scope — acknowledge them ('I'm hearing you…'), gently check
  what's underneath, and refer to a therapist or mental-health professional when it
  exceeds coaching. Alongside that, stay action-oriented and highlight strengths.
  Rapport and safety build over time and are what let clients open up.
evidence_tier: strong
rationale: Coach-facing takeaway distilled from the live-call reflection; ready for
  use in briefings and sessions.
coaching_translation: Keep a warm referral list (2-3 therapists you trust) and offer
  it early rather than late.
