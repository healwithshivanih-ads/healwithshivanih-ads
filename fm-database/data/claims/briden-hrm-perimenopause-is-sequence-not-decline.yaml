slug: briden-hrm-perimenopause-is-sequence-not-decline
statement: Perimenopause is a describable sequence of hormonal events (losing progesterone
  first, then high fluctuating estrogen, then lower estrogen) — not the gradual decline
  it is often framed as. Understanding it as a sequence lets the coach match interventions
  to the phase the client is actually in.
evidence_tier: strong
