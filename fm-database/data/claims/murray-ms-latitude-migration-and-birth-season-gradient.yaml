- id: murray-pizzorno-2012-encyclopedia
  location: Chapter 78 — Multiple Sclerosis, pg 1279
  quote: It appears that the initial event in the development of MS may occur in early life. This statement
    is based on the observation that people who move from a low-risk area to a high-risk area before age
    15 have a higher risk of developing MS, whereas those who make the same move after age 15 retain their
    low risk.
- id: murray-pizzorno-2012-encyclopedia
  location: Chapter 78 — Multiple Sclerosis, pg 1281
  quote: These studies observe that there is a lower risk of MS for births occurring after October and
    a higher risk for MS for births occurring after May. The authors reporting these ﬁndings suggest that
    maternal levels of vitamin D levels during the third trimester of pregnancy may inﬂuence risk of MS
- id: murray-pizzorno-2012-encyclopedia
  location: Chapter 78 — Multiple Sclerosis, pg 1282
  quote: Of particular interest is a recent study showing that the MS protection afforded by being closer
    to the equator may not be due simply to increased vitamin D production.16 Apparently sun exposure
    itself is protective against MS, independent of increasing vitamin D levels.
