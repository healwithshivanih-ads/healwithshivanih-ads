out_of_scope_notes: 'Coach scope: explaining published epidemiology as general education, and supporting
  safe daily outdoor time. Out of scope: attributing an individual case of MS to any exposure, estimating
  anyone''s personal risk, or advising on childhood risk for a client''s children - that is a neurologist''s
  or physician''s conversation.'
