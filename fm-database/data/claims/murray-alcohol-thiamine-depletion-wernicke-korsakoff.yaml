out_of_scope_notes: |
  Clinician: diagnosing or excluding Wernicke-Korsakoff, ordering thiamine
  status, prescribing parenteral thiamine, managing withdrawal. Coach:
  food-first B1 sources, meal regularity, non-judgemental intake history, and
  prompt referral when neurological signs appear.
