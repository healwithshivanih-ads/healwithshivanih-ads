slug: ukihca-visioning-can-be-playful
statement: For clients who feel overwhelmed or 'too old' to dream, a literal 'what
  is your vision?' can close them down. Loosening it up with playful questions ('if
  you had an extra hour…', 'if everything on your wheel was a 10…') or gentle pre-work
  invites more. Vision also evolves — as rapport and safety grow, clients add to it.
  Being patient beats forcing a full vision in session one.
evidence_tier: plausible_emerging
rationale: Coach-facing takeaway distilled from the live-call reflection; ready for
  use in briefings and sessions.
coaching_translation: Offer the vision question two or three different ways over the
  first few sessions. Keep it playful.
