slug: glp1-weight-loss-lean-mass-and-muscle-share
statement: 'On GLP-1 therapy, a substantial share of weight lost is lean mass: in STEP 1 about 38% of the loss was
  lean body mass, with roughly 20% estimated to be skeletal muscle. Without structured strength training, muscle
  loss is estimated at about 10-15% of total weight reduction in women and 20-25% in men.'
evidence_tier: strong
rationale: Joint advisory of four professional societies summarising DXA body-composition data from STEP 1 and SURMOUNT-1.
coaching_translation: Not all the weight lost on these medicines is fat. Part of it is muscle, your metabolic engine,
  which is why protein and strength training matter from day one.
caveats:
- DXA lean mass includes water and organs, so it overstates true muscle loss.
- Muscle-share estimates are approximate.
