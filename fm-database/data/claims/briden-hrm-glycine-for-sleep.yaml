slug: briden-hrm-glycine-for-sleep
statement: Glycine (3–5 g taken 1 hour before bed) shortens time-to-fall-asleep and
  time-to-reach-slow-wave-sleep by lowering core body temperature and calming the
  brain via serotonin and melatonin support. Also builds collagen and supports insulin
  sensitivity. No known side effects. Naturally provided in magnesium glycinate —
  so a magnesium glycinate powder often single-handedly delivers both benefits.
