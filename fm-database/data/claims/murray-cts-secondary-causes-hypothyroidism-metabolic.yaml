out_of_scope_notes: >
  CLINICIAN: diagnosing the underlying metabolic, endocrine or inflammatory condition,
  ordering and interpreting thyroid and glycaemic labs, and performing nerve conduction
  studies. COACH: recognising the pattern, prompting the client to seek assessment, and
  supporting lifestyle work on the modifiable contributors (weight, glycaemic load, movement)
  once a clinician has taken the lead.
