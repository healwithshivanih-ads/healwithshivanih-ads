out_of_scope_notes: >
  Coach scope: lemon/lime water as a daily habit, and reducing the acid-forming load of the
  diet by shifting toward fruit and vegetables. Clinician scope: prescribing citrate salts,
  measuring 24-hour urinary citrate and urine pH, and any potassium-containing product for a
  client with kidney disease or on potassium-affecting medication.
