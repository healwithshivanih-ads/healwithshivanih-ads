slug: fmca-m2-continuing-the-paragraph
statement: The 'Continuing the Paragraph' complex reflection is when the coach voices
  what the client would say next — the unspoken next sentence. Done well it deepens
  the conversation and often surfaces the client's own change talk. Done clumsily
  it can feel like the coach is putting words in the client's mouth, so it's tentative
  and easily corrected.
evidence_tier: plausible_emerging
rationale: Coach-facing takeaway distilled from the live-call reflection; ready for
  use in briefings and sessions.
coaching_translation: 'Offer it in a softer voice, and welcome correction: ''and maybe...
  you''re wondering if it would even help?'' — pause.'
