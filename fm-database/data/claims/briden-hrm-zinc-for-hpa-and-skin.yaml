slug: briden-hrm-zinc-for-hpa-and-skin
statement: Zinc dials down cortisol and regulates the HPA axis, reduces prostaglandins
  (so relieves period pain, endometriosis, adenomyosis), and supports skin/hair/vaginal
  epithelium. Standard dose 30 mg with food (nausea if empty stomach); test with plasma
  zinc (healthy 11–23 μmol/L). Vegetarians and vegans should assume deficiency. Cap
  at 80 mg/day for max 3 months to avoid copper depletion.
evidence_tier: strong
