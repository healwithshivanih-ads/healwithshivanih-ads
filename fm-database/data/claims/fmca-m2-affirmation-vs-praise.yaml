slug: fmca-m2-affirmation-vs-praise
statement: 'An affirmation names a genuine strength or effort the client already has
  — it is not praise, cheerleading or a gold star. Simple affirmations acknowledge;
  complex affirmations link the strength to the client''s larger story or value. Watch
  the client''s response: strain or deflection means ease off.'
evidence_tier: strong
rationale: Coach-facing takeaway distilled from the live-call reflection; ready for
  use in briefings and sessions.
coaching_translation: Delete 'that's great' and 'good job' from your vocabulary. Try
  'you thought carefully about how you'd handle this' instead.
