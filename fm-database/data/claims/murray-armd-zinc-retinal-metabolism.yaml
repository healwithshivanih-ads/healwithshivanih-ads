out_of_scope_notes: >
  Dietary zinc optimisation and phytate-reducing food preparation are coaching scope.
  Supplemental zinc at therapeutic doses, the decision to pair it with copper, and any
  interpretation of a serum or RBC zinc result are clinician scope. A coach must not
  set a zinc dose for a client with ARMD, and must not tell a client already on an
  AREDS-type eye formula to add more zinc on top — that is how copper deficiency gets
  built by accident.
