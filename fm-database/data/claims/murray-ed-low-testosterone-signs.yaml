out_of_scope_notes: >
  Coach scope: recognising the symptom cluster well enough to encourage a medical
  conversation, and coaching sleep, strength training, alcohol and weight. Clinician
  scope: ordering and interpreting testosterone, LH, FSH and prolactin, diagnosing
  hypogonadism, and prescribing or monitoring testosterone or DHEA.
