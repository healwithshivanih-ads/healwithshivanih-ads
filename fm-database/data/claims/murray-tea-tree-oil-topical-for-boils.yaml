out_of_scope_notes: >
  Clinician scope - deciding whether a boil needs drainage or systemic antibiotics,
  and approving any topical on broken, facial or genital skin or in pregnancy. Coach
  scope - explaining what the book reports, teaching clean hands-off application and
  patch-testing, and reinforcing that the topical runs alongside the referral clock
  rather than instead of it.
