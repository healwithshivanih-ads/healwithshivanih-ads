  location: Chapter 49 — Erectile Dysfunction, pg 904
  quote: |-
    Atherosclerosis-related erectile dysfunction has been shown to be a risk factor for a heart attack or stroke.3 The process of atherosclerosis occurs systemically throughout the body, not just in the arteries supplying the heart or penis. Patients with diseased coronary arteries are much more likely to have erectile dysfunction than individuals without coronary disease.
