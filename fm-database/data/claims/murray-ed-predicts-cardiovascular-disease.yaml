out_of_scope_notes: >
  Coach scope: naming ED as a reason to seek cardiovascular and diabetes screening,
  and supporting the lifestyle work once a doctor has assessed him. Clinician scope:
  diagnosing vascular ED, ordering or interpreting lipids, glucose, penile Doppler or
  cardiac testing, and any decision about PDE5 inhibitors or cardiac treatment.
