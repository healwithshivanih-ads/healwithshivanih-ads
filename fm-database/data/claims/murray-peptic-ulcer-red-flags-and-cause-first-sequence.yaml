out_of_scope_notes: >
  Diagnosis, endoscopy, H. pylori eradication, and management of bleeding or
  perforation are entirely clinician scope. The coach's job is threefold: recognise
  and escalate red flags without hesitation, make sure the client actually has a
  doctor working the cause and not only the symptom, and own the lifestyle limbs —
  smoking cessation support, food triggers, stress and recovery, and a complete
  medication/OTC inventory the doctor can act on.
