slug: briden-hrm-endometriosis-is-immune-not-just-estrogen
statement: Endometriosis and adenomyosis are AFFECTED by estrogen but not CAUSED by
  it. Underlying driver is immune dysfunction — abnormal mast cells, altered cytokines,
  and (per 'bacterial contamination hypothesis') gut-derived LPS reaching the pelvis
  via intestinal permeability. That's why gluten-free / dairy-free / SIBO treatment
  / berberine / probiotics / curcumin / iodine all help — they reduce immune dysfunction,
  not estrogen. Suppressing estrogen with drugs relieves symptoms but has bone, mood
  and metabolic costs.
