out_of_scope_notes: >
  This is the heart of coaching scope — smoking cessation support, fat-quality and
  cooking-oil changes, adding fish or plant omega-3 foods, reducing packaged baked
  goods. What stays with the clinician: prescribing omega-3 at therapeutic doses
  (especially alongside anticoagulants or before surgery), advising on alcohol in
  anyone with liver disease or dependence history, and any statement about how much a
  given client's ARMD will or will not progress.
