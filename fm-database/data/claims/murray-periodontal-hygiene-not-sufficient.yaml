out_of_scope_notes: >
  Measuring gingival sulcus depth, diagnosing gingivitis versus periodontitis, scaling
  and root planing are dentist scope — the coach must not attempt or interpret any of
  these. Referral to a dentist, and following up that the client actually went, is a
  fully legitimate and expected coach action. The coach owns the nutrition, smoking-
  cessation and stress side of the plan only.
