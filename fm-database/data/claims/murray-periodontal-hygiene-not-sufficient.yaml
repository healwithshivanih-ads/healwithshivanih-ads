    Furthermore, the gingival ﬂuid (the ﬂuid found in the sulcus) provides a rich nutrient source for microorganisms. The clinical determination of the depth of the gingival sulcus is an important part of the diagnosis. Individuals who have periodontal disease should see their dentist no less than once every six months for proper evaluation and cleaning.
