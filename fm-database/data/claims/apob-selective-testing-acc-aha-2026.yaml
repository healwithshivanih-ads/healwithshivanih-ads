slug: apob-selective-testing-acc-aha-2026
statement: The 2026 ACC/AHA guideline supports measuring ApoB selectively - in cardiovascular-kidney-metabolic syndrome,
  type 2 diabetes, high triglycerides or known cardiovascular disease - to assess residual risk once LDL-C and non-HDL-C
  goals are met.
evidence_tier: strong
rationale: Major guideline recommendation (ACC/AHA multisociety, March 2026).
coaching_translation: ApoB counts the carriers themselves. It's most useful when triglycerides are high or there's
  diabetes - a very common Indian picture - so it's a test worth asking your doctor about.
caveats:
- Selective, not universal; the doctor decides when it adds information.
