out_of_scope_notes: >
  Deciding whether a client on an anticoagulant, antiplatelet or a CYP3A4-cleared
  medication may take grape seed extract is squarely clinician scope. The coach's
  job is the one thing here that IS in scope and matters most: proactively
  surfacing self-started supplement use to the treating clinician, since clients
  routinely do not mention plant supplements when asked what medication they take.
sources:
- id: mskcc-grape-seed-about-herbs
  location: Herb-Drug Interactions
  quote: >-
    Anticoagulants/Antiplatelets: In vitro, grape seed has antiplatelet activity and
    may increase the risk of adverse effects of anticoagulants/antiplatelets. Clinical
    relevance has yet to be determined. Cytochrome P450 3A4 substrates: In vitro, GSE
    inhibits CYP3A4 and may affect the intracellular concentration of drugs
    metabolized by this enzyme.
- id: nccih-grape-seed-extract-factsheet
  location: Safety
  quote: >-
    Grape seed extract is generally well tolerated when taken orally or used
    topically. Little is known about whether it's safe to use grape seed extract
    during pregnancy or while breastfeeding.
