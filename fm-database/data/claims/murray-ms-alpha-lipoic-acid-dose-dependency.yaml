out_of_scope_notes: >-
  Coach scope: explaining what alpha-lipoic acid is, being clear the evidence in MS is early, and
  flagging any supplement the client already takes so the clinician can review it. Out of scope:
  recommending it, naming a dose, or advising on it in a client on diabetes medication - dose,
  interaction and appropriateness are all prescriber decisions.
