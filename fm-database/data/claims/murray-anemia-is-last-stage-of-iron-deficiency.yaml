  quote: >-
    some degree of iron deﬁciency occurs in 35 to 58% of young, healthy women. During
    pregnancy, the number is even higher. However, it must be pointed out that anemia is the
    last stage of iron deﬁciency. Iron-dependent enzymes involved in energy production and
    metabolism are the ﬁrst to be affected by low iron levels. Serum ferritin is the best
    laboratory test for determining body iron stores.
