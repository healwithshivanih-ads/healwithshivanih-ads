out_of_scope_notes: >
  Ordering ferritin, iron studies or a CBC, and interpreting any of those results, is clinician
  scope — the coach may not read a lab or say a client "is iron deficient". The coach's scope
  is educating the client that fatigue has an iron-status question worth raising with their
  doctor, supporting them to actually go and ask it, and coaching the dietary and absorption
  habits around whatever the doctor finds.
