slug: low-alt-in-older-adults-marks-frailty
statement: In adults over 65, a low ALT goes with frailty, low muscle mass, disability and low vitamin B6, and the lowest ALT levels predict higher death rates.
evidence_tier: plausible_emerging
rationale: Stops a coach praising a very low ALT in an older client as a "great liver" when it may be a muscle-and-reserve warning.
coaching_translation: In an older client, a very low ALT (single digits) is a prompt to look at protein intake, strength work and B6, not a sign the liver is perfect.
out_of_scope_notes: Frailty assessment is the doctor's; the coach supports protein and strength.
caveats:
- One Italian cohort of 765 older adults; association, not cause.
- Not relevant to younger, active clients, for whom a low ALT is simply healthy.
