slug: fmca-m2-open-questions-forward-momentum
statement: Open questions (starting with 'what', 'how', 'in what way') create forward
  momentum, invite exploration and build partnership. Closed questions can feel like
  interrogation and stall the conversation. Open questions dominate every task except
  Planning, where they get more targeted.
evidence_tier: strong
rationale: Coach-facing takeaway distilled from the live-call reflection; ready for
  use in briefings and sessions.
coaching_translation: Default to 'what' and 'how'. If you catch yourself asking 'do
  you', 'have you', 'will you' — reframe.
