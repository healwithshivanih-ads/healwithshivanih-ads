slug: fmca-m2-change-vs-transformation
statement: Change and transformation are not the same. Change is behavioural, incremental
  and always available. Transformation is a shift in identity or perception — it can
  happen in a moment, without any behavioural change first. Coaching creates space
  for both.
evidence_tier: plausible_emerging
rationale: Coach-facing takeaway distilled from the live-call reflection; ready for
  use in briefings and sessions.
coaching_translation: A single reflection that lands can transform a client — even
  before any behaviour changes. Notice and honour those moments.
