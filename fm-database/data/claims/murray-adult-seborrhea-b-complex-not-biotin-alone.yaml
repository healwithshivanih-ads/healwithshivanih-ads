out_of_scope_notes: >
  Coach scope: explaining why B vitamins act as a group, food-first sources for an Indian
  vegetarian diet, adherence support if a doctor has already started a supplement, and
  prompting the client to ask their doctor about B12 status. Clinician scope: ordering and
  interpreting B12/folate labs, prescribing injections, and setting doses. Referral boundary
  not stated in this chapter and not to be attributed to it: adult seborrheic dermatitis of
  sudden, severe or explosive onset can be a marker of underlying illness including HIV and
  Parkinson's disease, and must go to a doctor rather than be coached.
