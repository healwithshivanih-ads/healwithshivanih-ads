slug: briden-hrm-progestin-vs-progesterone
statement: 'Progestins (medroxyprogesterone acetate/Provera®, norethisterone/Primolut®,
  levonorgestrel in Mirena IUD, dydrogesterone) are NOT progesterone. They protect
  the uterine lining but drive the breast-cancer risk historically attributed to HRT,
  and can cause mood problems, hair loss and weight gain. Oral micronised progesterone
  (Prometrium® / Utrogestan®) does the same uterine-protection job WITHOUT the breast
  risk, and may actually reduce breast cancer risk. Rule of thumb: if the label reads
  ''progesterone'' but the ingredient is medroxyprogesterone / norethisterone / dydrogesterone
  / levonorgestrel, it is a progestin.'
