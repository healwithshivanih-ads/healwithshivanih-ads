slug: urolithin-a-muscle-strength-middle-aged-adults
statement: In middle-aged adults, 500 mg urolithin A daily for four months improved
  hamstring isokinetic peak torque against placebo, with no change to diet or
  exercise.
evidence_tier: plausible_emerging
rationale: Randomised placebo-controlled trial with an objective strength endpoint
  in a cohort resembling ordinary coaching clients — the talk described BMI around
  29, some on statins and antihypertensives.
coaching_translation: In one trial, middle-aged adults taking it for four months got
  measurably stronger in the back of the thigh without changing anything else.
linked_to_topics:
