- sarcopenia-skeletal-muscle-loss
linked_to_mechanisms:
- mitophagy
- sarcopenia
linked_to_supplements:
- urolithin-a
out_of_scope_notes: Not a treatment for diagnosed muscle disease. Strength in a
  trial cohort is not a promise for an individual client.
caveats:
- Manufacturer-funded trial of the manufacturer's branded compound, captured from a
  vendor slide rather than the primary text.
- The headline +12% is a between-arm gap that depends partly on the placebo group
  DECLINING ~9.8% over the same period, so it is not a 12% gain from baseline.
