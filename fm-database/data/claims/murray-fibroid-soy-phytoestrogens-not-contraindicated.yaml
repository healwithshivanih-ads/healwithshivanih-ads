out_of_scope_notes: >
  Encouraging normal food-level soy and ground flaxseed sits within nutrition coaching.
  Prescribing isolated isoflavone supplements at a milligram target, or advising a client to
  disregard a doctor's instruction about soy, does not.
sources:
- id: murray-pizzorno-2012-encyclopedia
  location: Chapter 97 — Uterine Fibroids, pg 1541
  quote: Soy isoﬂavones appear to be selective in terms of the tissues in which they have an
    estrogenic effect and the tissues in which their effect is antiestrogenic. Soy
    phytoestrogens do not appear to have an estrogenic effect on the human uterus and may in
    fact help shrink uterine ﬁbroids due to an antiestrogenic effect. We recommend moderate
    but not excessive soy consumption in the range of 45 to 90 mg soy isoﬂavones per day.
