slug: briden-hrm-most-symptoms-are-temporary
statement: Most perimenopausal symptoms (heavy periods, pelvic pain, sore breasts,
  migraines, night sweats, and even anxiety and depression) are temporary and largely
  resolve during menopause. Anxiety and depression risk rises with perimenopause then
  falls back with menopause — women over 60 in Melbourne research report feeling 'pretty
  fantastic.'
