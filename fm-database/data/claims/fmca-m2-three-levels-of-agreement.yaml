slug: fmca-m2-three-levels-of-agreement
statement: Coaching runs on three levels of agreement — the coaching contract for
  the whole relationship, the agenda for the current session, and the agreed focus
  of the current conversation. Effective coaches co-create agreement at each level;
  without one, direction collapses.
evidence_tier: strong
rationale: Coach-facing takeaway distilled from the live-call reflection; ready for
  use in briefings and sessions.
coaching_translation: Confirm the session's focus explicitly ('So today we're working
  on your morning routine — right?') before evoking.
