  location: Abstract — Results and Conclusion
  quote: Among adults, the estimated pooled prevalence was 38.6% (95% CI 32-45.5).
- id: asadullah-2022-nafld-rural-urban-north-india
  location: Abstract — Results
  quote: The age- and sex-standardized prevalence of ultrasound-diagnosed NAFLD was
    65.7% in the urban and 61.1% in the rural areas.
caveats:
- Prevalence figures come from ultrasound, which misses mild fat and varies by operator. The six-in-ten figure is North India, ages 30-60, only. Say "about 1 in 3" for India as a whole.
