slug: nafld-affects-one-in-three-indian-adults
statement: Non-alcoholic fatty liver disease affects roughly one in three Indian
  adults. A 2022 meta-analysis of 50 Indian studies (23,581 adults) pooled adult
  prevalence at 38.6%, with community samples at 28.2% and hospital samples at
  40.8%. In a representative 2017-2019 ultrasound survey of 30-60-year-olds in
  Delhi and rural Haryana, about six in ten had fatty liver (65.7% urban, 61.1%
  rural), with diabetes, central obesity and insulin resistance the associated
  factors.
evidence_tier: strong
