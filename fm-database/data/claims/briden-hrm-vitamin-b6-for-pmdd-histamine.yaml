slug: briden-hrm-vitamin-b6-for-pmdd-histamine
statement: 'Vitamin B6 (P5P / pyridoxal-5-phosphate) 20–100 mg/day in divided doses
  supports GABA manufacture and DAO enzyme clearance of histamine — Briden''s top
  choice for perimenopausal mood, PMDD, irritability, insomnia, rage, and perimenopausal
  allergies. Backed by a recent RCT. Absolute ceiling: 150 mg/day long-term to avoid
  permanent nerve damage (peripheral neuropathy).'
