slug: colonic-propionate-raises-endogenous-glp1-pyy
statement: Delivering the short-chain fatty acid propionate to the human colon (10 g inulin-propionate ester) acutely
  increased postprandial GLP-1 and PYY and reduced energy intake, and over 24 weeks reduced weight gain and intra-abdominal
  fat in overweight adults.
evidence_tier: plausible_emerging
rationale: Single RCT programme using an engineered propionate ester, not ordinary dietary fibre; supports the fibre
  → SCFA → endogenous GLP-1 pathway but not its size from food.
coaching_translation: Your gut bacteria turn fibre into short-chain fatty acids, which help your body release its
  own GLP-1 and PYY fullness signals. It is much weaker than a GLP-1 drug and will not replace it, but it works
  with your own appetite system.
caveats:
- Used a purpose-built propionate ester, not whole foods.
- Endogenous GLP-1 effects are far smaller than pharmacological doses.
