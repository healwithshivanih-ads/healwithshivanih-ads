out_of_scope_notes: >
  Interpreting a client's lipid panel and deciding what to do about it is clinician
  scope. A coach can say that this supplement is a weak lever for lipids and
  redirect attention to fibre, saturated fat, weight and movement, which are
  squarely in scope and considerably more effective.
