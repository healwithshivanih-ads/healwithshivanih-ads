slug: grape-seed-extract-lipid-effect-small-and-not-dose-dependent
statement: |
  Grape seed extract has a small but real effect on two lipid fractions and none
  on the other two. Pooled across 11 RCTs (536 participants, 150-2000 mg/day,
  4-24 weeks): LDL-cholesterol fell 0.17 mmol/l (95% CI -0.34, -0.01; about
  6.6 mg/dL) and triglycerides fell 0.11 mmol/l (95% CI -0.18, -0.05; about
  9.7 mg/dL), while total cholesterol and HDL did not change significantly.
  Crucially, NO significant linear or non-linear dose-response relationship was
  found for any lipid outcome, and effects were more favourable at doses UNDER
  300 mg/day and in participants with BMI under 27.
evidence_tier: plausible_emerging
rationale: >
  A well-conducted dose-response meta-analysis with a consistent independent read
  from NCCIH, which reached the same split conclusion (LDL and triglycerides yes,
  total and HDL cholesterol no). The effect sizes are small and the confidence
  interval for LDL nearly touches zero. The absent dose-response is the most
  informative finding in the paper and is what keeps this out of the "strong"
  tier: a genuine pharmacological effect on lipids would normally scale with
  dose, and this one does not.
coaching_translation: >
  Grape seed extract is not a lipid-lowering agent and should not be positioned as
  one. About 6 mg/dL off LDL and 10 mg/dL off triglycerides is real but small —
  less than a good week of dietary change, and far less than a client with an
  ApoB or Lp(a) problem needs. If a client is taking it for their cholesterol,
  the honest answer is that it is doing very little for that. Two practical
  points: taking MORE does not help, since the effect does not scale with dose,
  and the clients who responded were the leaner ones, not the heavier ones — the
  opposite of the intuition.
caveats:
- The LDL confidence interval (-0.34, -0.01) very nearly includes zero.
- No dose-response means there is no rationale for going above 300 mg/day for lipids.
- Effects were better below BMI 27 — do not extrapolate to obese clients.
- Total cholesterol and HDL did not move at all.
- Never a substitute for a statin or for the dietary and weight work that actually
  moves ApoB.
