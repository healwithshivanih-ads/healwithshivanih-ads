out_of_scope_notes: Diet pattern, smoking-cessation support, stress practice and habit change are core coach scope. Exercise prescription in diagnosed coronary disease is not — it is set by the cardiologist or cardiac rehab team, and the coach supports adherence to that prescription. Supplement decisions, including fish oil alongside antiplatelets, remain with the prescriber.
