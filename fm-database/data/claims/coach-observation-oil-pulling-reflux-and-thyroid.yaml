slug: coach-observation-oil-pulling-reflux-and-thyroid
statement: >-
  COACH OBSERVATION (Shivani, 2026-08-04) - people known to the coach report that
  taking up oil pulling improved their reflux/acidity, and separately report
  improvement in thyroid-related symptoms. These are uncontrolled personal reports,
  not measured outcomes, and are recorded here as a hypothesis to be tested rather
  than as an established effect.
