slug: albuminuria-predicts-risk-with-normal-egfr
statement: In general-population cohorts, a higher urine albumin-to-creatinine ratio predicts higher all-cause and
  cardiovascular mortality independently of eGFR, including when eGFR is in the normal range; risk rises steadily with ACR
  with no safe threshold.
evidence_tier: strong
rationale: Collaborative meta-analysis of 14 cohorts, 105,872 people (Matsushita 2010, Lancet, CKD Prognosis Consortium).
coaching_translation: Your blood report can say your kidneys are filtering normally while protein is already leaking into
  your urine, and that leak is linked to heart risk as well as kidney risk.
caveats:
- Observational; it shows risk, not that lowering ACR alone changes outcomes.
- General-population cohorts, mostly outside India.
