slug: briden-hrm-dementia-anticholinergic-warning
statement: 'Chronic use of anticholinergic medications quadruples dementia risk. Includes:
  antihistamines (diphenhydramine, doxylamine — often taken for sleep), benzodiazepines,
  sleeping tablets like Ambien®, and the antidepressant Paxil®. Short-term use is
  fine. For perimenopausal sleep, coach steer clients away from OTC antihistamine
  sleep aids toward magnesium/glycine/taurine/progesterone/melatonin instead.'
