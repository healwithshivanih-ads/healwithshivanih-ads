slug: short-term-elimination-diet-identifies-migraine-triggers
statement: A short-term diagnostic elimination diet is the reference method for identifying food triggers
  in migraine and food reactions, and each person's triggers, dose and timing differ.
evidence_tier: plausible_emerging
rationale: Supports a structured elimination-reintroduction over generic avoid-lists.
coaching_translation: We'll take a few foods out for a short time, then bring them back one by one, so
  we learn what really affects you instead of avoiding everything.
