slug: histamine-food-lists-disagree-use-symptom-diary
statement: 'Published high-histamine food lists disagree with each other, so the person''s own food-and-symptom
  diary is a better guide than any single list. Tolerance is dose-dependent: several moderate-histamine
  foods in one meal can add up to a reaction even when each alone is fine.'
evidence_tier: fm_specific_thin
rationale: Coach builds the avoid-list from the client's diary, and teaches total-load thinking rather
  than permanent bans.
coaching_translation: There isn't one correct histamine list. What matters is what your body reacts to,
  and how much is on the plate at once — a little of something may be fine.
