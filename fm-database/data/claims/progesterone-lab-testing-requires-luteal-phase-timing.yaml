slug: progesterone-lab-testing-requires-luteal-phase-timing
statement: In women still having regular periods, progesterone should be tested
  during the luteal phase (roughly day 21, i.e., after ovulation and before the
  next period) — testing during the first 14 days of the cycle will read as low
  progesterone by design, regardless of whether the client actually has a deficiency.
evidence_tier: strong
rationale: Luteal-phase progesterone testing (the day-21 convention) is standard
  reproductive endocrinology practice, reflecting normal ovulatory physiology (corpus
  luteum progesterone production after ovulation) — this is not an FM-specific claim.
coaching_translation: If a client mentions she was tested for 'low progesterone'
  but isn't sure when in her cycle the blood draw happened, that's a good question
  to help her bring back to her prescriber — timing alone can make a normal result
  look artificially low.
