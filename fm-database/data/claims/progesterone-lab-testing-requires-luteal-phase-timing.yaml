  location: Hormone testing segment
  quote: Day 14 to day 28... that's the luteal phase... that's where the egg was
    released from... it makes progesterone. So if you're checking somebody and telling
    them they have low progesterone, but they were checking them in the first 14
    days, guess what? Of course they're going to have low progesterone.
