slug: briden-hrm-fibromyalgia-is-perimenopause-sleep
statement: Fibromyalgia diagnosed in a woman aged 40–60 is very often perimenopausal
  sleep disturbance in disguise (Prof Prior). Treating the sleep problem — especially
  with progesterone — often relieves the widespread pain. Coaches encountering a new
  fibromyalgia diagnosis in a perimenopausal client should ask about sleep, insulin
  resistance, and consider referring back to check for thyroid disease and intestinal
  permeability / SIBO (also strongly linked).
