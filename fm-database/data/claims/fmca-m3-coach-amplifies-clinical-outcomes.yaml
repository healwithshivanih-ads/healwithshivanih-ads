slug: fmca-m3-coach-amplifies-clinical-outcomes
statement: 'Integrating a coach into a functional-medicine practice amplifies clinical
  outcomes: the physician sets the therapeutic direction and the coach translates
  it into a plan the client can actually sustain, tracks the sustaining, and hands
  relevant observations back to the clinician between visits.'
evidence_tier: plausible_emerging
rationale: Coach-facing takeaway distilled from the live-call reflection; ready for
  use in briefings and sessions.
coaching_translation: When talking to a prospective clinician partner, lead with 'I
  make your plans stickier' rather than 'I'll refer patients to you'.
