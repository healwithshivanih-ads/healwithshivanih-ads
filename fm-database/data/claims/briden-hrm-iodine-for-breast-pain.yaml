slug: briden-hrm-iodine-for-breast-pain
statement: 'Iodine (molecular I2 form preferred, brand Violet®, 3 mg/day if no thyroid
  antibodies) is Briden''s #1 supplement for cyclical or non-cyclical breast pain
  (mastalgia) and fibrocystic breast disease — stabilises and downregulates estrogen
  receptors, which are abundant in breast tissue. Molecular I2 is preferentially absorbed
  by breast over thyroid, making it safer than potassium iodide. Test thyroid antibodies
  BEFORE dosing above 500 mcg.'
