out_of_scope_notes: 'Diagnosis, ECG/stress-test interpretation, and any decision about nitrates, antiplatelets, statins, angiography or revascularisation are cardiologist scope. Coach scope: educating the client on what their diagnosed condition means, and supporting the lifestyle change their cardiologist has asked for.'
