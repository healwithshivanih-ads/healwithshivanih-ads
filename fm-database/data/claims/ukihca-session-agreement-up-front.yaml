slug: ukihca-session-agreement-up-front
statement: Setting a clear agreement up front — 'what would success look like by the
  end of our sessions?' — puts the client in the driving seat and helps them land
  their focus. Coaches new to practice often skip this step; naming it explicitly
  makes the whole engagement more purposeful.
evidence_tier: strong
rationale: Coach-facing takeaway distilled from the live-call reflection; ready for
  use in briefings and sessions.
coaching_translation: Ask the success question in the foundation session. Write the
  answer down. Return to it every 4-6 weeks.
