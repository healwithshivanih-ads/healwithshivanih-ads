slug: ukihca-hand-affirmation-back-for-self-efficacy
statement: Affirming effectively means immediately handing the affirmation back to
  the client to build their own self-efficacy. Coaching drives compliance through
  autonomy, vision and values — not by the coach telling the client what to do or
  dispensing praise.
evidence_tier: plausible_emerging
rationale: Coach-facing takeaway distilled from the live-call reflection; ready for
  use in briefings and sessions.
coaching_translation: After an affirmation, ask a question that lets the client own
  the strength themselves — 'where else does that show up for you?'
