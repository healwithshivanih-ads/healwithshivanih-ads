  location: Chapter 49 — Erectile Dysfunction, pg 905
  quote: |-
    A long list of prescription medications and drugs can interfere with sexual function, including medications such as blood pressure medications (especially beta-blockers), peptic ulcer medications, sleeping pills (sedative hypnotic drugs), antidepressants, and statins to lower cholesterol. If you are on a medication that may be linked to ED, work with your physician to get off the medication.
