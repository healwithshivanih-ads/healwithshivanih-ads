slug: enteric-glia-mast-cell-crosstalk-ibs-permeability
statement: In colon biopsies from women with IBS, altered communication between enteric glial cells and
  mast cells was linked to increased colonic permeability.
evidence_tier: plausible_emerging
rationale: Gives the mechanistic bridge between mast cells and the leaky-gut picture in IBS, which supports
  gut-barrier work alongside trigger reduction.
