out_of_scope_notes: 'This claim IS the scope statement. Coach scope: lifestyle education and behaviour
  change as an adjunct, adherence support, and helping the client prepare questions for their neurologist.
  Out of scope, absolutely and without exception: any advice bearing on whether to start, continue, change
  or stop disease-modifying therapy; managing a relapse; interpreting MRI or disability progression; and
  any framing that positions natural therapy as an alternative to proven treatment.'
