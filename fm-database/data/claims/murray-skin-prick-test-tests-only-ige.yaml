slug: murray-skin-prick-test-tests-only-ige
statement: |
  The skin-prick (skin-scratch) test detects only IgE-mediated allergy. Since
  Murray & Pizzorno put IgE-mediated type I reactions at just 10 to 15% of all
  food allergies, they argue the test is of little value for diagnosing most food
  reactions — though it does give good information when the reaction genuinely is
  IgE-mediated. A negative skin-prick test therefore does not rule out a food
  problem; it rules out one mechanism. This is the single most common source of
  the client sentence "my allergy test was normal, so it can't be food."
evidence_tier: plausible_emerging
rationale: >
  The core assertion — that skin-prick testing measures IgE sensitisation only,
  and so cannot detect non-IgE food reactions — is uncontroversial and mainstream.
  Conventional allergology also acknowledges that skin-prick tests have modest
  positive predictive value in isolation (sensitisation is not the same as
  clinical allergy) and are interpreted alongside history and challenge. What is
  book-specific is the 10-15% denominator: that figure depends on counting
  non-IgE "food allergy" the way this chapter counts it, which the mainstream
  literature does not. Tiered plausible_emerging because the mechanistic point is
  solid but the quantification is the authors' own.
coaching_translation: >
  A normal skin-prick test at the allergist does not mean food is not part of your
  picture. That test looks for one specific kind of immediate allergic reaction —
  the fast, dramatic sort. It is very good at what it does and it is exactly the
  right test for that, but it does not pick up the slower reactions that show up
  hours later as bloating, headache, joint ache or a skin flare. So "my allergy
  test was clear" and "food isn't a factor for me" are two different statements. If
  a food pattern is suspected, the way to find it is a supervised trial of taking
  it out and putting it back.
caveats:
- Do not invert this into "the test is useless" — a positive skin-prick test in
  the right clinical context is meaningful, and IgE allergy is the kind that can
  kill.
- Sensitisation on a skin test without a matching history is not a diagnosis of
  allergy; only a clinician can make that call.
- Antihistamines taken in the days before testing can suppress the result — a
  clinician-managed detail, but worth knowing if a client reports a "normal" test.
- Using this claim to talk a client out of trusting their allergist is out of
  bounds; the point is that the two mechanisms are different, not that the doctor
  was wrong.
