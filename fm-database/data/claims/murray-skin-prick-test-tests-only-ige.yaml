out_of_scope_notes: >
  A coach may explain in plain English what a skin-prick test does and does not
  cover, so a client understands why their normal result does not close the
  question. A coach may not order the test, interpret a client's result, contradict
  an allergist's interpretation, or advise a client to disregard a positive result.
  IgE-mediated allergy carries anaphylaxis risk and is clinician territory
  end to end.
