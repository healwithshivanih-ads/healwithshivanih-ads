out_of_scope_notes: >-
  Coach scope: explaining in plain language what demyelination is and why symptoms vary, so the client
  understands their own care plan and can ask better questions of their neurologist. Out of scope:
  diagnosis, differential diagnosis, attributing cause, interpreting MRI or CSF findings, and any
  assessment of relapse - all neurology.
