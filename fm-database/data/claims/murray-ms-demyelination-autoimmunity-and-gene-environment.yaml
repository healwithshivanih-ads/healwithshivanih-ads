sources:
- id: murray-pizzorno-2012-encyclopedia
  location: "Chapter 78 — Multiple Sclerosis, pg 1278"
  quote: |-
    It is caused by gradual loss of the myelin sheath that surrounds the nerve cell. This process is called demyelination. One of the key functions of this myelin sheath is to facilitate the transmission of the nerve impulse. Without the myelin sheath, nerve function is lost. Symptoms correspond to the nerves that have lost their myelin sheath.
- id: murray-pizzorno-2012-encyclopedia
  location: "Chapter 78 — Multiple Sclerosis, pg 1280"
  quote: |-
    However, the fact that only 25% of identical twins develop MS if their twin develops it clearly shows that dietary, environmental, and lifestyle factors are required for the disease to manifest itself in most cases. In other words, genetics alone does not inevitably lead to MS.11
