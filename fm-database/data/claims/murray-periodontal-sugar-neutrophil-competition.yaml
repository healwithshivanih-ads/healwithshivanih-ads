out_of_scope_notes: >
  Reducing added sugar and refined carbohydrate and raising fibre is squarely within
  coaching scope and is the highest-value thing the coach can do here. Diagnosing
  diabetes from gum symptoms, interpreting an HbA1c, or treating the plaque itself are
  not — refer to physician and dentist respectively.
