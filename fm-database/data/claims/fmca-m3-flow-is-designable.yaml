slug: fmca-m3-flow-is-designable
statement: Flow — the state of deep absorbed engagement — is not accidental. It arises
  when skill matches challenge, feedback is immediate, and the activity has clear
  structure. Coaches can help clients identify flow-inducing activities and deliberately
  design more of them into the week for wellbeing and behaviour momentum.
evidence_tier: plausible_emerging
rationale: Coach-facing takeaway distilled from the live-call reflection; ready for
  use in briefings and sessions.
coaching_translation: Ask 'when does time disappear for you?' — the answer is where
  flow lives. Protect that time in the calendar.
