out_of_scope_notes: |
  Clinician: diagnosing malabsorption, assessing and treating B12/folate
  deficiency, liver assessment, deciding on any supplement in advanced liver
  disease. Coach: fibre, fermented foods, meal regularity, hydration, and
  referring when weight loss or fatty stools appear.
