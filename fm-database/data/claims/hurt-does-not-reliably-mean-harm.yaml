slug: hurt-does-not-reliably-mean-harm
statement: Pain is defined as an experience associated with actual OR POTENTIAL tissue
  damage, so the three combinations all occur — pain with damage, no pain despite
  substantial damage, and a great deal of pain with minimal damage.
evidence_tier: strong
rationale: This is the definitional position, following the widely adopted definition of
  pain that Lehman quotes, not a contested empirical finding. The consequence — that the
  intensity of pain is not a readout of the amount of damage — follows directly from the
  definition and is supported by the imaging evidence in the sibling claim.
coaching_translation: Hurting and being harmed are not the same thing. People have broken
  bones and felt almost nothing, and people have had a small strain and been floored by it
  for days. How much something hurts does not tell you how much damage there is.
caveats:
- This is not a licence to ignore pain. New, severe, night-waking or unexplained pain needs
  a clinician, and the point of the alarm is that it usually should be listened to.
- It applies most strongly to persistent pain. In fresh injury the relationship between hurt
  and harm is much closer.
