slug: murray-fibroid-heavy-bleeding-is-medical-scope
statement: |
  Murray & Pizzorno draw a hard line: when fibroids cause heavy bleeding, medical management is
  necessary and surgery is sometimes required, with non-surgical options such as high-intensity
  focused ultrasound also available. This sits alongside the chapter's own admission that its
  natural approach is supported more by naturopathic clinical experience than by scientific
  evidence, and that hysterectomy for fibroids is the most common major surgery in women.
  Abnormal bleeding occurs in about 30% of women with fibroids. Nutrition and lifestyle work
  runs alongside gynaecological care here — never instead of it.
evidence_tier: strong
rationale: >
  This is the least equivocal statement in the chapter and the authors state it against their
  own interest, immediately before their treatment summary. It is also uncontroversial standard
  care: heavy menstrual bleeding from fibroids risks iron-deficiency anaemia and requires
  medical assessment, and myomectomy, hysterectomy and uterine artery embolisation are
  gynaecological decisions. Tiered strong not because a trial is cited but because the claim is
  a scope boundary rather than a therapeutic assertion, and the source states it unambiguously.
coaching_translation: >
  If your periods are heavy — soaking through protection in an hour, passing large clots,
  bleeding beyond seven days, or leaving you breathless, dizzy or exhausted — that is a
  conversation for your gynaecologist, not something to manage with food and habits. Heavy
  bleeding month after month quietly drains iron, and the decision about whether anything
  needs doing about the fibroid itself is a medical one. Everything we work on together —
  fibre, bowel regularity, cutting saturated fat and sugar, reducing plastic exposure — runs
  alongside that care, not in place of it.
caveats:
- Heavy or prolonged bleeding, flooding, clots, bleeding between periods, or any post-menopausal
  bleeding requires prompt gynaecology referral — refer, do not coach.
- Fatigue, breathlessness, palpitations or pica in a client with heavy periods suggest
  iron-deficiency anaemia; this needs a doctor, and iron should never be started on a coach's
  say-so.
- Rapid fibroid growth is a red flag for the gynaecologist.
- The chapter notes women with fibroids carry a fourfold increase in endometrial cancer risk —
  another reason abnormal bleeding must always be medically evaluated rather than attributed
  to a known fibroid.
- Myomectomy, hysterectomy, embolisation and focused ultrasound are entirely the
  gynaecologist's domain; a coach does not weigh in on the choice.
