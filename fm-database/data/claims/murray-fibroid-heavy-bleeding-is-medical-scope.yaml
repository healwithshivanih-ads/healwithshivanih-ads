out_of_scope_notes: >
  Assessing bleeding volume, diagnosing or treating anaemia, interpreting a haemoglobin or
  ferritin result, and any advice on surgical or procedural options are strictly clinician
  scope. The coach's role is to recognise the red flags, refer promptly, and support diet and
  lifestyle around whatever the gynaecologist decides.
