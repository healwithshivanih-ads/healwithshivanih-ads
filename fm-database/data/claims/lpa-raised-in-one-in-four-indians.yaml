slug: lpa-raised-in-one-in-four-indians
statement: Raised lipoprotein(a), one of the strongest genetic risk factors for premature coronary artery disease,
  is present in about a quarter of Indians and other South Asians, compared with about a fifth of Caucasians.
evidence_tier: plausible_emerging
rationale: Figure stated in the CSI-aligned editorial (Sawhney & Gupta 2024); prevalence depends on the threshold
  and population sampled.
coaching_translation: About one in four Indians has a raised Lp(a), and most have never been tested. It can explain
  heart attacks that come early in families who eat well and stay active.
caveats:
- Prevalence estimate from an editorial, not a primary survey; say 'about one in four'.
- Mostly genetic, but not unchangeable - some treatments lower it; a doctor decision.
