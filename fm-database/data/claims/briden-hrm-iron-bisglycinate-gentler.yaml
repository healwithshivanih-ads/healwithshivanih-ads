slug: briden-hrm-iron-bisglycinate-gentler
statement: For iron deficiency from heavy periods, choose iron bisglycinate 15–50
  mg (iron chelated to glycine) OVER ferrous fumarate/sulfate salts — smaller dose,
  better absorption, less nausea/constipation/diarrhoea/black stools. Take with the
  largest meal + vitamin C, AWAY from tea, coffee, calcium supplements. Every-other-day
  dosing may absorb better than daily. Very heavy flow may still require an iron infusion;
  injections are painful and stain (avoid).
evidence_tier: strong
