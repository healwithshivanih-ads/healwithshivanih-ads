slug: urolithin-a-muscle-endurance-older-adults
statement: In older adults, 1000 mg urolithin A daily for eight weeks improved muscle
  endurance — time to fatigue — in hand and leg muscles against placebo.
evidence_tier: plausible_emerging
rationale: Randomised placebo-controlled trial using isometric time-to-fatigue, an
  objective endpoint, in the age group where mitochondrial decline is most relevant.
coaching_translation: In older adults it improved how long muscles could keep going
  before tiring, rather than raw peak strength.
