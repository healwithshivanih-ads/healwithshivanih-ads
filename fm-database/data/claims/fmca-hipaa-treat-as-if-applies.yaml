slug: fmca-hipaa-treat-as-if-applies
statement: 'Most solo coaches are not HIPAA covered entities but hold sensitive client
  health information anyway. Best practice: treat all client data as if HIPAA applies
  — encrypted storage, minimal retention, secure comms, explicit release for any info-sharing
  with clinicians.'
