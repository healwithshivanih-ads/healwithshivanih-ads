slug: briden-hrm-selenium-for-hashimotos
statement: Selenium 100–150 mcg/day significantly reduces thyroid antibodies in both
  Hashimoto's and Graves' disease in multiple clinical trials — works as a component
  of selenoproteins that reduce inflammation and oxidative stress in the thyroid gland,
  aids T4 → T3 conversion, and protects the thyroid from iodine. Do NOT exceed 200
  mcg/day from all sources (including Brazil nuts).
evidence_tier: strong
linked_to_topics:
- hypothyroidism
linked_to_symptoms:
