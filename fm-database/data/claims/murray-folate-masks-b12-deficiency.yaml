sources:
- id: murray-pizzorno-2012-encyclopedia
  location: Chapter 21 — Anemia, pg 470
  quote: >-
    It is always necessary to supplement vitamin B12 with folic acid to prevent the folic acid
    supplement from masking a vitamin B12 deﬁciency. Supplementing with folic acid will
    correct the anemia of a vitamin B12 deﬁciency, but it cannot overcome the problems that
    vitamin B12 deﬁciency causes in the brain. Also, a high level of folic acid will actually
    aggravate the problems caused by vitamin B12 deﬁciency.
- id: murray-pizzorno-2012-encyclopedia
