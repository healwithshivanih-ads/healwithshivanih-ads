slug: murray-folate-masks-b12-deficiency
statement: |
  Folic acid corrects the anemia of B12 deficiency without correcting the neurological damage,
  so supplementing folate alone can hide a B12 deficiency while the nervous system keeps
  deteriorating. Murray & Pizzorno state it is always necessary to supplement vitamin B12
  alongside folic acid to prevent this masking, and go further — that a high level of folic
  acid will actually aggravate the problems caused by B12 deficiency. The chapter separately
  notes that B12 deficiency appears to affect the brain and nervous system before anemia
  develops, and that its neurological presentation (numbness and tingling in the arms or legs,
  depression, mental confusion, loss of vibration sense and deep tendon reflexes) can mimic
  Alzheimer's disease in the elderly.
evidence_tier: strong
rationale: >
  The masking phenomenon is long-established and is the reason folic acid fortification
  programmes were debated worldwide; the haematological picture normalises because folate
  rescues DNA synthesis, while the B12-dependent methylmalonyl-CoA and myelin pathways remain
  unaddressed. That the neurological signs can precede anemia is likewise well documented and
  is why serum B12 should not be inferred from a normal MCV. The book asserts both without
  inline citation in this passage, but they are consensus positions rather than
  functional-medicine-specific claims. The stronger sub-claim — that high folic acid actively
  aggravates B12 deficiency, rather than merely masking it — is asserted without any citation
  here and is the weakest part; the underlying literature on unmetabolised folic acid is
  suggestive but not settled.
coaching_translation: >
  Folic acid and B12 are a pair, and taking folate on its own can be genuinely risky. Folate
  will fix the blood picture of a B12 deficiency — the tiredness and the abnormal blood count
  improve — while the nerve and brain effects of low B12 carry on unchecked and can become
  permanent. So a client who feels better on a folate supplement is not proof that B12 is
  fine. This matters most for older clients and for long-term vegetarians and vegans, and it
  is a specific reason to be cautious about anyone self-prescribing high-dose folic acid, or
  taking a fortified product, without B12 status having been checked by their doctor.
caveats:
- The clinical judgement here is a prescriber's. The coach's role is to prompt the question
  "has your B12 been checked?", never to advise a client to start, stop or change a folate or
  B12 supplement.
- Numbness, tingling, unsteadiness, memory change or confusion are red flags requiring
  prompt medical assessment, not a nutrition conversation.
- Pregnant and pre-conception clients are routinely and appropriately on folic acid; nothing
  here should be used to discourage that. The point is that B12 should be considered
  alongside it, not that folate should be avoided.
- The claim that high folic acid aggravates B12 deficiency is the least supported part of
  this passage and should be presented as a caution, not a fact.
