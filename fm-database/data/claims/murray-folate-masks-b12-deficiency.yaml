out_of_scope_notes: >
  Deciding whether to test B12, interpreting a B12 or folate result, and prescribing either
  nutrient are clinician scope. Coach scope: educating the client that folate and B12 belong
  in the same conversation, spotting when a client is self-supplementing folate without B12,
  and referring promptly if neurological symptoms are described. The coach must never
  reassure a client that a normal blood count rules out low B12.
