out_of_scope_notes: >
  Food-first carotenoid intake is squarely coaching scope — a coach can teach, plan
  meals around, and track leafy-green and coloured-vegetable intake without any
  clinician involvement. Selecting a specific lutein/zeaxanthin/astaxanthin product
  and dose for someone with diagnosed ARMD is not: that sits with the ophthalmologist
  or physician, especially where an eye formula is already prescribed. A coach must
  never present carotenoids as treatment for wet ARMD or as a reason to defer review.
sources:
- id: murray-pizzorno-2012-encyclopedia
  location: Chapter 74 — Macular Degeneration, pg 1222
  quote: >-
    However, various nonessential food components such as ﬂavonoids and the carotenes
    lutein, zeaxanthin, and lycopene are proving to be even more signiﬁcant in
    protecting against ARMD than traditional nutritional antioxidants such as vitamin
    C and E, zinc, and selenium. The macula, especially its central portion, the
    fovea, owes its yellow color to its high concentration of lutein and zeaxanthin.
    These yellow carotenoids function in preventing oxidative damage to the area of
    the retina responsible for ﬁne vision and have a central role in protecting
    against the development of macular degeneration.
- id: murray-pizzorno-2012-encyclopedia
  location: Chapter 74 — Macular Degeneration, pg 1225
  quote: >-
    In another study, 27 patients with ARMD were randomly divided into two groups: 15
    patients took vitamin C (180 mg), vitamin E (30 mg), zinc (22.5 mg), copper (1
    mg), lutein (10 mg), zeaxanthin (1 mg), and astaxanthin (4 mg) every day for 12
    months, while 12 patients served as controls. Visual acuity assessments indicated
    quite clearly that early-stage ARMD can respond positively to supplementation with
    carotenoids and antioxidants.
