slug: murray-armd-macular-pigment-carotenoids
statement: |
  The macula — and especially the fovea, the pinpoint responsible for fine detail —
  is yellow because it concentrates lutein and zeaxanthin. That pigment is not
  incidental colour: it absorbs blue light and quenches oxidative damage in exactly
  the tissue that ARMD destroys. Murray & Pizzorno argue these carotenoids, plus
  lycopene and dietary flavonoids, matter more for ARMD protection than the classical
  antioxidants (vitamin C, vitamin E, zinc, selenium). In a 12-month randomised study
  of 27 people with ARMD, the treated group took vitamin C 180 mg, vitamin E 30 mg,
  zinc 22.5 mg, copper 1 mg, lutein 10 mg, zeaxanthin 1 mg and astaxanthin 4 mg daily
  and showed positive visual-acuity change in early-stage disease. The chapter's own
  standing recommendation is lutein 10–20 mg, zeaxanthin 1–2 mg and astaxanthin 4–6 mg
  per day.
evidence_tier: plausible_emerging
rationale: >
  The macular-pigment mechanism is well established and not controversial — lutein and
  zeaxanthin are physically deposited in the macula, which is a strong biological
  rationale. The clinical evidence in the chapter is thinner than the mechanism: the
  carotenoid trial cited here is 27 people, only 15 of them treated, unblinded as
  described, and 12 months long. The chapter also cites the LAST trial (lutein 10 mg,
  12 months, double-blind) showing improved visual function. So: mechanism strong,
  trials small. The comparative assertion that carotenoids outrank vitamin C, E, zinc
  and selenium is the authors' interpretation and is not backed by a head-to-head
  study in the chapter. Tiered plausible_emerging on that basis.
coaching_translation: >
  The exact patch of the eye that macular degeneration attacks is yellow, and it is
  yellow because it stores two plant pigments — lutein and zeaxanthin. Your body
  cannot make them; they come from food. So eating for eye pigment is a real,
  physical thing, not a wellness slogan. In Indian kitchens the strongest everyday
  sources are dark leafy greens (palak, methi leaves, amaranth/chaulai, drumstick
  leaves/moringa), sweet corn and makai, capsicum, mango, papaya, egg yolk if the
  client eats eggs, and tomatoes and watermelon for lycopene. Cook greens with a
  little ghee or oil — these pigments are fat-soluble and a dry preparation wastes
  most of them.
caveats:
- The supporting trials are small; expect slowed progression or modest functional gain,
  not restored vision. Do not promise improvement.
- Astaxanthin and high-dose carotenoid supplements are a purchase decision the client
  should run past their eye doctor, particularly if they are already on an AREDS-type
  formula, to avoid stacking zinc and copper twice.
- Carotenoid absorption needs dietary fat and is reduced in fat-malabsorption states
  and on very low-fat diets.
- The book's food-source table is Western-produce-focused (corn, kiwi, grapes); the
  Indian green-leafy sources above are substantially richer and cheaper and should be
  the first line for Indian clients.
