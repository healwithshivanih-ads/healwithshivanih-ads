slug: glp1-therapy-protein-and-strength-training-targets
statement: A 2025 joint advisory from four US obesity and nutrition societies notes proposed
  protein targets of 1.2-1.6 g per kg body weight per day during active weight loss, or a
  simpler absolute target of 80-120 g a day, and recommends strength training at least 3 times
  a week plus at least 150 minutes of moderate aerobic activity to preserve muscle and bone.
  It states that more protein alone is likely inadequate without structured strength training.
evidence_tier: plausible_emerging
rationale: The published basis for the protein + strength pairing on a GLP-1; keeps our own
  advice anchored.
coaching_translation: Protein at every meal is the building material; strength training is
  the signal to use it. Neither works well alone.
out_of_scope_notes: Whether to start, stop, taper or restart a GLP-1 medicine is the prescriber's
  decision, not a coaching one.
caveats:
- Expert advisory, not a trial; targets are described as 'proposed'
- Unclear whether to calculate from actual or adjusted body weight in people with obesity
  - the absolute 80-120 g figure avoids that
- Protein targets need individualising for kidney disease or raised uric acid
