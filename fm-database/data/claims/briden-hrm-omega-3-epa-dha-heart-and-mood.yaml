slug: briden-hrm-omega-3-epa-dha-heart-and-mood
statement: Fish oil providing ≥720 mg EPA daily (usually 2000 mg total fish oil) reduces
  coronary heart disease risk per a large meta-analysis, and does well for major depression
  via inflammation-reduction and cell-membrane fluidity. Check with doctor if on blood-thinners.
  Preformed EPA + DHA available only from animal sources — vegans supplement algae-derived
  EPA/DHA at similar doses.
evidence_tier: strong
