slug: briden-hrm-cautious-testosterone-for-women
statement: 'Testosterone therapy in women helps ~50% for libido / clitoral sensitivity
  BUT only if adequate estrogen is on board first. Claims for testosterone improving
  mood, bone, cognition and muscle are NOT supported by evidence. Real risks: promotes
  insulin resistance, weight gain, hair loss, acne and possibly breast cancer. Rule:
  use only if no insulin resistance and no breast cancer history; use low-dose cream
  (not tablet/injection/pellet); always pair with estradiol + progesterone; monitor
  for excess-androgen signs.'
evidence_tier: confirm_with_clinician
