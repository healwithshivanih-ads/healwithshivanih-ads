slug: ukihca-large-group-is-facilitation
statement: Coaching 30+ people isn't coaching, it's facilitation. The skill shifts
  to designing connection at scale — breakout triads and dyads, journal prompts everyone
  does together, a few people sharing back to the whole room, accountability buddies
  working between sessions, and a private community space to keep engagement warm.
  Engagement is designed, not hoped for.
evidence_tier: plausible_emerging
rationale: Coach-facing takeaway distilled from the live-call reflection; ready for
  use in briefings and sessions.
coaching_translation: For groups over ~12, plan the breakouts before you plan the
  content. The room's structure is the intervention.
