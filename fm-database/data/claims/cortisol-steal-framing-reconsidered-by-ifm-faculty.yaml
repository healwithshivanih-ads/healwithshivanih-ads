slug: cortisol-steal-framing-reconsidered-by-ifm-faculty
statement: An active IFM-faculty physician who was originally taught the 'cortisol
  steal' (pregnenolone steal) model states that framing is being retired within
  current IFM teaching, in favor of describing chronic stress as suppressing sex-hormone
  AND cortisol output together via a shared upstream brain signal — rather than
  cortisol 'stealing' shared precursor away from progesterone/DHEA production.
evidence_tier: plausible_emerging
rationale: This is a credentialed, current-practice correction from an active IFM
  instructor, directly contradicting the framing in the catalogue's existing cortisol-steal
  claims (cortisol-steal-depletes-sex-hormones-under-stress, cortisol-steal-depletes-progesterone-and-dhea),
  which were sourced to an FM lecture and already flagged in their own caveats as
  thin outside FM circles. It does not settle the underlying biochemistry either
  way — it reports that the term itself is being retired in current IFM teaching.
coaching_translation: Frame chronic stress to clients as something that can turn
  DOWN sex-hormone production overall — not as stress hormones 'stealing' the raw
  materials meant for reproductive hormones. Either way, the coaching lever is the
  same — stress-management, sleep, and lifestyle work support sex-hormone balance.
caveats:
- This directly conflicts with two existing catalogue claims that use the 'cortisol
  steal' framing (cortisol-steal-depletes-sex-hormones-under-stress, cortisol-steal-depletes-progesterone-and-dhea)
  — both remain in the catalogue as plausible_emerging with their own caveats; this
  entry is the newer, credentialed counter-view, not a resolution. Flagged for coach
  review.
- Speaker's stated reason for retiring the term ('to stay relevant... to stay up
  with other pathways') is a professional-community observation, not a cited mechanistic
  study.
