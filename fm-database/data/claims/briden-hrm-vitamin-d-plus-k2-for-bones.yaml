slug: briden-hrm-vitamin-d-plus-k2-for-bones
statement: 'Vitamin D3 (1000–3000 IU) must be paired with vitamin K2 as MK-7 (menaquinone-7,
  75 mcg) — together they absorb calcium AND direct it into bones instead of blood
  vessels. K2 alone ''rivals bisphosphonate therapy'' for fracture-risk reduction
  per one Canadian researcher, without the toxicity. Vitamin D3 without K2 can cause
  hypercalcaemia and vessel calcification (worsening atherosclerosis). Food K2: hard
  cheeses, natto, sauerkraut (careful with histamine). Also protects the heart via
  preventing arterial calcification.'
evidence_tier: strong
linked_to_topics:
- osteoporosis
- cardiovascular-disease-prevention
linked_to_symptoms:
- vascular-calcification
sources:
