slug: murray-periodontal-systemic-inflammation-link
statement: |
  Periodontal disease is not a purely local dental problem — it is an inflammatory
  condition of the gums and tooth-support structures that can be a manifestation of
  systemic disease, including diabetes, anaemia, vitamin deficiency states, leukaemia
  and other disorders of white blood cell function. Murray & Pizzorno also report an
  association with hardening of the arteries, on the grounds that periodontal disease
  is associated with an elevation in C-reactive protein — an inflammatory marker that
  is itself an independent risk factor for heart disease. Practically, this means gum
  disease in a client should prompt curiosity about metabolic and immune status, not
  just about brushing technique.
evidence_tier: plausible_emerging
rationale: >
  The book states the association plainly but offers only a single citation and no
  effect sizes, no prospective data, and no evidence that treating gum disease changes
  cardiovascular outcomes. The mechanistic story — chronic gingival infection raising
  systemic CRP — is biologically coherent and is now widely discussed, but this text
  supports association, not causation, and predates the larger trials. The systemic-
  disease list (diabetes, anaemia, leukaemia) is standard clinical teaching and is
  better supported than the atherosclerosis link. Tiered plausible_emerging because
  the direction of causality is unresolved: inflamed gums may be a marker of a poorly
  regulated immune system rather than the cause of arterial disease.
coaching_translation: >
  Bleeding or inflamed gums are worth taking seriously as a whole-body signal, not
  just a dental nuisance. Gum inflammation often travels with blood-sugar problems,
  low immunity and general inflammation — so if a client mentions bleeding gums, it is
  a good moment to look at the wider picture with them and to encourage them to see a
  dentist. We are not saying gum disease causes heart disease; we are saying inflamed
  gums and an inflamed body often show up together, and the same habits help both.
caveats:
- Association only. This chapter does not show that treating gum disease lowers cardiac risk.
- Persistent gum bleeding can signal undiagnosed diabetes, anaemia or a white-cell disorder — that is a doctor's assessment, not the coach's.
- Elevated CRP has many causes; the coach never interprets a CRP result.
- The book is a 2012 US text; prevalence figures and dietary intakes cited are US-based.
