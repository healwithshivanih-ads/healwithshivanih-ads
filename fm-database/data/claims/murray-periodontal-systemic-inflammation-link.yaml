out_of_scope_notes: >
  Diagnosing periodontitis, probing pocket depth, scaling and root planing are dentist
  or periodontist scope. Ordering or interpreting CRP, HbA1c or a full blood count is
  clinician scope. The coach's legitimate actions here are: noticing the symptom,
  educating on the gum-body connection in general terms, and referring to a dentist
  and, where systemic disease is suspected, to the client's physician.
