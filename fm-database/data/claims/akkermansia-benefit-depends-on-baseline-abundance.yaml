slug: akkermansia-benefit-depends-on-baseline-abundance
statement: Metabolic benefit from Akkermansia muciniphila supplementation depends on how much
  the person already carries. In a 12-week RCT in 58 adults with overweight/obese type 2
  diabetes there was NO significant whole-cohort difference versus placebo; on stratification,
  those with low baseline A. muciniphila showed high colonisation and significant reductions
  in body weight, fat mass and HbA1c, while those with high baseline showed poor colonisation
  and no clinical improvement. The 2026 weight-maintenance RCT independently found initial
  Akkermansia abundance associated with cardiometabolic response.
evidence_tier: plausible_emerging
rationale: Zhang 2025 (Cell Metabolism, NCT04797442) is the only trial in this set with no
  declared competing interests, and its whole-cohort result was NULL — the effect exists only
  in the low-baseline subgroup, verified downstream in germ-free mice given low- vs
  high-Akkermansia faeces. Mount 2026 reports the same association independently. This is the
  claim that decides WHO gets the supplement, and it is the reason the catalogue does not
  recommend it to every client with a metabolic diagnosis.
coaching_translation: This one is worth testing before buying. If a stool panel shows your
  Akkermansia is already healthy, adding more has not helped people in trials — the food-first
  polyphenol approach is the better spend. It is the people running low who saw the change.
caveats:
- Zhang 2025 used a LIVE strain (AKK-WST01). Colonisation-dependence may not transfer to a pasteurised
  postbiotic, which does not need to colonise. Genuinely unresolved — do not generalise either way.
- Dao 2016 found the opposite direction for a DIET intervention (higher baseline predicted better
  response to calorie restriction). Both support "Akkermansia is a stratifier"; neither supports blanket use.
- Baseline abundance requires a stool PCR panel (GI-MAP or equivalent) — a real cost barrier in India.
- Subgroup finding in a trial whose primary analysis was null. Treat as hypothesis-generating.
- Captured from the PubMed abstract; Cell Metabolism full text was 403.
