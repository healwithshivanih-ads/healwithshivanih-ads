slug: luteal-glucose-worsens-even-with-existing-dysglycemia
statement: Luteal-phase glucose variability worsens even in women whose glucose control
  is already poor throughout the cycle, so the phase effect applies to metabolically
  healthy and dysglycemic clients alike.
evidence_tier: fm_specific_thin
rationale: In pilot scoring data, a client with prediabetes scored badly across the
  whole cycle yet still showed her worst variability in the luteal phase.
coaching_translation: If you already struggle with blood sugar, the premenstrual
  fortnight is when it gets hardest — plan for it rather than being surprised by it.
