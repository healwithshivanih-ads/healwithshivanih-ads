out_of_scope_notes: >
  Suggesting a specific CoQ10 dose is prescribing and sits with the physician,
  especially given the warfarin interaction. The coach may educate that CoQ10 has
  trial evidence in gum disease, may flag statin-related CoQ10 depletion for the
  doctor's attention, and must refer the periodontal treatment itself to a dentist.
