slug: negative-mcas-testing-repeat-up-to-three-rounds
statement: One round of negative mediator testing does not refute a history that strongly suggests MCAS;
  some specialists repeat non-invasive testing up to three times, ideally during symptoms, before moving
  to biopsy. Documented lab evidence matters because the patient must convince every future local doctor.
evidence_tier: fm_specific_thin
rationale: Helps the coach support a client through repeat testing rather than accepting one negative.
coaching_translation: One normal result doesn't close the question. Testing during a flare, and sometimes
  more than once, gives a better chance of catching it.
out_of_scope_notes: ''
caveats:
- Afrin's personal practice style; other clinicians treat empirically.
