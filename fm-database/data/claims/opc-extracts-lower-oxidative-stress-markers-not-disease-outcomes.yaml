out_of_scope_notes: >
  Autoimmune disease and viral reactivation are clinician territory and a coach
  must not position any supplement as treatment for them. What IS in scope, and
  more useful, is managing expectations: telling a client plainly that the
  antioxidant story stops at a blood marker protects them from spending on a
  hypothesis, and it protects the coaching relationship when the supplement does
  not deliver what the internet promised.
