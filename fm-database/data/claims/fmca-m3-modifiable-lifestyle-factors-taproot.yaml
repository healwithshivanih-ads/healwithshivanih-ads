slug: fmca-m3-modifiable-lifestyle-factors-taproot
statement: IFM's 'modifiable lifestyle factors' — sleep, movement, nutrition, stress,
  relationships, and time/spirit — are the taproot the coach works with. SMART goals
  attach to one lifestyle factor at a time; the coach's job is helping the client
  sustain change in the one lever that will unlock the most.
evidence_tier: strong
rationale: Coach-facing takeaway distilled from the live-call reflection; ready for
  use in briefings and sessions.
coaching_translation: Pick one factor per phase. Sleep first if a client is depleted;
  nutrition first if energy is stable. Don't work all six at once.
