slug: birth-control-elevated-shbg-masks-low-free-testosterone
statement: Birth control use can raise sex hormone binding globulin (SHBG), and
  that elevation can persist into perimenopause — binding up testosterone so that
  free (usable) testosterone is low even when total testosterone looks normal or
  high on a standard panel. Requesting SHBG alongside total testosterone (to calculate
  a free androgen index) surfaces this pattern.
evidence_tier: strong
rationale: Oral contraceptives are well documented to raise hepatic SHBG production,
  and SHBG-bound testosterone is not bioavailable — both are established endocrine
  facts. The persistence into perimenopause and resulting symptom picture is the
  speaker's clinical synthesis of established physiology.
coaching_translation: If a client has a history of long-term birth control use and
  low-testosterone-type symptoms (low libido, fatigue, low motivation) despite a
  'normal' testosterone result, it's worth her asking her provider whether SHBG
  and free testosterone were checked — not something a coach interprets herself.
caveats:
- Free androgen index calculation and interpretation is clinician scope.
