slug: fmca-m3-atm-into-coaching
statement: The Antecedents-Triggers-Mediators (ATM) framework and the IFM Matrix aren't
  only intake tools for the clinician — they're coach-usable lenses too. Referring
  back to what antecedents shaped this client, what triggered the current pattern,
  and what's mediating it now, keeps the coaching conversation anchored to root causes
  rather than surface symptoms.
evidence_tier: plausible_emerging
rationale: Coach-facing takeaway distilled from the live-call reflection; ready for
  use in briefings and sessions.
coaching_translation: Keep the client's ATM story visible on your case notes. Refer
  back to it when they're stuck.
