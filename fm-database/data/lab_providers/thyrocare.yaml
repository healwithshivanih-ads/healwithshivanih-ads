# Thyrocare — PRIMARY lab provider from Nov 2026 (Acumen is the backup).
#
# The standard panel is Aarogyam F Pro + fasting glucose (F Pro does NOT include
# FBS; HOMA-IR, TyG and the other insulin scores need it). Contents verified
# against a real F Pro report (17 Nov 2026).
#
# PRICES (read from the ThyroNXT partner portal, 18 Nov 2026):
#   client pays Thyrocare's LIST price ("Test Price" in ThyroNXT) — coach's call;
#   our_cost_inr = list price − ThyroNXT "Incentive" (what we keep).
#   Profiles are summed from their parts (F Pro + FBS + hormone tests/bundles).
#   Re-read ThyroNXT when Thyrocare changes its rates; a profile missing
#   our_cost_inr or mrp_inr is unbookable (lab-providers.ts fails closed).
#
# Booking: MANUAL for now — a paid order WhatsApps the coach (env
# THYROCARE_ALERT_WHATSAPP, falling back to COACH_NOTIFY_PHONE) and she books
# Thyrocare herself. Switch `booking` to `api` once the Thyrocare partner API
# is wired.

provider:
  slug: thyrocare
  display_name: Thyrocare
  role: primary
  booking: manual
  alert_recipients_env: THYROCARE_ALERT_WHATSAPP
  phone_e164: ""
  website: https://www.thyrocare.com
  home_collection: true
  # Add-ons carry explicit prices (no %-of-catalogue rule like Acumen's deal).
  addon_our_cost_fraction: null
  addon_client_price: explicit
  # Shown to the client on the pay screen, before they book. Client-facing:
  # short, plain, brand voice.
  pretest_instructions:
    - "Fast for 10–12 hours before the test. Water is fine."
    - "Book a morning slot (7–9 am) if you can."
    - "Pause biotin for 3 days before. It hides in hair, skin & nail and B-complex supplements."
    - "No hard workouts for 3 days before, and no alcohol for 2 days."
    - "Avoid paracetamol (Crocin, Dolo) for 2 days if you can. Take your prescribed medicines as usual."
    - "Unwell in the last 2 weeks? Message us before booking. It is better to move the test."
  notes_for_coach: >-
    Primary lab from Nov 2026. Aarogyam F Pro covers thyroid levels, insulin,
    HbA1c, fructosamine, full lipids + ApoA1/ApoB/Lp(a)/LP-PLA2, hs-CRP,
    homocysteine, iron studies, vitamin D/B12/folate, magnesium, calcium,
    phosphorus, sodium, chloride, liver + kidney panels, CBC, amylase, lipase,
    RF, anti-CCP, ANA, total IgE and 22 elements (heavy metals + selenium,
    manganese, molybdenum). It does NOT cover thyroid antibodies, post-meal
    glucose/insulin, potassium, zinc, copper, ESR, urine, sex hormones or
    cortisol — those are add-ons.
  updated_at: '2026-11-18'
  updated_by: shivani

