# ---------------------------------------------------------------------------
# LONGEVITY PANELS — priced for the planned longevity vertical, NOT bookable.
# lab-providers.ts reads only `provider`, `profiles_final` and `addon_tests`, so
# nothing here reaches the coach app or a client until a longevity flow is built
# and deliberately wires it in (with its own PROFILE_RULES entry).
# Prices read from ThyroNXT, 18 Nov 2026.
# ---------------------------------------------------------------------------
longevity_panels:
  - key: body-age
    name: "Know your body age"
    # ThyroNXT "Comprehensive Heart Health Checkup" (97 tests): ₹2,364 list,
    # ₹710 incentive + "HOMA Insulin Resistance Index": ₹460 list, ₹65 incentive.
    thyrocare_items: ["Comprehensive Heart Health Checkup", "HOMA Insulin Resistance Index"]
    our_cost_inr: 2049
    list_inr: 2824
    covers:
      - "Body age (PhenoAge): albumin, creatinine, fasting glucose, hs-CRP, lymphocyte %, MCV, RDW, ALP, WBC"
      - "Liver & metabolic risk: ALT, AST, GGT, platelets, triglycerides, fasting insulin, HOMA-IR, TyG, HSI, FIB-4 (FLI/LAP/TyG-WC need a waist)"
      - "Heart: hs-CRP, ApoB, ApoA1, Lp(a), homocysteine, full lipids"
      - "Also: HbA1c, TSH + total T3/T4, kidney panel, urine routine"
    not_covered: ["vitamin D", "vitamin B12", "free T3/T4", "iron studies"]
  - key: body-age-deeper
    name: "Body age, with deeper tests"
    # The standard client panel (profiles_final id 1: Aarogyam F Pro + fasting glucose, ₹4,959 cost) plus the
    # urine routine add-on (₹135 cost), so the deeper report has its Urine section like the standard one.
    # Approved by Shivani 21 Nov 2026 ("Yes, add it"): cost 4,959 → 5,094. Profile 1 itself is unchanged.
    thyrocare_items: ["Aarogyam F Pro", "Fasting Blood Sugar (FBS)", "Urine routine"]
    our_cost_inr: 5094
    list_inr: 7259
    covers:
      - "Everything in profile 1 (see profiles_final)"
      - "Urine routine"
