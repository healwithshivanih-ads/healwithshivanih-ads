    covered_addon_slugs: [fasting-glucose, insulin-fasting, hba1c, lipid-profile, apob, lp-a, hscrp, homocysteine, iron-studies, ferritin, vitamin-d, vitamin-b12, folate-serum, magnesium-serum, lft, rft, cbc, ana, anti-ccp, total-ige, heavy-metals]
