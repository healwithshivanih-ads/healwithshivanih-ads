id: vilar-gomez-2015-weight-loss-nash-resolution
title: Weight Loss Through Lifestyle Modification Significantly Reduces Features of Nonalcoholic Steatohepatitis
source_type: peer_reviewed_paper
quality: high
authors:
  - Vilar-Gomez E
  - Martinez-Perez Y
  - Calzadilla-Bertot L
  - Friedman SL
  - Romero-Gomez M
year: 2015
publisher: Gastroenterology 149(2):367-378
url: https://pubmed.ncbi.nlm.nih.gov/25865049/
doi: 10.1053/j.gastro.2015.04.005
notes: |
  293 biopsy-proven NASH patients on a 52-week lifestyle programme with
  repeat biopsy. Losing 5% or more of body weight resolved NASH in 58%;
  losing 10% or more resolved it in 90% and regressed fibrosis in 45%. The
  dose-response is with weight lost, not with any one diet. Read from the
  PubMed abstract (17 Nov 2026).
