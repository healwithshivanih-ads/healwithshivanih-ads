notes: 57-minute interview recorded 27 Feb 2023, full transcript read. Afrin (hematologist, author of
  Never Bet Against Occam, lead author of the consensus-2 MCAS criteria) covers acquired mast-cell mutations,
  the inflammation / allergic / dystrophism pattern, mediator testing, CD117 restaining of archived biopsies,
  and his stepwise treatment method (triggers, then H1+H2, then one-at-a-time trials). He states his own
  prevalence estimate (17-20%) is preliminary; it is contested by allergy bodies.
