notes: Randomised withdrawal RCT (n=670). 20.9% loss in 36-week open-label lead-in; placebo arm regained 14.0% over
  52 weeks vs a further 5.5% loss on continued tirzepatide; net 9.9% below baseline at week 88 on placebo. Industry-funded
  (Eli Lilly). Read 7 Oct 2026 from the PubMed abstract.
