id: aronne-2024-surmount4-tirzepatide-maintenance
title: 'Continued Treatment With Tirzepatide for Maintenance of Weight Reduction in Adults With Obesity: The SURMOUNT-4
  Randomized Clinical Trial'
source_type: peer_reviewed_paper
quality: high
authors:
