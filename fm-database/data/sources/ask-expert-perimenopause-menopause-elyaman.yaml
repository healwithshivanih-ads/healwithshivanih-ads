notes: 'FMCA Ask-the-Expert webinar recording, hosted by Dr. Sandra Scheinbaum,
  published 21 Aug 2026 (~57 min). Yousef Elyaman, MD, IFMCP — founder and medical
  director of Absolute Health, an insurance-based functional medicine primary care
  practice in Ocala, Florida; board-certified in internal medicine; IFM faculty
  (cardiometabolic and hormone modules); functional medicine director of Guest House
  Ocala (trauma/substance center); medical director of Humann (SuperBeets/Neo40);
  founder/host of FMP Essentials. Covers estrogen/progesterone/testosterone physiology
  across the perimenopause-to-postmenopause continuum, a critical re-read of the
  2002 Women''s Health Initiative study (population and formulation mismatches),
  hormone testing timing and route-of-administration pearls, supplement pearls,
  and coaching-scope boundaries with urgent-referral guidance. Includes a live Q&A
  section. Credentialed clinical-practice source, captured via yt-dlp auto-captions
  (cleaned/deduped) and read directly — no Anthropic API used for extraction. Evidence
  tier set per-claim — mechanistic/consensus statements strong-to-plausible_emerging;
  individual clinical pearls fm_specific_thin where the speaker himself notes the
  supporting studies are small and short.'
