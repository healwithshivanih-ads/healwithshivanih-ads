notes: 'Double-blind, randomised, placebo-controlled parallel trial. 100 participants
  recruited, 86 completed; women and men aged 20-75 with dry eye symptoms; 2 g/day
  sea buckthorn oil or placebo oil for 3 months, run from autumn into winter. Registered
  as NCT00739713. CAPTURE CAVEAT: details were taken from the abstract and the trial
  registry entry via web search — the full text and PubMed were both blocked by the
  container egress proxy, so the methods section has NOT been read. The author list
  here is truncated to the first author for that reason, and no DOI is recorded rather
  than risk an unverified one. Re-tier and complete the citation if anyone reads the
  primary methods.'
