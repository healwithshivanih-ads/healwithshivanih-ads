notes: |
  The paper that built the Fatty Liver Index from BMI, waist, triglycerides
  and GGT (Dionysos study, 496 Italians, fatty liver by ultrasound).
  Accuracy 0.84. FLI below 30 rules fatty liver out; 60 or more rules it in.
  Authors ask for validation in other populations. Read from the PubMed
  abstract (17 Nov 2026).
