notes: PMID 41500720. Read in FULL TEXT (Europe PMC) on 2026-10-07. 37 studies, 63 intervention
  arms, 9341 participants. Figures for semaglutide/tirzepatide ('newer and more effective
  incretin mimetics') come from 10 intervention arms / 1776 participants with at most 12 months
  of follow-up; anything beyond 12 months is a linear projection, which the authors state
  themselves. Cardiometabolic-marker reversal (1.4 years) is for ALL weight-management medications;
  the paper says data were insufficient to analyse markers for the newer drugs separately.
