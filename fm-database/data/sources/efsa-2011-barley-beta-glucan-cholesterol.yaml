id: efsa-2011-barley-beta-glucan-cholesterol
title: Scientific Opinion on the substantiation of a health claim related to barley beta-glucans and lowering of blood cholesterol
  and reduced risk of (coronary) heart disease pursuant to Article 14 of Regulation (EC) No 1924/2006
source_type: clinical_guideline
quality: high
authors:
- EFSA Panel on Dietetic Products, Nutrition and Allergies (NDA)
year: 2011
publisher: EFSA Journal 9(12):2470
url: https://efsa.onlinelibrary.wiley.com/doi/abs/10.2903/j.efsa.2011.2470
doi: 10.2903/j.efsa.2011.2470
notes: >-
  The EU regulatory opinion that authorised the barley beta-glucan cholesterol
  claim. Basis was a meta-analysis of 11 RCTs plus a further RCT at doses of at
  least 3 g/day beta-glucan, showing reductions in total and LDL cholesterol in
  both normo- and hypercholesterolaemic subjects. The US FDA carries the parallel
  claim for 3 g/day or more of beta-glucan soluble fibre from whole oats or barley.

  THE DOSE CONDITION IS THE POINT. The authorisation is for 3 g/day of beta-glucan
  delivered by the food. It says nothing about a strained barley water, and this
  catalogue must not let the grain's strong evidence be borrowed by the drink —
  see claim barley-water-is-a-fluid-vehicle-not-a-beta-glucan-dose.
