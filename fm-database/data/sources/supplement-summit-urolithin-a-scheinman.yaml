notes: 'FMCA Supplement Summit presentation, 22 Jul 2026 (~32 min). CONFLICT OF
  INTEREST — THIS IS A VENDOR PRESENTATION AND MUST BE READ AS ONE. The speaker is
  Senior Manager of Nutrition Affairs at Timeline Nutrition, which manufactures
  Mitopure, the branded urolithin A used in every trial shown. Efficacy figures,
  the "20+ RCTs" count and the safety framing are all company-sourced; slides carry
  Timeline branding throughout and the deck closes on a product line-up and a
  practitioner ordering slide. Quality is set to low for that reason, not because
  the underlying journals are weak — Nature Metabolism, Cell Reports Medicine, JAMA
  Network Open and Nature Aging are not. The right posture is: the mechanism and
  the trial existence are credible; the effect sizes are manufacturer-reported and
  should be confirmed from primary text before front-lining.

  NO CONTRAINDICATIONS WERE GIVEN. Across the whole talk there was no statement on
  pregnancy, lactation, medication interaction, renal or hepatic caution, or who
  should not take it — searched explicitly. Absence of stated harm in a vendor deck
  is not evidence of safety, and the catalogue keeps its own pregnancy/lactation
  caution regardless.

  RESEARCH NAMED ON THE SLIDES (all captured from slide citations, none read in
  full): Andreux 2019 Nature Metabolism (first human RCT, n=60, 70+ sedentary
  pre-frail, 500/1000 mg, muscle-biopsy mitochondrial gene expression); Singh 2022
  Cell Reports Medicine (middle-aged, 500 mg, 4 months, hamstring isokinetic peak
  torque); Liu 2022 JAMA Network Open (older adults, 1000 mg, 8 weeks, muscle
  endurance hand and leg); Denk 2025 Nature Aging (middle-aged, 1000 mg, 1 month,
  immune-cell markers); Zhao 2024 (resistance-trained young men, n=20, 1 g, 2
  months); Whitfield 2025 (elite distance runners, n=22, 1 g, 4-week altitude
  camp); Acevedo 2025 (academy footballers, 6-week camp); D''Amico et al. preprint
  2023 (topical skin, 48 women wrinkle depth, 22 photoaging, plus keratinocyte and
  fibroblast preclinical). Ongoing and unpublished at time of talk: MitoCancer
  NCT07161310 and URO-PRO NCT06022822. Also asserted: FDA GRAS 2018, NSF Certified
  Sport, >2000 trial participants, >300 muscle and skin biopsies.

  Captured from the FMCA course mirror by slide OCR plus the bundled English
  subtitle track.'
