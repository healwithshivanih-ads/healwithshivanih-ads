id: sterling-2006-fib4-index
title: Development of a simple noninvasive index to predict significant fibrosis in patients with HIV/HCV coinfection
source_type: peer_reviewed_paper
quality: high
authors:
  - Sterling RK
  - Lissen E
  - Clumeck N
  - Sulkowski MS
  - Thomas DL
year: 2006
publisher: Hepatology 43(6):1317-1325
url: https://pubmed.ncbi.nlm.nih.gov/16729309/
doi: 10.1002/hep.21178
notes: |
  The paper that built FIB-4: (age x AST) / (platelets x square root of ALT).
  Derived in 832 HIV/hepatitis C patients; below 1.45 it ruled out advanced
  fibrosis with 90% negative predictive value. Fatty-liver guidance later
  uses 1.3 as the low-risk cut-off (see McPherson 2010, AASLD 2023). Read
  from the PubMed abstract (17 Nov 2026).
