notes: 327-participant off-treatment extension of STEP 1. Lost 17.3% on semaglutide 2.4 mg over 68 weeks; regained
  11.6 percentage points (two-thirds) within a year of stopping drug AND lifestyle intervention; net loss 5.6% at
  week 120. Cardiometabolic gains reverted toward baseline. Exploratory analyses. Read 7 Oct 2026 from the PubMed
  abstract.
