notes: 'The original albumin adjustment of serum calcium (calcium tracked albumin, r=0.87). Payne''s formula
  was calcium - albumin + 4.0 (mg/dL, g/dL); the app uses the widely used later form calcium + 0.8 x (4.0
  - albumin). Ionised calcium is the direct measure when it matters.

