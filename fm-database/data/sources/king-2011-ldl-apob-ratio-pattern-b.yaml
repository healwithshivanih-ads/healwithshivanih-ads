notes: '97 people with type 2 diabetes, LDL size by gel electrophoresis: the LDL-C/ApoB ratio predicted
  small dense LDL (''pattern B''), but less well (AUC 0.71) than TG/HDL (0.87) or triglycerides alone
  (0.84). So the app reads LDL-C/ApoB together with TG/HDL, never alone.

