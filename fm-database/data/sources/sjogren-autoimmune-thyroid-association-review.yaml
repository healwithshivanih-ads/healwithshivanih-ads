id: sjogren-autoimmune-thyroid-association-review
title: The Association of Sjogren Syndrome and Autoimmune Thyroid Disorders
source_type: peer_reviewed_paper
quality: moderate
authors: []
year: 2018
url: https://pmc.ncbi.nlm.nih.gov/articles/PMC5891591/
notes: >-
  Why dry mouth in a Hashimoto's client is never a throwaway symptom.

  Sjogren's prevalence in autoimmune thyroid disease runs 3-32%, with 17% in
  Hashimoto's specifically and 5% in Graves'. 37% of AITD patients met criteria for
  xerostomia and 23% for keratoconjunctivitis sicca; Sjogren's FEATURES were
  present in 24% overall and 27% in Hashimoto's. Conversely, AITD in primary
  Sjogren's runs at nine times the general-population rate.

  The link is not mere co-occurrence - anti-thyroglobulin antibodies in primary
  Sjogren's and in Hashimoto's overlap within a single region of human
  thyroglobulin, implying shared pathogenesis.

  Also see high prevalence of subclinical Sjogren's features in AITD
  (https://pubmed.ncbi.nlm.nih.gov/9292794/).
