notes: 'Used in this catalogue for its two ASSESSMENTS rather than for exercise
  prescription — they are the baseline that tells the coach which level of a balance
  or sit-to-stand entry to start someone at, and they need nothing but a chair and a
  stopwatch.

  30-SECOND CHAIR STAND: count full sit-to-stands in 30 seconds, arms folded across
  the chest (no hands). Assesses leg strength and endurance.

  4-STAGE BALANCE TEST: four progressively harder static stances — feet side by side,
  semi-tandem, tandem, single leg. Hold each 10 seconds to pass and move on.

  RELATIONSHIP TO OTAGO: [otago-exercise-programme-2003] uses its own chair stand test
  and four-test balance scale for the same purpose. The two are close cousins; the
  Otago versions are the ones its Table 4 levels are calibrated against, so where a
  catalogue entry names a level, the Otago assessment is the one that governs. STEADI
  is recorded here because it is free, current, widely used, and gives the coach a
  second reference point.

  Captured from the CDC STEADI clinical-resources pages and the two assessment PDFs
  as summarised in search results; the individual PDFs have NOT been read in full,
  and no year is asserted because the materials are periodically revised.

