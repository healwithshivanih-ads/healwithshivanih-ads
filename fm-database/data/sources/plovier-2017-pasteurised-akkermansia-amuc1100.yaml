notes: |
  The MECHANISM paper behind "why pasteurised". Mouse work, and it must be
  labelled as such — but it is the only source that explains a result that
  otherwise looks like a typo.

  Three findings the catalogue leans on: (1) pasteurisation did not
  destroy the effect, it ENHANCED the capacity to reduce fat mass,
  insulin resistance and dyslipidaemia; (2) the active component is
  Amuc_1100, an outer-membrane protein that signals through Toll-like
  receptor 2, improves the gut barrier, and is heat-stable at
  pasteurisation temperatures — so a heat-killed preparation retains the
  working part; (3) A. muciniphila grown on a synthetic (animal-free)
  medium keeps its efficacy, which is what made human administration
  possible at all.

  This is why a postbiotic Akkermansia product is not a downgraded live
  one. It is also why "dead bacteria cannot work" is the wrong objection
  to raise with a client — the mechanism is a surviving protein
  interacting with a receptor, not colonisation.

  Mouse model. Do not present Amuc_1100/TLR2 to a client as established
  human physiology.

  Captured from the PubMed abstract; publisher full text paywalled.
