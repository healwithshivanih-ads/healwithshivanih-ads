notes: |
  Observational human data (N = 49 overweight/obese adults, 41 women;
  6-week calorie restriction then 6-week stabilisation) that grounds the
  Akkermansia story in something other than supplementation trials.

  At baseline, A. muciniphila abundance was INVERSELY related to fasting
  glucose, waist-to-hip ratio and subcutaneous adipocyte diameter; the
  people with both high gene richness and high Akkermansia had the
  healthiest metabolic profile. The prognostic finding is the useful one:
  individuals with HIGHER baseline Akkermansia got MORE improvement in
  insulin sensitivity from the same calorie restriction.

  Read carefully, that cuts both ways against the naive supplement pitch —
  here high baseline abundance predicted a BETTER diet response, whereas
  in Zhang 2025 low baseline predicted a better SUPPLEMENT response. Both
  are consistent with "Akkermansia status is a stratifier", which is the
  claim the catalogue makes, and neither supports giving it to everyone.

  Association study, not causal, and diet was the intervention — not a
  supplement.

  Captured from the PubMed abstract.
