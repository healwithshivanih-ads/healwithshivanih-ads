notes: 'Second book by Sydney/NZ naturopath Lara Briden, focused on perimenopause
  and the years

  after periods stop. Complements her first book (Period Repair Manual, cycles-focused)
  and

  the 15 Briden blog posts already in the catalogue by giving deep chapter-length
  coverage

  of second-puberty framing, MHT protocols (with heavy reliance on Prof Jerilynn Prior''s

  progesterone-alone work), rewiring the brain (hot flushes / sleep / migraines /
  memory /

  mood), metabolic changes (insulin resistance, weight, thyroid), heavy perimenopausal

  bleeding, and the "what comes after" long-term risk-reduction chapter (bone, heart,

  dementia). Evidence tier is high — Briden cites conventional endocrine literature

  extensively and disclaims scope for coach-facing (not prescriber-facing) use.

  '
