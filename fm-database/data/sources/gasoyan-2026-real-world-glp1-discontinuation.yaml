- Schulte R
- Boyer CB
- et al.
year: 2026
publisher: Diabetes, Obesity and Metabolism 28(6):4795-4805
url: https://pubmed.ncbi.nlm.nih.gov/41816857/
doi: 10.1111/dom.70660
notes: Cleveland Clinic retrospective EHR cohort, 7,938 adults who stopped within 3-12 months. Obesity group lost
  8.4%, then +0.5% one year after stopping; T2D group -1.3%. 19.6% restarted, 35.2% received another obesity treatment.
  Considerable individual variability. Observational, so quality moderate. Read 7 Oct 2026 from the PubMed abstract.
