id: acr-eular-sjogren-classification-criteria-2016
title: 2016 American College of Rheumatology / European League Against Rheumatism
  classification criteria for primary Sjogren's syndrome
source_type: clinical_guideline
quality: high
authors: []
publisher: Annals of the Rheumatic Diseases
year: 2016
url: https://ard.eular.org/article/S0003-4967(24)01570-X/fulltext
notes: >-
  The reference standard, and the source of the one objective measure a COACH can
  perform without a laboratory or a doctor - unstimulated whole salivary flow rate
  (UWSFR). A rate of 0.1 mL/min or less scores as a criterion item. The full
  criteria set reached 96% sensitivity and 95% specificity on validation.

  Threshold caveat worth carrying - a re-analysis argues 0.1 mL/min is too strict
  and that 0.2 mL/min gives sensitivity >=70% with specificity >=50%, raising
  sensitivity by ~19.8%
  (https://pmc.ncbi.nlm.nih.gov/articles/PMC7041275/). We therefore treat 0.1 as
  "clearly low" and 0.1-0.2 as "borderline, worth testing further" rather than
  normal.

  Serum anti-SSA/Ro performed at AUC 0.906 with 100% sensitivity and 81%
  specificity in one cohort, but SERONEGATIVE Sjogren's is real - a negative
  antibody panel does NOT exclude it, and diagnosis stays with a clinician.
