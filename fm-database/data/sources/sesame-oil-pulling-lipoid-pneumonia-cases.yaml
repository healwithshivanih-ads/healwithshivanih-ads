id: sesame-oil-pulling-lipoid-pneumonia-cases
title: 'Exogenous lipoid pneumonia caused by repeated sesame oil pulling: a report
  of two cases'
source_type: peer_reviewed_paper
quality: moderate
authors: []
year: 2015
url: https://pmc.ncbi.nlm.nih.gov/articles/PMC4628246/
notes: >-
  The safety anchor for every oil-pulling recommendation we make.

  Case 1 - 66-year-old man, 8 months of nightly sesame oil NASAL washing, "often
  aspirated the oil", presented with dry cough 3 months after onset; needed steroid
  pulse therapy plus bronchoalveolar lavage. Case 2 - 38-year-old woman, 6 months
  of morning mouth washing, "would sometimes aspirate", presented with shortness of
  breath 5 months after onset; improved on stopping alone.

  Both took MONTHS to present, which is why a slowly worsening cough or
  breathlessness in a client who oil pulls deserves a doctor rather than
  reassurance. Authors note it should be considered as a cause in regions where the
  custom is popular - i.e. exactly our client base. Aspiration is the mechanism, so
  reflux, dysphagia and sedating or anticholinergic medication are the risk
  multipliers.
