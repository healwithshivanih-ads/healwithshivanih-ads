id: shalimar-2022-nafld-prevalence-india-meta-analysis
title: Prevalence of Non-alcoholic Fatty Liver Disease in India — A Systematic Review and Meta-analysis
source_type: peer_reviewed_paper
quality: high
authors:
  - Shalimar
  - Elhence A
  - Bansal B
  - Gupta H
  - Anand A
