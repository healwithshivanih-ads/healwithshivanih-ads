notes: |
  The most-cited positive meta-analysis on grape seed extract (GSE) and blood
  pressure: 12 articles / 16 trials / 810 subjects. Pooled reductions of
  6.077 mmHg systolic and 2.803 mmHg diastolic. Subgroup analysis reported the
  effect as larger in younger subjects, obese subjects, and those with metabolic
  disorders.

  Quality is graded MODERATE, not high, deliberately. The pooled systolic figure
  is roughly four times the estimate from Feringa 2011 (-1.54 mmHg) and sits
  awkwardly against Asbaghi 2022, which — with more trials — found a significant
  diastolic effect but NO significant systolic effect. Trials are small,
  heterogeneous in preparation and dose, and several are industry-linked.
  Treat 6 mmHg as the optimistic end of a wide range, not the expected effect.

  Captured from the PubMed abstract and the journal record; the Ovid/LWW full
  text was not reachable through this container.
