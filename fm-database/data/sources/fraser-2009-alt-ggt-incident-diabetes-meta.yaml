notes: |
  Cohort of 4,286 British women aged 60-79 plus a meta-analysis of 21
  prospective population studies. Top versus bottom quarter of GGT carried a
  fully adjusted hazard ratio for diabetes of 2.94, against 2.02 for ALT, so
  GGT may be the better predictor. The authors read it as a liver-fat signal.
  This is the realistic effect size to quote, far smaller than the 20-fold
  single-cohort figure. Read from the PubMed abstract (17 Nov 2026).
