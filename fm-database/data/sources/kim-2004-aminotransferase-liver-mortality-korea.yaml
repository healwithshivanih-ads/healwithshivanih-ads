title: 'Normal serum aminotransferase concentration and risk of mortality from liver diseases: prospective cohort study'
source_type: peer_reviewed_paper
quality: high
authors:
  - Kim HC
  - Nam CM
  - Jee SH
  - Han KH
  - Oh DK
