notes: >-
  A DELIBERATELY HONEST CONTAINER, not a document. Some preparations in this
  catalogue are genuinely widespread Indian household or regional practice —
  sattu in the summer, gond katira sharbat, sabja in a cooling drink, kokum
  sherbet on the Konkan coast — but they are culinary custom rather than codified
  Ayurvedic medicine. They have no API monograph, no AFI monograph, no trial, and
  no single text that can be cited for them.

  Rather than attribute such a preparation to the coach's clinical notes (which
  would put words in her mouth) or to a pharmacopoeia that does not contain it
  (which would be a false citation), entries of that kind cite this record. It
  means exactly one thing: THIS IS WIDELY PRACTISED AND UNCODIFIED. Quality is
  `low` and every entry citing it alone is tiered fm_specific_thin.

  Do not use this as a convenience citation for anything that DOES have a real
  source — if an API or AFI monograph exists, or a trial exists, cite that
  instead. This record exists so the catalogue can carry useful folk practice
  without pretending it is evidence.
