notes: 'Double-blind, placebo-controlled RCT in adults aged 65-90, run at a medical
  centre and a cancer research centre in Seattle, Mar 2018 - Jul 2020. 1000 mg daily;
  muscle endurance improved at 2 months and the supplement was reported safe and
  well tolerated. Title, age range, setting and DOI verified against the publisher
  record. Manufacturer-funded. The +17% leg / +26% hand figures come from the vendor
  slide, not from this record — confirm them in the primary text before quoting.'
