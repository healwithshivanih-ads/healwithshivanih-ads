notes: >-
  Recipe e-book supplied with the sprout-me glass sprouting jar (Tiara Agencies
  Pvt Ltd, India, 2024; 90 pages). Front matter covers how to sprout beans,
  pulses, millets and seeds, storage times, common mistakes and FAQs, with a
  one-page note on the benefits of sprouting by Dr Rajshree Vacchrajani
  (nutritional medicine). The 60 recipes are grouped as mains, salads, snacks
  and miscellaneous (rice, soups, raitas, chutney). The book carries no
  nutrition figures.
  Used here for the recipe library only (data/_recipes): the 60 recipes plus
  four sprouting-method entries. Ingredient lists are captured as facts; steps
  and descriptions are written in our own words; calories and nutrients are
  computed by our own ingredient table, not taken from the book. Two safety
  edits against the book: sprouted rajma is boiled before use, and stored or
  raw seed sprouts are dipped in hot water first. Quality is "low" because this
  is a manufacturer's recipe booklet, not a clinical or reference source - its
  health claims (for example that sprouting raises vitamin B12) are NOT
  ingested as claims.
