id: three-oil-gingival-health-rct-2025
title: 'Comparison and Evaluation of the Efficacy of Sesame Oil, Coconut Oil, and
  Sunflower Oil Pulling on Gingival Health: A Triple-Blind Randomized Clinical Trial'
source_type: peer_reviewed_paper
quality: moderate
authors: []
year: 2025
url: https://pubmed.ncbi.nlm.nih.gov/39926945/
notes: >-
  The only trial that ISOLATES oil type - the same protocol, three oils, triple
  blinded. All three improved gingival health; coconut was most effective.

  This is the study that makes the coconut-over-sunflower recommendation
  evidence-based rather than inferred, because every other difference between the
  positive and null trials (session length, diseased vs healthy mouths, outcome
  measured) is held constant here. Captured from the PubMed abstract - the
  abstract does not give n, duration or effect magnitudes, so the finding is
  directional only. Re-tier and add numbers if anyone reads the full text.
