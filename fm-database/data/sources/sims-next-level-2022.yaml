notes: 'ISBN 978-0-593-23315-3. Sims holds a PhD in exercise physiology and environmental
  health and is a research scientist in female-specific physiology; the book is written
  for a lay athletic readership but argues from named primary studies throughout,
  which is why `quality: high` rather than the `moderate` given to the Martinoli
  training manual. It is still a trade book, not a guideline: claims taken from it
  are tiered on the strength of the study each one cites, not on the book''s say-so.

  EXACTLY WHAT WAS READ, because it governs which entries are safe to trust. Read in
  full: chapter 5 (Kick Up Your Cardio — the SIT case and the four named interval
  protocols), chapter 6 (Now''s the Time to Lift Heavy Sh*t — the heavy-lifting
  prescription, the build-up schedule, the warm-up, the pelvic-floor "canister"
  box, and the LHS staple lifts), chapter 7 (Get a Jump on Menopausal Strength
  Losses — the whole plyometric progression from squat jump to depth jump, with its
  three circuits), chapter 16 (Keep Your Skeleton Strong — bone-loss rates, DEXA
  thresholds, LiftMOR, and what osteoporosis rules out), chapter 19 (Pulling It All
  Together — the two named weekly scheduling schemes). Chapter 14 (Stability,
  Mobility, and Core Strength) was read for its exercise list and stability
  rationale; its foam-rolling sequence was noted but not ingested.

  NOT READ, deliberately: chapters 8-13 and 18 (gut health, eating, nutrition
  timing, hydration, sleep, supplements) and chapters 1-4 and 15 (the menopause
  physiology primer, hormone therapy, and the mental-game chapter). Those are
  nutrition, supplement and hormone territory where this catalogue already has
  deeper, better-cited sources, and ingesting a trade book''s version alongside them
  would create competing claims for no gain. No exercise entry depends on an unread
  page.

  WHY THIS BOOK. The roster is mostly women aged 40-55; every movement source on
  disk before this one was either a falls-prevention manual for the over-75s or a
  general-fitness book written for people with no medical issues. Neither speaks to
  the population this practice actually serves. Sims is the first source here that
  argues specifically about what the menopause transition does to muscle, bone and
  power, and what training answers it.

  WHERE IT DISAGREES WITH THE CATALOGUE, and the catalogue wins on purpose: Sims
  presents the squat jump as the SIMPLEST plyometric to start with (8-10 reps) and
  puts jumping jacks, side hops and skipping in her BEGINNER circuit. This catalogue
  rates squat-jumps `advanced` and blocks it for knee pain. Both are right for their
  own readers — hers are active women who already train, ours include ten of sixteen
  clients with tagged body pain. The disagreement is recorded in each affected
  entry''s notes_for_coach rather than silently resolved.

  A NOTE ON LIFTMOR. Sims describes the LiftMOR trial as 2017 in the Journal of Bone
  and Mineral Research; the catalogue already holds it as `liftmor-watson-2018`
  (online-first 2017, print 2018). Claims drawn from her account of it cite the
  EXISTING record, not a second one — see docs/EXERCISE_SOURCE_IDS.md.'
