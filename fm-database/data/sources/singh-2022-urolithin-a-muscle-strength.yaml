id: singh-2022-urolithin-a-muscle-strength
title: 'Urolithin A improves muscle strength, exercise performance, and biomarkers
  of mitochondrial health in a randomized trial in middle-aged adults'
source_type: peer_reviewed_paper
quality: high
authors:
- A. Singh
- D. D'Amico
- P. A. Andreux
- et al.
year: 2022
publisher: Cell Reports Medicine 3(5), 100633
doi: 10.1016/j.xcrm.2022.100633
notes: 'Single-centre, randomised, double-blind, placebo-controlled trial
  (NCT03464500). n=88 untrained, OVERWEIGHT middle-aged adults — placebo 29, 500 mg
  29, 1000 mg 30 — for 4 months. Reported ~12% improvement in muscle strength.
  Detail the vendor slide omitted: the cohort was overweight and untrained, and
  gains in aerobic endurance (peak VO2) and the 6-minute walk test were described as
  clinically meaningful rather than statistically significant — a distinction that
  matters when quoting this to a client. Title, n, registration and DOI verified
  against the publisher record. Manufacturer-funded.'
