notes: |
  10,724 Korean health check-up subjects. HSI = 8 x (ALT/AST) + BMI, plus 2
  if female and plus 2 if diabetic. Below 30 ruled fatty liver out
  (sensitivity 93%); above 36 detected it (specificity 92%). Read from the
  PubMed abstract (17 Nov 2026).
