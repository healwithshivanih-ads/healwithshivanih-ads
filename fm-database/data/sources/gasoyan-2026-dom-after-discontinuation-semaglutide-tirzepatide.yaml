notes: 'PMID 41816857. Read in FULL TEXT on 2026-10-07. Retrospective cohort from electronic
  health records (Ohio + Florida), 7938 adults who started injectable semaglutide or tirzepatide
  2021-2023 and stopped within 3-12 months. Observational: no control arm, people who stopped
  early and at sub-therapeutic doses, and wide individual variation. The authors'' own reading
  is that restarting or switching treatment ''may have contributed'' to the small mean regain
  - it is not proof.'
