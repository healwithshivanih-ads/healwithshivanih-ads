notes: UK Biobank, >300,000 participants; multistate models + Mendelian randomisation. Remnant cholesterol and triglycerides
  associated (observationally and genetically) with higher risk of cardiometabolic multimorbidity, especially progression
  from ischaemic heart disease to IHD plus type 2 diabetes. Read 1 Oct 2026 from the abstract/summary.
