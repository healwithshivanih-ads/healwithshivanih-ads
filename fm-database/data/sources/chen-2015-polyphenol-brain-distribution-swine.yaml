notes: |
  The study that answers "does grape seed extract cross the blood-brain barrier?"
  properly, in a large-animal model whose neuroanatomy and gut physiology are far
  closer to human than a rodent's.

  Weanling pigs dosed 3 weeks with an apple/grape seed extract mixture or bilberry
  extract; plasma, urine and REGIONAL BRAIN extracts analysed by LC-MS/MS.

  What was found in brain tissue: monomeric flavan-3-ol and flavonol METABOLITES —
  catechin-O-beta-glucuronide, epicatechin-O-beta-glucuronide, the 3'-O-methyl
  forms of each, quercetin-O-beta-glucuronide and O-methyl-quercetin-O-beta-
  glucuronide.

  What was NOT found: intact oligomeric procyanidins. This is the crux. An OPC
  product is sold on its OLIGOMER content (dimers and larger, "95% OPCs"), and
  those are poorly absorbed — rodent tracer work recovers 88-94% of administered
  proanthocyanidins in the GI tract and faeces. The molecules that reach brain
  tissue are the small monomer conjugates, in low concentrations.

  So the popular claim "proanthocyanidins cross the blood-brain barrier" is not
  flatly false, but it is not what it sounds like: the thing on the label is not
  the thing in the brain. Reviews now propose gut-microbiota, enteric-nervous-
  system and vagal routes to explain OPC extra-digestive effects precisely because
  liver-derived OPC metabolites do not cross.

  Compound list and design captured from the abstract and publisher record; Wiley
  full text was 403 through this container, so per-region brain CONCENTRATIONS are
  not held here and must not be quoted.
