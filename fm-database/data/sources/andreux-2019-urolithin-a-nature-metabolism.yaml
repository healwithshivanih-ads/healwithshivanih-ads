id: andreux-2019-urolithin-a-nature-metabolism
title: The mitophagy activator urolithin A is safe and induces a molecular signature
  of improved mitochondrial and cellular health in humans
source_type: peer_reviewed_paper
quality: high
authors:
- P. A. Andreux
- W. Blanco-Bose
- D. Ryu
- et al.
year: 2019
publisher: Nature Metabolism 1, 595-603
doi: 10.1038/s42255-019-0073-4
notes: 'First-in-human trial in healthy sedentary elderly adults; single dose or 4
  weeks of repeat dosing. THE PRIMARY OUTCOME WAS SAFETY, not performance — efficacy
  readouts (plasma acylcarnitines, skeletal-muscle mitochondrial gene expression at
  500 mg and 1000 mg) were secondary. The vendor slide presents its gene heatmap as
  "improves mitochondrial health in skeletal muscle", which is a molecular signature
  and not a functional or clinical outcome; do not let it be read as a strength
  result. Title and DOI verified against the publisher record; the trial was
  manufacturer-funded.'
