notes: PMID 40673264. Read in FULL TEXT on 2026-10-07. Expert advisory (narrative, not a systematic
  guideline) from four US societies. Its lean-mass figures summarise the STEP 1 DXA substudy
  (Wilding et al., NEJM 2021) and modelling data; the protein targets are described as 'proposed',
  and the paper says it is unclear which body weight to base them on in people with obesity.
