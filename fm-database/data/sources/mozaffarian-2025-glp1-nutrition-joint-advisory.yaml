notes: 'Read 7 Oct 2026 from PMC full text (PMC12264624). Section 4.6: protein targets of 1.2-1.6 g/kg/day "have
  been proposed" during active weight reduction; basis (actual vs adjusted weight) unclear; absolute 80-120 g/day
  alternative; strength training at least 3x/week + 150 min moderate aerobic; protein alone likely inadequate without
  strength training. Section 2.4: STEP 1 lean mass 38% of loss, ~20% muscle; muscle 10-15% (women) / 20-25% (men)
  of loss without strength training. Section 7.3: build lifestyle practices before and during therapy to maintain
  them if the drug stops.'
