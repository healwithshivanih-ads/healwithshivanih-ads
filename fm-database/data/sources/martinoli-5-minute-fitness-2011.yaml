notes: 'Trade paperback, first published 2011, ISBN 978-1-84358-383-7 (PDF ISBN 978-1-84358-665-4).
  Written by a personal trainer for a general fitness readership; not peer-reviewed and
  not a clinical guideline. `quality: moderate` reflects that the MOVEMENT INSTRUCTION is
  competent, conventional and internally consistent, while the PHYSIOLOGY claims are
  uncited popular-science — see REJECTED below.

  EXACTLY WHAT WAS READ — 136 of 247 PDF pages, and the gaps are stated because they
  matter for which entries are safe to trust. Chapter 1 (mini-workout, GPP, bodyweight
  circuits, HIIT/Tabata) in full; Chapter 2 (five fitness components, energy systems,
  MHR zones, Fox and Haskell chart, RPE/Borg CR10, strength-endurance continuum,
  plyometrics, isometrics, the core, motor fitness) in full; Chapter 3 (warm-up,
  mobilising and pulse raise, prep-stretch debate, cool down, maintenance vs
  developmental stretches) in full; and the Chapter 4 exercise index across pp 57-142 —
  the press-up ladder, the dip ladder, the squat family, lunges, calf raises, the
  isometric holds, and the whole core section including the crunch family, the dorsal
  raise and superman, the floor bridge and the plank family.

  NOT READ, deliberately: pp 143-183, which is the plyometric and burpee material
  (sampled only — it is excluded from this catalogue wholesale, see below), and
  pp 184-243, the Level 1/2/3 mini-workout prescriptions. Those sixty pages are session
  PROGRAMMES, and an Exercise entry is one movement — assembling a week is the plan''s
  job, so they are out of scope for this entity rather than skipped for convenience.
  Small gaps also remain at pp 51-56 and 75-78 (tail of the stretch photographs, part
  of the press-up run). No catalogue entry depends on an unread page.

  A NOTE ON HOW THIS WENT, since it is the kind of thing that repeats: the core section
  was read on a second pass, after the first pass stopped short of it. That first pass
  shipped `abdominal-crunch` — which is blocked for low bone density — without shipping
  either `forearm-plank` or `floor-bridge`, the two spine-neutral movements that are the
  correct substitutes. The catalogue was briefly in the state of naming the forbidden
  exercise and not the permitted one. Read the whole of a section before shipping any
  entry that screens against the rest of it.

  WHY THIS BOOK, GIVEN THE POPULATION MISMATCH: the book states outright that it is for
  people "free of injury or biomechanical limitations and have no underlying medical
  issues", and that mini-workouts are "not suitable for the complete beginner, unfit or
  sedentary person". That is the OPPOSITE of this practice''s roster. It was ingested
  anyway for one specific reason: every strength and balance chain in this catalogue
  came from the Otago falls-prevention manual and DEAD-ENDS at beginner level, so a
  45-year-old who outgrows chair sit-to-stand had nowhere to go. This book supplies the
  equipment-free, home-doable rungs above that — and only those rungs were taken.

  WHAT WAS DELIBERATELY NOT TAKEN: burpees and all four burpee variants, tuck and long
  jumps, plyometric/clap/chest-slap press-ups, handstand press-ups, pistol squats,
  one-handed press-ups, and the Tabata and HIIT protocols themselves. The book gates
  several of these itself ("should not be attempted if you are a beginner ... Level 3
  exercise only"). They are high-impact or near-maximal work aimed at a conditioned
  population; nothing on the current roster is a candidate and shipping them would put
  them one matcher bug away from a client.


  COVERAGE EXTENDED 2026-08-05 (coach decision — weight-loss cohort incoming): pp 143-183
  (the plyometric section) and pp 184-243 (the Level 1/2/3 mini-workout programmes) are now
  READ IN FULL. From the plyometric section, the conditioning family was taken with hard
  gates — jumping jacks, high knees, mountain climbers, alternate toe-taps, split jumps,
  ankle jumps, jump squats, and the burpee as ONE four-rung ladder (step-back / non-jump /
  standard / press-up). Tuck jumps, long jumps, clap/chest-slap press-ups and handstand work
  REMAIN excluded — maximal plyometrics with no roster candidate. The programme chapters were
  taken as SESSION STRUCTURE (formats, work:rest, frequency and progression rules), not as
  entries — see data/_exercise_programmes.yaml. Still unread: pp 51-56 and 75-78, photo
  runs whose movements are already fully covered by the surrounding text; left deliberately.

  REJECTED CLAIMS — recorded so nobody re-ingests them later thinking they were missed:
  (1) "high-intensity exercise produces up to nine times more fat-loss benefit for every
  calorie burned than low-intensity" — no citation given, and implausible as stated;
  (2) "your body continues to burn calories for up to two days" after a four-minute
  bout — an overstatement of EPOC, uncited; (3) the 28% anaerobic-capacity improvement
  attributed to Tabata''s group — this traces to a real 1996 study that was NOT read
  here, so it is not asserted by any catalogue entry. The RPE material does cite Borg
  1970 (Scand J Rehabil Med 2(2), 92-98) properly, which is why the RPE claim was kept.

  USEFUL AND KEPT: the press-up progression ladder (wall to kneeling to extended
  kneeling to splayed to standard to one-handed) and its underlying principle, that with
  bodyweight you cannot change the resistance so you change the leverage; the squat and
  dip families; Borg CR10 as an equipment-free intensity gauge with RPE 3-7 mapping to
  roughly 50-90% of maximum heart rate; the mobilise-and-pulse-raise warm-up sequence;
  maintenance (15-20s) versus developmental (25-30s) stretch holds; and the isometrics
  warning, which is the one genuinely safety-relevant thing this book says that the
  Otago manual does not: isometric holds "should be avoided by anyone with high blood
  pressure".

  All movement cues in catalogue entries derived from this book are REWRITTEN. The text
  is in copyright and the exercise photographs are separately copyright Michele
  Martinoli; no image was reproduced and no instruction was copied verbatim.

  '
