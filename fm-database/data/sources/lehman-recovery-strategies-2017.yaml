notes: 'A 71-page free workbook by a clinician who is a physiotherapist, chiropractor and
  kinesiologist, written to be handed to a patient in pain and worked through with a
  therapist. Its own framing is that it is "a compilation, a re-organizing and a particular
  presentation of the science to date" of the biopsychosocial model rather than new work —
  so it is `quality: moderate` and its claims are tiered on the primary study each one
  names, never on the workbook''s say-so.

  EXACTLY WHAT WAS READ. Section I, Pain Principles, in full (pp 5-17: pain defined,
  nociception, spinal-cord modulation, the brain''s threat appraisal, learned pain,
  sensitization, habituation, cortical reorganization). Section II, Key Messages, in full
  (pp 18-28 — the ten client-facing messages, and the section carrying the three imaging
  statistics with their named primary sources). NOT read page by page: Section III, Pain
  Contributors (pp 29-46) and Section IV, Recovery Strategy (pp 47-71), whose structure is
  known from the contents page but whose individual pages were not ingested. No claim below
  depends on an unread page.

  WHY THIS BOOK, for a catalogue about exercise. Ten of sixteen clients carry tagged body
  pain, and the exercise screen reads `pain_locations` on almost every client. Everything
  the catalogue held about pain until now was either a caution telling the coach to keep a
  movement away from a painful joint, or a topic about an inflammatory disease. Nothing
  told her what to SAY to a client who believes their scan means they are damaged and
  should stop moving — which is the belief that most often stops an exercise plan being
  started at all. This is the first source here that addresses that directly.

  A CAVEAT THAT GOVERNS THE STATISTICS. The three imaging figures on p 19 are quoted by
  Lehman with author-year attributions (Rajaswaran 2014, Brinjikji 2015, Tresch 2016). The
  primary papers were NOT read. Each claim records this in its caveats; re-tier if anyone
  reads the originals.

  SCOPE. This is education for a coach and her clients, not diagnosis. The workbook opens
  with its own warning that pain is very rarely a sign of tumour, infection or other serious
  disease and that a health care provider should screen for it. That screening is out of
  coaching scope and stays with the clinician — nothing here licenses reassurance in place
  of referral.'
