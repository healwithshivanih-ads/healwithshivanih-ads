title: 'Tirzepatide for maintenance of bodyweight reduction in people with obesity in the
  USA (SURMOUNT-MAINTAIN): a multicentre, double-blind, randomised, placebo-controlled trial'
source_type: peer_reviewed_paper
quality: high
authors:
