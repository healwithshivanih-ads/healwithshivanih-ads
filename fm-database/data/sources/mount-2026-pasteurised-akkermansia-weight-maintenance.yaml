id: mount-2026-pasteurised-akkermansia-weight-maintenance
title: 'Pasteurized Akkermansia muciniphila MucT for weight loss maintenance in people with overweight and obesity: a controlled randomized trial'
source_type: peer_reviewed_paper
quality: high
authors:
