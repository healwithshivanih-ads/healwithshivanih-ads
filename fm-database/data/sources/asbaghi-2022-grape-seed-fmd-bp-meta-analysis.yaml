notes: |
  The most rigorous of the grape seed extract cardiovascular meta-analyses:
  nineteen controlled trials, databases searched to 24 May 2021, with both
  duration- and dose-response modelling.

  The result is a useful corrective. GSE significantly reduced DIASTOLIC blood
  pressure and heart rate, but did NOT significantly change flow-mediated
  dilation (FMD). That matters because FMD is the direct measure of endothelial
  function — the mechanism the whole naturopathic case for GSE rests on. The
  hard endothelial endpoint did not move.

  This is the source to cite when someone claims GSE "improves endothelial
  function". It lowers a blood pressure number; the endothelial claim is
  mechanistically plausible and not demonstrated at this endpoint.

