id: denk-2025-urolithin-a-immune-nature-aging
title: 'Effect of the mitophagy inducer urolithin A on age-related immune decline: a
  randomized, placebo-controlled trial'
source_type: peer_reviewed_paper
quality: moderate
authors:
- D. Denk
- et al.
year: 2025
publisher: Nature Aging
doi: 10.1038/s43587-025-00996-x
notes: 'PHASE 1 randomised, double-blind, placebo-controlled trial. n=50 healthy
  middle-aged adults, 1000 mg/day for 4 weeks. Outcomes are immune-cell markers, not
  clinical infection endpoints — expanded naive-like, less-exhausted CD8+ cells
  (treatment difference 0.50 pp, 95% CI 0.16-0.83, P=0.0437) and increased CD8+
  fatty-acid-oxidation capacity (14.72 pp, 95% CI 6.46-22.99, P=0.0061). Quality is
  moderate, not high, because this is a small phase 1 marker study and the headline
  CD8+ result sits just under P=0.05. The vendor slide bills it as "revitalized
  immune system", which overstates a 4-week phase 1 biomarker trial. Title, phase, n
  and DOI verified against the publisher record. Manufacturer-funded.'
