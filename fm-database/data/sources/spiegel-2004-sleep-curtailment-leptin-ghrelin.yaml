id: spiegel-2004-sleep-curtailment-leptin-ghrelin
title: 'Brief communication: Sleep curtailment in healthy young men is associated with decreased leptin levels,
  elevated ghrelin levels, and increased hunger and appetite'
source_type: peer_reviewed_paper
quality: moderate
authors:
- Spiegel K
- Tasali E
- Penev P
- Van Cauter E
year: 2004
publisher: Annals of Internal Medicine 141(11):846-850
url: https://pubmed.ncbi.nlm.nih.gov/15583226/
doi: 10.7326/0003-4819-141-11-200412070-00008
notes: 'Randomised crossover, 12 healthy young men, 2 nights of restricted vs extended sleep: leptin -18%, ghrelin
  +28%, hunger +24%, appetite for calorie-dense high-carb foods +33-45%. Small, men only, no energy-expenditure
  measure; later replications mixed. Read 7 Oct 2026 from the PubMed abstract.'
