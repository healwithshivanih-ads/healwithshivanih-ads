id: pettersson-2008-weightlifting-raises-liver-tests
title: Muscular exercise can cause highly pathological liver function tests in healthy men
source_type: peer_reviewed_paper
quality: moderate
authors:
  - Pettersson J
  - Hindorf U
  - Persson P
  - Ekelund M
year: 2008
publisher: Br J Clin Pharmacol 65(2):253-259
url: https://pubmed.ncbi.nlm.nih.gov/17764474/
doi: 10.1111/j.1365-2125.2007.03001.x
notes: |
  15 healthy men did one hour of weightlifting they were not used to. AST,
  ALT, LD, CK and myoglobin rose significantly and stayed up for at least
  7 days; GGT, ALP and bilirubin stayed normal. Hard exercise should be
  considered as a cause of raised liver tests. Read from the PubMed abstract
  (17 Nov 2026).
