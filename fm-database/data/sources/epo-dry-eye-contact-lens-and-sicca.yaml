id: epo-dry-eye-contact-lens-and-sicca
title: Oral omega-6 essential fatty acid treatment in contact lens associated dry eye,
  and systemic omega-6 treatment of PGE1 tear content in Sjogren's syndrome
source_type: peer_reviewed_paper
quality: low
authors: []
year: 2008
url: https://www.sciencedirect.com/science/article/abs/pii/S1367048408000039
notes: >-
  The more favourable half of the EPO dry-eye picture, and deliberately tiered LOW.

  Orally administered evening primrose oil outperformed olive-oil placebo for dry-eye
  symptoms and comfort in soft contact lens wearers. Separate small work in Sjogren's
  reports changes in PGE1 tear content on systemic omega-6, and a small double-blind
  study of GLA plus linoleic acid suggested symptom improvement in Sjogren's dry eye.

  Small studies, surrogate endpoints, and captured from abstracts. Weigh against
  gla-sjogrens-fatigue-rct, which is larger and negative on a different endpoint. For a
  client already taking omega-3 EPA/DHA, omega-3 has the better dry-eye evidence base
  and adding GLA stacks weaker data on stronger.
