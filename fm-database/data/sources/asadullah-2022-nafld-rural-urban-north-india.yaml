notes: |
  AIIMS / CCDC / PHFI community survey 2017-2019: representative adults aged
  30-60 in urban Delhi (n=828) and rural Ballabhgarh, Haryana (n=832), all
  scanned by ultrasound + FibroScan. Age- and sex-standardised ultrasound NAFLD
  65.7% urban, 61.1% rural. Diabetes, central obesity and insulin resistance
  were the associated factors. Read from the PubMed abstract (30 Sep 2026).
  North India only — do not generalise to "all Indians".
