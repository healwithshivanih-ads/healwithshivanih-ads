id: oil-pulling-salivary-ph-buffering-rct-children
title: 'Effect of Oil Pulling on pH, Buffering Capacity and Total Antioxidant Capacity
  of Saliva in Children: A Randomised Control Study'
source_type: peer_reviewed_paper
quality: moderate
authors: []
publisher: Journal of Clinical and Diagnostic Research
year: 2021
url: https://jcdr.net/article_abstract.asp?id=16487
notes: >-
  80 female children aged 12-14, four weeks, four arms - coconut oil, sesame oil,
  chlorhexidine, plain water.

  Buffering capacity improved significantly versus control for coconut (p=0.0345),
  sesame (p=0.026) and chlorhexidine (p=0.045). Salivary pH ITSELF did not differ
  significantly (p>0.05). Oil pulling matched chlorhexidine on both buffering and
  antioxidant capacity.

  The distinction is the whole point and is routinely lost - buffering capacity is
  saliva's ability to RECOVER from an acid swing, not its resting pH. Oil pulling
  does not alkalise the mouth. Correct the "it alkalises your mouth" claim wherever
  it appears. URL is the journal abstract page; full numeric tables were not
  retrievable.
