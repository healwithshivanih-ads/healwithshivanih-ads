id: mofrad-2003-nafld-normal-alt
title: Clinical and histologic spectrum of nonalcoholic fatty liver disease associated with normal ALT values
source_type: peer_reviewed_paper
quality: moderate
authors:
  - Mofrad P
  - Contos MJ
  - Haque M
  - Sterling RK
  - Sanyal AJ
year: 2003
publisher: Hepatology 37(6):1286-1292
url: https://pubmed.ncbi.nlm.nih.gov/12774006/
doi: 10.1053/jhep.2003.50229
notes: |
  51 biopsy-proven NAFLD patients with normal ALT compared with 50 with raised
  ALT. The whole spectrum of fatty liver, including bridging fibrosis and
  cirrhosis, was seen with a normal ALT; diabetes was the factor that raised
  fibrosis risk. A normal ALT does not rule out fatty liver. Small,
  biopsy-referred sample. Read from the PubMed abstract (17 Nov 2026).
