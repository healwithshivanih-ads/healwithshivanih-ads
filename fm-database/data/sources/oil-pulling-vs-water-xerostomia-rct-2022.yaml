id: oil-pulling-vs-water-xerostomia-rct-2022
title: 'Oil pulling to relieve medication-induced xerostomia: a randomized,
  single-blind, crossover trial'
source_type: peer_reviewed_paper
quality: moderate
authors:
- Ludwar et al.
publisher: Oral Diseases
year: 2022
url: https://onlinelibrary.wiley.com/doi/full/10.1111/odi.13752
notes: >-
  Cold-pressed SUNFLOWER oil versus mineral water, one week each, crossover, in
  moderate medication-induced dry mouth. Oil pulling did relieve the overall
  xerostomic burden - but showed NO difference against water.

  The honest reading is that the relief comes from swishing something for several
  minutes, not from the oil. Authors frame it as a cheap option for SHORT-TERM
  symptom relief and explicitly ask that patients be told the limitations.

  Coaching consequence - never pressure a dry-mouth client through 15 minutes of
  oil they dislike; water is as good on this evidence. Note the sunflower confound
  again (see oil-pulling-oral-microbiome-16s-pilot-2021); a coconut arm has not
  been run in xerostomia.
