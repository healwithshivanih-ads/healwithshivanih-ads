notes: 'Mendelian randomisation in 73,513 Copenhagen adults: a 1 mmol/L (39 mg/dL) genetic rise in non-fasting
  remnant cholesterol carried a 2.8-fold causal risk of ischaemic heart disease, independent of HDL. Remnant
  cholesterol = total cholesterol - HDL - LDL.

