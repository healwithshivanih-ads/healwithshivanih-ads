notes: Chronic kidney disease is defined and staged on BOTH eGFR and albuminuria (urine albumin-to-creatinine ratio).
  People at risk (diabetes, high blood pressure, heart disease) should be tested with both measures. Metadata confirmed
  on PubMed 17 Nov 2026 (PMID 38490803); recommendations as widely reported, full text not re-read here.
