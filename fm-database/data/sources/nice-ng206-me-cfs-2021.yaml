notes: 'Published 29 October 2021, replacing CG53 (2007). THE GUARDRAIL FOR THIS WHOLE
  CATALOGUE.

  WHAT CHANGED: the 2007 guideline recommended graded exercise therapy (GET). NG206
  states that any programme based on fixed incremental increases in physical activity
  or exercise — GET — should NOT be offered as a treatment for ME/CFS. CBT is retained
  only as a supportive intervention, not as a treatment for the illness itself.
  Post-exertional malaise (PEM) is recognised as a cardinal symptom.

  WHY THIS MATTERS HERE: every other source in this catalogue points toward progressive
  loading. For a client with PEM, progression is the harm. This is the one place where
  the correct catalogue entry is a PACING protocol and the correct answer to "what
  exercise should they do" is "not this question yet". The `pacing` modality exists
  because of this guideline, and the PEM screen gates the whole capacity ladder rather
  than adjusting it.

  CONTESTED: the guideline was and remains disputed — several professional bodies
  objected, and a 2022 Lancet commentary argued it was more ideology than science. It
  is followed here anyway, because the asymmetry is decisive: withholding progression
  from someone who could tolerate it costs time, while pushing progression on someone
  with PEM can cause a lasting relapse.

  Captured from the NICE overview and recommendations pages plus secondary summaries;
  the full guideline document has NOT been read end to end.

  '
