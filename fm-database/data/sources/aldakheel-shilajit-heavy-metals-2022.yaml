notes: |
  Elemental analysis (LIBS, ICP-OES/MS, EDX) of commercially sold Indian
  and Pakistani shilajit. Found lead, arsenic, mercury, chromium, nickel
  and other toxic elements at concentrations exceeding permissible limits
  in some samples, with the Indian samples carrying the higher heavy-metal
  load.

  This is the load-bearing safety source for the shilajit entry and the
  reason the catalogue requires a third-party heavy-metal-tested product.
  Directly relevant to an India-based practice: the contaminated samples
  were the ones on the Indian retail market.
