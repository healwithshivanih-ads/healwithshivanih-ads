notes: |
  The original AST/ALT ("De Ritis") ratio paper. Mean ratio 2.85 in alcoholic
  hepatitis and cirrhosis versus 0.74 in viral hepatitis. A ratio above 2 was
  found in 70% of alcoholic liver disease but only 4-8% of viral or chronic
  hepatitis. Old, hospital patients with established disease. Read from the
  PubMed abstract (17 Nov 2026).
