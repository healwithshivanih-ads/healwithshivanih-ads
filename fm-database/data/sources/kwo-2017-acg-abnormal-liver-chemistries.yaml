notes: |
  American College of Gastroenterology guideline. A truly healthy ALT is
  29-33 U/L for men and 19-25 U/L for women; above that should be assessed.
  Hepatocellular pattern = AST/ALT up out of proportion to ALP; cholestatic =
  ALP up out of proportion. Work-up for raised ALT: viral hepatitis, fatty
  liver, alcohol, haemochromatosis, autoimmune hepatitis, Wilson's,
  alpha-1 antitrypsin, plus prescribed and over-the-counter medicines.
  Raised ALT goes with higher liver-related death. Read from the PubMed
  abstract (17 Nov 2026).
