id: bardella-1995-celiac-hypertransaminasemia
title: Prevalence of hypertransaminasemia in adult celiac patients and effect of gluten-free diet
source_type: peer_reviewed_paper
quality: moderate
authors:
  - Bardella MT
  - Fraquelli M
  - Quatrini M
  - Molteni N
  - Bianchi P
  - Conte D
year: 1995
publisher: Hepatology 22(3):833-836
url: https://pubmed.ncbi.nlm.nih.gov/7657290/
notes: |
  158 adults newly diagnosed with coeliac disease in Milan: 42% had raised AST
  and/or ALT. On a strict gluten-free diet the enzymes normalised in 95% of
  them. The few that stayed high had another liver disease (mostly chronic
  hepatitis). Read from the PubMed abstract (17 Nov 2026).
