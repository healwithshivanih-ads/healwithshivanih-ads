notes: Read 1 Oct 2026 from the ACC press release (full guideline not read). Lp(a) 'should be measured at least
  once in adulthood'. ApoB may be used to assess residual risk and guide treatment in cardiovascular-kidney-metabolic
  syndrome, type 2 diabetes, high triglycerides or known CVD once LDL-C and non-HDL-C goals are met. CAC recommended
  for men 40+ and women 45+ at borderline/intermediate 10-year risk when it would change the statin decision. PREVENT-ASCVD
  equations estimate 10- and 30-year risk (ages 30-79). LDL-C/non-HDL-C goals return.
