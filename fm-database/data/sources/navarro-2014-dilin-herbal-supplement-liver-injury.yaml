id: navarro-2014-dilin-herbal-supplement-liver-injury
title: Liver injury from herbals and dietary supplements in the U.S. Drug-Induced Liver Injury Network
source_type: peer_reviewed_paper
quality: high
authors:
  - Navarro VJ
  - Barnhart H
  - Bonkovsky HL
  - Fontana RJ
  - Seeff LB
year: 2014
publisher: Hepatology 60(4):1399-1408
url: https://pubmed.ncbi.nlm.nih.gov/25043597/
doi: 10.1002/hep.27317
notes: |
  839 prospectively enrolled drug-induced liver injury cases at eight US
  centres, 2004-2013. Herbals and dietary supplements caused 15.5% overall,
  rising from 7% to 20% over the period. Non-bodybuilding supplement injury
  (mostly middle-aged women) led to death or transplant more often than
  medicine injury (13% vs 3%). Read from the PubMed abstract (17 Nov 2026).
