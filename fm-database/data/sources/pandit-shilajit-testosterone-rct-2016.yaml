notes: |
  Randomised, double-blind, placebo-controlled trial in healthy male
  volunteers aged 45-55, purified shilajit 250 mg twice daily for 90 days.
  Reported significant increases in total testosterone, free testosterone
  and DHEAS versus placebo.

  CAPTURED FROM THE ABSTRACT ONLY — full text was not read. The trial is
  small, single-centre, industry-adjacent (purified shilajit is a branded
  preparation), and has not been independently replicated in an equivalent
  population. Derived claims are capped at plausible_emerging for that
  reason. Re-tier only if someone reads the primary methods and confirms
  randomisation, blinding and the assay used.
