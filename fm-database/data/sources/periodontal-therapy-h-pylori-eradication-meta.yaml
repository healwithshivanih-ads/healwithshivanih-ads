id: periodontal-therapy-h-pylori-eradication-meta
title: 'Periodontal treatment is associated with improvement in gastric Helicobacter
  pylori eradication: an updated meta-analysis of clinical trials'
source_type: peer_reviewed_paper
quality: moderate
authors:
- Ozturk et al.
publisher: International Dental Journal
year: 2024
url: https://onlinelibrary.wiley.com/doi/10.1111/idj.12616
notes: >-
  The mechanism that makes an oral intervention plausibly upstream of a GASTRIC
  problem, and the best available explanation for coach-observed reflux
  improvement on oil pulling.

  Dental plaque is an established extragastric reservoir for H. pylori and is
  poorly cleared by triple therapy. Triple therapy PLUS periodontal treatment
  achieved 64.7% eradication versus 51.1% for triple therapy alone, and the
  benefit improved further with good ongoing plaque control. A related report puts
  the odds of gastric eradication failure roughly 64-fold higher when H. pylori
  persists in dental plaque.

  Scope note - this is about periodontal TREATMENT (professional scaling), not oil
  pulling. Oil pulling reducing oral load is a reasonable but untested extension.
  Do not tell a client oil pulling treats H. pylori.
