notes: 'FMCA Ask-the-Expert recording, 18 Nov 2025 (~61 min). Dr. Carrie
  Jones (NMD, female-hormone educator) with Rose Mackenzie (clinical manager, Mira
  Health). CONFLICT OF INTEREST: the session is built around Mira, a commercial at-home
  urinary hormone monitor, and most charts are Mira product data — treat device-specific
  performance statements as vendor claims, not independent evidence. The physiology,
  the pattern-interpretation checklists and the cycle-phase metabolic material stand
  on their own and are what has been captured here. The phase-specific diet/workout/brain
  slides are attributed on-slide to Alisa Vitti''s Cycle Syncing Method(R) and Jones
  explicitly disclaimed teaching it herself — those are captured against the existing
  cycle-syncing entries, not as this source''s own findings. Captured from the FMCA
  course mirror by local transcription plus slide OCR; no written transcript was
  provided by FMCA.'
