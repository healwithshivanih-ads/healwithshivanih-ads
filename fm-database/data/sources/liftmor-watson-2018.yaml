notes: 'J Bone Miner Res 2018;33(2):211-220. Author names recorded as published initials
  — not expanded, to avoid inventing first names.

  The trial that reframed loading for low bone mass: 8 months of twice-weekly,
  30-minute SUPERVISED high-intensity resistance and impact training (HiRIT) — 5 sets
  of 5 reps at >85% 1RM — versus a home-based low-intensity control, in postmenopausal
  women with T-score < -1.0. 101 randomised (49 HiRIT / 52 control), 43.6% osteoporotic.

  WHY IT IS IN THIS CATALOGUE: it is the evidence that a woman with osteopenia or
  osteoporosis needs LOADING, not protection — the reflex to prescribe only walking and
  water aerobics is what this trial argues against. It is the counterweight to the
  spinal-flexion contraindications, which restrict HOW to load, not WHETHER.

  HARD LIMIT ON USE: the intervention was supervised, high-intensity, and gym-based
  with a barbell. Nothing in this catalogue reproduces it, and no entry should imply
  it does. Entries citing this source cite it for the PRINCIPLE (progressive load and
  impact are appropriate and were well tolerated in this population) and carry
  refer_out to a supervised programme for the intensity itself.

  Captured from the abstract and the published citation record; the full methods and
  the adverse-event detail have NOT been read. Re-tier if anyone reads the primary
  methods.

