notes: >-
  Survey of retail spirulina supplements and spirulina-containing foods for
  microbiota and cyanotoxin (microcystin) content. Cited as the evidence that the
  contamination concern with spirulina is a real product-quality issue found in
  products actually on sale, not a theoretical one.

  This is WHY the spirulina entry insists on third-party-tested,
  closed-system-cultivated product rather than treating spirulina as a generic
  commodity. Spirulina grown in open ponds can pick up microcystins from
  co-occurring cyanobacteria, and microcystins are hepatotoxic. Heavy metals
  (lead, arsenic, cadmium, mercury) are a separate, parallel concern in
  poorly-sourced product.

  Metadata verified via Crossref 2026-09-21; abstract-level capture. Specific
  prevalence figures were not transcribed and should not be quoted from this
  record.
