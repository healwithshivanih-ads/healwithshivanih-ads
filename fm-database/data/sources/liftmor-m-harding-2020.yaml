notes: 'J Bone Miner Res 2020;35(8):1404-1414. The men''s counterpart to [liftmor-watson-2018],
  comparing high-intensity progressive resistance and impact training (HiRIT) against
  machine-based isometric axial compression (IAC) in middle-aged and older men with
  low areal BMD.

  WHY IT IS HERE: low bone mass is under-screened and under-treated in men, and the
  roster includes men in the 50-60 band. Without this entry the bone-loading rationale
  would read as women-only. HiRIT outperformed both IAC and control on lumbar spine
  and trochanteric BMD, bone quality, lean mass and function.

  SAFETY SIGNAL: five minor adverse events across both intervention arms (2 HiRIT,
  3 IAC), no serious adverse events; compliance ~78% in both. A related analysis in
  this cohort reported no incident or progressed vertebral fracture in HiRIT
  participants — relevant because vertebral fracture is the harm the spinal-flexion
  restrictions exist to prevent.

  Same HARD LIMIT as the women''s trial: supervised, high-intensity, barbell-based.
  Cited here for the principle, never as a protocol to reproduce unsupervised.

  Captured from the abstract and citation record via the publisher page; full methods
  not read.

