notes: >-
  PMID 23905120. Full text read 2026-11-26. An ANIMAL study, and the only published
  efficacy data found for this formulation: 24 male Sprague Dawley rats in 4 groups of 6
  (vehicle, churna 500 mg/kg, churna 750 mg/kg, ranitidine 25 mg/kg), dosed twice daily for
  2 days before Shay's pyloric ligation. Both churna doses reduced gastric volume, ulcer
  score and ulcer length and raised pH, described as comparable to ranitidine; ulcer number
  did not differ between groups and the higher dose did not change acidity. No toxicity
  work was done and the authors did not assess the quality of the churna they tested.

  Used here mainly for its statement of the COMPOSITION: 14 ingredients, each 1 part
  except lavanga (11 parts), trivrit (44 parts) and sugar candy (66 parts), and for the
  therapeutic dose of 3-6 g with water, which it cites to Bhishagratna's Bhaishajyaratnavali
  (2006). The composition sentence itself carries no citation in the paper. No published
  human efficacy trial was found on 2026-11-26; three CTRI registrations exist (2020, 2024,
  2025) with no results.
