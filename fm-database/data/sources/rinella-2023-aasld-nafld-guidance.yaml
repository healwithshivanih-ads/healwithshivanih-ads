notes: |
  American Association for the Study of Liver Diseases guidance on fatty
  liver. Uses FIB-4 as the first-line risk check in primary care (below 1.3 =
  low risk of advanced fibrosis; higher = elastography or specialist). PubMed
  carries no abstract; the 1.3 cut-off is from the guidance itself and should
  be checked against the full text (PMC10735173) before quoting it to anyone
  outside the coaching team.
