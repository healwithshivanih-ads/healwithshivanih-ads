id: joshee-2019-indian-snacks-fatty-acid-profile
title: Fatty acid profiling of 75 Indian snack samples highlights overall low trans fatty acid content with high polyunsaturated fatty acid content in some samples
source_type: peer_reviewed_paper
quality: moderate
authors:
- Joshee K
- Abhang T
- Kulkarni R
year: 2019
publisher: PLOS ONE 14(12)
url: https://journals.plos.org/plosone/article?id=10.1371%2Fjournal.pone.0225798
doi: 10.1371/journal.pone.0225798
notes: |
  75 Indian snacks in three groups. Trans fat was LOW overall (0.016-4.4% of fatty acids, versus
  0.1-30% in earlier studies) - a real improvement. Bakery products were highest on average
  (3.26%), then perishable deep-fried (1.2%) and non-perishable deep-fried (0.74%). Bakery and
  many packaged items were still high in saturated fat. Read 30 Sep 2026 from the abstract.
  Use it to keep trans-fat messaging honest: packaged snacks are much better than they were.
