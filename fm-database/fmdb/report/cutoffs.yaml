# Cut-offs for the result levels in the body age report.
#
# ONE place for every number. Changing a cut-off is an edit here and nowhere else.
#
# status: provisional  -> the generator builds the TEST profile only and refuses a real buyer.
# status: approved     -> set once Shivani has signed the table off (her decision is recorded in the
#                         design session's notes, rings-report-structure.md).
#
# Source: result-level-cutoffs-proposal.md, proposed by the report design session on 19 Nov 2026.
#
# Levels (what the report prints):
#   A  just outside, or middle zone   no doctor wording
#   B  clearly raised or clearly low  "worth mentioning at your next routine check-up"
#   C  far out                        "needs a doctor's attention as well"
#   D  urgent                         never printed; the coach is told the day results are loaded
#
# How a row is read:
#   high:      value AT OR ABOVE the number reaches that level   (">155" means strictly above)
#   low:       value BELOW the number reaches that level         ("<=3" means at or below)
#   high_x:    the same, on value / top of the laboratory's range   (1.5 = one and a half times the limit)
#   high_pct:  the same, on per cent above the top of the laboratory's range
#   A row split into M / F is read for the buyer's sex.
#   A result outside its laboratory range that reaches no level here is level A.
status: provisional
source: "result-level-cutoffs-proposal.md (design session, 19 Nov 2026)"

# Any marker with no row below: per cent beyond the laboratory's range.
fallback_pct: {A: ">0", B: 15, C: ">50"}

# Never print a doctor line on their own: the level stops at A.
cap_at_A: [insulin, apoa1, homa, tyg, hsi, apob_apoa1, remnant, tg_hdl, nlr]

markers:
  # sugar
  hba1c:      {high: {A: 5.7, B: 6.0, C: 6.5, D: 10}}
  glucose:    {high: {A: 100, B: 110, C: 126, D: 300}, low: {C: 60, D: 50}}
  # heart and arteries
  ldl:        {high: {A: 100, B: 130, C: 190}}
  non_hdl:    {high: {A: 130, B: 160, C: 220}}
  apob:       {high: {A: 100, B: 130, C: 160}}
  tg:         {high: {A: 150, B: 200, C: 500, D: 1000}}
  hdl:        {low: {M: {A: 40, B: 35}, F: {A: 50, B: 45}}}
  lpa:        {high: {A: 30, B: 50, C: 90}}
  hscrp:      {high: {A: 1.0, B: ">3.0", C: 10}}
  hcy:        {high: {A: 15, B: 17, C: 30}}
  # thyroid (free T4 / free T3 outside range: B with a normal TSH, C with an abnormal one; that rule is in code)
  tsh:        {high: {A: 4.5, B: 6.0, C: 7.0, D: 50}, low: {A: 0.40, B: 0.30, C: 0.10}}
  # kidneys and salts
  creatinine: {high_pct: {A: ">0", B: ">10", C: ">50", D: 100}}
  potassium:  {high: {B: ">5.0", C: ">5.5", D: 6.0}, low: {B: 3.5, C: 3.0, D: 2.5}}
  sodium:     {high: {B: ">145", C: ">150", D: ">155"}, low: {B: 135, C: 130, D: 125}}
  calcium:    {high: {B: 10.3, C: 11.5, D: 13}, low: {B: 8.5, C: 8.0}}
  # liver
  alt:        {high_x: {A: ">1", B: 1.5, C: ">3", D: ">10"}}
  ast:        {high_x: {A: ">1", B: 1.5, C: ">3", D: ">10"}}
  ggt:        {high_x: {A: ">1", B: 2, C: ">5"}}
  alp:        {high_x: {A: ">1", B: 2, C: ">5"}}
  bilirubin:  {high_x: {A: ">1", B: 1.5, C: ">3"}}
  fib4:       {high: {A: 1.3, C: ">2.67"}}
  # blood count
  hb:         {low: {M: {A: 13.5, B: 13.0, C: 11.0, D: 8.0}, F: {A: 12.5, B: 12.0, C: 11.0, D: 8.0}}}
  wbc:        {high: {B: ">11000", C: ">15000", D: ">30000"}, low: {B: 4000, C: 3000, D: 1500}}
  platelets:  {high: {B: ">450", C: ">600"}, low: {B: 150, C: 100, D: 50}}
  # deeper report only
  vitd:       {low: {A: 30, B: 20, C: 12}, high: {B: ">100", C: ">150"}}
  b12:        {low: {A: 300, B: 200, C: 150}}
  tsat:       {low: {B: 16}, high: {B: ">50", C: ">60"}}
  lead:       {high: {B: 5.0, C: 10, D: 45}}
  mercury:    {high_x: {B: ">1", C: ">2"}}
  arsenic:    {high_x: {B: ">1", C: ">2"}}
  cadmium:    {high_x: {B: ">1", C: ">2"}}
